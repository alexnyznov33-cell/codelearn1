  - title: Deep sleep и таймер пробуждения
    minutes: 25
    xp: 30
    theory: |
      ## Экономия энергии
      Deep sleep выключает основную работу CPU и большую часть периферии. После пробуждения программа снова выполняет setup: это не продолжение инструкции после sleep. Обычные переменные не сохраняются, но `RTC_DATA_ATTR` хранит данные в RTC-памяти между deep-sleep пробуждениями, пока сохранено её питание. После полного обесточивания значение снова инициализируется.

      `esp_sleep_enable_timer_wakeup()` принимает **микросекунды**. `10ULL * 1000000ULL` задаёт 10 секунд с 64-битным вычислением. `esp_deep_sleep_start()` переводит чип в сон. `Serial.flush()` дожидается отправки вывода перед сном.

      DevKit может потреблять заметно больше самого чипа из-за USB-UART, стабилизатора и LED. Сон не делает питание платы автоматически экономичным; измеряйте ток подходящим прибором. В этом уроке используем таймер, не внешние wake-up пины, ограничения которых зависят от модели.

      ## Пример

      ```cpp
      #include <esp_sleep.h>
      RTC_DATA_ATTR unsigned int bootCount = 0;
      void setup() {
        Serial.begin(115200);
        bootCount++;
        Serial.print("Wake #");
        Serial.println(bootCount);
        Serial.flush();
        esp_sleep_enable_timer_wakeup(10ULL * 1000000ULL);
        esp_deep_sleep_start();
      }
      void loop() {}
      ```

      ## Как практиковаться

