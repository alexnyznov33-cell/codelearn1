  - title: 'BLE: сервис и характеристика'
    minutes: 25
    xp: 30
    theory: |
      ## Не путать BLE и Bluetooth Classic
      Bluetooth Low Energy организован вокруг GATT: сервис содержит характеристики, каждая имеет UUID и свойства read/write/notify. В этом уроке используется BLE из пакета Arduino-ESP32 для **классического ESP32**, без сторонней NimBLE-библиотеки.

      Создаём характеристику только для чтения с текстом `Hello BLE`. Реклама (advertising) позволяет телефону обнаружить устройство; чтение выполняет BLE-клиент (например, мобильный GATT-инструмент). UUID примера учебные: для собственного продукта назначьте уникальные UUID.

      Пример не задаёт pairing/bonding или защиту доступа. Любой находящийся рядом клиент с доступом к GATT может читать характеристику. Не храните в ней пароли. Notify требует отдельной настройки и подписки клиента; наличие характеристики read не означает автоматическую отправку данных.

      ## Пример

      ```cpp
      #include <BLEDevice.h>
      #include <BLEServer.h>
      #include <BLEUtils.h>
      const char* SERVICE_UUID = "6dca0001-5da0-4df1-a124-601c6b917001";
      const char* VALUE_UUID = "6dca0002-5da0-4df1-a124-601c6b917001";
      void setup() {
        Serial.begin(115200);
        BLEDevice::init("CodeLearn-BLE");
        BLEServer* server = BLEDevice::createServer();
        BLEService* service = server->createService(SERVICE_UUID);
        BLECharacteristic* value = service->createCharacteristic(VALUE_UUID, BLECharacteristic::PROPERTY_READ);
        value->setValue("Hello BLE");
        service->start();
        BLEAdvertising* advertising = BLEDevice::getAdvertising();
        advertising->addServiceUUID(SERVICE_UUID);
        advertising->start();
      }
      void loop() { delay(100); }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
