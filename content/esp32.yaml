  title: Хранение, задачи и итоговый проект
  level: Junior+
  lessons:
  - title: 'Preferences: настройки в NVS'
    minutes: 25
    xp: 30
    theory: |
      ## Key-value вместо EEPROM
      ESP32 хранит настройки во flash через NVS. Arduino-библиотека `Preferences` предоставляет namespace и пары ключ/значение. Откройте namespace через `begin("codelearn", false)` (запись разрешена), прочитайте `getUInt(key, default)`, сохраните `putUInt()`, затем вызовите `end()`.

      Namespaces и ключи ограничены по длине (обычно до 15 символов), поэтому используем короткие имена. Проверяйте результат открытия и записи. Значение по умолчанию позволяет запустить устройство при отсутствующем ключе; диапазон всё равно проверяют.

      Flash имеет ограниченный ресурс: сохраняйте по команде или при реальном изменении, не в каждом loop. NVS обеспечивает управление хранением, но не отменяет износ. Preferences не шифрует секреты автоматически: не считать обычное сохранение пароля безопасным хранилищем.

      ## Пример

      ```cpp
      #include <Preferences.h>
      Preferences prefs;
      unsigned int interval = 1000;
      void setup() {
        Serial.begin(115200);
        if (prefs.begin("codelearn", true)) {
          interval = prefs.getUInt("interval", 1000);
          prefs.end();
        }
        if (interval < 100 || interval > 60000) interval = 1000;
        Serial.println(interval);
      }
      void loop() {
        if (Serial.available() > 0 && Serial.read() == 's') {
          if (prefs.begin("codelearn", false)) {
            size_t written = prefs.putUInt("interval", interval);
            prefs.end();
            Serial.println(written > 0 ? "Saved" : "Save failed");
          } else Serial.println("NVS open failed");
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
