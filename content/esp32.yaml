  - title: Локальный веб-сервер
    minutes: 25
    xp: 30
    theory: |
      ## HTTP на ESP32
      Встроенные библиотеки `WiFi.h` и `WebServer.h` позволяют поднять учебный HTTP-сервер. `server.on()` назначает маршрут, `server.begin()` запускает сервер, `handleClient()` обслуживает запросы в loop.

      В примере плата создаёт **собственную точку доступа** `CodeLearn-ESP32`, чтобы не зависеть от домашнего роутера. Подключите телефон/компьютер к ней и откройте IP, который напечатал `softAPIP()`, с префиксом `http://`. Обычно это 192.168.4.1, но используйте фактический адрес. Интернет в такой сети не предоставляется.

      Маршрут `/` возвращает текст. Это **не защищённый сайт**: HTTP не шифруется; WPA-пароль точки доступа не заменяет авторизацию приложения. Смените учебный пароль перед реальным использованием, не открывайте порт в Интернет. Обработчики должны быть короткими, без бесконечных циклов.

      ## Пример

      ```cpp
      #include <WiFi.h>
      #include <WebServer.h>
      WebServer server(80);
      void setup() {
        Serial.begin(115200);
        WiFi.mode(WIFI_AP);
        if (!WiFi.softAP("CodeLearn-ESP32", "learn-esp32")) {
          Serial.println("AP failed");
          return;
        }
        Serial.println(WiFi.softAPIP());
        server.on("/", HTTP_GET, []() {
          server.send(200, "text/plain; charset=utf-8", "Hello, ESP32!");
        });
        server.onNotFound([]() { server.send(404, "text/plain", "Not found"); });
        server.begin();
      }
      void loop() {
        server.handleClient();
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
