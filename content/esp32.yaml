description: 'Arduino-ESP32 3.x: GPIO, Wi-Fi, BLE, MQTT, энергосбережение и IoT-проект.'
modules:
- id: esp32-m1
  title: Старт и периферия
  level: Junior
  lessons:
  - title: 'ESP32: установка и первый запуск'
    minutes: 25
    xp: 30
    theory: |
      ## Платформа и версия
      Этот курс рассчитан на **классический ESP32 DevKit с модулем ESP32-WROOM-32**, не ESP32-C3/S3. Скетчи используют Arduino framework и **Arduino-ESP32 3.x**. Распиновка, периферия и APIs отличаются между моделями и версиями: примеры нужно адаптировать для других плат.

      В Arduino IDE добавьте официальный индекс Espressif в дополнительные URL менеджера плат: `https://espressif.github.io/arduino-esp32/package_esp32_index.json`. Установите **esp32 by Espressif Systems**, выберите ESP32 Dev Module (для указанной платы) и порт. Используйте USB-кабель с данными. На некоторых платах при начале загрузки нужно удержать BOOT и отпустить после соединения; сначала попробуйте обычную загрузку.

      ## Электробезопасность
      GPIO ESP32 — **3,3 В и не допускают 5 В**. Надпись 5V/VIN означает вход питания платы, а не разрешённое напряжение GPIO. Питайте через USB по документации платы, не подавайте одновременно конфликтующие источники. Все подключения делайте без питания, внешние схемы должны иметь общую землю.

      Serial обычно работает на 115200 бод. Встроенный LED имеется не на каждой плате; стартовый пример не требует светодиода.

      ## Пример

      ```cpp
      void setup() {
        Serial.begin(115200);
        Serial.println("Hello, ESP32!");
      }
      void loop() {}
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
