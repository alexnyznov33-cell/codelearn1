      - Удалить очередь
      answer: 0
      explain: Ожидание блокирует текущую задачу, а не всю систему.
    - type: choice
      q: Что даёт очередь?
      options:
      - Синхронизированную передачу копий данных
      - Автоматическое шифрование
      - Бесконечный объём памяти
      - Увеличение напряжения
      answer: 0
      explain: Размер и длина очереди задаются при создании.
    - type: fill
