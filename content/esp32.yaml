  - title: 'Итоговый проект: Wi-Fi панель светодиода'
    minutes: 40
    xp: 30
    theory: |
      ## Локальная панель управления
      Объединяем точку доступа, HTTP, LEDC и NVS. Внешний LED подключён к GPIO18 через 330 Ом и GND. Страница даёт кнопки ON/OFF; POST `/on` и `/off` меняют состояние. NVS сохраняет только реальные изменения. При старте состояние восстанавливается.

      POST лучше GET для действий, но **сам по себе не обеспечивает безопасность**. Учебный сервер не использует TLS и авторизацию приложения. Он предназначен только для изолированной точки доступа, не для удалённого управления реальной нагрузкой. Замените пароль AP; не используйте моторы или сетевые приборы.

      Проверяем ошибки NVS, настройки PWM и создания AP. Сохранение может не удаться: сообщаем об этом в Serial, LED продолжает работать в RAM. В реальном устройстве нужны журналирование, ограничения запросов и стратегия восстановления. Итог закрепляет основы IoT, не обещает уровень Middle после 12 уроков.

      ## Пример

      ```cpp
      #include <WiFi.h>
      #include <WebServer.h>
      #include <Preferences.h>
      WebServer server(80);
      Preferences prefs;
      const int LED = 18;
      bool enabled = false, pwmReady = false, nvsReady = false;
      void setEnabled(bool value) {
        if (value != enabled) {
          enabled = value;
          if (nvsReady && prefs.putBool("enabled", enabled) == 0) Serial.println("Save failed");
        }
        if (pwmReady) ledcWrite(LED, enabled ? 128 : 0);
      }
      void setup() {
        Serial.begin(115200);
        nvsReady = prefs.begin("lamp", false);
        if (nvsReady) enabled = prefs.getBool("enabled", false);
        else Serial.println("NVS failed");
        pwmReady = ledcAttach(LED, 5000, 8);
        if (!pwmReady) { Serial.println("PWM failed"); return; }
        ledcWrite(LED, enabled ? 128 : 0);
        WiFi.mode(WIFI_AP);
        if (!WiFi.softAP("CodeLearn-Lamp", "learn-lamp")) {
          Serial.println("AP failed");
          return;
        }
        Serial.println(WiFi.softAPIP());
        server.on("/", HTTP_GET, []() {
          server.send(200, "text/html; charset=utf-8",
            "<h1>ESP32 Lamp</h1><form method='post' action='/on'><button>ON</button></form>"
            "<form method='post' action='/off'><button>OFF</button></form>");
        });
        server.on("/on", HTTP_POST, []() {
          setEnabled(true);
          server.sendHeader("Location", "/");
          server.send(303, "text/plain", "");
        });
        server.on("/off", HTTP_POST, []() {
          setEnabled(false);
          server.sendHeader("Location", "/");
          server.send(303, "text/plain", "");
        });
        server.onNotFound([]() { server.send(404, "text/plain", "Not found"); });
        server.begin();
      }
      void loop() {
        server.handleClient();
        delay(1);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
