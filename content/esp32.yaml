- id: esp32-m2
  title: PWM и Wi-Fi
  level: Junior
  lessons:
  - title: 'LEDC: PWM в Arduino-ESP32 3.x'
    minutes: 25
    xp: 30
    theory: |
      ## Новый API LEDC
      В Arduino-ESP32 **3.x** используйте `ledcAttach(pin, frequency, resolution)` и `ledcWrite(pin, duty)`. Старые руководства с `ledcSetup()` и `ledcAttachPin()` для 2.x нельзя механически копировать: API изменился.

      Для GPIO18 задаём 5000 Гц и 8 бит: duty 0…255. Подключение — GPIO18 → 330 Ом → LED → GND. `ledcAttach()` возвращает bool, поэтому проверяем успех настройки. Частота и разрешение совместно ограничены аппаратным таймером; произвольное сочетание не всегда допустимо.

      PWM меняет долю импульсов, а не выдаёт истинный аналоговый сигнал. Если настройка не удалась, не продолжаем управление. В примере яркость 128 — около половины диапазона, но воспринимаемая глазом яркость нелинейна.

      ## Пример

      ```cpp
      const int LED = 18;
      bool pwmReady = false;
      void setup() {
        Serial.begin(115200);
        pwmReady = ledcAttach(LED, 5000, 8);
        if (!pwmReady) Serial.println("PWM setup failed");
      }
      void loop() {
        if (pwmReady) ledcWrite(LED, 128);
        delay(10);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Первый аргумент ledcWrite в используемом API 3.x?
      options:
      - Номер GPIO
      - Номер канала из старого API
      - SSID
      - Напряжение
      answer: 0
      explain: В этом pin-based API duty записывается по пину.
    - type: choice
      q: Максимальная скважность для 8 бит?
      options:
      - '255'
      - '4095'
      - '1023'
      - '8'
      answer: 0
      explain: 2^8 - 1 = 255.
    - type: fill
      q: Подключите PWM в API 3.x.
      code: |
        bool ok = ___(18, 5000, 8);
      answers:
      - ledcAttach
      explain: Возвращаемое bool позволяет обработать ошибку.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        int duty = 255 / 2;
        Serial.println(duty);
      answer: '127'
      explain: Целочисленное деление отбрасывает дробную часть.
    - type: bug
      q: Найдите старый API, отсутствующий в ядре 3.x.
      code: |
        void setup() {
          ledcSetup(0, 5000, 8);
        }
      bugLine: 2
      fix: '  ledcAttach(18, 5000, 8);'
      explain: В 3.x настройка привязана к пину через ledcAttach.
    homework:
      task: 'Настройте LEDC на GPIO18: 5 кГц, 8 бит. Проверьте значения 0, 128 и 255 по очереди. Используйте ядро
        3.x.'
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
      - Перед изменением проводов отключите питание. Сначала проверьте скетч кнопкой «Проверить» в Arduino IDE.
      checklist:
      - Могу объяснить назначение setup() и loop() в этом скетче.
      - Скетч скомпилирован для указанной платы; на оборудовании проверено поведение, если плата доступна.
      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
        const int LED = 18;
        bool pwmReady = false;
        void setup() {
          Serial.begin(115200);
