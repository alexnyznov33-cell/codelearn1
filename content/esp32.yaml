    id: esp32-01-01
  - title: 'GPIO: выходы, входы и ограничения'
    minutes: 25
    xp: 30
    theory: |
      ## Не все GPIO одинаковы
      На классическом ESP32 GPIO34…39 — **только входы**, без внутренних подтяжек. GPIO6…11 обычно подключены к flash и не предназначены для ваших схем. Загрузочные (strapping) пины требуют осторожности; проверьте схему конкретной платы. Номера в скетче — номера GPIO, не порядковые номера контактов.

      Для примера используем LED: GPIO18 → резистор 330 Ом → LED → GND; кнопка: GPIO19 → кнопка → GND. GPIO19 поддерживает INPUT_PULLUP, нажатие читается как LOW. Этот пример для ESP32-WROOM-32: на других семействах назначение пинов может отличаться.

      Земли внешних источников сигналов должны быть соединены, уровни — 3,3 В. GPIO не питают моторы и мощные нагрузки. Кнопка может дребезжать: здесь отображаем уровень, для событий применяйте фильтр времени.

      ## Пример

      ```cpp
      const int LED = 18, BUTTON = 19;
      void setup() {
        pinMode(LED, OUTPUT);
        pinMode(BUTTON, INPUT_PULLUP);
      }
      void loop() {
        digitalWrite(LED, digitalRead(BUTTON) == LOW ? HIGH : LOW);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Можно ли использовать GPIO34 как выход на классическом ESP32?
      options:
      - Нет, только вход
      - Да, для любого мотора
      - Да, он выдерживает 12 В
      - Только с analogWrite
      answer: 0
      explain: GPIO34…39 являются входными пинами.
    - type: choice
      q: Почему не берём GPIO6…11 на ESP32-WROOM-32?
      options:
      - Обычно заняты подключением flash
