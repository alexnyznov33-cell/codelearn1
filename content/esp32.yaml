  - title: 'FreeRTOS: задачи и очередь'
    minutes: 25
    xp: 30
    theory: |
      ## Параллельная работа
      Arduino-ESP32 работает поверх FreeRTOS. Задача — функция с бесконечным циклом и собственным стеком. `vTaskDelay(pdMS_TO_TICKS(ms))` уступает процессор; бесконечный цикл без ожидания способен нагрузить CPU и вызвать watchdog.

      Для передачи данных используем **очередь**, а не общую переменную без синхронизации. Producer отправляет возрастающий счётчик, loop читает его. `xQueueCreate()` и `xTaskCreate()` могут завершиться ошибкой, проверяйте результат. В порте ESP-IDF параметр размера стека задачи задаётся в байтах (не переносите это предположение на каждый порт FreeRTOS).

      Не полагайтесь на наличие двух ядер во всех ESP32: C3, например, другой. Пример не закрепляет задачу за ядром. Не делайте вывод о гарантированном порядке Serial-сообщений между задачами: планировщик определяет их выполнение. Очередь копирует заданное число байтов.

      ## Пример

      ```cpp
      #include <freertos/FreeRTOS.h>
      #include <freertos/task.h>
      #include <freertos/queue.h>
      QueueHandle_t samples = nullptr;
      void producer(void*) {
        uint32_t value = 0;
        for (;;) {
          value++;
          xQueueSend(samples, &value, pdMS_TO_TICKS(100));
          vTaskDelay(pdMS_TO_TICKS(1000));
        }
      }
      void setup() {
        Serial.begin(115200);
        samples = xQueueCreate(4, sizeof(uint32_t));
        if (!samples) { Serial.println("Queue failed"); return; }
        if (xTaskCreate(producer, "producer", 2048, nullptr, 1, nullptr) != pdPASS) {
          Serial.println("Task failed");
          vQueueDelete(samples);
          samples = nullptr;
        }
      }
      void loop() {
        uint32_t value;
        if (samples && xQueueReceive(samples, &value, pdMS_TO_TICKS(100)) == pdTRUE) {
          Serial.println(value);
        }
        delay(10);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
