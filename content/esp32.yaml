          delay(10);
        }
    id: esp32-02-01
  - title: 'Wi-Fi: подключение с тайм-аутом'
    minutes: 25
    xp: 30
    theory: |
      ## Режим станции
      Классический ESP32 поддерживает Wi-Fi 2,4 ГГц, не 5 ГГц. `WIFI_STA` подключает устройство к существующей сети. `WiFi.begin(ssid, password)` начинает соединение; статус становится `WL_CONNECTED`, когда подключение завершено.

      Не ждите бесконечно в setup: в примере максимум 10 секунд, затем сообщаем об ошибке. Короткий `delay(100)` в начальном ожидании допустим, но это ещё не полноценный неблокирующий менеджер Wi-Fi. Для рабочего продукта нужны повторное подключение и обработка потери связи.

      Подставьте свои данные **локально**, не публикуйте пароль в репозитории или скриншотах. `localIP()` — адрес в вашей локальной сети, не публичный адрес. Клиентская изоляция роутера может мешать доступу между устройствами.

      ## Пример

      ```cpp
      #include <WiFi.h>
      const char* SSID = "YOUR_SSID";
      const char* PASSWORD = "YOUR_PASSWORD";
      void setup() {
        Serial.begin(115200);
        WiFi.mode(WIFI_STA);
        WiFi.begin(SSID, PASSWORD);
        unsigned long start = millis();
        while (WiFi.status() != WL_CONNECTED && millis() - start < 10000) {
          delay(100);
        }
        if (WiFi.status() == WL_CONNECTED) Serial.println(WiFi.localIP());
        else Serial.println("Wi-Fi timeout");
      }
      void loop() {}
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Какую сеть поддерживает классический ESP32?
      options:
      - Wi-Fi 2,4 ГГц
      - Только 5 ГГц
      - Только Ethernet
      - Любую сотовую сеть
      answer: 0
      explain: Радиомодуль этого семейства не поддерживает 5 ГГц.
    - type: choice
      q: Зачем ограничивать ожидание подключения?
      options:
      - Чтобы продолжить работу при недоступной сети
      - Чтобы раскрыть пароль
      - Чтобы изменить MAC на каждый цикл
      - Чтобы зарядить плату
      answer: 0
      explain: Ошибка сети не должна навсегда блокировать программу.
    - type: fill
      q: Проверьте успешный статус.
      code: |
        if (WiFi.status() == ___) { /* сеть доступна */ }
      answers:
      - WL_CONNECTED
