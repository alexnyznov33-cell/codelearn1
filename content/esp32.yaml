  - title: 'ADC: измерение на ADC1'
    minutes: 25
    xp: 30
    theory: |
      ## Измерения при работающем Wi-Fi
      На классическом ESP32 используйте **ADC1**, например GPIO34: ADC2 конфликтует с Wi-Fi в этом семействе. GPIO34 — вход, он подходит для АЦП. Потенциометр около 10 кОм: крайние выводы 3V3/GND, движок GPIO34. Никогда не подавайте 5 В.

      `analogReadResolution(12)` задаёт сырой диапазон 0…4095. Затухание (`analogSetPinAttenuation`) влияет на рабочий диапазон. При `ADC_11db` на классическом ESP32 полезный диапазон не равен идеальным 0…3,3 В; края могут насыщаться, АЦП нелинеен. Значение максимальной шкалы не является точным измерением 3,3 В.

      `analogReadMilliVolts()` возвращает оценку в милливольтах с доступной калибровкой ядра/чипа. Для точного прибора нужны измерения, калибровка и иногда внешний АЦП. Усреднение снижает случайный шум, но не устраняет систематическую ошибку.

      ## Пример

      ```cpp
      const int SENSOR = 34;
      void setup() {
        Serial.begin(115200);
        analogReadResolution(12);
        analogSetPinAttenuation(SENSOR, ADC_11db);
      }
      void loop() {
        int raw = analogRead(SENSOR);
        uint32_t mv = analogReadMilliVolts(SENSOR);
        Serial.print(raw);
        Serial.print(" ");
        Serial.println(mv);
        delay(100);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Какой АЦП предпочтителен при Wi-Fi на классическом ESP32?
      options:
      - ADC1
      - ADC2 без ограничений
      - Только внешний UART
      - Никакой АЦП не существует
      answer: 0
      explain: ADC2 разделяет ресурсы с Wi-Fi.
    - type: choice
      q: Диапазон сырого результата при 12 битах?
      options:
      - 0…4095
      - 0…255
      - 0…1023
      - 0…12
      answer: 0
      explain: 2^12 = 4096 значений.
    - type: fill
      q: Задайте 12-битное чтение.
      code: |
        analogReadResolution(___);
      answers:
      - '12'
      explain: Разрешение определяет число кодов АЦП.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        int values[] = {1000, 1100, 1200};
        Serial.println((values[0] + values[1] + values[2]) / 3);
      answer: '1100'
      explain: Среднее трёх измерений; это не исправляет ошибку калибровки.
    - type: bug
      q: Найдите небезопасное питание потенциометра.
      code: |
        // Потенциометр:
        // Крайние выводы к 5V и GND.
        // Движок к GPIO34.
      bugLine: 2
      fix: // Крайние выводы к 3V3 и GND.
      explain: Движок не должен подавать на GPIO 5 В.
    homework:
      task: Подключите потенциометр к GPIO34 с питанием 3,3 В. Выводите сырое значение и милливольты. Сравните с
        мультиметром, если доступен, и отметьте насыщение у края диапазона.
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
      - Перед изменением проводов отключите питание. Сначала проверьте скетч кнопкой «Проверить» в Arduino IDE.
      checklist:
      - Могу объяснить назначение setup() и loop() в этом скетче.
      - Скетч скомпилирован для указанной платы; на оборудовании проверено поведение, если плата доступна.
      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
        const int SENSOR = 34;
        void setup() {
          Serial.begin(115200);
          analogReadResolution(12);
          analogSetPinAttenuation(SENSOR, ADC_11db);
        }
        void loop() {
          int raw = analogRead(SENSOR);
          uint32_t mv = analogReadMilliVolts(SENSOR);
          Serial.print(raw);
          Serial.print(" ");
          Serial.println(mv);
          delay(100);
        }
