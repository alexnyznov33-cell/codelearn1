  title: IoT и энергосбережение
  level: Junior+
  lessons:
  - title: 'MQTT: телеметрия и переподключение'
    minutes: 25
    xp: 30
    theory: |
      ## Publisher и broker
      MQTT использует брокер и темы (topics). Устройство публикует данные, подписчики получают сообщения. Установите **PubSubClient by Nick O’Leary** через менеджер библиотек. Нужны ваша Wi-Fi-сеть и доступный **локальный** MQTT-брокер на порту 1883, настроенный для учебного соединения.

      Замените SSID, пароль, адрес брокера и уникальный client ID. `mqtt.loop()` обслуживает соединение; `publish()` отправляет сообщение. В примере попытки reconnect ограничены интервалом 5 с, публикации — 2 с. Сам вызов connect может ждать сетевого/сокетного тайм-аута: это не полностью асинхронный клиент. Начальная Wi-Fi попытка ограничена 10 с, повторные стартуют не чаще 10 с.

      Обычный WiFiClient на 1883 **не шифрует трафик**; используйте только доверенную изолированную сеть. Для реального применения нужны аутентификация брокера, ACL и TLS с проверкой сертификата через WiFiClientSecure. Не отправляйте секреты в публичные topics. В этом примере PubSubClient публикует с QoS 0: доставка не гарантируется.

      ## Пример

      ```cpp
      #include <WiFi.h>
      #include <PubSubClient.h>
      WiFiClient network;
      PubSubClient mqtt(network);
      unsigned long retryAt = 0, sentAt = 0, wifiAt = 0;
      void setup() {
        Serial.begin(115200);
        WiFi.mode(WIFI_STA);
        WiFi.begin("YOUR_SSID", "YOUR_PASSWORD");
        unsigned long start = millis();
        while (WiFi.status() != WL_CONNECTED && millis() - start < 10000) delay(100);
        mqtt.setServer("192.168.1.10", 1883); // Замените адрес брокера.
        mqtt.setSocketTimeout(2);
        wifiAt = millis();
      }
      void loop() {
        unsigned long now = millis();
        if (WiFi.status() != WL_CONNECTED) {
          if (now - wifiAt >= 10000) { wifiAt = now; WiFi.reconnect(); }
          delay(10);
          return;
        }
        if (!mqtt.connected()) {
          if (now - retryAt >= 5000) {
            retryAt = now;
            mqtt.connect("codelearn-esp32-01"); // Уникальный ID для каждой платы.
          }
          return;
        }
        mqtt.loop();
        if (now - sentAt >= 2000) {
          sentAt = now;
          if (!mqtt.publish("codelearn/esp32/status", "online")) Serial.println("Publish failed");
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
