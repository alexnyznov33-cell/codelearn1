            // Ресурсы: Количество = Сумма(Количество), Сумма = Сумма(Сумма),
            //   СредняяЦена = ВЫБОР КОГДА Сумма(Количество) = 0 ТОГДА 0 ИНАЧЕ Сумма(Сумма) / Сумма(Количество) КОНЕЦ

            Процедура ДобавитьОтборПоКонтрагенту(Настройки, Контрагент) Экспорт
                Отбор = Настройки.Отбор.Элементы.Добавить(Тип("ЭлементОтбораКомпоновкиДанных"));
                Отбор.ЛевоеЗначение = Новый ПолеКомпоновкиДанных("Контрагент");
                Отбор.ВидСравнения = ВидСравненияКомпоновкиДанных.Равно;
                Отбор.ПравоеЗначение = Контрагент;
