              Для Каждого СтрокаТЧ Из Выборка Цикл
                  ОбластьСтрока.Параметры.Заполнить(СтрокаТЧ);
              КонецЦикла;
              ТабДок.Вывести(ОбластьСтрока);
            bugLine: 5
            fix: Перенести ТабДок.Вывести(ОбластьСтрока) внутрь цикла
            explain: Вывод после цикла напечатает только последнюю строку.
          - type: choice
            q: Как правильнее получать данные для печати многих документов?
            options: ["Через точку от ссылки в цикле", "Одним запросом по массиву ссылок", "Через ОткрытьФорму", "Из регистра сведений"]
            answer: 1
        homework:
          task: |
            Сделайте печатную форму «Расходная накладная» для документа РеализацияТоваров: макет с областями Шапка (номер, дата, контрагент), Строка (№, товар, количество, цена, сумма), Подвал (итого и сумма прописью). Данные — одним запросом по ссылке. Добавьте команду «Печать» на форму документа.
          checklist:
            - Макет с тремя именованными областями
            - Данные из запроса, а не через точку
            - Нумерация строк и итог
            - Сумма прописью
          solution: |
            // Модуль менеджера документа
            Функция ПечатьНакладной(Ссылка) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Д.Номер, Д.Дата, Д.Контрагент.Наименование КАК Контрагент,
                |  Т.НомерСтроки КАК НомерСтроки, Т.Номенклатура.Наименование КАК Товар,
                |  Т.Количество, Т.Цена, Т.Сумма
                |ИЗ Документ.РеализацияТоваров КАК Д
                |  ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров.Товары КАК Т ПО Т.Ссылка = Д.Ссылка
                |ГДЕ Д.Ссылка = &Ссылка
                |УПОРЯДОЧИТЬ ПО НомерСтроки");
                Запрос.УстановитьПараметр("Ссылка", Ссылка);
                Выборка = Запрос.Выполнить().Выбрать();

                Макет = ПолучитьМакет("Накладная");
                ТабДок = Новый ТабличныйДокумент;
                Шапка = Макет.ПолучитьОбласть("Шапка");
                Строка = Макет.ПолучитьОбласть("Строка");
                Подвал = Макет.ПолучитьОбласть("Подвал");

                Итого = 0;
                ПерваяСтрока = Истина;
                Пока Выборка.Следующий() Цикл
                    Если ПерваяСтрока Тогда
                        Шапка.Параметры.Заполнить(Выборка);
                        Шапка.Параметры.Дата = Формат(Выборка.Дата, "ДЛФ=D");
                        ТабДок.Вывести(Шапка);
                        ПерваяСтрока = Ложь;
                    КонецЕсли;
                    Строка.Параметры.Заполнить(Выборка);
                    ТабДок.Вывести(Строка);
                    Итого = Итого + Выборка.Сумма;
                КонецЦикла;

                Подвал.Параметры.Итого = Итого;
                Подвал.Параметры.Прописью = ЧислоПрописью(Итого, "L=ru_RU",
                    "рубль, рубля, рублей, м, копейка, копейки, копеек, ж, 2");
                ТабДок.Вывести(Подвал);
                Возврат ТабДок;
            КонецФункции

            // Модуль формы документа
            &НаКлиенте
            Процедура Печать(Команда)
                ПечатьНаСервере().Показать("Расходная накладная");
            КонецПроцедуры

            &НаСервере
            Функция ПечатьНаСервере()
                Возврат Документы.РеализацияТоваров.ПечатьНакладной(Объект.Ссылка);
            КонецФункции
      - id: 1c-06-04
        title: Табличный документ
        minutes: 35
        xp: 40
        theory: |
          **ТабличныйДокумент** — универсальный «лист Excel» в 1С: в нём выводятся отчёты и печатные формы, его можно редактировать, сохранять и печатать.

          ## Вывод и присоединение

          - `Вывести(Область)` — добавляет область **вниз**.
          - `Присоединить(Область)` — добавляет **справа** (для колонок, например по месяцам).
          - `ВывестиГоризонтальныйРазделительСтраниц()` — разрыв страницы.

          ```bsl
          ТабДок.Вывести(ОбластьЗаголовокСтроки);
          Для Каждого Месяц Из Месяцы Цикл
              ОбластьМесяц.Параметры.Месяц = Формат(Месяц, "ДФ='ММММ'");
              ТабДок.Присоединить(ОбластьМесяц);
          КонецЦикла;
          ```

          ## Работа с ячейками

          ```bsl
          Область = ТабДок.Область("R1C1:R1C5");   // строки 1, колонки 1–5
          Область.Объединить();
          Область.Текст = "Отчёт о продажах";
          Область.Шрифт = Новый Шрифт(, 14, Истина);  // 14 пт, жирный
          Область.ГоризонтальноеПоложение = ГоризонтальноеПоложение.Центр;
          ```

          ## Группировки строк

          ```bsl
          ТабДок.НачатьАвтогруппировкуСтрок();
          ТабДок.Вывести(ОбластьГруппа, 1);   // уровень 1
          ТабДок.Вывести(ОбластьСтрока, 2);   // уровень 2 — свернётся под группой
          ТабДок.ЗакончитьАвтогруппировкуСтрок();
          ```

          ## Расшифровка

          В параметре расшифровки ячейки можно сохранить ссылку — двойной клик откроет документ:

          ```bsl
          ОбластьСтрока.Параметры.Документ = Выборка.Ссылка;
          ОбластьСтрока.Параметры.РасшифровкаДокумента = Выборка.Ссылка;
          ```

          ## Настройки печати и сохранение

          ```bsl
          ТабДок.ОриентацияСтраницы = ОриентацияСтраницы.Ландшафт;
          ТабДок.АвтоМасштаб = Истина;
          ТабДок.ФиксацияСверху = 1;          // закрепить шапку
          ТабДок.ТолькоПросмотр = Истина;
          ТабДок.Записать("C:\Отчёты\продажи.xlsx", ТипФайлаТабличногоДокумента.XLSX);
          ```

          Поддерживаются форматы MXL, XLSX, PDF, DOCX, HTML, ODS. Метод `Записать` выполняется там, где находится файловая система: на сервере пишет на диск сервера, для пользователя файл сохраняют через временное хранилище и `ПолучитьФайл`/`НачатьПолучениеФайлаССервера`.

          ## Проверка вывода на страницу

          ```bsl
          Если Не ТабДок.ПроверитьВывод(ОбластьСтрока) Тогда
              ТабДок.ВывестиГоризонтальныйРазделительСтраниц();
              ТабДок.Вывести(ОбластьШапкаТаблицы);   // повторить шапку на новой странице
          КонецЕсли;
          ```
        practice:
          - type: choice
            q: Какой метод добавляет область справа от предыдущей?
            options: ["Вывести", "Присоединить", "Вставить", "Объединить"]
            answer: 1
          - type: fill
