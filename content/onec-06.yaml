            Создайте отчёт «Продажи по контрагентам» на СКД: набор данных-запрос к оборотам регистра Продажи за период, ресурсы Количество и Сумма, вариант с группировкой Контрагент → Номенклатура. Дополнительно напишите экспортную функцию в модуле менеджера отчёта, которая формирует его программно в ТабличныйДокумент.
          checklist:
            - Параметры периода берутся из СКД
            - Ресурсы Количество и Сумма отмечены
            - Две вложенные группировки
            - Функция формирует ТабличныйДокумент
          solution: |
            // Модуль менеджера отчёта Продажи
            Функция Сформировать(НачалоПериода, КонецПериода) Экспорт
                Схема = ПолучитьМакет("ОсновнаяСхемаКомпоновкиДанных");
                Компоновщик = Новый КомпоновщикНастроекКомпоновкиДанных;
                Компоновщик.Инициализировать(Новый ИсточникДоступныхНастроекКомпоновкиДанных(Схема));
                Компоновщик.ЗагрузитьНастройки(Схема.НастройкиПоУмолчанию);
                Настройки = Компоновщик.ПолучитьНастройки();
                Настройки.ПараметрыДанных.УстановитьЗначениеПараметра("НачалоПериода", НачалоПериода);
                Настройки.ПараметрыДанных.УстановитьЗначениеПараметра("КонецПериода", КонецПериода);

                КомпоновщикМакета = Новый КомпоновщикМакетаКомпоновкиДанных;
                Макет = КомпоновщикМакета.Выполнить(Схема, Настройки);

                Процессор = Новый ПроцессорКомпоновкиДанных;
                Процессор.Инициализировать(Макет);

                ТабДок = Новый ТабличныйДокумент;
                Вывод = Новый ПроцессорВыводаРезультатаКомпоновкиДанныхВТабличныйДокумент;
                Вывод.УстановитьДокумент(ТабДок);
                Вывод.Вывести(Процессор);
                Возврат ТабДок;
            КонецФункции
      - id: 1c-06-02
        title: Параметры, отборы, группировки СКД
        minutes: 40
        xp: 40
        theory: |
          Сила СКД — в **настройках**. Один и тот же набор данных можно показать десятками способов.

          ## Параметры

          Параметр запроса `&Склад` автоматически появляется на вкладке **Параметры** схемы. Там можно задать тип, значение по умолчанию, «Доступен список значений» и выражение. Типичный приём — стандартный период:

          ```bsl
          // Параметр Период типа СтандартныйПериод,
          // НачалоПериода = &Период.ДатаНачала
          // КонецПериода  = &Период.ДатаОкончания
          ```

          Из кода параметр задаётся так:

          ```bsl
          Настройки.ПараметрыДанных.УстановитьЗначениеПараметра("Склад", Склад);
          ```

          ## Отборы

          Отбор фильтрует данные **после** получения (или встраивается в запрос, если поле доступно в условии). Пользователь выбирает поле, вид сравнения и значение.

          ```bsl
          Отбор = Настройки.Отбор.Элементы.Добавить(Тип("ЭлементОтбораКомпоновкиДанных"));
          Отбор.ЛевоеЗначение = Новый ПолеКомпоновкиДанных("Контрагент");
          Отбор.ВидСравнения = ВидСравненияКомпоновкиДанных.Равно;
          Отбор.ПравоеЗначение = Контрагент;
          Отбор.Использование = Истина;
          ```

          Чтобы СКД могла наложить отбор прямо внутри виртуальной таблицы, используйте фигурные скобки:

          ```bsl
          ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Период, {Склад.*}) КАК Ост
          ```

          ## Группировки

          Структура настроек — дерево: **Группировка → вложенная Группировка → Детальные записи**. Можно добавить **таблицу** (строки × колонки) и **диаграмму**.

          | Элемент структуры | Пример |
          |---|---|
          | Группировка | Контрагент |
          | Иерархическая группировка | Номенклатура (с группами) |
          | Таблица | Строки — Товар, колонки — Месяц |
          | Детальные записи | Группировка без полей |

          ## Вычисляемые поля и условное оформление

          **Вычисляемое поле** — выражение над полями набора, например `Сумма / Количество` (средняя цена). Для ресурса указывают функцию: `Сумма(Сумма)`, `Максимум(Цена)`, `Количество(Различные Документ)`.

          **Условное оформление** — подсветка строк: «если Остаток < 0 — красный текст».

          > Пользовательские настройки (быстрые отборы на форме) включаются флагом «Включать в пользовательские настройки».
