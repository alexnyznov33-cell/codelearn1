    lessons:
      - id: 1c-06-01
        title: Система компоновки данных (СКД)
        minutes: 40
        xp: 40
        theory: |
          **Система компоновки данных (СКД)** — стандартный механизм 1С для построения отчётов. Разработчик описывает **что** получить (схема), а пользователь сам настраивает **как** показать: группировки, отборы, сортировки, оформление — без программиста.

          ## Из чего состоит СКД

          | Элемент | Назначение |
          |---|---|
          | Схема компоновки данных | Наборы данных, поля, ресурсы, параметры |
          | Набор данных | Запрос, объект (ТЗ) или объединение |
          | Ресурсы | Поля, которые суммируются в итогах (Сумма, Количество) |
          | Настройки (варианты) | Структура отчёта: группировки, отборы, порядок |
          | Макет компоновки | Результат «схема + настройки» для вывода |

          ## Отчёт «без кода»

          1. Создайте объект **Отчёт** → «Открыть схему компоновки данных».
          2. Добавьте **Набор данных — запрос** и в конструкторе выберите поля.
          3. На вкладке **Ресурсы** отметьте поля для суммирования.
          4. На вкладке **Настройки** добавьте группировку и детальные записи.

          Готово: у отчёта есть форма с кнопкой «Сформировать». Код не нужен вовсе.

          ```bsl
          ВЫБРАТЬ
              Продажи.Номенклатура КАК Номенклатура,
              Продажи.Контрагент КАК Контрагент,
              Продажи.КоличествоОборот КАК Количество,
              Продажи.СуммаОборот КАК Сумма
          ИЗ
              РегистрНакопления.Продажи.Обороты(&НачалоПериода, &КонецПериода) КАК Продажи
          ```

          Параметры `&НачалоПериода` и `&КонецПериода` СКД создаст сама и покажет пользователю.

          ## Программный вывод

          Иногда отчёт нужно сформировать в коде (например, в обработке или для выгрузки):

          ```bsl
          Схема = Отчеты.Продажи.ПолучитьМакет("ОсновнаяСхемаКомпоновкиДанных");
          Настройки = Схема.НастройкиПоУмолчанию;

          КомпоновщикМакета = Новый КомпоновщикМакетаКомпоновкиДанных;
          МакетКомпоновки = КомпоновщикМакета.Выполнить(Схема, Настройки);

          Процессор = Новый ПроцессорКомпоновкиДанных;
          Процессор.Инициализировать(МакетКомпоновки);

          ТабДок = Новый ТабличныйДокумент;
          ПроцессорВывода = Новый ПроцессорВыводаРезультатаКомпоновкиДанныхВТабличныйДокумент;
          ПроцессорВывода.УстановитьДокумент(ТабДок);
          ПроцессорВывода.Вывести(Процессор);
          ```

          Цепочка всегда одна: **Схема + Настройки → Компоновщик макета → Процессор компоновки → Процессор вывода**.

          > Совет: в СКД не пишите `УПОРЯДОЧИТЬ ПО` и `ИТОГИ` в запросе — порядком и итогами управляют настройки.
