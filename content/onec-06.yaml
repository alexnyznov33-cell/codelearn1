            code: |
              ТабДок.Вывести(Шапка);       // 2 строки
              Для Сч = 1 По 3 Цикл
                  ТабДок.Вывести(Строка);  // 1 строка
              КонецЦикла;
              ТабДок.Вывести(Подвал);      // 1 строка
              Сообщить(ТабДок.ВысотаТаблицы);
            answer: "6"
        homework:
          task: |
            Сделайте отчёт-обработку «Продажи по месяцам» без СКД: строки — товары (с группировкой по группам номенклатуры через автогруппировку), колонки — месяцы года через Присоединить, итоговая колонка. Заголовок объединённой ячейкой жирным шрифтом, закреплённая шапка, альбомная ориентация, кнопка «Сохранить в Excel».
          checklist:
            - Колонки месяцев через Присоединить
            - Автогруппировка строк
            - Оформление заголовка и фиксация
            - Сохранение в XLSX
          solution: |
            &НаСервере
            Функция СформироватьНаСервере(Год)
                Макет = РеквизитФормыВЗначение("Объект").ПолучитьМакет("Макет");
                ТабДок = Новый ТабличныйДокумент;
                ТабДок.ОриентацияСтраницы = ОриентацияСтраницы.Ландшафт;

                Заголовок = Макет.ПолучитьОбласть("Заголовок");
                Заголовок.Параметры.Год = Формат(Год, "ЧГ=0");
                ТабДок.Вывести(Заголовок);

                // Шапка таблицы
                ТабДок.Вывести(Макет.ПолучитьОбласть("ШапкаТовар"));
                ОбластьМесяц = Макет.ПолучитьОбласть("ШапкаМесяц");
                Для М = 1 По 12 Цикл
                    ОбластьМесяц.Параметры.Месяц = Формат(Дата(Год, М, 1), "ДФ=ММММ");
                    ТабДок.Присоединить(ОбластьМесяц);
                КонецЦикла;
                ТабДок.Присоединить(Макет.ПолучитьОбласть("ШапкаИтого"));
                ТабДок.ФиксацияСверху = ТабДок.ВысотаТаблицы;

                Запрос = Новый Запрос(
                "ВЫБРАТЬ П.Номенклатура.Родитель КАК Группа, П.Номенклатура КАК Товар,
                |  МЕСЯЦ(П.Период) КАК М, П.СуммаОборот КАК Сумма
                |ИЗ РегистрНакопления.Продажи.Обороты(&Н, &К, Месяц) КАК П
                |ИТОГИ СУММА(Сумма) ПО Группа, Товар");
                Запрос.УстановитьПараметр("Н", Дата(Год, 1, 1));
                Запрос.УстановитьПараметр("К", КонецГода(Дата(Год, 1, 1)));
                ВыборкаГрупп = Запрос.Выполнить().Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам);

                ТабДок.НачатьАвтогруппировкуСтрок();
                Пока ВыборкаГрупп.Следующий() Цикл
                    ОблГруппа = Макет.ПолучитьОбласть("Группа");
                    ОблГруппа.Параметры.Группа = ВыборкаГрупп.Группа;
                    ОблГруппа.Параметры.Итого = ВыборкаГрупп.Сумма;
                    ТабДок.Вывести(ОблГруппа, 1);
                    ВыборкаТоваров = ВыборкаГрупп.Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам);
                    Пока ВыборкаТоваров.Следующий() Цикл
                        ТабДок.Вывести(Макет.ПолучитьОбласть("Товар"), 2);
                        ТабДок.Область(ТабДок.ВысотаТаблицы, 1).Текст = Строка(ВыборкаТоваров.Товар);
                        Детали = ВыборкаТоваров.Выбрать();
                        Пока Детали.Следующий() Цикл
                            ТабДок.Область(ТабДок.ВысотаТаблицы, Детали.М + 1).Текст = Формат(Детали.Сумма, "ЧДЦ=2");
                        КонецЦикла;
                        ТабДок.Область(ТабДок.ВысотаТаблицы, 14).Текст = Формат(ВыборкаТоваров.Сумма, "ЧДЦ=2");
                    КонецЦикла;
                КонецЦикла;
                ТабДок.ЗакончитьАвтогруппировкуСтрок();
                Возврат ТабДок;
            КонецФункции

            &НаКлиенте
            Процедура СохранитьВExcel(Команда)
                Адрес = СохранитьНаСервере();
                ПолучитьФайл(Адрес, "Продажи.xlsx");
            КонецПроцедуры

            &НаСервере
            Функция СохранитьНаСервере()
                ИмяФайла = ПолучитьИмяВременногоФайла("xlsx");
                Отчет.Записать(ИмяФайла, ТипФайлаТабличногоДокумента.XLSX);
                Возврат ПоместитьВоВременноеХранилище(Новый ДвоичныеДанные(ИмяФайла), УникальныйИдентификатор);
            КонецФункции
