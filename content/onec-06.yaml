            КонецПроцедуры
      - id: 1c-06-03
        title: Макеты и печатные формы
        minutes: 40
        xp: 40
        theory: |
          **Печатная форма** — документ для бумаги: счёт, накладная, акт. Строится из **макета** — табличного документа с именованными **областями** и **параметрами**.

          ## Макет

          В конфигураторе у документа: Макеты → Добавить → Табличный документ. Выделяете строки и задаёте им имена областей: `Шапка`, `Строка`, `Подвал`. В ячейках пишете параметры: заполнение «Параметр», имя `Номер`, `Контрагент`, `Сумма`. Можно также «Шаблон»: `Счёт № [Номер] от [Дата]`.

          ## Код печати

          ```bsl
          Функция ПечатьНакладной(Ссылка) Экспорт
              Макет = Документы.РеализацияТоваров.ПолучитьМакет("Накладная");
              ТабДок = Новый ТабличныйДокумент;

              ОбластьШапка = Макет.ПолучитьОбласть("Шапка");
              ОбластьШапка.Параметры.Номер = Ссылка.Номер;
              ОбластьШапка.Параметры.Дата = Формат(Ссылка.Дата, "ДЛФ=D");
              ОбластьШапка.Параметры.Контрагент = Ссылка.Контрагент;
              ТабДок.Вывести(ОбластьШапка);

              ОбластьСтрока = Макет.ПолучитьОбласть("Строка");
              Для Каждого СтрокаТЧ Из Ссылка.Товары Цикл
                  ОбластьСтрока.Параметры.Заполнить(СтрокаТЧ);
                  ТабДок.Вывести(ОбластьСтрока);
              КонецЦикла;

              ОбластьПодвал = Макет.ПолучитьОбласть("Подвал");
              ОбластьПодвал.Параметры.Итого = Ссылка.Товары.Итог("Сумма");
              ТабДок.Вывести(ОбластьПодвал);

              Возврат ТабДок;
          КонецФункции
          ```

          `Параметры.Заполнить(Структура)` заполняет все параметры области по совпадающим именам — удобно для строк ТЧ и выборок запроса.

          ## Лучше через запрос

          Обращение `Ссылка.Товары` и `СтрокаТЧ.Номенклатура.Наименование` — это много мелких чтений из базы. В типовых конфигурациях данные для печати получают **одним запросом**, а потом выводят выборку.

          ## Сумма прописью и формат

          ```bsl
          Прописью = ЧислоПрописью(1250.50, "L=ru_RU", "рубль, рубля, рублей, м, копейка, копейки, копеек, ж, 2");
          Текст = Формат(1234.5, "ЧДЦ=2");   // «1 234,50»
          ```

          ## Подключение к форме

          Простой способ — команда документа с обработчиком, которая открывает результат:

          ```bsl
          &НаКлиенте
          Процедура Печать(Команда)
              ТабДок = ПечатьНаСервере(Объект.Ссылка);
              ТабДок.Показать("Накладная");
          КонецПроцедуры
          ```

          В типовых конфигурациях на БСП используется подсистема «Печать» и процедура `ДобавитьКомандыПечати` в модуле менеджера.
