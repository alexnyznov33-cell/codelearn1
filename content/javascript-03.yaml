        homework:
          task: |
            Напишите модуль `persist` с функциями `load(key, fallback)`, `save(key, value)` (try/catch, JSON, версия схемы) и `watch(key, callback)` (событие storage). Примените его: переключатель светлой/тёмной темы, который запоминает выбор, и счётчик посещений страницы. Откройте сайт в двух вкладках и убедитесь, что смена темы в одной меняет её в другой.
          checklist:
            - Данные хранятся в JSON
            - Ошибки разбора не роняют страницу
            - Вкладки синхронизируются
          solution: |
            const VERSION = 1;
            const persist = {
              load(key, fallback) {
                try {
                  const raw = localStorage.getItem(key);
                  if (raw === null) return fallback;
                  const { v, data } = JSON.parse(raw);
                  return v === VERSION ? data : fallback;
                } catch {
                  return fallback;
                }
              },
              save(key, value) {
                try {
                  localStorage.setItem(key, JSON.stringify({ v: VERSION, data: value }));
                } catch (e) {
                  console.warn("Не удалось сохранить", e);
                }
              },
              watch(key, cb) {
                window.addEventListener("storage", (e) => {
                  if (e.key === key) cb(e.newValue ? JSON.parse(e.newValue).data : null);
                });
              },
            };

            const applyTheme = (t) => document.documentElement.classList.toggle("dark", t === "dark");
            let theme = persist.load("theme", "light");
            applyTheme(theme);
            document.querySelector("#theme").addEventListener("click", () => {
              theme = theme === "dark" ? "light" : "dark";
              persist.save("theme", theme);
              applyTheme(theme);
            });
            persist.watch("theme", (t) => { theme = t; applyTheme(t); });

            const visits = persist.load("visits", 0) + 1;
            persist.save("visits", visits);
            document.querySelector("#visits").textContent = `Вы здесь ${visits}-й раз`;
      - id: js-03-05
        title: "Практикум: To-Do приложение"
        minutes: 60
        xp: 80
        theory: |
          Соберём всё из модуля в одно приложение **To-Do** без фреймворков. Главная идея — **состояние отдельно от DOM**: данные в массиве, а функция `render()` рисует интерфейс по данным.

          ```
          действие пользователя → изменить state → save() → render()
          ```

          ## Состояние

          ```javascript
          let state = load() ?? { todos: [], filter: "all" };
          // todo: { id: crypto.randomUUID(), text: "Купить хлеб", done: false, createdAt: Date.now() }

          function update(fn) {
            state = fn(state);                // чистая функция: старое → новое
            localStorage.setItem("todos-v1", JSON.stringify(state));
            render();
          }
          ```

          ## Действия

          ```javascript
          const actions = {
            add: (text) => update((s) => ({ ...s, todos: [...s.todos, { id: crypto.randomUUID(), text, done: false }] })),
            toggle: (id) => update((s) => ({ ...s, todos: s.todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) })),
            remove: (id) => update((s) => ({ ...s, todos: s.todos.filter((t) => t.id !== id) })),
            clearDone: () => update((s) => ({ ...s, todos: s.todos.filter((t) => !t.done) })),
            setFilter: (filter) => update((s) => ({ ...s, filter })),
          };
          ```

          ## Отрисовка

          ```javascript
          const visible = (s) => s.todos.filter((t) =>
            s.filter === "active" ? !t.done : s.filter === "done" ? t.done : true);

          function render() {
            list.replaceChildren(...visible(state).map((t) => {
              const li = document.createElement("li");
              li.dataset.id = t.id;
              li.classList.toggle("done", t.done);
              li.innerHTML = `<input type="checkbox" data-action="toggle"><span></span><button data-action="remove">✕</button>`;
              li.querySelector("span").textContent = t.text;   // текст — безопасно
              li.querySelector("input").checked = t.done;
              return li;
            }));
            const left = state.todos.filter((t) => !t.done).length;
            counter.textContent = `Осталось: ${left}`;
          }
          ```

          ## События — через делегирование

          ```javascript
          list.addEventListener("click", (e) => {
            const action = e.target.dataset.action;
            const id = e.target.closest("li")?.dataset.id;
            if (action && id) actions[action](id);
          });
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (text) actions.add(text);
            form.reset();
          });
          ```

          Такая архитектура (state → render, действия как чистые функции) — это ровно то, что потом делают React и Redux, только автоматически.
