            explain: Две стрелочные функции — разные объекты; удалить можно только ту же самую ссылку.
          - type: order
            q: Расставьте фазы распространения события
            lines:
              - Погружение (capturing) от document к цели
              - Срабатывание на целевом элементе
              - Всплытие (bubbling) от цели к document
        homework:
          task: |
            Сделайте «Оценку звёздами»: 5 звёзд (☆) в контейнере. Используйте **один** обработчик на контейнере (делегирование): при наведении подсвечиваются звёзды до текущей, при уходе мыши — возвращается выбранная оценка, клик фиксирует оценку и генерирует `CustomEvent("rate", { detail: { value } })`, на которое подписан код, выводящий «Ваша оценка: N». Добавьте управление с клавиатуры: стрелки ←/→ меняют оценку.
          checklist:
            - Один обработчик на контейнере
            - Используется dataset
            - Генерируется CustomEvent
            - Работает клавиатура
          solution: |
            const box = document.querySelector("#stars");
            const out = document.querySelector("#result");
            let value = 0;
            box.tabIndex = 0;
            for (let i = 1; i <= 5; i++) {
              const s = document.createElement("span");
              s.dataset.value = i;
              s.textContent = "☆";
              box.append(s);
            }
            function paint(n) {
              box.querySelectorAll("span").forEach((s) => {
                s.textContent = Number(s.dataset.value) <= n ? "★" : "☆";
              });
            }
            function setValue(n) {
              value = Math.min(5, Math.max(1, n));
              paint(value);
              box.dispatchEvent(new CustomEvent("rate", { detail: { value }, bubbles: true }));
            }
            box.addEventListener("mouseover", (e) => {
              const star = e.target.closest("span[data-value]");
              if (star) paint(Number(star.dataset.value));
            });
            box.addEventListener("mouseleave", () => paint(value));
            box.addEventListener("click", (e) => {
              const star = e.target.closest("span[data-value]");
              if (star) setValue(Number(star.dataset.value));
            });
            box.addEventListener("keydown", (e) => {
              if (e.key === "ArrowRight") setValue(value + 1);
              if (e.key === "ArrowLeft") setValue(value - 1);
            });
            document.addEventListener("rate", (e) => {
              out.textContent = `Ваша оценка: ${e.detail.value}`;
            });
      - id: js-03-03
        title: Формы и валидация
        minutes: 35
        xp: 35
        theory: |
          ## Чтение формы

          ```html
          <form id="signup" novalidate>
            <input name="email" type="email" required>
            <input name="password" type="password" minlength="8" required>
            <select name="plan"><option value="free">Free</option><option value="pro">Pro</option></select>
            <label><input name="agree" type="checkbox"> Согласен</label>
            <button>Зарегистрироваться</button>
          </form>
          ```

          ```javascript
          const form = document.querySelector("#signup");
          form.addEventListener("submit", (e) => {
            e.preventDefault();                          // не перезагружать страницу
            const data = new FormData(form);
            const email = data.get("email");
            const values = Object.fromEntries(data);     // { email, password, plan, agree: "on" }
            const agree = form.elements.agree.checked;   // для чекбокса — checked
          });
          ```

          События полей: `input` — при каждом изменении, `change` — по завершении (потеря фокуса, выбор в select), `blur` — уход с поля.

          ## Встроенная валидация HTML5

          Атрибуты `required`, `type="email"`, `minlength`, `maxlength`, `min`, `max`, `pattern="\d{6}"`. CSS-псевдоклассы `:invalid`, `:user-invalid`.

          ```javascript
          const email = form.elements.email;
          email.validity.valid;        // false
          email.validity.valueMissing; // true, если пусто при required
          email.validity.typeMismatch; // некорректный email
          email.setCustomValidity("Этот email уже занят");   // своя ошибка ("" — снять)
          form.checkValidity();        // проверить все поля
          form.reportValidity();       // показать стандартные подсказки
          ```

          `novalidate` на форме отключает стандартные «пузыри», чтобы показывать свои сообщения.

          ## Своя валидация

          ```javascript
          const rules = {
            email: (v) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || "Неверный email",
            password: (v) => v.length >= 8 || "Минимум 8 символов",
          };
          function validate(values) {
            const errors = {};
            for (const [field, check] of Object.entries(rules)) {
              const res = check(values[field] ?? "");
              if (res !== true) errors[field] = res;
            }
            return errors;
          }
          ```

          ## UX и доступность

          - Показывайте ошибку рядом с полем и после `blur`, а не на каждый символ.
          - Связывайте текст ошибки: `aria-describedby="email-error"`, `aria-invalid="true"`.
          - Блокируйте кнопку на время отправки, чтобы не было двойного submit.
          - Валидация на клиенте — для удобства; **сервер обязан проверять всё заново**.
        practice:
