              });
            bugLine: 1
            fix: добавить e.preventDefault() в начало обработчика
            explain: Без preventDefault браузер выполнит стандартную отправку формы с перезагрузкой страницы.
        homework:
          task: |
            Сделайте форму регистрации: имя (2–30 символов), email, пароль (≥ 8, цифра и буква), повтор пароля, возраст (14–120), чекбокс согласия. Валидируйте на `blur` и при отправке, показывайте ошибки под полями (`aria-invalid`, `aria-describedby`), кнопка неактивна, пока форма невалидна. При успешной отправке — имитация запроса (`setTimeout` 1 с), блокировка кнопки и сообщение «Готово!».
          checklist:
            - Ошибки отображаются у полей
            - Пароли сравниваются
            - Нет двойной отправки
            - Есть атрибуты доступности
          solution: |
            const form = document.querySelector("#reg");
            const rules = {
              name: (v) => (v.length >= 2 && v.length <= 30) || "От 2 до 30 символов",
              email: (v) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || "Неверный email",
              password: (v) => (v.length >= 8 && /\d/.test(v) && /[a-zа-я]/i.test(v)) || "Минимум 8 символов, буква и цифра",
              confirm: (v, all) => v === all.password || "Пароли не совпадают",
              age: (v) => (Number(v) >= 14 && Number(v) <= 120) || "Возраст 14–120",
              agree: (v) => v === "on" || "Нужно согласие",
            };
            const values = () => Object.fromEntries(new FormData(form));
            function check(name) {
              const field = form.elements[name];
              const res = rules[name](values()[name] ?? "", values());
              const err = document.querySelector(`#${name}-error`);
              const ok = res === true;
              field.setAttribute("aria-invalid", String(!ok));
              field.setAttribute("aria-describedby", `${name}-error`);
              err.textContent = ok ? "" : res;
              return ok;
            }
            const allValid = () => Object.keys(rules).every((n) => rules[n](values()[n] ?? "", values()) === true);
            const btn = form.querySelector("button");
            form.addEventListener("focusout", (e) => { if (rules[e.target.name]) check(e.target.name); });
            form.addEventListener("input", () => { btn.disabled = !allValid(); });
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              const ok = Object.keys(rules).map(check).every(Boolean);
              if (!ok) return;
              btn.disabled = true;
              btn.textContent = "Отправка...";
              await new Promise((r) => setTimeout(r, 1000));
              form.replaceWith(Object.assign(document.createElement("p"), { textContent: "Готово!" }));
            });
            btn.disabled = true;
      - id: js-03-04
        title: localStorage и sessionStorage
        minutes: 25
        xp: 30
        theory: |
          **Web Storage** — хранилище «ключ → строка» в браузере, привязанное к **origin** (протокол + домен + порт).

          | | localStorage | sessionStorage | Cookie |
          |---|---|---|---|
          | Срок жизни | бессрочно | до закрытия вкладки | задаётся |
          | Объём | ~5–10 МБ | ~5 МБ | ~4 КБ |
          | Отправляется на сервер | нет | нет | да, с каждым запросом |

          ```javascript
          localStorage.setItem("theme", "dark");
          localStorage.getItem("theme");      // "dark"
          localStorage.getItem("missing");    // null
          localStorage.removeItem("theme");
          localStorage.clear();               // всё для этого сайта
          localStorage.length; localStorage.key(0);
          ```

          ## Только строки!

          ```javascript
          localStorage.setItem("count", 5);
          typeof localStorage.getItem("count");    // "string" — "5"
          localStorage.setItem("user", { a: 1 });  // сохранится "[object Object]" ❌
          ```

          Объекты сохраняем через JSON:

          ```javascript
          const storage = {
            get(key, fallback) {
              try {
                const raw = localStorage.getItem(key);
                return raw === null ? fallback : JSON.parse(raw);
              } catch {
                return fallback;          // повреждённые данные
              }
            },
            set(key, value) {
              localStorage.setItem(key, JSON.stringify(value));
            },
          };
          storage.set("cart", [{ id: 1, qty: 2 }]);
          const cart = storage.get("cart", []);
          ```

          ## Синхронизация вкладок

          Событие `storage` срабатывает в **других** вкладках того же сайта, когда данные изменились:

          ```javascript
          window.addEventListener("storage", (e) => {
            if (e.key === "cart") renderCart(JSON.parse(e.newValue));
          });
          ```

          ## Ограничения и безопасность

          - API **синхронный** — не храните мегабайты, это тормозит страницу. Для больших данных — **IndexedDB**.
          - `setItem` может бросить `QuotaExceededError`, а в приватном режиме хранилище бывает недоступно — оборачивайте в try/catch.
          - Любой JS на странице читает localStorage, поэтому при XSS-уязвимости токены оттуда украдут. Чувствительные токены лучше держать в `HttpOnly` cookie.
          - Версионируйте схему: `{ version: 2, data }` — пригодится при изменении формата.
        practice:
          - type: choice
            q: Что вернёт localStorage.getItem("x"), если ключа нет?
            options: ["undefined", "null", "\"\"", "Ошибку"]
            answer: 1
          - type: bug
            q: Где ошибка?
            code: |
              const settings = { theme: "dark", font: 16 };
              localStorage.setItem("settings", settings);
              const s = JSON.parse(localStorage.getItem("settings"));
            bugLine: 2
            fix: localStorage.setItem("settings", JSON.stringify(settings));
            explain: setItem преобразует объект в строку "[object Object]" — нужен JSON.stringify.
          - type: choice
