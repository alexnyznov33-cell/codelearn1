id: javascript
modules:
  - id: js-m3
    title: Браузер и DOM
    level: Junior
    lessons:
      - id: js-03-01
        title: DOM — поиск и изменение элементов
        minutes: 35
        xp: 35
        theory: |
          **DOM** (Document Object Model) — дерево объектов, в которое браузер превращает HTML. Через JS можно находить узлы, менять их и создавать новые.

          ```html
          <ul id="list">
            <li class="item">Чай</li>
            <li class="item active">Кофе</li>
          </ul>
          <script src="app.js" defer></script>
          ```

          `defer` — скрипт выполнится после разбора HTML, когда элементы уже существуют.

          ## Поиск

          ```javascript
          const list = document.getElementById("list");
          const first = document.querySelector(".item");          // первый по CSS-селектору
          const all = document.querySelectorAll("#list .item");   // NodeList всех
          const active = list.querySelector(".active");           // поиск внутри элемента
          all.forEach((li) => console.log(li.textContent));
          const card = btn.closest(".card");                      // ближайший предок
          ```

          ## Содержимое и атрибуты

          ```javascript
          el.textContent = "Новый текст";             // безопасно: только текст
          el.innerHTML = "<b>жирный</b>";            // разбирает HTML — опасно с данными пользователя (XSS)!
          input.value = "abc";                        // значение поля формы
          link.href = "https://example.com";
          img.setAttribute("alt", "Фото");
          el.dataset.id = "42";                       // data-id="42"
          el.hidden = true;
          ```

          ## Классы и стили

          ```javascript
          el.classList.add("active");
          el.classList.remove("hidden");
          el.classList.toggle("open");               // добавить/убрать
          el.classList.contains("active");           // true/false
          el.style.backgroundColor = "tomato";       // inline-стиль (лучше менять классы)
          ```

          ## Создание и удаление

          ```javascript
          const li = document.createElement("li");
          li.className = "item";
          li.textContent = "Сок";
          list.append(li);                 // в конец (prepend — в начало)
          list.firstElementChild.before(li);
          li.remove();

          // Много элементов — одной вставкой
          const frag = document.createDocumentFragment();
          ["a", "b", "c"].forEach((t) => {
            const x = document.createElement("li");
            x.textContent = t;
            frag.append(x);
          });
          list.append(frag);
          ```

          ## Навигация

          `el.parentElement`, `el.children`, `el.firstElementChild`, `el.nextElementSibling`. Свойства без `Element` (`childNodes`, `nextSibling`) включают текстовые узлы-пробелы.

          `querySelectorAll` возвращает **статический** список, а `getElementsByClassName` — «живую» коллекцию, которая обновляется при изменении DOM.
        practice:
          - type: choice
            q: Какой метод вернёт первый элемент по CSS-селектору?
            options: ["getElementsByClassName", "querySelector", "querySelectorAll", "getElementById"]
            answer: 1
          - type: fill
            q: Переключите класс open у меню
            code: |
              menu.classList.___("open");
            answers: ["toggle"]
          - type: bug
