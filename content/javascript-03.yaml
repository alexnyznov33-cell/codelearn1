            options: ["Скрипт загрузится позже всех картинок", "Скрипт выполнится после разбора HTML", "Скрипт не будет кешироваться", "Скрипт выполнится дважды"]
            answer: 1
        homework:
          task: |
            Создайте страницу «Каталог»: в JS массив товаров `{ id, title, price, category }`. Отрисуйте карточки в `<div id="catalog">` через `createElement` (без innerHTML с данными), каждой карточке задайте `data-id`. Добавьте кнопки-фильтры по категориям: активная кнопка получает класс `active`, неподходящие карточки скрываются (`hidden`). Внизу выведите «Показано N из M».
          checklist:
            - Используется querySelector/All
            - Данные вставляются через textContent
            - Фильтр меняет классы, а не пересоздаёт страницу
          solution: |
            const products = [
              { id: 1, title: "Чай", price: 300, category: "напитки" },
              { id: 2, title: "Печенье", price: 150, category: "сладости" },
              { id: 3, title: "Кофе", price: 500, category: "напитки" },
            ];
            const catalog = document.querySelector("#catalog");
            const filters = document.querySelector("#filters");
            const counter = document.querySelector("#counter");

            function render() {
              const frag = document.createDocumentFragment();
              for (const p of products) {
                const card = document.createElement("div");
                card.className = "card";
                card.dataset.id = p.id;
                card.dataset.category = p.category;
                const h = document.createElement("h3");
                h.textContent = p.title;
                const price = document.createElement("p");
                price.textContent = `${p.price} ₽`;
                card.append(h, price);
                frag.append(card);
              }
              catalog.append(frag);
            }
            function applyFilter(cat) {
              let shown = 0;
              catalog.querySelectorAll(".card").forEach((c) => {
                c.hidden = cat !== "все" && c.dataset.category !== cat;
                if (!c.hidden) shown++;
              });
              counter.textContent = `Показано ${shown} из ${products.length}`;
              filters.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.textContent === cat));
            }
            for (const cat of ["все", ...new Set(products.map((p) => p.category))]) {
              const b = document.createElement("button");
              b.textContent = cat;
              b.addEventListener("click", () => applyFilter(cat));
              filters.append(b);
            }
            render();
            applyFilter("все");
      - id: js-03-02
        title: События и делегирование
        minutes: 35
        xp: 35
        theory: |
          Пользователь кликает, печатает, прокручивает — браузер генерирует **события**. На них подписываются обработчиками.

          ```javascript
          const btn = document.querySelector("#buy");
          function onClick(event) {
            console.log("Клик!", event.type, event.target);
          }
          btn.addEventListener("click", onClick);
          btn.removeEventListener("click", onClick);   // нужна та же функция
          btn.addEventListener("click", () => {}, { once: true });  // сработает один раз
          ```

          Популярные события: `click`, `dblclick`, `input`, `change`, `submit`, `keydown`, `focus`/`blur`, `mouseenter`, `scroll`, `DOMContentLoaded`, `load`.

          ## Объект события

          ```javascript
          document.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && e.ctrlKey) save();
          });
          link.addEventListener("click", (e) => {
            e.preventDefault();      // отменить действие по умолчанию (переход по ссылке)
          });
          ```

          - `e.target` — элемент, на котором событие **произошло**.
          - `e.currentTarget` — элемент, на котором висит **обработчик**.

          ## Всплытие (bubbling)

          Событие сначала происходит на целевом элементе, затем **всплывает** вверх по предкам до `document`. Перехват (capturing) идёт в обратном порядке — сверху вниз (`{ capture: true }`). `e.stopPropagation()` останавливает всплытие (используйте редко).

          ## Делегирование

          Вместо обработчика на каждом из 1000 элементов вешаем **один** на общего родителя и смотрим, где был клик:

          ```javascript
          document.querySelector("#todo-list").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const li = btn.closest("li");
            if (btn.dataset.action === "delete") li.remove();
            if (btn.dataset.action === "done") li.classList.toggle("done");
          });
          ```

          Плюсы: меньше памяти, работает для элементов, добавленных **позже**.

          ## Частые события: debounce

          `input` и `scroll` срабатывают десятки раз в секунду. **Debounce** выполняет функцию только после паузы:

          ```javascript
          function debounce(fn, ms) {
            let t;
            return (...args) => {
              clearTimeout(t);
              t = setTimeout(() => fn(...args), ms);
            };
          }
          search.addEventListener("input", debounce((e) => find(e.target.value), 300));
          ```

          **Throttle** — не чаще раза в N мс (для scroll/resize).

          ## Свои события

          `el.dispatchEvent(new CustomEvent("cart:add", { detail: { id: 5 }, bubbles: true }))`.
        practice:
