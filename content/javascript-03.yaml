        homework:
          task: |
            Реализуйте To-Do полностью: добавление, отметка, удаление, редактирование двойным кликом (Enter — сохранить, Esc — отменить), фильтры «Все / Активные / Готовые» с подсветкой, «Очистить выполненные», счётчик, сохранение в localStorage, синхронизация вкладок. Дополнительно: перетаскивание для сортировки (HTML Drag and Drop) и срок выполнения с подсветкой просроченных задач.
          checklist:
            - Состояние отделено от DOM
            - Все обработчики через делегирование
            - Данные переживают перезагрузку
            - Нет XSS при вводе <script>
          solution: |
            const KEY = "todos-v1";
            const $ = (s) => document.querySelector(s);
            const list = $("#list"), form = $("#new"), input = $("#text"), counter = $("#counter");
            let state = JSON.parse(localStorage.getItem(KEY) || "null") ?? { todos: [], filter: "all" };

            function update(fn) { state = fn(state); localStorage.setItem(KEY, JSON.stringify(state)); render(); }
            const mapTodo = (id, f) => (s) => ({ ...s, todos: s.todos.map((t) => (t.id === id ? f(t) : t)) });
            const actions = {
              add: (text) => update((s) => ({ ...s, todos: [...s.todos, { id: crypto.randomUUID(), text, done: false }] })),
              toggle: (id) => update(mapTodo(id, (t) => ({ ...t, done: !t.done }))),
              edit: (id, text) => update(mapTodo(id, (t) => ({ ...t, text }))),
              remove: (id) => update((s) => ({ ...s, todos: s.todos.filter((t) => t.id !== id) })),
              clearDone: () => update((s) => ({ ...s, todos: s.todos.filter((t) => !t.done) })),
              setFilter: (filter) => update((s) => ({ ...s, filter })),
            };
            const visible = (s) => s.todos.filter((t) => (s.filter === "active" ? !t.done : s.filter === "done" ? t.done : true));

            function render() {
              list.replaceChildren(...visible(state).map((t) => {
                const li = document.createElement("li");
                li.dataset.id = t.id;
                li.className = t.done ? "done" : "";
                li.innerHTML = '<input type="checkbox" data-action="toggle"><span class="text"></span><button data-action="remove">✕</button>';
                li.querySelector(".text").textContent = t.text;
                li.querySelector("input").checked = t.done;
                return li;
              }));
              counter.textContent = `Осталось: ${state.todos.filter((t) => !t.done).length}`;
              document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("active", b.dataset.filter === state.filter));
            }

            list.addEventListener("click", (e) => {
              const id = e.target.closest("li")?.dataset.id;
              const a = e.target.dataset.action;
              if (id && a) actions[a](id);
            });
            list.addEventListener("dblclick", (e) => {
              const span = e.target.closest(".text");
              if (!span) return;
              const id = span.closest("li").dataset.id;
              const edit = Object.assign(document.createElement("input"), { value: span.textContent });
              span.replaceWith(edit);
              edit.focus();
              edit.addEventListener("keydown", (k) => {
                if (k.key === "Enter" && edit.value.trim()) actions.edit(id, edit.value.trim());
                if (k.key === "Escape") render();
              });
            });
            form.addEventListener("submit", (e) => {
              e.preventDefault();
              const text = input.value.trim();
              if (text) actions.add(text);
              form.reset();
            });
            document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => actions.setFilter(b.dataset.filter)));
            $("#clear").addEventListener("click", actions.clearDone);
            window.addEventListener("storage", (e) => { if (e.key === KEY) { state = JSON.parse(e.newValue); render(); } });
            render();
