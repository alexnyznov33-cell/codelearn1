        homework:
          task: |
            Напишите аналитические запросы по продажам за год: (1) выручка по месяцам; (2) ABC-подготовка: выручка и доля каждого товара в общей выручке (подзапрос или временная таблица с общим итогом); (3) клиенты, купившие более 3 разных товаров (`КОЛИЧЕСТВО(РАЗЛИЧНЫЕ)` + `ИМЕЮЩИЕ`); (4) средний чек по менеджерам; (5) отчёт по группам номенклатуры с `ИТОГИ ПО ОБЩИЕ, Группа`, выведите результат в дерево значений.
          checklist:
            - Корректные группировки
            - Используется ИМЕЮЩИЕ
            - Результат с итогами выгружен в дерево
          solution: |
            Функция ВыручкаПоМесяцам(Год) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    НАЧАЛОПЕРИОДА(Р.Дата, МЕСЯЦ) КАК Месяц,
                |    СУММА(Р.СуммаДокумента) КАК Выручка
                |ИЗ Документ.РеализацияТоваров КАК Р
                |ГДЕ Р.Проведен И ГОД(Р.Дата) = &Год
                |СГРУППИРОВАТЬ ПО НАЧАЛОПЕРИОДА(Р.Дата, МЕСЯЦ)
                |УПОРЯДОЧИТЬ ПО Месяц");
                Запрос.УстановитьПараметр("Год", Год);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ПостоянныеКлиенты(Начало, Конец) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    Т.Ссылка.Контрагент КАК Клиент,
                |    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Т.Номенклатура) КАК Товаров
                |ИЗ Документ.РеализацияТоваров.Товары КАК Т
                |ГДЕ Т.Ссылка.Проведен И Т.Ссылка.Дата МЕЖДУ &Начало И &Конец
                |СГРУППИРОВАТЬ ПО Т.Ссылка.Контрагент
                |ИМЕЮЩИЕ КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Т.Номенклатура) > 3");
                Запрос.УстановитьПараметр("Начало", Начало);
                Запрос.УстановитьПараметр("Конец", Конец);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция СреднийЧек(Начало, Конец) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Р.Менеджер, СРЕДНЕЕ(Р.СуммаДокумента) КАК СреднийЧек, КОЛИЧЕСТВО(*) КАК Чеков
                |ИЗ Документ.РеализацияТоваров КАК Р
                |ГДЕ Р.Проведен И Р.Дата МЕЖДУ &Начало И &Конец
                |СГРУППИРОВАТЬ ПО Р.Менеджер");
                Запрос.УстановитьПараметр("Начало", Начало);
                Запрос.УстановитьПараметр("Конец", Конец);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ПродажиПоГруппам(Начало, Конец) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    Т.Номенклатура.Родитель КАК Группа,
                |    Т.Номенклатура КАК Номенклатура,
                |    СУММА(Т.Сумма) КАК Сумма
                |ИЗ Документ.РеализацияТоваров.Товары КАК Т
                |ГДЕ Т.Ссылка.Проведен И Т.Ссылка.Дата МЕЖДУ &Начало И &Конец
                |СГРУППИРОВАТЬ ПО Т.Номенклатура.Родитель, Т.Номенклатура
                |ИТОГИ СУММА(Сумма) ПО ОБЩИЕ, Группа");
                Запрос.УстановитьПараметр("Начало", Начало);
                Запрос.УстановитьПараметр("Конец", Конец);
                Возврат Запрос.Выполнить().Выгрузить(ОбходРезультатаЗапроса.ПоГруппировкам);   // ДеревоЗначений
            КонецФункции
      - id: 1c-05-04
        title: Временные таблицы и пакетные запросы
        minutes: 40
        xp: 45
        theory: |
          **Пакетный запрос** — несколько запросов в одном тексте, разделённых `;`. Выполняются за одно обращение. **Временная таблица** (`ПОМЕСТИТЬ`) сохраняет промежуточный результат на время работы **менеджера временных таблиц** — следующие запросы пакета используют её как обычную таблицу.

          ```bsl
          Запрос = Новый Запрос;
          Запрос.МенеджерВременныхТаблиц = Новый МенеджерВременныхТаблиц;
          Запрос.Текст =
          "ВЫБРАТЬ
          |    Т.Номенклатура КАК Номенклатура,
          |    СУММА(Т.Количество) КАК Количество
          |ПОМЕСТИТЬ ВТ_Товары
          |ИЗ
          |    Документ.РеализацияТоваров.Товары КАК Т
          |ГДЕ
          |    Т.Ссылка = &Документ
          |СГРУППИРОВАТЬ ПО
          |    Т.Номенклатура
          |ИНДЕКСИРОВАТЬ ПО
          |    Номенклатура
          |;
          |////////////////////////////////////////////////////////////
          |ВЫБРАТЬ
          |    ВТ.Номенклатура,
          |    ВТ.Количество КАК Нужно,
          |    ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК Есть
          |ИЗ
          |    ВТ_Товары КАК ВТ
          |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(
          |                ,
          |                Склад = &Склад
          |                    И Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Ост
          |        ПО ВТ.Номенклатура = Ост.Номенклатура
          |ГДЕ
          |    ВТ.Количество > ЕСТЬNULL(Ост.КоличествоОстаток, 0)";
          ```

          Обратите внимание: в параметрах виртуальной таблицы `Остатки` мы ограничили выборку **только нужными товарами** — регистр не будет считать остатки по всем позициям.

          ## Результаты пакета

          ```bsl
          Результаты = Запрос.ВыполнитьПакет();          // массив результатов всех запросов
          Нехватка = Результаты[1].Выгрузить();          // результат второго запроса
          // или: Запрос.Выполнить() — вернёт результат ПОСЛЕДНЕГО запроса пакета
          ```

          ## Зачем временные таблицы

          1. **Производительность**: вместо соединения с тяжёлым подзапросом СУБД работает с готовой небольшой индексированной таблицей.
          2. **Повторное использование**: один раз отобрали товары документа — используем в нескольких запросах.
          3. **Читаемость**: сложный запрос разбивается на шаги.
          4. **Передача таблицы значений в запрос**: `ВЫБРАТЬ ... ПОМЕСТИТЬ ВТ ИЗ &ТаблицаТоваров КАК Т` (у колонок должны быть типы).

          ## Правила

          - Индексируйте временные таблицы по полям соединения (`ИНДЕКСИРОВАТЬ ПО`), если в них много строк.
          - Удаляйте ненужные таблицы: `УНИЧТОЖИТЬ ВТ_Товары` (иначе живут до закрытия менеджера).
          - Один менеджер временных таблиц можно передавать между несколькими запросами (например, из проведения в общий модуль).
          - Подзапросы в соединениях — частая причина медленных запросов: выносите их во временные таблицы.
        practice:
