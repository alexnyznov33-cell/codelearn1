        homework:
          task: |
            Напишите процедуру проверки документа реализации перед проведением одним пакетным запросом: (1) товары документа, свёрнутые по номенклатуре, в ВТ с индексом; (2) остатки только по этим товарам и складу документа; (3) цены только по этим товарам; (4) итоговый запрос — строки, где не хватает остатка или цена в документе отличается от прайсовой более чем на 10%. Передайте табличную часть в запрос как параметр (`ИЗ &Товары`). Выведите сообщения по каждой проблеме.
          checklist:
            - Используется МенеджерВременныхТаблиц
            - Виртуальные таблицы ограничены нужными товарами
            - Табличная часть передана параметром
          solution: |
            Процедура ПроверитьДокумент(ДокументОбъект) Экспорт
                Запрос = Новый Запрос;
                Запрос.МенеджерВременныхТаблиц = Новый МенеджерВременныхТаблиц;
                Запрос.Текст =
                "ВЫБРАТЬ
                |    Т.Номенклатура КАК Номенклатура,
                |    Т.Количество КАК Количество,
                |    Т.Цена КАК Цена
                |ПОМЕСТИТЬ ВТ_Строки
                |ИЗ
                |    &Товары КАК Т
                |;
                |ВЫБРАТЬ
                |    С.Номенклатура КАК Номенклатура,
                |    СУММА(С.Количество) КАК Количество,
                |    МАКСИМУМ(С.Цена) КАК Цена
                |ПОМЕСТИТЬ ВТ_Товары
                |ИЗ ВТ_Строки КАК С
                |СГРУППИРОВАТЬ ПО С.Номенклатура
                |ИНДЕКСИРОВАТЬ ПО Номенклатура
                |;
                |ВЫБРАТЬ
                |    ВТ.Номенклатура КАК Номенклатура,
                |    ВТ.Количество КАК Нужно,
                |    ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК Есть,
                |    ВТ.Цена КАК ЦенаДок,
                |    ЕСТЬNULL(Цены.Цена, 0) КАК ЦенаПрайс
                |ИЗ
                |    ВТ_Товары КАК ВТ
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(,
                |            Склад = &Склад И Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Ост
                |        ПО ВТ.Номенклатура = Ост.Номенклатура
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата,
                |            ВидЦены = &ВидЦены И Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Цены
                |        ПО ВТ.Номенклатура = Цены.Номенклатура";
                Запрос.УстановитьПараметр("Товары", ДокументОбъект.Товары.Выгрузить(, "Номенклатура, Количество, Цена"));
                Запрос.УстановитьПараметр("Склад", ДокументОбъект.Склад);
                Запрос.УстановитьПараметр("Дата", ДокументОбъект.Дата);
                Запрос.УстановитьПараметр("ВидЦены", Справочники.ВидыЦен.Розничная);
                Выборка = Запрос.Выполнить().Выбрать();
                Пока Выборка.Следующий() Цикл
                    Если Выборка.Нужно > Выборка.Есть Тогда
                        Сообщить("Не хватает " + Выборка.Номенклатура + ": нужно " + Выборка.Нужно + ", есть " + Выборка.Есть);
                    КонецЕсли;
                    Если Выборка.ЦенаПрайс > 0 И Макс(Выборка.ЦенаДок - Выборка.ЦенаПрайс, Выборка.ЦенаПрайс - Выборка.ЦенаДок) / Выборка.ЦенаПрайс > 0.1 Тогда
                        Сообщить("Цена " + Выборка.Номенклатура + " отличается от прайса более чем на 10%");
                    КонецЕсли;
                КонецЦикла;
            КонецПроцедуры
      - id: 1c-05-05
        title: Виртуальные таблицы регистров
        minutes: 40
        xp: 45
        theory: |
          **Виртуальные таблицы** — «вычисляемые» таблицы, которые платформа строит по физическим таблицам регистров и итогам. Это самый быстрый способ получить остатки, обороты и срезы.

          ## Регистр накопления (остатки)

          | Таблица | Параметры | Поля ресурсов |
          |---|---|---|
          | `.Остатки(Период, Условие)` | на момент | `КоличествоОстаток` |
          | `.Обороты(Начало, Конец, Периодичность, Условие)` | за период | `КоличествоПриход`, `КоличествоРасход`, `КоличествоОборот` |
          | `.ОстаткиИОбороты(Начало, Конец, Периодичность, МетодДополнения, Условие)` | за период | `НачальныйОстаток`, `Приход`, `Расход`, `КонечныйОстаток` |

          ## Регистр сведений (периодический)

          `.СрезПоследних(Период, Условие)` — последние значения на дату; `.СрезПервых(Период, Условие)` — первые после даты.

          ## Главное правило — условия в параметрах

          ```bsl
          // ✅ условие в параметрах: платформа отберёт данные ДО расчёта остатков
          "ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата, Склад = &Склад) КАК Ост"

          // ❌ условие в ГДЕ: сначала рассчитаются остатки по ВСЕМ складам, потом отфильтруются
          "ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата) КАК Ост
          |ГДЕ Ост.Склад = &Склад"
          ```

          Результат одинаковый, скорость — нет. В параметры пишут условия по **измерениям** (и реквизитам для оборотов). Условия по ресурсам (`КоличествоОстаток > 0`) — только в `ГДЕ`.

          ## Граница периода

          В проведении документа остатки нужны **на момент документа**, не включая его собственные движения (или включая — при контроле после записи движений):

          ```bsl
          Запрос.УстановитьПараметр("Момент", Новый Граница(МоментВремени(), ВидГраницы.Исключая));
          // МоментВремени() документа = дата + ссылка: учитывает порядок документов с одинаковой датой
          ```

          Если период не указан — остатки **на текущий момент** (по итогам, максимально быстро).

          ## Периодичность оборотов

          ```bsl
          "ВЫБРАТЬ Об.Период, Об.Номенклатура, Об.КоличествоОборот
          |ИЗ РегистрНакопления.Продажи.Обороты(&Начало, &Конец, Месяц, ) КАК Об"
          ```

          Варианты: `Авто`, `Запись`, `Регистратор`, `День`, `Неделя`, `Месяц`, `Квартал`, `Год`, `Период`. `Регистратор` добавляет поле документа.

          ## Почему это быстро

          Регистр накопления хранит **таблицу итогов** (остатки на начало каждого месяца). Остаток на 15 марта = итог на 1 марта + движения с 1 по 15 марта. Поэтому у тяжёлых регистров администратор периодически **пересчитывает итоги** и может устанавливать «период рассчитанных итогов».

          ## Срез последних в сложных запросах

          `СрезПоследних` на дату каждого документа (цена на дату каждой строки) нельзя получить одним вызовом — используют соединение с физической таблицей по условию `Период <= Дата` + `МАКСИМУМ(Период)` или временные таблицы.
