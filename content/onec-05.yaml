          checklist:
            - Условия по измерениям в параметрах
            - Используются три вида виртуальных таблиц
            - Сделан замер
          solution: |
            Функция Неликвиды(Склад) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    Ост.Номенклатура КАК Номенклатура,
                |    Ост.КоличествоОстаток КАК Остаток
