      - id: 1c-05-06
        title: Конструктор запросов и оптимизация
        minutes: 35
        xp: 45
        theory: |
          ## Конструктор запросов

          В конфигураторе: правой кнопкой в модуле → «Конструктор запроса» (или «Конструктор запроса с обработкой результата»). Вкладки:

          - **Таблицы и поля** — источники, выбранные поля, виртуальные таблицы с параметрами (кнопка «Параметры виртуальной таблицы»).
          - **Связи** — соединения и их условия.
          - **Группировка**, **Условия**, **Дополнительно** (ПЕРВЫЕ, РАЗЛИЧНЫЕ, ДЛЯ ИЗМЕНЕНИЯ), **Объединения/Псевдонимы**, **Порядок**, **Итоги**.
          - **Пакет запросов** и **Временные таблицы**.

          Конструктор генерирует корректный текст, но думать об эффективности нужно самому. Для отладки — **Консоль запросов** (параметры, просмотр результата, время, текст SQL в технологическом журнале).

          ## Чек-лист оптимизации

          1. **Запрос в цикле — главная беда.** 1000 строк × запрос = 1000 обращений к БД. Получите всё одним запросом, затем ищите в таблице/соответствии.
          2. **Условия виртуальных таблиц — в параметрах**, а не в `ГДЕ`.
          3. **Индексы**: условия и соединения по индексированным полям — ссылки, измерения регистров, реквизиты с флагом «Индексировать». Функции над полем (`ГОД(Дата) = 2024`) не дают использовать индекс — лучше `Дата МЕЖДУ &Начало И &Конец`.
          4. **Разыменование составных типов**: `Регистратор.Номер` для регистра с 20 видами документов → 20 левых соединений. Используйте `ВЫРАЗИТЬ(Регистратор КАК Документ.Реализация).Номер` или отдельный запрос.
          5. **Подзапросы в соединениях** → временные таблицы с индексами.
          6. **`ИЛИ` в условиях соединения** → разбить на `ОБЪЕДИНИТЬ ВСЕ`.
          7. **`ПЕРВЫЕ N`** и выборка только нужных полей вместо `ВЫБРАТЬ *`.
          8. **`РАЗЛИЧНЫЕ`** и `СГРУППИРОВАТЬ` без необходимости — лишняя сортировка.
          9. **`Выбрать()` вместо `Выгрузить()`** для больших результатов, которые обходятся один раз.

          ```bsl
          // ❌ запрос в цикле
          Для Каждого Стр Из Товары Цикл
              Запрос.УстановитьПараметр("Товар", Стр.Номенклатура);
              Стр.Остаток = Запрос.Выполнить().Выгрузить().Итог("КоличествоОстаток");
          КонецЦикла;

          // ✅ один запрос + соответствие
          Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
          Остатки = Новый Соответствие;
          Выборка = Запрос.Выполнить().Выбрать();
          Пока Выборка.Следующий() Цикл
              Остатки.Вставить(Выборка.Номенклатура, Выборка.КоличествоОстаток);
          КонецЦикла;
          Для Каждого Стр Из Товары Цикл
              Стр.Остаток = ?(Остатки[Стр.Номенклатура] = Неопределено, 0, Остатки[Стр.Номенклатура]);
          КонецЦикла;
          ```

          ## RLS и производительность

          Ограничения доступа на уровне записей (модуль 8) добавляются к каждому запросу. Для отчётов, где права уже проверены, иногда используют привилегированный режим — осознанно и по стандартам.

          ## Инструменты анализа

          Технологический журнал (события `DBMSSQL`/`DBPOSTGRS`, `SDBL`), ЦУП, анализ планов запросов СУБД, «Анализ запроса» в EDT. Для экзамена «Специалист» важно уметь объяснить, почему запрос медленный.
