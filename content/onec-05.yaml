        homework:
          task: |
            Возьмите (или напишите) «медленную» обработку: для каждой строки табличной части из 500 товаров отдельный запрос остатка, отдельный запрос цены и обращение `Стр.Номенклатура.Родитель.Наименование`. Перепишите её одним пакетным запросом через конструктор (ВТ товаров с индексом, остатки и цены с условиями в параметрах, группа товара через поле запроса). Сравните время и количество запросов (замер производительности). Опишите в комментарии 3 применённых правила оптимизации.
