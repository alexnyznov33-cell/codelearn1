                |    РегистрНакопления.ТоварыНаСкладах.Остатки(, Склад = &Склад) КАК Ост
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.Продажи.Обороты(&Начало, &Конец, , ) КАК Прод
                |        ПО Ост.Номенклатура = Прод.Номенклатура
                |ГДЕ
