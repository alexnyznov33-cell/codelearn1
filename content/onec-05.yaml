id: onec
modules:
  - id: 1c-m5
    title: Язык запросов
    level: Junior+
    lessons:
      - id: 1c-05-01
        title: ВЫБРАТЬ, ИЗ, ГДЕ — основы
        minutes: 40
        xp: 40
        theory: |
          **Язык запросов 1С** похож на SQL, но работает с объектами конфигурации (справочниками, документами, регистрами), а не с таблицами СУБД напрямую. Запросы — основной способ читать данные: быстро и одним обращением к базе.

          ```bsl
          Запрос = Новый Запрос;
          Запрос.Текст =
          "ВЫБРАТЬ
          |    Номенклатура.Ссылка КАК Товар,
          |    Номенклатура.Наименование КАК Наименование,
          |    Номенклатура.Артикул КАК Артикул
          |ИЗ
          |    Справочник.Номенклатура КАК Номенклатура
          |ГДЕ
          |    НЕ Номенклатура.ЭтоГруппа
          |    И НЕ Номенклатура.ПометкаУдаления
          |    И Номенклатура.Наименование ПОДОБНО &Шаблон
          |УПОРЯДОЧИТЬ ПО
          |    Наименование";
          Запрос.УстановитьПараметр("Шаблон", "%чай%");

          Выборка = Запрос.Выполнить().Выбрать();
          Пока Выборка.Следующий() Цикл
              Сообщить(Выборка.Наименование + " (" + Выборка.Артикул + ")");
          КонецЦикла;
          ```

          ## Части запроса

          - `ВЫБРАТЬ [РАЗЛИЧНЫЕ] [ПЕРВЫЕ N]` — какие поля; `КАК` — псевдоним.
          - `ИЗ Справочник.Номенклатура КАК Номенклатура` — источник.
          - `ГДЕ` — условия: `=`, `<>`, `<`, `>`, `МЕЖДУ ... И ...`, `В (&Список)`, `В ИЕРАРХИИ (&Группа)`, `ПОДОБНО "%текст%"`, `ЕСТЬ NULL`, `И`, `ИЛИ`, `НЕ`.
          - `УПОРЯДОЧИТЬ ПО Поле [УБЫВ]`.

          ## Параметры

          Значения передаются **параметрами** `&Имя` — никогда не склеивайте их в текст запроса:

          ```bsl
          Запрос.УстановитьПараметр("Склад", Склад);
          Запрос.УстановитьПараметр("НачалоПериода", НачалоМесяца(Дата));
          Запрос.УстановитьПараметр("Статусы", МассивСтатусов);   // для условия В (&Статусы)
          ```

          ## Разыменование полей

          Через точку можно обращаться к реквизитам связанных объектов: `Реализация.Контрагент.ИНН`. Платформа сама добавит соединение — удобно, но каждый уровень «точки» — дополнительный `LEFT JOIN` в SQL. Не злоупотребляйте, особенно для полей составного типа.

          ## Встроенные функции

          `ЗНАЧЕНИЕ(Перечисление.СтатусыЗаказов.Новый)`, `ДАТАВРЕМЯ(2024, 1, 1)`, `НАЧАЛОПЕРИОДА(Дата, МЕСЯЦ)`, `ГОД(Дата)`, `ПОДСТРОКА(Строка, 1, 3)`, `ЕСТЬNULL(Поле, 0)`, `ВЫБОР КОГДА ... ТОГДА ... ИНАЧЕ ... КОНЕЦ`, `ВЫРАЗИТЬ(Поле КАК Строка(100))`, `ПРЕДСТАВЛЕНИЕ(Поле)`, `ТИПЗНАЧЕНИЯ(Поле)`.

          ## Результат

          - `Выполнить().Выбрать()` — построчный обход (экономно по памяти).
          - `Выполнить().Выгрузить()` — `ТаблицаЗначений`.
          - `Выполнить().Пустой()` — есть ли строки.

          Запросы выполняются **на сервере**. Отладка — консоль запросов (обработка) или конструктор запросов (следующий урок).
        practice:
          - type: fill
            q: Передайте значение в запрос параметром
            code: |
              Запрос.Текст = "ВЫБРАТЬ Ссылка ИЗ Справочник.Склады ГДЕ Наименование = ___Имя";
              Запрос.___("Имя", "Основной");
            answers: ["&", "УстановитьПараметр"]
          - type: choice
            q: Какое условие отберёт товары, в названии которых есть «кофе»?
            options: ["Наименование = \"кофе\"", "Наименование ПОДОБНО \"%кофе%\"", "Наименование В (\"кофе\")", "Наименование СОДЕРЖИТ \"кофе\""]
            answer: 1
          - type: bug
            q: Какая строка — плохая практика?
            code: |
              Запрос = Новый Запрос;
              Запрос.Текст = "ВЫБРАТЬ Ссылка ИЗ Справочник.Контрагенты ГДЕ ИНН = """ + ИНН + """";
              Выборка = Запрос.Выполнить().Выбрать();
            bugLine: 2
            fix: Запрос.Текст = "... ГДЕ ИНН = &ИНН"; Запрос.УстановитьПараметр("ИНН", ИНН);
            explain: Значения передают параметрами — склейка строк ломает кеш планов и небезопасна.
          - type: fill
            q: Обойдите результат запроса построчно
            code: |
              Выборка = Запрос.Выполнить().___();
              Пока Выборка.___() Цикл
                  Сообщить(Выборка.Наименование);
              КонецЦикла;
            answers: ["Выбрать", "Следующий"]
          - type: choice
            q: Как отобрать элементы, входящие в группу «Напитки» на любом уровне вложенности?
            options: ["Родитель = &Группа", "Ссылка В ИЕРАРХИИ (&Группа)", "Родитель ПОДОБНО &Группа", "ЭтоГруппа = ИСТИНА"]
            answer: 1
        homework:
          task: |
            Напишите функции с запросами: (1) список контрагентов с пустым ИНН, не помеченных на удаление; (2) топ-10 самых дорогих товаров из группы (`В ИЕРАРХИИ`); (3) документы реализации за период с суммой больше заданной и статусом из списка (`В (&Статусы)`), упорядоченные по дате убыванию; (4) товары, у которых наименование начинается с заданной буквы, с колонкой «Тип» через `ВЫБОР` (Товар/Услуга по реквизиту ВидНоменклатуры). Все значения — через параметры.
          checklist:
            - Только параметры, без склейки
            - Используются ПЕРВЫЕ, В ИЕРАРХИИ, В, ВЫБОР
            - Есть сортировка
          solution: |
            Функция КонтрагентыБезИНН() Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ К.Ссылка, К.Наименование
                |ИЗ Справочник.Контрагенты КАК К
                |ГДЕ К.ИНН = """" И НЕ К.ПометкаУдаления И НЕ К.ЭтоГруппа");
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ТопДорогих(Группа) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ ПЕРВЫЕ 10 Н.Ссылка, Н.Наименование, Н.Цена
                |ИЗ Справочник.Номенклатура КАК Н
                |ГДЕ Н.Ссылка В ИЕРАРХИИ (&Группа) И НЕ Н.ЭтоГруппа
                |УПОРЯДОЧИТЬ ПО Н.Цена УБЫВ");
                Запрос.УстановитьПараметр("Группа", Группа);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция КрупныеПродажи(Начало, Конец, МинСумма, Статусы) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Р.Ссылка, Р.Дата, Р.Контрагент, Р.СуммаДокумента
                |ИЗ Документ.РеализацияТоваров КАК Р
                |ГДЕ Р.Дата МЕЖДУ &Начало И &Конец
                |    И Р.СуммаДокумента > &МинСумма
                |    И Р.Статус В (&Статусы)
                |    И Р.Проведен
                |УПОРЯДОЧИТЬ ПО Р.Дата УБЫВ");
                Запрос.УстановитьПараметр("Начало", НачалоДня(Начало));
                Запрос.УстановитьПараметр("Конец", КонецДня(Конец));
                Запрос.УстановитьПараметр("МинСумма", МинСумма);
                Запрос.УстановитьПараметр("Статусы", Статусы);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ТоварыНаБукву(Буква) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Н.Наименование,
                |    ВЫБОР
                |        КОГДА Н.ВидНоменклатуры = ЗНАЧЕНИЕ(Перечисление.ВидыНоменклатуры.Услуга) ТОГДА ""Услуга""
                |        ИНАЧЕ ""Товар""
                |    КОНЕЦ КАК Тип
                |ИЗ Справочник.Номенклатура КАК Н
                |ГДЕ Н.Наименование ПОДОБНО &Шаблон И НЕ Н.ЭтоГруппа
                |УПОРЯДОЧИТЬ ПО Н.Наименование");
                Запрос.УстановитьПараметр("Шаблон", Буква + "%");
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции
      - id: 1c-05-02
        title: Соединения таблиц
        minutes: 40
        xp: 45
        theory: |
          **Соединения** объединяют данные нескольких источников по условию.

          | Вид | Что попадает в результат |
          |---|---|
          | `ВНУТРЕННЕЕ СОЕДИНЕНИЕ` | только строки, для которых нашлась пара в обеих таблицах |
          | `ЛЕВОЕ СОЕДИНЕНИЕ` | все строки левой таблицы + пары из правой (или NULL) |
          | `ПРАВОЕ СОЕДИНЕНИЕ` | наоборот (обычно переписывают в левое) |
          | `ПОЛНОЕ СОЕДИНЕНИЕ` | все строки обеих таблиц |

          ```bsl
          "ВЫБРАТЬ
          |    Номенклатура.Ссылка КАК Товар,
          |    ЕСТЬNULL(Остатки.КоличествоОстаток, 0) КАК Остаток,
          |    ЕСТЬNULL(Цены.Цена, 0) КАК Цена
          |ИЗ
          |    Справочник.Номенклатура КАК Номенклатура
          |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(, Склад = &Склад) КАК Остатки
          |        ПО Номенклатура.Ссылка = Остатки.Номенклатура
          |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(, ВидЦены = &ВидЦены) КАК Цены
          |        ПО Номенклатура.Ссылка = Цены.Номенклатура
          |ГДЕ
          |    НЕ Номенклатура.ЭтоГруппа"
          ```

          Все товары (даже без остатков и цен) с остатком и ценой. Без `ЕСТЬNULL` у товаров без остатка будет `NULL`, и арифметика с ним даст `NULL`.

          ## Где писать условие

          При **левом** соединении условие на правую таблицу в `ГДЕ` превращает его во внутреннее:

          ```bsl
          // ❌ потеряем товары без остатков — для них Остатки.Склад = NULL
          "... ЛЕВОЕ СОЕДИНЕНИЕ ... ПО Н.Ссылка = Ост.Номенклатура
          |ГДЕ Ост.Склад = &Склад"

          // ✅ условие в ПО или в параметрах виртуальной таблицы
          "... ЛЕВОЕ СОЕДИНЕНИЕ ... ПО Н.Ссылка = Ост.Номенклатура И Ост.Склад = &Склад"
          ```

          ## Табличные части

          Табличная часть — отдельная таблица `Документ.Реализация.Товары` с полем `Ссылка` на документ:

          ```bsl
          "ВЫБРАТЬ
          |    Товары.Ссылка.Дата КАК Дата,
          |    Товары.Номенклатура,
          |    Товары.Количество
          |ИЗ
          |    Документ.РеализацияТоваров.Товары КАК Товары
          |ГДЕ
          |    Товары.Ссылка = &Документ"
          ```

          ## ОБЪЕДИНИТЬ

          Не соединение, а «склейка» строк нескольких запросов (UNION) — колонки должны совпадать по количеству и смыслу:

          ```bsl
          "ВЫБРАТЬ Поступление.Ссылка, ""Приход"" КАК Вид ИЗ Документ.ПоступлениеТоваров КАК Поступление
          |ОБЪЕДИНИТЬ ВСЕ
          |ВЫБРАТЬ Реализация.Ссылка, ""Расход"" ИЗ Документ.РеализацияТоваров КАК Реализация"
          ```

          `ОБЪЕДИНИТЬ ВСЕ` быстрее `ОБЪЕДИНИТЬ` — не удаляет дубли.

          ## Производительность

          - Соединяйте по **индексированным** полям (ссылки, измерения регистров).
          - Не соединяйте с подзапросами и виртуальными таблицами «как есть» в больших запросах — лучше поместить во временную таблицу с индексом (урок 4).
          - Избегайте условий `ИЛИ` в `ПО` — СУБД может не использовать индексы.
        practice:
          - type: choice
            q: Нужен список ВСЕХ клиентов, включая тех, у кого нет заказов. Какое соединение?
            options: ["ВНУТРЕННЕЕ", "ЛЕВОЕ от клиентов к заказам", "ПРАВОЕ от клиентов к заказам", "ОБЪЕДИНИТЬ"]
            answer: 1
          - type: fill
            q: Замените NULL нулём
            code: |
              ___(Остатки.КоличествоОстаток, 0) КАК Остаток
            answers: ["ЕСТЬNULL"]
          - type: bug
            q: Из-за какой строки пропадут товары без остатков?
            code: |
              ВЫБРАТЬ Н.Ссылка, Ост.КоличествоОстаток
              ИЗ Справочник.Номенклатура КАК Н
                  ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки КАК Ост
                  ПО Н.Ссылка = Ост.Номенклатура
              ГДЕ Ост.Склад = &Склад
            bugLine: 5
            fix: перенести условие в параметры виртуальной таблицы Остатки(, Склад = &Склад)
            explain: Для товаров без остатка Ост.Склад = NULL, условие в ГДЕ их отбросит — соединение станет внутренним.
          - type: choice
            q: Чем ОБЪЕДИНИТЬ ВСЕ отличается от ОБЪЕДИНИТЬ?
            options: ["Ничем", "ОБЪЕДИНИТЬ ВСЕ не удаляет дубликаты и работает быстрее", "ОБЪЕДИНИТЬ ВСЕ соединяет по ключу", "ОБЪЕДИНИТЬ ВСЕ сортирует"]
            answer: 1
          - type: output
            q: "Справочник: 5 товаров. В регистре остатков есть строки по 3 из них. Сколько строк вернёт ЛЕВОЕ соединение товаров с остатками? Введите число."
            code: |
              // ВЫБРАТЬ Н.Ссылка, Ост.КоличествоОстаток
              // ИЗ Справочник.Номенклатура КАК Н
              //   ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(, Склад = &Склад) КАК Ост
              //   ПО Н.Ссылка = Ост.Номенклатура
              Сообщить(5);
            answer: "5"
        homework:
          task: |
            Напишите запрос «Прайс-лист со складом»: все товары группы (В ИЕРАРХИИ) с колонками Артикул, Наименование, РозничнаяЦена, ЗакупочнаяЦена (два левых соединения со срезом последних по разным видам цен), Остаток на складе, Наценка % (через ВЫБОР с защитой от деления на 0). Второй запрос: журнал движения товара — все поступления и реализации (ОБЪЕДИНИТЬ ВСЕ по табличным частям) с датой, документом, видом операции и количеством (расход — с минусом).
          checklist:
            - Левые соединения с ЕСТЬNULL
            - Условия по правым таблицам не в ГДЕ
            - Используется ОБЪЕДИНИТЬ ВСЕ
          solution: |
            Функция ПрайсЛист(Группа, Склад, Дата) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    Н.Артикул,
                |    Н.Наименование,
                |    ЕСТЬNULL(Розн.Цена, 0) КАК РозничнаяЦена,
                |    ЕСТЬNULL(Закуп.Цена, 0) КАК ЗакупочнаяЦена,
                |    ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК Остаток,
                |    ВЫБОР
                |        КОГДА ЕСТЬNULL(Закуп.Цена, 0) = 0 ТОГДА 0
                |        ИНАЧЕ (ЕСТЬNULL(Розн.Цена, 0) - Закуп.Цена) / Закуп.Цена * 100
                |    КОНЕЦ КАК НаценкаПроцент
                |ИЗ
                |    Справочник.Номенклатура КАК Н
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = &Розничная) КАК Розн
                |        ПО Н.Ссылка = Розн.Номенклатура
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = &Закупочная) КАК Закуп
                |        ПО Н.Ссылка = Закуп.Номенклатура
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата, Склад = &Склад) КАК Ост
                |        ПО Н.Ссылка = Ост.Номенклатура
                |ГДЕ
                |    Н.Ссылка В ИЕРАРХИИ (&Группа)
                |    И НЕ Н.ЭтоГруппа
                |УПОРЯДОЧИТЬ ПО
                |    Н.Наименование");
                Запрос.УстановитьПараметр("Группа", Группа);
                Запрос.УстановитьПараметр("Склад", Склад);
                Запрос.УстановитьПараметр("Дата", Дата);
                Запрос.УстановитьПараметр("Розничная", Справочники.ВидыЦен.Розничная);
                Запрос.УстановитьПараметр("Закупочная", Справочники.ВидыЦен.Закупочная);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ЖурналТовара(Товар) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    П.Ссылка.Дата КАК Дата, П.Ссылка КАК Документ, ""Поступление"" КАК Операция, П.Количество КАК Количество
                |ИЗ Документ.ПоступлениеТоваров.Товары КАК П
                |ГДЕ П.Номенклатура = &Товар И П.Ссылка.Проведен
                |
                |ОБЪЕДИНИТЬ ВСЕ
                |
                |ВЫБРАТЬ
                |    Р.Ссылка.Дата, Р.Ссылка, ""Реализация"", -Р.Количество
                |ИЗ Документ.РеализацияТоваров.Товары КАК Р
                |ГДЕ Р.Номенклатура = &Товар И Р.Ссылка.Проведен
                |
                |УПОРЯДОЧИТЬ ПО Дата");
                Запрос.УстановитьПараметр("Товар", Товар);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции
      - id: 1c-05-03
        title: Группировка и агрегатные функции
        minutes: 35
        xp: 40
        theory: |
          **Агрегатные функции** считают итог по группе строк: `СУММА`, `КОЛИЧЕСТВО`, `МАКСИМУМ`, `МИНИМУМ`, `СРЕДНЕЕ`, `КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Поле)`.

          ```bsl
          "ВЫБРАТЬ
          |    Продажи.Ссылка.Контрагент КАК Клиент,
          |    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Продажи.Ссылка) КАК ЧислоДокументов,
          |    СУММА(Продажи.Сумма) КАК Выручка,
          |    МАКСИМУМ(Продажи.Сумма) КАК МаксСтрока
          |ИЗ
          |    Документ.РеализацияТоваров.Товары КАК Продажи
          |ГДЕ
          |    Продажи.Ссылка.Дата МЕЖДУ &Начало И &Конец
          |    И Продажи.Ссылка.Проведен
          |СГРУППИРОВАТЬ ПО
          |    Продажи.Ссылка.Контрагент
          |ИМЕЮЩИЕ
          |    СУММА(Продажи.Сумма) > 10000
          |УПОРЯДОЧИТЬ ПО
          |    Выручка УБЫВ"
          ```

          ## Правила

          - Каждое поле в `ВЫБРАТЬ` — либо в `СГРУППИРОВАТЬ ПО`, либо внутри агрегатной функции.
          - `ГДЕ` фильтрует **строки до** группировки, `ИМЕЮЩИЕ` — **группы после** (условие на агрегат).
          - `СУММА` игнорирует `NULL`; если все значения `NULL` — результат `NULL` (оборачивайте в `ЕСТЬNULL`).
          - `КОЛИЧЕСТВО(*)` — число строк, `КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Поле)` — уникальных значений.

          ## Группировка по периодам

          ```bsl
          "ВЫБРАТЬ
          |    НАЧАЛОПЕРИОДА(Р.Дата, МЕСЯЦ) КАК Месяц,
          |    СУММА(Р.СуммаДокумента) КАК Сумма
          |ИЗ Документ.РеализацияТоваров КАК Р
          |СГРУППИРОВАТЬ ПО НАЧАЛОПЕРИОДА(Р.Дата, МЕСЯЦ)"
          ```

          Для регистров накопления удобнее виртуальная таблица `Обороты(&Начало, &Конец, Месяц)` — периодичность встроена.

          ## ИТОГИ

          Итоги по группировкам прямо в результате запроса (для иерархических отчётов):

          ```bsl
          "ВЫБРАТЬ Т.Номенклатура.Родитель КАК Группа, Т.Номенклатура, СУММА(Т.Сумма) КАК Сумма
          |ИЗ Документ.РеализацияТоваров.Товары КАК Т
          |СГРУППИРОВАТЬ ПО Т.Номенклатура.Родитель, Т.Номенклатура
          |ИТОГИ СУММА(Сумма) ПО ОБЩИЕ, Группа"
          ```

          Обход с итогами — `Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам)` или выгрузка в дерево. В отчётах вместо `ИТОГИ` обычно используют СКД.

          ## Пример расчёта

          | Клиент | Сумма строки |
          |---|---|
          | Альфа | 300 |
          | Бета | 500 |
          | Альфа | 200 |

          `СГРУППИРОВАТЬ ПО Клиент` → Альфа: СУММА 500, КОЛИЧЕСТВО 2; Бета: 500, 1. `ИМЕЮЩИЕ КОЛИЧЕСТВО(*) > 1` оставит только Альфу.
