            - Нет обращений через точку в цикле
            - Есть замеры до и после
          solution: |
            Процедура ЗаполнитьДанныеТоваров(ТаблицаТоваров, Склад, Дата) Экспорт
                // Правила: 1) один пакетный запрос вместо 1000+; 2) условия в параметрах виртуальных таблиц;
                // 3) реквизиты связанных объектов получаем полями запроса, а не через точку в цикле.
                Запрос = Новый Запрос;
                Запрос.МенеджерВременныхТаблиц = Новый МенеджерВременныхТаблиц;
                Запрос.Текст =
                "ВЫБРАТЬ РАЗЛИЧНЫЕ Т.Номенклатура КАК Номенклатура
                |ПОМЕСТИТЬ ВТ_Товары
                |ИЗ &Товары КАК Т
                |ИНДЕКСИРОВАТЬ ПО Номенклатура
                |;
                |ВЫБРАТЬ
                |    ВТ.Номенклатура КАК Номенклатура,
                |    ВТ.Номенклатура.Родитель.Наименование КАК Группа,
                |    ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК Остаток,
                |    ЕСТЬNULL(Цены.Цена, 0) КАК Цена
                |ИЗ
                |    ВТ_Товары КАК ВТ
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата,
                |            Склад = &Склад И Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Ост
                |        ПО ВТ.Номенклатура = Ост.Номенклатура
                |        ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата,
                |            ВидЦены = &ВидЦены И Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Цены
                |        ПО ВТ.Номенклатура = Цены.Номенклатура";
                Запрос.УстановитьПараметр("Товары", ТаблицаТоваров.Скопировать(, "Номенклатура"));
                Запрос.УстановитьПараметр("Склад", Склад);
                Запрос.УстановитьПараметр("Дата", Дата);
                Запрос.УстановитьПараметр("ВидЦены", Справочники.ВидыЦен.Розничная);
                Данные = Новый Соответствие;
                Выборка = Запрос.Выполнить().Выбрать();
                Пока Выборка.Следующий() Цикл
                    Данные.Вставить(Выборка.Номенклатура, Новый Структура("Группа, Остаток, Цена", Выборка.Группа, Выборка.Остаток, Выборка.Цена));
                КонецЦикла;
                Для Каждого Стр Из ТаблицаТоваров Цикл
                    ЗаполнитьЗначенияСвойств(Стр, Данные[Стр.Номенклатура]);
                КонецЦикла;
            КонецПроцедуры
            // До: 1001 запрос, 4.2 с; после: 1 пакет, 0.15 с
