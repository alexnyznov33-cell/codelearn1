          - type: choice
            q: Какая современная альтернатива рефлексии работает с Native AOT?
            options: ["dynamic", "Source Generators", "Activator", "Expression trees"]
            answer: 1
        homework:
          task: |
            Сделайте мини-валидатор: атрибуты `[Required]`, `[Range(min, max)]`, `[MaxLength(n)]` и метод `Validator.Validate(object)` → список ошибок. Кешируйте свойства типов в `ConcurrentDictionary<Type, PropertyInfo[]>`. Дополнительно: `ToDictionary(object)` → `Dictionary<string, object?>` всех публичных свойств.
          checklist:
            - Атрибуты имеют AttributeUsage
            - PropertyInfo кешируются
            - Валидатор работает для любого класса
          solution: |
            using System.Collections.Concurrent;
            using System.Reflection;

            [AttributeUsage(AttributeTargets.Property)] class RequiredAttribute : Attribute { }
            [AttributeUsage(AttributeTargets.Property)] class RangeAttribute(int min, int max) : Attribute
            { public int Min = min, Max = max; }
            [AttributeUsage(AttributeTargets.Property)] class MaxLengthAttribute(int n) : Attribute { public int N = n; }

            static class Validator
            {
                static readonly ConcurrentDictionary<Type, PropertyInfo[]> cache = new();

                public static List<string> Validate(object o)
                {
                    var errs = new List<string>();
                    foreach (var p in cache.GetOrAdd(o.GetType(), t => t.GetProperties()))
                    {
                        var v = p.GetValue(o);
                        if (p.IsDefined(typeof(RequiredAttribute)) && (v is null || v is string { Length: 0 }))
                            errs.Add($"{p.Name}: обязательно");
                        if (p.GetCustomAttribute<RangeAttribute>() is { } r && v is int i && (i < r.Min || i > r.Max))
                            errs.Add($"{p.Name}: вне [{r.Min};{r.Max}]");
                        if (p.GetCustomAttribute<MaxLengthAttribute>() is { } m && v is string s && s.Length > m.N)
                            errs.Add($"{p.Name}: длиннее {m.N}");
                    }
                    return errs;
                }

                public static Dictionary<string, object?> ToDictionary(object o) =>
                    cache.GetOrAdd(o.GetType(), t => t.GetProperties()).ToDictionary(p => p.Name, p => p.GetValue(o));
            }
