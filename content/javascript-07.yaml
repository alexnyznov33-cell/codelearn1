              type PublicUser = ___<User, "password">;
            answers: ["Omit"]
          - type: choice
            q: Что означает K extends keyof T?
            options: ["K наследует класс T", "K — одно из имён свойств T", "K — массив ключей", "K равен T"]
            answer: 1
          - type: bug
            q: Где TypeScript сообщит об ошибке?
            code: |
              type Shape = { kind: "circle"; r: number } | { kind: "square"; side: number };
              function area(s: Shape) {
                if (s.kind === "circle") return Math.PI * s.r ** 2;
                return s.r * s.r;
              }
            bugLine: 4
            fix: return s.side * s.side;
            explain: После проверки kind в этой ветке s — квадрат, у него нет поля r.
        homework:
          task: |
            Напишите типизированные утилиты: `groupBy<T, K extends PropertyKey>(items: T[], key: (item: T) => K): Record<K, T[]>`; `createStore<S>(initial: S)` с методами `get(): S`, `set(patch: Partial<S>)`, `select<K extends keyof S>(key: K): S[K]`; тип `AsyncState<T>` (дискриминированный union: idle/loading/success/error) и функцию `renderState` с исчерпывающей проверкой `never`. Типы `CreateUserDto = Omit<User, "id" | "createdAt">` и `UpdateUserDto = Partial<CreateUserDto>`.
          checklist:
            - Generics с ограничениями
            - Дискриминированный union с never
            - Используются utility types
          solution: |
            function groupBy<T, K extends PropertyKey>(items: T[], key: (item: T) => K): Record<K, T[]> {
              return items.reduce((acc, item) => {
                const k = key(item);
                (acc[k] ??= []).push(item);
                return acc;
              }, {} as Record<K, T[]>);
            }

            function createStore<S extends object>(initial: S) {
              let state = initial;
              return {
                get: (): S => state,
                set: (patch: Partial<S>) => { state = { ...state, ...patch }; },
                select: <K extends keyof S>(key: K): S[K] => state[key],
              };
            }

            type AsyncState<T> =
              | { status: "idle" }
              | { status: "loading" }
              | { status: "success"; data: T }
              | { status: "error"; error: string };

            function renderState<T>(s: AsyncState<T>, show: (d: T) => string): string {
              switch (s.status) {
                case "idle": return "—";
                case "loading": return "Загрузка…";
                case "success": return show(s.data);
                case "error": return `Ошибка: ${s.error}`;
                default: { const n: never = s; return n; }
              }
            }

            interface User { id: number; name: string; email: string; createdAt: Date }
            type CreateUserDto = Omit<User, "id" | "createdAt">;
            type UpdateUserDto = Partial<CreateUserDto>;

            const users: User[] = [
              { id: 1, name: "Анна", email: "a@x.ru", createdAt: new Date() },
              { id: 2, name: "Иван", email: "i@y.ru", createdAt: new Date() },
            ];
            const byDomain = groupBy(users, (u) => u.email.split("@")[1]);
            const store = createStore({ count: 0, title: "Счётчик" });
            store.set({ count: 5 });
            const c: number = store.select("count");
            const patch: UpdateUserDto = { name: "Анна П." };
            console.log(byDomain, c, renderState({ status: "success", data: [1, 2] }, (d) => d.join(",")), patch);
      - id: js-07-03
        title: Типизация функций и классов
        minutes: 40
        xp: 45
        theory: |
          ## Функции

          ```typescript
          function add(a: number, b: number): number { return a + b; }
          const greet = (name: string, greeting = "Привет"): string => `${greeting}, ${name}`;
          function log(message: string, ...tags: string[]): void { console.log(message, tags); }
          function find(id: number, opts?: { strict: boolean }) { /* opts может быть undefined */ }

          type Comparator<T> = (a: T, b: T) => number;      // тип функции
          const byPrice: Comparator<Product> = (a, b) => a.price - b.price;   // типы параметров выведутся
          ```

          Тип результата обычно выводится сам, но для публичных функций полезно указывать его явно — это контракт.

          ## Перегрузки

          ```typescript
          function parse(input: string): number;
          function parse(input: string[]): number[];
          function parse(input: string | string[]): number | number[] {
            return Array.isArray(input) ? input.map(Number) : Number(input);
          }
          const one = parse("5");         // number
          const many = parse(["1", "2"]); // number[]
          ```

          ## Асинхронные функции

          ```typescript
          async function getUser(id: number): Promise<User> {
            const res = await fetch(`/api/users/${id}`);
            if (!res.ok) throw new Error(String(res.status));
            return (await res.json()) as User;     // json() возвращает any — уточняем тип
          }
          ```

          `as` — **утверждение типа**: вы говорите компилятору «поверь мне». Для данных извне надёжнее валидация в рантайме (библиотека **Zod**: `UserSchema.parse(data)` возвращает типизированный объект или бросает ошибку).

          ## Классы

          ```typescript
          interface Repository<T> {
            findById(id: number): Promise<T | undefined>;
            save(entity: T): Promise<void>;
          }

          class InMemoryRepo<T extends { id: number }> implements Repository<T> {
            private items = new Map<number, T>();
            constructor(private readonly name: string) {}       // parameter property: поле + присваивание

            async findById(id: number) { return this.items.get(id); }
            async save(entity: T) { this.items.set(entity.id, entity); }
            protected count(): number { return this.items.size; }  // доступен наследникам
          }

          abstract class Shape {
            abstract area(): number;                 // наследники обязаны реализовать
            describe() { return `Площадь ${this.area().toFixed(1)}`; }
          }
          ```

          Модификаторы: `public` (по умолчанию), `private` (проверка только в TS), `protected`, `readonly`. Настоящая приватность в рантайме — `#field` из JS.

          ## Типизация this и колбэков

          ```typescript
          button.addEventListener("click", (e: MouseEvent) => { /* e.clientX */ });
          const input = document.querySelector<HTMLInputElement>("#email");   // HTMLInputElement | null
          input?.value;
          ```

          Оператор `!` (non-null assertion) — `document.getElementById("app")!` — «точно не null». Используйте, только если уверены.
        practice:
