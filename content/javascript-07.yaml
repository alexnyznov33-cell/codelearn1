id: javascript
modules:
  - id: js-m7
    title: TypeScript
    level: Middle
    lessons:
      - id: js-07-01
        title: Базовые типы и интерфейсы
        minutes: 40
        xp: 45
        theory: |
          **TypeScript** — JavaScript с типами. Компилятор `tsc` проверяет типы **до запуска** и выдаёт обычный JS. Ошибки вроде «undefined is not a function» ловятся в редакторе.

          ```typescript
          let title: string = "Книга";
          let price: number = 499;
          let inStock: boolean = true;
          let tags: string[] = ["js", "ts"];
          let point: [number, number] = [10, 20];       // кортеж
          let anything: unknown = JSON.parse("{}");      // безопасная альтернатива any

          let count = 5;          // вывод типа (inference): number — аннотация не нужна
          // count = "пять";      // ❌ Type 'string' is not assignable to type 'number'
          ```

          ## Объектные типы: interface и type

          ```typescript
          interface User {
            id: number;
            name: string;
            email?: string;                // необязательное поле
            readonly createdAt: Date;      // только чтение
          }

          type Product = {
            id: number;
            title: string;
            price: number;
          };

          const u: User = { id: 1, name: "Анна", createdAt: new Date() };
          // u.createdAt = new Date();     // ❌ readonly
          ```

          `interface` можно расширять (`extends`) и «дополнять» повторным объявлением; `type` умеет объединения, пересечения и сложные конструкции. В обычном коде подходят оба — выберите один стиль для проекта.

          ```typescript
          interface Admin extends User { permissions: string[] }
          type WithTimestamps = { createdAt: Date; updatedAt: Date };
          type Post = { id: number; title: string } & WithTimestamps;   // пересечение
          ```

          ## Индексные сигнатуры и Record

          ```typescript
          const prices: Record<string, number> = { чай: 300, кофе: 500 };
          interface Dict { [key: string]: number }
          ```

          ## any, unknown, never

          - `any` — отключает проверку. Избегайте: это «дыра» в типах.
          - `unknown` — «что-то неизвестное»: прежде чем использовать, нужно сузить тип проверкой (`typeof x === "string"`).
          - `never` — значение, которого не бывает (функция, которая всегда бросает исключение).

          ## Литеральные типы и enum

          ```typescript
          type Status = "new" | "paid" | "shipped";      // только эти строки
          let s: Status = "paid";
          enum Direction { Up, Down }                     // enum генерирует JS-код; часто хватает union строк
          const ROLES = ["user", "admin"] as const;       // readonly ["user", "admin"]
          type Role = (typeof ROLES)[number];             // "user" | "admin"
          ```

          Запуск: `npx tsc --init` создаёт `tsconfig.json`; `npx tsc` компилирует; в Node 22+ и через `tsx` можно запускать `.ts` напрямую.
        practice:
          - type: choice
            q: Чем unknown безопаснее any?
            options: ["Ничем", "С unknown нельзя работать без проверки/сужения типа", "unknown быстрее", "any нельзя присвоить переменной"]
            answer: 1
          - type: fill
            q: Сделайте поле email необязательным
            code: |
              interface User {
                name: string;
                email___: string;
              }
            answers: ["?"]
          - type: bug
            q: На какой строке TypeScript покажет ошибку?
            code: |
              type Status = "new" | "paid";
              let s: Status = "new";
              s = "paid";
              s = "cancelled";
            bugLine: 4
            fix: добавить "cancelled" в тип Status или использовать допустимое значение
            explain: Литеральный union разрешает только перечисленные строки.
          - type: choice
            q: Какой тип у переменной let n = 10 без аннотации?
            options: ["any", "number", "10", "unknown"]
            answer: 1
          - type: fill
            q: Опишите словарь «строка → число»
            code: |
              const stock: ___<string, number> = { чай: 5 };
            answers: ["Record"]
        homework:
          task: |
            Опишите типы для интернет-магазина: `Product` (id, title, price, category — union из 3 значений, tags — массив строк, discount? — необязательный), `CartItem` (product + qty), `Customer` (readonly id, name, email?, address — вложенный объект), `Order` (id, customer, items, status — union, createdAt). Создайте тестовые данные и напишите функцию `orderTotal(order: Order): number`. Убедитесь, что опечатки в полях и неверные статусы подсвечиваются компилятором. Включите `"strict": true`.
          checklist:
            - Нет any
            - Используются union, optional и readonly
            - strict-режим включён
          solution: |
            type Category = "книги" | "электроника" | "одежда";
            type OrderStatus = "new" | "paid" | "shipped" | "cancelled";

            interface Product {
              id: number;
              title: string;
              price: number;
              category: Category;
              tags: string[];
              discount?: number;      // 0..1
            }
            interface CartItem { product: Product; qty: number }
            interface Address { city: string; street: string; zip?: string }
            interface Customer {
              readonly id: number;
              name: string;
              email?: string;
              address: Address;
            }
            interface Order {
              id: number;
              customer: Customer;
              items: CartItem[];
              status: OrderStatus;
              createdAt: Date;
            }

            function orderTotal(order: Order): number {
              return order.items.reduce((sum, { product, qty }) => {
                const price = product.price * (1 - (product.discount ?? 0));
                return sum + price * qty;
              }, 0);
            }

            const book: Product = { id: 1, title: "TS для всех", price: 1000, category: "книги", tags: ["ts"], discount: 0.1 };
            const order: Order = {
              id: 100,
              customer: { id: 1, name: "Анна", address: { city: "Казань", street: "Баумана, 1" } },
              items: [{ product: book, qty: 2 }],
              status: "paid",
              createdAt: new Date(),
            };
            console.log(orderTotal(order)); // 1800
            // order.status = "lost";      // ❌ ошибка компиляции
      - id: js-07-02
        title: Union, generics, utility types
        minutes: 45
        xp: 50
        theory: |
          ## Union и сужение типов

          ```typescript
          function format(value: string | number): string {
            if (typeof value === "number") return value.toFixed(2);   // здесь value: number
            return value.trim();                                      // здесь value: string
          }
          ```

          Способы сужения: `typeof`, `instanceof`, `in` (`"email" in user`), сравнение с литералом, проверки на `null`, свои **type guards**:

          ```typescript
          function isProduct(x: unknown): x is Product {
            return typeof x === "object" && x !== null && "price" in x;
          }
          ```

          ## Дискриминированные объединения

          ```typescript
          type Result =
            | { status: "loading" }
            | { status: "success"; data: string[] }
            | { status: "error"; message: string };

          function render(r: Result) {
            switch (r.status) {
              case "loading": return "Загрузка...";
              case "success": return r.data.join(", ");     // data доступна только здесь
              case "error":   return "Ошибка: " + r.message;
              default: {
                const never: never = r;   // компилятор проверит, что все варианты обработаны
                return never;
              }
            }
          }
          ```

          ## Generics — обобщённые типы

          ```typescript
          function first<T>(arr: T[]): T | undefined {
            return arr[0];
          }
          first([1, 2, 3]);        // number | undefined
          first(["a"]);            // string | undefined

          interface ApiResponse<T> { data: T; error?: string }
          const r: ApiResponse<User[]> = { data: [] };

          function pluck<T, K extends keyof T>(items: T[], key: K): T[K][] {
            return items.map((i) => i[key]);
          }
          pluck(users, "name");    // string[]
          // pluck(users, "nmae"); // ❌ такого ключа нет
          ```

          `K extends keyof T` — **ограничение**: K может быть только именем поля T.

          ## Utility types

          | Тип | Что делает |
          |---|---|
          | `Partial<T>` | все поля необязательные (для PATCH-обновлений) |
          | `Required<T>` | все обязательные |
          | `Readonly<T>` | все только для чтения |
          | `Pick<T, "a" \| "b">` | только выбранные поля |
          | `Omit<T, "password">` | все, кроме указанных |
          | `Record<K, V>` | словарь |
          | `ReturnType<typeof fn>` | тип результата функции |
          | `Parameters<typeof fn>` | кортеж параметров |
          | `Awaited<Promise<T>>` | T |
          | `NonNullable<T>` | без null/undefined |

          ```typescript
          type PublicUser = Omit<User, "password">;
          type UserUpdate = Partial<Pick<User, "name" | "email">>;
          ```

          ## keyof, typeof, mapped types

          ```typescript
          const config = { theme: "dark", lang: "ru" };
          type Config = typeof config;              // { theme: string; lang: string }
          type ConfigKey = keyof Config;            // "theme" | "lang"
          type Flags<T> = { [K in keyof T]: boolean };   // mapped type
          ```
        practice:
          - type: fill
