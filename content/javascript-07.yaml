          - type: choice
            q: "Что делает constructor(private readonly name: string) {}?"
            options: ["Ничего", "Объявляет приватное readonly-поле name и присваивает его", "Создаёт геттер", "Объявляет статическое поле"]
            answer: 1
          - type: choice
