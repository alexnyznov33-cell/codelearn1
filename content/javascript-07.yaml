        homework:
          task: |
            Переведите свой Vite-проект To-Do на TypeScript: `tsconfig` со `strict` и `noUncheckedIndexedAccess`, типы `Todo`, `Filter`, `State`, типизированные действия (дискриминированный union `Action` и редьюсер), `env.d.ts` для переменных окружения, Zod-схема для данных из localStorage (повреждённые данные → состояние по умолчанию). Добавьте `typecheck` в scripts и в CI.
          checklist:
            - Нет any и @ts-ignore
            - Данные из localStorage проверяются схемой
            - tsc --noEmit проходит в CI
          solution: |
            // src/types.ts
            export type Filter = "all" | "active" | "done";
            export interface Todo { id: string; text: string; done: boolean }
            export interface State { todos: Todo[]; filter: Filter }
            export type Action =
              | { type: "add"; text: string }
              | { type: "toggle"; id: string }
              | { type: "remove"; id: string }
              | { type: "filter"; filter: Filter };

            // src/reducer.ts
            import type { State, Action } from "./types";
            export function reducer(s: State, a: Action): State {
              switch (a.type) {
                case "add": return { ...s, todos: [...s.todos, { id: crypto.randomUUID(), text: a.text, done: false }] };
                case "toggle": return { ...s, todos: s.todos.map((t) => (t.id === a.id ? { ...t, done: !t.done } : t)) };
                case "remove": return { ...s, todos: s.todos.filter((t) => t.id !== a.id) };
                case "filter": return { ...s, filter: a.filter };
                default: { const never: never = a; return never; }
              }
            }

            // src/storage.ts
            import { z } from "zod";
            import type { State } from "./types";
            const StateSchema = z.object({
              todos: z.array(z.object({ id: z.string(), text: z.string(), done: z.boolean() })),
              filter: z.enum(["all", "active", "done"]),
            });
            const DEFAULT: State = { todos: [], filter: "all" };
            export function load(): State {
              try {
                const parsed = StateSchema.safeParse(JSON.parse(localStorage.getItem("todos") ?? "null"));
                return parsed.success ? parsed.data : DEFAULT;
              } catch { return DEFAULT; }
            }

            // src/env.d.ts
            interface ImportMetaEnv { readonly VITE_APP_TITLE: string }
            interface ImportMeta { readonly env: ImportMetaEnv }

            // package.json: "typecheck": "tsc --noEmit"
