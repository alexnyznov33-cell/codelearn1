            q: Какой utility type подходит для тела PATCH-запроса, где любые поля необязательны?
            options: ["Required<User>", "Partial<User>", "Readonly<User>", "Record<User>"]
            answer: 1
          - type: fill
            q: Тип пользователя без поля password
