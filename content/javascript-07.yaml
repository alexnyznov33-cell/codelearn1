            explain: Неабстрактный наследник обязан реализовать абстрактные методы.
        homework:
          task: |
            Переведите классы магазина (Product, DiscountedProduct, Cart) из модуля 4 на TypeScript: интерфейс `Priced`, абстрактный класс `BaseProduct`, обобщённый `Repository<T extends { id: string }>` с реализацией `InMemoryRepository`, сервис `OrderService` с внедрением репозитория через конструктор. Добавьте Zod-схему для `CreateOrderDto` и функцию, которая принимает `unknown` (как из JSON) и возвращает валидный типизированный объект или ошибки.
          checklist:
            - Используются interface, abstract, generics
            - Модификаторы доступа
            - Данные извне валидируются в рантайме
          solution: |
            import { z } from "zod";

            interface Priced { readonly price: number }
            abstract class BaseProduct implements Priced {
              constructor(public readonly id: string, public title: string, protected basePrice: number) {}
              abstract get price(): number;
            }
            class Product extends BaseProduct { get price() { return this.basePrice; } }
            class DiscountedProduct extends BaseProduct {
              constructor(id: string, title: string, basePrice: number, private percent: number) { super(id, title, basePrice); }
              get price() { return Math.round(this.basePrice * (1 - this.percent / 100)); }
            }

            interface Repository<T extends { id: string }> {
              get(id: string): T | undefined;
              save(item: T): void;
              all(): T[];
            }
            class InMemoryRepository<T extends { id: string }> implements Repository<T> {
              private items = new Map<string, T>();
              get(id: string) { return this.items.get(id); }
              save(item: T) { this.items.set(item.id, item); }
              all() { return [...this.items.values()]; }
            }

            const CreateOrderDto = z.object({
              customer: z.string().min(2),
              items: z.array(z.object({ productId: z.string(), qty: z.number().int().positive() })).min(1),
            });
            type CreateOrderDto = z.infer<typeof CreateOrderDto>;

            class OrderService {
              constructor(private readonly products: Repository<BaseProduct>) {}
              parse(input: unknown): CreateOrderDto { return CreateOrderDto.parse(input); }  // бросит ZodError
              total(dto: CreateOrderDto): number {
                return dto.items.reduce((s, i) => {
                  const p = this.products.get(i.productId);
                  if (!p) throw new Error(`Нет товара ${i.productId}`);
                  return s + p.price * i.qty;
                }, 0);
              }
            }

            const repo = new InMemoryRepository<BaseProduct>();
            repo.save(new Product("p1", "Чай", 300));
            repo.save(new DiscountedProduct("p2", "Кофе", 1000, 20));
            const svc = new OrderService(repo);
            const dto = svc.parse(JSON.parse('{"customer":"Анна","items":[{"productId":"p1","qty":2},{"productId":"p2","qty":1}]}'));
            console.log(svc.total(dto)); // 1400
      - id: js-07-04
        title: TypeScript в проекте
        minutes: 35
        xp: 45
        theory: |
          ## tsconfig.json

          ```json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "noImplicitOverride": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "jsx": "react-jsx",
              "outDir": "dist",
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] }
            },
            "include": ["src"]
          }
          ```

          - **`strict: true`** — обязательно в новых проектах: включает `strictNullChecks` (null и undefined — отдельные типы), `noImplicitAny` и др.
          - `noUncheckedIndexedAccess` — `arr[i]` имеет тип `T | undefined`: заставляет проверять выход за границы.
          - `paths` — алиасы импорта `@/components/Button`.

          ## Как запускать

          - **Vite** (`npm create vite@latest -- --template react-ts`) — транспилирует TS через esbuild, **без проверки типов** для скорости. Типы проверяются в редакторе и отдельной командой `tsc --noEmit` (добавьте в CI).
          - **Node.js**: `tsx src/index.ts` для разработки, `tsc` → `node dist/index.js` в продакшене. Node 22.6+ умеет запускать `.ts` с флагом `--experimental-strip-types`.

          ## Типы для библиотек

          Многие пакеты содержат типы сами. Для остальных — пакеты `@types/...`: `npm i -D @types/node @types/express`. Свои объявления — файлы `.d.ts`:

          ```typescript
          // src/env.d.ts
          interface ImportMetaEnv { readonly VITE_API_URL: string }
          declare module "*.svg" { const url: string; export default url; }
          ```

          ## Миграция JS → TS

          1. Добавить `tsconfig` с `allowJs: true`, `checkJs: false`.
          2. Переименовывать файлы `.js` → `.ts` по одному, начиная с утилит без зависимостей.
          3. Временно допускается `any`, но с комментарием `// TODO`.
          4. Включить `strict`, исправить ошибки, запретить `any` правилом линтера `@typescript-eslint/no-explicit-any`.

          ## Типы на границах системы

          Самые ценные типы — у данных, приходящих извне: API, формы, localStorage, переменные окружения. Схемы Zod/Valibot дают и проверку в рантайме, и тип (`z.infer`). Типы API можно **генерировать** из OpenAPI (`openapi-typescript`) или делить между фронтом и бэком в монорепозитории (tRPC).

          ## Полезные приёмы

          - `satisfies` — проверить соответствие типу, сохранив точный вывод: `const routes = { home: "/" } satisfies Record<string, string>;`
          - `as const` — литеральные и readonly типы для конфигов.
          - Не пишите типы, которые компилятор выводит сам — меньше шума.
