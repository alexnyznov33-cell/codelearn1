        homework:
          task: |
            Напишите функции: `is_valid_email(s)`, `normalize_phone(s)` — приводит `8 (999) 123-45-67`, `+7 999 1234567` к `+79991234567` (или None), `extract_hashtags(text)` и `mask_cards(text)` — заменяет номера карт из 16 цифр (возможно с пробелами по 4) на `**** **** **** 1234`.
          checklist:
            - Шаблоны в сырых строках
            - Используются группы
          solution: |
            import re

            def is_valid_email(s):
                return re.fullmatch(r"[\w.+-]+@[\w-]+(\.[\w-]+)+", s) is not None

            def normalize_phone(s):
                digits = re.sub(r"\D", "", s)
                if len(digits) == 11 and digits[0] in "78":
                    return "+7" + digits[1:]
                return None

            def extract_hashtags(text):
                return re.findall(r"#(\w+)", text)

            def mask_cards(text):
                return re.sub(r"\b(?:\d{4}[ ]?){3}(\d{4})\b", r"**** **** **** \1", text)

            print(is_valid_email("a.b@mail.ru"), normalize_phone("8 (999) 123-45-67"))
            print(extract_hashtags("Учу #python и #regex"), mask_cards("Карта 1234 5678 9012 3456"))
