          solution: |
            // apps/api/src/bookings/booking.service.ts
            import { prisma } from "../db";
            import { BookingCreate } from "@masterclass/shared";
            export class ConflictError extends Error { status = 409; expose = true; }

            export async function createBooking(userId: number, input: unknown) {
              const { eventId, seats } = BookingCreate.parse(input);
              return prisma.$transaction(async (tx) => {
                const updated = await tx.event.updateMany({
                  where: { id: eventId, seatsLeft: { gte: seats }, status: "PUBLISHED", startsAt: { gt: new Date() } },
                  data: { seatsLeft: { decrement: seats } },
                });
                if (updated.count === 0) throw new ConflictError("Мест не осталось или событие недоступно");
                return tx.booking.create({ data: { eventId, userId, seats } });
              });
            }

            export async function cancelBooking(userId: number, bookingId: number) {
              return prisma.$transaction(async (tx) => {
                const b = await tx.booking.findFirst({ where: { id: bookingId, userId, cancelledAt: null } });   // проверка владельца
                if (!b) throw Object.assign(new Error("Запись не найдена"), { status: 404, expose: true });
                await tx.booking.update({ where: { id: b.id }, data: { cancelledAt: new Date() } });
                await tx.event.update({ where: { id: b.eventId }, data: { seatsLeft: { increment: b.seats } } });
              });
            }

            // apps/web/src/features/booking/useBook.ts
            import { useMutation, useQueryClient } from "@tanstack/react-query";
            export function useBook(eventId: number) {
              const qc = useQueryClient();
              return useMutation({
                mutationFn: (seats: number) => api("/bookings", { method: "POST", body: { eventId, seats } }),
                onSuccess: () => {
                  qc.invalidateQueries({ queryKey: ["event", eventId] });
                  qc.invalidateQueries({ queryKey: ["my-bookings"] });
                },
              });
            }

            // e2e/booking.spec.ts (Playwright)
            import { test, expect } from "@playwright/test";
            test("участник записывается на мастер-класс", async ({ page }) => {
              await page.goto("/login");
              await page.getByLabel("Email").fill("user@demo.ru");
              await page.getByLabel("Пароль").fill("demo12345");
              await page.getByRole("button", { name: "Войти" }).click();
              await page.goto("/events/1");
              await page.getByRole("button", { name: "Записаться" }).click();
              await expect(page.getByText("Вы записаны")).toBeVisible();
            });
