            Реализуйте итоговый проект по требованиям урока и опубликуйте его (GitHub + деплой). Минимальный объём: 6+ моделей БД, 20+ эндпоинтов, 8+ страниц, 40+ тестов (unit + API + 3 e2e на Playwright: регистрация, запись на мастер-класс, создание события организатором). Дополнительно: загрузка изображений в S3-совместимое хранилище, уведомления по email (очередь BullMQ + Redis), SSR главной страницы, i18n (ru/en).
