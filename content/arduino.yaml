  - title: 'EEPROM: настройки между перезапусками'
    minutes: 25
    xp: 30
    theory: |
      ## Постоянная память
      Uno R3 имеет 1 КБ EEPROM. Она сохраняет данные без питания, но число циклов записи ограничено (для ATmega328P обычно не менее 100 000 на ячейку по даташиту). Нельзя записывать значение на каждой итерации loop.

      `EEPROM.read(address)` читает байт. `EEPROM.update(address, value)` записывает только если байт отличается. `put/get` удобны для структур, но требуется версия формата и проверка валидности. На ESP32 вместо этой схемы курса используем Preferences/NVS.

      В примере адрес 0 хранит яркость 0…200; значение 255 у новой EEPROM считается признаком отсутствия настройки. При команде `s` сохраняем 128. Нестандартные значения сбрасываем к 128. LED подключён к D9 через 330 Ом. Сохранение по отдельной команде снижает износ; отключение питания посреди записи всё ещё может повредить более сложные данные.

      ## Пример

      ```cpp
      #include <EEPROM.h>
      byte brightness = 128;
      void setup() {
        Serial.begin(9600);
        pinMode(9, OUTPUT);
        byte saved = EEPROM.read(0);
        if (saved <= 200) brightness = saved;
        analogWrite(9, brightness);
      }
      void loop() {
        if (Serial.available() > 0 && Serial.read() == 's') {
          brightness = 128;
          EEPROM.update(0, brightness);
          analogWrite(9, brightness);
          Serial.println("Saved");
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
