        }
        void loop() {
          digitalWrite(LED_BUILTIN, HIGH);
          delay(500);
          digitalWrite(LED_BUILTIN, LOW);
          delay(500);
        }
    id: arduino-01-02
  - title: Кнопка и INPUT_PULLUP
    minutes: 25
    xp: 30
    theory: |
      ## Цифровой вход
      Неподключённый вход может «плавать»: значение не определено. Режим `INPUT_PULLUP` подключает внутреннюю подтяжку к питанию. Для Uno соедините кнопку между D2 и GND; внешний резистор для этой схемы не нужен. У четырёхконтактной кнопки выводы попарно соединены — проверьте её устройство.

      При отпущенной кнопке читаем HIGH, при нажатой — LOW. Это **активный низкий уровень**. `digitalRead()` читает вход; сравнение `== LOW` превращает состояние в логическое `pressed`.

      Контакты дребезжат: одно нажатие может породить несколько переходов. Управление LED по текущему уровню допустимо; для счётчика нажатий потребуются фильтрация и обнаружение фронта. Не подавайте на вход напряжение выше разрешённого для платы.

      ## Пример

      ```cpp
      const byte BUTTON = 2;
      void setup() {
        pinMode(BUTTON, INPUT_PULLUP);
        pinMode(LED_BUILTIN, OUTPUT);
      }
      void loop() {
        bool pressed = digitalRead(BUTTON) == LOW;
        digitalWrite(LED_BUILTIN, pressed ? HIGH : LOW);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Что вернёт `digitalRead()` при нажатии кнопки между D2 и GND с INPUT_PULLUP?
      options:
      - HIGH
      - LOW
      - Всегда 255
      - Случайную строку
      answer: 1
      explain: Нажатие соединяет вход с землёй.
    - type: choice
      q: Зачем подтяжка входа?
      options:
      - Для определённого уровня при разомкнутой кнопке
      - Для питания двигателя
      - Для сохранения переменных
      - Для PWM
      answer: 0
      explain: Без подтяжки разомкнутый вход может плавать.
    - type: fill
      q: Выберите режим внутренней подтяжки.
      code: |
        pinMode(2, ___);
      answers:
      - INPUT_PULLUP
      explain: Подтяжка делает отпущенное состояние HIGH.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        bool pressed = (LOW == LOW);
        Serial.println(pressed ? "pressed" : "released");
      answer: pressed
      explain: Условие истинно, выбран первый операнд тернарного выражения.
    - type: bug
      q: Найдите неверную проверку нажатия для этой схемы.
      code: |
        pinMode(2, INPUT_PULLUP);
        bool pressed = digitalRead(2) == HIGH;
        digitalWrite(LED_BUILTIN, pressed ? HIGH : LOW);
      bugLine: 2
      fix: bool pressed = digitalRead(2) == LOW;
      explain: При нажатии вход соединён с GND.
    homework:
      task: Подключите кнопку между D2 и GND без питания. Сделайте так, чтобы встроенный LED горел только при нажатии.
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
      - Перед изменением проводов отключите питание. Сначала проверьте скетч кнопкой «Проверить» в Arduino IDE.
      checklist:
      - Могу объяснить назначение setup() и loop() в этом скетче.
      - Скетч скомпилирован для указанной платы; на оборудовании проверено поведение, если плата доступна.
      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
        const byte BUTTON = 2;
        void setup() {
          pinMode(BUTTON, INPUT_PULLUP);
          pinMode(LED_BUILTIN, OUTPUT);
        }
        void loop() {
          bool pressed = digitalRead(BUTTON) == LOW;
          digitalWrite(LED_BUILTIN, pressed ? HIGH : LOW);
        }
    id: arduino-01-03
- id: arduino-m2
  title: Аналоговые сигналы и время
  level: Junior
  lessons:
  - title: Аналоговый вход и потенциометр
    minutes: 25
    xp: 30
    theory: |
      ## analogRead на Uno
      АЦП Uno R3 по умолчанию возвращает целое 0…1023 (10 бит). При стандартной опоре диапазон входа примерно 0…5 В. Точное преобразование в вольты зависит от реального опорного напряжения: `raw * 5.0 / 1023.0` — учебная оценка, не измерительный прибор.

      Для потенциометра около 10 кОм соедините крайние выводы с 5V и GND, средний (движок) — с A0. Отключите питание при сборке. Не подключайте к A0 напряжение выше питания или ниже GND.

      Serial Plotter позволяет видеть меняющийся сигнал. Задержка 100 мс ограничивает частоту вывода десятью измерениями в секунду. Обратите внимание на дробное деление: целочисленное деление потеряло бы дробную часть.

      ## Пример

      ```cpp
      void setup() {
        Serial.begin(9600);
      }
      void loop() {
        int raw = analogRead(A0);
        float volts = raw * 5.0 / 1023.0;
        Serial.print(raw);
        Serial.print(" ");
        Serial.println(volts, 2);
        delay(100);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Диапазон стандартного analogRead на Uno R3?
      options:
      - 0…255
      - 0…1023
      - 0…4095
      - Только 0 и 1
      answer: 1
      explain: 10 бит дают 1024 значения.
    - type: choice
      q: Куда подключить движок потенциометра?
      options:
      - A0
      - Только GND
      - К USB D+
      - К VIN без ограничений
      answer: 0
      explain: АЦП измеряет напряжение на движке.
    - type: fill
      q: Считайте аналоговый вход A0.
      code: |
        int raw = ___(A0);
      answers:
      - analogRead
      explain: digitalRead не измеряет аналоговое значение.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        int raw = 1023;
        Serial.println(raw * 5.0 / 1023.0, 1);
      answer: '5.0'
      explain: Вывод с одним знаком после точки.
    - type: bug
      q: Где теряется дробная часть при расчёте доли шкалы?
      code: |
        int raw = 512;
        float fraction = raw / 1023;
        Serial.println(fraction);
      bugLine: 2
      fix: float fraction = raw / 1023.0;
      explain: Два целых операнда делятся целочисленно до присваивания float.
    homework:
      task: Соберите потенциометр на A0 и выводите сырое значение и оценку напряжения с двумя знаками. Проверьте
        оба крайних положения.
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
      - Перед изменением проводов отключите питание. Сначала проверьте скетч кнопкой «Проверить» в Arduino IDE.
      checklist:
      - Могу объяснить назначение setup() и loop() в этом скетче.
      - Скетч скомпилирован для указанной платы; на оборудовании проверено поведение, если плата доступна.
      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
        void setup() {
          Serial.begin(9600);
        }
        void loop() {
          int raw = analogRead(A0);
          float volts = raw * 5.0 / 1023.0;
          Serial.print(raw);
          Serial.print(" ");
          Serial.println(volts, 2);
          delay(100);
        }
    id: arduino-02-01
  - title: 'PWM: регулировка яркости'
    minutes: 25
    xp: 30
    theory: |
      ## PWM не равен аналоговому напряжению
      На Uno `analogWrite()` обычно создаёт импульсы PWM: выход быстро переключается между LOW и HIGH. Средняя яркость определяется долей времени HIGH (duty cycle). Значение 0…255: 0 — выключено, 255 — постоянно включено.

      PWM поддерживают пины Uno R3 **3, 5, 6, 9, 10, 11** (отмечены ~). Выберем D9: D9 → резистор 330 Ом → LED → GND. Потенциометр подключён к A0, как в прошлом уроке. `map(raw, 0, 1023, 0, 255)` преобразует диапазон; `map()` работает с целыми числами.

      Не используйте GPIO для силовой нагрузки. Мотор или мощная лента требуют отдельного питания и подходящего драйвера/MOSFET, общей земли и защиты. Здесь регулируем только один маломощный светодиод.

      ## Пример

      ```cpp
      const byte LED = 9;
      void setup() {
        pinMode(LED, OUTPUT);
      }
      void loop() {
        int raw = analogRead(A0);
        int brightness = map(raw, 0, 1023, 0, 255);
        analogWrite(LED, brightness);
        delay(10);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Что в основном меняет analogWrite на Uno?
      options:
      - Долю времени высокого уровня PWM
      - Напряжение питания USB
      - Размер flash
      - Скорость Serial
      answer: 0
      explain: PWM — импульсный сигнал.
    - type: choice
      q: Какой пин Uno R3 поддерживает PWM?
      options:
      - D9
      - A0 как обычный аналоговый вход
      - D2
      - D13
      answer: 0
      explain: D9 — один из шести PWM-пинов Uno.
    - type: fill
      q: Преобразуйте диапазон АЦП в диапазон PWM.
      code: |
        int brightness = map(raw, 0, 1023, 0, ___);
      answers:
      - '255'
      explain: На Uno PWM использует диапазон 0…255.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        Serial.println(map(1023, 0, 1023, 0, 255));
      answer: '255'
      explain: Верхняя граница входа переходит в верхнюю границу выхода.
    - type: bug
      q: Найдите выход за документированный диапазон PWM.
      code: |
        pinMode(9, OUTPUT);
        analogWrite(9, 1023);
      bugLine: 2
      fix: analogWrite(9, 255);
      explain: Для максимума на Uno передайте 255, не 1023.
    homework:
      task: Сделайте регулятор яркости внешнего LED на D9 с потенциометром A0. Проверьте выключение и максимальную
        яркость.
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
      - Перед изменением проводов отключите питание. Сначала проверьте скетч кнопкой «Проверить» в Arduino IDE.
      checklist:
      - Могу объяснить назначение setup() и loop() в этом скетче.
      - Скетч скомпилирован для указанной платы; на оборудовании проверено поведение, если плата доступна.
      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
