      - У Uno нет EEPROM
      - Это автоматически отключает USB
      answer: 0
      explain: Износ зависит от числа записей.
    - type: choice
      q: Что делает EEPROM.update по сравнению с write?
      options:
      - Не пишет байт, если значение не изменилось
      - Шифрует байт
      - Меняет адрес устройства
      - Всегда стирает всю память
      answer: 0
      explain: Это уменьшает ненужные циклы записи.
    - type: fill
      q: Сохраните байт с проверкой изменения.
      code: |
        EEPROM.___(0, brightness);
      answers:
      - update
      explain: update экономит ресурс ячейки.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        byte saved = 255;
        byte brightness = saved <= 200 ? saved : 128;
        Serial.println(brightness);
      answer: '128'
      explain: 255 не входит в допустимый диапазон настройки.
    - type: bug
