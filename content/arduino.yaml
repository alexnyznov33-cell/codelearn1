  - title: 'I2C: адреса и поиск устройств'
    minutes: 25
    xp: 30
    theory: |
      ## Два сигнала и общая земля
      I2C соединяет контроллер и периферию по SDA (данные) и SCL (такты). На Uno R3 это A4/SDA и A5/SCL. Нужны общая GND и подтягивающие резисторы; они часто уже есть на модуле. Проверьте допустимое напряжение датчика: **3,3-вольтовое устройство нельзя просто подключить к шине с подтяжкой к 5 В**. Используйте совместимый модуль или согласователь уровней.

      `Wire.begin()` запускает контроллер. Пара `beginTransmission(address)` и `endTransmission()` проверяет ответ адреса. Для обычного 7-битного сканера проверяем 0x08…0x77, исключая зарезервированные области. Код возврата 0 означает подтверждение адреса (ACK), а не идентификацию модели устройства.

      Сканер не читает температуру и не определяет тип датчика. После поиска адреса нужен даташит или библиотека конкретного устройства. Если ничего не найдено, снимите питание и проверьте SDA/SCL, землю, питание и подтяжки.

      ## Пример

      ```cpp
      #include <Wire.h>
      void setup() {
        Serial.begin(9600);
        Wire.begin();
        for (byte address = 0x08; address <= 0x77; address++) {
          Wire.beginTransmission(address);
          if (Wire.endTransmission() == 0) {
            Serial.print("Found 0x");
            Serial.println(address, HEX);
          }
        }
      }
      void loop() {}
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
