      - Подключение соответствует напряжению платы; выходы не закорочены.
      solution: |
        volatile bool pending = false;
        void onEdge() {
          pending = true;
        }
        void setup() {
          Serial.begin(9600);
          pinMode(2, INPUT_PULLUP);
          attachInterrupt(digitalPinToInterrupt(2), onEdge, FALLING);
        }
        void loop() {
          noInterrupts();
          bool event = pending;
          pending = false;
          interrupts();
          if (event) Serial.println("Edge");
        }
