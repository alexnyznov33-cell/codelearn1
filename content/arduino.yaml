  level: Junior
  lessons:
  - title: 'Arduino: плата, IDE и первый скетч'
    minutes: 25
    xp: 30
    theory: |
      ## Что такое Arduino
      Arduino — платформа, а не отдельный язык. Скетчи пишут на C/C++ с библиотеками Arduino. Этот курс использует **Arduino Uno R3 / ATmega328P**: логические уровни 5 В. Uno R4, Nano, Mega и ESP32 отличаются; всегда сверяйте распиновку своей модели.

      Установите Arduino IDE 2, подключите Uno кабелем USB **с передачей данных**, выберите Arduino AVR Boards → Arduino Uno и правильный порт. Кнопка «Проверить» компилирует; «Загрузить» записывает программу. Если порта нет, проверьте кабель и драйвер USB-UART конкретной платы.

      `setup()` выполняется один раз после запуска или сброса. `loop()` вызывается снова и снова. `Serial.begin(9600)` настраивает последовательный порт; в Serial Monitor выберите ту же скорость. Открытие монитора на Uno часто вызывает сброс.

      ## Безопасность
      Собирайте схему без питания. Не замыкайте 5V и GND; не подключайте к GPIO моторы, реле или сетевое напряжение напрямую. Курс ограничен низковольтными схемами, питание — USB. Пины 0/1 связаны с UART и могут мешать загрузке.

      ## Пример

      ```cpp
      void setup() {
        Serial.begin(9600);
        Serial.println("Hello, Arduino!");
      }
      void loop() {
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
