- id: arduino-m4
  title: Надёжность и итоговый проект
  level: Junior+
  lessons:
  - title: 'Прерывания: короткий обработчик'
    minutes: 25
    xp: 30
    theory: |
      ## Событие вне обычного loop
      Прерывание позволяет быстро реагировать на сигнал. На Uno R3 внешние interrupt доступны на D2 и D3. Используйте `digitalPinToInterrupt(pin)`, а не предположение о совпадении номера пина и прерывания.

      ISR должна быть очень короткой: выставить флаг, сохранить значение или счётчик. Нельзя ждать `delay()`, читать I2C или печатать Serial внутри обработчика. Переменную, общую с ISR, объявляют `volatile`: это не заменяет атомарность. На 8-битной Uno чтение многобайтового счётчика требует защиты.

      Пример ловит FALLING на D2 с INPUT_PULLUP. Флаг копируем и очищаем в короткой критической секции, тяжёлую работу выполняем в loop. Несколько событий могут объединиться в один флаг. Кнопка дребезжит — этот пример **не является точным счётчиком нажатий**; используйте чистый сигнал или добавьте фильтр из предыдущего модуля.

      ## Пример

      ```cpp
      volatile bool pending = false;
      void onEdge() {
        pending = true;
      }
      void setup() {
        Serial.begin(9600);
        pinMode(2, INPUT_PULLUP);
        attachInterrupt(digitalPinToInterrupt(2), onEdge, FALLING);
      }
      void loop() {
        noInterrupts();
        bool event = pending;
        pending = false;
        interrupts();
        if (event) Serial.println("Edge");
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
