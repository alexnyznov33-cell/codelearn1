  - title: Светодиод и цифровой выход
    minutes: 25
    xp: 30
    theory: |
      ## HIGH, LOW и pinMode
      На Uno `LED_BUILTIN` соответствует встроенному светодиоду на D13. Для внешнего LED: D8 → резистор 330 Ом → анод LED, катод → GND. Резистор ограничивает ток; без него можно повредить LED или выход. Перед подключением снимите питание.

      `pinMode(pin, OUTPUT)` настраивает выход. `digitalWrite(pin, HIGH)` задаёт высокий уровень, `LOW` — низкий. `delay(500)` блокирует выполнение на 500 миллисекунд. Пока это удобно, но позже заменим задержки таймером.

      В примере свет включён полсекунды и выключен полсекунды: полный период 1 с, частота 1 Гц. Встроенный LED не требует внешнего резистора. Не переносите номер пина на другую плату без проверки схемы.

      ## Пример

      ```cpp
      void setup() {
        pinMode(LED_BUILTIN, OUTPUT);
      }
      void loop() {
        digitalWrite(LED_BUILTIN, HIGH);
        delay(500);
        digitalWrite(LED_BUILTIN, LOW);
        delay(500);
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
    practice:
    - type: choice
      q: Зачем внешнему светодиоду последовательный резистор?
      options:
      - Ограничить ток
      - Увеличить напряжение до 220 В
      - Хранить данные
      - Ускорить CPU
      answer: 0
      explain: LED и GPIO требуют ограничения тока.
    - type: choice
      q: Каков период при двух задержках по 500 мс?
      options:
      - 500 мс
      - 1000 мс
      - 2 мс
      - 50 с
      answer: 1
      explain: Период включает и включённую, и выключенную фазу.
    - type: fill
      q: Настройте встроенный светодиод как выход.
      code: |
        pinMode(LED_BUILTIN, ___);
      answers:
      - OUTPUT
      explain: OUTPUT используется для управляемого выхода.
    - type: output
      q: Что появится в Serial Monitor при выполнении этого фрагмента? Скорость порта уже настроена.
      code: |
        Serial.println(500 + 500);
      answer: '1000'
      explain: Две половины периода складываются.
    - type: bug
      q: Найдите строку с неверным режимом пина для управления LED.
      code: |
        void setup() {
          pinMode(LED_BUILTIN, INPUT);
        }
        void loop() { digitalWrite(LED_BUILTIN, HIGH); }
      bugLine: 2
      fix: '  pinMode(LED_BUILTIN, OUTPUT);'
      explain: INPUT с digitalWrite(HIGH) включает подтяжку, а не обычный выход.
    homework:
      task: 'Загрузите Blink на Uno: 500 мс включён, 500 мс выключен. Измерьте полный период. При использовании
