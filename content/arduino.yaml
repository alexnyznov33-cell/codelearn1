    minutes: 25
    xp: 30
    theory: |
      ## Стабильное состояние и фронт
      Механическая кнопка создаёт быстрые переходы при замыкании. Храним последнее сырое чтение и момент его изменения. Когда уровень остаётся неизменным 30 мс, принимаем его как стабильный. Это учебный временной фильтр; реальное время выбирают по кнопке и требованиям.

      Для INPUT_PULLUP нажатие — переход стабильного состояния HIGH → LOW. Увеличиваем счётчик только при этом переходе, а не на каждом проходе loop: удержание кнопки не должно добавлять сотни нажатий.

      Схема: D2 → кнопка → GND. Начальные значения HIGH предполагают отпущенную кнопку при старте. Алгоритм неблокирующий и использует тот же безопасный способ вычитания времени, что и таймер Blink.

      ## Пример

      ```cpp
      const byte BUTTON = 2;
      int lastReading = HIGH;
      int stable = HIGH;
      unsigned long changedAt = 0;
      unsigned long count = 0;
      void setup() {
        pinMode(BUTTON, INPUT_PULLUP);
        Serial.begin(9600);
      }
      void loop() {
        int reading = digitalRead(BUTTON);
        unsigned long now = millis();
        if (reading != lastReading) {
          changedAt = now;
          lastReading = reading;
        }
        if (now - changedAt >= 30 && reading != stable) {
          stable = reading;
          if (stable == LOW) {
            count++;
            Serial.println(count);
          }
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
