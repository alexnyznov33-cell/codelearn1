  - title: 'millis: работа без блокирующих задержек'
    minutes: 25
    xp: 30
    theory: |
      ## Несколько задач в loop
      `delay()` останавливает обычный код: кнопки и сообщения не обрабатываются в этот период. `millis()` возвращает время после запуска в миллисекундах как `unsigned long`. На Uno счётчик переполняется примерно через 49,7 суток.

      Проверяйте **разность беззнаковых значений**: `now - last >= interval`. Она корректна при переходе через ноль, если интервал разумно меньше полного диапазона счётчика и loop проверяет таймер достаточно часто. Сравнение `now >= last + interval` может ломаться на переполнении.

      После переключения запоминаем `last = now`. Это простой таймер «не чаще интервала»; для строгой периодичности используют другие приёмы. В примере loop свободен для обработки кнопки или Serial. Не добавляйте длительные задержки в соседние задачи.

      ## Пример

      ```cpp
      unsigned long last = 0;
      const unsigned long INTERVAL = 500;
      bool ledOn = false;
      void setup() {
        pinMode(LED_BUILTIN, OUTPUT);
      }
      void loop() {
        unsigned long now = millis();
        if (now - last >= INTERVAL) {
          last = now;
          ledOn = !ledOn;
          digitalWrite(LED_BUILTIN, ledOn ? HIGH : LOW);
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
