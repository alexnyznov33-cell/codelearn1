  - title: 'Итоговый проект: настольный светильник'
    minutes: 35
    xp: 30
    theory: |
      ## Объединяем знания
      Проект для Uno: потенциометр управляет яркостью LED, кнопка переключает включение, Serial раз в секунду сообщает состояние. Схема: потенциометр между 5V и GND с движком на A0; LED на D9 через 330 Ом к GND; кнопка между D2 и GND. Только маломощный LED, не силовая лента.

      Фильтр кнопки принимает уровень после 30 мс стабильности. По переходу в LOW меняем `enabled`. АЦП преобразуем в PWM. Таймер отчёта не блокирует ввод. Каждая часть решает одну задачу, все работают в общем loop.

      Тестируйте поэтапно: сначала LED, затем потенциометр, затем кнопку, потом Serial. Удержание кнопки должно давать одно переключение. Этот небольшой проект закрепляет основы embedded, но сам по себе не означает профессиональный уровень Middle.

      ## Пример

      ```cpp
      const byte LED = 9, BUTTON = 2;
      bool enabled = true;
      int lastReading = HIGH, stable = HIGH;
      unsigned long changedAt = 0, reportAt = 0;
      void setup() {
        pinMode(LED, OUTPUT);
        pinMode(BUTTON, INPUT_PULLUP);
        Serial.begin(9600);
      }
      void loop() {
        unsigned long now = millis();
        int reading = digitalRead(BUTTON);
        if (reading != lastReading) {
          changedAt = now;
          lastReading = reading;
        }
        if (now - changedAt >= 30 && reading != stable) {
          stable = reading;
          if (stable == LOW) enabled = !enabled;
        }
        int brightness = map(analogRead(A0), 0, 1023, 0, 255);
        analogWrite(LED, enabled ? brightness : 0);
        if (now - reportAt >= 1000) {
          reportAt = now;
          Serial.print(enabled ? "ON " : "OFF ");
          Serial.println(enabled ? brightness : 0);
        }
      }
      ```

      ## Как практиковаться

      Сначала разберите пример, затем выполните задания. CodeLearn проверяет ответы, но **не компилирует скетчи и не симулирует плату**. Для запуска используйте Arduino IDE и указанную плату; без оборудования можно читать код и проходить все интерактивные задания.
