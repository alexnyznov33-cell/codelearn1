      task: 'Запустите обработчик FALLING на D2: ISR ставит флаг, loop выводит сообщение. Объясните, почему при
        механической кнопке возможны лишние сообщения.'
      hints:
      - Используйте пример из теории как отправную точку; проверьте выбранную плату и порт.
