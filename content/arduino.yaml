      options:
      - Чтобы компилятор учитывал изменение извне обычного потока
      - Чтобы сделать любое чтение атомарным
      - Чтобы хранить в EEPROM
      - Чтобы убрать дребезг
      answer: 0
      explain: volatile не заменяет защиту многобайтовых данных.
    - type: fill
      q: Получите номер прерывания по пину.
      code: |
        attachInterrupt(___(2), onEdge, FALLING);
      answers:
      - digitalPinToInterrupt
      explain: Так код явно связывает пин и внешнее прерывание.
    - type: order
      q: Как обрабатывать событие вне ISR?
      lines:
      - ISR выставляет volatile-флаг
      - loop кратко защищает копирование и очистку флага
      - loop снова разрешает прерывания
      - loop выполняет длительную обработку события
