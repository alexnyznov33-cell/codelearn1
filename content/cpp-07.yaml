      - id: cpp-07-05
        title: Тестирование GoogleTest
        minutes: 30
        xp: 40
        theory: |
          **GoogleTest** — самый распространённый фреймворк unit-тестов для C++ (альтернативы: Catch2, doctest, Boost.Test).

          ## Подключение через CMake

          ```cmake
          include(FetchContent)
          FetchContent_Declare(googletest
            URL https://github.com/google/googletest/archive/refs/tags/v1.14.0.zip)
          FetchContent_MakeAvailable(googletest)

          enable_testing()
          add_executable(core_tests tests/cart_test.cpp)
          target_link_libraries(core_tests PRIVATE core GTest::gtest_main GTest::gmock)
          include(GoogleTest)
          gtest_discover_tests(core_tests)
          ```

          ```bash
          cmake --build build && ctest --test-dir build --output-on-failure
          ```

          ## Тесты

          ```cpp
          #include <gtest/gtest.h>
          #include "cart.h"

          TEST(CartTest, EmptyCartHasZeroTotal) {
              Cart cart;
              EXPECT_EQ(cart.total(), 0);
          }

          TEST(CartTest, AddingItemIncreasesTotal) {
              Cart cart;
              cart.add({"Чай", 150}, 2);
              EXPECT_EQ(cart.total(), 300);
              EXPECT_EQ(cart.size(), 1u);
          }

          TEST(CartTest, NegativeQuantityThrows) {
              Cart cart;
              EXPECT_THROW(cart.add({"Чай", 150}, -1), std::invalid_argument);
          }
          ```

          - `EXPECT_*` — при неудаче тест продолжается; `ASSERT_*` — прерывается (для предусловий: `ASSERT_NE(ptr, nullptr)`).
          - `EXPECT_EQ`, `NE`, `LT`, `LE`, `GT`, `GE`, `TRUE`, `FALSE`, `DOUBLE_EQ`, `NEAR(a, b, eps)`, `STREQ`, `THROW`, `NO_THROW`, `DEATH`.

          ## Фикстуры

          ```cpp
          class InventoryTest : public ::testing::Test {
          protected:
              void SetUp() override { inv.add("Чай", 10); }
              Inventory inv;
          };

          TEST_F(InventoryTest, RemoveDecreasesStock) {
              inv.remove("Чай", 3);
              EXPECT_EQ(inv.stock("Чай"), 7);
          }
          ```

          ## Параметризованные тесты

          ```cpp
          class IsPrimeTest : public ::testing::TestWithParam<std::pair<int, bool>> {};
          TEST_P(IsPrimeTest, Works) {
              auto [n, expected] = GetParam();
              EXPECT_EQ(isPrime(n), expected);
          }
          INSTANTIATE_TEST_SUITE_P(Numbers, IsPrimeTest,
              ::testing::Values(std::pair{2, true}, std::pair{4, false}, std::pair{17, true}));
          ```

          ## GoogleMock

          ```cpp
          class MockPayment : public IPayment {
          public:
              MOCK_METHOD(bool, charge, (int userId, long amount), (override));
          };

          TEST(OrderServiceTest, ChargesUser) {
              MockPayment pay;
              EXPECT_CALL(pay, charge(7, 300)).WillOnce(::testing::Return(true));
              OrderService svc(pay);
              EXPECT_TRUE(svc.checkout(7, 300));
          }
          ```

          Запуск отдельных тестов: `./core_tests --gtest_filter=CartTest.*`. Покрытие: `--coverage` (gcov/lcov) или `llvm-cov`.
