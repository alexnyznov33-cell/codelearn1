        homework:
          task: |
            Покройте библиотеку `core` проекта `inventory` тестами GoogleTest: фикстура склада, параметризованный тест валидации названий товаров, тест исключений, мок `INotifier` (уведомление при остатке < 5) через GoogleMock. Подключите `gtest_discover_tests`, соберите с ASan и получите отчёт покрытия (gcovr/lcov) ≥ 80%.
          checklist:
            - Есть TEST_F, TEST_P и EXPECT_CALL
            - Тесты проходят под ASan
            - Покрытие ≥ 80%
          solution: |
            class MockNotifier : public INotifier {
            public:
                MOCK_METHOD(void, lowStock, (const std::string& item, int left), (override));
            };

            class StockTest : public ::testing::Test {
            protected:
                MockNotifier notifier;
                Stock stock{notifier};
                void SetUp() override { stock.add("Чай", 10); }
            };

            TEST_F(StockTest, RemoveBelowThresholdNotifies) {
                EXPECT_CALL(notifier, lowStock("Чай", 4)).Times(1);
                stock.remove("Чай", 6);
            }

            TEST_F(StockTest, RemoveMoreThanAvailableThrows) {
                EXPECT_THROW(stock.remove("Чай", 100), std::out_of_range);
            }

            class NameTest : public ::testing::TestWithParam<std::pair<std::string, bool>> {};
            TEST_P(NameTest, Validates) {
                auto [name, ok] = GetParam();
                EXPECT_EQ(isValidName(name), ok);
            }
            INSTANTIATE_TEST_SUITE_P(Names, NameTest, ::testing::Values(
                std::pair{std::string("Чай"), true}, std::pair{std::string(""), false}, std::pair{std::string(300, 'x'), false}));

