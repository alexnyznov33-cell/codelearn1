                Пользователь = Справочники.Пользователи.НайтиПоРеквизиту("ИмяИБ", ИмяПользователя());
                ПараметрыСеанса.ТекущийПользователь = Пользователь;
                ПараметрыСеанса.ТекущееПодразделение = ?(Пользователь.Пустая(),
                    Справочники.Подразделения.ПустаяСсылка(), Пользователь.Подразделение);
            КонецПроцедуры

            // Роль Менеджер → Документ.ЗаказКлиента → Чтение, Изменение → Ограничение:
            // ГДЕ Подразделение = &ТекущееПодразделение

            // Модуль формы заказа
            &НаСервере
            Процедура ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)
                Элементы.Скидка.Видимость = РольДоступна("РедактированиеСкидок")
                    Или РольДоступна("Администратор");
            КонецПроцедуры

            // Отчёт
            // ВЫБРАТЬ РАЗРЕШЕННЫЕ З.Ссылка, З.Сумма ИЗ Документ.ЗаказКлиента КАК З
      - id: 1c-08-05
        title: Клиент-серверный вариант и производительность
        minutes: 40
        xp: 50
        theory: |
          **Файловый** вариант — база в одном файле `1Cv8.1CD`, для 1–5 пользователей. **Клиент-серверный** — кластер серверов 1С + СУБД (PostgreSQL / MS SQL), для десятков и сотен пользователей.

          ## Архитектура

          ```text
          Клиент (тонкий/веб) ⇄ Сервер 1С (rphost, рабочие процессы) ⇄ СУБД
          ```

          Каждый **серверный вызов** — сетевой обмен. Каждый **запрос** — обращение к СУБД. Отсюда главные правила производительности.

          ## Топ проблем и решений

          | Проблема | Решение |
          |---|---|
          | Запрос в цикле | Один запрос по всем данным (ВТ, `В (&Массив)`) |
          | Обращение через точку `Док.Контрагент.Договор.Валюта` | Получить нужные поля в запросе |
          | Много серверных вызовов из формы | Один `&НаСервере`-вызов, `&НаСервереБезКонтекста` |
          | Тяжёлая передача формы | `&НаСервереБезКонтекста` вместо `&НаСервере` |
          | Отбор по неиндексированному полю | Индексировать реквизит / измерение |
          | Виртуальная таблица с условием в ГДЕ | Условие в параметрах виртуальной таблицы |
          | Долгие транзакции и блокировки | Короткие транзакции, точечные блокировки |

          ## Запрос в цикле — антипаттерн №1

          ```bsl
          // ПЛОХО: N запросов
          Для Каждого С Из Товары Цикл
              Цена = ПолучитьЦену(С.Номенклатура);   // внутри — Запрос
          КонецЦикла;

          // ХОРОШО: один запрос
          Запрос.Текст = "ВЫБРАТЬ Ц.Номенклатура, Ц.Цена
          |ИЗ РегистрСведений.Цены.СрезПоследних(&Дата, Номенклатура В (&Товары)) КАК Ц";
          Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
          Цены = Запрос.Выполнить().Выгрузить();
          ```

          ## Кеширование

          **Общий модуль с повторным использованием** «На время сеанса» кеширует результаты функций (по параметрам):

          ```bsl
          // Общий модуль НастройкиПовтИсп, Повторное использование: На время сеанса
          Функция ОсновнаяВалюта() Экспорт
              Возврат Константы.ОсновнаяВалюта.Получить();
          КонецФункции
          ```

          ## Инструменты

          - **Замер производительности** (в конфигураторе / отладчике) — сколько времени каждая строка и сколько раз вызвана.
          - **Технологический журнал** (logcfg.xml) — долгие запросы, блокировки, взаимоблокировки (события `DBMSSQL`, `TLOCK`, `TDEADLOCK`).
          - **Консоль кластера** — сеансы, соединения, блокировки.
          - **ЦУП / ЦКК** (1С:КИП) — профессиональный мониторинг.
          - План запроса СУБД — для тяжёлых запросов.

          > Сначала **измерьте**, потом оптимизируйте — интуиция о «медленном месте» часто ошибается.
