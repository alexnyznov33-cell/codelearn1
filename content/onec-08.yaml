        homework:
          task: |
            Оптимизируйте обработку «Пересчёт цен в заказах»: исходный код в цикле по заказам и строкам вызывает функции ПолучитьЦену и ПолучитьСкидку (каждая — запрос), обращается к Заказ.Контрагент.ВидЦен. Перепишите на один пакетный запрос с временными таблицами, вынесите константы в модуль повторного использования, сделайте замер производительности до и после и запишите результаты.
          checklist:
            - Нет запросов в цикле
            - Нет обращений через точку к ссылкам в цикле
            - Модуль с повторным использованием
            - Есть замер «до/после»
          solution: |
            // Общий модуль НастройкиПовтИсп (На время сеанса)
            Функция ПроцентСкидкиПоУмолчанию() Экспорт
                Возврат Константы.СкидкаПоУмолчанию.Получить();
            КонецФункции

            Процедура ПересчитатьЦены(Заказы) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ З.Ссылка КАК Заказ, З.Контрагент.ВидЦен КАК ВидЦен, Т.НомерСтроки, Т.Номенклатура
                |ПОМЕСТИТЬ ВТСтроки
                |ИЗ Документ.ЗаказКлиента.Товары КАК Т
                |  ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказКлиента КАК З ПО Т.Ссылка = З.Ссылка
                |ГДЕ З.Ссылка В (&Заказы)
                |ИНДЕКСИРОВАТЬ ПО Номенклатура, ВидЦен
                |;
                |ВЫБРАТЬ С.Заказ, С.НомерСтроки, ЕСТЬNULL(Ц.Цена, 0) КАК Цена,
                |  ЕСТЬNULL(Ск.Процент, &СкидкаПоУмолчанию) КАК Скидка
                |ИЗ ВТСтроки КАК С
                |  ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.Цены.СрезПоследних(&Дата,
                |    (Номенклатура, ВидЦен) В (ВЫБРАТЬ Номенклатура, ВидЦен ИЗ ВТСтроки)) КАК Ц
                |  ПО С.Номенклатура = Ц.Номенклатура И С.ВидЦен = Ц.ВидЦен
                |  ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.Скидки КАК Ск ПО С.Номенклатура = Ск.Номенклатура
                |ИТОГИ ПО Заказ");
                Запрос.УстановитьПараметр("Заказы", Заказы);
                Запрос.УстановитьПараметр("Дата", ТекущаяДатаСеанса());
                Запрос.УстановитьПараметр("СкидкаПоУмолчанию", НастройкиПовтИсп.ПроцентСкидкиПоУмолчанию());
                ВыборкаЗаказов = Запрос.Выполнить().Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам);
                Пока ВыборкаЗаказов.Следующий() Цикл
                    Объект = ВыборкаЗаказов.Заказ.ПолучитьОбъект();
                    Строки = ВыборкаЗаказов.Выбрать();
                    Пока Строки.Следующий() Цикл
                        С = Объект.Товары[Строки.НомерСтроки - 1];
                        С.Цена = Строки.Цена;
                        С.Сумма = Окр(С.Количество * С.Цена * (100 - Строки.Скидка) / 100, 2);
                    КонецЦикла;
                    Объект.Записать();
                КонецЦикла;
            КонецПроцедуры
