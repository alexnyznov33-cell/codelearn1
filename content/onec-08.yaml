id: onec
modules:
  - id: 1c-m8
    title: Интеграции и администрирование
    level: Middle
    lessons:
      - id: 1c-08-01
        title: HTTP-сервисы и REST
        minutes: 40
        xp: 50
        theory: |
          1С умеет быть и **сервером** (HTTP-сервисы — свой REST API), и **клиентом** (HTTPСоединение — вызов чужих API).

          ## HTTP-сервис (сервер)

          В конфигураторе: Общие → HTTP-сервисы → Добавить. Задаёте **корневой URL** (`api`), **шаблон URL** (`/products/{id}`) и **методы** (GET, POST...). Каждому методу — обработчик в модуле сервиса:

          ```bsl
          Функция ProductsGet(Запрос)
              Код = Запрос.ПараметрыURL["id"];
              Товар = Справочники.Номенклатура.НайтиПоКоду(Код);
              Если Товар.Пустая() Тогда
                  Возврат Новый HTTPСервисОтвет(404);
              КонецЕсли;

              Данные = Новый Структура("code, name, price", Товар.Код, Товар.Наименование, Товар.Цена);
              Запись = Новый ЗаписьJSON;
              Запись.УстановитьСтроку();
              ЗаписатьJSON(Запись, Данные);

              Ответ = Новый HTTPСервисОтвет(200);
              Ответ.Заголовки.Вставить("Content-Type", "application/json; charset=utf-8");
              Ответ.УстановитьТелоИзСтроки(Запись.Закрыть());
              Возврат Ответ;
          КонецФункции
          ```

          Публикация: база публикуется на веб-сервере (Apache/IIS) через «Администрирование → Публикация на веб-сервере». Адрес: `http://server/base/hs/api/products/00001`.

          | Объект запроса | Что содержит |
          |---|---|
          | `Запрос.ПараметрыURL` | Части шаблона `{id}` |
          | `Запрос.ПараметрыЗапроса` | `?page=2&limit=10` |
          | `Запрос.Заголовки` | HTTP-заголовки |
          | `Запрос.ПолучитьТелоКакСтроку()` | Тело POST |

          ## HTTP-клиент

          ```bsl
          Соединение = Новый HTTPСоединение("api.example.com", 443,,,, 30,
              Новый ЗащищенноеСоединениеOpenSSL);
          Запрос = Новый HTTPЗапрос("/v1/rates?base=RUB");
          Запрос.Заголовки.Вставить("Authorization", "Bearer " + Токен);
          Ответ = Соединение.Получить(Запрос);          // GET
          Если Ответ.КодСостояния = 200 Тогда
              Текст = Ответ.ПолучитьТелоКакСтроку();
          КонецЕсли;
          ```

          Для POST: `Запрос.УстановитьТелоИзСтроки(json)` и `Соединение.ОтправитьДляОбработки(Запрос)`.

          ## Правила REST

          - GET — чтение, POST — создание, PUT/PATCH — изменение, DELETE — удаление.
          - Коды: 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 404 Not Found, 500 Server Error.
          - Таймаут обязателен; HTTP-вызов — **никогда внутри транзакции**.
          - Авторизация в HTTP-сервисе — пользователь 1С (Basic) или собственный токен.

          > Альтернатива без кода — стандартный **OData**-интерфейс (`/odata/standard.odata`), но свой HTTP-сервис гибче и безопаснее.
        practice:
          - type: choice
            q: Как получить значение {id} из шаблона /products/{id}?
            options: ["Запрос.ПараметрыЗапроса[\"id\"]", "Запрос.ПараметрыURL[\"id\"]", "Запрос.Заголовки[\"id\"]", "Запрос.Тело.id"]
            answer: 1
          - type: fill
            q: Верните из HTTP-сервиса ответ «не найдено»
            code: |
              Возврат Новый ___(___);
            answers: ["HTTPСервисОтвет", "404"]
          - type: choice
            q: Каким методом HTTPСоединения выполнить POST-запрос?
            options: ["Получить", "ОтправитьДляОбработки", "Записать", "Изменить"]
            answer: 1
          - type: bug
            q: Найдите опасное место
            code: |
              НачатьТранзакцию();
              Док.Записать(РежимЗаписиДокумента.Проведение);
              Ответ = Соединение.ОтправитьДляОбработки(ЗапросВСервис);
              ЗафиксироватьТранзакцию();
            bugLine: 3
            fix: Вызывать внешний сервис после фиксации транзакции
            explain: Долгий сетевой вызов внутри транзакции держит блокировки; при откате данные во внешней системе уже не вернуть.
          - type: output
            q: "Какой HTTP-код правильно вернуть после успешного создания нового ресурса через POST?"
            code: |
              // POST /api/orders  → заказ создан
            answer: "201"
        homework:
          task: |
            Создайте HTTP-сервис `api` с шаблонами: GET /products (список с параметрами page и limit), GET /products/{code}, POST /orders (создаёт документ ЗаказКлиента из JSON и возвращает 201 с номером). Обрабатывайте ошибки: 400 для некорректного JSON, 404 для отсутствующего товара. Напишите клиентскую функцию, которая вызывает ваш сервис.
          checklist:
            - Три метода с правильными кодами ответа
            - Пагинация через ПараметрыЗапроса
            - Content-Type application/json
            - Клиент с таймаутом
          solution: |
            Функция ОтветJSON(Код, Данные)
                З = Новый ЗаписьJSON; З.УстановитьСтроку();
                ЗаписатьJSON(З, Данные);
                Ответ = Новый HTTPСервисОтвет(Код);
                Ответ.Заголовки.Вставить("Content-Type", "application/json; charset=utf-8");
                Ответ.УстановитьТелоИзСтроки(З.Закрыть());
                Возврат Ответ;
            КонецФункции

            Функция ProductsListGet(Запрос)
                Страница = Число(?(Запрос.ПараметрыЗапроса["page"] = Неопределено, 1, Запрос.ПараметрыЗапроса["page"]));
                Лимит = Число(?(Запрос.ПараметрыЗапроса["limit"] = Неопределено, 20, Запрос.ПараметрыЗапроса["limit"]));
                Q = Новый Запрос("ВЫБРАТЬ Н.Код, Н.Наименование, Н.Цена ИЗ Справочник.Номенклатура КАК Н
                |ГДЕ НЕ Н.ЭтоГруппа УПОРЯДОЧИТЬ ПО Н.Код");
                Таблица = Q.Выполнить().Выгрузить();
                Результат = Новый Массив;
                Для И = (Страница - 1) * Лимит По Мин(Страница * Лимит, Таблица.Количество()) - 1 Цикл
                    С = Таблица[И];
                    Результат.Добавить(Новый Структура("code, name, price", С.Код, С.Наименование, С.Цена));
                КонецЦикла;
                Возврат ОтветJSON(200, Результат);
            КонецФункции

            Функция ProductGet(Запрос)
                Товар = Справочники.Номенклатура.НайтиПоКоду(Запрос.ПараметрыURL["code"]);
                Если Товар.Пустая() Тогда
                    Возврат ОтветJSON(404, Новый Структура("error", "not found"));
                КонецЕсли;
                Возврат ОтветJSON(200, Новый Структура("code, name, price", Товар.Код, Товар.Наименование, Товар.Цена));
            КонецФункции

            Функция OrdersPost(Запрос)
                Попытка
                    Ч = Новый ЧтениеJSON; Ч.УстановитьСтроку(Запрос.ПолучитьТелоКакСтроку());
                    Данные = ПрочитатьJSON(Ч);
                Исключение
                    Возврат ОтветJSON(400, Новый Структура("error", "bad json"));
                КонецПопытки;
                Док = Документы.ЗаказКлиента.СоздатьДокумент();
                Док.Дата = ТекущаяДатаСеанса();
                Для Каждого Поз Из Данные.items Цикл
                    Товар = Справочники.Номенклатура.НайтиПоКоду(Поз.code);
                    Если Товар.Пустая() Тогда
                        Возврат ОтветJSON(404, Новый Структура("error", "product " + Поз.code));
                    КонецЕсли;
                    С = Док.Товары.Добавить();
                    С.Номенклатура = Товар; С.Количество = Поз.qty;
                КонецЦикла;
                Док.Записать();
                Возврат ОтветJSON(201, Новый Структура("number", Док.Номер));
            КонецФункции

            // Клиент
            Функция ПолучитьТовар(Код) Экспорт
                С = Новый HTTPСоединение("localhost", 80, "user", "pass",, 15);
                Ответ = С.Получить(Новый HTTPЗапрос("/base/hs/api/products/" + Код));
                Если Ответ.КодСостояния <> 200 Тогда Возврат Неопределено; КонецЕсли;
                Ч = Новый ЧтениеJSON; Ч.УстановитьСтроку(Ответ.ПолучитьТелоКакСтроку());
                Возврат ПрочитатьJSON(Ч);
            КонецФункции
      - id: 1c-08-02
        title: Обмен через JSON и XML
        minutes: 40
        xp: 50
        theory: |
          Обмен данными — каждодневная задача: сайт, маркетплейсы, банк, другая база 1С. Основные форматы — **JSON** и **XML**.

          ## JSON

          ```bsl
          // Запись
          Данные = Новый Структура;
          Данные.Вставить("id", 15);
          Данные.Вставить("tags", Новый Массив);
          Данные.tags.Добавить("new");
          Запись = Новый ЗаписьJSON;
          Запись.УстановитьСтроку(Новый ПараметрыЗаписиJSON(ПереносСтрокJSON.Нет));
          ЗаписатьJSON(Запись, Данные);
          Текст = Запись.Закрыть();   // {"id":15,"tags":["new"]}

          // Чтение
          Чтение = Новый ЧтениеJSON;
          Чтение.УстановитьСтроку(Текст);
          Объект = ПрочитатьJSON(Чтение);            // Структура
          Соотв = ПрочитатьJSON(Чтение, Истина);     // Соответствие
          ```

          Читайте в **Соответствие**, если ключи могут быть недопустимыми именами (`"order-id"`, `"1"`). Даты: `ЗаписатьJSON(..., , "ПреобразованиеДат")` или формат ISO через `ФорматДатыJSON.ISO`.

          Сериализуются только примитивы, Структура, Соответствие, Массив. Ссылку нужно превратить в строку (код, GUID: `Строка(Ссылка.УникальныйИдентификатор())`).

          ## XML

          ```bsl
          З = Новый ЗаписьXML;
          З.УстановитьСтроку("UTF-8");
          З.ЗаписатьОбъявлениеXML();
          З.ЗаписатьНачалоЭлемента("order");
          З.ЗаписатьАтрибут("id", "15");
          З.ЗаписатьНачалоЭлемента("customer");
          З.ЗаписатьТекст("ООО Альфа");
          З.ЗаписатьКонецЭлемента();
          З.ЗаписатьКонецЭлемента();
          Текст = З.Закрыть();
          ```

          Чтение — потоково через `ЧтениеXML` (`Пока Ч.Прочитать() Цикл ... Ч.ТипУзла, Ч.Имя, Ч.Значение`) или через **DOM** (`ПостроительDOM`) и **XDTO** для схем XSD.

          ## Сериализация объектов 1С

          Для обмена между базами 1С есть готовый формат:

          ```bsl
          З = Новый ЗаписьXML; З.ОткрытьФайл(ИмяФайла);
          ЗаписатьXML(З, ДокументОбъект);            // объект → XML
          ...
          Объект = ПрочитатьXML(ЧтениеXMLФайла);      // XML → объект
          ```

          ## Механизмы обмена

          | Механизм | Где применяется |
          |---|---|
          | Планы обмена | Регистрация изменений: что изменилось с последнего обмена |
          | EnterpriseData + Конвертация данных 3.x | Обмен между типовыми конфигурациями |
          | Свой JSON через HTTP | Сайты, мобильные приложения, маркетплейсы |

          **План обмена** хранит узлы и регистрирует изменения объектов (`ПланыОбмена.ЗарегистрироватьИзменения`). При выгрузке берёте только изменённое, после подтверждения — `УдалитьРегистрациюИзменений`.

          > Выгружайте идентификаторы (GUID/код), а не наименования — наименования не уникальны.
        practice:
          - type: fill
            q: Прочитайте JSON-строку в Соответствие
            code: |
              Чтение = Новый ___;
              Чтение.УстановитьСтроку(Текст);
              Данные = ПрочитатьJSON(Чтение, ___);
            answers: ["ЧтениеJSON", "Истина"]
          - type: choice
            q: Что нельзя напрямую записать через ЗаписатьJSON?
            options: ["Структуру", "Массив", "Ссылку на справочник", "Число"]
            answer: 2
          - type: order
            q: Расставьте вызовы для записи <item>Хлеб</item>
            lines:
              - З = Новый ЗаписьXML;
              - З.УстановитьСтроку("UTF-8");
              - З.ЗаписатьНачалоЭлемента("item");
              - З.ЗаписатьТекст("Хлеб");
              - З.ЗаписатьКонецЭлемента();
              - Текст = З.Закрыть();
          - type: choice
            q: Для чего нужен план обмена?
            options: ["Для печати документов", "Для регистрации изменённых объектов и узлов обмена", "Для хранения пользователей", "Для расписания заданий"]
            answer: 1
          - type: output
            q: "Сколько элементов в массиве items после чтения JSON?"
            code: |
              Текст = "{""items"": [{""code"": ""1""}, {""code"": ""2""}, {""code"": ""3""}]}";
              Ч = Новый ЧтениеJSON;
              Ч.УстановитьСтроку(Текст);
              Данные = ПрочитатьJSON(Ч);
              Сообщить(Данные.items.Количество());
            answer: "3"
        homework:
          task: |
            Сделайте обработку обмена с сайтом: (1) выгрузка каталога в JSON (код, GUID, наименование, цена, остаток) только по изменённым товарам через план обмена «Сайт»; (2) загрузка заказов из XML-файла с поиском товаров по GUID; (3) после успешной выгрузки — удаление регистрации изменений.
          checklist:
            - Используется план обмена с регистрацией
            - В JSON нет ссылок — только строки и числа
            - Чтение XML потоковое или через DOM
            - Товары ищутся по GUID
          solution: |
            Функция ВыгрузитьКаталог(Узел) Экспорт
                Выборка = ПланыОбмена.ВыбратьИзменения(Узел, 0);
                Массив = Новый Массив;
                Пока Выборка.Следующий() Цикл
                    Объект = Выборка.ПолучитьОбъект();
                    Если ТипЗнч(Объект) <> Тип("СправочникОбъект.Номенклатура") Тогда Продолжить; КонецЕсли;
                    Массив.Добавить(Новый Структура("code, guid, name, price, stock",
                        Объект.Код, Строка(Объект.Ссылка.УникальныйИдентификатор()),
                        Объект.Наименование, Объект.Цена, ОстатокТовара(Объект.Ссылка)));
                КонецЦикла;
                З = Новый ЗаписьJSON; З.УстановитьСтроку();
                ЗаписатьJSON(З, Массив);
                Текст = З.Закрыть();
                ПланыОбмена.УдалитьРегистрациюИзменений(Узел);
                Возврат Текст;
            КонецФункции

            Процедура ЗагрузитьЗаказы(ИмяФайла) Экспорт
                Ч = Новый ЧтениеXML; Ч.ОткрытьФайл(ИмяФайла);
                Построитель = Новый ПостроительDOM;
                Документ = Построитель.Прочитать(Ч);
                Для Каждого УзелЗаказа Из Документ.ПолучитьЭлементыПоИмени("order") Цикл
                    Заказ = Документы.ЗаказКлиента.СоздатьДокумент();
                    Заказ.Дата = ТекущаяДатаСеанса();
                    Для Каждого УзелПоз Из УзелЗаказа.ПолучитьЭлементыПоИмени("item") Цикл
                        GUID = Новый УникальныйИдентификатор(УзелПоз.ПолучитьАтрибут("guid"));
                        Товар = Справочники.Номенклатура.ПолучитьСсылку(GUID);
                        Если Товар.ПолучитьОбъект() = Неопределено Тогда Продолжить; КонецЕсли;
                        С = Заказ.Товары.Добавить();
                        С.Номенклатура = Товар;
                        С.Количество = Число(УзелПоз.ПолучитьАтрибут("qty"));
                    КонецЦикла;
                    Заказ.Записать();
                КонецЦикла;
                Ч.Закрыть();
            КонецПроцедуры
      - id: 1c-08-03
        title: Регламентные и фоновые задания
        minutes: 35
        xp: 50
        theory: |
          Часть работы должна выполняться **без пользователя**: ночная загрузка курсов, закрытие дня, обмен каждые 10 минут. Для этого — **регламентные** и **фоновые** задания.

          ## Регламентное задание

          Объект конфигурации (Общие → Регламентные задания): указываете **метод** экспортной процедуры общего модуля (серверного) и **расписание**.

          ```bsl
          // Общий модуль РегламентныеЗаданияСервер
          Процедура ЗагрузкаКурсовВалют() Экспорт
              ОбщегоНазначения.ПриНачалеВыполненияРегламентногоЗадания(); // в БСП
              Курсы = ПолучитьКурсыССайта();
              ЗаписатьКурсы(Курсы);
          КонецПроцедуры
          ```

          Флаг **«Использование»** включает задание, **«Предопределённое»** — создаёт его автоматически. Расписание меняется программно:

          ```bsl
          Задание = РегламентныеЗадания.НайтиПредопределенное(Метаданные.РегламентныеЗадания.ЗагрузкаКурсов);
          Расписание = Новый РасписаниеРегламентногоЗадания;
          Расписание.ПериодПовтораДней = 1;
          Расписание.ВремяНачала = Дата(1, 1, 1, 3, 0, 0);   // в 03:00
          Задание.Расписание = Расписание;
          Задание.Записать();
          ```

          В **клиент-серверном** варианте задания выполняет сервер 1С. В файловом — только если открыт сеанс (или настроен веб-сервер/агент).

          ## Фоновое задание

          Запуск долгой операции **асинхронно**, чтобы форма не зависала:

          ```bsl
          Параметры = Новый Массив;
          Параметры.Добавить(Период);
          Задание = ФоновыеЗадания.Выполнить("ЗакрытиеМесяца.Выполнить", Параметры,
              "Закрытие_" + Формат(Период, "ДФ=yyyyMM"), "Закрытие месяца");
          ```

          Ключ (третий параметр) не даёт запустить два одинаковых задания одновременно.

          Проверка: `ФоновыеЗадания.НайтиПоУникальномуИдентификатору(ИД).Состояние` — `Активно`, `Завершено`, `ЗавершеноАварийно`. Результат передают через **временное хранилище**.

          В БСП есть удобная обёртка: `ДлительныеОперации.ВыполнитьВФоне` + `ДлительныеОперацииКлиент.ОжидатьЗавершение` — с прогрессом и оповещением.

          ## Правила

          - Метод — только экспортная процедура **серверного** общего модуля.
          - Нет интерактива: никаких `Вопрос`, `Предупреждение`, форм.
          - Ошибки логируйте в журнал регистрации: `ЗаписьЖурналаРегистрации(...)`.
          - Делайте задания **идемпотентными** — повторный запуск не должен дублировать данные.
        practice:
          - type: choice
            q: Где должен находиться метод регламентного задания?
            options: ["В модуле формы", "Экспортная процедура серверного общего модуля", "В модуле приложения", "В клиентском общем модуле"]
            answer: 1
          - type: fill
            q: Запустите процедуру в фоне
