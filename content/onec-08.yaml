          solution: |
            // Общий модуль РегламентныеЗаданияСервер (Сервер)
            Процедура ЗагрузкаКурсовВалют() Экспорт
                Попытка
                    С = Новый HTTPСоединение("www.cbr-xml-daily.ru", 443,,,, 30, Новый ЗащищенноеСоединениеOpenSSL);
                    Ответ = С.Получить(Новый HTTPЗапрос("/daily_json.js"));
                    Ч = Новый ЧтениеJSON; Ч.УстановитьСтроку(Ответ.ПолучитьТелоКакСтроку());
                    Данные = ПрочитатьJSON(Ч, Истина);
                    Дата = НачалоДня(ТекущаяДатаСеанса());
                    Для Каждого КЗ Из Данные["Valute"] Цикл
                        Валюта = Справочники.Валюты.НайтиПоНаименованию(КЗ.Ключ);
                        Если Валюта.Пустая() Тогда Продолжить; КонецЕсли;
                        Набор = РегистрыСведений.КурсыВалют.СоздатьНаборЗаписей();
                        Набор.Отбор.Период.Установить(Дата);
                        Набор.Отбор.Валюта.Установить(Валюта);
                        З = Набор.Добавить();
                        З.Период = Дата; З.Валюта = Валюта;
                        З.Курс = КЗ.Значение["Value"]; З.Кратность = КЗ.Значение["Nominal"];
                        Набор.Записать(Истина);   // замещение — без дублей
                    КонецЦикла;
                Исключение
                    ЗаписьЖурналаРегистрации("ЗагрузкаКурсов", УровеньЖурналаРегистрации.Ошибка,,,
                        ПодробноеПредставлениеОшибки(ИнформацияОбОшибке()));
                КонецПопытки;
            КонецПроцедуры

            // Форма обработки ЗакрытиеМесяца
            &НаКлиенте
            Процедура Запустить(Команда)
                ИДЗадания = ЗапуститьНаСервере(Объект.Период);
                ПодключитьОбработчикОжидания("ПроверитьЗадание", 2);
            КонецПроцедуры

            &НаСервереБезКонтекста
            Функция ЗапуститьНаСервере(Период)
                П = Новый Массив; П.Добавить(Период);
                Задание = ФоновыеЗадания.Выполнить("ЗакрытиеМесяца.Выполнить", П,
                    "Закрытие_" + Формат(Период, "ДФ=yyyyMM"), "Закрытие месяца");
                Возврат Задание.УникальныйИдентификатор;
            КонецФункции

            &НаКлиенте
            Процедура ПроверитьЗадание()
                Состояние = СостояниеНаСервере(ИДЗадания);
                Если Состояние <> "Активно" Тогда
                    ОтключитьОбработчикОжидания("ПроверитьЗадание");
                    Сообщить("Закрытие месяца: " + Состояние);
                КонецЕсли;
            КонецПроцедуры

            &НаСервереБезКонтекста
            Функция СостояниеНаСервере(ИД)
                З = ФоновыеЗадания.НайтиПоУникальномуИдентификатору(ИД);
                Возврат Строка(З.Состояние);
            КонецФункции
      - id: 1c-08-04
        title: Права, роли и RLS
        minutes: 35
        xp: 50
        theory: |
          Доступ в 1С строится на **ролях**. Пользователь получает набор ролей, права суммируются: если хоть одна роль разрешает — разрешено.

          ## Роли

          Роль — объект конфигурации (Общие → Роли), где для каждого объекта метаданных отмечены права: **Чтение, Добавление, Изменение, Удаление, Проведение, Просмотр, Редактирование, Интерактивное удаление** и т. д. Есть общие права: «Администрирование», «Внешнее соединение», «Тонкий клиент».

          Принцип **минимальных привилегий**: роли мелкие («ЧтениеНоменклатуры», «ДобавлениеИзменениеЗаказов»), пользователю — комбинация.

          ## Проверка прав в коде

          ```bsl
          Если Не ПравоДоступа("Проведение", Метаданные.Документы.РеализацияТоваров) Тогда
              ВызватьИсключение "Недостаточно прав для проведения";
          КонецЕсли;

          Если РольДоступна("Администратор") Тогда
              Элементы.Настройки.Видимость = Истина;
          КонецЕсли;
          ```

          В БСП: `Пользователи.РолиДоступны("ПолныеПрава")`, `ОбщегоНазначения.ПроверитьНаличиеПрава(...)`.

          ## RLS — ограничение доступа на уровне записей

          Права «на объект» говорят, можно ли читать документы **вообще**. **RLS** (Row Level Security) говорит, **какие именно**: менеджер видит только заказы своего подразделения.

          В роли для права «Чтение» документа пишется условие на языке запросов:

          ```bsl
          ГДЕ Подразделение = &ТекущееПодразделение
          ```

          или с шаблоном и `ЗначениеРазрешено`. Параметр `ТекущееПодразделение` — **параметр сеанса**, его заполняют при старте сеанса:

          ```bsl
          // Модуль сеанса
          Процедура УстановкаПараметровСеанса(ИменаПараметров)
              ПараметрыСеанса.ТекущийПользователь = Справочники.Пользователи.НайтиПоНаименованию(ИмяПользователя());
              ПараметрыСеанса.ТекущееПодразделение = ПараметрыСеанса.ТекущийПользователь.Подразделение;
          КонецПроцедуры
          ```

          ## Привилегированный режим

          Иногда код должен обойти ограничения (например, проведение пишет в регистр, к которому у пользователя нет прав):

          ```bsl
          УстановитьПривилегированныйРежим(Истина);
          // ...
          УстановитьПривилегированныйРежим(Ложь);
          ```

          Или **привилегированный общий модуль**. Используйте точечно и не отдавайте наружу данные, которые пользователь видеть не должен.

          ## Особенности RLS

          - Запрос к запрещённым записям с RLS **выдаст ошибку**, если не указано `РАЗРЕШЕННЫЕ`: `ВЫБРАТЬ РАЗРЕШЕННЫЕ ...` — молча отфильтрует.
          - RLS замедляет запросы — условия должны быть простыми и по индексированным полям.
          - В БСП — подсистема «Управление доступом» с группами доступа вместо ручных условий.
        practice:
          - type: choice
            q: Как суммируются права нескольких ролей пользователя?
            options: ["Действует самая строгая роль", "Разрешено, если хотя бы одна роль разрешает", "Действует первая роль в списке", "Права не суммируются"]
