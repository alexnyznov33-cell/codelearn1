            explain: Привилегированный режим обходит RLS и отдаёт пользователю чужие заказы.
        homework:
          task: |
            Настройте доступ: роли «Менеджер» (чтение номенклатуры, создание и проведение заказов), «Кладовщик» (только складские документы), «Администратор». Добавьте параметр сеанса ТекущееПодразделение и RLS на чтение/изменение заказов по подразделению. На форме заказа скрывайте поле «Скидка» для пользователей без роли «РедактированиеСкидок». Все отчёты — с РАЗРЕШЕННЫЕ.
