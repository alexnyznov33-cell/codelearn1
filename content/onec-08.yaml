          task: |
            Создайте регламентное задание «ЗагрузкаКурсовВалют» (ежедневно в 03:00), которое по HTTP получает курсы и записывает в регистр сведений КурсыВалют без дублей. На форме обработки «Закрытие месяца» сделайте кнопку, запускающую расчёт в фоновом задании с ключом и проверкой состояния через обработчик ожидания.
