        homework:
          task: |
            Постройте дерево «Структура компании»: Компания → Отделы (Продажи, Склад, Бухгалтерия) → Сотрудники (ФИО, Оклад). Напишите рекурсивные процедуры: вывод дерева с отступами; подсчёт фонда оплаты труда по каждому отделу и по компании (записать сумму в строки групп); поиск сотрудника по ФИО во всём дереве с выводом названия его отдела (через Родитель).
          checklist:
            - Минимум 3 уровня
            - Итоги групп считаются рекурсивно
            - Используется Родитель
          solution: |
            Функция ДобавитьУзел(Строки, Наименование, Оклад = 0)
                Узел = Строки.Добавить();
                Узел.Наименование = Наименование;
                Узел.Оклад = Оклад;
                Возврат Узел;
            КонецФункции

            Процедура ВывестиДерево(Строки, Отступ = "")
                Для Каждого Стр Из Строки Цикл
                    Сообщить(Отступ + Стр.Наименование + " (" + Стр.Оклад + ")");
                    ВывестиДерево(Стр.Строки, Отступ + "    ");
                КонецЦикла;
            КонецПроцедуры

            Функция ПосчитатьФОТ(Строки)
                Всего = 0;
                Для Каждого Стр Из Строки Цикл
                    Если Стр.Строки.Количество() > 0 Тогда
                        Стр.Оклад = ПосчитатьФОТ(Стр.Строки);
                    КонецЕсли;
                    Всего = Всего + Стр.Оклад;
                КонецЦикла;
                Возврат Всего;
            КонецФункции

            Процедура Тест() Экспорт
                Дерево = Новый ДеревоЗначений;
                Дерево.Колонки.Добавить("Наименование", Новый ОписаниеТипов("Строка"));
                Дерево.Колонки.Добавить("Оклад", Новый ОписаниеТипов("Число"));
                Компания = ДобавитьУзел(Дерево.Строки, "ООО Ромашка");
                Продажи = ДобавитьУзел(Компания.Строки, "Продажи");
                ДобавитьУзел(Продажи.Строки, "Иванов И.И.", 80000);
                ДобавитьУзел(Продажи.Строки, "Петрова А.С.", 75000);
                Склад = ДобавитьУзел(Компания.Строки, "Склад");
                ДобавитьУзел(Склад.Строки, "Сидоров П.П.", 50000);
                Бух = ДобавитьУзел(Компания.Строки, "Бухгалтерия");
                ДобавитьУзел(Бух.Строки, "Кузнецова О.В.", 90000);

                ПосчитатьФОТ(Дерево.Строки);
                ВывестиДерево(Дерево.Строки);

                Найденный = Дерево.Строки.Найти("Сидоров П.П.", "Наименование", Истина);
                Если Найденный <> Неопределено Тогда
                    Сообщить("Отдел: " + Найденный.Родитель.Наименование); // Склад
                КонецЕсли;
            КонецПроцедуры
