          solution: |
            Функция ТопN(Массив, N)
                Список = Новый СписокЗначений;
                Список.ЗагрузитьЗначения(Массив);
                Список.СортироватьПоЗначению(НаправлениеСортировки.Убыв);
                Результат = Новый Массив;
                Для Индекс = 0 По Мин(N, Список.Количество()) - 1 Цикл
                    Результат.Добавить(Список[Индекс].Значение);
                КонецЦикла;
                Возврат Результат;
            КонецФункции

            Процедура Тест()
                Числа = Новый Массив;
                Для Каждого Ч Из СтрРазделить("5,17,3,42,8,23", ",") Цикл
                    Числа.Добавить(Число(Ч));
                КонецЦикла;
                Сообщить(СтрСоединить(ТопN(Числа, 3), ", ")); // 42, 23, 17

                Дни = Новый СписокЗначений;
                Названия = СтрРазделить("Понедельник,Вторник,Среда,Четверг,Пятница,Суббота,Воскресенье", ",");
                Для Номер = 1 По 7 Цикл
                    Дни.Добавить(Номер, Названия[Номер - 1], Номер >= 6);
                КонецЦикла;
                Для Каждого День Из Дни Цикл
                    Если День.Пометка Тогда
                        Сообщить("Выходной: " + День.Представление);
                    КонецЕсли;
                КонецЦикла;
                Сообщить(Дни.НайтиПоЗначению(3).Представление); // Среда
            КонецПроцедуры
      - id: 1c-02-05
        title: ТаблицаЗначений
        minutes: 40
        xp: 40
        theory: |
          **ТаблицаЗначений** — самая используемая коллекция 1С: таблица с **колонками** и **строками** в памяти. Результаты запросов, табличные части, расчёты — всё это удобно обрабатывать как таблицу значений. Существует **только на сервере** (и в толстом клиенте).

          ```bsl
          Таблица = Новый ТаблицаЗначений;
          Таблица.Колонки.Добавить("Товар", Новый ОписаниеТипов("Строка"));
          Таблица.Колонки.Добавить("Количество", Новый ОписаниеТипов("Число"));
          Таблица.Колонки.Добавить("Сумма", Новый ОписаниеТипов("Число"));

          Строка = Таблица.Добавить();
          Строка.Товар = "Чай";
          Строка.Количество = 2;
          Строка.Сумма = 600;

          Строка = Таблица.Добавить();
          Строка.Товар = "Кофе";
          Строка.Количество = 1;
          Строка.Сумма = 500;

          Сообщить(Таблица.Количество());     // 2 строки
          Сообщить(Таблица[0].Товар);         // Чай
          ```

          ## Обход и поиск

          ```bsl
          Для Каждого Стр Из Таблица Цикл
              Сообщить(Стр.Товар + ": " + Стр.Сумма);
          КонецЦикла;

          Найденная = Таблица.Найти("Кофе", "Товар");                 // первая строка или Неопределено
          Строки = Таблица.НайтиСтроки(Новый Структура("Товар", "Чай")); // массив строк по отбору
          ```

          ## Группировка, итоги, сортировка

          ```bsl
          Таблица.Свернуть("Товар", "Количество, Сумма");   // сгруппировать по Товар, просуммировать
          Таблица.Сортировать("Сумма Убыв, Товар");
          Всего = Таблица.Итог("Сумма");
          ```

          `Свернуть(КолонкиГруппировки, КолонкиСуммирования)` — аналог GROUP BY прямо в памяти.

          ## Другие полезные методы

          | Метод | Назначение |
          |---|---|
          | `Вставить(Индекс)` | вставить строку |
          | `Удалить(Строка)` | удалить строку |
          | `Скопировать(Отбор, Колонки)` | копия (с отбором и выбранными колонками) |
          | `ВыгрузитьКолонку("Товар")` | массив значений колонки |
          | `ЗагрузитьКолонку(Массив, "Товар")` | заполнить колонку |
          | `Индексы.Добавить("Товар")` | индекс для быстрого поиска |
          | `ЗаполнитьЗначения(0, "Сумма")` | заполнить колонку значением |
          | `Колонки.Удалить("Сумма")` | удалить колонку |

          ## Из запроса

          ```bsl
          Запрос = Новый Запрос("ВЫБРАТЬ Ссылка, Наименование ИЗ Справочник.Номенклатура");
          ТаблицаТоваров = Запрос.Выполнить().Выгрузить();
          ```

          ## Важно

          - Указывайте **типы колонок** через `ОписаниеТипов` — без типа колонка «произвольная», это медленнее и мешает работе с таблицей в запросах.
          - Для поиска по большой таблице создавайте **индекс** — иначе каждый `Найти` перебирает все строки.
          - На клиент таблицу значений передать нельзя — для форм используют реквизит типа «ТаблицаЗначений» (он становится `ДанныеФормыКоллекция`) и `ЗначениеВРеквизитФормы`.
          - Таблицу значений можно передать в запрос как параметр и выбрать из неё: `ВЫБРАТЬ ... ИЗ &Таблица КАК Т` (обычно во временную таблицу).
