                    Сообщить("Топ " + (Индекс + 1) + ": " + ПоТоварам[Индекс].Товар);
                КонецЦикла;

                Строки = Продажи.НайтиСтроки(Новый Структура("Менеджер", "Иванов"));
                Сообщить("Строк у Иванова: " + Строки.Количество());

                Уникальные = Продажи.Скопировать(, "Товар");
                Уникальные.Свернуть("Товар");
                Сообщить(СтрСоединить(Уникальные.ВыгрузитьКолонку("Товар"), ", "));
            КонецПроцедуры
      - id: 1c-02-06
        title: ДеревоЗначений
        minutes: 30
        xp: 35
        theory: |
          **ДеревоЗначений** — иерархическая таблица: у каждой строки могут быть **подчинённые строки**. Подходит для групп номенклатуры, структуры подразделений, отчётов с группировками, результатов запроса с `ИТОГИ`.

          ```bsl
          Дерево = Новый ДеревоЗначений;
          Дерево.Колонки.Добавить("Наименование", Новый ОписаниеТипов("Строка"));
          Дерево.Колонки.Добавить("Сумма", Новый ОписаниеТипов("Число"));

          Напитки = Дерево.Строки.Добавить();
          Напитки.Наименование = "Напитки";

          Чай = Напитки.Строки.Добавить();       // подчинённая строка
          Чай.Наименование = "Чай";
          Чай.Сумма = 600;

          Кофе = Напитки.Строки.Добавить();
          Кофе.Наименование = "Кофе";
          Кофе.Сумма = 500;

          Сообщить(Дерево.Строки.Количество());          // 1 — только верхний уровень
          Сообщить(Напитки.Строки.Количество());         // 2
          Сообщить(Чай.Родитель.Наименование);           // Напитки
          Сообщить(Чай.Уровень());                       // 1 (верхний уровень — 0)
          ```

          ## Рекурсивный обход

          Обработка дерева почти всегда — **рекурсия**:

          ```bsl
          Процедура ВывестиДерево(Строки, Отступ = "")
              Для Каждого Стр Из Строки Цикл
                  Сообщить(Отступ + Стр.Наименование);
                  ВывестиДерево(Стр.Строки, Отступ + "    ");
              КонецЦикла;
          КонецПроцедуры

          ВывестиДерево(Дерево.Строки);
          ```

          ## Подсчёт итогов по группам

          ```bsl
          Функция ПосчитатьИтоги(Строки)
              Всего = 0;
              Для Каждого Стр Из Строки Цикл
                  Если Стр.Строки.Количество() > 0 Тогда
                      Стр.Сумма = ПосчитатьИтоги(Стр.Строки);   // группа = сумма детей
                  КонецЕсли;
                  Всего = Всего + Стр.Сумма;
              КонецЦикла;
              Возврат Всего;
          КонецФункции
          ```

          ## Поиск

          ```bsl
          Найденная = Дерево.Строки.Найти("Кофе", "Наименование", Истина);   // Истина — искать во вложенных
          Массив = Дерево.Строки.НайтиСтроки(Новый Структура("Сумма", 0), Истина);
          ```

          ## Из запроса с иерархией

          ```bsl
          Запрос.Текст = "ВЫБРАТЬ Ссылка, Наименование ИЗ Справочник.Номенклатура УПОРЯДОЧИТЬ ПО Наименование ИЕРАРХИЯ";
          Дерево = Запрос.Выполнить().Выгрузить(ОбходРезультатаЗапроса.ПоГруппировкамСИерархией);
          ```

          Как и таблица значений, дерево живёт только на сервере; на форме используется реквизит типа «ДеревоЗначений» и элемент «Таблица» с отображением дерева. Для отрисовки на форме — `ЗначениеВРеквизитФормы(Дерево, "ДеревоТоваров")`.
        practice:
          - type: output
            q: Что выведет код?
