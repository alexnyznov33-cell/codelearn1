id: onec
modules:
  - id: 1c-m2
    title: Универсальные коллекции
    level: Junior
    lessons:
      - id: 1c-02-01
        title: Массив
        minutes: 30
        xp: 30
        theory: |
          **Массив** — упорядоченная коллекция значений любых типов. Индексы начинаются с **0**.

          ```bsl
          Товары = Новый Массив;
          Товары.Добавить("Чай");
          Товары.Добавить("Кофе");
          Товары.Вставить(0, "Сахар");          // вставить по индексу
          Сообщить(Товары[0]);                  // Сахар
          Сообщить(Товары.Количество());        // 3

          Числа = Новый Массив(3);              // массив из 3 элементов Неопределено
          Числа[0] = 10;
          ```

          ## Основные методы

          | Метод | Назначение |
          |---|---|
          | `Добавить(Значение)` | в конец |
          | `Вставить(Индекс, Значение)` | по индексу |
          | `Количество()` | число элементов |
          | `Найти(Значение)` | индекс или `Неопределено` |
          | `Удалить(Индекс)` | удалить элемент |
          | `Очистить()` | удалить всё |
          | `ВГраница()` | последний индекс (Количество − 1) |
          | `Получить(Индекс)` / `Установить(Индекс, Значение)` | то же, что `[ ]` |

          ## Обход

          ```bsl
          Для Каждого Товар Из Товары Цикл
              Сообщить(Товар);
          КонецЦикла;

          Для Индекс = 0 По Товары.ВГраница() Цикл
              Сообщить("" + Индекс + ": " + Товары[Индекс]);
          КонецЦикла;
          ```

          ## Удаление в цикле

          При удалении элементов идите **с конца**, иначе индексы «съедут»:

          ```bsl
          Для Индекс = -Товары.ВГраница() По 0 Цикл
              Если Товары[-Индекс] = "Кофе" Тогда
                  Товары.Удалить(-Индекс);
              КонецЕсли;
          КонецЦикла;
          ```

          (Цикл `Для` в 1С умеет только увеличивать счётчик, поэтому используют приём с отрицательным индексом или цикл `Пока`.)

          ## Проверка наличия

          ```bsl
          Если Товары.Найти("Чай") <> Неопределено Тогда
              Сообщить("Чай есть");
          КонецЕсли;
          ```

          ## Особенности

          - Массив — **ссылочный** тип: присваивание `Б = А` не копирует, обе переменные указывают на один массив.
          - Массив можно передавать между клиентом и сервером, если его элементы — примитивные значения или ссылки.
          - Для типизированных данных с колонками лучше подходит `ТаблицаЗначений`, для пар «ключ — значение» — `Соответствие` или `Структура`.
          - `ФиксированныйМассив` — неизменяемая версия (`Новый ФиксированныйМассив(Массив)`).
          - Строку в массив: `СтрРазделить("а,б,в", ",")`; обратно — `СтрСоединить(Массив, ", ")`.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              М = Новый Массив;
              М.Добавить(5);
              М.Добавить(7);
              М.Вставить(0, 3);
              Сообщить(М[1]);
            answer: "5"
          - type: output
            q: Что выведет код?
            code: |
              М = СтрРазделить("красный,зелёный,синий", ",");
              Сообщить(М.ВГраница());
            answer: "2"
          - type: fill
            q: Проверьте, есть ли значение в массиве
            code: |
              Если Список.___("Молоко") <> ___ Тогда
                  Сообщить("Найдено");
              КонецЕсли;
            answers: ["Найти", "Неопределено"]
          - type: output
            q: Что выведет код?
            code: |
              А = Новый Массив;
              А.Добавить(1);
              Б = А;
              Б.Добавить(2);
              Сообщить(А.Количество());
            answer: "2"
          - type: bug
            q: Где ошибка?
            code: |
              М = Новый Массив;
              М.Добавить("Чай");
              М.Добавить("Кофе");
              Сообщить(М[2]);
            bugLine: 4
            fix: Сообщить(М[1]);
            explain: Индексы начинаются с 0 — в массиве из двух элементов последний индекс 1, обращение к [2] вызовет ошибку.
        homework:
          task: |
            Напишите процедуру, которая из строки «яблоко, груша, яблоко, слива, груша, вишня» формирует массив уникальных фруктов (без пробелов), сортирует его по алфавиту (подсказка: через СписокЗначений или ТаблицаЗначений) и выводит через `СтрСоединить`. Затем удалите из массива все элементы, начинающиеся на «г», корректно обходя массив с конца.
          checklist:
            - Используется СтрРазделить и СокрЛП
            - Нет дублей (проверка через Найти)
            - Удаление идёт с конца массива
          solution: |
            Процедура ОбработатьФрукты()
                Исходные = СтрРазделить("яблоко, груша, яблоко, слива, груша, вишня", ",");
                Уникальные = Новый Массив;
                Для Каждого Фрукт Из Исходные Цикл
                    Фрукт = СокрЛП(Фрукт);
                    Если Уникальные.Найти(Фрукт) = Неопределено Тогда
                        Уникальные.Добавить(Фрукт);
                    КонецЕсли;
                КонецЦикла;

                Список = Новый СписокЗначений;
                Список.ЗагрузитьЗначения(Уникальные);
                Список.СортироватьПоЗначению();
                Уникальные = Список.ВыгрузитьЗначения();
                Сообщить(СтрСоединить(Уникальные, ", ")); // вишня, груша, слива, яблоко

                Индекс = Уникальные.ВГраница();
                Пока Индекс >= 0 Цикл
                    Если СтрНачинаетсяС(Уникальные[Индекс], "г") Тогда
                        Уникальные.Удалить(Индекс);
                    КонецЕсли;
                    Индекс = Индекс - 1;
                КонецЦикла;
                Сообщить(СтрСоединить(Уникальные, ", ")); // вишня, слива, яблоко
            КонецПроцедуры
      - id: 1c-02-02
        title: Структура
        minutes: 25
        xp: 30
        theory: |
          **Структура** — набор именованных значений: «ключ — значение», где ключ — строка-идентификатор. Похожа на объект в JS.

          ```bsl
          Клиент = Новый Структура;
          Клиент.Вставить("Имя", "Анна");
          Клиент.Вставить("Возраст", 25);

          // То же короче: ключи через запятую, затем значения
          Клиент = Новый Структура("Имя, Возраст, Город", "Анна", 25, "Казань");

          Сообщить(Клиент.Имя);           // Анна — обращение через точку
          Сообщить(Клиент["Город"]);      // Казань — через квадратные скобки
          Клиент.Возраст = 26;            // изменить существующий ключ
          ```

          ## Методы

          | Метод | Назначение |
          |---|---|
          | `Вставить(Ключ, Значение)` | добавить или заменить |
          | `Свойство(Ключ, Значение)` | есть ли ключ (+ получить значение во 2-й параметр) |
          | `Удалить(Ключ)` | удалить |
          | `Количество()` | число ключей |
          | `Очистить()` | удалить все |

          ## Безопасное чтение

          Обращение к несуществующему ключу через точку вызывает ошибку. Проверяйте через `Свойство`:

          ```bsl
          Телефон = Неопределено;
          Если Клиент.Свойство("Телефон", Телефон) Тогда
              Сообщить(Телефон);
          Иначе
              Сообщить("Телефон не указан");
          КонецЕсли;
          ```

          ## Обход

          ```bsl
          Для Каждого КлючИЗначение Из Клиент Цикл
              Сообщить(КлючИЗначение.Ключ + " = " + КлючИЗначение.Значение);
          КонецЦикла;
          ```

          ## Когда использовать

          - **Параметры процедур** — вместо десятка параметров одна структура (`ПараметрыЗаполнения`).
          - **Возврат нескольких значений** из функции.
          - Передача данных с сервера на клиент (если значения сериализуемые).
          - Ключ **не может** содержать пробелы и начинаться с цифры (это идентификатор). Для произвольных ключей — `Соответствие`.

          ```bsl
          Функция ПосчитатьИтоги(Количество, Цена)
              Сумма = Количество * Цена;
              Возврат Новый Структура("Сумма, НДС", Сумма, Сумма * 20 / 120);
          КонецФункции

          Итоги = ПосчитатьИтоги(2, 300);
          Сообщить(Итоги.Сумма);   // 600
          ```

          `ФиксированнаяСтруктура` — неизменяемая версия, часто используется для параметров сеанса и кешей.
        practice:
          - type: output
