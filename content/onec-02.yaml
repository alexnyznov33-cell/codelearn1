                    Ч = СтрРазделить(Запись, ";");
                    Стр = Т.Добавить();
                    Стр.Дата = ТекущаяДатаСеанса();
                    Стр.Менеджер = Ч[0]; Стр.Товар = Ч[1];
                    Стр.Количество = Число(Ч[2]); Стр.Сумма = Число(Ч[3]);
                КонецЦикла;
                Возврат Т;
            КонецФункции

