          solution: |
            Функция СоздатьПродажи()
                Т = Новый ТаблицаЗначений;
                Т.Колонки.Добавить("Дата", Новый ОписаниеТипов("Дата"));
                Т.Колонки.Добавить("Менеджер", Новый ОписаниеТипов("Строка", , Новый КвалификаторыСтроки(50)));
                Т.Колонки.Добавить("Товар", Новый ОписаниеТипов("Строка", , Новый КвалификаторыСтроки(100)));
                Т.Колонки.Добавить("Количество", Новый ОписаниеТипов("Число", Новый КвалификаторыЧисла(10, 0)));
                Т.Колонки.Добавить("Сумма", Новый ОписаниеТипов("Число", Новый КвалификаторыЧисла(15, 2)));
                Т.Индексы.Добавить("Товар");
                Данные = "Иванов;Чай;2;600|Петрова;Кофе;1;500|Иванов;Кофе;3;1500|Сидоров;Мёд;1;450|Петрова;Чай;5;1500|" +
                         "Иванов;Мёд;2;900|Сидоров;Чай;1;300|Петрова;Какао;4;1000|Иванов;Какао;1;250|Сидоров;Кофе;2;1000";
