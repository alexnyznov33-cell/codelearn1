            explain: Ключ структуры должен быть идентификатором — пробелы недопустимы.
          - type: output
            q: Что выведет код?
            code: |
              С = Новый Структура("Х, У", 3, 4);
              С.Удалить("Х");
              С.Вставить("Z", 5);
              Сообщить(С.Количество());
            answer: "2"
        homework:
          task: |
            Напишите функцию `РассчитатьЗаказ(Позиции, Параметры)`, где Позиции — массив структур (Товар, Количество, Цена), а Параметры — структура с необязательными ключами `ПроцентСкидки` и `СтоимостьДоставки`. Функция возвращает структуру с ключами `Сумма`, `Скидка`, `Доставка`, `Итого`. Отсутствующие параметры считаются нулём (используйте `Свойство`). Выведите все ключи результата обходом.
          checklist:
            - Позиции — массив структур
            - Необязательные параметры читаются через Свойство
            - Функция возвращает структуру
          solution: |
            Функция РассчитатьЗаказ(Позиции, Параметры)
                Сумма = 0;
                Для Каждого Позиция Из Позиции Цикл
                    Сумма = Сумма + Позиция.Количество * Позиция.Цена;
                КонецЦикла;

                Процент = 0;
                Параметры.Свойство("ПроцентСкидки", Процент);
                Процент = ?(Процент = Неопределено, 0, Процент);
                Доставка = 0;
                Параметры.Свойство("СтоимостьДоставки", Доставка);
                Доставка = ?(Доставка = Неопределено, 0, Доставка);

                Скидка = Окр(Сумма * Процент / 100, 2);
                Возврат Новый Структура("Сумма, Скидка, Доставка, Итого", Сумма, Скидка, Доставка, Сумма - Скидка + Доставка);
            КонецФункции

            Процедура Тест()
                Позиции = Новый Массив;
                Позиции.Добавить(Новый Структура("Товар, Количество, Цена", "Чай", 2, 300));
                Позиции.Добавить(Новый Структура("Товар, Количество, Цена", "Мёд", 1, 450));
                Результат = РассчитатьЗаказ(Позиции, Новый Структура("ПроцентСкидки", 10));
                Для Каждого КиЗ Из Результат Цикл
                    Сообщить(КиЗ.Ключ + ": " + КиЗ.Значение);
                КонецЦикла;
                // Сумма: 1 050, Скидка: 105, Доставка: 0, Итого: 945
            КонецПроцедуры
      - id: 1c-02-03
        title: Соответствие
        minutes: 25
        xp: 30
        theory: |
          **Соответствие** — словарь, где ключом может быть **значение любого типа**: строка с пробелами, число, дата, ссылка на справочник. Аналог Map в других языках.

          ```bsl
          Цены = Новый Соответствие;
          Цены.Вставить("Зелёный чай", 300);
          Цены.Вставить("Кофе", 500);
          Цены["Какао"] = 250;                   // добавить или заменить

          Сообщить(Цены["Кофе"]);                // 500
          Сообщить(Цены.Получить("Кофе"));       // 500
          Сообщить(Цены["Сок"]);                 // Неопределено — ключа нет, ошибки не будет
          ```

          ## Методы

          `Вставить(Ключ, Значение)`, `Получить(Ключ)`, `Удалить(Ключ)`, `Количество()`, `Очистить()`.

          ## Проверка наличия ключа

          `Получить` возвращает `Неопределено`, если ключа нет. Если значение само может быть `Неопределено`, это неоднозначно — тогда храните, например, `Истина` или структуры.

          ```bsl
          Если Цены["Сок"] = Неопределено Тогда
              Сообщить("Нет цены на сок");
          КонецЕсли;
          ```

          ## Подсчёт и группировка

          Классическая задача — посчитать количество по ключу:

          ```bsl
          Продажи = СтрРазделить("чай,кофе,чай,какао,чай", ",");
          Счётчик = Новый Соответствие;
          Для Каждого Товар Из Продажи Цикл
              Текущее = Счётчик[Товар];
              Счётчик[Товар] = ?(Текущее = Неопределено, 1, Текущее + 1);
          КонецЦикла;

          Для Каждого КлючИЗначение Из Счётчик Цикл
              Сообщить(КлючИЗначение.Ключ + ": " + КлючИЗначение.Значение);
          КонецЦикла;
          ```

          ## Ссылки как ключи

          Очень частый приём — кеш данных по ссылкам, чтобы не обращаться к базе в цикле повторно:

          ```bsl
          КешЦен = Новый Соответствие;
          Для Каждого Строка Из Товары Цикл
              Цена = КешЦен[Строка.Номенклатура];
              Если Цена = Неопределено Тогда
                  Цена = ПолучитьЦену(Строка.Номенклатура);
                  КешЦен.Вставить(Строка.Номенклатура, Цена);
              КонецЕсли;
          КонецЦикла;
          ```

          ## Структура или Соответствие?

          | | Структура | Соответствие |
          |---|---|---|
          | Ключи | только строки-идентификаторы | любые значения |
          | Обращение | `С.Ключ` | `С[Ключ]` |
          | Нет ключа | ошибка (через точку) | `Неопределено` |
          | Порядок обхода | порядок добавления | не гарантирован |

          `ФиксированноеСоответствие` — неизменяемая версия.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              С = Новый Соответствие;
              С.Вставить(1, "один");
              С.Вставить("1", "строка");
              Сообщить(С.Количество());
            answer: "2"
          - type: output
            q: Что выведет код?
            code: |
              С = Новый Соответствие;
              С["Чай"] = 300;
              С["Чай"] = 350;
              Сообщить(С["Чай"]);
            answer: "350"
          - type: fill
            q: Увеличьте счётчик по ключу
            code: |
              Текущее = Счётчик[Ключ];
              Счётчик[Ключ] = ?(Текущее = ___, 1, Текущее + 1);
            answers: ["Неопределено"]
          - type: choice
            q: Нужен словарь с ключами — ссылками на номенклатуру. Что выбрать?
            options: ["Структура", "Соответствие", "Массив", "Строка"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              С = Новый Соответствие;
              С.Вставить("а", 1);
              Сообщить(С["б"] = Неопределено);
            answer: Да
        homework:
          task: |
            Дан массив структур продаж (Менеджер, Товар, Сумма). Используя соответствия, посчитайте: (1) сумму продаж по каждому менеджеру; (2) количество уникальных товаров у каждого менеджера (соответствие менеджер → соответствие товаров); (3) найдите лучшего менеджера по сумме. Выведите результат.
          checklist:
            - Используются вложенные соответствия
            - Корректно обрабатывается отсутствие ключа
            - Найден максимум
          solution: |
            Процедура АнализПродаж()
                Продажи = Новый Массив;
                Продажи.Добавить(Новый Структура("Менеджер, Товар, Сумма", "Иванов", "Чай", 300));
                Продажи.Добавить(Новый Структура("Менеджер, Товар, Сумма", "Петрова", "Кофе", 500));
                Продажи.Добавить(Новый Структура("Менеджер, Товар, Сумма", "Иванов", "Кофе", 450));
                Продажи.Добавить(Новый Структура("Менеджер, Товар, Сумма", "Иванов", "Чай", 200));

                Суммы = Новый Соответствие;
                Товары = Новый Соответствие;
                Для Каждого П Из Продажи Цикл
                    Текущая = Суммы[П.Менеджер];
                    Суммы[П.Менеджер] = ?(Текущая = Неопределено, 0, Текущая) + П.Сумма;

                    ТоварыМенеджера = Товары[П.Менеджер];
                    Если ТоварыМенеджера = Неопределено Тогда
                        ТоварыМенеджера = Новый Соответствие;
                        Товары.Вставить(П.Менеджер, ТоварыМенеджера);
                    КонецЕсли;
                    ТоварыМенеджера.Вставить(П.Товар, Истина);
                КонецЦикла;

                Лучший = ""; Максимум = 0;
                Для Каждого КиЗ Из Суммы Цикл
                    Сообщить(КиЗ.Ключ + ": сумма " + КиЗ.Значение + ", товаров " + Товары[КиЗ.Ключ].Количество());
                    Если КиЗ.Значение > Максимум Тогда
                        Максимум = КиЗ.Значение;
                        Лучший = КиЗ.Ключ;
                    КонецЕсли;
                КонецЦикла;
                Сообщить("Лучший менеджер: " + Лучший); // Иванов (950)
            КонецПроцедуры
      - id: 1c-02-04
        title: СписокЗначений
        minutes: 25
        xp: 30
        theory: |
          **СписокЗначений** — упорядоченный список элементов, у каждого из которых есть `Значение`, `Представление` (текст для пользователя), `Пометка` (флажок) и `Картинка`. Чаще всего используется в интерфейсе: выпадающие списки, выбор из списка, отметка флажками.

          ```bsl
          Способы = Новый СписокЗначений;
          Способы.Добавить("courier", "Курьером");
          Способы.Добавить("pickup", "Самовывоз");
          Способы.Добавить("post", "Почтой России", Истина);   // с пометкой

          Сообщить(Способы.Количество());          // 3
          Элемент = Способы[0];
          Сообщить(Элемент.Значение);              // courier
          Сообщить(Элемент.Представление);         // Курьером
          ```

          ## Методы

          | Метод | Назначение |
          |---|---|
          | `Добавить(Значение, Представление, Пометка)` | в конец |
          | `Вставить(Индекс, ...)` | по индексу |
          | `НайтиПоЗначению(Значение)` | элемент или `Неопределено` |
          | `НайтиПоИдентификатору(Ид)` | элемент по идентификатору |
          | `СортироватьПоЗначению(Направление)` | сортировка |
          | `СортироватьПоПредставлению()` | сортировка по тексту |
          | `ЗагрузитьЗначения(Массив)` / `ВыгрузитьЗначения()` | обмен с массивом |
          | `Удалить(Элемент или Индекс)` | удалить |
          | `ВыбратьЭлемент(...)`, `ОтметитьЭлементы(...)` | диалоги на клиенте |

          ## Сортировка массива через список

          У массива нет метода сортировки, поэтому используют список:

          ```bsl
          Список = Новый СписокЗначений;
          Список.ЗагрузитьЗначения(МассивЧисел);
          Список.СортироватьПоЗначению(НаправлениеСортировки.Убыв);
          МассивЧисел = Список.ВыгрузитьЗначения();
          ```

          ## Помеченные элементы

          ```bsl
          Выбранные = Новый Массив;
          Для Каждого Элемент Из Способы Цикл
              Если Элемент.Пометка Тогда
                  Выбранные.Добавить(Элемент.Значение);
              КонецЕсли;
          КонецЦикла;
          ```

          ## В интерфейсе

          - Реквизит формы типа `СписокЗначений` + элемент «Таблица» — список с флажками.
          - Свойство поля ввода `СписокВыбора` — варианты в выпадающем списке.
          - Параметр запроса: `Запрос.УстановитьПараметр("Склады", СписокСкладов)` и условие `В (&Склады)`.
          - Интерактивный выбор: `Список.ПоказатьВыборЭлемента(Оповещение, "Выберите способ")` (асинхронно, на клиенте).
