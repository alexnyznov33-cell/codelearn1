            Напишите функцию `ТопN(Массив, N)`, которая возвращает массив из N наибольших чисел по убыванию (через СписокЗначений и сортировку). Затем сформируйте список значений «Дни недели» (значение — номер 1..7, представление — название), пометьте выходные и выведите названия помеченных дней, а также найдите элемент по значению 3.
