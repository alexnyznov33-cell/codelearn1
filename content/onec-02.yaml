              Д.Колонки.Добавить("Имя");
              А = Д.Строки.Добавить(); А.Имя = "А";
              Б = А.Строки.Добавить(); Б.Имя = "Б";
              В = Б.Строки.Добавить(); В.Имя = "В";
              Сообщить(В.Уровень());
