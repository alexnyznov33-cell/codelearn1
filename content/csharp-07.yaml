        homework:
          task: |
            Создайте решение из двух проектов: `Calc.Core` (библиотека с internal-классом и публичным API) и `Calc.App` (консоль). Подключите ProjectReference, NuGet-пакет `Humanizer`, откройте internal для тестового проекта через InternalsVisibleTo. Опубликуйте приложение: обычный `dotnet publish`, self-contained single-file и Native AOT; сравните размер и время старта.
          checklist:
