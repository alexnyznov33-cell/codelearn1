id: csharp
modules:
  - id: cs-m7
    title: Устройство .NET
    level: Middle
    lessons:
      - id: cs-07-01
        title: CLR, JIT, сборки
        minutes: 25
        xp: 35
        theory: |
          ## Путь от кода до процессора

          1. Компилятор **Roslyn** превращает C# в **IL** (Intermediate Language) — платформенно-независимый байт-код — и метаданные о типах.
          2. Результат упаковывается в **сборку** (assembly): `.dll` или `.exe`.
          3. При запуске **CLR** (Common Language Runtime) загружает сборку, а **JIT-компилятор** (RyuJIT) переводит IL в машинный код **при первом вызове** каждого метода.

          ```
          C# → (Roslyn) → IL + метаданные (.dll) → (JIT в рантайме) → x64/ARM машинный код
          ```

          Посмотреть IL: `ildasm`, ILSpy, dotPeek или сайт sharplab.io.

          ## Что даёт CLR

          - управление памятью и сборку мусора;
          - проверку типов и безопасность;
          - обработку исключений;
          - потоки, рефлексию, загрузку сборок;
          - межъязыковую совместимость (C#, F#, VB.NET компилируются в один IL).

          ## Tiered JIT и PGO

          Сначала метод компилируется быстро и без оптимизаций (**Tier 0**), а горячие методы (вызванные >30 раз) перекомпилируются с оптимизациями (**Tier 1**). Dynamic PGO собирает статистику выполнения и оптимизирует под реальную нагрузку (например, девиртуализирует вызовы).

          ## AOT

          - **ReadyToRun** — предкомпиляция для быстрого старта, JIT остаётся.
          - **Native AOT** (`<PublishAot>true</PublishAot>`) — один нативный бинарник без JIT: мгновенный старт, малая память; но ограничена рефлексия и динамическая загрузка.

          ## Сборки и зависимости

          - Сборка содержит манифест: имя, версия, ссылки на другие сборки.
          - **NuGet** — менеджер пакетов; зависимости описываются в `.csproj`:

          ```xml
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Serilog" Version="3.1.1" />
              <ProjectReference Include="..\Core\Core.csproj" />
            </ItemGroup>
          </Project>
          ```

          - `internal` — видимость в пределах сборки; `[InternalsVisibleTo("Tests")]` открывает их тестовому проекту.

          ## .NET Framework vs .NET

          .NET Framework 4.x — только Windows, развитие остановлено. Современный **.NET 8/9** — кроссплатформенный, open-source, быстрее. Новые проекты — только на .NET 8+ (LTS-версии — чётные).
        practice:
