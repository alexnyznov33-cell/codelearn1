        homework:
          task: |
            Перепишите «null-ориентированный» сервис на Optional: `UserRepository.findById` → Optional, `User.getManager()` возвращает Optional, метод `String managerCity(long userId)` (город менеджера пользователя или "не указан") одной цепочкой flatMap/map; метод `User getOrCreate(String email)` с orElseGet; `void notify(long id)` с ifPresentOrElse. Ни одного `get()` и проверки `!= null` в сервисе.
          checklist:
            - Нет вызовов get() и isPresent()+get()
            - flatMap для вложенных Optional
            - orElseGet для ленивого создания
          solution: |
            import java.util.*;

            record Address(String city) {}
            record User(long id, String email, Address address, Long managerId) {
                Optional<Address> addressOpt() { return Optional.ofNullable(address); }
            }

            class UserRepository {
                private final Map<Long, User> byId = new HashMap<>();
                Optional<User> findById(long id) { return Optional.ofNullable(byId.get(id)); }
                Optional<User> findByEmail(String e) { return byId.values().stream().filter(u -> u.email().equals(e)).findFirst(); }
                User save(User u) { byId.put(u.id(), u); return u; }
            }

            class UserService {
                private final UserRepository repo;
                UserService(UserRepository repo) { this.repo = repo; }

                Optional<User> manager(User u) { return Optional.ofNullable(u.managerId()).flatMap(repo::findById); }

                String managerCity(long userId) {
                    return repo.findById(userId)
                        .flatMap(this::manager)
                        .flatMap(User::addressOpt)
                        .map(Address::city)
                        .orElse("не указан");
                }
                User getOrCreate(String email) {
                    return repo.findByEmail(email).orElseGet(() -> repo.save(new User(System.nanoTime(), email, null, null)));
                }
                void notify(long id) {
                    repo.findById(id).ifPresentOrElse(
                        u -> System.out.println("Письмо для " + u.email()),
                        () -> System.out.println("Пользователь " + id + " не найден"));
                }
            }
