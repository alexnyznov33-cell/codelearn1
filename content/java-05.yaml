            code: |
              Map<Boolean, List<Integer>> p = Stream.of(1, 2, 3, 4, 5).collect(Collectors.partitioningBy(x -> x % 2 == 0));
              System.out.println(p.get(true) + " " + p.get(false));
            answer: "[2, 4] [1, 3, 5]"
          - type: choice
            q: Что произойдёт при toMap, если два элемента дают одинаковый ключ (без merge-функции)?
            options: ["Последний перезапишет", "IllegalStateException", "Ключ пропустится", "Создастся список"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              Map<Integer, List<String>> m = Stream.of("aa", "b", "cc", "ddd")
                  .collect(Collectors.groupingBy(String::length, TreeMap::new, Collectors.toList()));
              System.out.println(m);
            answer: "{1=[b], 2=[aa, cc], 3=[ddd]}"
        homework:
          task: |
            Аналитика продаж по списку `record Sale(String region, String manager, String product, LocalDate date, int qty, double price)`: (1) выручка по регионам (TreeMap); (2) лучший менеджер в каждом регионе; (3) продажи по месяцам `YearMonth → сумма`; (4) товары, разделённые на «хиты» (qty ≥ 100) и остальные; (5) статистика чеков; (6) регион → множество проданных товаров; (7) топ-5 товаров по выручке.
          checklist:
            - Используются groupingBy с downstream-коллекторами
            - partitioningBy и summarizing
            - Отсортированный вывод
          solution: |
            import java.time.*;
            import java.util.*;
            import static java.util.stream.Collectors.*;

            record Sale(String region, String manager, String product, LocalDate date, int qty, double price) {
                double revenue() { return qty * price; }
            }

            public class Analytics {
                public static void main(String[] args) {
                    List<Sale> s = List.of(
                        new Sale("Север", "Аня", "Чай", LocalDate.of(2024, 1, 5), 120, 100),
                        new Sale("Север", "Боб", "Кофе", LocalDate.of(2024, 1, 9), 30, 400),
                        new Sale("Юг", "Вика", "Чай", LocalDate.of(2024, 2, 1), 80, 100),
                        new Sale("Юг", "Вика", "Торт", LocalDate.of(2024, 2, 3), 10, 900));

                    var byRegion = s.stream().collect(groupingBy(Sale::region, TreeMap::new, summingDouble(Sale::revenue)));
                    var bestManager = s.stream().collect(groupingBy(Sale::region, collectingAndThen(
                        groupingBy(Sale::manager, summingDouble(Sale::revenue)),
                        m -> m.entrySet().stream().max(Map.Entry.comparingByValue()).map(Map.Entry::getKey).orElse("-"))));
                    var byMonth = s.stream().collect(groupingBy(x -> YearMonth.from(x.date()), TreeMap::new, summingDouble(Sale::revenue)));
                    var hits = s.stream().collect(groupingBy(Sale::product, summingInt(Sale::qty)))
                        .entrySet().stream().collect(partitioningBy(e -> e.getValue() >= 100, mapping(Map.Entry::getKey, toList())));
                    var stats = s.stream().collect(summarizingDouble(Sale::revenue));
                    var products = s.stream().collect(groupingBy(Sale::region, mapping(Sale::product, toCollection(TreeSet::new))));
                    var top5 = s.stream().collect(groupingBy(Sale::product, summingDouble(Sale::revenue)))
                        .entrySet().stream().sorted(Map.Entry.<String, Double>comparingByValue().reversed()).limit(5).toList();

                    System.out.println(byRegion + "\n" + bestManager + "\n" + byMonth + "\n" + hits + "\n" + stats + "\n" + products + "\n" + top5);
                }
            }
      - id: java-05-05
        title: Optional
        minutes: 25
        xp: 30
        theory: |
          `Optional<T>` — контейнер, который **может содержать значение или быть пустым**. Делает явным в сигнатуре метода: «результата может не быть» — вместо возврата `null` и `NullPointerException` где-то потом.

          ```java
          public Optional<User> findByEmail(String email) {
              return users.stream().filter(u -> u.email().equals(email)).findFirst();
          }
          ```

          ## Создание

          ```java
          Optional.of(value);          // value не null, иначе NPE
          Optional.ofNullable(value);  // null → пустой
          Optional.empty();
          ```

          ## Получение значения

          ```java
          Optional<User> u = repo.findByEmail("a@b.ru");

          String name = u.map(User::name).orElse("Гость");            // значение по умолчанию
          String n2 = u.map(User::name).orElseGet(() -> loadDefault());  // лениво (вычисляется только если пусто)
          User user = u.orElseThrow(() -> new NotFoundException("Нет пользователя"));
          User user2 = u.orElseThrow();                                // NoSuchElementException

          u.ifPresent(x -> sendEmail(x));
          u.ifPresentOrElse(this::greet, () -> System.out.println("не найден"));
          ```

          ⚠️ `orElse(expensive())` вычисляет аргумент **всегда**, даже если значение есть. Для дорогих вычислений — `orElseGet`.

          ## Преобразования (как у Stream)

          ```java
          Optional<String> city = repo.findById(id)
              .filter(User::isActive)
              .map(User::address)                    // Address может быть null → map вернёт empty
              .map(Address::city);

          Optional<Order> lastOrder = repo.findById(id).flatMap(orderRepo::findLastByUser);  // метод сам возвращает Optional

          Optional<User> any = local.find(id).or(() -> remote.find(id));   // Java 9: запасной Optional
          long count = optionals.stream().flatMap(Optional::stream).count(); // Java 9
          ```

          ## Правила использования

          ✅ Тип возвращаемого значения метода, где результата может не быть.

          ❌ Не используйте:
          - как поле класса и параметр метода (неудобно, не Serializable) — используйте `null`/перегрузку;
          - в коллекциях (`List<Optional<T>>`) — просто не кладите отсутствующие;
          - `opt.get()` без проверки и `if (opt.isPresent()) opt.get()` — используйте `map/orElse/ifPresent`;
          - для коллекций: вместо `Optional<List<T>>` возвращайте пустой список;
          - `Optional.of(null)` — NPE.

          Примитивные: `OptionalInt`, `OptionalDouble` (`IntStream.max()` возвращает `OptionalInt`).
