              Map<String, Long> m = emps.stream().collect(Collectors.groupingBy(Employee::dept, Collectors.___()));
            answers: ["counting"]
          - type: output
            q: Что выведет код?
            code: |
              System.out.println(Stream.of("a", "b", "c").collect(Collectors.joining("-", "<", ">")));
            answer: <a-b-c>
          - type: output
