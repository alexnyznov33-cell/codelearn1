          - type: choice
            q: Что произойдёт, если вызвать терминальную операцию на уже использованном stream?
            options: ["Повторный проход", "IllegalStateException", "Пустой результат", "Ошибка компиляции"]
            answer: 1
          - type: output
            q: Сколько раз выполнится peek?
            code: |
              Stream.of(1, 2, 3, 4, 5)
                  .peek(x -> System.out.print(x))
                  .filter(x -> x > 2)
                  .findFirst();
            answer: "123"
            explain: Ленивость — конвейер остановится, как только найдёт первый подходящий элемент (3).
        homework:
          task: |
            Есть список заказов `record Order(long id, String customer, LocalDate date, List<Item> items, boolean paid)` и `record Item(String name, int qty, double price)`. С помощью Stream API найдите: общую выручку по оплаченным, средний чек, самый дорогой заказ, всех уникальных клиентов по алфавиту, все проданные товары без повторов (flatMap), есть ли неоплаченные заказы старше 7 дней, первые 3 заказа по дате.
          checklist:
            - Нет циклов for
            - Используются flatMap, mapToDouble, Optional
            - Нет побочных эффектов в промежуточных операциях
          solution: |
            import java.time.LocalDate;
            import java.util.*;

            record Item(String name, int qty, double price) { double sum() { return qty * price; } }
            record Order(long id, String customer, LocalDate date, List<Item> items, boolean paid) {
                double total() { return items.stream().mapToDouble(Item::sum).sum(); }
            }

            public class Report {
                public static void main(String[] args) {
                    List<Order> orders = List.of(
                        new Order(1, "Боб", LocalDate.now().minusDays(10), List.of(new Item("Чай", 2, 150)), false),
                        new Order(2, "Аня", LocalDate.now().minusDays(2), List.of(new Item("Кофе", 1, 500), new Item("Чай", 1, 150)), true),
                        new Order(3, "Аня", LocalDate.now(), List.of(new Item("Торт", 1, 900)), true));

                    double revenue = orders.stream().filter(Order::paid).mapToDouble(Order::total).sum();
                    double avg = orders.stream().mapToDouble(Order::total).average().orElse(0);
                    Optional<Order> maxOrder = orders.stream().max(Comparator.comparingDouble(Order::total));
                    List<String> customers = orders.stream().map(Order::customer).distinct().sorted().toList();
                    List<String> goods = orders.stream().flatMap(o -> o.items().stream()).map(Item::name).distinct().toList();
                    boolean overdue = orders.stream().anyMatch(o -> !o.paid() && o.date().isBefore(LocalDate.now().minusDays(7)));
                    List<Long> first3 = orders.stream().sorted(Comparator.comparing(Order::date)).limit(3).map(Order::id).toList();

                    System.out.printf("%.2f %.2f %s %s %s %s %s%n", revenue, avg, maxOrder.map(Order::id).orElse(-1L), customers, goods, overdue, first3);
                }
            }
      - id: java-05-04
        title: Stream — collect и группировка
        minutes: 35
        xp: 40
        theory: |
          `collect(Collector)` — терминальная операция, собирающая элементы в коллекцию или агрегат. Готовые коллекторы — в `Collectors`.

          ## В коллекции

          ```java
          import static java.util.stream.Collectors.*;

          List<String> list = stream.collect(toList());          // изменяемый (или .toList() — неизменяемый)
          Set<String> set = stream.collect(toSet());
          TreeSet<String> ts = stream.collect(toCollection(TreeSet::new));

          Map<Long, User> byId = users.stream().collect(toMap(User::id, u -> u));
          // ⚠️ дубликат ключа → IllegalStateException; третий параметр решает конфликт:
          Map<String, Integer> m = words.stream().collect(toMap(w -> w, w -> 1, Integer::sum));
          ```

          ## Строки

          ```java
          String csv = names.stream().collect(joining(", ", "[", "]"));   // [Аня, Боб]
          ```

          ## groupingBy — главный инструмент отчётов

          ```java
          Map<String, List<Employee>> byDept = emps.stream().collect(groupingBy(Employee::dept));

          Map<String, Long> countByDept = emps.stream().collect(groupingBy(Employee::dept, counting()));

          Map<String, Double> avgSalary = emps.stream()
              .collect(groupingBy(Employee::dept, averagingDouble(Employee::salary)));

          Map<String, Optional<Employee>> topPaid = emps.stream()
              .collect(groupingBy(Employee::dept, maxBy(Comparator.comparingDouble(Employee::salary))));

          Map<String, Set<String>> namesByDept = emps.stream()
              .collect(groupingBy(Employee::dept, TreeMap::new, mapping(Employee::name, toCollection(TreeSet::new))));

          Map<String, Double> totalByDept = emps.stream()
              .collect(groupingBy(Employee::dept, summingDouble(Employee::salary)));
          ```

          Многоуровневая группировка: `groupingBy(Employee::dept, groupingBy(Employee::level))`.

          ## partitioningBy — на две группы

          ```java
          Map<Boolean, List<Employee>> seniors = emps.stream().collect(partitioningBy(e -> e.age() >= 40));
          seniors.get(true);
          ```

          ## Статистика

          ```java
          DoubleSummaryStatistics st = emps.stream().collect(summarizingDouble(Employee::salary));
          st.getMin(); st.getMax(); st.getAverage(); st.getSum(); st.getCount();
          ```

          ## Другие полезные

          `teeing(c1, c2, merger)` (Java 12) — два коллектора сразу; `collectingAndThen(toList(), Collections::unmodifiableList)`; `filtering`, `flatMapping` как downstream; `reducing`.

          ## Сортировка Map по значению

          ```java
          freq.entrySet().stream()
              .sorted(Map.Entry.<String, Long>comparingByValue().reversed())
              .limit(10)
              .forEach(e -> System.out.println(e.getKey() + ": " + e.getValue()));
          ```
        practice:
          - type: fill
            q: Сгруппируйте сотрудников по отделу с подсчётом
