            options: ["s -> s.isEmpty()", "x -> Math.abs(x)", "s -> s.substring(1)", "u -> u.getName()"]
            answer: 2
        homework:
          task: |
            Перепишите данный «многословный» код на ссылки на методы везде, где это улучшает читаемость: сортировка книг по автору и году, преобразование списка строк `"Название;Автор;Год"` в объекты через фабричный метод `Book::parse`, вывод, фильтрация по `Book::isClassic`, сбор в `TreeSet` через `TreeSet::new`.
          checklist:
            - Минимум 4 вида ссылок на методы использованы
            - Логика вынесена в методы с понятными именами
            - Нет лямбд, которые просто вызывают метод
          solution: |
            import java.util.*;
            import java.util.stream.Collectors;

            record Book(String title, String author, int year) {
                static Book parse(String line) {
                    String[] p = line.split(";");
                    return new Book(p[0], p[1], Integer.parseInt(p[2]));
                }
                boolean isClassic() { return year < 1950; }
            }

            public class Books {
                public static void main(String[] args) {
                    List<String> raw = List.of("Мастер и Маргарита;Булгаков;1967", "Война и мир;Толстой;1869", "Идиот;Достоевский;1869");
                    List<Book> books = raw.stream().map(Book::parse).collect(Collectors.toCollection(ArrayList::new));
                    books.sort(Comparator.comparing(Book::author).thenComparingInt(Book::year));
                    books.forEach(System.out::println);
                    TreeSet<String> classics = books.stream()
                        .filter(Book::isClassic)
                        .map(Book::title)
                        .map(String::toUpperCase)
                        .collect(Collectors.toCollection(TreeSet::new));
                    System.out.println(classics);
                }
            }
      - id: java-05-03
        title: Stream API — основы
        minutes: 35
        xp: 40
        theory: |
          **Stream** — конвейер обработки последовательности элементов: источник → промежуточные операции → терминальная операция.

          ```java
          List<String> names = List.of("Аня", "Боб", "Вика", "Гена", "Дима");

          List<String> result = names.stream()        // источник
              .filter(n -> n.length() > 3)              // промежуточные (ленивые)
              .map(String::toUpperCase)
              .sorted()
              .toList();                                // терминальная — запускает конвейер
          // [ВИКА, ГЕНА, ДИМА]
          ```

          ## Источники

          ```java
          list.stream(); set.stream(); map.entrySet().stream();
          Stream.of(1, 2, 3);
          Arrays.stream(array);
          IntStream.range(0, 10);          // 0..9
          IntStream.rangeClosed(1, 5);     // 1..5
          Stream.iterate(1, x -> x * 2).limit(10);
          Stream.generate(Math::random).limit(5);
          Files.lines(path);  "текст".chars();
          ```

          ## Промежуточные операции

          `filter`, `map`, `flatMap` (элемент → поток, «расплющивание»), `distinct`, `sorted()`, `sorted(cmp)`, `limit(n)`, `skip(n)`, `peek` (отладка), `takeWhile`, `dropWhile`, `mapToInt/mapToObj`.

          ```java
          List<List<Integer>> nested = List.of(List.of(1, 2), List.of(3));
          nested.stream().flatMap(List::stream).toList();     // [1, 2, 3]
          ```

          ## Терминальные операции

          ```java
          long n = stream.count();
          stream.forEach(System.out::println);
          boolean any = stream.anyMatch(x -> x > 5);          // allMatch, noneMatch
          Optional<String> first = stream.findFirst();
          Optional<Integer> max = stream.max(Integer::compare);
          int sum = IntStream.of(1, 2, 3).sum();               // average(), min(), max(), summaryStatistics()
          int total = list.stream().reduce(0, Integer::sum);
          List<T> l = stream.toList();                         // Java 16, неизменяемый
          ```

          ## Важные свойства

          - **Ленивость**: ничего не выполняется без терминальной операции. Элементы проходят конвейер по одному; `findFirst` после `filter` остановится на первом подходящем.
          - **Одноразовость**: поток нельзя использовать повторно (`IllegalStateException`).
          - **Без побочных эффектов**: не изменяйте внешние коллекции в `map`/`filter`/`forEach` — используйте `collect`.
          - Источник не изменяется.
          - Примитивные потоки (`IntStream`, `LongStream`, `DoubleStream`) — без упаковки, с `sum/average`.

          ## Цикл или Stream?

          Stream — для преобразований и агрегаций «что сделать», цикл — для сложной логики с ранним выходом, исключениями и изменением состояния. `parallelStream()` — только для больших CPU-задач и после замеров.
        practice:
