id: java
modules:
  - id: java-m5
    title: Функциональный стиль
    level: Junior+
    lessons:
      - id: java-05-01
        title: Лямбды и функциональные интерфейсы
        minutes: 30
        xp: 35
        theory: |
          **Лямбда** — анонимная функция, которую можно передать как значение. Тип лямбды — **функциональный интерфейс**: интерфейс с ровно одним абстрактным методом.

          ```java
          Runnable r = () -> System.out.println("привет");
          Comparator<String> byLen = (a, b) -> Integer.compare(a.length(), b.length());
          Function<Integer, Integer> square = x -> x * x;
          BiFunction<Integer, Integer, Integer> add = (a, b) -> a + b;

          Predicate<String> isLong = s -> {
              int limit = 10;              // блок с return
              return s.length() > limit;
          };
          ```

          ## Стандартные интерфейсы java.util.function

          | Интерфейс | Метод | Сигнатура |
          |---|---|---|
          | `Supplier<T>` | `get()` | `() → T` |
          | `Consumer<T>` | `accept(t)` | `T → void` |
          | `Function<T, R>` | `apply(t)` | `T → R` |
          | `Predicate<T>` | `test(t)` | `T → boolean` |
          | `UnaryOperator<T>` | `apply(t)` | `T → T` |
          | `BinaryOperator<T>` | `apply(a, b)` | `(T, T) → T` |
          | `BiFunction<T, U, R>` | `apply(t, u)` | `(T, U) → R` |

          Специализации для примитивов без упаковки: `IntPredicate`, `IntFunction<R>`, `ToIntFunction<T>`, `IntUnaryOperator`, `IntBinaryOperator`...

          ## Композиция

          ```java
          Predicate<String> notEmpty = s -> !s.isEmpty();
          Predicate<String> valid = notEmpty.and(isLong.negate()).or(s -> s.equals("admin"));

          Function<Integer, Integer> plus1 = x -> x + 1;
          Function<Integer, Integer> times2 = x -> x * 2;
          plus1.andThen(times2).apply(3);   // (3+1)*2 = 8
          plus1.compose(times2).apply(3);   // 3*2+1 = 7
          ```

          ## Захват переменных

          Лямбда может использовать локальные переменные, только если они **effectively final** (не изменяются после инициализации):

          ```java
          int base = 10;
          Function<Integer, Integer> f = x -> x + base;   // ok
          // base++;                                       // ❌ тогда лямбда не скомпилируется
          ```

          Поля объекта менять можно, но это побочный эффект — избегайте его.

          ## Свой функциональный интерфейс

          ```java
          @FunctionalInterface
          public interface Validator<T> {
              boolean validate(T value);
              default Validator<T> and(Validator<T> other) { return v -> validate(v) && other.validate(v); }
          }
          ```

          `@FunctionalInterface` — компилятор проверит, что абстрактный метод один.

          ## Где применяется

          Сортировка (`list.sort(...)`), обход (`list.forEach(...)`), `Map.computeIfAbsent`, Stream API, `CompletableFuture`, обработчики событий, стратегии — вместо анонимных классов.
        practice:
          - type: choice
            q: Какой интерфейс подходит для функции «строка → её длина»?
            options: ["Supplier<String>", "Function<String, Integer>", "Consumer<String>", "Predicate<String>"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              Function<Integer, Integer> inc = x -> x + 1;
              Function<Integer, Integer> dbl = x -> x * 2;
              System.out.println(inc.andThen(dbl).apply(5) + " " + inc.compose(dbl).apply(5));
            answer: 12 11
          - type: fill
            q: Объявите поставщик значения
            code: |
              ___<Double> random = () -> Math.random();
            answers: ["Supplier"]
          - type: bug
            q: Какая строка не даст скомпилировать лямбду?
            code: |
              int count = 0;
              List<String> words = List.of("a", "b");
              words.forEach(w -> System.out.println(w + count));
              count++;
            bugLine: 4
            explain: Переменная, используемая в лямбде, должна быть effectively final.
          - type: output
            q: Что выведет код?
            code: |
              Predicate<Integer> even = x -> x % 2 == 0;
              Predicate<Integer> big = x -> x > 10;
              System.out.println(even.and(big).test(12) + " " + even.negate().test(4));
            answer: true false
        homework:
          task: |
            Сделайте мини-библиотеку валидации на функциональных интерфейсах: `@FunctionalInterface Rule<T>` (метод `Optional<String> check(T)` — текст ошибки), фабрики `notBlank()`, `minLength(n)`, `matches(regex)`, `range(min, max)`, комбинатор `all(Rule<T>...)` (собирает все ошибки). Провалидируйте регистрацию пользователя (логин, пароль, возраст).
          checklist:
            - Правила — лямбды
            - Есть комбинирование правил
            - Ошибки собираются в список
          solution: |
            import java.util.*;
            import java.util.function.*;

            @FunctionalInterface
            interface Rule<T> {
                Optional<String> check(T value);

                static Rule<String> notBlank(String f) { return s -> s == null || s.isBlank() ? Optional.of(f + ": пусто") : Optional.empty(); }
                static Rule<String> minLength(String f, int n) { return s -> s != null && s.length() < n ? Optional.of(f + ": короче " + n) : Optional.empty(); }
                static Rule<String> matches(String f, String re, String msg) { return s -> s != null && !s.matches(re) ? Optional.of(f + ": " + msg) : Optional.empty(); }
                static Rule<Integer> range(String f, int a, int b) { return x -> x < a || x > b ? Optional.of(f + ": вне [" + a + ";" + b + "]") : Optional.empty(); }

                @SafeVarargs
                static <T> Function<T, List<String>> all(Rule<T>... rules) {
                    return v -> Arrays.stream(rules).map(r -> r.check(v)).flatMap(Optional::stream).toList();
                }
            }

            public class Validation {
                public static void main(String[] args) {
                    var login = Rule.all(Rule.notBlank("login"), Rule.minLength("login", 3), Rule.matches("login", "[a-z0-9_]+", "только a-z, 0-9, _"));
                    var password = Rule.all(Rule.minLength("password", 8), Rule.matches("password", ".*\\d.*", "нужна цифра"));
                    var age = Rule.all(Rule.range("age", 14, 120));
                    List<String> errors = new ArrayList<>();
                    errors.addAll(login.apply("A!"));
                    errors.addAll(password.apply("qwerty"));
                    errors.addAll(age.apply(7));
                    errors.forEach(System.out::println);
                }
            }
      - id: java-05-02
        title: Ссылки на методы
        minutes: 20
        xp: 25
        theory: |
          **Ссылка на метод** (method reference) — короткая запись лямбды, которая просто вызывает существующий метод.

          ```java
          list.forEach(s -> System.out.println(s));
          list.forEach(System.out::println);          // то же самое
          ```

          ## Четыре вида

          | Вид | Пример | Эквивалент лямбды |
          |---|---|---|
          | Статический метод | `Integer::parseInt` | `s -> Integer.parseInt(s)` |
          | Метод конкретного объекта | `System.out::println`, `user::isAdult` | `x -> System.out.println(x)` |
          | Метод произвольного объекта типа | `String::toUpperCase`, `String::length` | `s -> s.toUpperCase()` |
          | Конструктор | `ArrayList::new`, `User::new` | `() -> new ArrayList<>()` |

          ```java
          List<String> nums = List.of("3", "1", "2");
          List<Integer> ints = nums.stream().map(Integer::parseInt).toList();

          List<String> upper = names.stream().map(String::toUpperCase).toList();

          names.sort(String::compareToIgnoreCase);      // (a, b) -> a.compareToIgnoreCase(b)

          Supplier<List<String>> factory = ArrayList::new;
          Function<String, User> create = User::new;    // конструктор User(String)
          Function<Integer, int[]> arr = int[]::new;

          users.sort(Comparator.comparing(User::getAge).thenComparing(User::getName));

          Map<String, List<String>> map = new HashMap<>();
          map.computeIfAbsent("k", k -> new ArrayList<>());   // здесь ArrayList::new не подходит
          ```

          ## Метод «произвольного объекта» — тонкость

          Для `String::length` первый параметр функции становится объектом, на котором вызывается метод. Для двух параметров `(a, b) -> a.compareTo(b)` → `String::compareTo`.

          ## Когда что использовать

          - Ссылка на метод — когда лямбда **только** вызывает метод с теми же параметрами. Читается лучше.
          - Лямбда — когда нужна дополнительная логика, перестановка аргументов или константы: `x -> x * 2`, `s -> s.substring(1)`.

          ```java
          // ❌ ничего не выигрываем
          .map(x -> Utils.normalize(x, true))
          // ✅ можно вынести в метод с понятным именем
          .map(Utils::normalizeStrict)
          ```

          Хорошие имена методов + ссылки на них делают цепочки Stream API похожими на описание бизнес-правил: `.filter(Order::isPaid).map(Order::total)`.
        practice:
