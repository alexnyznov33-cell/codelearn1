id: python
modules:
  - id: py-m9
    title: Асинхронность и параллелизм
    level: Middle
    lessons:
      - id: py-09-01
        title: GIL, потоки и процессы
        minutes: 25
        xp: 30
        theory: |
          ## Конкурентность и параллелизм

          - **Конкурентность** — несколько задач продвигаются, чередуясь (одно ядро может переключаться).
          - **Параллелизм** — задачи буквально выполняются одновременно на разных ядрах.

          ## Типы нагрузки

          - **I/O-bound** — программа в основном ждёт: сеть, диск, БД. Пример: скачать 100 страниц.
          - **CPU-bound** — программа считает: обработка изображений, математика, сжатие.

          ## GIL

          **Global Interpreter Lock** в CPython — блокировка, из-за которой в один момент времени байт-код Python выполняет только **один поток**.

          Следствия:
          - потоки **ускоряют I/O-bound** задачи: во время ожидания сети GIL отпускается и работают другие потоки;
          - потоки **не ускоряют CPU-bound** задачи на чистом Python;
          - для CPU-bound используют **процессы** (у каждого свой интерпретатор и свой GIL) или библиотеки на C (NumPy отпускает GIL).

          > 💡 В Python 3.13 появилась экспериментальная сборка без GIL (free-threading), но по умолчанию GIL есть.

          ## Что выбрать

          | Задача | Инструмент |
          |---|---|
          | Много сетевых запросов, тысячи соединений | `asyncio` |
          | I/O с блокирующими библиотеками | `threading` / `ThreadPoolExecutor` |
          | Тяжёлые вычисления | `multiprocessing` / `ProcessPoolExecutor` |

          ## Процесс vs поток

          | | Поток | Процесс |
          |---|---|---|
          | Память | общая | раздельная |
          | Создание | дёшево | дорого |
          | Обмен данными | через общие объекты (нужны блокировки) | через очереди/pickle |
          | GIL | общий | у каждого свой |
        practice:
          - type: choice
            q: Что из этого — I/O-bound задача?
            options: ["Скачивание 500 веб-страниц", "Подсчёт простых чисел до 10⁸", "Сжатие видео", "Умножение матриц на чистом Python"]
            answer: 0
          - type: choice
