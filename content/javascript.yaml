            Установите Node.js LTS и VS Code. Создайте `card.js`, который выводит визитку (рамка, имя, язык, рамка). Затем выполните тот же код в консоли браузера (F12). Попробуйте `console.table([{ lang: "JS", level: 1 }])`.
          checklist:
            - "`node card.js` работает"
            - Код выполнен и в браузере
          solution: |
