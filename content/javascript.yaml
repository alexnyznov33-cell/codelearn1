description: Язык веба — интерфейсы, фронтенд на React, бэкенд на Node.js и кроссплатформенные приложения.
modules:
  - id: js-m1
    title: Основы JavaScript
    level: Junior
    lessons:
      - id: js-01-01
        title: Где выполняется JS и первая программа
        minutes: 10
        xp: 15
        theory: |
          **JavaScript** — динамический язык, который работает в каждом браузере, а через **Node.js** — на сервере и в консоли.

          ## Где запускать

          - **Браузер:** нажмите F12 → вкладка Console и пишите код прямо там.
          - **Node.js:** установите с [nodejs.org](https://nodejs.org) (LTS), создайте `app.js` и запустите `node app.js`.
          - **На странице:** `<script src="app.js"></script>` в HTML.

          ## Первая программа

          ```javascript
          console.log("Привет, мир!");
          console.log("Сумма:", 2 + 3);   // несколько аргументов через пробел
          ```

          Другие методы консоли: `console.error()`, `console.warn()`, `console.table([...])`.

          ## Синтаксис

          - инструкции разделяются `;` (JS умеет расставлять их автоматически, но лучше ставить явно);
          - блоки — в `{ }`;
          - комментарии: `// строка` и `/* блок */`;
          - регистр важен: `name` и `Name` — разные идентификаторы.

          ## Строгий режим

          `"use strict";` в начале файла включает более строгие правила и ловит типичные ошибки. В ES-модулях и классах он включён автоматически.

          > 💡 Стандарт языка называется **ECMAScript** (ES). «Современный JS» — это ES2015 (ES6) и новее.
        practice:
          - type: choice
            q: Как вывести сообщение в консоль?
            options: ["`print()`", "`console.log()`", "`System.out.println()`", "`echo`"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              console.log("a", 1 + 2, "b");
            answer: a 3 b
          - type: choice
            q: Какая команда запускает файл в Node.js?
            options: ["`run app.js`", "`node app.js`", "`js app.js`", "`npm app.js`"]
            answer: 1
          - type: bug
