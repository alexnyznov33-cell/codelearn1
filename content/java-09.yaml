        homework:
          task: |
            Напишите DAO `ProductDao` на чистом JDBC (подойдёт H2 in-memory: `jdbc:h2:mem:shop`): создание таблицы, `long insert(Product p)` с возвратом сгенерированного id, `Optional<Product> findById(long id)`, `List<Product> findByMaxPrice(BigDecimal max)`, `void insertAll(List<Product>)` через batch и `void changePrice(long id, BigDecimal price)`. Product — record. Все ресурсы — в try-with-resources.
          checklist:
            - Только PreparedStatement
            - Сгенерированный id возвращается
            - Batch-вставка
            - Ресурсы закрываются
          solution: |
            import java.math.BigDecimal;
            import java.sql.*;
            import java.util.*;

            record Product(Long id, String name, BigDecimal price) {}

            class ProductDao {
                private final Connection c;
                ProductDao(Connection c) throws SQLException {
                    this.c = c;
                    try (Statement st = c.createStatement()) {
                        st.execute("CREATE TABLE IF NOT EXISTS product(id BIGINT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100), price DECIMAL(10,2))");
                    }
                }
                long insert(Product p) throws SQLException {
                    try (var ps = c.prepareStatement("INSERT INTO product(name, price) VALUES (?, ?)", Statement.RETURN_GENERATED_KEYS)) {
                        ps.setString(1, p.name()); ps.setBigDecimal(2, p.price());
                        ps.executeUpdate();
                        try (var keys = ps.getGeneratedKeys()) { keys.next(); return keys.getLong(1); }
                    }
                }
                void insertAll(List<Product> list) throws SQLException {
                    try (var ps = c.prepareStatement("INSERT INTO product(name, price) VALUES (?, ?)")) {
                        for (Product p : list) { ps.setString(1, p.name()); ps.setBigDecimal(2, p.price()); ps.addBatch(); }
                        ps.executeBatch();
                    }
                }
                Optional<Product> findById(long id) throws SQLException {
                    try (var ps = c.prepareStatement("SELECT * FROM product WHERE id = ?")) {
                        ps.setLong(1, id);
                        try (var rs = ps.executeQuery()) { return rs.next() ? Optional.of(map(rs)) : Optional.empty(); }
                    }
                }
                List<Product> findByMaxPrice(BigDecimal max) throws SQLException {
                    try (var ps = c.prepareStatement("SELECT * FROM product WHERE price <= ? ORDER BY price")) {
                        ps.setBigDecimal(1, max);
                        List<Product> res = new ArrayList<>();
                        try (var rs = ps.executeQuery()) { while (rs.next()) res.add(map(rs)); }
                        return res;
                    }
                }
                void changePrice(long id, BigDecimal price) throws SQLException {
                    try (var ps = c.prepareStatement("UPDATE product SET price = ? WHERE id = ?")) {
                        ps.setBigDecimal(1, price); ps.setLong(2, id); ps.executeUpdate();
                    }
                }
                private Product map(ResultSet rs) throws SQLException {
                    return new Product(rs.getLong("id"), rs.getString("name"), rs.getBigDecimal("price"));
                }
                public static void main(String[] args) throws SQLException {
                    try (Connection c = DriverManager.getConnection("jdbc:h2:mem:shop")) {
                        var dao = new ProductDao(c);
                        long id = dao.insert(new Product(null, "Мышь", new BigDecimal("990")));
                        dao.insertAll(List.of(new Product(null, "Клавиатура", new BigDecimal("2500")), new Product(null, "Коврик", new BigDecimal("300"))));
                        dao.changePrice(id, new BigDecimal("890"));
                        System.out.println(dao.findById(id));
                        System.out.println(dao.findByMaxPrice(new BigDecimal("1000")));
                    }
                }
            }
      - id: java-09-02
        title: JPA и Hibernate
        minutes: 40
        xp: 50
        theory: |
          **JPA (Jakarta Persistence)** — спецификация ORM: классы ↔ таблицы. **Hibernate** — её самая популярная реализация.

          ```java
          @Entity
          @Table(name = "customers")
          public class Customer {
              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false, length = 100)
              private String name;

              @Column(unique = true)
              private String email;

              @Enumerated(EnumType.STRING)
              private Status status = Status.ACTIVE;

              protected Customer() {}           // JPA требует конструктор без аргументов
              public Customer(String name, String email) { this.name = name; this.email = email; }
              // геттеры/сеттеры
          }
          ```

          ## EntityManager и контекст персистентности

          ```java
          em.getTransaction().begin();
          Customer c = new Customer("Анна", "anna@mail.ru");
          em.persist(c);                       // NEW → MANAGED, INSERT при flush
          c.setName("Анна П.");                // dirty checking: UPDATE сам при коммите!
          Customer same = em.find(Customer.class, c.getId()); // из кеша 1-го уровня, без SQL
          em.getTransaction().commit();
          ```

          **Состояния сущности**: `new/transient` → `managed` (отслеживается) → `detached` (после закрытия контекста) → `removed`. Изменения managed-объектов автоматически сохраняются при `flush`/commit — это **dirty checking**.

          `merge(detached)` — копирует состояние в managed-объект; `remove(managed)` — удаление.

          ## JPQL

          Запросы к **сущностям**, а не таблицам:

          ```java
          List<Customer> list = em.createQuery(
                  "SELECT c FROM Customer c WHERE c.status = :st ORDER BY c.name", Customer.class)
              .setParameter("st", Status.ACTIVE)
              .setMaxResults(20)
              .getResultList();
          ```

          ## Важно знать

          - `@Enumerated(EnumType.STRING)` — иначе хранится порядковый номер, и вставка нового значения в середину enum ломает данные.
          - `equals/hashCode` в сущностях — по бизнес-ключу или id с осторожностью; Lombok `@Data` на сущностях — плохая идея.
          - `hibernate.hbm2ddl.auto=update` годится лишь для учёбы; в проде схему меняют **миграциями** (Flyway).
          - Включайте логирование SQL (`spring.jpa.show-sql=true` или `org.hibernate.SQL=DEBUG`), чтобы видеть реальные запросы.
