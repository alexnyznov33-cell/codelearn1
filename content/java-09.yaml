            answer: 1
        homework:
          task: |
            Создайте сущность `Book` (id, title, author, isbn уникальный, year, genre — enum STRING) и класс `BookRepository` на `EntityManager` с методами save (persist/merge), findById, findByAuthor (JPQL с параметром), deleteById и `updateYear` через dirty checking. Используйте H2 и Hibernate (persistence.xml) или Spring Boot. Включите вывод SQL и убедитесь, что повторный `find` того же id в одной транзакции не делает SELECT.
          checklist:
            - Корректные аннотации сущности
            - JPQL с именованным параметром
            - Обновление без явного UPDATE
          solution: |
            @Entity
            public class Book {
                @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;
                @Column(nullable = false) private String title;
                private String author;
                @Column(unique = true, nullable = false) private String isbn;
                private int year;
                @Enumerated(EnumType.STRING) private Genre genre;
                protected Book() {}
                public Book(String title, String author, String isbn, int year, Genre genre) {
                    this.title = title; this.author = author; this.isbn = isbn; this.year = year; this.genre = genre;
                }
                public Long getId() { return id; }
                public void setYear(int year) { this.year = year; }
            }
            enum Genre { NOVEL, SCIENCE, FANTASY }

            public class BookRepository {
                private final EntityManager em;
                public BookRepository(EntityManager em) { this.em = em; }
                public Book save(Book b) {
                    if (b.getId() == null) { em.persist(b); return b; }
                    return em.merge(b);
                }
                public Optional<Book> findById(long id) { return Optional.ofNullable(em.find(Book.class, id)); }
                public List<Book> findByAuthor(String author) {
                    return em.createQuery("SELECT b FROM Book b WHERE b.author = :a ORDER BY b.year", Book.class)
                             .setParameter("a", author).getResultList();
                }
                public void deleteById(long id) { findById(id).ifPresent(em::remove); }
                public void updateYear(long id, int year) { findById(id).ifPresent(b -> b.setYear(year)); } // dirty checking
            }

            // Использование:
            // em.getTransaction().begin();
            // var repo = new BookRepository(em);
            // Book b = repo.save(new Book("Солярис", "Лем", "978-5-17", 1961, Genre.SCIENCE));
            // repo.updateYear(b.getId(), 1962);   // UPDATE при commit
            // repo.findById(b.getId());           // без SELECT — кеш 1-го уровня
            // em.getTransaction().commit();
      - id: java-09-03
        title: Связи сущностей и N+1
        minutes: 45
        xp: 50
        theory: |
          ## Виды связей

          ```java
          @Entity
          public class Customer {
              @Id @GeneratedValue private Long id;
              @OneToMany(mappedBy = "customer", cascade = CascadeType.ALL, orphanRemoval = true)
              private List<Order> orders = new ArrayList<>();

              public void addOrder(Order o) { orders.add(o); o.setCustomer(this); } // синхронизация сторон
          }

          @Entity
          @Table(name = "orders")
          public class Order {
              @Id @GeneratedValue private Long id;
              @ManyToOne(fetch = FetchType.LAZY)
              @JoinColumn(name = "customer_id")
              private Customer customer;          // ВЛАДЕЛЕЦ связи (есть внешний ключ)
          }
          ```

          - `@ManyToOne` — сторона с внешним ключом, **владелец**.
          - `@OneToMany(mappedBy = ...)` — обратная сторона.
          - `@ManyToMany` — через промежуточную таблицу `@JoinTable`; при дополнительных полях лучше отдельная сущность.
          - `@OneToOne` — один к одному.

          ## LAZY и EAGER

          По умолчанию `*ToOne` — EAGER, `*ToMany` — LAZY. Рекомендация: **всё LAZY**, а нужные данные подгружать явно. Обращение к lazy-полю вне транзакции даёт `LazyInitializationException`.

          ## Проблема N+1

          ```java
          List<Customer> customers = em.createQuery("SELECT c FROM Customer c", Customer.class).getResultList(); // 1 запрос
          for (Customer c : customers) {
              System.out.println(c.getOrders().size());   // + N запросов — по одному на клиента!
          }
          ```

          100 клиентов → 101 запрос. Решения:

          ```java
          // 1. JOIN FETCH
          "SELECT DISTINCT c FROM Customer c LEFT JOIN FETCH c.orders"

          // 2. Entity graph (Spring Data)
          @EntityGraph(attributePaths = "orders")
          List<Customer> findAll();

          // 3. Пакетная загрузка
          @BatchSize(size = 50)    // или hibernate.default_batch_fetch_size=50
          ```

          4. **DTO-проекция**: выбирайте только нужные поля — `SELECT new ru.shop.CustomerStat(c.name, COUNT(o)) FROM Customer c LEFT JOIN c.orders o GROUP BY c.name`.

          Не используйте `JOIN FETCH` двух коллекций сразу (декартово произведение, `MultipleBagFetchException`) и пагинацию с fetch коллекции (пагинация в памяти).

          ## Каскады

          `cascade = CascadeType.ALL` — операции над родителем распространяются на детей; `orphanRemoval = true` — удалённый из коллекции ребёнок удаляется из БД. Каскады ставят от родителя к детям, но не на `@ManyToOne`.
