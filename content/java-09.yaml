        homework:
          task: |
            Смоделируйте «Блог»: `Author` 1—N `Post` N—M `Tag` (через `@ManyToMany` и `@JoinTable`) и `Post` 1—N `Comment`. Все связи LAZY, вспомогательные методы addPost/addComment синхронизируют обе стороны. Напишите метод, печатающий для каждого автора число постов и комментариев: сначала «наивно» (увидьте N+1 в логах SQL), затем исправьте через JOIN FETCH и через DTO-проекцию с GROUP BY. Посчитайте число запросов в каждом варианте.
          checklist:
            - Корректные mappedBy и JoinColumn
            - N+1 воспроизведён и устранён
            - Есть DTO-проекция
          solution: |
            @Entity class Author {
                @Id @GeneratedValue Long id;
                String name;
                @OneToMany(mappedBy = "author", cascade = CascadeType.ALL, orphanRemoval = true)
                List<Post> posts = new ArrayList<>();
                void addPost(Post p) { posts.add(p); p.author = this; }
            }
            @Entity class Post {
                @Id @GeneratedValue Long id;
                String title;
                @ManyToOne(fetch = FetchType.LAZY) @JoinColumn(name = "author_id") Author author;
                @OneToMany(mappedBy = "post", cascade = CascadeType.ALL) List<Comment> comments = new ArrayList<>();
                @ManyToMany @JoinTable(name = "post_tag", joinColumns = @JoinColumn(name = "post_id"),
                    inverseJoinColumns = @JoinColumn(name = "tag_id")) Set<Tag> tags = new HashSet<>();
                void addComment(Comment c) { comments.add(c); c.post = this; }
            }
            @Entity class Comment { @Id @GeneratedValue Long id; String text; @ManyToOne(fetch = FetchType.LAZY) Post post; }
            @Entity class Tag { @Id @GeneratedValue Long id; String name; @ManyToMany(mappedBy = "tags") Set<Post> posts = new HashSet<>(); }

            record AuthorStat(String name, long posts, long comments) {}

            // 1. Наивно: 1 + N(авторы) + M(посты) запросов
            for (Author a : em.createQuery("SELECT a FROM Author a", Author.class).getResultList()) {
                long comments = a.posts.stream().mapToLong(p -> p.comments.size()).sum();
                System.out.println(a.name + " " + a.posts.size() + " " + comments);
            }
            // 2. JOIN FETCH: 1 запрос на авторов с постами (+ batch для комментариев)
            em.createQuery("SELECT DISTINCT a FROM Author a LEFT JOIN FETCH a.posts", Author.class).getResultList();
            // 3. DTO-проекция: ровно 1 запрос
            em.createQuery("""
                SELECT new AuthorStat(a.name, COUNT(DISTINCT p), COUNT(c))
                FROM Author a LEFT JOIN a.posts p LEFT JOIN p.comments c
                GROUP BY a.name""", AuthorStat.class).getResultList().forEach(System.out::println);
      - id: java-09-04
        title: Транзакции
        minutes: 40
        xp: 50
        theory: |
          **Транзакция** — группа операций, выполняемая по принципу «всё или ничего». Свойства **ACID**: Atomicity (атомарность), Consistency (согласованность), Isolation (изоляция), Durability (долговечность).

          ## Аномалии и уровни изоляции

          | Уровень | Грязное чтение | Неповторяемое чтение | Фантомы |
          |---|---|---|---|
          | READ UNCOMMITTED | возможно | возможно | возможно |
          | READ COMMITTED (PostgreSQL по умолчанию) | нет | возможно | возможно |
          | REPEATABLE READ (MySQL по умолчанию) | нет | нет | возможно* |
          | SERIALIZABLE | нет | нет | нет |

          *в PostgreSQL REPEATABLE READ не допускает и фантомов.

          ## @Transactional в Spring

          ```java
          @Service
          public class TransferService {
              @Transactional
              public void transfer(long fromId, long toId, BigDecimal sum) {
                  Account from = repo.findById(fromId).orElseThrow();
                  Account to = repo.findById(toId).orElseThrow();
                  from.withdraw(sum);      // бросит исключение → откат
                  to.deposit(sum);
              }   // commit, изменения сохранены через dirty checking

              @Transactional(readOnly = true)
              public BigDecimal total() { ... }
          }
          ```

          ## Подводные камни

          1. **Откат по умолчанию только для unchecked** (`RuntimeException`, `Error`). Для checked: `@Transactional(rollbackFor = Exception.class)`.
          2. **Self-invocation**: вызов `this.method()` внутри того же класса **обходит прокси** — аннотация не сработает.
          3. Работает только на `public`-методах бинов Spring (прокси).
          4. Не держите транзакцию во время долгих внешних вызовов (HTTP) — блокировки и соединения заняты.

          ## Propagation

          - `REQUIRED` (по умолчанию) — присоединиться к текущей или создать новую.
          - `REQUIRES_NEW` — приостановить текущую и открыть отдельную (например, запись аудита, которая должна сохраниться даже при откате).
          - `MANDATORY`, `SUPPORTS`, `NOT_SUPPORTED`, `NEVER`, `NESTED`.

          ## Блокировки

          **Оптимистическая**: поле `@Version` — при одновременном изменении второй получит `OptimisticLockException` (повторить операцию). **Пессимистическая**: `@Lock(LockModeType.PESSIMISTIC_WRITE)` → `SELECT ... FOR UPDATE`.
        practice:
          - type: choice
            q: Какие исключения по умолчанию вызывают откат в @Transactional?
            options: ["Все исключения", "Только unchecked (RuntimeException и Error)", "Только checked", "Никакие"]
            answer: 1
          - type: bug
            q: Почему транзакция не откроется?
            code: |
              @Service
              public class ReportService {
                  public void build() {
                      this.saveAll();
                  }
                  @Transactional
                  public void saveAll() { /* ... */ }
              }
            bugLine: 4
            fix: вынести saveAll в другой бин или пометить @Transactional метод build
            explain: Вызов через this обходит прокси Spring, поэтому аннотация не срабатывает.
          - type: choice
            q: Какая аномалия невозможна на уровне READ COMMITTED?
            options: ["Грязное чтение", "Неповторяемое чтение", "Фантомное чтение", "Потерянное обновление в любом случае"]
            answer: 0
          - type: fill
            q: Включите оптимистическую блокировку
            code: |
              @___
              private Long version;
            answers: ["Version"]
          - type: choice
            q: Аудит должен сохраниться, даже если основная операция откатится. Какой propagation?
            options: ["REQUIRED", "REQUIRES_NEW", "SUPPORTS", "NEVER"]
            answer: 1
        homework:
          task: |
            В Spring Boot проекте (H2) создайте `Account` с `@Version` и сервис перевода денег с `@Transactional`. Напишите тесты: (1) успешный перевод; (2) недостаточно средств — исключение и балансы не изменились; (3) аудит через отдельный бин с `REQUIRES_NEW` сохраняется даже при откате; (4) два параллельных изменения одного счёта — одно получает `ObjectOptimisticLockingFailureException`, добавьте повтор (retry) до 3 раз.
          checklist:
            - Откат проверен тестом
            - Аудит в отдельной транзакции
            - Оптимистическая блокировка с повтором
          solution: |
            @Entity
            public class Account {
                @Id @GeneratedValue Long id;
                BigDecimal balance;
                @Version Long version;
                void withdraw(BigDecimal s) {
                    if (balance.compareTo(s) < 0) throw new InsufficientFundsException();
                    balance = balance.subtract(s);
                }
                void deposit(BigDecimal s) { balance = balance.add(s); }
            }

            @Service
            public class AuditService {
                private final AuditRepository repo;
                AuditService(AuditRepository repo) { this.repo = repo; }
                @Transactional(propagation = Propagation.REQUIRES_NEW)
                public void record(String msg) { repo.save(new AuditEntry(msg)); }
            }

            @Service
            public class TransferService {
                private final AccountRepository accounts;
                private final AuditService audit;
                TransferService(AccountRepository a, AuditService au) { accounts = a; audit = au; }

                @Transactional
                public void transfer(long from, long to, BigDecimal sum) {
                    audit.record("перевод " + from + "→" + to + " " + sum);  // сохранится всегда
                    accounts.findById(from).orElseThrow().withdraw(sum);
                    accounts.findById(to).orElseThrow().deposit(sum);
                }

                public void transferWithRetry(long from, long to, BigDecimal sum) {
                    for (int attempt = 1; ; attempt++) {
                        try { self().transfer(from, to, sum); return; }
                        catch (ObjectOptimisticLockingFailureException e) { if (attempt == 3) throw e; }
                    }
                }
                @Lazy @Autowired private TransferService self;
                private TransferService self() { return self; }   // вызов через прокси
            }
      - id: java-09-05
        title: Миграции Flyway
        minutes: 30
        xp: 40
        theory: |
          Схема БД меняется вместе с кодом. **Миграции** — версионированные SQL-скрипты в репозитории, которые применяются по порядку и **ровно один раз** на каждой базе (dev, test, prod).

          ## Flyway

          В Spring Boot достаточно зависимости `org.flywaydb:flyway-core` (+ `flyway-database-postgresql`). Скрипты кладутся в `src/main/resources/db/migration`:

          ```
          V1__create_customers.sql
          V2__create_orders.sql
          V3__add_customer_phone.sql
          R__refresh_views.sql        ← repeatable: перезапускается при изменении
          ```

          Формат имени: `V<версия>__<описание>.sql` (два подчёркивания!).

          ```sql
          -- V1__create_customers.sql
          CREATE TABLE customers (
              id BIGSERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              email VARCHAR(255) UNIQUE NOT NULL,
              created_at TIMESTAMP NOT NULL DEFAULT now()
          );

          -- V3__add_customer_phone.sql
          ALTER TABLE customers ADD COLUMN phone VARCHAR(20);
          CREATE INDEX idx_customers_email ON customers(email);
          ```

          ## Как работает

          Flyway создаёт таблицу `flyway_schema_history`, где хранит применённые версии и **контрольную сумму** каждого скрипта. При старте приложения:
          1. Находит новые миграции (версия больше последней применённой).
          2. Применяет их по порядку в транзакциях.
          3. Проверяет, что старые скрипты не изменились (иначе ошибка validate).

          ## Правила

          - **Никогда не редактируйте** применённую миграцию — пишите новую.
          - В Spring Boot: `spring.jpa.hibernate.ddl-auto=validate` — Hibernate только проверяет, что сущности совпадают со схемой.
          - Изменения делайте **обратно совместимыми** (expand–contract): добавить колонку → код пишет в обе → перенести данные → убрать старую в следующем релизе. Так можно обновлять без простоя.
          - Большие таблицы: `CREATE INDEX CONCURRENTLY` (PostgreSQL) — отдельная нетранзакционная миграция.
          - Миграции данных (UPDATE) тоже можно писать в SQL или на Java (`BaseJavaMigration`).

          Альтернатива — **Liquibase** (changelog в XML/YAML/SQL, поддерживает rollback).
        practice:
          - type: choice
            q: Какое имя файла миграции корректно для Flyway?
            options: ["V2_add_phone.sql", "V2__add_phone.sql", "2__add_phone.sql", "migration-2.sql"]
            answer: 1
          - type: choice
            q: Миграция V3 уже применена на проде, в ней нашли опечатку. Что делать?
            options: ["Исправить V3", "Создать V4 с исправлением", "Удалить строку из flyway_schema_history", "Пересоздать базу"]
            answer: 1
          - type: fill
            q: Пусть Hibernate только проверяет схему
            code: |
              spring.jpa.hibernate.ddl-auto=___
            answers: ["validate"]
          - type: order
            q: Расставьте шаги безопасного переименования колонки без простоя
            lines:
              - Добавить новую колонку миграцией
              - Код пишет в обе колонки
              - Скопировать старые данные в новую колонку
              - Код читает только новую колонку
              - Удалить старую колонку в следующем релизе
          - type: choice
            q: Где Flyway хранит информацию о применённых миграциях?
            options: ["В файле flyway.lock", "В таблице flyway_schema_history", "В application.properties", "Нигде"]
            answer: 1
        homework:
          task: |
            Подключите Flyway к Spring Boot-проекту с PostgreSQL (через Docker: `docker run -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`). Напишите миграции: V1 — таблицы `customers` и `orders` с внешним ключом; V2 — индекс по `orders.customer_id`; V3 — колонка `status` со значением по умолчанию 'NEW' и CHECK-ограничением; V4 — заполнить тестовыми данными. Поставьте `ddl-auto=validate`, проверьте `flyway_schema_history`, затем попробуйте изменить V2 и посмотрите на ошибку валидации.
          checklist:
            - Правильные имена файлов
            - Внешний ключ и индекс
            - Hibernate в режиме validate
          solution: |
            -- V1__init.sql
            CREATE TABLE customers (
                id BIGSERIAL PRIMARY KEY,
                name VARCHAR(100) NOT NULL,
                email VARCHAR(255) NOT NULL UNIQUE
            );
            CREATE TABLE orders (
                id BIGSERIAL PRIMARY KEY,
                customer_id BIGINT NOT NULL REFERENCES customers(id),
                total NUMERIC(12,2) NOT NULL,
                created_at TIMESTAMP NOT NULL DEFAULT now()
            );

            -- V2__orders_customer_idx.sql
            CREATE INDEX idx_orders_customer ON orders(customer_id);

            -- V3__order_status.sql
            ALTER TABLE orders ADD COLUMN status VARCHAR(20) NOT NULL DEFAULT 'NEW';
            ALTER TABLE orders ADD CONSTRAINT chk_status CHECK (status IN ('NEW', 'PAID', 'SHIPPED', 'CANCELLED'));

            -- V4__seed.sql
            INSERT INTO customers(name, email) VALUES ('Анна', 'anna@mail.ru'), ('Борис', 'boris@mail.ru');
            INSERT INTO orders(customer_id, total, status) VALUES (1, 1500, 'PAID'), (1, 300, 'NEW'), (2, 9900, 'SHIPPED');

            # application.properties
            # spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
            # spring.datasource.username=postgres
            # spring.datasource.password=pg
            # spring.jpa.hibernate.ddl-auto=validate
            # SELECT version, description, success FROM flyway_schema_history;
