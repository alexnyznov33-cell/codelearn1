    title: Базы данных
    level: Middle
    lessons:
      - id: java-09-01
        title: JDBC
        minutes: 40
        xp: 45
        theory: |
          **JDBC** — стандартный низкоуровневый API для работы с реляционными БД. Под ним работают все ORM.

          ```java
          String url = "jdbc:postgresql://localhost:5432/shop";
          try (Connection conn = DriverManager.getConnection(url, "app", "secret");
               PreparedStatement ps = conn.prepareStatement(
                   "SELECT id, name, price FROM product WHERE price > ? ORDER BY price")) {
              ps.setBigDecimal(1, new BigDecimal("1000"));
              try (ResultSet rs = ps.executeQuery()) {
                  while (rs.next()) {
                      long id = rs.getLong("id");
                      String name = rs.getString("name");
                      BigDecimal price = rs.getBigDecimal("price");
                      System.out.println(id + " " + name + " " + price);
                  }
              }
          }
          ```

          ## Изменение данных

          ```java
          try (PreparedStatement ps = conn.prepareStatement(
                  "INSERT INTO product(name, price) VALUES (?, ?)", Statement.RETURN_GENERATED_KEYS)) {
              ps.setString(1, "Мышь");
              ps.setBigDecimal(2, new BigDecimal("990"));
              int rows = ps.executeUpdate();          // число изменённых строк
              try (ResultSet keys = ps.getGeneratedKeys()) { keys.next(); long id = keys.getLong(1); }
          }
          ```

          ## SQL-инъекции

          ```java
          // ❌ Никогда так не делайте:
          stmt.executeQuery("SELECT * FROM users WHERE login = '" + login + "'");
          // login = "' OR '1'='1"  → вернёт всех пользователей
          ```

          `PreparedStatement` с `?` передаёт параметры отдельно от SQL — инъекция невозможна, а план запроса кешируется.

          ## Транзакции вручную

          ```java
          conn.setAutoCommit(false);
          try {
              debit.executeUpdate(); credit.executeUpdate();
              conn.commit();
          } catch (SQLException e) {
              conn.rollback();
              throw e;
          }
          ```

          ## Пакетная вставка и пул соединений

          `ps.addBatch()` + `ps.executeBatch()` — тысячи строк за один сетевой обмен. Открывать соединение на каждый запрос дорого, поэтому используют **пул соединений** — **HikariCP** (`DataSource`), он по умолчанию в Spring Boot.

          Всегда закрывайте `Connection`, `Statement`, `ResultSet` через try-with-resources — иначе утечка соединений и пул «кончится».
