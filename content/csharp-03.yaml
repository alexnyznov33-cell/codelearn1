        homework:
          task: |
            Класс `Isbn` (строка из 13 цифр, дефисы игнорируются при сравнении: "978-5-17-1" == "97851771"). Реализуйте `IEquatable<Isbn>`, `Equals`, `GetHashCode`, `==`, `!=`, `ToString`. Проверьте работу в `HashSet<Isbn>` и `Dictionary<Isbn, string>`.
          checklist:
            - Нормализация (удаление дефисов) в конструкторе
            - GetHashCode от нормализованного значения
            - Проверка в HashSet проходит
          solution: |
            public sealed class Isbn : IEquatable<Isbn>
            {
                public string Value { get; }
                public Isbn(string raw) => Value = raw.Replace("-", "").Trim();

                public bool Equals(Isbn? other) => other is not null && Value == other.Value;
                public override bool Equals(object? obj) => Equals(obj as Isbn);
                public override int GetHashCode() => Value.GetHashCode();
                public static bool operator ==(Isbn? a, Isbn? b) => a?.Equals(b) ?? b is null;
                public static bool operator !=(Isbn? a, Isbn? b) => !(a == b);
                public override string ToString() => $"ISBN {Value}";
            }

            var set = new HashSet<Isbn> { new("978-5-17-1") };
            Console.WriteLine(set.Contains(new Isbn("97851771")));   // True
            var books = new Dictionary<Isbn, string> { [new("1-2-3")] = "Книга" };
            Console.WriteLine(books[new Isbn("123")]);
