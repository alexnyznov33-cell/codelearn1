              var a = new P { X = 1 };
              var b = new P { X = 1 };
              Console.WriteLine(a.Equals(b));
            answer: "False"
          - type: choice
            q: Что нужно переопределить вместе с Equals?
            options: ["ToString", "GetHashCode", "GetType", "Finalize"]
            answer: 1
          - type: fill
            q: Сгенерируйте хеш из двух полей
            code: |
              public override int GetHashCode() => HashCode.___(X, Y);
            answers: ["Combine"]
          - type: choice
            q: "Если `a.Equals(b) == true`, то хеш-коды…"
            options: ["Обязаны совпадать", "Обязаны различаться", "Могут быть любыми", "Равны нулю"]
