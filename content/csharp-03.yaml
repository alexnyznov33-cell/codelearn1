            options: ["Для больших изменяемых объектов", "Для маленьких неизменяемых значений", "Для иерархий наследования", "Для сервисов с зависимостями"]
            answer: 1
        homework:
          task: |
            Опишите `readonly record struct Money(decimal Amount, string Currency)` с оператором `+` (исключение при разных валютах), `record Order(int Id, OrderStatus Status, Money Total)` и `enum OrderStatus`. Напишите метод, который переводит заказ в следующий статус через `with` и выводит историю.
          checklist:
            - Money неизменяемая
            - Сложение разных валют — исключение
            - Статус меняется через with, исходный заказ не меняется
          solution: |
            public enum OrderStatus { New, Paid, Shipped, Done }

            public readonly record struct Money(decimal Amount, string Currency)
            {
                public static Money operator +(Money a, Money b) =>
                    a.Currency == b.Currency
                        ? new Money(a.Amount + b.Amount, a.Currency)
                        : throw new InvalidOperationException("Разные валюты");
            }

            public record Order(int Id, OrderStatus Status, Money Total);

            static Order Next(Order o) => o.Status == OrderStatus.Done ? o : o with { Status = o.Status + 1 };

            var order = new Order(1, OrderStatus.New, new Money(100, "RUB") + new Money(50, "RUB"));
            for (int i = 0; i < 4; i++)
            {
                Console.WriteLine(order);
                order = Next(order);
            }
      - id: cs-03-06
        title: Статические члены и extension-методы
        minutes: 25
        xp: 30
        theory: |
          ## static

          Статический член принадлежит **классу**, а не объекту. Вызывается через имя класса.

          ```csharp
          public class User
          {
              private static int count;               // общий для всех объектов
              public static int Count => count;
              public string Name { get; }

              public User(string name) { Name = name; count++; }

              public static User Guest() => new("Гость");   // фабричный метод
          }

          new User("A"); new User("B");
          Console.WriteLine(User.Count);   // 2
          ```

          Из статического метода нельзя обращаться к нестатическим членам (нет `this`).

          ## static class

          Только статические члены, нельзя создать экземпляр: `Math`, `Console`, `File`.

          ```csharp
          public static class Geometry
          {
              public const double Pi = 3.14159;            // const — неявно static
              public static double Circle(double r) => Pi * r * r;
          }
          ```

          Статический конструктор `static User() { ... }` вызывается один раз перед первым использованием типа.

          ## Extension-методы

          Позволяют «добавить» метод к существующему типу без наследования. Пишутся в static-классе, первый параметр с `this`.

          ```csharp
          public static class StringExtensions
          {
              public static bool IsPalindrome(this string s)
              {
                  var t = s.ToLower();
                  return t.SequenceEqual(t.Reverse());
              }
              public static string Truncate(this string s, int max) =>
                  s.Length <= max ? s : s[..max] + "…";
          }

          Console.WriteLine("Шалаш".IsPalindrome());   // True
          Console.WriteLine("Длинный текст".Truncate(5));
          ```

          Весь LINQ (`Where`, `Select`) — это extension-методы для `IEnumerable<T>`.

          > ⚠️ Статическое изменяемое состояние — глобальная переменная: мешает тестам и потокобезопасности. Используйте осторожно.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              class C { public static int N; public C() { N++; } }
              new C(); new C(); new C();
              Console.WriteLine(C.N);
            answer: "3"
          - type: fill
            q: Сделайте extension-метод для int
            code: |
              public static class IntExt
              {
                  public static bool IsEven(___ int x) => x % 2 == 0;
              }
            answers: ["this"]
          - type: choice
            q: Где должен быть объявлен extension-метод?
            options: ["В любом классе", "В static-классе", "В интерфейсе", "В самом расширяемом типе"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              static class Ext { public static int Twice(this int x) => x * 2; }
              Console.WriteLine(5.Twice().Twice());
            answer: "20"
          - type: bug
            q: Какая строка не скомпилируется?
            code: |
              class Calc
              {
                  private int last;
                  public static int Add(int a, int b)
                  {
                      last = a + b;
                      return last;
                  }
              }
            bugLine: 6
            explain: Статический метод не имеет доступа к полю экземпляра `last`.
        homework:
          task: |
            Создайте static-класс `CollectionExtensions` с методами: `ForEach<T>(this IEnumerable<T>, Action<T>)`, `IsNullOrEmpty<T>(this IEnumerable<T>?)`, `Chunk`-подобный `Batch<T>(int size)` возвращающий `List<List<T>>`, и `string.WordCount()`. Добавьте класс `IdGenerator` со статическим счётчиком и методом `Next()`.
          checklist:
            - Все extension-методы в static-классе
            - Обрабатывается null
            - IdGenerator выдаёт уникальные id
          solution: |
            public static class CollectionExtensions
            {
                public static void ForEach<T>(this IEnumerable<T> src, Action<T> act)
                {
                    foreach (var x in src) act(x);
                }
                public static bool IsNullOrEmpty<T>(this IEnumerable<T>? src) => src is null || !src.Any();

                public static List<List<T>> Batch<T>(this IEnumerable<T> src, int size)
                {
                    var res = new List<List<T>>();
                    foreach (var x in src)
                    {
                        if (res.Count == 0 || res[^1].Count == size) res.Add(new List<T>());
                        res[^1].Add(x);
                    }
                    return res;
                }
                public static int WordCount(this string s) =>
                    s.Split(' ', StringSplitOptions.RemoveEmptyEntries).Length;
            }

            public static class IdGenerator
            {
                private static int last;
                public static int Next() => ++last;
            }

            Enumerable.Range(1, 7).Batch(3).ForEach(b => Console.WriteLine(string.Join(",", b)));
            Console.WriteLine("раз два три".WordCount());
            Console.WriteLine(IdGenerator.Next() + " " + IdGenerator.Next());
      - id: cs-03-07
        title: Переопределение Equals, GetHashCode, ToString
        minutes: 30
        xp: 35
        theory: |
          Все типы наследуют от `object` три важных метода.

          ## ToString

          По умолчанию возвращает имя типа (`MyApp.User`). Переопределяйте для отладки и логов:

          ```csharp
          public override string ToString() => $"User({Id}, {Name})";
          ```

          ## Equals и ==

          Для классов `Equals` и `==` по умолчанию сравнивают **ссылки**. Чтобы сравнивать по содержимому — переопределите `Equals` **и обязательно** `GetHashCode`.

          ```csharp
          public class Point : IEquatable<Point>
          {
              public int X { get; }
              public int Y { get; }
              public Point(int x, int y) { X = x; Y = y; }

              public bool Equals(Point? other) =>
                  other is not null && X == other.X && Y == other.Y;

              public override bool Equals(object? obj) => Equals(obj as Point);

              public override int GetHashCode() => HashCode.Combine(X, Y);

              public static bool operator ==(Point? a, Point? b) => a?.Equals(b) ?? b is null;
              public static bool operator !=(Point? a, Point? b) => !(a == b);

              public override string ToString() => $"({X}, {Y})";
          }
          ```

          ## Контракт GetHashCode

          - Если `a.Equals(b)`, то `a.GetHashCode() == b.GetHashCode()` — **обязательно**.
          - Обратное не обязательно (коллизии допустимы).
          - Хеш не должен меняться, пока объект лежит в `Dictionary`/`HashSet` → используйте неизменяемые поля.

          Если нарушить контракт, `HashSet.Contains` и `Dictionary` перестанут находить объекты.

          ```csharp
          var set = new HashSet<Point> { new(1, 2) };
          Console.WriteLine(set.Contains(new Point(1, 2)));  // True только при верном GetHashCode
          ```

          ## Самый простой путь

          `record` генерирует `Equals`, `GetHashCode`, `==`, `ToString` автоматически:

          ```csharp
          public record Point(int X, int Y);
          ```

          > 💡 `ReferenceEquals(a, b)` всегда сравнивает ссылки, даже если `==` перегружен.
        practice:
          - type: output
            q: Что выведет код (Equals не переопределён)?
            code: |
