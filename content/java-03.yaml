              List<Integer> b = new ArrayList<>();
              System.out.println(a.getClass() == b.getClass());
            answer: "true"
            explain: После стирания типов это один и тот же класс ArrayList.
        homework:
          task: |
            Реализуйте: (1) `class Cache<K, V>` с методом `V getOrCompute(K key, Function<? super K, ? extends V> fn)`; (2) `static <T extends Comparable<? super T>> List<T> topN(Collection<? extends T> items, int n)`; (3) `static <T> void copyIf(Collection<? extends T> src, Collection<? super T> dst, Predicate<? super T> p)`; (4) `record Result<T>(T value, String error)` с фабриками `ok`/`fail`. Продемонстрируйте работу с Integer → Number → Object.
          checklist:
            - Соблюдается PECS
            - Нет raw types
            - Нет непроверенных приведений
          solution: |
            import java.util.*;
            import java.util.function.*;

            class Cache<K, V> {
                private final Map<K, V> map = new HashMap<>();
                V getOrCompute(K key, Function<? super K, ? extends V> fn) { return map.computeIfAbsent(key, fn); }
            }

            record Result<T>(T value, String error) {
                static <T> Result<T> ok(T v) { return new Result<>(v, null); }
                static <T> Result<T> fail(String e) { return new Result<>(null, e); }
                boolean isOk() { return error == null; }
            }

            public class Generics {
                static <T extends Comparable<? super T>> List<T> topN(Collection<? extends T> items, int n) {
                    List<T> l = new ArrayList<>(items);
                    l.sort(Comparator.reverseOrder());
                    return l.subList(0, Math.min(n, l.size()));
                }
                static <T> void copyIf(Collection<? extends T> src, Collection<? super T> dst, Predicate<? super T> p) {
                    for (T x : src) if (p.test(x)) dst.add(x);
                }
                public static void main(String[] args) {
                    List<Integer> ints = List.of(5, 1, 9, 3);
                    List<Number> nums = new ArrayList<>();
                    Predicate<Object> notNull = Objects::nonNull;
                    copyIf(ints, nums, notNull);
                    System.out.println(topN(ints, 2) + " " + nums);
                    System.out.println(new Cache<String, Integer>().getOrCompute("hello", String::length));
                    System.out.println(Result.ok(42).isOk() + " " + Result.<Integer>fail("нет").error());
                }
            }
      - id: java-03-06
        title: Iterator и утилиты Collections
        minutes: 25
        xp: 30
        theory: |
          ## Iterator

          Любая `Collection` — это `Iterable`: умеет выдать `Iterator` для последовательного обхода. for-each — синтаксический сахар над ним.

          ```java
          Iterator<String> it = names.iterator();
          while (it.hasNext()) {
              String n = it.next();
              if (n.startsWith("_")) it.remove();    // ✅ безопасное удаление во время обхода
          }
          ```

          `ListIterator` — двунаправленный, умеет `set`, `add`, `previous`.

          ## Fail-fast

          Если коллекцию изменили во время обхода не через итератор, следующий `next()` бросит `ConcurrentModificationException`. Это защита от непредсказуемого поведения (а не механизм потокобезопасности).

          ## Свой Iterable

          ```java
          public class Range implements Iterable<Integer> {
              private final int from, to;
              public Range(int from, int to) { this.from = from; this.to = to; }

              @Override
              public Iterator<Integer> iterator() {
                  return new Iterator<>() {
                      private int cur = from;
                      @Override public boolean hasNext() { return cur < to; }
                      @Override public Integer next() {
                          if (!hasNext()) throw new NoSuchElementException();
                          return cur++;
                      }
                  };
              }
          }

          for (int i : new Range(0, 5)) System.out.print(i);   // 01234
          ```

          ## Очереди и стеки

          ```java
          Deque<Integer> stack = new ArrayDeque<>();
          stack.push(1); stack.push(2); stack.pop();      // 2 — LIFO (Stack — устаревший класс)

          Queue<String> q = new ArrayDeque<>();
          q.offer("a"); q.offer("b"); q.poll();           // a — FIFO
          q.peek();                                       // посмотреть без удаления

          PriorityQueue<Integer> pq = new PriorityQueue<>(List.of(5, 1, 3));
          pq.poll();                                      // 1 — минимальный
          ```

          ## Утилиты Collections и Arrays

          ```java
          Collections.sort(list); Collections.reverse(list); Collections.shuffle(list);
          Collections.max(list); Collections.min(list, cmp);
          Collections.frequency(list, "a");
          Collections.nCopies(3, "x");                  // [x, x, x]
          Collections.swap(list, 0, 1);
          Collections.unmodifiableList(list);           // обёртка-«только чтение»
          Collections.synchronizedList(list);           // примитивная потокобезопасность
          Collections.emptyList();
          Collections.binarySearch(sortedList, key);

          int[] arr = {3, 1, 2};
          Arrays.sort(arr);
          Arrays.toString(arr);                         // "[1, 2, 3]"
          Arrays.fill(arr, 0);
          int[] copy = Arrays.copyOf(arr, 5);
          Arrays.equals(a, b);
          List<Integer> l = Arrays.asList(1, 2, 3);
          ```

          ## Какую коллекцию выбрать

          Список — `ArrayList`; уникальность — `HashSet`; словарь — `HashMap`; отсортировано — `TreeMap/TreeSet`; очередь/стек — `ArrayDeque`; по приоритету — `PriorityQueue`; многопоточность — `java.util.concurrent` (модуль 6).
