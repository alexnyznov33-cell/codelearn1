        homework:
          task: |
            Реализуйте: (1) `class Fibonacci implements Iterable<Long>` с ограничением количества; (2) `class Matrix implements Iterable<int[]>` (обход по строкам); (3) свою обёртку `ReadOnlyIterator<T>`, запрещающую remove; (4) задачу «проверка скобок» на ArrayDeque; (5) слияние K отсортированных списков через PriorityQueue.
          checklist:
            - next() бросает NoSuchElementException в конце
            - Используется ArrayDeque, а не Stack
            - Слияние K списков за O(N log K)
          solution: |
            import java.util.*;

            class Fibonacci implements Iterable<Long> {
                private final int count;
                Fibonacci(int count) { this.count = count; }
                public Iterator<Long> iterator() {
                    return new Iterator<>() {
                        long a = 0, b = 1; int i = 0;
                        public boolean hasNext() { return i < count; }
                        public Long next() {
                            if (!hasNext()) throw new NoSuchElementException();
                            long r = a; a = b; b = r + b; i++; return r;
                        }
                    };
                }
            }

            public class Iter {
                static boolean balanced(String s) {
                    Deque<Character> st = new ArrayDeque<>();
                    for (char c : s.toCharArray()) {
                        if ("([{".indexOf(c) >= 0) st.push(c);
                        else if (")]}".indexOf(c) >= 0) {
                            if (st.isEmpty() || "([{".indexOf(st.pop()) != ")]}".indexOf(c)) return false;
                        }
                    }
                    return st.isEmpty();
                }
                static List<Integer> mergeK(List<List<Integer>> lists) {
                    record Cur(int val, int list, int idx) {}
                    PriorityQueue<Cur> pq = new PriorityQueue<>(Comparator.comparingInt(Cur::val));
                    for (int i = 0; i < lists.size(); i++) if (!lists.get(i).isEmpty()) pq.add(new Cur(lists.get(i).get(0), i, 0));
                    List<Integer> out = new ArrayList<>();
                    while (!pq.isEmpty()) {
                        Cur c = pq.poll(); out.add(c.val());
                        List<Integer> l = lists.get(c.list());
                        if (c.idx() + 1 < l.size()) pq.add(new Cur(l.get(c.idx() + 1), c.list(), c.idx() + 1));
                    }
                    return out;
                }
                public static void main(String[] args) {
                    for (long f : new Fibonacci(10)) System.out.print(f + " ");
                    System.out.println("\n" + balanced("{[()()]}") + " " + balanced("(]"));
                    System.out.println(mergeK(List.of(List.of(1, 4, 9), List.of(2, 3), List.of(5, 6, 7))));
                }
            }
