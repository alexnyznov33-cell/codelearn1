        homework:
          task: |
            Реализуйте проект «Библиотека» по требованиям урока и опубликуйте на GitHub. Минимальный объём: 4 сущности (User, Book, BookCopy, Loan), 12+ эндпоинтов, 5+ миграций, 30+ тестов, Docker Compose, CI. Дополнительно (по желанию): кеширование каталога (`@Cacheable` + Caffeine), rate limiting, виртуальные потоки (`spring.threads.virtual.enabled=true`), метрики Prometheus и дашборд Grafana.
          checklist:
            - Все эндпоинты задокументированы в Swagger
            - Бизнес-правила покрыты тестами
            - Нет N+1 в логах SQL
            - Проект запускается одной командой docker compose up
            - README с примерами запросов
          solution: |
            // Сокращённый каркас ключевых частей

            @Entity
            public class BookCopy {
                @Id @GeneratedValue Long id;
                @ManyToOne(fetch = FetchType.LAZY) Book book;
                @Enumerated(EnumType.STRING) CopyStatus status = CopyStatus.AVAILABLE;
                @Version Long version;
            }

            @Entity
            public class Loan {
                @Id @GeneratedValue Long id;
                @ManyToOne(fetch = FetchType.LAZY) Reader reader;
                @ManyToOne(fetch = FetchType.LAZY) BookCopy copy;
                LocalDate dueDate; LocalDate returnedAt; boolean overdue;
                protected Loan() {}
                Loan(Reader r, BookCopy c, LocalDate due) { reader = r; copy = c; dueDate = due; }
            }

            public interface LoanRepository extends JpaRepository<Loan, Long> {
                long countByReaderAndReturnedAtIsNull(Reader r);
                @Modifying
                @Query("UPDATE Loan l SET l.overdue = true WHERE l.returnedAt IS NULL AND l.dueDate < :today")
                int markOverdue(@Param("today") LocalDate today);
                @Query("""
                    SELECT new ru.library.loan.TopBook(b.title, COUNT(l))
                    FROM Loan l JOIN l.copy c JOIN c.book b
                    WHERE l.dueDate >= :from GROUP BY b.title ORDER BY COUNT(l) DESC""")
                List<TopBook> top(@Param("from") LocalDate from, Pageable limit);
            }

            @Component
            class OverdueJob {
                private static final Logger log = LoggerFactory.getLogger(OverdueJob.class);
                private final LoanRepository loans;
                OverdueJob(LoanRepository loans) { this.loans = loans; }
                @Scheduled(cron = "0 0 9 * * *") @Transactional
                public void run() { log.info("Просрочено выдач: {}", loans.markOverdue(LocalDate.now())); }
            }

            @RestController @RequestMapping("/api/loans")
            class LoanController {
                private final LoanService service;
                LoanController(LoanService s) { service = s; }
                @PostMapping("/books/{bookId}")
                ResponseEntity<LoanDto> borrow(@PathVariable long bookId, Authentication auth) {
                    LoanDto dto = service.borrow(auth.getName(), bookId);
                    return ResponseEntity.created(URI.create("/api/loans/" + dto.id())).body(dto);
                }
                @PostMapping("/{id}/return") @PreAuthorize("hasRole('LIBRARIAN')")
                LoanDto giveBack(@PathVariable long id) { return service.giveBack(id); }
                @GetMapping("/top") List<TopBook> top() { return service.topOfMonth(); }
            }

            // ApiExceptionHandler: BusinessException → 422, NotFoundException → 404,
            // ObjectOptimisticLockingFailureException → 409 "Экземпляр уже забронирован"
