        title: Роутинг
        minutes: 35
        xp: 45
        theory: |
          **SPA** (Single Page Application) меняет «страницы» без перезагрузки: роутер следит за URL и показывает нужный компонент. Стандарт — **React Router** (v6/v7).

          ```bash
          npm i react-router-dom
          ```

          ```jsx
          import { createBrowserRouter, RouterProvider, Outlet, Link, NavLink } from "react-router-dom";

          function Layout() {
            return (
              <>
                <nav>
                  <NavLink to="/" end>Главная</NavLink>
                  <NavLink to="/products">Каталог</NavLink>        {/* получает класс active */}
                  <NavLink to="/cart">Корзина</NavLink>
                </nav>
                <main><Outlet /></main>                           {/* сюда рендерится дочерний маршрут */}
              </>
            );
          }

          const router = createBrowserRouter([
            {
              path: "/",
              element: <Layout />,
              errorElement: <NotFound />,
              children: [
                { index: true, element: <Home /> },
                { path: "products", element: <Products /> },
                { path: "products/:id", element: <ProductPage /> },
                { path: "cart", element: <RequireAuth><Cart /></RequireAuth> },
                { path: "*", element: <NotFound /> },
              ],
            },
          ]);

          createRoot(document.getElementById("root")).render(<RouterProvider router={router} />);
          ```

          ## Параметры и навигация

          ```jsx
          import { useParams, useNavigate, useSearchParams } from "react-router-dom";

          function ProductPage() {
            const { id } = useParams();                       // /products/42 → "42"
            const navigate = useNavigate();
            return <button onClick={() => navigate("/cart")}>Купить товар {id}</button>;
          }

          function Products() {
            const [params, setParams] = useSearchParams();    // ?sort=price&page=2
            const sort = params.get("sort") ?? "title";
            return <button onClick={() => setParams({ sort: "price" })}>По цене</button>;
          }
          ```

          Используйте `<Link>` вместо `<a href>` — обычная ссылка перезагрузит приложение и сбросит состояние. Состояние фильтров храните в **query-параметрах** — ссылкой можно поделиться.

          ## Защищённые маршруты

          ```jsx
          function RequireAuth({ children }) {
            const { user } = useAuth();
            const location = useLocation();
            if (!user) return <Navigate to="/login" state={{ from: location }} replace />;
            return children;
          }
          ```

          Это только UX — **настоящая защита данных на сервере**.

          ## Ленивая загрузка страниц

          ```jsx
          const Admin = lazy(() => import("./pages/Admin"));
          <Suspense fallback={<Spinner />}><Admin /></Suspense>
          ```

          Хостинг SPA: сервер должен отдавать `index.html` на любой путь (иначе `/products/42` при обновлении даст 404). Мета-фреймворки **Next.js** и **Remix/React Router 7** добавляют файловый роутинг, серверный рендеринг (SSR) и загрузку данных на уровне маршрутов.
