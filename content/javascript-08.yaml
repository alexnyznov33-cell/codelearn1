id: javascript
modules:
  - id: js-m8
    title: React
    level: Middle
    lessons:
      - id: js-08-01
        title: Компоненты и JSX
        minutes: 40
        xp: 45
        theory: |
          **React** — библиотека для построения интерфейсов из **компонентов**. Вы описываете, *как должен выглядеть* UI для текущих данных, а React сам обновляет DOM.

          ```bash
          npm create vite@latest shop -- --template react-ts
          cd shop && npm i && npm run dev
          ```

          ## Компонент — функция, возвращающая JSX

          ```jsx
          function ProductCard({ title, price, inStock }) {
            return (
              <article className="card">
                <h3>{title}</h3>
                <p>{price.toLocaleString("ru-RU")} ₽</p>
                {inStock ? <button>В корзину</button> : <span className="muted">Нет в наличии</span>}
              </article>
            );
          }

          export default function App() {
            return (
              <main>
                <h1>Каталог</h1>
                <ProductCard title="Чайник" price={2490} inStock />
                <ProductCard title="Кружка" price={390} inStock={false} />
              </main>
            );
          }
          ```

          ## Правила JSX

          - JSX — синтаксический сахар: `<h1 className="x">Hi</h1>` превращается в `jsx("h1", { className: "x", children: "Hi" })`.
          - Компоненты называются с **заглавной** буквы (`<ProductCard />`), HTML-теги — со строчной.
          - Возвращается **один корневой** элемент; без лишней обёртки — фрагмент `<>...</>`.
          - `className` вместо `class`, `htmlFor` вместо `for`, атрибуты в camelCase: `onClick`, `tabIndex`.
          - Все теги закрываются: `<img />`, `<input />`.
          - В `{ }` — любое **выражение** JS: переменные, вызовы, тернарный оператор. `if` и `for` — нельзя (это инструкции).
          - `style` принимает объект: `style={{ color: "red", fontSize: 14 }}`.

          ## Условный рендеринг

          ```jsx
          {isLoading && <Spinner />}
          {error ? <Error text={error} /> : <List items={items} />}
          ```

          Осторожно с `&&` и числами: `{count && <Badge />}` при `count = 0` выведет «0». Пишите `{count > 0 && <Badge />}`.

          ## Безопасность

          React **экранирует** всё, что вставляется через `{ }` — XSS через текст невозможен. Опасный путь — `dangerouslySetInnerHTML`, используйте только с очищенным HTML (DOMPurify).

          ## Композиция и children

          ```jsx
          function Card({ title, children }) {
            return <section className="card"><h2>{title}</h2>{children}</section>;
          }
          <Card title="Профиль"><p>Анна, 25 лет</p></Card>
          ```

          Строим UI как дерево маленьких компонентов, каждый отвечает за одну вещь.
        practice:
          - type: choice
