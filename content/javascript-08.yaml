            code: |
              <p style=___{ color: "red" }___>Ошибка</p>
            answers: ["{", "}"]
        homework:
          task: |
            Создайте React + TypeScript проект на Vite и сверстайте страницу «Профиль разработчика» из компонентов: `Header` (имя, должность, аватар), `SkillList` (массив навыков с уровнем — бейджи разного цвета), `ProjectCard` (название, описание, ссылка, теги) и `Layout` с `children`. Данные — в отдельном файле `data.ts`. Если проектов нет — показывать «Скоро здесь появятся проекты».
          checklist:
            - Компоненты маленькие и переиспользуемые
            - Пропсы типизированы
            - Есть условный рендеринг и children
          solution: |
            // data.ts
            export type Skill = { name: string; level: 1 | 2 | 3 };
            export type Project = { title: string; description: string; url: string; tags: string[] };
            export const profile = { name: "Анна Петрова", role: "Frontend-разработчик", avatar: "/avatar.png" };
            export const skills: Skill[] = [{ name: "React", level: 3 }, { name: "TypeScript", level: 2 }, { name: "Node.js", level: 1 }];
            export const projects: Project[] = [{ title: "To-Do", description: "Список задач", url: "https://github.com/anna/todo", tags: ["react", "ts"] }];

            // App.tsx
            import type { ReactNode } from "react";
            import { profile, skills, projects, type Skill, type Project } from "./data";

            function Layout({ children }: { children: ReactNode }) {
              return <div className="layout">{children}</div>;
            }
            function Header({ name, role, avatar }: typeof profile) {
              return (
                <header className="header">
                  <img src={avatar} alt={name} width={96} />
                  <div><h1>{name}</h1><p>{role}</p></div>
                </header>
              );
            }
            const levelClass = { 1: "badge-junior", 2: "badge-middle", 3: "badge-senior" } as const;
            function SkillList({ items }: { items: Skill[] }) {
              return <ul className="skills">{items.map((s) => <li key={s.name} className={levelClass[s.level]}>{s.name}</li>)}</ul>;
            }
            function ProjectCard({ title, description, url, tags }: Project) {
              return (
                <article className="card">
                  <h3><a href={url} target="_blank" rel="noreferrer">{title}</a></h3>
                  <p>{description}</p>
                  <p>{tags.map((t) => `#${t}`).join(" ")}</p>
                </article>
              );
            }
            export default function App() {
              return (
                <Layout>
                  <Header {...profile} />
                  <SkillList items={skills} />
                  {projects.length > 0
                    ? projects.map((p) => <ProjectCard key={p.title} {...p} />)
                    : <p>Скоро здесь появятся проекты</p>}
                </Layout>
              );
            }
      - id: js-08-02
        title: Состояние и пропсы
        minutes: 45
        xp: 50
        theory: |
          **Пропсы (props)** — входные данные компонента от родителя, **только для чтения**. **Состояние (state)** — данные, которые компонент хранит и меняет сам. Изменение состояния вызывает **повторный рендер**.

          ```jsx
          import { useState } from "react";

          function Counter({ step = 1 }) {
            const [count, setCount] = useState(0);       // [значение, функция изменения]
            return (
              <div>
                <p>Счёт: {count}</p>
                <button onClick={() => setCount(count + step)}>+{step}</button>
                <button onClick={() => setCount(0)}>Сброс</button>
              </div>
            );
          }
          ```

          ## Важные правила

          1. **Не мутируйте** состояние — создавайте новое значение. React сравнивает ссылки: `items.push(x); setItems(items)` не вызовет рендер.

             ```jsx
             setItems([...items, newItem]);                              // добавить
             setItems(items.filter((i) => i.id !== id));                 // удалить
             setItems(items.map((i) => (i.id === id ? { ...i, done: !i.done } : i)));  // изменить
             setUser({ ...user, name: "Анна" });
             ```

          2. Обновление **асинхронное и пакетное**: внутри одного обработчика `count` не меняется. Если новое значение зависит от старого — функциональная форма:

             ```jsx
             setCount((c) => c + 1);
             setCount((c) => c + 1);   // +2, а с setCount(count + 1) дважды было бы +1
             ```

          3. Хуки вызываются **только на верхнем уровне** компонента — не в условиях и циклах.

          ## Поток данных сверху вниз

          Данные идут от родителя к детям через пропсы, события — снизу вверх через **колбэки**:

          ```jsx
          function TodoItem({ todo, onToggle }) {
            return <li onClick={() => onToggle(todo.id)}>{todo.done ? "✅" : "⬜"} {todo.text}</li>;
          }
          function TodoList() {
            const [todos, setTodos] = useState([{ id: 1, text: "Учить React", done: false }]);
            const toggle = (id) => setTodos((ts) => ts.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
            return <ul>{todos.map((t) => <TodoItem key={t.id} todo={t} onToggle={toggle} />)}</ul>;
          }
          ```

          ## Подъём состояния

          Если два компонента должны использовать одни данные — храните состояние в их **ближайшем общем родителе** и передавайте вниз.

          ## Производные данные

          Не храните в state то, что можно вычислить: `const left = todos.filter((t) => !t.done).length` — прямо при рендере.

          Сложная логика обновления — `useReducer(reducer, initialState)`: действия `dispatch({ type: "add", text })` и чистая функция-редьюсер.
        practice:
