            options: ["class", "className", "cssClass", "styleClass"]
            answer: 1
          - type: bug
            q: Что выведется на экран при count = 0?
            code: |
              function Cart({ count }) {
                return <div>{count && <span>Товаров: {count}</span>}</div>;
