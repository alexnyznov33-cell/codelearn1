          task: |
            Сделайте «Менеджер контактов»: таблица контактов (имя, телефон, email, группа) с поиском, фильтром по группе и сортировкой по клику на заголовок; форма добавления/редактирования на React Hook Form + Zod (телефон в формате +7XXXXXXXXXX, email, обязательное имя), удаление с подтверждением. Используйте правильные key, `useMemo` для фильтрации/сортировки, сохранение в localStorage.
