      - id: js-08-06
        title: Управление состоянием и запросы к API
        minutes: 45
        xp: 50
        theory: |
          Состояние в React-приложении бывает разным, и для каждого вида есть свой инструмент:

          | Вид | Пример | Инструмент |
          |---|---|---|
          | Локальное UI | открыт ли модал | `useState` |
          | Общее клиентское | тема, корзина, пользователь | Context, **Zustand**, Redux Toolkit |
          | Серверное | список товаров с API | **TanStack Query**, RTK Query, SWR |
          | В URL | фильтры, страница | React Router |
          | Формы | значения и ошибки | React Hook Form |

          ## Context — без «пробрасывания» пропсов

          ```jsx
          const ThemeContext = createContext("light");
          function App() {
            const [theme, setTheme] = useState("light");
            return (
              <ThemeContext.Provider value={{ theme, setTheme }}>
                <Page />
              </ThemeContext.Provider>
            );
          }
          function ThemeToggle() {
            const { theme, setTheme } = useContext(ThemeContext);
            return <button onClick={() => setTheme(theme === "light" ? "dark" : "light")}>{theme}</button>;
          }
          ```

          При изменении значения перерисовываются **все** потребители — для часто меняющихся данных лучше Zustand.

          ## Zustand

          ```jsx
          import { create } from "zustand";
          const useCart = create((set) => ({
            items: [],
            add: (p) => set((s) => ({ items: [...s.items, p] })),
            clear: () => set({ items: [] }),
          }));
          const count = useCart((s) => s.items.length);   // подписка только на нужный кусок
          ```

          ## TanStack Query — серверное состояние

          Кеширование, повторные запросы, фоновое обновление, дедупликация, состояния загрузки — из коробки:

          ```jsx
          const { data, isPending, error } = useQuery({
            queryKey: ["products", { page, sort }],          // ключ кеша
            queryFn: () => api(`/products?page=${page}&sort=${sort}`),
            staleTime: 60_000,                               // минуту данные считаются свежими
          });

          const queryClient = useQueryClient();
          const addProduct = useMutation({
            mutationFn: (p) => api("/products", { method: "POST", body: p }),
            onSuccess: () => queryClient.invalidateQueries({ queryKey: ["products"] }),  // обновить списки
          });
          addProduct.mutate({ title: "Чайник" });
          ```

          **Оптимистичные обновления**: в `onMutate` сразу меняем кеш, при ошибке откатываем.

          ## Главные принципы

          - Не копируйте серверные данные в `useState`/глобальный стор — пусть ими управляет кеш запросов.
          - Держите состояние как можно **ближе** к месту использования; глобальным делайте только действительно общее.
          - Нормализуйте сложные данные (объекты по id), не дублируйте.
          - Redux Toolkit оправдан в больших командах с жёсткими требованиями к предсказуемости и devtools.
