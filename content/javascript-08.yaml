        homework:
          task: |
            Доведите магазин до «боевой» архитектуры: каталог и карточка товара грузятся через TanStack Query (API — `https://dummyjson.com/products`), с пагинацией по query-параметрам и prefetch следующей страницы; корзина — Zustand с сохранением в localStorage (`persist` middleware); тема — Context; добавление отзыва — `useMutation` с оптимистичным обновлением и откатом при ошибке. Включите React Query Devtools.
          checklist:
            - Серверные данные не дублируются в useState
            - Корзина переживает перезагрузку
            - Мутация обновляет кеш
          solution: |
            import { QueryClient, QueryClientProvider, useQuery, useMutation, useQueryClient, keepPreviousData } from "@tanstack/react-query";
            import { create } from "zustand";
            import { persist } from "zustand/middleware";
            import { useSearchParams } from "react-router-dom";

            type Product = { id: number; title: string; price: number };
            const api = async <T,>(url: string, init?: RequestInit): Promise<T> => {
              const r = await fetch("https://dummyjson.com" + url, { headers: { "Content-Type": "application/json" }, ...init });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            };

            export const useCart = create<{ items: Product[]; add: (p: Product) => void; clear: () => void }>()(
              persist((set) => ({
                items: [],
                add: (p) => set((s) => ({ items: [...s.items, p] })),
                clear: () => set({ items: [] }),
              }), { name: "cart" })
            );

            const PAGE = 10;
            function Catalog() {
              const [params, setParams] = useSearchParams();
              const page = Number(params.get("page") ?? 0);
              const qc = useQueryClient();
              const fetchPage = (p: number) => api<{ products: Product[]; total: number }>(`/products?limit=${PAGE}&skip=${p * PAGE}`);
              const { data, isPending, error } = useQuery({ queryKey: ["products", page], queryFn: () => fetchPage(page), placeholderData: keepPreviousData });
              qc.prefetchQuery({ queryKey: ["products", page + 1], queryFn: () => fetchPage(page + 1) });
              const add = useCart((s) => s.add);
              if (isPending) return <p>Загрузка…</p>;
              if (error) return <p>{error.message}</p>;
              return (
                <>
                  {data.products.map((p) => <p key={p.id}>{p.title} — ${p.price} <button onClick={() => add(p)}>+</button></p>)}
                  <button disabled={page === 0} onClick={() => setParams({ page: String(page - 1) })}>←</button>
                  <button onClick={() => setParams({ page: String(page + 1) })}>→</button>
                </>
              );
            }

            type Review = { id: number; body: string };
            function Reviews({ productId }: { productId: number }) {
              const qc = useQueryClient();
              const key = ["reviews", productId];
              const { data = [] } = useQuery({ queryKey: key, queryFn: () => api<{ comments: Review[] }>(`/comments/post/${productId}`).then((r) => r.comments) });
              const addReview = useMutation({
                mutationFn: (body: string) => api("/comments/add", { method: "POST", body: JSON.stringify({ body, postId: productId, userId: 1 }) }),
                onMutate: async (body) => {
                  await qc.cancelQueries({ queryKey: key });
                  const prev = qc.getQueryData<Review[]>(key);
                  qc.setQueryData<Review[]>(key, (old = []) => [...old, { id: Date.now(), body }]);
                  return { prev };
                },
                onError: (_e, _v, ctx) => qc.setQueryData(key, ctx?.prev),
                onSettled: () => qc.invalidateQueries({ queryKey: key }),
              });
              return (<><ul>{data.map((r) => <li key={r.id}>{r.body}</li>)}</ul><button onClick={() => addReview.mutate("Отличный товар!")}>Добавить отзыв</button></>);
            }

            const client = new QueryClient({ defaultOptions: { queries: { staleTime: 60_000 } } });
            export const Root = () => <QueryClientProvider client={client}><Catalog /><Reviews productId={1} /></QueryClientProvider>;
