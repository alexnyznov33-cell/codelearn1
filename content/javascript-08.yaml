          solution: |
            import { lazy, Suspense, createContext, useContext, useState, type ReactNode } from "react";
            import { createBrowserRouter, RouterProvider, Outlet, NavLink, Navigate, useLocation, useNavigate, useParams, useSearchParams } from "react-router-dom";

            const products = [{ id: 1, title: "Чай", price: 300 }, { id: 2, title: "Кофе", price: 500 }];
            const AuthCtx = createContext<{ user: string | null; login: (n: string) => void }>({ user: null, login: () => {} });
            const useAuth = () => useContext(AuthCtx);
            const Admin = lazy(() => import("./pages/Admin"));

            function Layout() {
              return (<><nav><NavLink to="/" end>Главная</NavLink> <NavLink to="/products">Каталог</NavLink> <NavLink to="/cart">Корзина</NavLink></nav><Outlet /></>);
            }
            function Catalog() {
              const [params, setParams] = useSearchParams();
              const sort = params.get("sort") ?? "title";
              const list = [...products].sort((a, b) => (sort === "price" ? a.price - b.price : a.title.localeCompare(b.title)));
              return (<><button onClick={() => setParams({ sort: "price" })}>По цене</button>{list.map((p) => <p key={p.id}><NavLink to={`/products/${p.id}`}>{p.title}</NavLink></p>)}</>);
            }
            function Product() {
              const { id } = useParams();
              const p = products.find((x) => x.id === Number(id));
              return p ? <h1>{p.title} — {p.price} ₽</h1> : <h1>Товар не найден</h1>;
            }
            function RequireAuth({ children }: { children: ReactNode }) {
              const { user } = useAuth();
              const location = useLocation();
              return user ? <>{children}</> : <Navigate to="/login" state={{ from: location.pathname }} replace />;
            }
            function Login() {
              const { login } = useAuth();
              const navigate = useNavigate();
              const from = (useLocation().state as { from?: string } | null)?.from ?? "/";
              return <button onClick={() => { login("Анна"); navigate(from, { replace: true }); }}>Войти</button>;
            }
            const router = createBrowserRouter([{
              path: "/", element: <Layout />, children: [
                { index: true, element: <h1>Добро пожаловать</h1> },
                { path: "products", element: <Catalog /> },
                { path: "products/:id", element: <Product /> },
                { path: "cart", element: <RequireAuth><h1>Корзина</h1></RequireAuth> },
                { path: "login", element: <Login /> },
                { path: "admin", element: <Suspense fallback={<p>Загрузка…</p>}><Admin /></Suspense> },
                { path: "*", element: <h1>404</h1> },
              ],
            }]);
            export default function App() {
              const [user, setUser] = useState<string | null>(null);
              return <AuthCtx.Provider value={{ user, login: setUser }}><RouterProvider router={router} /></AuthCtx.Provider>;
            }
