        homework:
          task: |
            Добавьте роутинг в магазин: страницы «Главная», «Каталог» (фильтр и сортировка в query-параметрах), «Товар» (`/products/:id`, 404 для несуществующего id), «Корзина» (только для вошедших), «Вход» (после входа — возврат на страницу, с которой пришли), общий `Layout` с `NavLink` и счётчиком корзины, ленивая загрузка страницы «Админка». Настройте `_redirects`/`vercel.json` для хостинга SPA.
