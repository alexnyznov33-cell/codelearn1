            import { useMemo, useState } from "react";
            import { useForm } from "react-hook-form";
            import { z } from "zod";
            import { zodResolver } from "@hookform/resolvers/zod";

            const ContactSchema = z.object({
              name: z.string().min(1, "Обязательно"),
              phone: z.string().regex(/^\+7\d{10}$/, "Формат +7XXXXXXXXXX"),
              email: z.string().email("Неверный email"),
              group: z.enum(["семья", "работа", "друзья"]),
            });
            type ContactInput = z.infer<typeof ContactSchema>;
            type Contact = ContactInput & { id: string };

            function ContactForm({ initial, onSave }: { initial?: Contact; onSave: (c: ContactInput) => void }) {
              const { register, handleSubmit, reset, formState: { errors } } = useForm<ContactInput>({
                resolver: zodResolver(ContactSchema),
                defaultValues: initial ?? { group: "друзья" },
              });
              return (
                <form onSubmit={handleSubmit((d) => { onSave(d); reset(); })}>
                  <input placeholder="Имя" {...register("name")} /> {errors.name?.message}
                  <input placeholder="+7..." {...register("phone")} /> {errors.phone?.message}
                  <input placeholder="Email" {...register("email")} /> {errors.email?.message}
                  <select {...register("group")}><option>семья</option><option>работа</option><option>друзья</option></select>
                  <button>Сохранить</button>
                </form>
              );
            }

            export default function Contacts() {
              const [contacts, setContacts] = useState<Contact[]>(() => JSON.parse(localStorage.getItem("contacts") ?? "[]"));
              const [q, setQ] = useState("");
              const [group, setGroup] = useState("все");
              const [sortKey, setSortKey] = useState<keyof ContactInput>("name");
              const save = (next: Contact[]) => { setContacts(next); localStorage.setItem("contacts", JSON.stringify(next)); };
              const visible = useMemo(() => contacts
                .filter((c) => (group === "все" || c.group === group) && c.name.toLowerCase().includes(q.toLowerCase()))
                .sort((a, b) => a[sortKey].localeCompare(b[sortKey], "ru")), [contacts, q, group, sortKey]);
              return (
                <>
                  <ContactForm onSave={(c) => save([...contacts, { ...c, id: crypto.randomUUID() }])} />
                  <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск" />
                  <select value={group} onChange={(e) => setGroup(e.target.value)}><option>все</option><option>семья</option><option>работа</option><option>друзья</option></select>
                  <table>
                    <thead><tr>{(["name", "phone", "email", "group"] as const).map((k) => <th key={k} onClick={() => setSortKey(k)}>{k}</th>)}<th /></tr></thead>
                    <tbody>
                      {visible.map((c) => (
                        <tr key={c.id}>
                          <td>{c.name}</td><td>{c.phone}</td><td>{c.email}</td><td>{c.group}</td>
                          <td><button onClick={() => confirm("Удалить?") && save(contacts.filter((x) => x.id !== c.id))}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </>
              );
            }
