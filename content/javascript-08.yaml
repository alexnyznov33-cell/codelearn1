        homework:
          task: |
            Сделайте «Корзину» на React: список товаров (из массива) с кнопкой «В корзину», компонент `Cart` с позициями, кнопками +/− количества, удалением, итоговой суммой и скидкой 10% от 5000 ₽. Состояние корзины хранится в `App` (подъём состояния), изменения через `useReducer` с действиями add/inc/dec/remove/clear. Итог и количество вычисляются при рендере, а не хранятся.
          checklist:
            - Состояние не мутируется
            - Используется useReducer
            - Производные данные не дублируются в state
          solution: |
            import { useReducer } from "react";
            type Product = { id: number; title: string; price: number };
            type Line = Product & { qty: number };
            type Action = { type: "add"; product: Product } | { type: "inc" | "dec" | "remove"; id: number } | { type: "clear" };

            const products: Product[] = [{ id: 1, title: "Чай", price: 300 }, { id: 2, title: "Кофемолка", price: 4900 }];

            function cartReducer(state: Line[], a: Action): Line[] {
              switch (a.type) {
                case "add":
                  return state.some((l) => l.id === a.product.id)
                    ? state.map((l) => (l.id === a.product.id ? { ...l, qty: l.qty + 1 } : l))
                    : [...state, { ...a.product, qty: 1 }];
                case "inc": return state.map((l) => (l.id === a.id ? { ...l, qty: l.qty + 1 } : l));
                case "dec": return state.map((l) => (l.id === a.id ? { ...l, qty: l.qty - 1 } : l)).filter((l) => l.qty > 0);
                case "remove": return state.filter((l) => l.id !== a.id);
                case "clear": return [];
              }
            }

            function Cart({ lines, dispatch }: { lines: Line[]; dispatch: (a: Action) => void }) {
              const sum = lines.reduce((s, l) => s + l.price * l.qty, 0);
              const total = sum >= 5000 ? Math.round(sum * 0.9) : sum;
              if (!lines.length) return <p>Корзина пуста</p>;
              return (
                <div>
                  {lines.map((l) => (
                    <div key={l.id}>
                      {l.title} × {l.qty}
                      <button onClick={() => dispatch({ type: "dec", id: l.id })}>−</button>
                      <button onClick={() => dispatch({ type: "inc", id: l.id })}>+</button>
                      <button onClick={() => dispatch({ type: "remove", id: l.id })}>✕</button>
                    </div>
                  ))}
                  <p>Итого: {total} ₽ {sum >= 5000 && "(скидка 10%)"}</p>
                  <button onClick={() => dispatch({ type: "clear" })}>Очистить</button>
                </div>
              );
            }

            export default function App() {
              const [lines, dispatch] = useReducer(cartReducer, []);
              return (
                <>
                  {products.map((p) => (
                    <button key={p.id} onClick={() => dispatch({ type: "add", product: p })}>{p.title} — {p.price} ₽</button>
                  ))}
                  <Cart lines={lines} dispatch={dispatch} />
                </>
              );
            }
      - id: js-08-03
        title: Хуки useEffect, useMemo, useRef
        minutes: 45
        xp: 50
        theory: |
          ## useEffect — синхронизация с внешним миром

          Эффект выполняется **после** отрисовки. Используется для подписок, таймеров, запросов, работы с DOM-API.

          ```jsx
          useEffect(() => {
            document.title = `Корзина (${count})`;
          }, [count]);                         // перезапуск, только когда изменился count

          useEffect(() => {
            const id = setInterval(() => setSeconds((s) => s + 1), 1000);
            return () => clearInterval(id);    // очистка: при размонтировании и перед следующим запуском
          }, []);                              // [] — один раз после монтирования
          ```

          Массив зависимостей: без него — после **каждого** рендера; `[]` — один раз; `[a, b]` — при изменении a или b. Указывайте **все** используемые значения (правило линтера `react-hooks/exhaustive-deps`).

          ## Загрузка данных с отменой

          ```jsx
          useEffect(() => {
            const controller = new AbortController();
            setLoading(true);
            fetch(`/api/users?q=${query}`, { signal: controller.signal })
              .then((r) => r.json())
              .then(setUsers)
              .catch((e) => e.name !== "AbortError" && setError(e.message))
              .finally(() => setLoading(false));
            return () => controller.abort();   // при новом query старый запрос отменится
          }, [query]);
          ```

          В режиме разработки `StrictMode` запускает эффекты **дважды**, чтобы выявить забытую очистку. В реальных проектах для запросов используют TanStack Query (урок 6).

          ## Вам может не понадобиться эффект

          Не используйте `useEffect` для вычислений из пропсов/состояния — считайте при рендере. Реакцию на клик пишите в обработчике, а не в эффекте.

          ## useMemo и useCallback

          ```jsx
          const filtered = useMemo(
            () => products.filter((p) => p.title.includes(query)).sort(byPrice),
            [products, query]          // пересчёт только при изменении
          );
          const handleSelect = useCallback((id) => setSelected(id), []);  // стабильная ссылка на функцию
          ```

          Нужны для **дорогих** вычислений и для передачи стабильных ссылок в компоненты, обёрнутые в `memo`. Не оборачивайте всё подряд — это тоже стоит ресурсов. (React Compiler в React 19 умеет мемоизировать автоматически.)

          ## useRef

          ```jsx
          const inputRef = useRef(null);
          useEffect(() => inputRef.current.focus(), []);
          <input ref={inputRef} />

          const renders = useRef(0);
          renders.current++;           // изменяемое значение, НЕ вызывает рендер
          ```

          Применение: доступ к DOM-элементу, хранение id таймера, предыдущего значения, любых данных «между рендерами» без перерисовки.

          ## Свои хуки

          Логику с хуками выносят в функции `useXxx`:

          ```jsx
          function useLocalStorage(key, initial) {
            const [value, setValue] = useState(() => JSON.parse(localStorage.getItem(key)) ?? initial);
            useEffect(() => localStorage.setItem(key, JSON.stringify(value)), [key, value]);
            return [value, setValue];
          }
          ```
        practice:
          - type: choice
            q: Когда выполнится эффект с пустым массивом зависимостей []?
            options: ["После каждого рендера", "Один раз после монтирования", "Никогда", "Перед рендером"]
            answer: 1
          - type: bug
            q: Что не так с этим эффектом?
            code: |
              useEffect(() => {
                const id = setInterval(() => setTime(new Date()), 1000);
              }, []);
            bugLine: 2
            fix: "добавить return () => clearInterval(id);"
            explain: Без функции очистки интервал продолжит работать после размонтирования компонента — утечка.
          - type: choice
            q: Чем useRef отличается от useState?
            options: ["Ничем", "Изменение ref.current не вызывает повторный рендер", "useRef только для чисел", "useRef сбрасывается при каждом рендере"]
            answer: 1
          - type: fill
            q: Пересчитывайте отфильтрованный список только при изменении items или query
            code: |
              const visible = ___(() => items.filter((i) => i.name.includes(query)), [items, query]);
            answers: ["useMemo"]
          - type: choice
            q: Нужен ли useEffect, чтобы посчитать fullName из firstName и lastName?
            options: ["Да, обязательно", "Нет, вычислить прямо при рендере", "Нужен useRef", "Нужен useCallback"]
            answer: 1
        homework:
          task: |
            Сделайте компонент «Поиск пользователей GitHub»: поле ввода с автофокусом (`useRef`), свой хук `useDebounce(value, ms)`, свой хук `useFetch(url)` с состояниями loading/error/data и отменой запроса через AbortController, сортировку результатов через `useMemo`, сохранение последнего запроса в localStorage хуком `useLocalStorage`. Покажите счётчик рендеров через `useRef`.
          checklist:
            - Эффекты имеют очистку
            - Свои хуки вынесены отдельно
            - Нет лишних эффектов для производных данных
          solution: |
            import { useEffect, useMemo, useRef, useState } from "react";

            function useDebounce<T>(value: T, ms = 400) {
              const [v, setV] = useState(value);
              useEffect(() => {
                const t = setTimeout(() => setV(value), ms);
                return () => clearTimeout(t);
              }, [value, ms]);
              return v;
            }
            function useFetch<T>(url: string | null) {
              const [state, setState] = useState<{ data?: T; error?: string; loading: boolean }>({ loading: false });
              useEffect(() => {
                if (!url) return;
                const c = new AbortController();
                setState({ loading: true });
                fetch(url, { signal: c.signal })
                  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                  .then((data) => setState({ data, loading: false }))
                  .catch((e) => { if (e.name !== "AbortError") setState({ error: e.message, loading: false }); });
                return () => c.abort();
              }, [url]);
              return state;
            }
            function useLocalStorage(key: string, initial: string) {
              const [v, setV] = useState(() => localStorage.getItem(key) ?? initial);
              useEffect(() => localStorage.setItem(key, v), [key, v]);
              return [v, setV] as const;
            }

            type GhUser = { id: number; login: string; avatar_url: string };
            export default function UserSearch() {
              const [query, setQuery] = useLocalStorage("last-query", "");
              const q = useDebounce(query, 400);
              const inputRef = useRef<HTMLInputElement>(null);
              const renders = useRef(0);
              renders.current++;
              useEffect(() => inputRef.current?.focus(), []);
              const { data, error, loading } = useFetch<{ items: GhUser[] }>(q ? `https://api.github.com/search/users?q=${encodeURIComponent(q)}` : null);
              const sorted = useMemo(() => [...(data?.items ?? [])].sort((a, b) => a.login.localeCompare(b.login)), [data]);
              return (
                <div>
                  <input ref={inputRef} value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Логин" />
                  {loading && <p>Загрузка…</p>}
                  {error && <p className="error">{error}</p>}
                  <ul>{sorted.map((u) => <li key={u.id}><img src={u.avatar_url} width={24} alt="" /> {u.login}</li>)}</ul>
                  <small>Рендеров: {renders.current}</small>
                </div>
              );
            }
      - id: js-08-04
        title: Формы и списки
        minutes: 40
        xp: 45
        theory: |
          ## Списки и key

          ```jsx
          <ul>
            {users.map((u) => <UserRow key={u.id} user={u} />)}
          </ul>
          ```

          `key` помогает React понять, какой элемент добавлен, удалён или переставлен. Ключ должен быть **уникальным среди соседей и стабильным**: id из данных. Индекс массива в качестве ключа ломает состояние элементов (фокус, введённый текст) при сортировке, вставке и удалении.

          ## Управляемые поля

          Значение поля хранится в состоянии, React — «единственный источник правды»:

          ```jsx
          function SignupForm({ onSubmit }) {
            const [form, setForm] = useState({ email: "", plan: "free", agree: false });
            const [errors, setErrors] = useState({});

            const change = (e) => {
              const { name, value, type, checked } = e.target;
              setForm((f) => ({ ...f, [name]: type === "checkbox" ? checked : value }));
            };

            const submit = (e) => {
              e.preventDefault();
              const errs = {};
              if (!/^\S+@\S+\.\S+$/.test(form.email)) errs.email = "Неверный email";
              if (!form.agree) errs.agree = "Нужно согласие";
              setErrors(errs);
              if (Object.keys(errs).length === 0) onSubmit(form);
            };

            return (
              <form onSubmit={submit} noValidate>
                <input name="email" value={form.email} onChange={change} aria-invalid={!!errors.email} />
                {errors.email && <p role="alert">{errors.email}</p>}
                <select name="plan" value={form.plan} onChange={change}>
                  <option value="free">Free</option>
                  <option value="pro">Pro</option>
                </select>
                <label><input type="checkbox" name="agree" checked={form.agree} onChange={change} /> Согласен</label>
                <button>Отправить</button>
              </form>
            );
          }
          ```

          `value` без `onChange` делает поле «замороженным» — React выдаст предупреждение.

          ## Неуправляемые поля

          Значение хранит DOM, читаем при отправке: `<input name="q" defaultValue="" />` + `new FormData(e.currentTarget)`. Проще и быстрее для больших форм.

          ## Библиотеки форм

          В реальных проектах — **React Hook Form** + **Zod**:

          ```jsx
          const schema = z.object({ email: z.string().email("Неверный email"), age: z.coerce.number().min(18) });
          const { register, handleSubmit, formState: { errors, isSubmitting } } = useForm({ resolver: zodResolver(schema) });
          <form onSubmit={handleSubmit(save)}>
            <input {...register("email")} />
            {errors.email && <p>{errors.email.message}</p>}
          </form>
          ```

          ## Большие списки

          Тысячи строк — **виртуализация** (TanStack Virtual, react-window): рендерятся только видимые элементы. Фильтрация и сортировка — через `useMemo`, ввод поиска — `useDeferredValue`, чтобы не тормозил.
