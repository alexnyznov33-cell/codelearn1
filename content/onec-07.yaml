            options: ["Нумерует документы", "Перепроводит документы после изменённого задним числом", "Удаляет помеченные объекты", "Создаёт резервную копию"]
            answer: 1
          - type: bug
            q: Найдите ошибку проверки по новой методике
            code: |
              Движения.ОстаткиТоваров.Записывать = Истина;
              Запрос.Текст = "ВЫБРАТЬ ... ГДЕ Ост.КоличествоОстаток < 0";
              Результат = Запрос.Выполнить();
              Движения.Записать();
              Отказ = Не Результат.Пустой();
            bugLine: 4
            fix: Вызвать Движения.Записать() до выполнения запроса
            explain: Проверять остатки нужно после записи движений, иначе запрос не видит текущий документ.
        homework:
          task: |
            Переделайте проведение РеализацииТоваров по новой методике: при оперативном проведении — записать движения и проверить отрицательные остатки по товарам документа с подробным сообщением (товар, не хватает N); при неоперативном — без контроля. Отдельно напишите функцию получения остатков с правильной границей для обоих режимов.
          checklist:
            - Различаются режимы Оперативный/Неоперативный
            - Движения пишутся до проверки
            - Сообщение указывает товар и нехватку
            - Граница с ВидГраницы.Исключая
          solution: |
            Процедура ОбработкаПроведения(Отказ, Режим)
                Движения.ОстаткиТоваров.Записывать = Истина;
                Для Каждого С Из Товары Цикл
                    Д = Движения.ОстаткиТоваров.ДобавитьРасход();
                    Д.Период = Дата; Д.Склад = Склад;
                    Д.Номенклатура = С.Номенклатура; Д.Количество = С.Количество;
                КонецЦикла;
                Движения.Записать();

                Если Режим = РежимПроведенияДокумента.Оперативный Тогда
                    Запрос = Новый Запрос(
                    "ВЫБРАТЬ Ост.Номенклатура, -Ост.КоличествоОстаток КАК Нехватка
                    |ИЗ РегистрНакопления.ОстаткиТоваров.Остатки(,
                    |  Номенклатура В (&Товары) И Склад = &Склад) КАК Ост
                    |ГДЕ Ост.КоличествоОстаток < 0");
                    Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
                    Запрос.УстановитьПараметр("Склад", Склад);
                    Выборка = Запрос.Выполнить().Выбрать();
                    Пока Выборка.Следующий() Цикл
                        Сообщить(СтрШаблон("Товар %1: не хватает %2", Выборка.Номенклатура, Выборка.Нехватка));
                        Отказ = Истина;
                    КонецЦикла;
                КонецЕсли;
            КонецПроцедуры

            Функция Остатки(Режим)
                Если Режим = РежимПроведенияДокумента.Оперативный Тогда
                    Период = Неопределено;
                Иначе
                    Период = Новый Граница(МоментВремени(), ВидГраницы.Исключая);
                КонецЕсли;
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Ост.Номенклатура, Ост.КоличествоОстаток
                |ИЗ РегистрНакопления.ОстаткиТоваров.Остатки(&Период, Склад = &Склад) КАК Ост");
                Запрос.УстановитьПараметр("Период", Период);
                Запрос.УстановитьПараметр("Склад", Склад);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции
      - id: 1c-07-03
        title: Контроль остатков и блокировки
        minutes: 40
        xp: 50
        theory: |
          Два менеджера одновременно продают последние 5 штук товара. Оба проверили остаток — «5 есть», оба провели. Итог: остаток −5. Решение — **управляемые блокировки**.

          ## Управляемая блокировка

          ```bsl
          Блокировка = Новый БлокировкаДанных;
          Элемент = Блокировка.Добавить("РегистрНакопления.ОстаткиТоваров");
          Элемент.Режим = РежимБлокировкиДанных.Исключительный;
          Элемент.ИсточникДанных = Товары;
          Элемент.ИспользоватьИзИсточникаДанных("Номенклатура", "Номенклатура");
          Элемент.УстановитьЗначение("Склад", Склад);
          Блокировка.Заблокировать();
          ```

          Блокировка действует **до конца транзакции** (проведение — уже транзакция). Второй пользователь, пытающийся заблокировать те же товары, **подождёт**, пока первый не завершит проведение, и затем увидит актуальный остаток.

          ## Режимы

          | Режим | Совместимость |
          |---|---|
          | Разделяемый | Совместим с другими разделяемыми — для чтения |
          | Исключительный | Несовместим ни с чем — для чтения с последующей записью |

          Правило: блокируйте **до чтения** данных, которые будете менять, и только **нужные** измерения (товары и склад документа, а не весь регистр).

          ## Транзакции в коде

          ```bsl
          НачатьТранзакцию();
          Попытка
              Блокировка.Заблокировать();
              // чтение и запись
              ЗафиксироватьТранзакцию();
          Исключение
              ОтменитьТранзакцию();
              ВызватьИсключение;
          КонецПопытки;
          ```

          ## Взаимоблокировки (deadlock)

          Транзакция A заблокировала товар 1 и ждёт товар 2, транзакция B — наоборот. СУБД убьёт одну из них. Как избежать:

          - блокировать **сразу всё нужное одним** `Заблокировать()`;
          - не повышать блокировку «разделяемая → исключительная» на тех же данных;
          - держать транзакции короткими: никакого диалога с пользователем и HTTP-запросов внутри.

          ## Режим совместимости

          В свойствах конфигурации «Режим управления блокировкой данных» должен быть **Управляемый** (в старых базах — «Автоматический», там блокирует СУБД, и код выше не работает как ожидается).

          ## Контроль остатков — итоговая схема

          1. `Блокировка.Заблокировать()` по товарам+складу.
          2. Записать движения.
          3. Запрос остатков `< 0` → сообщение и `Отказ`.
        practice:
