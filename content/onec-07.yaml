          solution: |
            // РеализацияТоваров.ОбработкаПроведения
            Процедура ОбработкаПроведения(Отказ, Режим)
                Движения.Хозрасчетный.Записывать = Истина;
                Для Каждого С Из Товары Цикл
                    Пр = Движения.Хозрасчетный.Добавить();
                    Пр.Период = Дата;
                    Пр.СчетДт = ПланыСчетов.Хозрасчетный.РасчетыСПокупателями;
                    Пр.СубконтоДт[ПланыВидовХарактеристик.ВидыСубконто.Контрагенты] = Контрагент;
                    Пр.СчетКт = ПланыСчетов.Хозрасчетный.Выручка;
                    Пр.Сумма = С.Сумма;
                    Пр.Содержание = "Выручка";

                    Пр = Движения.Хозрасчетный.Добавить();
                    Пр.Период = Дата;
                    Пр.СчетДт = ПланыСчетов.Хозрасчетный.Себестоимость;
                    Пр.СчетКт = ПланыСчетов.Хозрасчетный.Товары;
                    Пр.СубконтоКт[ПланыВидовХарактеристик.ВидыСубконто.Номенклатура] = С.Номенклатура;
                    Пр.Количество = С.Количество;
                    Пр.Сумма = С.Себестоимость;
                    Пр.Содержание = "Себестоимость";
                КонецЦикла;
            КонецПроцедуры

            Функция ДолгиПокупателей(НаДату) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Ост.Субконто1 КАК Контрагент, Ост.СуммаОстатокДт КАК Долг
                |ИЗ РегистрБухгалтерии.Хозрасчетный.Остатки(&Дата,
                |  Счет = ЗНАЧЕНИЕ(ПланСчетов.Хозрасчетный.РасчетыСПокупателями),
                |  ЗНАЧЕНИЕ(ПланВидовХарактеристик.ВидыСубконто.Контрагенты)) КАК Ост
                |ГДЕ Ост.СуммаОстатокДт > 0
                |УПОРЯДОЧИТЬ ПО Долг УБЫВ");
                Запрос.УстановитьПараметр("Дата", Новый Граница(КонецДня(НаДату), ВидГраницы.Включая));
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции
      - id: 1c-07-05
        title: Регистры расчёта
        minutes: 35
        xp: 50
        theory: |
          **Регистры расчёта** — механизм для сложных периодических расчётов: зарплата, начисления, удержания. Главное отличие от других регистров — учёт **периода действия** и **вытеснения** записей.

          ## Связанные объекты

          | Объект | Роль |
          |---|---|
          | План видов расчёта | Виды начислений: Оклад, Премия, Больничный, Отпуск |
          | Регистр расчёта | Записи: сотрудник, вид расчёта, период действия, результат |
          | График (регистр сведений) | Рабочие дни/часы для периода действия |

          ## Ключевые понятия

          - **Период регистрации** — месяц, к которому относится запись (расчётный период).
          - **Период действия** — интервал дат, за который начисляется (с 01.03 по 31.03).
          - **Вытеснение** — больничный «вытесняет» оклад: дни болезни исключаются из оклада. Настраивается в плане видов расчёта (свойство «Вытесняющие виды расчёта»).
          - **База** — от чего считается: премия 10% **от оклада** (базовые виды расчёта).
          - **Ведущие виды** — при изменении оклада задним числом перерасчитывается премия.

          ## Запись

          ```bsl
          Запись = Движения.Начисления.Добавить();
          Запись.ПериодРегистрации = НачалоМесяца(Дата);
          Запись.ВидРасчета = ПланыВидовРасчета.Начисления.Оклад;
          Запись.Сотрудник = Сотрудник;
          Запись.ПериодДействияНачало = НачалоМесяца(Дата);
          Запись.ПериодДействияКонец = КонецМесяца(Дата);
          Запись.Размер = 60000;
          ```

          ## Виртуальные таблицы

          - `ФактическийПериодДействия` — периоды с учётом вытеснения;
          - `ДанныеГрафика` — сколько рабочих дней по графику в фактическом периоде;
          - `БазаНачисления` — сумма базовых начислений для расчёта процента.

          ```bsl
          // Оклад пропорционально отработанному времени
          ВЫБРАТЬ
              Н.НомерСтроки,
              Н.Размер * Н.ДнейФактПериодДействия / Н.ДнейНорма КАК Результат
          ИЗ РегистрРасчета.Начисления.ДанныеГрафика(
              Регистратор = &Ссылка И ВидРасчета = &Оклад) КАК Н
          ```

          После расчёта результат записывают в поле `Результат` и записывают набор.

          ## Пример

          Оклад 60 000, в марте 20 рабочих дней по графику, 5 дней больничного (вытесняет). Фактически отработано 15 дней → оклад 60 000 × 15 / 20 = 45 000.

          > На практике в ЗУП логика сложнее (БСП, механизм «Расчёт зарплаты»), но понимание регистров расчёта — частый вопрос на собеседовании Middle.
        practice:
          - type: choice
            q: Что означает вытеснение в регистрах расчёта?
            options: ["Удаление старых записей", "Исключение периода одного вида расчёта другим (больничный вытесняет оклад)", "Перенос записи в следующий месяц", "Округление результата"]
            answer: 1
          - type: output
            q: "Оклад 40 000, рабочих дней в месяце по графику 20, сотрудник был в отпуске 5 дней (вытесняет оклад). Каков результат начисления оклада?"
            code: |
              // Размер * ДнейФакт / ДнейНорма
            answer: "30000"
          - type: choice
            q: Какая виртуальная таблица учитывает вытеснение и даёт фактические периоды?
            options: ["Остатки", "ФактическийПериодДействия", "СрезПоследних", "Обороты"]
            answer: 1
          - type: fill
            q: Заполните периоды записи регистра расчёта
            code: |
              Запись.___ = НачалоМесяца(Дата);
              Запись.ПериодДействияНачало = НачалоМесяца(Дата);
              Запись.___ = КонецМесяца(Дата);
            answers: ["ПериодРегистрации", "ПериодДействияКонец"]
          - type: choice
            q: Как называется связь, при которой премия зависит от суммы оклада?
            options: ["Вытеснение", "База (базовые виды расчёта)", "Регистратор", "Подчинение"]
            answer: 1
        homework:
          task: |
            Создайте план видов расчёта Начисления (Оклад, Больничный — вытесняет Оклад, Премия — база Оклад), регистр расчёта Начисления с графиком, документ «Начисление зарплаты» (ТЧ: Сотрудник, ВидРасчета, Размер, Начало, Конец). При проведении записать движения и рассчитать Оклад по ДанныеГрафика, затем Премию 10% от базы.
          checklist:
            - Вытеснение и база настроены
            - Оклад пропорционален фактическим дням
            - Премия считается от БазаНачисления
            - Результат записан в регистр
          solution: |
            Процедура ОбработкаПроведения(Отказ, Режим)
                Движения.Начисления.Записывать = Истина;
                Для Каждого С Из Начисления Цикл
                    З = Движения.Начисления.Добавить();
                    З.ПериодРегистрации = НачалоМесяца(Дата);
                    З.ВидРасчета = С.ВидРасчета;
                    З.Сотрудник = С.Сотрудник;
                    З.ПериодДействияНачало = С.Начало;
                    З.ПериодДействияКонец = КонецДня(С.Конец);
                    З.Размер = С.Размер;
                    З.ГрафикРаботы = Справочники.Графики.Пятидневка;
