      - id: 1c-07-04
        title: Бухгалтерские регистры и план счетов
        minutes: 40
        xp: 50
        theory: |
          Бухгалтерия в 1С ведётся методом **двойной записи**: каждая проводка — это **Дебет** одного счёта и **Кредит** другого на одну сумму.

          ## План счетов

          Объект конфигурации **План счетов** — справочник счетов с особыми свойствами:

          - код (`41.01`, `60.01`, `90.02`), вид (Активный / Пассивный / Активно-пассивный);
          - **субконто** — аналитика счёта (по счёту 41 — Номенклатура и Склады, по 60 — Контрагенты и Договоры);
          - признаки учёта: количественный, валютный.

          Виды субконто задаёт **План видов характеристик**.

          ## Регистр бухгалтерии

          Связан с планом счетов, хранит проводки: `СчетДт`, `СчетКт`, `СубконтоДт1..3`, `СубконтоКт1..3`, ресурсы `Сумма`, `Количество`.

          ```bsl
          Процедура ОбработкаПроведения(Отказ, Режим)
              Движения.Хозрасчетный.Записывать = Истина;
              Для Каждого С Из Товары Цикл
                  Пр = Движения.Хозрасчетный.Добавить();
                  Пр.Период = Дата;
                  Пр.СчетДт = ПланыСчетов.Хозрасчетный.Товары;          // 41
                  Пр.СубконтоДт.Номенклатура = С.Номенклатура;
                  Пр.СчетКт = ПланыСчетов.Хозрасчетный.РасчетыСПоставщиками; // 60
                  Пр.СубконтоКт.Контрагенты = Контрагент;
                  Пр.Сумма = С.Сумма;
                  Пр.Содержание = "Поступление товаров";
              КонецЦикла;
          КонецПроцедуры
          ```

          Субконто задаются как `Пр.СубконтоДт[ВидСубконто] = Значение` (или через имя предопределённого вида).

          ## Виртуальные таблицы

          | Таблица | Что даёт |
          |---|---|
          | `Остатки` | Сальдо по счёту на дату |
          | `Обороты` | Обороты по Дт/Кт |
          | `ОстаткиИОбороты` | Оборотно-сальдовая ведомость |
          | `ДвиженияССубконто` | Список проводок с аналитикой |

          ```bsl
          ВЫБРАТЬ Ост.Субконто1 КАК Контрагент, Ост.СуммаОстатокКт КАК Долг
          ИЗ РегистрБухгалтерии.Хозрасчетный.Остатки(&Дата,
              Счет = ЗНАЧЕНИЕ(ПланСчетов.Хозрасчетный.РасчетыСПоставщиками),
              ЗНАЧЕНИЕ(ПланВидовХарактеристик.ВидыСубконтоХозрасчетные.Контрагенты)) КАК Ост
          ```

          ## Типовые проводки торговли

          | Операция | Дт | Кт |
          |---|---|---|
          | Поступление товара | 41 | 60 |
          | Оплата поставщику | 60 | 51 |
          | Выручка от продажи | 62 | 90.01 |
          | Себестоимость | 90.02 | 41 |
          | Оплата от покупателя | 51 | 62 |

          > Middle-разработчик в 1С:Бухгалтерии/ERP обязан читать ОСВ и понимать, «куда ушла сумма».
        practice:
