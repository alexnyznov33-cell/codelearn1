        homework:
          task: |
            Добавьте в учебную конфигурацию план счетов (41, 51, 60, 62, 90.01, 90.02) с видами субконто Номенклатура и Контрагенты, регистр бухгалтерии Хозрасчетный. Сделайте проводки по документам Поступление (Дт41 Кт60) и Реализация (Дт62 Кт90.01 на выручку, Дт90.02 Кт41 на себестоимость). Напишите запрос «Долги покупателей» по счёту 62 на дату.
          checklist:
