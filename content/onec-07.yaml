id: onec
modules:
  - id: 1c-m7
    title: Учётные механизмы
    level: Middle
    lessons:
      - id: 1c-07-01
        title: Партионный учёт и списание по FIFO
        minutes: 45
        xp: 50
        theory: |
          **Партионный учёт** хранит, по какой цене пришла каждая партия товара. При продаже себестоимость считается по партиям — чаще всего методом **FIFO** (первым пришёл — первым ушёл).

          ## Регистр партий

          Регистр накопления остатков **ПартииТоваров**:

          | Тип | Поле |
          |---|---|
          | Измерения | Номенклатура, Склад, Партия (документ поступления) |
          | Ресурсы | Количество, Сумма |

          Поступление делает приход партии. Реализация должна **списать** нужное количество из самых старых партий.

          ## Алгоритм FIFO

          1. Получить остатки партий по товарам документа, упорядочив по дате партии.
          2. Для каждой строки ТЧ «откусывать» количество от партий, пока не наберём нужное.
          3. Сумма списания = Сумма партии × Списано / Количество партии.

          ```bsl
          Запрос.Текст =
          "ВЫБРАТЬ
          |    Ост.Номенклатура, Ост.Партия,
          |    Ост.КоличествоОстаток КАК Количество, Ост.СуммаОстаток КАК Сумма
          |ИЗ РегистрНакопления.ПартииТоваров.Остатки(&МоментВремени,
          |    Номенклатура В (&Товары) И Склад = &Склад) КАК Ост
          |УПОРЯДОЧИТЬ ПО Ост.Партия.МоментВремени";
          Партии = Запрос.Выполнить().Выгрузить();

          Для Каждого СтрокаТЧ Из Товары Цикл
              Нужно = СтрокаТЧ.Количество;
              Отбор = Новый Структура("Номенклатура", СтрокаТЧ.Номенклатура);
              Для Каждого П Из Партии.НайтиСтроки(Отбор) Цикл
                  Если Нужно = 0 Тогда Прервать; КонецЕсли;
                  Списать = Мин(Нужно, П.Количество);
                  СуммаСписания = ?(Списать = П.Количество, П.Сумма,
                      Окр(П.Сумма * Списать / П.Количество, 2));
                  Движение = Движения.ПартииТоваров.ДобавитьРасход();
                  Движение.Период = Дата;
                  Движение.Номенклатура = П.Номенклатура;
                  Движение.Склад = Склад;
                  Движение.Партия = П.Партия;
                  Движение.Количество = Списать;
                  Движение.Сумма = СуммаСписания;
                  П.Количество = П.Количество - Списать;
                  П.Сумма = П.Сумма - СуммаСписания;
                  Нужно = Нужно - Списать;
              КонецЦикла;
              Если Нужно > 0 Тогда
                  Сообщить("Не хватает " + Нужно + " шт. " + СтрокаТЧ.Номенклатура);
                  Отказ = Истина;
              КонецЕсли;
          КонецЦикла;
          ```

          ## Важные детали

          - Уменьшайте остаток партии в таблице (`П.Количество - Списать`) — иначе две строки ТЧ с одним товаром спишут одну партию дважды.
          - При списании **всей** партии берите остаток суммы целиком, чтобы не накапливались копейки округления.
          - Остатки читают на **момент времени документа** (`МоментВремени()`), и при оперативном проведении — с блокировкой (следующие уроки).
          - **LIFO** — та же логика, но сортировка `УБЫВ`. **Средняя** — сумма остатка / количество остатка без партий.
        practice:
          - type: output
            q: "Партии: 1-я — 5 шт., 2-я — 10 шт. Продаём 8 шт. по FIFO. Сколько штук останется во 2-й партии?"
            code: |
              // Партия 1: 5 шт.
              // Партия 2: 10 шт.
              // Списать по FIFO: 8 шт.
            answer: "7"
            explain: Из 1-й списываем 5, из 2-й — 3, остаётся 7.
          - type: output
            q: "Партия: 10 шт. на сумму 500. Списываем 4 шт. Какая сумма списания?"
            code: |
              СуммаСписания = Окр(500 * 4 / 10, 2);
              Сообщить(СуммаСписания);
            answer: "200"
          - type: choice
            q: Как отсортировать партии для списания по FIFO?
            options: ["По сумме убыванием", "По моменту времени партии по возрастанию", "По моменту времени по убыванию", "По номенклатуре"]
            answer: 1
          - type: bug
            q: Найдите строку, без которой две строки ТЧ с одним товаром спишут одну партию дважды
            code: |
              Списать = Мин(Нужно, П.Количество);
              Движение = Движения.ПартииТоваров.ДобавитьРасход();
              Движение.Партия = П.Партия;
              Движение.Количество = Списать;
              Нужно = Нужно - Списать;
            bugLine: 4
            fix: После движения добавить П.Количество = П.Количество - Списать;
            explain: Остаток партии в таблице надо уменьшать — иначе следующая строка увидит старое количество.
          - type: fill
            q: Добавьте движение расхода и вычислите количество списания
            code: |
              Списать = ___(Нужно, П.Количество);
              Движение = Движения.ПартииТоваров.___();
            answers: ["Мин", "ДобавитьРасход"]
        homework:
          task: |
            Реализуйте партионный учёт: регистр ПартииТоваров (Номенклатура, Склад, Партия / Количество, Сумма). Поступление — приход партий. Реализация — списание по FIFO с контролем нехватки, движение в регистр Продажи с себестоимостью. Вынесите алгоритм в функцию общего модуля, которая получает таблицу товаров и возвращает таблицу списаний.
          checklist:
            - Сортировка по моменту времени партии
            - Остаток партии уменьшается в цикле
            - Последняя часть партии списывается целиком по сумме
            - Нехватка → Отказ с сообщением
          solution: |
            // Общий модуль ПартионныйУчет (сервер)
            Функция РассчитатьСписание(Товары, Склад, МоментВремени, Отказ) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Ост.Номенклатура, Ост.Партия,
                |  Ост.КоличествоОстаток КАК Количество, Ост.СуммаОстаток КАК Сумма
                |ИЗ РегистрНакопления.ПартииТоваров.Остатки(&МВ,
                |  Номенклатура В (&Товары) И Склад = &Склад) КАК Ост
                |УПОРЯДОЧИТЬ ПО Ост.Партия.МоментВремени");
                Запрос.УстановитьПараметр("МВ", МоментВремени);
                Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
                Запрос.УстановитьПараметр("Склад", Склад);
                Партии = Запрос.Выполнить().Выгрузить();

                Списания = Новый ТаблицаЗначений;
                Списания.Колонки.Добавить("Номенклатура");
                Списания.Колонки.Добавить("Партия");
                Списания.Колонки.Добавить("Количество");
                Списания.Колонки.Добавить("Сумма");

                Для Каждого СтрокаТЧ Из Товары Цикл
                    Нужно = СтрокаТЧ.Количество;
                    Для Каждого П Из Партии.НайтиСтроки(Новый Структура("Номенклатура", СтрокаТЧ.Номенклатура)) Цикл
                        Если Нужно = 0 Тогда Прервать; КонецЕсли;
                        Если П.Количество = 0 Тогда Продолжить; КонецЕсли;
                        Списать = Мин(Нужно, П.Количество);
                        Сумма = ?(Списать = П.Количество, П.Сумма, Окр(П.Сумма * Списать / П.Количество, 2));
                        С = Списания.Добавить();
                        С.Номенклатура = П.Номенклатура; С.Партия = П.Партия;
                        С.Количество = Списать; С.Сумма = Сумма;
                        П.Количество = П.Количество - Списать;
                        П.Сумма = П.Сумма - Сумма;
                        Нужно = Нужно - Списать;
                    КонецЦикла;
                    Если Нужно > 0 Тогда
                        ОбщегоНазначения.СообщитьПользователю(СтрШаблон("Не хватает %1 шт. товара %2", Нужно, СтрокаТЧ.Номенклатура));
                        Отказ = Истина;
                    КонецЕсли;
                КонецЦикла;
                Возврат Списания;
            КонецФункции

            // Модуль объекта РеализацияТоваров
            Процедура ОбработкаПроведения(Отказ, Режим)
                Движения.ПартииТоваров.Записывать = Истина;
                Движения.ПартииТоваров.Записать();
                Списания = ПартионныйУчет.РассчитатьСписание(Товары.Выгрузить(), Склад, МоментВремени(), Отказ);
                Если Отказ Тогда Возврат; КонецЕсли;
                Для Каждого С Из Списания Цикл
                    Д = Движения.ПартииТоваров.ДобавитьРасход();
                    Д.Период = Дата; Д.Склад = Склад;
                    ЗаполнитьЗначенияСвойств(Д, С);
                КонецЦикла;
            КонецПроцедуры
      - id: 1c-07-02
        title: Оперативное и неоперативное проведение
        minutes: 35
        xp: 50
        theory: |
          Документ можно провести **оперативно** (сейчас, «в реальном времени») или **неоперативно** (задним числом, при перепроведении).

          ## Режимы

          | Режим | Когда | Что проверять |
          |---|---|---|
          | `РежимПроведенияДокумента.Оперативный` | Дата документа — сегодня, проводится сейчас | Остатки на текущий момент, контроль нехватки |
          | `РежимПроведенияДокумента.Неоперативный` | Задним числом или перепроведение | Обычно без жёсткого контроля, остатки на момент документа |

          Включается свойством документа **«Оперативное проведение: Разрешить»**. Тогда при проведении документа с сегодняшней датой платформа выставит ему время «сейчас» и передаст режим `Оперативный` в обработчик:

          ```bsl
          Процедура ОбработкаПроведения(Отказ, Режим)
              Если Режим = РежимПроведенияДокумента.Оперативный Тогда
                  ПроверитьОстатки(Отказ);
              КонецЕсли;
              // формирование движений
          КонецПроцедуры
          ```

          ## Момент времени и граница

          В оперативном режиме остатки берут **без указания момента** (то есть актуальные), в неоперативном — на `Новый Граница(МоментВремени(), ВидГраницы.Исключая)`:

          ```bsl
          Если Режим = РежимПроведенияДокумента.Оперативный Тогда
              Период = Неопределено;
          Иначе
              Период = Новый Граница(МоментВремени(), ВидГраницы.Исключая);
          КонецЕсли;
          Запрос.УстановитьПараметр("Период", Период);
          ```

          `Исключая` — чтобы не учитывать движения самого документа (при перепроведении старые движения ещё могут быть в базе).

          ## Новая методика проведения

          Современный подход: **сначала записать движения, потом проверить остатки**:

          1. Заблокировать данные (управляемая блокировка).
          2. Сформировать и записать движения (`Движения.Записать()`).
          3. Запросом к остаткам найти отрицательные значения → `Отказ = Истина`.

          Плюс — одна проверка вместо сложного расчёта «сколько было», меньше кода и меньше времени блокировки.

          ```bsl
          Движения.ОстаткиТоваров.Записывать = Истина;
          Движения.Записать();
          Запрос.Текст = "ВЫБРАТЬ Ост.Номенклатура, Ост.КоличествоОстаток
          |ИЗ РегистрНакопления.ОстаткиТоваров.Остатки(, Номенклатура В (&Товары)
          |    И Склад = &Склад) КАК Ост
          |ГДЕ Ост.КоличествоОстаток < 0";
          ```

          ## Последовательности и перепроведение

          Если документ задним числом меняет остатки, последующие документы (себестоимость!) становятся неверными. Для этого есть объект **Последовательность** и **восстановление последовательности** — перепроведение документов от границы, а в типовых — закрытие месяца.
        practice:
          - type: choice
            q: В каком режиме проводится документ с сегодняшней датой при разрешённом оперативном проведении?
            options: ["Неоперативный", "Оперативный", "Только запись", "Режим не передаётся"]
            answer: 1
          - type: fill
