              }
            bugLine: 2
            fix: try (Stream<String> lines = Files.lines(p)) { return ...; }
            explain: Stream из Files.lines держит открытый файл и должен быть закрыт.
        homework:
          task: |
            Утилита копирования файла с прогрессом: `copy(Path src, Path dst)` через `InputStream`/`OutputStream` с буфером 8 КБ в try-with-resources, печатает процент каждые 10%. Свой `AutoCloseable` класс `ProgressReporter`, печатающий итог в close(). Продемонстрируйте подавленное исключение: ресурс, у которого и тело, и close бросают исключения.
          checklist:
            - Все потоки закрываются автоматически
            - Подавленное исключение выведено через getSuppressed
            - Буферизированное копирование
          solution: |
            import java.io.*;
            import java.nio.file.*;

            class ProgressReporter implements AutoCloseable {
                private final long total; private long done; private int lastPct = -10;
                ProgressReporter(long total) { this.total = total; }
                void add(long n) {
                    done += n;
                    int pct = total == 0 ? 100 : (int) (done * 100 / total);
                    if (pct >= lastPct + 10) { System.out.println(pct + "%"); lastPct = pct; }
                }
                @Override public void close() { System.out.println("Скопировано " + done + " байт"); }
            }

            public class Copy {
                static void copy(Path src, Path dst) throws IOException {
                    try (InputStream in = Files.newInputStream(src);
                         OutputStream out = Files.newOutputStream(dst);
                         ProgressReporter pr = new ProgressReporter(Files.size(src))) {
                        byte[] buf = new byte[8192];
                        int n;
                        while ((n = in.read(buf)) != -1) { out.write(buf, 0, n); pr.add(n); }
                    }
                }

                public static void main(String[] args) throws IOException {
                    copy(Path.of(args[0]), Path.of(args[1]));
                    class Bad implements AutoCloseable { public void close() { throw new IllegalStateException("close упал"); } }
                    try (Bad b = new Bad()) { throw new RuntimeException("тело упало"); }
                    catch (RuntimeException e) {
                        System.out.println(e.getMessage() + ", suppressed: " + e.getSuppressed()[0].getMessage());
                    }
                }
            }
      - id: java-04-03
        title: Свои исключения
        minutes: 25
        xp: 30
        theory: |
          Свои исключения делают ошибки **осмысленными** для вызывающего кода: можно поймать именно `InsufficientFundsException`, а не разбирать текст сообщения.

          ## Как создать

          ```java
          // бизнес-ошибка — обычно unchecked
          public class InsufficientFundsException extends RuntimeException {
              private final BigDecimal needed;

              public InsufficientFundsException(BigDecimal needed) {
                  super("Недостаточно средств, не хватает " + needed);
                  this.needed = needed;
              }

              public BigDecimal getNeeded() { return needed; }
          }

          // техническая ошибка с причиной
          public class StorageException extends RuntimeException {
              public StorageException(String message, Throwable cause) { super(message, cause); }
          }
          ```

          Добавляйте **данные** (id, суммы, поля), а не только текст — это пригодится для обработки и логов.

          ## Иерархия ошибок приложения

          ```java
          public abstract class AppException extends RuntimeException {
              private final String code;
              protected AppException(String code, String msg) { super(msg); this.code = code; }
              public String getCode() { return code; }
          }
          public class NotFoundException extends AppException {
              public NotFoundException(String entity, Object id) { super("NOT_FOUND", entity + " " + id + " не найден"); }
          }
          public class ConflictException extends AppException {
              public ConflictException(String msg) { super("CONFLICT", msg); }
          }
          public class ValidationException extends AppException {
              private final Map<String, String> errors;
              public ValidationException(Map<String, String> errors) { super("VALIDATION", "Ошибка валидации"); this.errors = Map.copyOf(errors); }
              public Map<String, String> getErrors() { return errors; }
          }
          ```

          В веб-приложении глобальный обработчик (`@RestControllerAdvice` в Spring) сопоставит `NotFoundException → 404`, `ConflictException → 409`, `ValidationException → 400`.

          ## Exception translation

          Нижний слой не должен «протекать» деталями наверх: сервис заказов не должен бросать `SQLException`.

          ```java
          try {
              jdbc.update(...);
          } catch (SQLException e) {
              throw new StorageException("Не удалось сохранить заказ " + order.id(), e);   // cause сохранён
          }
          ```

          ## Советы

          - Имя заканчивается на `Exception` и описывает проблему.
          - Сначала посмотрите стандартные: `IllegalArgumentException` (неверный аргумент), `IllegalStateException` (неверное состояние объекта), `UnsupportedOperationException`, `NoSuchElementException`.
          - Не создавайте исключение на каждый чих — достаточно нескольких осмысленных типов.
          - Для очень частых «ожидаемых» неудач подумайте про `Optional` или Result-объект.
