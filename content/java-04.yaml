        homework:
          task: |
            Утилита «организатор загрузок»: проходит папку (Files.list), раскладывает файлы по подпапкам по расширению (images, docs, archives, other), не перезаписывает существующие (добавляет суффикс `(1)`), пишет журнал перемещений в `organizer.log` и в конце выводит статистику: количество и общий размер по категориям.
          checklist:
            - Используются Path/Files, а не java.io.File
            - Все Stream<Path> закрываются
            - Конфликты имён обрабатываются
          solution: |
            import java.io.IOException;
            import java.nio.file.*;
            import java.util.*;
            import java.util.stream.Stream;

            public class Organizer {
                static final Map<String, String> CATEGORIES = Map.of(
                    "jpg", "images", "png", "images", "gif", "images",
                    "pdf", "docs", "docx", "docs", "txt", "docs",
                    "zip", "archives", "rar", "archives", "7z", "archives");

                static String ext(Path p) {
                    String n = p.getFileName().toString();
                    int i = n.lastIndexOf('.');
                    return i < 0 ? "" : n.substring(i + 1).toLowerCase();
                }
                static Path unique(Path target) {
                    if (!Files.exists(target)) return target;
                    String n = target.getFileName().toString();
                    int dot = n.lastIndexOf('.');
                    String base = dot < 0 ? n : n.substring(0, dot), e = dot < 0 ? "" : n.substring(dot);
                    for (int i = 1; ; i++) {
                        Path c = target.resolveSibling(base + "(" + i + ")" + e);
                        if (!Files.exists(c)) return c;
                    }
                }
                public static void main(String[] args) throws IOException {
                    Path dir = Path.of(args.length > 0 ? args[0] : "Downloads");
                    Map<String, long[]> stats = new TreeMap<>();
                    List<String> log = new ArrayList<>();
                    try (Stream<Path> files = Files.list(dir)) {
                        for (Path f : files.filter(Files::isRegularFile).toList()) {
                            String cat = CATEGORIES.getOrDefault(ext(f), "other");
                            Path dest = dir.resolve(cat);
                            Files.createDirectories(dest);
                            long size = Files.size(f);
                            Path to = unique(dest.resolve(f.getFileName()));
                            Files.move(f, to);
                            log.add(f.getFileName() + " -> " + dir.relativize(to));
                            stats.computeIfAbsent(cat, k -> new long[2]);
                            stats.get(cat)[0]++; stats.get(cat)[1] += size;
                        }
                    }
                    Files.write(dir.resolve("organizer.log"), log, StandardOpenOption.CREATE, StandardOpenOption.APPEND);
                    stats.forEach((c, s) -> System.out.printf("%s: %d файлов, %.1f КБ%n", c, s[0], s[1] / 1024.0));
                }
            }
      - id: java-04-05
        title: Сериализация и JSON (Jackson)
        minutes: 30
        xp: 35
        theory: |
          ## Встроенная сериализация Java — не используйте

          `implements Serializable` + `ObjectOutputStream` превращает объект в байты. Проблемы: небезопасна (десериализация недоверенных данных — путь к удалённому выполнению кода), хрупкая к изменениям классов, нечитаема, только для Java. Сегодня для обмена данными используют **JSON** (или Protobuf/Avro).

          ## Jackson — стандарт де-факто

          ```xml
          <dependency>
            <groupId>com.fasterxml.jackson.core</groupId>
            <artifactId>jackson-databind</artifactId>
            <version>2.17.0</version>
          </dependency>
          ```

          ```java
          ObjectMapper mapper = new ObjectMapper();   // создать один раз и переиспользовать (потокобезопасен)

          public record User(String name, int age, List<String> roles) {}

          String json = mapper.writeValueAsString(new User("Аня", 25, List.of("admin")));
          // {"name":"Аня","age":25,"roles":["admin"]}

          User u = mapper.readValue(json, User.class);

          List<User> users = mapper.readValue(jsonArray, new TypeReference<List<User>>() {});   // generics

          mapper.writerWithDefaultPrettyPrinter().writeValue(Path.of("users.json").toFile(), users);
          ```

          Записи (record) поддерживаются с Jackson 2.12. Для обычных классов нужен конструктор без параметров + сеттеры, либо `@JsonCreator`.

          ## Аннотации

          ```java
          public class Product {
              @JsonProperty("product_id") private long id;
              @JsonIgnore private String internalNote;
              @JsonInclude(JsonInclude.Include.NON_NULL) private String description;
              @JsonFormat(pattern = "yyyy-MM-dd") private LocalDate created;
          }
          ```

          ## Настройка

          ```java
          ObjectMapper mapper = new ObjectMapper()
              .registerModule(new JavaTimeModule())                              // LocalDate, Instant
              .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)           // даты строкой ISO
              .disable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)        // игнорировать лишние поля
              .setPropertyNamingStrategy(PropertyNamingStrategies.SNAKE_CASE);   // firstName → first_name
          ```

          `FAIL_ON_UNKNOWN_PROPERTIES` по умолчанию включён: незнакомое поле в JSON → исключение. Для внешних API обычно выключают.

          ## Дерево JSON

          ```java
          JsonNode root = mapper.readTree(json);
          String city = root.path("address").path("city").asText("неизвестно");   // path — без NPE
          for (JsonNode item : root.get("items")) { ... }
          ```

          Ошибки парсинга — `JsonProcessingException` (наследник `IOException`).

          В Spring Boot Jackson настроен автоматически и используется для `@RestController`. Альтернативы: Gson (Google), JSON-B (Jakarta).
        practice:
          - type: fill
            q: Превратите объект в JSON-строку
            code: |
              String json = mapper.___(order);
            answers: ["writeValueAsString"]
          - type: choice
            q: Почему встроенная Java-сериализация считается опасной?
            options: ["Она медленная", "Десериализация недоверенных данных может привести к выполнению кода", "Не поддерживает строки", "Она устарела в Java 8"]
            answer: 1
          - type: choice
            q: Как прочитать JSON-массив в List<User>?
            options: ["readValue(json, List.class)", "readValue(json, new TypeReference<List<User>>() {})", "readValue(json, User[].class) — единственный способ", "Нельзя"]
            answer: 1
          - type: fill
