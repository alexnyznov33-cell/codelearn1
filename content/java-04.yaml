            answer: 1
        homework:
          task: |
            Для интернет-магазина создайте иерархию `ShopException` (с кодом ошибки): `ProductNotFoundException(productId)`, `OutOfStockException(productId, requested, available)`, `PaymentFailedException(orderId, cause)`. Сервис `OrderService.place(...)` бросает их; «контроллер» ловит базовый тип и печатает JSON-подобный ответ `{code, message, details}` и HTTP-статус по типу.
          checklist:
            - Исключения несут данные
            - Сохраняется cause
            - Один обработчик для всей иерархии
          solution: |
            import java.util.*;

            abstract class ShopException extends RuntimeException {
                private final String code;
                ShopException(String code, String msg, Throwable cause) { super(msg, cause); this.code = code; }
                String code() { return code; }
                abstract int status();
                Map<String, Object> details() { return Map.of(); }
            }
            class ProductNotFoundException extends ShopException {
                final long productId;
                ProductNotFoundException(long id) { super("PRODUCT_NOT_FOUND", "Товар " + id + " не найден", null); productId = id; }
                int status() { return 404; }
                Map<String, Object> details() { return Map.of("productId", productId); }
            }
            class OutOfStockException extends ShopException {
                final long productId; final int requested, available;
                OutOfStockException(long id, int req, int av) {
                    super("OUT_OF_STOCK", "Недостаточно товара " + id, null); productId = id; requested = req; available = av;
                }
                int status() { return 409; }
                Map<String, Object> details() { return Map.of("productId", productId, "requested", requested, "available", available); }
            }
            class PaymentFailedException extends ShopException {
                PaymentFailedException(long orderId, Throwable cause) { super("PAYMENT_FAILED", "Оплата заказа " + orderId + " не прошла", cause); }
                int status() { return 402; }
            }

            public class Controller {
                static void handle(Runnable action) {
                    try { action.run(); System.out.println("200 OK"); }
                    catch (ShopException e) {
                        System.out.printf("%d {code: %s, message: %s, details: %s}%n", e.status(), e.code(), e.getMessage(), e.details());
                    }
                }
                public static void main(String[] args) {
                    handle(() -> { throw new OutOfStockException(7, 5, 2); });
                    handle(() -> { throw new PaymentFailedException(42, new java.net.SocketTimeoutException("bank")); });
                }
            }
      - id: java-04-04
        title: Файлы java.nio.file
        minutes: 30
        xp: 35
        theory: |
          Современный API для файлов — `java.nio.file` (`Path`, `Files`). Старый `java.io.File` — для легаси.

          ## Path

          ```java
          Path p = Path.of("data", "users", "list.csv");   // правильный разделитель для ОС
          p.getFileName();      // list.csv
          p.getParent();        // data/users
          p.toAbsolutePath();
          p.resolve("x.txt");   // data/users/list.csv/x.txt
          p.getParent().resolveSibling("archive");
          Path.of("a/b/../c").normalize();   // a/c
          ```

          ## Чтение и запись (небольшие файлы)

          ```java
          String text = Files.readString(p);                        // UTF-8 по умолчанию
          List<String> lines = Files.readAllLines(p);
          byte[] bytes = Files.readAllBytes(p);

          Files.writeString(p, "привет\n");                          // перезапишет
          Files.writeString(p, "ещё\n", StandardOpenOption.APPEND, StandardOpenOption.CREATE);
          Files.write(p, List.of("a", "b"));
          ```

          ## Большие файлы — потоково

          ```java
          try (Stream<String> lines = Files.lines(p)) {
              long errors = lines.filter(l -> l.contains("ERROR")).count();
          }

          try (BufferedReader r = Files.newBufferedReader(p);
               BufferedWriter w = Files.newBufferedWriter(out)) {
              String line;
              while ((line = r.readLine()) != null) w.write(line.toUpperCase() + "\n");
          }
          ```

          ## Операции с файлами и папками

          ```java
          Files.exists(p); Files.isDirectory(p); Files.size(p);
          Files.createDirectories(Path.of("out/reports"));      // вся цепочка
          Files.copy(src, dst, StandardCopyOption.REPLACE_EXISTING);
          Files.move(src, dst, StandardCopyOption.ATOMIC_MOVE);
          Files.delete(p);              // NoSuchFileException, если нет
          Files.deleteIfExists(p);
          Path tmp = Files.createTempFile("app", ".tmp");
          Files.getLastModifiedTime(p);
          ```

          ## Обход каталогов

          ```java
          try (Stream<Path> s = Files.list(dir)) { s.forEach(System.out::println); }   // один уровень

          try (Stream<Path> s = Files.walk(dir)) {                                      // рекурсивно
              List<Path> javaFiles = s.filter(f -> f.toString().endsWith(".java")).toList();
          }

          try (Stream<Path> s = Files.find(dir, 10, (path, attrs) -> attrs.size() > 1_000_000)) { ... }
          ```

          ## Кодировки

          `Files.readString(p, Charset.forName("windows-1251"))` — для старых файлов. Явно указывайте кодировку, если файл не UTF-8.

          ## Атомарная запись

          Пишите во временный файл и делайте `Files.move(tmp, target, ATOMIC_MOVE)` — тогда при сбое не останется «полуфайла».
