            options: ["Оно проигнорируется", "UnrecognizedPropertyException", "Создастся новое поле", "Значение станет null"]
            answer: 1
        homework:
          task: |
            Сделайте «трекер расходов» с хранением в JSON: `record Expense(LocalDate date, String category, BigDecimal amount, String note)`. Команды: add, list за месяц, report (сумма по категориям), export в CSV. Данные — в `expenses.json` (pretty print, даты в ISO). Один настроенный ObjectMapper. Повреждённый файл не должен ронять программу — переименуйте его в `.bak` и начните с пустого списка.
          checklist:
            - JavaTimeModule подключён
            - TypeReference для списка
            - Обработан JsonProcessingException
          solution: |
            import com.fasterxml.jackson.core.JsonProcessingException;
            import com.fasterxml.jackson.core.type.TypeReference;
            import com.fasterxml.jackson.databind.*;
            import com.fasterxml.jackson.datatype.jsr310.JavaTimeModule;
            import java.io.IOException;
            import java.math.BigDecimal;
            import java.nio.file.*;
            import java.time.*;
            import java.util.*;
            import java.util.stream.Collectors;

            record Expense(LocalDate date, String category, BigDecimal amount, String note) {}

            public class Expenses {
                static final ObjectMapper M = new ObjectMapper()
                    .registerModule(new JavaTimeModule())
                    .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)
                    .disable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)
                    .enable(SerializationFeature.INDENT_OUTPUT);
                static final Path FILE = Path.of("expenses.json");

                static List<Expense> load() throws IOException {
                    if (!Files.exists(FILE)) return new ArrayList<>();
                    try { return new ArrayList<>(M.readValue(FILE.toFile(), new TypeReference<List<Expense>>() {})); }
                    catch (JsonProcessingException e) {
                        Files.move(FILE, FILE.resolveSibling("expenses.json.bak"), StandardCopyOption.REPLACE_EXISTING);
                        System.out.println("Файл повреждён, сохранён в .bak");
                        return new ArrayList<>();
                    }
                }
                static void save(List<Expense> l) throws IOException { M.writeValue(FILE.toFile(), l); }

                public static void main(String[] args) throws IOException {
                    List<Expense> list = load();
                    list.add(new Expense(LocalDate.now(), "еда", new BigDecimal("450.50"), "обед"));
                    save(list);
                    YearMonth ym = YearMonth.now();
                    Map<String, BigDecimal> report = list.stream()
                        .filter(e -> YearMonth.from(e.date()).equals(ym))
                        .collect(Collectors.groupingBy(Expense::category, TreeMap::new,
                                 Collectors.reducing(BigDecimal.ZERO, Expense::amount, BigDecimal::add)));
                    System.out.println(report);
                    List<String> csv = new ArrayList<>(List.of("date;category;amount;note"));
                    list.forEach(e -> csv.add(e.date() + ";" + e.category() + ";" + e.amount() + ";" + e.note()));
                    Files.write(Path.of("expenses.csv"), csv);
                }
            }
