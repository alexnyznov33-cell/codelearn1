id: java
modules:
  - id: java-m4
    title: Исключения и I/O
    level: Junior+
    lessons:
      - id: java-04-01
        title: Checked и unchecked исключения
        minutes: 30
        xp: 35
        theory: |
          ## Иерархия

          ```
          Throwable
          ├── Error                  — сбои JVM (OutOfMemoryError, StackOverflowError) — не ловить
          └── Exception              — checked: IOException, SQLException, InterruptedException
              └── RuntimeException   — unchecked: NullPointerException, IllegalArgumentException,
                                       IllegalStateException, IndexOutOfBoundsException, ArithmeticException
          ```

          **Checked** исключения компилятор заставляет обработать: поймать `catch` или объявить `throws`. **Unchecked** (`RuntimeException` и наследники) — не обязательно.

          ```java
          public String readFirstLine(Path p) throws IOException {     // объявляем checked
              return Files.readAllLines(p).get(0);
          }

          try {
              String line = readFirstLine(Path.of("config.txt"));
              int port = Integer.parseInt(line);                         // NumberFormatException (unchecked)
          } catch (NoSuchFileException e) {                              // конкретное — раньше
              System.out.println("Нет файла: " + e.getFile());
          } catch (IOException e) {
              System.out.println("Ошибка чтения: " + e.getMessage());
          } catch (NumberFormatException | IndexOutOfBoundsException e) {  // multi-catch
              System.out.println("Неверный формат");
          } finally {
              System.out.println("выполнится всегда");
          }
          ```

          ## Когда что

          - **Unchecked** — ошибки программиста и нарушение контракта (null, неверный аргумент, неверное состояние). Исправляются кодом.
          - **Checked** — ожидаемые внешние сбои, от которых вызывающий может восстановиться (нет файла, сеть).
          - Современные фреймворки (Spring) и большинство новых API предпочитают unchecked; лямбды и Stream API с checked работают неудобно.

          ## Правила хорошего тона

          ```java
          // ❌ проглатывание
          try { ... } catch (Exception e) { }
          // ❌ потеря причины
          catch (SQLException e) { throw new RuntimeException("Ошибка"); }
          // ✅ оборачивание с cause
          catch (SQLException e) { throw new DataAccessException("Не удалось сохранить заказ " + id, e); }
          ```

          - Ловите максимально конкретный тип там, где можете что-то сделать.
          - Не используйте исключения для обычного управления потоком.
          - Проверки аргументов в начале метода: `Objects.requireNonNull(x, "x")`, `if (age < 0) throw new IllegalArgumentException(...)`.
          - `InterruptedException`: либо пробросить, либо восстановить флаг `Thread.currentThread().interrupt()`.
          - `e.printStackTrace()` — только в учебных примерах; в проде логгер: `log.error("...", e)`.

          ## finally и return

          `finally` выполняется даже после `return` в `try`. Не делайте `return` в `finally` — это «съест» исключение.
        practice:
