        homework:
          task: |
            Напишите метод `Config load(Path file)`, читающий `key=value` строки: отсутствие файла → своё checked-исключение `ConfigNotFoundException` (с путём), неверная строка → unchecked `ConfigFormatException` с номером строки, обязательный ключ `port` должен быть числом 1–65535. В main обработайте каждый тип по-разному, сохраняя причину (cause).
          checklist:
            - Причина исключения не теряется
            - Порядок catch от частного к общему
            - Нет пустых catch
          solution: |
            import java.io.IOException;
            import java.nio.file.*;
            import java.util.*;

            class ConfigNotFoundException extends Exception {
                ConfigNotFoundException(Path p, Throwable cause) { super("Нет конфига: " + p, cause); }
            }
            class ConfigFormatException extends RuntimeException {
                ConfigFormatException(int line, String msg) { super("Строка " + line + ": " + msg); }
            }
            record Config(Map<String, String> values) {
                int port() { return Integer.parseInt(values.get("port")); }
            }

            public class Loader {
                static Config load(Path file) throws ConfigNotFoundException, IOException {
                    List<String> lines;
                    try { lines = Files.readAllLines(file); }
                    catch (NoSuchFileException e) { throw new ConfigNotFoundException(file, e); }
                    Map<String, String> m = new HashMap<>();
                    for (int i = 0; i < lines.size(); i++) {
                        String l = lines.get(i).strip();
                        if (l.isEmpty() || l.startsWith("#")) continue;
                        int eq = l.indexOf('=');
                        if (eq <= 0) throw new ConfigFormatException(i + 1, "ожидается key=value");
                        m.put(l.substring(0, eq).strip(), l.substring(eq + 1).strip());
                    }
                    try {
                        int port = Integer.parseInt(m.getOrDefault("port", ""));
                        if (port < 1 || port > 65535) throw new ConfigFormatException(0, "port вне диапазона");
                    } catch (NumberFormatException e) { throw new ConfigFormatException(0, "port не число"); }
                    return new Config(m);
                }

                public static void main(String[] args) {
                    try { System.out.println(load(Path.of("app.conf")).port()); }
                    catch (ConfigNotFoundException e) { System.out.println(e.getMessage() + " (" + e.getCause().getClass().getSimpleName() + ")"); }
                    catch (ConfigFormatException e) { System.out.println("Формат: " + e.getMessage()); }
                    catch (IOException e) { System.out.println("I/O: " + e.getMessage()); }
                }
            }
      - id: java-04-02
        title: try-with-resources
        minutes: 20
        xp: 25
        theory: |
          Ресурсы (файлы, сокеты, соединения с БД) нужно закрывать, иначе утечка дескрипторов и соединений. Ручной `finally` громоздкий и ошибкоопасный:

          ```java
          BufferedReader r = null;
          try {
              r = new BufferedReader(new FileReader("a.txt"));
              return r.readLine();
          } finally {
              if (r != null) r.close();       // и close() тоже может бросить IOException...
          }
          ```

          ## try-with-resources (Java 7)

          ```java
          try (BufferedReader r = Files.newBufferedReader(Path.of("a.txt"))) {
              return r.readLine();
          }   // r.close() вызовется автоматически, даже при исключении
          ```

          Несколько ресурсов закрываются в **обратном** порядке:

          ```java
          try (Connection c = dataSource.getConnection();
               PreparedStatement ps = c.prepareStatement("SELECT ...");
               ResultSet rs = ps.executeQuery()) {
              while (rs.next()) { ... }
          }   // rs → ps → c
          ```

          Java 9: можно использовать уже объявленную effectively final переменную: `try (reader) { ... }`.

          ## AutoCloseable

          Ресурс — любой объект, реализующий `AutoCloseable` (или `Closeable`):

          ```java
          public class Timer implements AutoCloseable {
              private final long start = System.nanoTime();
              private final String name;
              public Timer(String name) { this.name = name; }
              @Override public void close() {
                  System.out.printf("%s: %d мс%n", name, (System.nanoTime() - start) / 1_000_000);
              }
          }

          try (var t = new Timer("загрузка")) {
              loadData();
          }
          ```

          ## Подавленные исключения

          Если упало и тело `try`, и `close()`, главным останется исключение из тела, а исключение из `close()` будет **подавленным** — доступно через `e.getSuppressed()`. Ничего не теряется (в отличие от ручного finally).

          ## Правила

          - Всё, что `AutoCloseable` и создано вами, — в try-with-resources.
          - Исключение — объекты, временем жизни которых управляет фреймворк (Spring закрывает бины, пул соединений управляет соединениями — но `Connection` из пула всё равно закрывайте, это возвращает его в пул).
          - `Stream<Path>` из `Files.lines`/`Files.list`/`Files.walk` тоже нужно закрывать!
        practice:
          - type: output
            q: Что выведет код?
            code: |
              class R implements AutoCloseable {
                  String n; R(String n) { this.n = n; System.out.print("+" + n); }
                  public void close() { System.out.print("-" + n); }
              }
              try (R a = new R("a"); R b = new R("b")) {
                  System.out.print("!");
              }
            answer: +a+b!-b-a
          - type: choice
