        homework:
          task: |
            Реализуйте producer–consumer: 2 потока-производителя генерируют по 500 «заказов» (record Order(int id, int sum)) в `ArrayBlockingQueue` ёмкостью 50; 3 потребителя забирают заказы, накапливают выручку в `LongAdder` и количество по сумме-диапазону в `ConcurrentHashMap<String, Integer>` («до 1000», «1000+»). Завершение потребителей — через «ядовитую пилюлю» (специальный заказ id = -1). Используйте `CountDownLatch`, чтобы main дождался всех потребителей.
          checklist:
            - Используется BlockingQueue put/take
            - Статистика собирается атомарно (merge/LongAdder)
            - Потребители корректно завершаются
          solution: |
            import java.util.concurrent.*;
            import java.util.concurrent.atomic.LongAdder;

            public class Orders {
                record Order(int id, int sum) {}
                static final Order POISON = new Order(-1, 0);

                public static void main(String[] args) throws InterruptedException {
                    BlockingQueue<Order> q = new ArrayBlockingQueue<>(50);
                    LongAdder revenue = new LongAdder();
                    ConcurrentHashMap<String, Integer> buckets = new ConcurrentHashMap<>();
                    int consumers = 3;
                    CountDownLatch done = new CountDownLatch(consumers);

                    Runnable producer = () -> {
                        var r = ThreadLocalRandom.current();
                        try { for (int i = 0; i < 500; i++) q.put(new Order(i, r.nextInt(2000))); }
                        catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                    };
                    Runnable consumer = () -> {
                        try {
                            while (true) {
                                Order o = q.take();
                                if (o == POISON) break;
                                revenue.add(o.sum());
                                buckets.merge(o.sum() < 1000 ? "до 1000" : "1000+", 1, Integer::sum);
                            }
                        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                        finally { done.countDown(); }
                    };
                    for (int i = 0; i < consumers; i++) new Thread(consumer).start();
                    Thread p1 = new Thread(producer), p2 = new Thread(producer);
                    p1.start(); p2.start(); p1.join(); p2.join();
                    for (int i = 0; i < consumers; i++) q.put(POISON);
                    done.await();
                    System.out.println("Выручка: " + revenue.sum() + ", " + buckets);
                }
            }
      - id: java-06-06
        title: Виртуальные потоки Java 21
        minutes: 35
        xp: 50
        theory: |
          Платформенный поток = поток ОС: ~1 МБ стека, тысячи — уже тяжело. **Виртуальные потоки** (Project Loom, Java 21) — лёгкие потоки, которыми управляет JVM. Их можно создавать **миллионами**.

          ```java
          Thread vt = Thread.ofVirtual().name("v-1").start(() -> System.out.println("hi"));
          Thread.startVirtualThread(() -> work());

          try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {
              for (int i = 0; i < 100_000; i++) {
                  int id = i;
                  exec.submit(() -> {
                      Thread.sleep(1000);   // блокировка «дешёвая»
                      return id;
                  });
              }
          } // ~1 секунда на 100 000 задач
          ```

          ## Как это работает

          Виртуальный поток выполняется на **потоке-носителе** (carrier) из небольшого ForkJoinPool. Когда он блокируется на I/O, `sleep`, `BlockingQueue` и т.п., JVM **снимает** его с носителя (unmount), освобождая ядро для других. Пишем простой блокирующий код — получаем масштабируемость асинхронного.

          ## Когда полезно

          - ✅ Много **I/O-задач**: HTTP-запросы, БД, файлы — «поток на запрос».
          - ❌ CPU-интенсивные вычисления — быстрее не станут, ядер столько же.

          ## Правила

          1. **Не объединяйте в пулы** — создавайте новый поток на каждую задачу.
          2. Ограничивайте доступ к ресурсам через `Semaphore`, а не размером пула.
          3. **Pinning**: в Java 21 блокировка внутри `synchronized` «прибивает» виртуальный поток к носителю. Для долгих операций в критической секции используйте `ReentrantLock` (в Java 24 проблема в основном устранена).
          4. Осторожно с `ThreadLocal` — миллион потоков = миллион копий. Альтернатива — `ScopedValue` (preview).

          ## Spring Boot

          В Spring Boot 3.2+ достаточно настройки:

          ```properties
          spring.threads.virtual.enabled=true
          ```

          и Tomcat станет обрабатывать каждый запрос в виртуальном потоке.
