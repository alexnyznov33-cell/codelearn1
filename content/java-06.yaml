        homework:
          task: |
            Сравните производительность: 10 000 задач, каждая «ходит в сеть» (`Thread.sleep(200)`) и возвращает число. Выполните (1) на `newFixedThreadPool(100)`, (2) на `newVirtualThreadPerTaskExecutor()`. Замерьте время. Затем ограничьте виртуальную версию семафором на 500 одновременных «запросов» и снова замерьте.
          checklist:
            - Оба варианта дают одинаковую сумму результатов
            - Виртуальные потоки заметно быстрее (≈0.2 с против ≈20 с)
            - Ограничение сделано через Semaphore
          solution: |
            import java.util.*;
            import java.util.concurrent.*;

            public class VirtualBench {
                static Semaphore limit = new Semaphore(500);
                static int call(int i, boolean limited) throws InterruptedException {
                    if (limited) limit.acquire();
                    try { Thread.sleep(200); return i; }
                    finally { if (limited) limit.release(); }
                }
                static long run(ExecutorService exec, boolean limited) throws Exception {
                    long t0 = System.currentTimeMillis(), sum = 0;
                    try (exec) {
                        List<Future<Integer>> fs = new ArrayList<>();
                        for (int i = 0; i < 10_000; i++) { int id = i; fs.add(exec.submit(() -> call(id, limited))); }
                        for (var f : fs) sum += f.get();
                    }
                    System.out.println("сумма " + sum);
                    return System.currentTimeMillis() - t0;
                }
                public static void main(String[] args) throws Exception {
                    System.out.println("fixed(100): " + run(Executors.newFixedThreadPool(100), false) + " мс");
                    System.out.println("virtual: " + run(Executors.newVirtualThreadPerTaskExecutor(), false) + " мс");
                    System.out.println("virtual+semaphore: " + run(Executors.newVirtualThreadPerTaskExecutor(), true) + " мс");
                }
            }
