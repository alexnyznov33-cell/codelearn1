        homework:
          task: |
            Сервис расчёта доставки: Strategy (`IDeliveryStrategy`: курьер, почта, самовывоз, СДЭК через Adapter к «чужому» классу `CdekClient` с другой сигнатурой), Factory по коду способа, Decorator для логирования времени расчёта и кеширования. Подключите всё через DI. Напишите тесты на фабрику и декоратор.
          checklist:
            - Новый способ доставки добавляется без изменения существующих классов (кроме регистрации)
            - Adapter не меняет CdekClient
            - Декоратор оборачивает любую стратегию
          solution: |
            public interface IDeliveryStrategy { string Code { get; } decimal Calc(Parcel p); }

            public class CourierDelivery : IDeliveryStrategy { public string Code => "courier"; public decimal Calc(Parcel p) => 300 + p.Kg * 50; }
            public class PickupDelivery : IDeliveryStrategy { public string Code => "pickup"; public decimal Calc(Parcel p) => 0; }

            // чужой класс
            public class CdekClient { public double GetTariff(int grams, string city) => grams / 1000.0 * 120; }
            public class CdekAdapter(CdekClient c) : IDeliveryStrategy
            {
                public string Code => "cdek";
                public decimal Calc(Parcel p) => (decimal)c.GetTariff((int)(p.Kg * 1000), p.City);
            }

            public class LoggingDelivery(IDeliveryStrategy inner, ILogger<LoggingDelivery> log) : IDeliveryStrategy
            {
                public string Code => inner.Code;
                public decimal Calc(Parcel p)
                {
                    var sw = Stopwatch.StartNew();
                    var r = inner.Calc(p);
                    log.LogInformation("{Code}: {Cost} за {Ms} мс", Code, r, sw.ElapsedMilliseconds);
                    return r;
                }
            }

            public class DeliveryFactory(IEnumerable<IDeliveryStrategy> all)
            {
                private readonly Dictionary<string, IDeliveryStrategy> map = all.ToDictionary(s => s.Code);
                public IDeliveryStrategy Get(string code) =>
                    map.TryGetValue(code, out var s) ? s : throw new NotSupportedException(code);
            }
      - id: cs-10-05
        title: Логирование Serilog
        minutes: 25
        xp: 35
        theory: |
          Логи — главный источник информации о том, что происходит в проде. В .NET есть абстракция `ILogger<T>`, а **Serilog** — популярная реализация со структурированным логированием.

          ## Структурированные логи

          ```csharp
          // ❌ интерполяция: в лог попадает просто строка
          log.LogInformation($"Заказ {orderId} оплачен на {sum}");
          // ✅ шаблон: OrderId и Sum сохраняются как отдельные поля — по ним можно искать и строить графики
          log.LogInformation("Заказ {OrderId} оплачен на {Sum}", orderId, sum);
          ```

          ## Уровни

          `Trace` → `Debug` → `Information` → `Warning` → `Error` → `Critical`. В проде обычно Information и выше; для библиотек Microsoft — Warning.

          ```csharp
          try { ... }
          catch (Exception ex)
          {
              log.LogError(ex, "Не удалось списать оплату для {UserId}", userId);  // исключение — первым параметром
          }
          ```

          ## Подключение Serilog

          ```bash
          dotnet add package Serilog.AspNetCore
          dotnet add package Serilog.Sinks.Seq
          ```

          ```csharp
          builder.Host.UseSerilog((ctx, cfg) => cfg
              .ReadFrom.Configuration(ctx.Configuration)
              .Enrich.FromLogContext()
              .Enrich.WithProperty("App", "Shop.Api")
              .WriteTo.Console()
              .WriteTo.File("logs/app-.log", rollingInterval: RollingInterval.Day)
              .WriteTo.Seq("http://localhost:5341"));

          app.UseSerilogRequestLogging();   // одна строка на запрос вместо множества
          ```

          ```json
          "Serilog": {
            "MinimumLevel": { "Default": "Information", "Override": { "Microsoft.AspNetCore": "Warning" } }
          }
          ```

          **Sinks** (куда писать): Console, File, Seq, Elasticsearch, Grafana Loki, Application Insights.

          ## Контекст

          ```csharp
          using (log.BeginScope(new Dictionary<string, object> { ["OrderId"] = id }))
          {
              // все логи внутри получат OrderId
          }
          using (LogContext.PushProperty("UserId", userId)) { ... }   // Serilog
          ```

          Добавляйте **CorrelationId/TraceId** — чтобы связать все логи одного запроса через несколько сервисов. Это часть **observability** вместе с метриками и трассировкой (OpenTelemetry).

          ## Правила

          - Никогда не логируйте пароли, токены, номера карт, персональные данные.
          - Высокочастотные логи — через `[LoggerMessage]` source generator (без аллокаций).
          - Лог должен отвечать на вопрос «что случилось и с какими данными», а не «я тут был».
        practice:
          - type: choice
            q: Какой вызов правильный для структурированного логирования?
            options: ['log.LogInformation($"User {id}")', 'log.LogInformation("User {UserId}", id)', 'log.LogInformation("User " + id)', 'Console.WriteLine(id)']
            answer: 1
          - type: fill
            q: Залогируйте исключение
            code: |
              log.LogError(___, "Ошибка импорта файла {File}", path);
            answers: ["ex"]
          - type: choice
            q: Какой уровень для ситуации «API платёжки ответило медленно, но запрос прошёл»?
            options: ["Trace", "Information", "Warning", "Critical"]
            answer: 2
          - type: choice
            q: Что нельзя писать в логи?
            options: ["Id заказа", "Время выполнения", "Пароли и токены", "Код ответа"]
            answer: 2
          - type: fill
            q: Добавьте одну строку лога на каждый HTTP-запрос
            code: |
              app.___();
            answers: ["UseSerilogRequestLogging"]
        homework:
          task: |
            Подключите Serilog к своему Web API: Console + File (ротация по дням) + Seq (запустите в Docker: `docker run -e ACCEPT_EULA=Y -p 5341:80 datalust/seq`). Конфигурация из appsettings, переопределение уровня для Microsoft, request logging, enrichment CorrelationId из middleware. В Seq найдите все запросы одного пользователя и все ошибки за час.
          checklist:
            - Логи структурированные (нет интерполяции)
            - Секреты не попадают в лог
            - Поиск в Seq по свойству работает
          solution: |
            builder.Host.UseSerilog((ctx, cfg) => cfg
                .ReadFrom.Configuration(ctx.Configuration)
                .Enrich.FromLogContext()
                .WriteTo.Console(outputTemplate: "[{Timestamp:HH:mm:ss} {Level:u3}] {CorrelationId} {Message:lj}{NewLine}{Exception}")
                .WriteTo.File("logs/api-.log", rollingInterval: RollingInterval.Day, retainedFileCountLimit: 14)
                .WriteTo.Seq(ctx.Configuration["Seq:Url"] ?? "http://localhost:5341"));

            app.Use(async (ctx, next) =>
            {
                var cid = ctx.Request.Headers["X-Correlation-Id"].FirstOrDefault() ?? Guid.NewGuid().ToString("N");
                using (LogContext.PushProperty("CorrelationId", cid))
                using (LogContext.PushProperty("UserId", ctx.User.Identity?.Name ?? "anon"))
                    await next(ctx);
            });
            app.UseSerilogRequestLogging();

            // Seq: UserId = 'anya'   |   @Level = 'Error' and @Timestamp > Now() - 1h
