            answer: 1
        homework:
          task: |
            Сервис `SubscriptionService(IUserRepo, IPaymentGateway, IEmailSender, TimeProvider)` с методом `RenewAsync(userId)`: если подписка истекла — списать оплату, продлить на 30 дней, отправить письмо; при ошибке оплаты — письмо о проблеме и без продления; если подписка активна — ничего не делать. Покройте тестами с Moq все ветки, используйте FakeTimeProvider.
          checklist:
            - 3+ теста на разные ветки
            - Используются Verify с Times
            - Время не берётся из DateTime.Now
          solution: |
            public class SubscriptionService(IUserRepo users, IPaymentGateway pay, IEmailSender mail, TimeProvider time)
            {
                public async Task RenewAsync(int id)
                {
                    var u = await users.GetAsync(id);
                    var now = time.GetUtcNow();
                    if (u.PaidUntil > now) return;
                    if (!await pay.ChargeAsync(u.Id, 299))
                    {
                        await mail.SendAsync(u.Email, "Проблема с оплатой");
                        return;
                    }
                    u.PaidUntil = now.AddDays(30);
                    await users.SaveAsync(u);
                    await mail.SendAsync(u.Email, "Подписка продлена");
                }
            }

            public class SubscriptionTests
            {
                Mock<IUserRepo> users = new(); Mock<IPaymentGateway> pay = new(); Mock<IEmailSender> mail = new();
                FakeTimeProvider time = new(new DateTimeOffset(2024, 6, 1, 0, 0, 0, TimeSpan.Zero));
                SubscriptionService Sut() => new(users.Object, pay.Object, mail.Object, time);

                [Fact]
                public async Task Renew_Expired_ChargesAndExtends()
                {
                    var u = new User { Id = 1, Email = "a@b", PaidUntil = time.GetUtcNow().AddDays(-1) };
                    users.Setup(x => x.GetAsync(1)).ReturnsAsync(u);
                    pay.Setup(x => x.ChargeAsync(1, 299)).ReturnsAsync(true);
                    await Sut().RenewAsync(1);
                    Assert.Equal(time.GetUtcNow().AddDays(30), u.PaidUntil);
                    users.Verify(x => x.SaveAsync(u), Times.Once);
                }

                [Fact]
                public async Task Renew_PaymentFails_NoSave()
                {
                    users.Setup(x => x.GetAsync(1)).ReturnsAsync(new User { Id = 1, PaidUntil = DateTimeOffset.MinValue });
                    pay.Setup(x => x.ChargeAsync(1, 299)).ReturnsAsync(false);
                    await Sut().RenewAsync(1);
                    users.Verify(x => x.SaveAsync(It.IsAny<User>()), Times.Never);
                    mail.Verify(x => x.SendAsync(It.IsAny<string>(), "Проблема с оплатой"), Times.Once);
                }

                [Fact]
                public async Task Renew_Active_DoesNothing()
                {
                    users.Setup(x => x.GetAsync(1)).ReturnsAsync(new User { PaidUntil = time.GetUtcNow().AddDays(5) });
                    await Sut().RenewAsync(1);
                    pay.VerifyNoOtherCalls();
                }
            }
      - id: cs-10-03
        title: SOLID и чистая архитектура
        minutes: 35
        xp: 45
        theory: |
          ## SOLID

          **S — Single Responsibility.** У класса одна причина для изменения. `ReportService`, который и считает, и форматирует PDF, и шлёт почту, — три класса.

          **O — Open/Closed.** Открыт для расширения, закрыт для изменения. Новый способ оплаты — новый класс `IPaymentMethod`, а не новый `case` в огромном `switch`.

          **L — Liskov Substitution.** Наследник должен работать везде, где работает базовый тип. Классический анти-пример: `Square : Rectangle`, ломающий `SetWidth`. Если наследник бросает `NotSupportedException` на методе базы — нарушение.

          **I — Interface Segregation.** Много маленьких интерфейсов лучше одного «толстого». `IReadRepository` и `IWriteRepository` вместо `IRepository` на 30 методов.

          **D — Dependency Inversion.** Высокоуровневые модули зависят от абстракций, а не от деталей. `OrderService` зависит от `IOrderRepository`, а реализация на EF живёт в другом слое.

          ```csharp
          // OCP + DIP
          public interface IDiscountRule { decimal Apply(Order o); }
          public class VipRule : IDiscountRule { ... }
          public class BlackFridayRule : IDiscountRule { ... }
          public class PriceCalculator(IEnumerable<IDiscountRule> rules)
          {
              public decimal Total(Order o) => o.Sum - rules.Sum(r => r.Apply(o));
          }
          ```

          ## Чистая (луковая) архитектура

          ```
          ┌──────────────── Api / Web (контроллеры, DI, middleware) ─────────┐
          │  ┌──────────── Infrastructure (EF Core, email, HTTP-клиенты) ──┐ │
          │  │  ┌──────── Application (use cases, DTO, интерфейсы) ─────┐ │ │
          │  │  │  ┌──── Domain (сущности, value objects, правила) ──┐  │ │ │
          ```

          **Правило зависимостей**: стрелки только внутрь. Domain ни от чего не зависит (никакого EF, ASP.NET). Application определяет интерфейсы (`IOrderRepository`, `IEmailSender`), Infrastructure их реализует, Api всё связывает через DI.

          ```
          src/
            Shop.Domain/          Order.cs, Money.cs, OrderStatus.cs
            Shop.Application/     Orders/PlaceOrder/PlaceOrderHandler.cs, Abstractions/IOrderRepository.cs
            Shop.Infrastructure/  Persistence/ShopDbContext.cs, Persistence/OrderRepository.cs
            Shop.Api/             Program.cs, Endpoints/OrderEndpoints.cs
          tests/
            Shop.Domain.Tests/  Shop.Application.Tests/  Shop.Api.IntegrationTests/
          ```

          ## Богатая доменная модель

          ```csharp
          public class Order
          {
              private readonly List<OrderLine> lines = [];
              public IReadOnlyList<OrderLine> Lines => lines;
              public OrderStatus Status { get; private set; }

              public void AddLine(Product p, int qty)
              {
                  if (Status != OrderStatus.Draft) throw new DomainException("Заказ уже оформлен");
                  if (qty <= 0) throw new DomainException("Количество > 0");
                  lines.Add(new OrderLine(p.Id, p.Price, qty));
              }
          }
          ```

          Инварианты защищены внутри сущности, а не размазаны по сервисам.

          ## Не переусердствуйте

          Для CRUD-сервиса на 5 таблиц достаточно простой структуры или **Vertical Slice** (папка на фичу). Архитектура — инструмент против сложности, а не самоцель. Также помните **KISS**, **DRY**, **YAGNI**.
        practice:
          - type: choice
            q: Класс `UserService` регистрирует пользователей, генерирует PDF-отчёты и шлёт SMS. Какой принцип нарушен?
            options: ["Single Responsibility", "Liskov Substitution", "Interface Segregation", "Никакой"]
            answer: 0
          - type: choice
            q: Наследник переопределяет метод и бросает NotSupportedException. Что нарушено?
            options: ["SRP", "OCP", "LSP", "DIP"]
            answer: 2
          - type: choice
            q: От чего может зависеть слой Domain в чистой архитектуре?
            options: ["От EF Core", "От ASP.NET Core", "Ни от каких других слоёв проекта", "От Infrastructure"]
            answer: 2
          - type: choice
            q: Где объявлять интерфейс IOrderRepository в чистой архитектуре?
            options: ["В Infrastructure", "В Application (или Domain)", "В Api", "В тестах"]
            answer: 1
          - type: bug
            q: Какая строка нарушает Open/Closed (при добавлении нового способа доставки придётся менять класс)?
            code: |
              public decimal Cost(Order o, string type)
              {
                  return type switch
                  {
                      "courier" => 300, "post" => 200, "pickup" => 0,
                      _ => throw new ArgumentException()
                  };
              }
            bugLine: 5
            fix: интерфейс IDeliveryMethod { decimal Cost(Order o); } и реализации
        homework:
          task: |
            Разложите монолитный `Program.cs` интернет-магазина по чистой архитектуре: 4 проекта (Domain, Application, Infrastructure, Api) + тестовые проекты. Domain: `Order` с инвариантами, `Money`. Application: use-case `PlaceOrder` с интерфейсами. Infrastructure: EF Core репозиторий. Api: эндпоинт. Добавьте архитектурный тест (NetArchTest), что Domain не ссылается на EF Core.
          checklist:
            - Ссылки проектов только «внутрь»
            - Инварианты в доменной модели
            - Архитектурный тест проходит
          solution: |
            dotnet new sln -n Shop
            dotnet new classlib -n Shop.Domain -o src/Shop.Domain
            dotnet new classlib -n Shop.Application -o src/Shop.Application
            dotnet new classlib -n Shop.Infrastructure -o src/Shop.Infrastructure
            dotnet new webapi -n Shop.Api -o src/Shop.Api
            dotnet add src/Shop.Application reference src/Shop.Domain
            dotnet add src/Shop.Infrastructure reference src/Shop.Application
            dotnet add src/Shop.Api reference src/Shop.Infrastructure

            // Application
            public interface IOrderRepository { Task AddAsync(Order o, CancellationToken ct); }
            public record PlaceOrderCommand(int CustomerId, List<(int ProductId, int Qty)> Lines);
            public class PlaceOrderHandler(IOrderRepository orders, IProductRepository products)
            {
                public async Task<int> Handle(PlaceOrderCommand c, CancellationToken ct)
                {
                    var order = new Order(c.CustomerId);
                    foreach (var (pid, qty) in c.Lines) order.AddLine(await products.GetAsync(pid, ct), qty);
                    order.Submit();
                    await orders.AddAsync(order, ct);
                    return order.Id;
                }
            }

            // архитектурный тест
            [Fact]
            public void Domain_DoesNotDependOn_EfCore() =>
                Assert.True(Types.InAssembly(typeof(Order).Assembly)
                    .ShouldNot().HaveDependencyOn("Microsoft.EntityFrameworkCore").GetResult().IsSuccessful);
      - id: cs-10-04
        title: Паттерны проектирования в .NET
        minutes: 35
        xp: 45
        theory: |
          Паттерны — типовые решения повторяющихся задач. Знать нужно не UML-диаграммы, а **когда** паттерн полезен. Многие уже встроены в .NET.

          ## Порождающие

          **Singleton** — один экземпляр. В .NET — не через static, а через DI: `AddSingleton<ICache, MemoryCache>()`.

          **Factory** — создание объектов скрыто за методом:

          ```csharp
          public interface IPaymentFactory { IPayment Create(string method); }
          public class PaymentFactory(IServiceProvider sp) : IPaymentFactory
          {
              public IPayment Create(string m) => m switch
              {
                  "card" => sp.GetRequiredService<CardPayment>(),
                  "sbp"  => sp.GetRequiredService<SbpPayment>(),
                  _ => throw new NotSupportedException(m)
              };
          }
          ```

          **Builder** — пошаговая сборка сложного объекта: `WebApplication.CreateBuilder()`, `StringBuilder`, `new HostBuilder().ConfigureServices(...)`.

          ## Структурные

          **Adapter** — привести чужой интерфейс к своему (обёртка над SDK платёжки под ваш `IPaymentGateway`).

          **Decorator** — добавить поведение, не меняя класс:

          ```csharp
          public class CachedProductRepo(IProductRepo inner, IMemoryCache cache) : IProductRepo
          {
              public Task<Product?> GetAsync(int id) =>
                  cache.GetOrCreateAsync($"p:{id}", _ => inner.GetAsync(id));
          }
          // Scrutor: services.Decorate<IProductRepo, CachedProductRepo>();
          ```

          Middleware ASP.NET Core и `DelegatingHandler` у HttpClient — тоже декораторы (цепочка).

          **Facade** — простой интерфейс к сложной подсистеме.

          ## Поведенческие

          **Strategy** — взаимозаменяемые алгоритмы за одним интерфейсом (правила скидок, способы доставки).

          **Observer** — события C#, `IObservable<T>`, MediatR-нотификации.

          **Mediator / CQRS** — MediatR: контроллер отправляет команду, обработчик живёт отдельно:

          ```csharp
          public record GetOrderQuery(int Id) : IRequest<OrderDto>;
          public class GetOrderHandler(AppDb db) : IRequestHandler<GetOrderQuery, OrderDto>
          {
              public async Task<OrderDto> Handle(GetOrderQuery q, CancellationToken ct) => ...;
          }
          app.MapGet("/orders/{id}", (int id, ISender m) => m.Send(new GetOrderQuery(id)));
          ```

          **Chain of Responsibility** — middleware, пайплайны валидации (MediatR behaviors).

          **Repository + Unit of Work** — абстракция хранения. Помните: `DbContext` уже является UoW, а `DbSet` — репозиторием; лишняя обёртка оправдана, если нужен чистый домен или подмена хранилища.

          **Template Method** — `BackgroundService.ExecuteAsync`, `ControllerBase`.

          **Options, Result, Specification** — популярные в .NET идиомы.

          > 💡 Анти-паттерны: God Object, Service Locator, Anemic Domain Model (когда вся логика в сервисах, а сущности — мешки с полями), копипаст.
        practice:
          - type: choice
            q: Какой паттерн — middleware в ASP.NET Core?
