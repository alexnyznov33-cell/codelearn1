id: csharp
modules:
  - id: cs-m10
    title: Тестирование и архитектура
    level: Middle
    lessons:
      - id: cs-10-01
        title: Модульные тесты xUnit
        minutes: 30
        xp: 40
        theory: |
          Тесты — страховка при изменениях и документация поведения. **Unit-тест** проверяет один класс/метод изолированно, быстро (миллисекунды), без БД и сети.

          ```bash
          dotnet new xunit -n Shop.Tests
          dotnet add Shop.Tests reference Shop.Core
          dotnet test
          ```

          ## Структура теста — AAA

          ```csharp
          public class DiscountCalculatorTests
          {
              [Fact]
              public void Calculate_VipCustomer_Returns20Percent()
              {
                  // Arrange — подготовка
                  var calc = new DiscountCalculator();
                  var customer = new Customer { IsVip = true };

                  // Act — действие
                  var discount = calc.Calculate(customer, 1000m);

                  // Assert — проверка
                  Assert.Equal(200m, discount);
              }

              [Theory]
              [InlineData(0, 0)]
              [InlineData(999, 0)]
              [InlineData(1000, 50)]
              [InlineData(5000, 250)]
              public void Calculate_Regular_DependsOnSum(decimal sum, decimal expected)
              {
                  var calc = new DiscountCalculator();
                  Assert.Equal(expected, calc.Calculate(new Customer(), sum));
              }

              [Fact]
              public void Calculate_NegativeSum_Throws()
              {
                  var calc = new DiscountCalculator();
                  Assert.Throws<ArgumentOutOfRangeException>(() => calc.Calculate(new Customer(), -1));
              }
          }
          ```

          ## Основные Assert

          `Equal`, `NotEqual`, `True`, `False`, `Null`, `NotNull`, `Contains`, `Empty`, `Single`, `IsType<T>`, `Throws<T>`, `await Assert.ThrowsAsync<T>(...)`.

          Библиотека **FluentAssertions** / Shouldly — читаемее: `result.Should().Be(200).And.BePositive();`

          ## Жизненный цикл xUnit

          - Новый экземпляр тестового класса **на каждый тест** → изоляция. Подготовку пишите в конструкторе, очистку — в `Dispose`.
          - Общий дорогой ресурс — `IClassFixture<T>`; на несколько классов — `ICollectionFixture<T>`.
          - `[Fact(Skip = "причина")]`, `[Trait("Category", "Slow")]`.

          ## Хорошие тесты (FIRST)

          **F**ast, **I**ndependent, **R**epeatable, **S**elf-validating, **T**imely. Имя теста описывает сценарий: `Method_Condition_Expected`. Один тест — одна причина упасть. Не тестируйте приватные методы — тестируйте поведение через публичный API.

          Зависимости от времени, случайности и файлов делайте внедряемыми (`TimeProvider`, `IClock`), иначе тесты станут нестабильными.

          ## Пирамида тестов

          Много unit → меньше интеграционных (`WebApplicationFactory`, Testcontainers) → мало end-to-end. Покрытие: `dotnet test --collect:"XPlat Code Coverage"`.
        practice:
          - type: choice
            q: Какой атрибут для теста с несколькими наборами данных?
            options: ["[Fact]", "[Theory] + [InlineData]", "[Test]", "[DataRow]"]
            answer: 1
          - type: order
            q: Расставьте части теста по шаблону AAA
            lines:
              - var cart = new Cart();
              - cart.Add(new Item("Чай", 100));
