          - type: choice
            q: Как передать мок в конструктор тестируемого класса?
            options: ["mock", "mock.Object", "mock.Instance", "new mock()"]
            answer: 1
          - type: choice
            q: Что НЕ стоит мокать?
            options: ["HTTP-клиент внешнего API", "Отправку email", "Простой value-объект Money", "Системное время"]
            answer: 2
          - type: choice
