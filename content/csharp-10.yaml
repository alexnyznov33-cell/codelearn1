            code: |
              Assert.___<InvalidOperationException>(() => stack.Pop());
            answers: ["Throws"]
          - type: choice
            q: Сколько экземпляров тестового класса создаёт xUnit?
            options: ["Один на класс", "Один на каждый тест", "Один на сборку", "Ни одного — методы статические"]
            answer: 1
          - type: choice
            q: Какой тест — хороший unit-тест?
            options: ["Обращается к реальной БД", "Зависит от порядка запуска", "Быстрый, изолированный и повторяемый", "Проверяет сразу 10 сценариев"]
            answer: 2
        homework:
          task: |
            Напишите класс `PasswordValidator` (длина ≥ 8, есть цифра, заглавная, спецсимвол, нет пробелов; возвращает список ошибок) и покройте его тестами xUnit: Theory для валидных/невалидных паролей, отдельные Fact на каждое правило, тест на null. Добейтесь 100% покрытия и прогоните `dotnet test` с отчётом покрытия.
          checklist:
            - Тесты названы по схеме Method_Condition_Expected
            - Используется Theory с InlineData
            - Все тесты зелёные
          solution: |
            public class PasswordValidator
            {
                public List<string> Validate(string? p)
                {
                    ArgumentNullException.ThrowIfNull(p);
                    var e = new List<string>();
                    if (p.Length < 8) e.Add("length");
                    if (!p.Any(char.IsDigit)) e.Add("digit");
                    if (!p.Any(char.IsUpper)) e.Add("upper");
                    if (p.All(char.IsLetterOrDigit)) e.Add("special");
                    if (p.Any(char.IsWhiteSpace)) e.Add("space");
                    return e;
                }
            }

            public class PasswordValidatorTests
            {
                private readonly PasswordValidator v = new();

                [Theory]
                [InlineData("Qwerty1!")]
                [InlineData("Str0ng#Pass")]
                public void Validate_Strong_NoErrors(string p) => Assert.Empty(v.Validate(p));

                [Theory]
                [InlineData("Qw1!", "length")]
                [InlineData("Qwertyu!", "digit")]
                [InlineData("qwerty1!", "upper")]
                [InlineData("Qwerty12", "special")]
                [InlineData("Qwer ty1!", "space")]
                public void Validate_Weak_ReturnsError(string p, string error) => Assert.Contains(error, v.Validate(p));

                [Fact]
                public void Validate_Null_Throws() => Assert.Throws<ArgumentNullException>(() => v.Validate(null));
            }
      - id: cs-10-02
        title: Моки и Moq
        minutes: 30
        xp: 40
        theory: |
          Если тестируемый класс зависит от БД, почты или внешнего API, эти зависимости заменяют **тестовыми двойниками**:

          - **Stub** — возвращает заготовленные данные;
          - **Mock** — позволяет проверить, что метод был вызван с нужными аргументами;
          - **Fake** — упрощённая рабочая реализация (in-memory репозиторий).

          Это возможно, только если зависимость — интерфейс и внедряется через конструктор (DI).

          ## Moq

          ```bash
          dotnet add package Moq
          ```

          ```csharp
          public class OrderServiceTests
          {
              private readonly Mock<IOrderRepository> repo = new();
              private readonly Mock<IEmailSender> email = new();
              private readonly OrderService sut;          // system under test

              public OrderServiceTests() => sut = new OrderService(repo.Object, email.Object);

              [Fact]
              public async Task Place_ValidOrder_SavesAndSendsEmail()
              {
                  // stub: настроить возвращаемое значение
                  repo.Setup(r => r.GetStockAsync(5)).ReturnsAsync(10);

                  await sut.PlaceAsync(new Order { ProductId = 5, Qty = 2, Email = "a@b.ru" });

                  // mock: проверить вызовы
                  repo.Verify(r => r.AddAsync(It.Is<Order>(o => o.Qty == 2)), Times.Once);
                  email.Verify(e => e.SendAsync("a@b.ru", It.IsAny<string>()), Times.Once);
              }

              [Fact]
              public async Task Place_NoStock_Throws_AndDoesNotSave()
              {
                  repo.Setup(r => r.GetStockAsync(It.IsAny<int>())).ReturnsAsync(0);

                  await Assert.ThrowsAsync<OutOfStockException>(() => sut.PlaceAsync(new Order { Qty = 1 }));

                  repo.Verify(r => r.AddAsync(It.IsAny<Order>()), Times.Never);
                  email.VerifyNoOtherCalls();
              }
          }
          ```

          ## Полезное

          - `Setup(...).Throws<TimeoutException>()` — сымитировать сбой.
          - `It.IsAny<T>()`, `It.Is<T>(predicate)`, `It.IsInRange(...)`.
          - `Callback<Order>(o => saved = o)` — захватить аргумент.
          - `SetupSequence(...).Returns(1).Returns(2)` — разные ответы подряд.
          - `MockBehavior.Strict` — исключение на любой ненастроенный вызов.

          Альтернативы: **NSubstitute** (`var repo = Substitute.For<IRepo>(); repo.Get(1).Returns(x);`), FakeItEasy.

          ## Меры

          - Мокайте то, чем **не владеете** или что медленно (сеть, БД, время). Не мокайте value-объекты и простые классы.
          - Слишком много моков и `Verify` → хрупкие тесты, которые ломаются при рефакторинге. Проверяйте результат и важные побочные эффекты.
          - Время: `TimeProvider` + `FakeTimeProvider` (пакет Microsoft.Extensions.TimeProvider.Testing).
          - Для EF Core вместо моков DbContext лучше SQLite in-memory или Testcontainers.
        practice:
          - type: fill
            q: Настройте мок, чтобы он вернул значение
            code: |
              repo.___(r => r.Find(1)).Returns(new User());
            answers: ["Setup"]
          - type: fill
