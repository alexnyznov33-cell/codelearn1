            options: ["/api/getReviews?product=42", "/api/products/42/reviews", "/api/review_list/42", "/api/products/reviews/get/42"]
            answer: 1
          - type: fill
            q: Преобразуйте строку из query в число в схеме Zod
            code: |
              page: z.___.number().int().min(1)
            answers: ["coerce"]
          - type: output
            q: Что выведет код (логика как у validate)?
            code: |
              const schema = { title: (v) => typeof v === "string" && v.length >= 2 };
              const body = { title: "A", isAdmin: true };
              const errors = Object.keys(schema).filter((k) => !schema[k](body[k]));
              const clean = Object.fromEntries(Object.keys(schema).map((k) => [k, body[k]]));
              console.log(errors.join(","), "isAdmin" in clean);
            answer: title false
          - type: choice
            q: Пользователь пытается создать товар с уже существующим артикулом. Какой код ответа?
            options: ["200", "400", "409", "500"]
            answer: 2
          - type: order
            q: Расставьте слои обработки POST-запроса
            lines:
              - Роутер сопоставляет метод и путь
              - Middleware валидирует тело схемой
              - Сервис выполняет бизнес-логику
              - Репозиторий сохраняет данные
              - Ответ 201 с Location и созданным объектом
        homework:
          task: |
            Переделайте API «Заметки» в полноценный REST API «Каталог товаров» со слоями routes → services → repositories (пока in-memory): Zod-схемы для создания, обновления (PATCH, частичная схема `.partial()`), query (пагинация, сортировка, фильтр по категории и диапазону цен); единый формат ошибок; заголовок Location; ответ списка с `meta`. Напишите 6+ тестов на supertest + vitest.
          checklist:
            - Все входные данные валидируются
            - Лишние поля отбрасываются
            - Слои разделены
            - Есть тесты API
          solution: |
            // schemas.js
            import { z } from "zod";
            export const ProductCreate = z.object({
              title: z.string().trim().min(2).max(100),
              price: z.number().positive(),
              category: z.enum(["tea", "coffee", "sweets"]),
            });
            export const ProductPatch = ProductCreate.partial();
            export const ProductQuery = z.object({
              page: z.coerce.number().int().min(1).default(1),
              limit: z.coerce.number().int().min(1).max(100).default(10),
              sort: z.enum(["price", "-price", "title"]).default("title"),
              category: z.enum(["tea", "coffee", "sweets"]).optional(),
              minPrice: z.coerce.number().optional(),
              maxPrice: z.coerce.number().optional(),
            });

            // repository.js
            const items = new Map();
            export const repo = {
              all: () => [...items.values()],
              get: (id) => items.get(id),
              save: (p) => (items.set(p.id, p), p),
              delete: (id) => items.delete(id),
            };

            // service.js
            import { repo } from "./repository.js";
            export const service = {
              list({ page, limit, sort, category, minPrice = 0, maxPrice = Infinity }) {
                const key = sort.replace("-", ""), dir = sort.startsWith("-") ? -1 : 1;
                const filtered = repo.all()
                  .filter((p) => (!category || p.category === category) && p.price >= minPrice && p.price <= maxPrice)
                  .sort((a, b) => (a[key] > b[key] ? dir : -dir));
                return { data: filtered.slice((page - 1) * limit, page * limit), meta: { page, limit, total: filtered.length, pages: Math.ceil(filtered.length / limit) } };
              },
              create: (dto) => repo.save({ id: crypto.randomUUID(), ...dto }),
              patch(id, dto) { const p = repo.get(id); return p && repo.save({ ...p, ...dto }); },
            };

            // routes.js
            import { Router } from "express";
            const validate = (schema, src = "body") => (req, res, next) => {
              const r = schema.safeParse(req[src]);
              if (!r.success) return res.status(400).json({ error: { code: "VALIDATION", details: r.error.issues.map((i) => ({ path: i.path.join("."), message: i.message })) } });
              req.valid = { ...req.valid, [src]: r.data };
              next();
            };
            export const router = Router();
            router.get("/", validate(ProductQuery, "query"), (req, res) => res.json(service.list(req.valid.query)));
            router.post("/", validate(ProductCreate), (req, res) => {
              const p = service.create(req.valid.body);
              res.status(201).location(`/api/products/${p.id}`).json(p);
            });
            router.patch("/:id", validate(ProductPatch), (req, res) => {
              const p = service.patch(req.params.id, req.valid.body);
              p ? res.json(p) : res.status(404).json({ error: { code: "NOT_FOUND", message: "Товар не найден" } });
            });

            // api.test.js
            import request from "supertest";
            import { app } from "./app.js";
            import { it, expect } from "vitest";
            it("создаёт товар", async () => {
              const r = await request(app).post("/api/products").send({ title: "Пуэр", price: 900, category: "tea", isAdmin: true });
              expect(r.status).toBe(201);
              expect(r.headers.location).toMatch(/\/api\/products\//);
              expect(r.body.isAdmin).toBeUndefined();
            });
            it("400 при невалидной цене", async () => {
              const r = await request(app).post("/api/products").send({ title: "Чай", price: -1, category: "tea" });
              expect(r.status).toBe(400);
              expect(r.body.error.details[0].path).toBe("price");
            });
      - id: js-09-04
        title: Базы данных — PostgreSQL и Prisma
        minutes: 45
        xp: 50
        theory: |
          **PostgreSQL** — надёжная open-source реляционная СУБД, стандарт для бэкенда. Быстрый запуск через Docker:

          ```bash
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg -e POSTGRES_DB=shop postgres:16
          ```

          Работать с БД из Node.js можно на «чистом» SQL (`pg`, `postgres.js`), через query builder (**Knex**, **Kysely**) или ORM (**Prisma**, **Drizzle**, TypeORM).

          ## Чистый SQL с pg

          ```javascript
          import pg from "pg";
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const { rows } = await pool.query(
            "SELECT id, title, price FROM products WHERE price < $1 ORDER BY price",
            [1000]                    // параметры отдельно — защита от SQL-инъекций
          );
          ```

          ## Prisma

          ```bash
          npm i -D prisma && npm i @prisma/client
          npx prisma init           # создаст prisma/schema.prisma и .env с DATABASE_URL
          ```

          ```prisma
          // prisma/schema.prisma
          model User {
            id        Int      @id @default(autoincrement())
            email     String   @unique
            name      String
            orders    Order[]
            createdAt DateTime @default(now())
          }

          model Order {
            id     Int     @id @default(autoincrement())
            total  Decimal @db.Decimal(10, 2)
            status String  @default("NEW")
            user   User    @relation(fields: [userId], references: [id])
            userId Int
            @@index([userId])
          }
          ```

          ```bash
          npx prisma migrate dev --name init   # создать и применить миграцию + сгенерировать клиент
          npx prisma studio                    # GUI для просмотра данных
          ```

          ## Запросы — полностью типизированные

          ```javascript
          import { PrismaClient } from "@prisma/client";
          const prisma = new PrismaClient();

          const user = await prisma.user.create({ data: { email: "anna@mail.ru", name: "Анна" } });
          const users = await prisma.user.findMany({
            where: { name: { contains: "ан", mode: "insensitive" } },
            include: { orders: true },             // связанные заказы одним запросом — без N+1
            orderBy: { createdAt: "desc" },
            skip: 20, take: 10,
          });
          await prisma.order.update({ where: { id: 5 }, data: { status: "PAID" } });
          const stats = await prisma.order.groupBy({ by: ["status"], _sum: { total: true }, _count: true });
          ```

          ## Транзакции

          ```javascript
          await prisma.$transaction(async (tx) => {
            const from = await tx.account.update({ where: { id: 1 }, data: { balance: { decrement: 100 } } });
            if (from.balance < 0) throw new Error("Недостаточно средств");   // откат всей транзакции
            await tx.account.update({ where: { id: 2 }, data: { balance: { increment: 100 } } });
          });
          ```

          ## Практики

          - Миграции хранятся в git и применяются в CI/CD командой `prisma migrate deploy`.
          - Индексы — на полях в `WHERE`, `JOIN`, `ORDER BY` (`@@index`).
          - Один `PrismaClient` на приложение (пул соединений внутри).
          - Деньги — `Decimal`, а не `Float`.
          - Смотрите реальные SQL-запросы: `new PrismaClient({ log: ["query"] })`.
