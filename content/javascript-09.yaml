        homework:
          task: |
            Добавьте в «Каталог» пользователей: модель `User` (email, passwordHash, role USER/ADMIN), `RefreshToken` (хеш токена, срок, userId). Эндпоинты: register (Zod, bcrypt), login (access 15 мин + refresh в HttpOnly cookie), refresh (ротация: старый токен удаляется), logout, `GET /me`. Создание товаров — только ADMIN, отзывы — только вошедшим, редактировать отзыв может только автор. Rate limit на login (5 попыток в минуту). Напишите тесты на 401/403.
          checklist:
            - Пароли и refresh-токены хранятся в виде хешей
            - Refresh в HttpOnly cookie с ротацией
            - Проверка владельца ресурса
            - Ограничение попыток входа
          solution: |
            import bcrypt from "bcrypt";
            import jwt from "jsonwebtoken";
            import crypto from "node:crypto";
            import rateLimit from "express-rate-limit";
            import { Router } from "express";
            import { prisma } from "./repository.js";

            const SECRET = process.env.JWT_SECRET;
            const sha = (s) => crypto.createHash("sha256").update(s).digest("hex");
            const issueAccess = (u) => jwt.sign({ sub: u.id, role: u.role }, SECRET, { expiresIn: "15m" });
            async function issueRefresh(res, userId) {
              const token = crypto.randomBytes(48).toString("hex");
              await prisma.refreshToken.create({ data: { tokenHash: sha(token), userId, expiresAt: new Date(Date.now() + 30 * 864e5) } });
              res.cookie("refresh", token, { httpOnly: true, secure: true, sameSite: "strict", path: "/api/auth", maxAge: 30 * 864e5 });
            }

            export const authRouter = Router();
            authRouter.post("/register", validate(Credentials), async (req, res) => {
              const { email, password } = req.valid.body;
              if (await prisma.user.findUnique({ where: { email } })) return res.status(409).json({ error: "Email занят" });
              const user = await prisma.user.create({ data: { email, passwordHash: await bcrypt.hash(password, 12) } });
              res.status(201).json({ id: user.id, email });
            });
            authRouter.post("/login", rateLimit({ windowMs: 60_000, limit: 5 }), validate(Credentials), async (req, res) => {
              const { email, password } = req.valid.body;
              const user = await prisma.user.findUnique({ where: { email } });
              if (!user || !(await bcrypt.compare(password, user.passwordHash))) return res.status(401).json({ error: "Неверный email или пароль" });
              await issueRefresh(res, user.id);
              res.json({ accessToken: issueAccess(user) });
            });
            authRouter.post("/refresh", async (req, res) => {
              const token = req.cookies.refresh;
              const stored = token && (await prisma.refreshToken.findUnique({ where: { tokenHash: sha(token) }, include: { user: true } }));
              if (!stored || stored.expiresAt < new Date()) return res.status(401).json({ error: "Сессия истекла" });
              await prisma.refreshToken.delete({ where: { id: stored.id } });     // ротация
              await issueRefresh(res, stored.userId);
              res.json({ accessToken: issueAccess(stored.user) });
            });
            authRouter.post("/logout", async (req, res) => {
              if (req.cookies.refresh) await prisma.refreshToken.deleteMany({ where: { tokenHash: sha(req.cookies.refresh) } });
              res.clearCookie("refresh", { path: "/api/auth" }).sendStatus(204);
            });

