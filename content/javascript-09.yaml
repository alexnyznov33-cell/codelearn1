id: javascript
modules:
  - id: js-m9
    title: Node.js
    level: Middle
    lessons:
      - id: js-09-01
        title: Модули Node.js, fs, path
        minutes: 40
        xp: 45
        theory: |
          **Node.js** — среда выполнения JavaScript вне браузера (движок V8 + libuv). Нет `window` и `document`, зато есть доступ к файлам, сети, процессам.

          ```bash
          node app.js
          node --watch app.js        # перезапуск при изменениях (Node 18+)
          node --env-file=.env app.js  # загрузить переменные окружения (Node 20+)
          ```

          ## Глобальные объекты

          ```javascript
          process.argv;              // аргументы командной строки
          process.env.PORT;          // переменные окружения
          process.cwd();             // текущая папка
          process.exit(1);           // завершить с кодом ошибки
          import.meta.dirname;       // папка текущего модуля (ESM, Node 20.11+)
          ```

          ## path — работа с путями

          ```javascript
          import path from "node:path";
          path.join("data", "users", "list.json");   // data/users/list.json (или с \ в Windows)
          path.resolve("data");                       // абсолютный путь
          path.extname("photo.jpg");                  // ".jpg"
          path.basename("/a/b/report.pdf", ".pdf");   // "report"
          path.dirname("/a/b/c.txt");                 // "/a/b"
          ```

          Никогда не склеивайте пути строками через `/` — используйте `path.join`, тогда код работает в любой ОС.

          ## fs — файловая система

          ```javascript
          import { readFile, writeFile, mkdir, readdir, stat, rm } from "node:fs/promises";

          const text = await readFile("config.json", "utf8");
          const config = JSON.parse(text);
          await mkdir("out/reports", { recursive: true });
          await writeFile("out/result.json", JSON.stringify(config, null, 2));
          const files = await readdir("out", { withFileTypes: true });
          for (const f of files) console.log(f.name, f.isDirectory());
          const info = await stat("out/result.json");   // размер, даты
          await rm("tmp", { recursive: true, force: true });
          ```

          Синхронные версии (`readFileSync`) блокируют event loop — допустимы только в скриптах и при старте, но не в обработчиках запросов сервера.

          ## Потоки (streams)

          Большие файлы читают частями, не загружая в память целиком:

          ```javascript
          import { createReadStream, createWriteStream } from "node:fs";
          import { pipeline } from "node:stream/promises";
          import { createGzip } from "node:zlib";
          await pipeline(createReadStream("big.log"), createGzip(), createWriteStream("big.log.gz"));

          import readline from "node:readline";
          const rl = readline.createInterface({ input: createReadStream("big.csv") });
          for await (const line of rl) { /* построчная обработка */ }
          ```

          ## Другие встроенные модули

          `node:http`, `node:crypto` (`randomUUID`, хеши), `node:os`, `node:child_process`, `node:events` (`EventEmitter`), `node:test` (встроенный тест-раннер), `node:util` (`parseArgs`, `promisify`). Префикс `node:` явно указывает на встроенный модуль.
        practice:
          - type: fill
            q: Соберите путь кроссплатформенно
            code: |
              const file = path.___(baseDir, "data", "users.json");
            answers: ["join"]
          - type: output
            q: Что выведет код?
            code: |
              const path = require("node:path");
              console.log(path.extname("archive.tar.gz"), path.basename("/docs/report.pdf", ".pdf"));
            answer: .gz report
          - type: bug
            q: Какая строка плоха в обработчике HTTP-запросов?
            code: |
              server.on("request", (req, res) => {
                const data = fs.readFileSync("big-report.json", "utf8");
                res.end(data);
              });
            bugLine: 2
            fix: const data = await readFile("big-report.json", "utf8"); (в async-обработчике) или поток
            explain: Синхронное чтение блокирует event loop — все остальные запросы ждут.
          - type: choice
            q: Как обработать файл логов на 10 ГБ?
            options: ["readFile целиком", "Потоками (stream/readline) по частям", "JSON.parse", "Нельзя в Node.js"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              const path = require("node:path");
              console.log(path.posix.join("a", "b", "..", "c", "file.txt"));
            answer: a/c/file.txt
        homework:
          task: |
            Напишите CLI-утилиту `organize.js`: принимает путь к папке (`process.argv` или `util.parseArgs`), сканирует файлы и раскладывает их по подпапкам по типу (images: jpg/png/gif, docs: pdf/docx/txt, archives: zip/rar, other). Флаг `--dry-run` только показывает план. В конце выводит отчёт: сколько файлов и сколько мегабайт перемещено в каждую категорию, и сохраняет его в `report.json`. Используйте `fs/promises` и `path`.
          checklist:
            - Пути собираются через path
            - Асинхронный fs
            - Работает dry-run
            - Ошибки (нет папки) обрабатываются
          solution: |
            import { readdir, mkdir, rename, stat, writeFile } from "node:fs/promises";
            import path from "node:path";
            import { parseArgs } from "node:util";

            const { values, positionals } = parseArgs({ options: { "dry-run": { type: "boolean" } }, allowPositionals: true });
            const dir = path.resolve(positionals[0] ?? ".");
            const groups = { images: [".jpg", ".jpeg", ".png", ".gif"], docs: [".pdf", ".docx", ".txt"], archives: [".zip", ".rar"] };
            const categoryOf = (file) =>
              Object.entries(groups).find(([, exts]) => exts.includes(path.extname(file).toLowerCase()))?.[0] ?? "other";

            try {
              const entries = await readdir(dir, { withFileTypes: true });
              const report = {};
              for (const e of entries.filter((x) => x.isFile())) {
                const cat = categoryOf(e.name);
                const from = path.join(dir, e.name);
                const to = path.join(dir, cat, e.name);
                const { size } = await stat(from);
                report[cat] ??= { files: 0, mb: 0 };
                report[cat].files++;
                report[cat].mb += size / 1024 / 1024;
                if (values["dry-run"]) console.log(`${e.name} → ${cat}/`);
                else {
                  await mkdir(path.join(dir, cat), { recursive: true });
                  await rename(from, to);
                }
              }
              for (const r of Object.values(report)) r.mb = Number(r.mb.toFixed(2));
              console.table(report);
              if (!values["dry-run"]) await writeFile(path.join(dir, "report.json"), JSON.stringify(report, null, 2));
            } catch (err) {
              console.error(err.code === "ENOENT" ? `Папка не найдена: ${dir}` : err.message);
              process.exit(1);
            }
      - id: js-09-02
        title: HTTP-сервер и Express
        minutes: 40
        xp: 45
        theory: |
          ## Встроенный http

          ```javascript
          import http from "node:http";
          const server = http.createServer((req, res) => {
            if (req.method === "GET" && req.url === "/health") {
              res.writeHead(200, { "Content-Type": "application/json" });
              return res.end(JSON.stringify({ ok: true }));
            }
            res.writeHead(404).end("Not found");
          });
          server.listen(3000, () => console.log("http://localhost:3000"));
          ```

          Писать роутинг, разбор JSON и cookie вручную долго — поэтому используют фреймворки: **Express** (самый популярный), **Fastify** (быстрый, со схемами), **Hono**, **NestJS** (архитектура как в Spring).

          ## Express

          ```bash
          npm i express
          ```

          ```javascript
          import express from "express";
          const app = express();

          app.use(express.json());                       // разбор JSON-тела
          app.use(express.static("public"));             // статические файлы

          app.use((req, res, next) => {                  // свой middleware: логирование
            const start = Date.now();
            res.on("finish", () => console.log(req.method, req.url, res.statusCode, `${Date.now() - start}ms`));
            next();                                      // передать дальше по цепочке
          });

          app.get("/api/hello", (req, res) => {
            res.json({ message: `Привет, ${req.query.name ?? "гость"}` });   // ?name=Анна
          });

          app.get("/api/users/:id", (req, res) => {
            const user = users.find((u) => u.id === Number(req.params.id));
            if (!user) return res.status(404).json({ error: "Не найден" });
            res.json(user);
          });

          app.post("/api/users", (req, res) => {
            const user = { id: Date.now(), ...req.body };
            users.push(user);
            res.status(201).json(user);
          });

          app.listen(process.env.PORT ?? 3000);
          ```

          ## Middleware

          Функция `(req, res, next)` — звено конвейера. Может изменить `req`/`res`, завершить ответ или вызвать `next()`. Порядок `app.use` важен. Популярные: `cors`, `helmet` (заголовки безопасности), `morgan` (логи), `express-rate-limit`, `cookie-parser`.

          ## Роутеры и обработка ошибок

          ```javascript
          // routes/products.js
          const router = express.Router();
          router.get("/", listProducts);
          router.post("/", createProduct);
          export default router;

          // app.js
          app.use("/api/products", productsRouter);

          // Обработчик ошибок — 4 аргумента, подключается последним
          app.use((err, req, res, next) => {
            console.error(err);
            res.status(err.status ?? 500).json({ error: err.expose ? err.message : "Внутренняя ошибка" });
          });
          ```

          В Express 5 ошибки из `async`-обработчиков автоматически попадают в обработчик ошибок; в Express 4 нужно оборачивать или вызывать `next(err)`.
        practice:
          - type: fill
            q: Включите разбор JSON-тела запросов
            code: |
              app.use(express.___());
            answers: ["json"]
          - type: fill
            q: Получите параметр :id из пути /api/orders/:id
            code: |
              const id = req.___.id;
            answers: ["params"]
          - type: bug
            q: Почему запрос «зависает» и не получает ответа?
            code: |
              app.use((req, res, next) => {
                console.log(req.method, req.url);
              });
              app.get("/", (req, res) => res.send("ok"));
            bugLine: 2
            fix: добавить вызов next() после логирования
            explain: Middleware не завершил ответ и не передал управление дальше — запрос висит.
          - type: choice
            q: Сколько аргументов у обработчика ошибок в Express?
            options: ["2", "3", "4", "1"]
            answer: 2
          - type: output
            q: Что выведет код (упрощённая цепочка middleware)?
            code: |
              const chain = [(ctx, next) => { ctx.log.push("a"); next(); ctx.log.push("a2"); }, (ctx, next) => { ctx.log.push("b"); next(); }, (ctx) => ctx.log.push("handler")];
              const ctx = { log: [] };
              const run = (i) => chain[i] && chain[i](ctx, () => run(i + 1));
              run(0);
              console.log(ctx.log.join(" "));
            answer: a b handler a2
        homework:
          task: |
            Напишите на Express сервер «Заметки» (хранение в JSON-файле через fs/promises): `GET /api/notes` (поиск `?q=`), `GET /api/notes/:id`, `POST`, `PUT /:id`, `DELETE /:id`; middleware логирования со временем ответа, `helmet`, `cors` для `http://localhost:5173`, раздачу статики из `public/` с простой HTML-страницей, роутер в отдельном файле, централизованный обработчик ошибок и 404 для неизвестных путей API.
          checklist:
            - Правильные HTTP-коды
            - Роуты вынесены в Router
            - Есть обработчик ошибок
            - Данные сохраняются в файл
          solution: |
            // notes.router.js
            import { Router } from "express";
            import { readFile, writeFile } from "node:fs/promises";
            const FILE = "notes.json";
            const load = async () => JSON.parse(await readFile(FILE, "utf8").catch(() => "[]"));
            const save = (notes) => writeFile(FILE, JSON.stringify(notes, null, 2));
            const httpError = (status, message) => Object.assign(new Error(message), { status, expose: true });

            const router = Router();
            router.get("/", async (req, res) => {
              const q = String(req.query.q ?? "").toLowerCase();
              res.json((await load()).filter((n) => n.text.toLowerCase().includes(q)));
            });
            router.get("/:id", async (req, res) => {
              const note = (await load()).find((n) => n.id === req.params.id);
              if (!note) throw httpError(404, "Заметка не найдена");
              res.json(note);
            });
            router.post("/", async (req, res) => {
              if (!req.body?.text) throw httpError(400, "Поле text обязательно");
              const notes = await load();
              const note = { id: crypto.randomUUID(), text: req.body.text, createdAt: new Date().toISOString() };
              await save([...notes, note]);
              res.status(201).json(note);
            });
            router.put("/:id", async (req, res) => {
              const notes = await load();
              const i = notes.findIndex((n) => n.id === req.params.id);
              if (i < 0) throw httpError(404, "Заметка не найдена");
              notes[i] = { ...notes[i], text: req.body.text };
              await save(notes);
              res.json(notes[i]);
            });
            router.delete("/:id", async (req, res) => {
              const notes = await load();
              if (!notes.some((n) => n.id === req.params.id)) throw httpError(404, "Заметка не найдена");
              await save(notes.filter((n) => n.id !== req.params.id));
              res.status(204).end();
            });
            export default router;

            // app.js (Express 5)
            import express from "express";
            import helmet from "helmet";
            import cors from "cors";
            import notes from "./notes.router.js";
            const app = express();
            app.use(helmet());
            app.use(cors({ origin: "http://localhost:5173" }));
            app.use(express.json());
            app.use((req, res, next) => {
              const t = Date.now();
              res.on("finish", () => console.log(`${req.method} ${req.originalUrl} ${res.statusCode} ${Date.now() - t}ms`));
              next();
            });
            app.use(express.static("public"));
            app.use("/api/notes", notes);
            app.use("/api", (req, res) => res.status(404).json({ error: "Маршрут не найден" }));
            app.use((err, req, res, next) => {
              if (!err.expose) console.error(err);
              res.status(err.status ?? 500).json({ error: err.expose ? err.message : "Внутренняя ошибка" });
            });
            app.listen(3000, () => console.log("http://localhost:3000"));
      - id: js-09-03
        title: REST API и валидация
        minutes: 40
        xp: 45
        theory: |
          ## Проектирование REST API

          - Ресурсы — существительные во множественном числе: `/api/products`, `/api/products/42/reviews`.
          - Действие — HTTP-метод: GET (чтение), POST (создание), PUT/PATCH (изменение), DELETE.
          - Коды ответа: 200, 201 (+ заголовок `Location`), 204, 400 (невалидно), 401, 403, 404, 409 (конфликт), 422, 429 (лимит), 500.
          - Фильтры, сортировка, пагинация — в query: `GET /api/products?category=tea&sort=-price&page=2&limit=20`.
          - Единый формат ошибок: `{ "error": { "code": "VALIDATION", "message": "...", "details": [...] } }`.
          - Версионирование: `/api/v1/...`.

          ## Валидация входных данных

          **Никогда не доверяйте** данным клиента. Валидируйте тело, параметры и query на сервере. Популярно — **Zod**:

          ```javascript
          import { z } from "zod";

          const CreateProduct = z.object({
            title: z.string().trim().min(2).max(100),
            price: z.number().positive(),
            category: z.enum(["tea", "coffee", "sweets"]),
            tags: z.array(z.string()).max(10).default([]),
          });

          const ListQuery = z.object({
            page: z.coerce.number().int().min(1).default(1),       // строки из query → числа
            limit: z.coerce.number().int().min(1).max(100).default(20),
            sort: z.enum(["price", "-price", "title"]).optional(),
          });

          const validate = (schema, source = "body") => (req, res, next) => {
            const result = schema.safeParse(req[source]);
            if (!result.success) {
              return res.status(400).json({
                error: { code: "VALIDATION", details: result.error.issues.map((i) => ({ path: i.path.join("."), message: i.message })) },
              });
            }
            req.valid = { ...req.valid, [source]: result.data };    // очищенные данные
            next();
          };

          app.post("/api/products", validate(CreateProduct), async (req, res) => {
            const product = await service.create(req.valid.body);   // только проверенные поля
            res.status(201).location(`/api/products/${product.id}`).json(product);
          });
          ```

          Zod по умолчанию **отбрасывает** лишние поля — клиент не сможет подсунуть `isAdmin: true`.

          ## Слои приложения

          ```
          routes (HTTP: валидация, коды) → services (бизнес-логика) → repositories (БД)
          ```

          Контроллер не знает про SQL, сервис не знает про `req/res` — это упрощает тесты и замену частей.

          ## Пагинация в ответе

          ```json
          { "data": [...], "meta": { "page": 2, "limit": 20, "total": 134, "pages": 7 } }
          ```

          ## Документация

          OpenAPI (Swagger) описывает API в YAML/JSON: эндпоинты, схемы, коды. Генерируется из схем Zod (`zod-to-openapi`) и показывается через Swagger UI. Тестирование API — `supertest`:

          ```javascript
          const res = await request(app).post("/api/products").send({ title: "" });
          expect(res.status).toBe(400);
          ```
        practice:
          - type: choice
