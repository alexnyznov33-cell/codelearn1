            //          command: sh -c "npx prisma migrate deploy && node app.js" }
      - id: js-09-05
        title: Аутентификация JWT
        minutes: 45
        xp: 50
        theory: |
          ## Хранение паролей

          Пароли хранят только в виде **хеша с солью** медленным алгоритмом: **bcrypt** или **argon2**.

          ```javascript
          import bcrypt from "bcrypt";
          const hash = await bcrypt.hash(password, 12);           // при регистрации
          const ok = await bcrypt.compare(password, user.passwordHash);   // при входе
          ```

          ## JWT

          JSON Web Token: `header.payload.signature`. Сервер подписывает данные секретом, а потом проверяет подпись — без похода в БД.

          ```javascript
          import jwt from "jsonwebtoken";
          const SECRET = process.env.JWT_SECRET;   // длинная случайная строка, не в коде!

          app.post("/api/auth/login", validate(LoginSchema), async (req, res) => {
            const { email, password } = req.valid.body;
            const user = await prisma.user.findUnique({ where: { email } });
            if (!user || !(await bcrypt.compare(password, user.passwordHash))) {
              return res.status(401).json({ error: "Неверный email или пароль" });   // не уточняем, что именно
            }
            const accessToken = jwt.sign({ sub: user.id, role: user.role }, SECRET, { expiresIn: "15m" });
            res.json({ accessToken });
          });

          function auth(requiredRole) {
            return (req, res, next) => {
              const header = req.headers.authorization ?? "";
              const token = header.startsWith("Bearer ") ? header.slice(7) : null;
              if (!token) return res.status(401).json({ error: "Нужна авторизация" });
              try {
                req.user = jwt.verify(token, SECRET);           // бросит при неверной подписи или истёкшем сроке
              } catch {
                return res.status(401).json({ error: "Токен недействителен" });
              }
              if (requiredRole && req.user.role !== requiredRole) return res.status(403).json({ error: "Недостаточно прав" });
              next();
            };
          }

          app.get("/api/me", auth(), (req, res) => res.json({ id: req.user.sub }));
          app.delete("/api/users/:id", auth("admin"), deleteUser);
          ```

          ## Access + refresh

          Короткий **access token** (5–15 мин) передаётся в заголовке `Authorization: Bearer`. Долгий **refresh token** (дни) хранится в cookie `HttpOnly; Secure; SameSite=Strict` — JS его не прочитает, XSS не украдёт. Эндпоинт `/api/auth/refresh` выдаёт новую пару; refresh-токены хранят в БД, чтобы можно было отозвать (выход, смена пароля) и делать ротацию.

          ```javascript
          res.cookie("refresh", refreshToken, { httpOnly: true, secure: true, sameSite: "strict", path: "/api/auth", maxAge: 30 * 864e5 });
          ```

          ## Безопасность

          - Payload JWT **не шифруется** — не кладите туда пароли и персональные данные.
          - Ограничьте попытки входа (`express-rate-limit`).
          - Всегда HTTPS.
          - Проверяйте права **на сервере** для каждого ресурса: пользователь может менять только свои заказы (`where: { id, userId: req.user.sub }`).
          - Альтернативы самописной аутентификации: сессии в Redis, готовые решения (Auth.js, Lucia, Keycloak, Clerk), OAuth-вход через Google/GitHub/Яндекс.
