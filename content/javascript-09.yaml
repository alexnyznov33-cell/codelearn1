        homework:
          task: |
            Переведите «Каталог товаров» на PostgreSQL + Prisma: модели `Category`, `Product` (Decimal цена, связь с категорией), `Review` (рейтинг 1–5, связь с товаром), миграции, seed-скрипт (`prisma/seed.js`) с тестовыми данными. Репозиторий на Prisma: список с фильтрами и пагинацией (`count` + `findMany` в `$transaction`), товар с отзывами и средним рейтингом (`aggregate`), создание отзыва. Запуск через docker-compose (postgres + app).
          checklist:
            - Миграции в репозитории
            - Нет N+1
            - Пагинация с общим количеством
            - Есть seed
          solution: |
            // prisma/schema.prisma
            // model Category { id Int @id @default(autoincrement()) name String @unique products Product[] }
            // model Product {
            //   id Int @id @default(autoincrement())
            //   title String
            //   price Decimal @db.Decimal(10, 2)
            //   category Category @relation(fields: [categoryId], references: [id])
            //   categoryId Int
            //   reviews Review[]
            //   @@index([categoryId])
            // }
            // model Review { id Int @id @default(autoincrement()) rating Int text String product Product @relation(fields: [productId], references: [id]) productId Int }

            // repository.js
            import { PrismaClient } from "@prisma/client";
            export const prisma = new PrismaClient();

            export async function listProducts({ page = 1, limit = 10, category, minPrice, maxPrice }) {
              const where = {
                ...(category && { category: { name: category } }),
                price: { gte: minPrice ?? 0, ...(maxPrice && { lte: maxPrice }) },
              };
              const [total, data] = await prisma.$transaction([
                prisma.product.count({ where }),
                prisma.product.findMany({ where, include: { category: true }, skip: (page - 1) * limit, take: limit, orderBy: { title: "asc" } }),
              ]);
              return { data, meta: { page, limit, total, pages: Math.ceil(total / limit) } };
            }
            export async function getProduct(id) {
              const [product, rating] = await Promise.all([
                prisma.product.findUnique({ where: { id }, include: { reviews: true, category: true } }),
                prisma.review.aggregate({ where: { productId: id }, _avg: { rating: true }, _count: true }),
              ]);
              return product && { ...product, rating: rating._avg.rating, reviewsCount: rating._count };
            }
            export const addReview = (productId, { rating, text }) => prisma.review.create({ data: { productId, rating, text } });

            // prisma/seed.js
            const tea = await prisma.category.create({ data: { name: "tea" } });
            await prisma.product.createMany({ data: [
              { title: "Пуэр", price: 900, categoryId: tea.id },
              { title: "Улун", price: 650, categoryId: tea.id },
            ] });

            // docker-compose.yml
