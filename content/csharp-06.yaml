        homework:
          task: |
            Сделайте конвейер из трёх этапов на каналах: генератор URL (20 штук) → 3 «загрузчика» (Task.Delay 100–300 мс, результат — длина строки) → 1 «сохранитель», который пишет результаты пачками по 5 в консоль. Каналы bounded(5), корректное завершение всех этапов.
          checklist:
            - Каждый этап завершает свой выходной канал
            - Загрузчики завершают канал только когда все трое закончили
            - Последняя неполная пачка тоже сохраняется
          solution: |
            using System.Threading.Channels;

            var urls = Channel.CreateBounded<string>(5);
            var results = Channel.CreateBounded<(string Url, int Len)>(5);

            var gen = Task.Run(async () =>
            {
                for (int i = 1; i <= 20; i++) await urls.Writer.WriteAsync($"https://site/{i}");
                urls.Writer.Complete();
            });

            var loaders = Enumerable.Range(0, 3).Select(_ => Task.Run(async () =>
            {
                await foreach (var u in urls.Reader.ReadAllAsync())
                {
                    await Task.Delay(Random.Shared.Next(100, 300));
                    await results.Writer.WriteAsync((u, u.Length * 100));
                }
            })).ToArray();
            _ = Task.WhenAll(loaders).ContinueWith(_ => results.Writer.Complete());

            var batch = new List<(string, int)>();
            await foreach (var r in results.Reader.ReadAllAsync())
            {
                batch.Add(r);
                if (batch.Count == 5) { Console.WriteLine(string.Join(", ", batch)); batch.Clear(); }
            }
            if (batch.Count > 0) Console.WriteLine(string.Join(", ", batch));
            await gen;
