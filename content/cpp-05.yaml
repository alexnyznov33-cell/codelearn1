          - type: fill
            q: Отсортируйте пользователей по полю age с помощью проекции
            code: |
              std::ranges::sort(users, {}, &User::___);
            answers: ["age"]
          - type: choice
            q: Что значит «views ленивые»?
            options: ["Работают медленно", "Элементы вычисляются только при обходе, без промежуточных контейнеров", "Работают в отдельном потоке", "Копируют данные заранее"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
