            options: ["Ничем", "consteval-функция обязана вычисляться только при компиляции", "consteval быстрее в рантайме", "consteval только для классов"]
            answer: 1
          - type: choice
            q: Что верно для `const int x = readInput();`?
            options: ["x — constexpr", "x нельзя изменить, но значение известно только во время выполнения", "Ошибка компиляции", "x можно использовать как размер std::array"]
            answer: 1
        homework:
          task: |
            Сделайте на constexpr: (1) таблицу CRC32 из 256 элементов, вычисляемую при компиляции, и функцию `crc32(std::string_view)` (тоже constexpr) с `static_assert(crc32("hello") == 0x3610A686)`; (2) `consteval`-функцию проверки, что строка-литерал — допустимый идентификатор; (3) `constexpr` функцию `isPrime` и массив первых 100 простых.
          checklist:
            - Таблица вычислена в compile-time (constexpr переменная)
            - static_assert проходит
            - consteval выдаёт ошибку компиляции на неверный идентификатор
          solution: |
            #include <array>
            #include <cstdint>
            #include <string_view>

            constexpr auto makeCrcTable() {
                std::array<std::uint32_t, 256> t{};
                for (std::uint32_t i = 0; i < 256; ++i) {
                    std::uint32_t c = i;
                    for (int k = 0; k < 8; ++k) c = (c & 1) ? 0xEDB88320u ^ (c >> 1) : c >> 1;
                    t[i] = c;
                }
                return t;
            }
            constexpr auto kCrc = makeCrcTable();

            constexpr std::uint32_t crc32(std::string_view s) {
                std::uint32_t c = 0xFFFFFFFFu;
                for (char ch : s) c = kCrc[(c ^ static_cast<unsigned char>(ch)) & 0xFF] ^ (c >> 8);
                return c ^ 0xFFFFFFFFu;
            }
            static_assert(crc32("hello") == 0x3610A686u);

            consteval bool validIdent(std::string_view s) {
                if (s.empty() || (s[0] >= '0' && s[0] <= '9')) throw "bad identifier";   // throw → ошибка компиляции
                for (char c : s) if (!((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '_')) throw "bad identifier";
                return true;
            }
            static_assert(validIdent("user_id"));

            constexpr bool isPrime(int n) { if (n < 2) return false; for (int d = 2; d * d <= n; ++d) if (n % d == 0) return false; return true; }
            constexpr auto kPrimes = [] { std::array<int, 100> p{}; for (int n = 2, i = 0; i < 100; ++n) if (isPrime(n)) p[i++] = n; return p; }();
            static_assert(kPrimes[99] == 541);
      - id: cpp-05-05
        title: Концепты C++20
        minutes: 30
        xp: 40
        theory: |
          **Концепт** — именованное требование к параметру шаблона. Делает шаблоны читаемыми, а ошибки — понятными («тип не удовлетворяет `Sortable`» вместо 200 строк).

          ## Использование стандартных концептов

          ```cpp
          #include <concepts>

          template <std::integral T>              // только целые типы
          T gcd(T a, T b) { return b == 0 ? a : gcd(b, a % b); }

          gcd(12, 18);      // ok
          // gcd(1.5, 2.0); // ошибка: double не удовлетворяет std::integral

          // три эквивалентных формы
          template <typename T> requires std::floating_point<T> T half(T x) { return x / 2; }
          template <std::floating_point T> T half2(T x) { return x / 2; }
          auto half3(std::floating_point auto x) { return x / 2; }
          ```

          Популярные: `std::integral`, `std::floating_point`, `std::same_as<T, U>`, `std::convertible_to`, `std::derived_from<D, B>`, `std::invocable<F, Args...>`, `std::predicate`, `std::totally_ordered`, `std::copyable`, `std::movable`, `std::ranges::range`, `std::ranges::random_access_range`.

          ## Свой концепт

          ```cpp
          template <typename T>
          concept Shape = requires(const T& s) {
              { s.area() } -> std::convertible_to<double>;     // выражение валидно и тип подходит
              { s.name() } -> std::convertible_to<std::string>;
          };

          template <typename T>
          concept Numeric = std::integral<T> || std::floating_point<T>;

          template <typename T>
          concept Container = requires(T c) {
              typename T::value_type;                          // есть вложенный тип
              c.begin(); c.end(); c.size();
          };

          double totalArea(const std::vector<Circle>& v) requires Shape<Circle>;

          template <Shape S>
          void print(const S& s) { std::cout << s.name() << ": " << s.area() << "\n"; }
          ```

          Утиная типизация на этапе компиляции: `Circle` не наследует никакой интерфейс, ему достаточно иметь методы.

          ## Перегрузка по концептам

          ```cpp
          void describe(std::integral auto x)       { std::cout << "целое\n"; }
          void describe(std::floating_point auto x) { std::cout << "дробное\n"; }
          void describe(const Container auto& c)    { std::cout << "контейнер из " << c.size() << "\n"; }
          ```

          Компилятор выбирает самую «узкую» подходящую перегрузку (subsumption).

          ## requires-выражение в if constexpr

          ```cpp
          template <typename T>
          void save(const T& v) {
              if constexpr (requires { v.serialize(); }) v.serialize();
              else std::cout << v;
          }
          ```

          Концепты — замена старому SFINAE (`std::enable_if_t<...>`), которое вы ещё встретите в легаси-коде.
        practice:
          - type: fill
            q: Ограничьте шаблон целыми типами
            code: |
              template <std::___ T>
              T mod(T a, T b) { return a % b; }
            answers: ["integral"]
          - type: fill
            q: Объявите свой концепт
            code: |
