              void f(std::floating_point auto) { std::cout << "F"; }
              int main() { f(1); f(2.0); f('c'); }
            answer: IFI
            explain: char — целочисленный тип.
          - type: choice
            q: Что заменяют концепты из старого C++?
            options: ["Макросы", "SFINAE и std::enable_if", "Виртуальные функции", "Исключения"]
            answer: 1
        homework:
          task: |
            Определите концепты `Drawable` (метод `draw(std::ostream&) const`), `HasId` (поле/метод `id()` → целое), `Repository<R, T>` (методы `add(T)`, `find(int) -> std::optional<T>`). Напишите шаблонные функции `renderAll(const std::vector<T>&) requires Drawable<T>` и `InMemoryRepository<T> requires HasId<T>`. Убедитесь (static_assert), что ваш репозиторий удовлетворяет `Repository`, а тип без `id()` даёт понятную ошибку.
          checklist:
            - 3 своих концепта
            - static_assert(Repository<InMemoryRepository<User>, User>)
            - Перегрузка или ограничение по концепту
          solution: |
            #include <concepts>
            #include <iostream>
            #include <optional>
            #include <ostream>
            #include <unordered_map>
            #include <vector>

            template <class T> concept Drawable = requires(const T& t, std::ostream& os) { t.draw(os); };
            template <class T> concept HasId = requires(const T& t) { { t.id() } -> std::integral; };
            template <class R, class T> concept Repository = requires(R r, T t, int id) {
                r.add(t);
                { r.find(id) } -> std::same_as<std::optional<T>>;
            };

            template <Drawable T>
            void renderAll(const std::vector<T>& v) { for (const auto& x : v) x.draw(std::cout); }

            template <HasId T>
            class InMemoryRepository {
                std::unordered_map<int, T> items_;
            public:
                void add(T t) { auto id = static_cast<int>(t.id()); items_.insert_or_assign(id, std::move(t)); }
                std::optional<T> find(int id) const {
                    if (auto it = items_.find(id); it != items_.end()) return it->second;
                    return std::nullopt;
                }
            };

            struct User {
                int id_; std::string name;
                int id() const { return id_; }
                void draw(std::ostream& os) const { os << "User " << name << "\n"; }
            };

            static_assert(Repository<InMemoryRepository<User>, User>);
            static_assert(Drawable<User>);
            static_assert(!HasId<int>);
      - id: cpp-05-06
        title: Ranges C++20
        minutes: 30
        xp: 40
        theory: |
          **Ranges** — новое поколение алгоритмов STL: принимают контейнер целиком (без пары итераторов) и позволяют строить **ленивые конвейеры** через `|`.

          ## Алгоритмы ranges

          ```cpp
          #include <algorithm>
          #include <ranges>

          std::vector<int> v{5, 3, 8, 1};
          std::ranges::sort(v);                                   // вместо sort(v.begin(), v.end())
          auto it = std::ranges::find(v, 8);
          bool any = std::ranges::any_of(v, [](int x) { return x > 7; });

          struct User { std::string name; int age; };
          std::vector<User> users = ...;
          std::ranges::sort(users, {}, &User::age);              // проекция: сортировать по полю!
          auto oldest = std::ranges::max(users, {}, &User::age);
          ```

          ## Views — ленивые представления

          ```cpp
          namespace views = std::views;

          auto evensSquared = v
              | views::filter([](int x) { return x % 2 == 0; })
              | views::transform([](int x) { return x * x; });

          for (int x : evensSquared) std::cout << x << " ";      // вычисляется при обходе
          ```

          Views не копируют данные и не создают промежуточных контейнеров: каждый элемент проходит весь конвейер по требованию.

          ## Полезные views

          ```cpp
          views::iota(1, 11)                 // 1..10
          views::iota(1) | views::take(5)    // бесконечная последовательность, взять 5
          views::reverse                     // обратный порядок
          views::drop(2), views::take_while(pred), views::drop_while(pred)
          views::keys, views::values         // для map и пар
          views::split(' ')                  // разбить строку
          views::join                        // склеить вложенные диапазоны
          views::enumerate, views::zip, views::chunk(3), views::slide(2)   // C++23
          ```

          ```cpp
          std::map<std::string, int> m{{"a", 1}, {"b", 2}};
          for (const auto& k : m | views::keys) std::cout << k;

          // первые 5 простых чисел
          auto primes = views::iota(2) | views::filter(isPrime) | views::take(5);
          ```

          ## Материализация

          ```cpp
          auto vec = v | views::filter(pred) | std::ranges::to<std::vector>();   // C++23
          // C++20: std::vector<int> vec(r.begin(), r.end());   (для common_range)
          ```

          ## Подводные камни

          - View может ссылаться на контейнер — не возвращайте view на локальный вектор (висячая ссылка).
          - `filter` кеширует begin(), поэтому некоторые views нельзя итерировать через `const&`.
          - Ленивость: лямбда в `transform` вызывается при каждом обходе — не кладите туда побочные эффекты.
        practice:
