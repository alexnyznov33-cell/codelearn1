            options: ["Перемещение", "Ошибка компиляции", "Тихое копирование", "UB"]
            answer: 2
        homework:
          task: |
            Создайте класс `Image` (ширина, высота, `std::unique_ptr<uint8_t[]>` пикселей) с правилом пяти: глубокое копирование и noexcept-перемещение, счётчики копий/перемещений. Сравните время `std::vector<Image>` из 1000 изображений 1000×1000 при: push_back(img) — копия, push_back(std::move(img)), emplace_back(w, h). Объясните результаты.
          checklist:
            - Перемещение noexcept
            - Замеры через std::chrono
            - Объяснение разницы
          solution: |
            #include <chrono>
            #include <cstdint>
            #include <cstring>
            #include <iostream>
            #include <memory>
            #include <utility>
            #include <vector>

            class Image {
                int w_ = 0, h_ = 0;
                std::unique_ptr<std::uint8_t[]> px_;
            public:
                static inline int copies = 0, moves = 0;
                Image(int w, int h) : w_(w), h_(h), px_(new std::uint8_t[std::size_t(w) * h]{}) {}
                Image(const Image& o) : w_(o.w_), h_(o.h_), px_(new std::uint8_t[std::size_t(w_) * h_]) {
                    std::memcpy(px_.get(), o.px_.get(), std::size_t(w_) * h_); ++copies;
                }
                Image(Image&& o) noexcept : w_(std::exchange(o.w_, 0)), h_(std::exchange(o.h_, 0)), px_(std::move(o.px_)) { ++moves; }
                Image& operator=(Image o) noexcept { std::swap(w_, o.w_); std::swap(h_, o.h_); std::swap(px_, o.px_); return *this; }
                ~Image() = default;
            };

            template <class F> long long ms(F f) {
                auto t = std::chrono::steady_clock::now(); f();
                return std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::steady_clock::now() - t).count();
            }

            int main() {
                std::cout << "copy: " << ms([] { std::vector<Image> v; v.reserve(1000); for (int i = 0; i < 1000; ++i) { Image im(1000, 1000); v.push_back(im); } }) << "\n";
                std::cout << "move: " << ms([] { std::vector<Image> v; v.reserve(1000); for (int i = 0; i < 1000; ++i) { Image im(1000, 1000); v.push_back(std::move(im)); } }) << "\n";
                std::cout << "emplace: " << ms([] { std::vector<Image> v; v.reserve(1000); for (int i = 0; i < 1000; ++i) v.emplace_back(1000, 1000); }) << "\n";
                std::cout << Image::copies << " copies, " << Image::moves << " moves\n";
            }
      - id: cpp-05-03
        title: Perfect forwarding
        minutes: 30
        xp: 40
        theory: |
          Задача: написать обёртку, которая передаёт аргументы дальше **ровно в том виде**, в каком их получила (lvalue остаётся lvalue, rvalue — rvalue). Так работают `std::make_unique`, `emplace_back`, `std::thread`.

          ## Forwarding (universal) reference

          `T&&` в **шаблоне с выводом типа** — это не rvalue-ссылка, а «пересылающая ссылка»: она привязывается к чему угодно.

          ```cpp
          template <typename T>
          void wrapper(T&& arg) {          // T&& + вывод T = forwarding reference
              target(std::forward<T>(arg));
          }
          ```

          Правила сворачивания ссылок: передали lvalue типа `X` → `T = X&`, `T&& = X&`; передали rvalue → `T = X`, `T&& = X&&`.

          ## Почему нужен std::forward

          Внутри функции у параметра **есть имя**, значит он всегда lvalue — даже если объявлен как `&&`. `std::forward<T>(arg)` возвращает ему исходную категорию: rvalue для rvalue, lvalue для lvalue. (`std::move` превращал бы всё в rvalue — и мы бы «украли» у вызывающего его lvalue.)

          ```cpp
          void process(const std::string&) { std::cout << "lvalue\n"; }
          void process(std::string&&)      { std::cout << "rvalue\n"; }

          template <typename T>
          void relay(T&& x) { process(std::forward<T>(x)); }

          std::string s = "a";
          relay(s);                 // lvalue
          relay(std::string("b"));  // rvalue
          ```

          ## Своя фабрика

          ```cpp
          template <typename T, typename... Args>
          std::unique_ptr<T> make(Args&&... args) {
              return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
          }

          auto u = make<User>("Аня", 25);
          ```

          ## Где это НЕ forwarding reference

          ```cpp
          void f(std::string&& s);                  // обычная rvalue-ссылка (нет вывода)
          template <typename T> void g(std::vector<T>&& v);  // rvalue-ссылка на vector
          template <typename T> struct W { void h(T&& x); }; // T уже известен из класса — rvalue-ссылка
          auto&& x = expr;                          // forwarding (как в range-for: for (auto&& e : range))
          ```

          ## Подводные камни

          - Не используйте аргумент после `std::forward` — он мог быть перемещён.
          - Перегрузка функции с forwarding reference «жадно» перехватывает почти все вызовы (в т.ч. неконстантные lvalue, предпочтя их копирующему конструктору). Ограничивайте концептами.
        practice:
          - type: choice
            q: В каком случае `T&&` — forwarding reference?
            options: ["void f(std::string&& s)", "template <class T> void f(T&& x)", "template <class T> void f(std::vector<T>&& v)", "Всегда"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              void p(int&) { std::cout << "L"; }
              void p(int&&) { std::cout << "R"; }
              template <class T> void relay(T&& x) { p(std::forward<T>(x)); }
              int main() {
                  int a = 1;
                  relay(a);
                  relay(2);
              }
            answer: LR
          - type: output
            q: Что выведет код (forward не используется)?
            code: |
              void p(int&) { std::cout << "L"; }
              void p(int&&) { std::cout << "R"; }
              template <class T> void relay(T&& x) { p(x); }
              int main() { relay(5); }
            answer: L
            explain: Именованный параметр — всегда lvalue.
          - type: fill
            q: Передайте все аргументы дальше без потери категории
            code: |
              return T(std::forward<___>(args)...);
            answers: ["Args"]
        homework:
          task: |
            Напишите: (1) `template <class F, class... Args> auto timed(F&& f, Args&&... args)` — вызывает f с идеальной передачей аргументов, печатает время и возвращает результат (`decltype(auto)`); (2) свою `emplace`-подобную функцию для `std::vector<T>` → `T& emplaceTo(std::vector<T>&, Args&&...)`; (3) тест с классом, у которого счётчики копий/перемещений, доказывающий отсутствие лишних копий.
          checklist:
            - Используется std::forward
            - Возврат через decltype(auto) или auto
            - Тест показывает 0 лишних копий
          solution: |
            #include <chrono>
            #include <iostream>
            #include <string>
            #include <utility>
            #include <vector>

            template <class F, class... Args>
            decltype(auto) timed(F&& f, Args&&... args) {
                auto t = std::chrono::steady_clock::now();
                struct Report { std::chrono::steady_clock::time_point t;
                    ~Report() { std::cout << std::chrono::duration<double, std::milli>(std::chrono::steady_clock::now() - t).count() << " ms\n"; } } r{t};
                return std::forward<F>(f)(std::forward<Args>(args)...);
            }

            template <class T, class... Args>
            T& emplaceTo(std::vector<T>& v, Args&&... args) { return v.emplace_back(std::forward<Args>(args)...); }

            struct Tracked {
                static inline int copies = 0, moves = 0;
                std::string s;
                explicit Tracked(std::string x) : s(std::move(x)) {}
                Tracked(const Tracked& o) : s(o.s) { ++copies; }
                Tracked(Tracked&& o) noexcept : s(std::move(o.s)) { ++moves; }
            };

            int main() {
                std::vector<Tracked> v; v.reserve(10);
                emplaceTo(v, std::string("abc"));
                auto len = timed([](const Tracked& t) { return t.s.size(); }, v[0]);
                std::cout << len << " copies=" << Tracked::copies << "\n";   // copies=0
            }
      - id: cpp-05-04
        title: constexpr и вычисления на этапе компиляции
        minutes: 30
        xp: 40
        theory: |
          `constexpr` позволяет выполнять код **во время компиляции**. Результат «зашивается» в бинарник: нулевые затраты во время выполнения и проверка ошибок компилятором.

          ## constexpr-переменные и функции

          ```cpp
          constexpr int square(int x) { return x * x; }

          constexpr int N = square(12);        // 144 — вычислено компилятором
          std::array<int, square(4)> arr;      // размер массива из функции
          static_assert(square(3) == 9);       // проверка на этапе компиляции

          int n; std::cin >> n;
          int r = square(n);                   // та же функция работает и в рантайме
          ```

          С C++14/20 в constexpr-функциях можно использовать циклы, `if`, локальные переменные, `std::vector`/`std::string` (C++20, если память освобождается внутри вычисления), виртуальные функции, try (без throw во время константного вычисления).

          ```cpp
          constexpr unsigned long long factorial(int n) {
              unsigned long long r = 1;
              for (int i = 2; i <= n; ++i) r *= i;
              return r;
          }
          static_assert(factorial(20) == 2432902008176640000ULL);

          constexpr auto makeTable() {
              std::array<int, 10> t{};
              for (int i = 0; i < 10; ++i) t[i] = i * i;
              return t;
          }
          constexpr auto kSquares = makeTable();   // таблица готова до запуска программы
          ```

          ## consteval и constinit (C++20)

          - `consteval` — функция **обязана** вычисляться на этапе компиляции (immediate function).
          - `constinit` — переменная инициализируется на этапе компиляции, но потом может изменяться (решает «static initialization order fiasco»).

          ```cpp
          consteval int compileTimeOnly(int x) { return x * 2; }
          constinit int counter = compileTimeOnly(21);
          ```

          ## if constexpr

          Ветка выбирается при компиляции, «лишняя» ветка даже не инстанцируется:

          ```cpp
          template <typename T>
          auto len(const T& v) {
              if constexpr (requires { v.size(); }) return v.size();
              else return sizeof(T);
          }
          ```

          ## const vs constexpr

          `const` — «не изменю», значение может быть известно только в рантайме (`const int x = readInput();`). `constexpr` — значение известно компилятору.

          ## Практика

          Используйте для: констант и таблиц (CRC, синусы), проверок `static_assert` (размеры структур, параметры шаблонов), парсинга форматов на этапе компиляции (`std::format` проверяет строку формата так), устранения «магических чисел».
        practice:
          - type: fill
            q: Проверьте условие на этапе компиляции
            code: |
              ___(sizeof(int) == 4, "нужен 32-битный int");
            answers: ["static_assert"]
          - type: choice
            q: Можно ли вызвать constexpr-функцию с аргументом, введённым пользователем?
            options: ["Нет, ошибка компиляции", "Да, она выполнится во время работы программы", "Только в Debug", "Только с consteval"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              constexpr int fib(int n) { return n < 2 ? n : fib(n - 1) + fib(n - 2); }
              int main() {
                  constexpr int f = fib(10);
                  std::cout << f;
              }
            answer: "55"
          - type: choice
