              int s = 0;
              for (int x : r) s += x;
              std::cout << s;
            answer: "15"
        homework:
          task: |
            Перепишите задачу «статистика сотрудников» из урока про алгоритмы на ranges: сортировка по проекциям, конвейеры views (имена IT-отдела в верхнем регистре, зарплаты выше средней, первые 3 по возрасту). Дополнительно: разбейте строку CSV через `views::split` и сложите числа; сгенерируйте таблицу умножения 1..9 через `views::iota` и вложенный transform.
          checklist:
            - Нет ручных циклов для фильтрации/преобразований
            - Используются проекции
            - Нет висячих view
          solution: |
            #include <algorithm>
            #include <cctype>
            #include <iostream>
            #include <numeric>
            #include <ranges>
            #include <string>
            #include <string_view>
            #include <vector>

            struct Employee { std::string name, dept; double salary; int age; };
            namespace views = std::views;

            int main() {
                std::vector<Employee> e{{"anya", "IT", 250000, 28}, {"bob", "HR", 90000, 45}, {"vika", "IT", 310000, 35}};
                std::ranges::sort(e, std::ranges::greater{}, &Employee::salary);

                auto upper = [](std::string s) { for (auto& c : s) c = static_cast<char>(std::toupper(static_cast<unsigned char>(c))); return s; };
                for (const auto& n : e | views::filter([](const auto& x) { return x.dept == "IT"; })
                                       | views::transform(&Employee::name) | views::transform(upper))
                    std::cout << n << " ";

                double avg = std::accumulate(e.begin(), e.end(), 0.0, [](double s, const auto& x) { return s + x.salary; }) / e.size();
                for (const auto& x : e | views::filter([avg](const auto& x) { return x.salary > avg; })) std::cout << "\n" << x.name;

                std::string_view csv = "10,20,30,40";
                int sum = 0;
                for (auto part : csv | views::split(',')) sum += std::stoi(std::string(part.begin(), part.end()));
                std::cout << "\n" << sum << "\n";

                for (int i : views::iota(1, 10)) {
                    for (int p : views::iota(1, 10) | views::transform([i](int j) { return i * j; })) std::cout << p << '\t';
                    std::cout << '\n';
                }
            }
