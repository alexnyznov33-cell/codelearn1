          - type: bug
            q: Какая строка мешает компилятору оптимизировать возврат (RVO)?
            code: |
              std::vector<int> build() {
                  std::vector<int> result;
                  result.push_back(1);
                  return std::move(result);
              }
            bugLine: 4
