id: cpp
modules:
  - id: cpp-m5
    title: Шаблоны и современный C++
    level: Junior+
    lessons:
      - id: cpp-05-01
        title: Шаблоны функций и классов
        minutes: 35
        xp: 40
        theory: |
          **Шаблон** — «рецепт», по которому компилятор генерирует код для конкретных типов (инстанцирование). Это статический полиморфизм без накладных расходов во время выполнения.

          ## Шаблон функции

          ```cpp
          template <typename T>
          T maxOf(T a, T b) { return a > b ? a : b; }

          maxOf(3, 7);            // T = int (выведен автоматически)
          maxOf(2.5, 1.0);        // T = double
          maxOf<double>(3, 2.5);  // явно
          // maxOf(3, 2.5);       // ❌ T не выводится однозначно

          // C++20: сокращённый синтаксис
          auto add(auto a, auto b) { return a + b; }
          ```

          ## Шаблон класса

          ```cpp
          template <typename T, std::size_t N>
          class StaticStack {
              std::array<T, N> data_{};
              std::size_t size_ = 0;
          public:
              void push(const T& v) {
                  if (size_ == N) throw std::overflow_error("full");
                  data_[size_++] = v;
              }
              T pop() { return data_[--size_]; }
              bool empty() const { return size_ == 0; }
          };

          StaticStack<int, 16> s;
          std::pair p{1, "a"};          // CTAD (C++17): тип выведен из аргументов
          ```

          Параметры шаблона: типы (`typename T`), значения (`std::size_t N`), шаблоны.

          ## Специализация

          ```cpp
          template <typename T> std::string describe(T) { return "что-то"; }
          template <> std::string describe<bool>(bool b) { return b ? "да" : "нет"; }   // полная

          template <typename T> struct Box { T v; };
          template <typename T> struct Box<T*> { T* v; bool isNull() const { return !v; } };  // частичная
          ```

          ## Где писать код шаблонов

          Шаблоны определяются **в заголовочных файлах** целиком — компилятор должен видеть тело при инстанцировании в каждом .cpp.

          ## Вариативные шаблоны

          ```cpp
          template <typename... Args>
          void print(const Args&... args) {
              ((std::cout << args << ' '), ...);   // fold expression (C++17)
              std::cout << '\n';
          }
          print(1, "два", 3.0);

          template <typename... Ts>
          auto sum(Ts... xs) { return (xs + ... + 0); }
          ```

          ## if constexpr

          ```cpp
          template <typename T>
          std::string toString(const T& v) {
              if constexpr (std::is_arithmetic_v<T>) return std::to_string(v);
              else return std::string(v);          // ветка не компилируется для чисел
          }
          ```

          Ошибки в шаблонах исторически ужасно длинные — концепты C++20 (урок 5) это исправляют.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              template <typename T>
              T twice(T x) { return x + x; }
              int main() {
                  std::cout << twice(21) << " " << twice(std::string("ab"));
              }
            answer: 42 abab
          - type: output
