              ___ Printable = requires(T x) { std::cout << x; };
            answers: ["concept"]
          - type: choice
            q: Главная польза концептов?
            options: ["Ускорение работы программы", "Понятные требования и сообщения об ошибках в шаблонах", "Динамический полиморфизм", "Сборка мусора"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
