            code: |
              template <typename T> int kind(T) { return 1; }
              template <> int kind<char>(char) { return 2; }
              int main() { std::cout << kind(5) << kind('x'); }
            answer: "12"
        homework:
          task: |
            Реализуйте шаблонный класс `RingBuffer<T, N>` (кольцевой буфер фиксированного размера на std::array): `push` (перезаписывает самый старый при переполнении), `pop` → `std::optional<T>`, `size`, `full`, итерация от старого к новому через метод `forEach(F f)`. Плюс вариативная функция `log(const Args&...)` с разделителем через fold expression.
          checklist:
            - N — параметр-значение шаблона
            - Работает с int и std::string
            - Fold expression в log
          solution: |
            #include <array>
            #include <iostream>
            #include <optional>
            #include <string>

            template <typename T, std::size_t N>
            class RingBuffer {
                std::array<T, N> d_{};
                std::size_t head_ = 0, size_ = 0;
            public:
                void push(T v) {
                    d_[(head_ + size_) % N] = std::move(v);
                    if (size_ == N) head_ = (head_ + 1) % N; else ++size_;
                }
                std::optional<T> pop() {
                    if (size_ == 0) return std::nullopt;
                    T v = std::move(d_[head_]);
                    head_ = (head_ + 1) % N; --size_;
                    return v;
                }
                std::size_t size() const { return size_; }
                bool full() const { return size_ == N; }
                template <typename F> void forEach(F f) const { for (std::size_t i = 0; i < size_; ++i) f(d_[(head_ + i) % N]); }
            };

            template <typename... Args>
            void log(const Args&... a) { std::size_t i = 0; ((std::cout << (i++ ? " | " : "") << a), ...); std::cout << '\n'; }

            int main() {
                RingBuffer<int, 3> rb;
                for (int i = 1; i <= 5; ++i) rb.push(i);
                rb.forEach([](int x) { std::cout << x << ' '; });   // 3 4 5
                log("итог", rb.size(), rb.full());
            }
      - id: cpp-05-02
        title: Move-семантика
        minutes: 35
        xp: 45
        theory: |
          До C++11 возврат и передача больших объектов означали копирование. **Перемещение** позволяет «забрать» ресурсы у объекта, который больше не нужен, за O(1).

          ## lvalue и rvalue

          - **lvalue** — у выражения есть имя/адрес: `x`, `v[0]`, `*p`.
          - **rvalue** — временное значение: `42`, `a + b`, `std::string("tmp")`, результат функции по значению.

          `T&&` — rvalue-ссылка, привязывается к временным объектам.

          ```cpp
          void f(std::string& s);    // принимает lvalue
          void f(std::string&& s);   // принимает rvalue — можно «украсть» содержимое

          std::string a = "hello";
          f(a);                      // lvalue-версия
          f(a + "!");                // rvalue-версия
          f(std::move(a));           // rvalue-версия: мы разрешили забрать a
          ```

          ## std::move ничего не перемещает

          `std::move(x)` — это просто **приведение** к `T&&` («можно забрать»). Само перемещение делает конструктор/оператор перемещения.

          После перемещения объект в **валидном, но неуказанном состоянии**: его можно уничтожить или присвоить новое значение, но не стоит полагаться на содержимое.

          ```cpp
          std::vector<std::string> names;
          std::string name = "очень длинное имя ...";
          names.push_back(std::move(name));      // без копирования буфера
          // name теперь (скорее всего) пуст — не используйте его

          std::vector<int> big(1'000'000);
          auto other = std::move(big);           // O(1): переставили 3 указателя
          ```

          ## Когда move не нужен

          ```cpp
          std::vector<int> make() {
              std::vector<int> v(1000);
              return v;            // ✅ RVO/NRVO или неявный move
              // return std::move(v);  // ❌ мешает RVO (copy elision)
          }
          ```

          Не используйте `std::move` для `const`-объектов (тихо будет копирование) и для простых типов (`int`).

          ## Передача «по значению + move»

          ```cpp
          class User {
              std::string name_;
          public:
              explicit User(std::string name) : name_(std::move(name)) {}   // одна идиома для lvalue и rvalue
          };
          User u1("Аня");             // строка создаётся и перемещается
          std::string n = "Боб";
          User u2(n);                 // копия в параметр + move в поле
          ```

          ## Только перемещаемые типы

          `std::unique_ptr`, `std::thread`, `std::fstream`, `std::jthread` — копировать нельзя, перемещать можно.

          ## emplace_back

          ```cpp
          v.emplace_back("Аня", 25);   // объект конструируется прямо в векторе, без временного
          ```
        practice:
          - type: choice
            q: Что делает std::move?
            options: ["Перемещает объект в другую память", "Приводит выражение к rvalue-ссылке, разрешая перемещение", "Удаляет объект", "Копирует объект быстрее"]
            answer: 1
          - type: choice
            q: Какое выражение — rvalue?
