        homework:
          task: |
            Смоделируйте сцену игры: `class Scene` владеет объектами `std::vector<std::unique_ptr<Entity>>`; `TextureCache` хранит `std::unordered_map<std::string, std::weak_ptr<Texture>>` и выдаёт `shared_ptr` (загружает заново, если текстура уже удалена); у сущностей — `shared_ptr<Texture>`. Деструкторы выводят сообщения — проверьте, что все объекты удаляются и текстура грузится один раз при общем использовании.
          checklist:
            - Нет new/delete
            - Кеш не продлевает жизнь текстур (weak_ptr)
            - Деструкторы вызываются для всех объектов
          solution: |
            #include <iostream>
            #include <memory>
            #include <string>
            #include <unordered_map>
            #include <vector>

            struct Texture {
                std::string name;
                explicit Texture(std::string n) : name(std::move(n)) { std::cout << "load " << name << "\n"; }
                ~Texture() { std::cout << "unload " << name << "\n"; }
            };

            class TextureCache {
                std::unordered_map<std::string, std::weak_ptr<Texture>> cache;
            public:
                std::shared_ptr<Texture> get(const std::string& name) {
                    if (auto t = cache[name].lock()) return t;
                    auto t = std::make_shared<Texture>(name);
                    cache[name] = t;
                    return t;
                }
            };

            struct Entity {
                std::string name; std::shared_ptr<Texture> tex;
                ~Entity() { std::cout << "~" << name << "\n"; }
            };

            struct Scene { std::vector<std::unique_ptr<Entity>> items; };

            int main() {
                TextureCache cache;
                {
                    Scene s;
                    s.items.push_back(std::make_unique<Entity>(Entity{"orc1", cache.get("orc.png")}));
                    s.items.push_back(std::make_unique<Entity>(Entity{"orc2", cache.get("orc.png")}));
                }   // все удалены, текстура выгружена
                cache.get("orc.png");  // загрузится снова
            }
      - id: cpp-02-06
        title: RAII
        minutes: 30
        xp: 40
        theory: |
          **RAII** (Resource Acquisition Is Initialization) — главная идиома C++: ресурс захватывается в **конструкторе** объекта и освобождается в **деструкторе**. Деструктор вызывается автоматически при выходе из области видимости — даже при исключении.

          ```cpp
          class File {
              std::FILE* f;
          public:
              explicit File(const char* path) : f(std::fopen(path, "r")) {
                  if (!f) throw std::runtime_error("Не открыть файл");
              }
              ~File() { std::fclose(f); }

              File(const File&) = delete;              // запрет копирования (иначе двойной fclose)
              File& operator=(const File&) = delete;

              std::FILE* get() const { return f; }
          };

          void read() {
              File file("data.txt");
              parse(file.get());     // если parse бросит исключение — файл всё равно закроется
          }
          ```

          ## RAII в стандартной библиотеке

          | Ресурс | RAII-класс |
          |---|---|
          | Память | `std::vector`, `std::string`, `unique_ptr`, `shared_ptr` |
          | Файлы | `std::ifstream`, `std::ofstream` |
          | Мьютексы | `std::lock_guard`, `std::unique_lock`, `std::scoped_lock` |
          | Потоки | `std::jthread` (сам делает join) |

          ```cpp
          {
              std::lock_guard lock(mtx);    // захват мьютекса
              shared_data++;
          }                                 // автоматическое освобождение
          ```

          ## Порядок уничтожения

          Локальные объекты уничтожаются в порядке, **обратном** созданию. Члены класса — в порядке, обратном объявлению.

          ## Свой scope guard

          ```cpp
          template <class F>
          struct ScopeExit {
              F f;
              ~ScopeExit() { f(); }
          };

          {
              auto start = now();
              ScopeExit guard{[&] { log(now() - start); }};
              work();
          }   // лог выполнится при любом выходе
          ```

          ## unique_ptr с собственным удалителем

          ```cpp
          auto file = std::unique_ptr<std::FILE, decltype(&std::fclose)>(std::fopen("a.txt", "w"), &std::fclose);
          ```

          ## Почему это важно

          В C++ нет `finally` и сборщика мусора — RAII решает обе задачи детерминированно: вы точно знаете, **когда** ресурс освободится. Это делает код безопасным при исключениях (exception safety).

          > ⚠️ Деструкторы не должны бросать исключения (они по умолчанию `noexcept`). Исключение из деструктора во время раскрутки стека → `std::terminate`.
