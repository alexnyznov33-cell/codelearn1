        homework:
          task: |
            Напишите RAII-обёртки: (1) `Timer` — в деструкторе печатает время жизни блока; (2) `TempFile` — создаёт файл со случайным именем в конструкторе и удаляет в деструкторе (`std::filesystem::remove`), поддерживает перемещение, но не копирование; (3) `ScopeExit` с лямбдой. Покажите, что при исключении все ресурсы освобождаются.
          checklist:
            - Копирование TempFile запрещено, перемещение работает
            - Деструкторы noexcept
            - Демонстрация с исключением
          solution: |
            #include <chrono>
            #include <filesystem>
            #include <fstream>
            #include <iostream>
            #include <random>
            #include <string>

            namespace fs = std::filesystem;

            class Timer {
                std::string name; std::chrono::steady_clock::time_point t0 = std::chrono::steady_clock::now();
            public:
                explicit Timer(std::string n) : name(std::move(n)) {}
                ~Timer() {
                    auto ms = std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::steady_clock::now() - t0).count();
                    std::cout << name << ": " << ms << " ms\n";
                }
            };

            class TempFile {
                fs::path p;
            public:
                TempFile() : p(fs::temp_directory_path() / ("tmp" + std::to_string(std::random_device{}()))) { std::ofstream(p) << ""; }
                ~TempFile() { if (!p.empty()) { std::error_code ec; fs::remove(p, ec); } }
                TempFile(const TempFile&) = delete;
                TempFile& operator=(const TempFile&) = delete;
                TempFile(TempFile&& o) noexcept : p(std::move(o.p)) { o.p.clear(); }
                const fs::path& path() const { return p; }
            };

            template <class F> struct ScopeExit { F f; ~ScopeExit() { f(); } };

            int main() {
                try {
                    Timer t("block");
                    TempFile tmp;
                    ScopeExit g{[] { std::cout << "cleanup\n"; }};
                    throw std::runtime_error("boom");
                } catch (const std::exception& e) { std::cout << e.what() << "\n"; }
            }
