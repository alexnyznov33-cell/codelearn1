        homework:
          task: |
            Напишите парсер конфигурации формата `key = value` (строки, комментарии `#`, пустые строки) на `std::string_view`: функции `trim(std::string_view)`, `split(std::string_view, char) -> std::vector<std::string_view>`, `parseLine(std::string_view) -> std::optional<std::pair<std::string_view, std::string_view>>`. Результат сохраните в `std::map<std::string, std::string>` (здесь копирование нужно — данные должны жить). Плюс функция статистики `std::span<const int>` → min/max/avg.
          checklist:
            - Разбор без лишних аллокаций
            - Висячих view нет — в map хранятся std::string
            - Обрабатываются комментарии и пробелы
          solution: |
            #include <map>
            #include <optional>
            #include <span>
            #include <string>
            #include <string_view>
            #include <vector>

            std::string_view trim(std::string_view s) {
                auto b = s.find_first_not_of(" \t\r");
                if (b == std::string_view::npos) return {};
                auto e = s.find_last_not_of(" \t\r");
                return s.substr(b, e - b + 1);
            }

            std::vector<std::string_view> split(std::string_view s, char d) {
                std::vector<std::string_view> out;
                std::size_t start = 0;
                for (std::size_t i = 0; i <= s.size(); ++i)
                    if (i == s.size() || s[i] == d) { out.push_back(s.substr(start, i - start)); start = i + 1; }
                return out;
            }

            std::optional<std::pair<std::string_view, std::string_view>> parseLine(std::string_view line) {
                if (auto h = line.find('#'); h != std::string_view::npos) line = line.substr(0, h);
                line = trim(line);
                auto eq = line.find('=');
                if (line.empty() || eq == std::string_view::npos) return std::nullopt;
                return std::pair{trim(line.substr(0, eq)), trim(line.substr(eq + 1))};
            }

            std::map<std::string, std::string> parseConfig(std::string_view text) {
                std::map<std::string, std::string> cfg;
                for (auto line : split(text, '\n'))
                    if (auto kv = parseLine(line)) cfg.emplace(std::string(kv->first), std::string(kv->second));
                return cfg;
            }
      - id: cpp-04-06
        title: Исключения
        minutes: 30
        xp: 35
        theory: |
          ```cpp
          #include <stdexcept>

          double divide(double a, double b) {
              if (b == 0) throw std::invalid_argument("Деление на ноль");
              return a / b;
          }

          try {
              divide(1, 0);
          }
          catch (const std::invalid_argument& e) {     // ловить ПО КОНСТАНТНОЙ ССЫЛКЕ
              std::cerr << "Ошибка аргумента: " << e.what() << "\n";
          }
          catch (const std::exception& e) {             // базовый класс всех стандартных
              std::cerr << e.what() << "\n";
          }
          catch (...) {                                 // всё остальное
              std::cerr << "Неизвестная ошибка\n";
              throw;                                    // пробросить дальше
          }
          ```

          ## Иерархия

          `std::exception` → `std::logic_error` (`invalid_argument`, `out_of_range`, `length_error`) и `std::runtime_error` (`overflow_error`, `system_error`), а также `std::bad_alloc`, `std::bad_cast`, `std::bad_optional_access`.

          ## Свои исключения

          ```cpp
          class InsufficientFunds : public std::runtime_error {
          public:
              explicit InsufficientFunds(double need)
                  : std::runtime_error("Не хватает " + std::to_string(need)), need_(need) {}
              double need() const noexcept { return need_; }
          private:
              double need_;
          };
          ```

          ## Раскрутка стека

          При исключении вызываются деструкторы всех локальных объектов на пути — поэтому RAII делает код безопасным. Ресурсы, захваченные «вручную» без RAII, утекут.

          ## noexcept

          ```cpp
          void swap(Buffer& a, Buffer& b) noexcept;   // обещание не бросать
          ```

          Если noexcept-функция всё же бросит → `std::terminate`. Деструкторы, move-операции и `swap` должны быть `noexcept`.

          ## Гарантии безопасности исключений

          - **No-throw** — никогда не бросает.
          - **Strong** — при исключении состояние не меняется (транзакционность; copy-and-swap).
          - **Basic** — инварианты сохранены, утечек нет, но состояние может измениться.

          ## Когда использовать

          - Исключения — для **исключительных** ситуаций (нет файла конфигурации, нарушен контракт).
          - Ожидаемые неудачи (пользователь ввёл не число) — `std::optional` / `std::expected` / коды ошибок.
          - В некоторых областях (геймдев, embedded, Google style) исключения отключают (`-fno-exceptions`).
          - Никогда не ловите по значению: `catch (std::exception e)` — срезка и копия.
