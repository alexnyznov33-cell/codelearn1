        homework:
          task: |
            Напишите калькулятор выражений из токенов: `using Token = std::variant<double, char>` (число или оператор). Функция `std::optional<std::vector<Token>> tokenize(std::string_view)` (nullopt при недопустимом символе), функция `std::optional<double> evaluate(const std::vector<Token>&)` для выражений без скобок с приоритетом `* /` над `+ -` (nullopt при делении на 0 или некорректной последовательности). Используйте std::visit с overloaded.
          checklist:
            - Нет исключений для ошибок пользователя
            - std::visit с overloaded
            - Приоритет операций соблюдён
          solution: |
            #include <cctype>
            #include <iostream>
            #include <optional>
            #include <string>
            #include <string_view>
            #include <variant>
            #include <vector>

            using Token = std::variant<double, char>;
            template <class... Ts> struct overloaded : Ts... { using Ts::operator()...; };

            std::optional<std::vector<Token>> tokenize(std::string_view s) {
                std::vector<Token> out;
                for (std::size_t i = 0; i < s.size();) {
                    char c = s[i];
                    if (std::isspace(static_cast<unsigned char>(c))) { ++i; continue; }
                    if (std::isdigit(static_cast<unsigned char>(c)) || c == '.') {
                        std::size_t j = i;
                        while (j < s.size() && (std::isdigit(static_cast<unsigned char>(s[j])) || s[j] == '.')) ++j;
                        out.emplace_back(std::stod(std::string(s.substr(i, j - i))));
                        i = j;
                    } else if (std::string_view("+-*/").find(c) != std::string_view::npos) { out.emplace_back(c); ++i; }
                    else return std::nullopt;
                }
                return out;
            }

            std::optional<double> evaluate(const std::vector<Token>& t) {
                std::vector<double> terms; std::vector<char> ops; bool expectNum = true; bool bad = false;
                for (const auto& tok : t) std::visit(overloaded{
                    [&](double d) {
                        if (!expectNum) { bad = true; return; }
                        if (!ops.empty() && (ops.back() == '*' || ops.back() == '/')) {
                            char op = ops.back(); ops.pop_back();
                            if (op == '/' && d == 0) { bad = true; return; }
                            terms.back() = op == '*' ? terms.back() * d : terms.back() / d;
                        } else terms.push_back(d);
                        expectNum = false;
                    },
                    [&](char op) { if (expectNum) { bad = true; return; } ops.push_back(op); expectNum = true; }
                }, tok);
                if (bad || expectNum) return std::nullopt;
                double r = terms[0];
                for (std::size_t i = 0; i < ops.size(); ++i) r = ops[i] == '+' ? r + terms[i + 1] : r - terms[i + 1];
                return r;
            }

            int main() {
                if (auto t = tokenize("2 + 3 * 4 - 10 / 5"))
                    std::cout << evaluate(*t).value_or(0.0) << "\n";   // 12
            }
      - id: cpp-04-05
        title: string_view и span
        minutes: 25
        xp: 35
        theory: |
          Невладеющие «представления» (views) позволяют передавать данные без копирования.

          ## std::string_view (C++17)

          Пара «указатель + длина» на чужие символы. Не владеет памятью, не выделяет её.

          ```cpp
          #include <string_view>

          // принимает и std::string, и "литерал", и char* — без копий
          bool startsWithHttp(std::string_view url) {
              return url.starts_with("http");        // C++20
          }

          std::string_view sv = "key=value";
          auto pos = sv.find('=');
          std::string_view key = sv.substr(0, pos);   // не создаёт новую строку!
          std::string_view val = sv.substr(pos + 1);
          sv.remove_prefix(4);                         // сдвиг начала
          ```

          Сравните: `std::string::substr` выделяет память, `string_view::substr` — нет.

          **Правило параметров:** для функции, которая только читает строку — `std::string_view` (по значению). Если функция сохраняет строку у себя — принимайте `std::string` по значению и `std::move`.

          ## Опасность — висячие view

          ```cpp
          std::string_view bad() {
              std::string s = "temp";
              return s;              // ❌ s уничтожена, view указывает в никуда
          }
          std::string_view v = std::string("tmp");  // ❌ временная строка умрёт в конце выражения
          ```

          string_view не гарантирует нулевой терминатор — нельзя передавать `sv.data()` в C-функции, ожидающие `const char*`.

          ## std::span<T> (C++20)

          То же для непрерывных последовательностей любых элементов: массивов, `vector`, `array`.

          ```cpp
          #include <span>

          double average(std::span<const double> data) {
              double s = 0;
              for (double x : data) s += x;
              return data.empty() ? 0 : s / data.size();
          }

          std::vector<double> v{1, 2, 3};
          double arr[] = {4, 5};
          std::array<double, 3> a{7, 8, 9};
          average(v); average(arr); average(a);
          average(std::span(v).subspan(1));         // часть без копирования

          void fill(std::span<int> out) { for (auto& x : out) x = 0; }   // можно менять
          ```

          `span` заменяет устаревшую пару параметров `(T* ptr, size_t n)` и знает свой размер.

          | Владеет | Не владеет (view) |
          |---|---|
          | `std::string` | `std::string_view` |
          | `std::vector<T>` | `std::span<T>` |
          | `unique_ptr<T>` | `T*`, `T&` |
        practice:
          - type: output
            q: Что выведет код?
            code: |
