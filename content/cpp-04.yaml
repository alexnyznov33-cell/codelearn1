id: cpp
modules:
  - id: cpp-m4
    title: Стандартная библиотека
    level: Junior+
    lessons:
      - id: cpp-04-01
        title: Итераторы
        minutes: 25
        xp: 30
        theory: |
          **Итератор** — обобщённый указатель на элемент контейнера. Через итераторы алгоритмы STL работают с любыми контейнерами одинаково.

          ```cpp
          std::vector<int> v{10, 20, 30};
          for (auto it = v.begin(); it != v.end(); ++it)
              std::cout << *it << " ";

          // end() указывает ЗА последний элемент — разыменовывать нельзя
          auto it = v.begin() + 1;   // 20
          *it = 25;
          ```

          Range-for `for (auto& x : v)` — синтаксический сахар над `begin()/end()`.

          ## Варианты

          | | |
          |---|---|
          | `begin()/end()` | обычные |
          | `cbegin()/cend()` | только чтение (`const_iterator`) |
          | `rbegin()/rend()` | обратный обход |

          ```cpp
          for (auto it = v.rbegin(); it != v.rend(); ++it) std::cout << *it;  // 30 25 10
          ```

          ## Категории итераторов

          | Категория | Возможности | Контейнеры |
          |---|---|---|
          | input / forward | `++`, `*` | `forward_list`, `unordered_*` |
          | bidirectional | + `--` | `list`, `set`, `map` |
          | random access | + `it + n`, `it[n]`, `<` | `vector`, `deque`, `array` |
          | contiguous (C++20) | память подряд | `vector`, `array`, `string` |

          Поэтому `std::sort` работает с `vector`, но не с `list` (у `list` есть свой `list.sort()`).

          ```cpp
          std::advance(it, 3);              // сдвинуть на 3 (для любых итераторов)
          auto n = std::distance(a, b);     // расстояние
          auto nx = std::next(it), pv = std::prev(it);
          ```

          ## Инвалидация

          Изменение контейнера может сделать итераторы недействительными:

          - `vector`: `push_back` при перевыделении — **все** итераторы; `erase` — от точки удаления до конца.
          - `list`, `map`, `set`: `erase` инвалидирует только удалённый элемент.
          - `unordered_map`: rehash инвалидирует итераторы (но не ссылки на элементы).

          Правильное удаление в цикле:

          ```cpp
          for (auto it = v.begin(); it != v.end(); ) {
              if (*it % 2 == 0) it = v.erase(it);   // erase возвращает следующий
              else ++it;
          }
          // или проще (C++20):
          std::erase_if(v, [](int x) { return x % 2 == 0; });
          ```

          ## Итераторы вставки

          ```cpp
          std::vector<int> out;
          std::copy(v.begin(), v.end(), std::back_inserter(out));   // push_back при каждой записи
          ```
        practice:
          - type: output
            q: Что выведет код?
            code: |
              std::vector<int> v{1, 2, 3, 4};
              auto it = v.begin() + 2;
              std::cout << *it << *(it - 1) << v.end() - v.begin();
            answer: "324"
          - type: choice
            q: Куда указывает end()?
            options: ["На последний элемент", "За последний элемент", "На первый элемент", "На nullptr"]
            answer: 1
          - type: bug
            q: Какая строка вызовет UB?
            code: |
              std::vector<int> v{1, 2, 3, 4};
              for (auto it = v.begin(); it != v.end(); ++it) {
                  if (*it == 2) v.erase(it);
              }
            bugLine: 3
            fix: if (*it == 2) it = v.erase(it); else ++it;  (или std::erase(v, 2))
            explain: После erase итератор it недействителен, а цикл продолжает его использовать.
          - type: fill
            q: Удалите все отрицательные числа (C++20)
            code: |
              std::___(v, [](int x) { return x < 0; });
            answers: ["erase_if"]
          - type: choice
            q: Почему std::sort нельзя применить к std::list?
            options: ["list не хранит числа", "Нужен random access итератор, а у list — bidirectional", "list уже отсортирован", "Можно"]
            answer: 1
        homework:
          task: |
            Напишите обобщённые функции на итераторах (шаблоны): `count_if_custom(first, last, pred)`, `reverse_custom(first, last)` для bidirectional итераторов, `unique_copy_custom(first, last, out)` (копирует без подряд идущих дубликатов, через back_inserter). Проверьте на vector, list и string.
          checklist:
            - Работает с разными контейнерами
            - reverse не требует random access
            - Используется std::back_inserter
          solution: |
            #include <iostream>
            #include <iterator>
            #include <list>
            #include <string>
            #include <vector>

            template <class It, class P>
            std::size_t count_if_custom(It first, It last, P pred) {
                std::size_t n = 0;
                for (; first != last; ++first) if (pred(*first)) ++n;
                return n;
            }

            template <class BidIt>
            void reverse_custom(BidIt first, BidIt last) {
                while (first != last && first != --last) {
                    std::iter_swap(first, last);
                    ++first;
                }
            }

            template <class It, class Out>
            Out unique_copy_custom(It first, It last, Out out) {
                if (first == last) return out;
                auto prev = *first; *out++ = prev;
                for (++first; first != last; ++first)
                    if (!(*first == prev)) { prev = *first; *out++ = prev; }
                return out;
            }

            int main() {
                std::list<int> l{1, 1, 2, 3, 3, 3, 4};
                std::vector<int> u;
                unique_copy_custom(l.begin(), l.end(), std::back_inserter(u));
                reverse_custom(u.begin(), u.end());
                std::string s = "hello";
                reverse_custom(s.begin(), s.end());
                std::cout << u.size() << " " << s << " " << count_if_custom(l.begin(), l.end(), [](int x) { return x > 2; });
            }
      - id: cpp-04-02
        title: map, unordered_map, set
        minutes: 30
        xp: 35
        theory: |
          ## Ассоциативные контейнеры

          | Контейнер | Структура | Поиск | Порядок |
          |---|---|---|---|
          | `std::map<K,V>` | красно-чёрное дерево | O(log n) | отсортирован по ключу |
          | `std::unordered_map<K,V>` | хеш-таблица | O(1) в среднем | нет |
          | `std::set<T>` / `unordered_set<T>` | то же, только ключи | | |
          | `multimap`, `multiset` | разрешают дубликаты ключей | | |

          ```cpp
          std::map<std::string, int> ages{{"Аня", 25}, {"Боб", 30}};
          ages["Вика"] = 22;              // вставить или перезаписать
          ages.insert({"Аня", 99});       // НЕ перезапишет, ключ уже есть
          ages.insert_or_assign("Аня", 26);
          ages.emplace("Гена", 40);
          ages.try_emplace("Дима", 19);   // не создаёт значение, если ключ есть

          for (const auto& [name, age] : ages)      // structured bindings, по алфавиту
              std::cout << name << ": " << age << "\n";
          ```

          ## Ловушка operator[]

          `m[key]` **вставляет** элемент со значением по умолчанию, если ключа нет. Для проверки используйте:

          ```cpp
          if (ages.contains("Петя")) { }            // C++20
          if (auto it = ages.find("Боб"); it != ages.end())
              std::cout << it->second;
          int a = ages.at("Аня");                   // std::out_of_range, если нет
          ```

          `operator[]` нельзя вызвать у `const map`.

          ## Подсчёт и группировка

          ```cpp
          std::unordered_map<std::string, int> freq;
          for (const auto& w : words) ++freq[w];    // здесь вставка нулём — именно то, что нужно

          std::map<char, std::vector<std::string>> byLetter;
          for (const auto& w : words) byLetter[w[0]].push_back(w);
          ```

          ## Возможности упорядоченных

          ```cpp
          std::map<int, std::string> events{{10, "a"}, {20, "b"}, {30, "c"}};
          auto it = events.lower_bound(15);    // первый ключ >= 15 → 20
          auto it2 = events.upper_bound(20);   // первый ключ > 20 → 30
          events.erase(events.begin());
          ```

          ## set

          ```cpp
          std::set<int> s{5, 1, 3, 1};    // {1, 3, 5}
          s.insert(2);
          bool has = s.contains(3);
          ```

          ## Свой ключ

          Для `map`/`set` нужен `operator<` (или `<=>`), для `unordered_*` — `std::hash` и `operator==`:

          ```cpp
          struct Point { int x, y; bool operator==(const Point&) const = default; };
          struct PointHash { size_t operator()(const Point& p) const { return std::hash<int>{}(p.x) ^ (std::hash<int>{}(p.y) << 1); } };
          std::unordered_set<Point, PointHash> visited;
          ```

          > 💡 По умолчанию берите `unordered_map`; `map` — когда нужен порядок или диапазонные запросы.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              std::map<std::string, int> m;
              m["b"] = 2; m["a"] = 1; m["c"] = 3;
              for (auto& [k, v] : m) std::cout << k;
            answer: abc
          - type: output
            q: Что выведет код?
            code: |
              std::map<int, int> m;
              if (m[5] == 0) std::cout << m.size();
            answer: "1"
            explain: operator[] вставил ключ 5 со значением 0.
          - type: output
            q: Что выведет код?
            code: |
              std::set<int> s{3, 1, 3, 2, 1};
              std::cout << s.size() << *s.begin();
            answer: "31"
          - type: fill
            q: Проверьте наличие ключа без вставки (C++20)
            code: |
              if (users.___("admin")) { ... }
            answers: ["contains"]
          - type: choice
            q: Какая сложность поиска в std::map?
            options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
            answer: 1
        homework:
          task: |
            Программа читает текст из файла и выводит: (1) топ-10 частых слов (`unordered_map` + сортировка вектора пар), (2) слова, сгруппированные по первой букве в алфавитном порядке (`map<char, set<string>>`), (3) количество уникальных слов. Слова — в нижнем регистре без пунктуации.
          checklist:
            - Используется structured bindings
            - Сортировка по убыванию частоты, при равенстве — по алфавиту
            - Нет лишних копий строк в циклах
          solution: |
            #include <algorithm>
            #include <cctype>
            #include <fstream>
            #include <iostream>
            #include <map>
            #include <set>
            #include <string>
            #include <unordered_map>
            #include <vector>

            int main(int argc, char** argv) {
                std::ifstream in(argc > 1 ? argv[1] : "text.txt");
                std::unordered_map<std::string, int> freq;
                std::map<char, std::set<std::string>> groups;
                std::string w;
                while (in >> w) {
                    std::string clean;
                    for (unsigned char c : w) if (std::isalpha(c)) clean += static_cast<char>(std::tolower(c));
                    if (clean.empty()) continue;
                    ++freq[clean];
                    groups[clean[0]].insert(clean);
                }
                std::vector<std::pair<std::string, int>> v(freq.begin(), freq.end());
                std::sort(v.begin(), v.end(), [](const auto& a, const auto& b) {
                    return a.second != b.second ? a.second > b.second : a.first < b.first;
                });
                for (std::size_t i = 0; i < std::min<std::size_t>(10, v.size()); ++i)
                    std::cout << v[i].first << " " << v[i].second << "\n";
                for (const auto& [letter, words] : groups) {
                    std::cout << letter << ":";
                    for (const auto& x : words) std::cout << " " << x;
                    std::cout << "\n";
                }
                std::cout << "unique: " << freq.size() << "\n";
            }
      - id: cpp-04-03
        title: Алгоритмы STL и лямбды
        minutes: 35
        xp: 40
        theory: |
          `<algorithm>` и `<numeric>` содержат десятки готовых, оптимизированных и протестированных алгоритмов. Писать циклы вручную вместо них — плохой стиль.

          ## Лямбды

          ```cpp
          auto square = [](int x) { return x * x; };
          int k = 3;
          auto mulK = [k](int x) { return x * k; };       // захват по значению
          auto addTo = [&total](int x) { total += x; };   // по ссылке
          auto all = [=] { ... };  auto allRef = [&] { ... };
          auto counter = [n = 0]() mutable { return ++n; }; // init-capture + mutable
          auto generic = [](auto a, auto b) { return a + b; }; // обобщённая (C++14)
          ```

          ⚠️ Захват по ссылке локальной переменной в лямбду, которая переживёт функцию → висячая ссылка.

          ## Основные алгоритмы

          ```cpp
          std::vector<int> v{5, 2, 8, 1, 9, 3};

          std::sort(v.begin(), v.end());                              // 1 2 3 5 8 9
          std::sort(v.begin(), v.end(), std::greater<>{});            // по убыванию
          std::sort(users.begin(), users.end(), [](const User& a, const User& b) { return a.age < b.age; });
          std::stable_sort(...);                                      // сохраняет порядок равных

          auto it = std::find(v.begin(), v.end(), 8);
          auto it2 = std::find_if(v.begin(), v.end(), [](int x) { return x > 4; });
          int cnt = std::count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
          bool any = std::any_of(v.begin(), v.end(), [](int x) { return x < 0; });  // all_of, none_of

          auto [mn, mx] = std::minmax_element(v.begin(), v.end());
          int sum = std::accumulate(v.begin(), v.end(), 0);           // <numeric>
          long long prod = std::accumulate(v.begin(), v.end(), 1LL, std::multiplies<>{});

          std::vector<int> sq(v.size());
          std::transform(v.begin(), v.end(), sq.begin(), [](int x) { return x * x; });

          std::reverse(v.begin(), v.end());
          std::iota(v.begin(), v.end(), 1);                           // 1, 2, 3, ...
          bool found = std::binary_search(v.begin(), v.end(), 5);     // только для отсортированного

          v.erase(std::unique(v.begin(), v.end()), v.end());          // убрать подряд идущие дубли (после sort)
          v.erase(std::remove_if(v.begin(), v.end(), pred), v.end()); // erase-remove idiom
          ```

          `std::remove` **не удаляет** элементы — только сдвигает оставшиеся вперёд и возвращает новый «конец». Поэтому нужен `erase`.

          ## Частичная сортировка и выбор

          ```cpp
          std::partial_sort(v.begin(), v.begin() + 3, v.end());   // топ-3 в начале
          std::nth_element(v.begin(), v.begin() + v.size()/2, v.end()); // медиана за O(n)
          ```

          ## Параллельные версии (C++17)

          ```cpp
          #include <execution>
          std::sort(std::execution::par, v.begin(), v.end());
          ```
        practice:
          - type: output
            q: Что выведет код?
            code: |
              std::vector<int> v{4, 1, 3};
              std::sort(v.begin(), v.end());
              std::cout << v[0] << v[2] << std::accumulate(v.begin(), v.end(), 0);
            answer: "148"
          - type: output
            q: Что выведет код?
            code: |
              std::vector<int> v{1, 2, 3, 4, 5, 6};
              std::cout << std::count_if(v.begin(), v.end(), [](int x) { return x % 3 == 0; });
            answer: "2"
          - type: output
            q: Что выведет код?
            code: |
              auto c = [n = 0]() mutable { return ++n; };
              c(); c();
              std::cout << c();
            answer: "3"
          - type: fill
            q: Удалите все нули из вектора (erase-remove)
            code: |
              v.erase(std::___(v.begin(), v.end(), 0), v.end());
            answers: ["remove"]
          - type: output
            q: Что выведет код?
            code: |
              int k = 2;
              auto f = [k](int x) { return x * k; };
              k = 10;
              std::cout << f(5);
            answer: "10"
            explain: k захвачен по значению в момент создания лямбды (2), поэтому 5 * 2 = 10.
        homework:
          task: |
            Есть `std::vector<Employee>` (name, dept, salary, age). Без единого ручного цикла (только алгоритмы STL и лямбды) найдите: среднюю зарплату, самого старшего, количество сотрудников старше 40, топ-3 по зарплате (partial_sort), список имён отдела "IT" (copy_if + transform), есть ли кто-то с зарплатой > 500000, удалите всех стажёров (age < 20).
          checklist:
            - Нет for/while
            - Используется erase-remove или erase_if
            - Лямбды принимают по const&
          solution: |
            #include <algorithm>
            #include <iostream>
            #include <iterator>
            #include <numeric>
            #include <string>
            #include <vector>

            struct Employee { std::string name, dept; double salary; int age; };

            int main() {
                std::vector<Employee> e{{"Аня", "IT", 250000, 28}, {"Боб", "HR", 90000, 45}, {"Вика", "IT", 310000, 35},
                                        {"Гена", "Sales", 120000, 52}, {"Дима", "IT", 40000, 19}};
                double avg = std::accumulate(e.begin(), e.end(), 0.0, [](double s, const Employee& x) { return s + x.salary; }) / e.size();
                auto oldest = std::max_element(e.begin(), e.end(), [](const auto& a, const auto& b) { return a.age < b.age; });
                auto over40 = std::count_if(e.begin(), e.end(), [](const auto& x) { return x.age > 40; });
                bool rich = std::any_of(e.begin(), e.end(), [](const auto& x) { return x.salary > 500000; });

                std::vector<Employee> it;
                std::copy_if(e.begin(), e.end(), std::back_inserter(it), [](const auto& x) { return x.dept == "IT"; });
                std::vector<std::string> names;
                std::transform(it.begin(), it.end(), std::back_inserter(names), [](const auto& x) { return x.name; });

                std::partial_sort(e.begin(), e.begin() + 3, e.end(), [](const auto& a, const auto& b) { return a.salary > b.salary; });
                std::erase_if(e, [](const auto& x) { return x.age < 20; });

                std::cout << avg << " " << oldest->name << " " << over40 << " " << rich << " " << names.size() << " " << e.size();
            }
      - id: cpp-04-04
        title: optional, variant, any
        minutes: 30
        xp: 35
        theory: |
          Словарные типы C++17 делают код выразительнее и безопаснее.

          ## std::optional<T> — значение, которого может не быть

          Вместо магических `-1`, `nullptr` или пары `bool + out`-параметр:

          ```cpp
          #include <optional>

          std::optional<int> parseInt(std::string_view s) {
              int v;
              auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
              if (ec != std::errc{} || p != s.data() + s.size()) return std::nullopt;
              return v;
          }

          if (auto n = parseInt("42")) std::cout << *n;      // проверка + доступ
          int x = parseInt("abc").value_or(0);                 // значение по умолчанию
          parseInt("x").value();                               // std::bad_optional_access
          ```

          C++23: монадические `and_then`, `transform`, `or_else`:

          ```cpp
          auto doubled = parseInt("21").transform([](int v) { return v * 2; });   // optional<int>{42}
          ```

          ## std::variant<Ts...> — одно из нескольких типов

          Типобезопасный `union`: хранит ровно одно значение из списка и знает, какое.

          ```cpp
          #include <variant>
          using Value = std::variant<int, double, std::string>;

          Value v = 3.14;
          v = std::string("text");

          std::cout << v.index();                         // 2
          if (std::holds_alternative<std::string>(v)) std::cout << std::get<std::string>(v);
          if (auto p = std::get_if<int>(&v)) std::cout << *p;   // nullptr, если не int
          std::get<int>(v);                               // std::bad_variant_access
          ```

          **std::visit** — обработать любой вариант:

          ```cpp
          template <class... Ts> struct overloaded : Ts... { using Ts::operator()...; };

          std::visit(overloaded{
              [](int i)                { std::cout << "int " << i; },
              [](double d)             { std::cout << "double " << d; },
              [](const std::string& s) { std::cout << "str " << s; }
          }, v);
          ```

          Компилятор проверит, что обработаны **все** альтернативы. Применение: результат-или-ошибка, состояния конечного автомата, AST, сообщения протокола.

          ## std::any — что угодно

          ```cpp
          std::any a = 5;
          a = std::string("hi");
          auto s = std::any_cast<std::string>(a);       // std::bad_any_cast при несовпадении
          ```

          Медленнее и теряет проверку типов на этапе компиляции. Используйте редко (контейнеры плагинов, свойства «чёрного ящика»). В 95% случаев нужен `variant`.

          ## std::expected (C++23)

          ```cpp
          std::expected<int, std::string> divide(int a, int b) {
              if (b == 0) return std::unexpected("деление на ноль");
              return a / b;
          }
          ```
        practice:
          - type: output
            q: Что выведет код?
            code: |
              std::optional<int> a;
              std::optional<int> b = 5;
              std::cout << a.value_or(-1) << " " << b.value_or(-1);
            answer: -1 5
          - type: output
            q: Что выведет код?
            code: |
              std::variant<int, std::string, double> v = 2.5;
              std::cout << v.index();
