        homework:
          task: |
            Класс `BankAccount` с методами `withdraw` (бросает `InsufficientFunds` со значением недостающей суммы), `deposit` (бросает `std::invalid_argument` при ≤ 0). Функция `transfer(a, b, sum)` с **сильной гарантией**: при любой ошибке оба счёта остаются как были. В main обработайте все ошибки по типам, проверьте гарантию тестом.
          checklist:
            - Своё исключение наследует std::runtime_error
            - transfer обеспечивает strong guarantee
            - Ловля по const&
          solution: |
            #include <cassert>
            #include <iostream>
            #include <stdexcept>
            #include <string>

            class InsufficientFunds : public std::runtime_error {
                double need_;
            public:
                explicit InsufficientFunds(double n) : std::runtime_error("Не хватает " + std::to_string(n)), need_(n) {}
                double need() const noexcept { return need_; }
            };

            class BankAccount {
                double bal_ = 0;
            public:
                explicit BankAccount(double b) : bal_(b) {}
                double balance() const noexcept { return bal_; }
                void deposit(double s) { if (s <= 0) throw std::invalid_argument("сумма <= 0"); bal_ += s; }
                void withdraw(double s) {
                    if (s <= 0) throw std::invalid_argument("сумма <= 0");
                    if (s > bal_) throw InsufficientFunds(s - bal_);
                    bal_ -= s;
                }
            };

            void transfer(BankAccount& a, BankAccount& b, double s) {
                BankAccount ta = a, tb = b;     // работаем с копиями
                ta.withdraw(s);
                tb.deposit(s);
                a = ta; b = tb;                 // присваивание double не бросает
            }

            int main() {
                BankAccount a(100), b(50);
                try { transfer(a, b, 500); }
                catch (const InsufficientFunds& e) { std::cout << e.what() << "\n"; }
                catch (const std::invalid_argument& e) { std::cout << "Аргумент: " << e.what() << "\n"; }
                assert(a.balance() == 100 && b.balance() == 50);
            }
