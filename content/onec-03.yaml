            answer: 1
        homework:
          task: |
            Создайте документы `ПоступлениеТоваров` и `РеализацияТоваров` (реквизиты Контрагент, Склад, СуммаДокумента; табличная часть Товары: Номенклатура, Количество, Цена, Сумма). В `ПередЗаписью` пересчитывайте СуммаДокумента. Реализуйте `ОбработкаПроведения` с движениями прихода/расхода по регистру накопления `ОстаткиТоваров` (создайте его: измерения Склад, Номенклатура; ресурсы Количество, Сумма). Реализация вводится на основании поступления (`ОбработкаЗаполнения`).
          checklist:
            - Два документа с табличными частями
            - Движения формируются при проведении
            - Работает ввод на основании
          solution: |
            // Модуль объекта ПоступлениеТоваров
            Процедура ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)
                Для Каждого Стр Из Товары Цикл
                    Стр.Сумма = Стр.Количество * Стр.Цена;
                КонецЦикла;
                СуммаДокумента = Товары.Итог("Сумма");
            КонецПроцедуры

            Процедура ОбработкаПроведения(Отказ, РежимПроведения)
                Движения.ОстаткиТоваров.Записывать = Истина;
                Для Каждого Стр Из Товары Цикл
                    Движение = Движения.ОстаткиТоваров.ДобавитьПриход();
                    Движение.Период = Дата;
                    Движение.Склад = Склад;
                    Движение.Номенклатура = Стр.Номенклатура;
                    Движение.Количество = Стр.Количество;
                    Движение.Сумма = Стр.Сумма;
                КонецЦикла;
            КонецПроцедуры

            // Модуль объекта РеализацияТоваров
            Процедура ОбработкаЗаполнения(ДанныеЗаполнения, ТекстЗаполнения, СтандартнаяОбработка)
                Если ТипЗнч(ДанныеЗаполнения) = Тип("ДокументСсылка.ПоступлениеТоваров") Тогда
                    Склад = ДанныеЗаполнения.Склад;
                    Для Каждого СтрОснования Из ДанныеЗаполнения.Товары Цикл
                        Стр = Товары.Добавить();
                        ЗаполнитьЗначенияСвойств(Стр, СтрОснования);
                    КонецЦикла;
                КонецЕсли;
            КонецПроцедуры

            Процедура ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)
                Для Каждого Стр Из Товары Цикл
                    Стр.Сумма = Стр.Количество * Стр.Цена;
                КонецЦикла;
                СуммаДокумента = Товары.Итог("Сумма");
            КонецПроцедуры

            Процедура ОбработкаПроведения(Отказ, РежимПроведения)
                Движения.ОстаткиТоваров.Записывать = Истина;
                Для Каждого Стр Из Товары Цикл
                    Движение = Движения.ОстаткиТоваров.ДобавитьРасход();
                    Движение.Период = Дата;
                    Движение.Склад = Склад;
                    Движение.Номенклатура = Стр.Номенклатура;
                    Движение.Количество = Стр.Количество;
                    Движение.Сумма = Стр.Сумма;   // упрощённо; себестоимость — в модуле 7
                КонецЦикла;
            КонецПроцедуры
      - id: 1c-03-03
        title: Перечисления и константы
        minutes: 25
        xp: 30
        theory: |
          ## Перечисления

          **Перечисление** — фиксированный список значений, задаваемый в конфигураторе. Пользователь не может его изменить. Примеры: `СтатусыЗаказов` (Новый, ВРаботе, Выполнен, Отменён), `ВидыНоменклатуры` (Товар, Услуга), `ПолФизическогоЛица`.

          ```bsl
          Заказ.Статус = Перечисления.СтатусыЗаказов.ВРаботе;

          Если Заказ.Статус = Перечисления.СтатусыЗаказов.Выполнен Тогда
              Сообщить("Заказ закрыт");
          КонецЕсли;

          ПустоеЗначение = Перечисления.СтатусыЗаказов.ПустаяСсылка();

          // Обход всех значений
          Для Каждого Статус Из Метаданные.Перечисления.СтатусыЗаказов.ЗначенияПеречисления Цикл
              Сообщить(Статус.Синоним);
          КонецЦикла;
          ```

          В запросах: `ГДЕ Заказы.Статус = ЗНАЧЕНИЕ(Перечисление.СтатусыЗаказов.Выполнен)`.

          **Перечисление или справочник?** Если значения нужны в коде (алгоритм зависит от них) и не меняются пользователем — перечисление. Если список пополняют пользователи — справочник.

          ## Константы

          **Константа** хранит одно значение для всей информационной базы: основная валюта, наименование организации, «Использовать несколько складов», учётная политика.

          ```bsl
          Валюта = Константы.ОсновнаяВалюта.Получить();
          Константы.ИспользоватьНесколькоСкладов.Установить(Истина);

          // Через менеджер значения (с проверкой прав и событиями)
          МенеджерЗначения = Константы.НаименованиеОрганизации.СоздатьМенеджерЗначения();
          МенеджерЗначения.Прочитать();
          МенеджерЗначения.Значение = "ООО «Ромашка»";
          МенеджерЗначения.Записать();
          ```

          ## Функциональные опции

          Константы типа Булево часто связывают с **функциональными опциями** — они включают/выключают видимость объектов и реквизитов в интерфейсе без программирования:

          ```bsl
          Если ПолучитьФункциональнуюОпцию("ИспользоватьНесколькоСкладов") Тогда
              // показать выбор склада
          КонецЕсли;
          ```

          ## Важно

          - Константы читаются на **сервере**; на клиенте получают через серверный вызов или параметры, переданные при открытии формы.
          - Частое чтение одной константы в цикле — лишние обращения к БД; прочитайте один раз в переменную или используйте модуль с повторным использованием возвращаемых значений.
          - Для настроек, зависящих от организации или даты, константа не подходит — используйте **периодический регистр сведений** (следующий урок).
