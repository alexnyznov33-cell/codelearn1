        homework:
          task: |
            Доработайте конфигурацию: регистр остатков `ТоварыНаСкладах` (Склад, Номенклатура / Количество) и оборотный `Продажи` (Номенклатура, Контрагент / Количество, Сумма). Документ поступления делает приход, реализация — расход и оборот продаж. Создайте 3 поступления и 3 реализации. Напишите отчёт-обработку: остатки на дату по складу; ведомость «начальный остаток — приход — расход — конечный остаток» за месяц; продажи по клиентам за период. Проверьте результат по таблице движений вручную.
          checklist:
            - Два регистра разных видов
            - Движения формируются документами
            - Используются Остатки, Обороты, ОстаткиИОбороты
          solution: |
            Функция ОстаткиНаДату(Склад, Дата) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    Ост.Номенклатура КАК Номенклатура,
                |    Ост.КоличествоОстаток КАК Остаток
                |ИЗ
                |    РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата, Склад = &Склад) КАК Ост
                |УПОРЯДОЧИТЬ ПО
                |    Номенклатура");
                Запрос.УстановитьПараметр("Дата", Новый Граница(КонецДня(Дата), ВидГраницы.Включая));
                Запрос.УстановитьПараметр("Склад", Склад);
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция Ведомость(Начало, Конец) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    О.Номенклатура,
                |    О.КоличествоНачальныйОстаток КАК НачОст,
                |    О.КоличествоПриход КАК Приход,
                |    О.КоличествоРасход КАК Расход,
                |    О.КоличествоКонечныйОстаток КАК КонОст
                |ИЗ
                |    РегистрНакопления.ТоварыНаСкладах.ОстаткиИОбороты(&Начало, &Конец) КАК О");
                Запрос.УстановитьПараметр("Начало", НачалоДня(Начало));
                Запрос.УстановитьПараметр("Конец", КонецДня(Конец));
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции

            Функция ПродажиПоКлиентам(Начало, Конец) Экспорт
                Запрос = Новый Запрос(
                "ВЫБРАТЬ
                |    П.Контрагент,
                |    СУММА(П.СуммаОборот) КАК Сумма
                |ИЗ
                |    РегистрНакопления.Продажи.Обороты(&Начало, &Конец) КАК П
                |СГРУППИРОВАТЬ ПО
                |    П.Контрагент
                |УПОРЯДОЧИТЬ ПО
                |    Сумма УБЫВ");
                Запрос.УстановитьПараметр("Начало", НачалоДня(Начало));
                Запрос.УстановитьПараметр("Конец", КонецДня(Конец));
                Возврат Запрос.Выполнить().Выгрузить();
            КонецФункции
      - id: 1c-03-06
        title: Планы видов характеристик
        minutes: 30
        xp: 35
        theory: |
          **План видов характеристик (ПВХ)** — объект, описывающий **виды** свойств, которые пользователь может создавать сам, вместе с **типом значения** каждого вида. Это механизм «дополнительных реквизитов»: добавить товару свойство «Цвет», «Размер», «Объём» без изменения конфигурации.

          ## Как устроено

          1. **ПВХ `ВидыСвойств`** — элементы: «Цвет» (тип: Справочник.ЗначенияСвойств), «Вес, кг» (тип: Число), «Дата выпуска» (тип: Дата). У ПВХ есть специальное поле **ТипЗначения** — составной тип, из которого пользователь выбирает тип для каждого вида.
          2. **Справочник значений** (`ЗначенияСвойств`) — подчинён ПВХ: для «Цвета» — Красный, Синий, Зелёный.
          3. **Хранение значений** — регистр сведений `ЗначенияСвойствОбъектов` (измерения: Объект, Свойство (ПВХ); ресурс: Значение — тип «Характеристика.ВидыСвойств») или табличная часть объекта.

          ```bsl
          // Создание вида свойства
          Вид = ПланыВидовХарактеристик.ВидыСвойств.СоздатьЭлемент();
          Вид.Наименование = "Вес, кг";
          Вид.ТипЗначения = Новый ОписаниеТипов("Число");
          Вид.Записать();

          // Запись значения свойства для товара
          Запись = РегистрыСведений.ЗначенияСвойствОбъектов.СоздатьМенеджерЗаписи();
          Запись.Объект = Товар;
          Запись.Свойство = Вид.Ссылка;
          Запись.Значение = 1.5;
          Запись.Записать();
          ```

          Тип ресурса `Значение` — **ХарактеристикаСсылка** («Характеристика.ВидыСвойств»): платформа сама ограничивает ввод типом, заданным у выбранного вида. В форме это делает связь параметров выбора по типу.

          ## Где применяется

          - Дополнительные реквизиты и сведения (в БСП — подсистема «Свойства»).
          - **Аналитика (субконто)** в бухгалтерии: план счетов ссылается на ПВХ `ВидыСубконто` — для счёта 60 аналитика «Контрагенты» и «Договоры», для счёта 41 — «Номенклатура» и «Склады» (модуль 7).
          - Характеристики номенклатуры (размер/цвет одежды).
          - Настройки пользователей с разными типами значений.

          ## Запрос по свойствам

          ```bsl
          "ВЫБРАТЬ З.Объект КАК Товар
          |ИЗ РегистрСведений.ЗначенияСвойствОбъектов КАК З
          |ГДЕ З.Свойство = &Цвет И З.Значение = &Красный"
          ```

          ПВХ — продвинутый механизм; на практике чаще всего вы будете пользоваться готовой подсистемой «Свойства» БСП, но понимать устройство нужно для доработок и экзамена «1С:Специалист».
