id: onec
modules:
  - id: 1c-m3
    title: Объекты конфигурации
    level: Junior
    lessons:
      - id: 1c-03-01
        title: Справочники
        minutes: 35
        xp: 35
        theory: |
          **Справочник** — список однотипных объектов нормативно-справочной информации: номенклатура, контрагенты, склады, сотрудники. У каждого элемента есть стандартные реквизиты **Код**, **Наименование**, **Ссылка**, **ПометкаУдаления**, а также свои реквизиты и табличные части.

          ## Настройки в конфигураторе

          - **Иерархический** — группы и элементы (группы номенклатуры) или иерархия элементов.
          - **Владелец** — подчинённый справочник (`ДоговорыКонтрагентов` подчинены `Контрагентам`).
          - **Длина кода/наименования**, тип кода, автонумерация, контроль уникальности.
          - **Предопределённые элементы** — существуют всегда, доступны из кода: `Справочники.Склады.Основной`.
          - Формы, команды, права, ввод по строке (поиск по коду/наименованию/ИНН).

          ## Ссылка и объект

          Важнейшее понятие 1С:
          - **Ссылка** (`СправочникСсылка.Номенклатура`) — указатель на запись в базе. Через неё можно **читать** реквизиты (каждое обращение может читать данные из БД).
          - **Объект** (`СправочникОбъект.Номенклатура`) — данные элемента в памяти для **изменения** и записи.

          ```bsl
          // Создание
          НовыйТовар = Справочники.Номенклатура.СоздатьЭлемент();
          НовыйТовар.Наименование = "Чай зелёный";
          НовыйТовар.Артикул = "T-001";
          НовыйТовар.ЕдиницаИзмерения = Справочники.ЕдиницыИзмерения.Штука;
          НовыйТовар.Записать();
          Ссылка = НовыйТовар.Ссылка;

          // Изменение
          Объект = Ссылка.ПолучитьОбъект();
          Объект.Наименование = "Чай зелёный (100 г)";
          Объект.Записать();

          // Группа
          Группа = Справочники.Номенклатура.СоздатьГруппу();
          Группа.Наименование = "Напитки";
          Группа.Записать();
          ```

          ## Поиск

          ```bsl
          Товар = Справочники.Номенклатура.НайтиПоКоду("000000015");
          Товар = Справочники.Номенклатура.НайтиПоНаименованию("Чай зелёный", Истина);  // точное совпадение
          Товар = Справочники.Номенклатура.НайтиПоРеквизиту("Артикул", "T-001");
          Если Товар.Пустая() Тогда
              Сообщить("Не найдено");
          КонецЕсли;
          Пустая = Справочники.Номенклатура.ПустаяСсылка();
          ```

          Для массовой выборки используйте **запросы** (модуль 5), а не перебор `Выбрать()`.

          ## Удаление

          В рабочих базах объекты не удаляют сразу, а **помечают на удаление** (`Объект.УстановитьПометкуУдаления(Истина)`), затем администратор запускает «Удаление помеченных объектов» с контролем ссылочной целостности. Непосредственное `Удалить()` опасно: в базе могут остаться «битые» ссылки.

          ## Модуль объекта

          События: `ПередЗаписью(Отказ)`, `ПриЗаписи(Отказ)`, `ОбработкаПроверкиЗаполнения(Отказ, ПроверяемыеРеквизиты)`, `ПриКопировании`, `ОбработкаЗаполнения`.

          ```bsl
          Процедура ПередЗаписью(Отказ)
              Если ОбменДанными.Загрузка Тогда Возврат; КонецЕсли;   // при обмене не проверяем
              Наименование = СокрЛП(Наименование);
              Если ПустаяСтрока(Артикул) Тогда
                  ОбщегоНазначения.СообщитьПользователю("Заполните артикул", ЭтотОбъект, "Артикул", , Отказ);
              КонецЕсли;
          КонецПроцедуры
          ```
        practice:
          - type: choice
            q: Чем ссылка отличается от объекта справочника?
            options: ["Ничем", "Ссылка — указатель для чтения, объект — данные в памяти для изменения и записи", "Объект хранится в БД, ссылка — нет", "Ссылка нужна только для групп"]
            answer: 1
          - type: fill
