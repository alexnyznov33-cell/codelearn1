        homework:
          task: |
            Реализуйте механизм дополнительных свойств номенклатуры: ПВХ `СвойстваНоменклатуры` (тип значения: Строка, Число, Дата, Булево, СправочникСсылка.ЗначенияСвойств), подчинённый справочник `ЗначенияСвойств`, регистр сведений `ЗначенияСвойствНоменклатуры`. На форме товара выведите таблицу «Свойство — Значение» с ограничением типа значения по виду свойства. Напишите запрос: все товары с цветом «Красный» и весом меньше 2 кг.
          checklist:
            - ПВХ с составным типом значения
            - Значения хранятся в регистре
            - Запрос по нескольким свойствам
          solution: |
            Функция ТоварыПоСвойствам(Цвет, Красный, Вес, МаксВес) Экспорт
                Запрос = Новый Запрос;
                Запрос.Текст =
                "ВЫБРАТЬ
                |    ЗЦвет.Номенклатура КАК Товар
                |ИЗ
                |    РегистрСведений.ЗначенияСвойствНоменклатуры КАК ЗЦвет
                |        ВНУТРЕННЕЕ СОЕДИНЕНИЕ РегистрСведений.ЗначенияСвойствНоменклатуры КАК ЗВес
                |        ПО ЗЦвет.Номенклатура = ЗВес.Номенклатура
                |            И ЗВес.Свойство = &Вес
                |ГДЕ
                |    ЗЦвет.Свойство = &Цвет
                |    И ЗЦвет.Значение = &Красный
                |    И ВЫРАЗИТЬ(ЗВес.Значение КАК ЧИСЛО) < &МаксВес";
                Запрос.УстановитьПараметр("Цвет", Цвет);
                Запрос.УстановитьПараметр("Красный", Красный);
                Запрос.УстановитьПараметр("Вес", Вес);
                Запрос.УстановитьПараметр("МаксВес", МаксВес);
                Возврат Запрос.Выполнить().Выгрузить().ВыгрузитьКолонку("Товар");
            КонецФункции

            Процедура ЗаписатьСвойство(Товар, Свойство, Значение) Экспорт
                Если НЕ Свойство.ТипЗначения.СодержитТип(ТипЗнч(Значение)) Тогда
                    ВызватьИсключение "Тип значения не подходит для свойства " + Свойство;
                КонецЕсли;
                Запись = РегистрыСведений.ЗначенияСвойствНоменклатуры.СоздатьМенеджерЗаписи();
                Запись.Номенклатура = Товар;
                Запись.Свойство = Свойство;
                Запись.Значение = Значение;
                Запись.Записать();
            КонецПроцедуры

            // Форма товара: реквизит формы «Свойства» (ТаблицаЗначений: Свойство, Значение),
            // у поля Значение: СвязиПараметровВыбора/СвязьПоТипу = Элементы.Свойства.ТекущиеДанные.Свойство
