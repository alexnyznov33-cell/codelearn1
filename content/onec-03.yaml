            answers: ["Пустая"]
        homework:
          task: |
            В учебной конфигурации создайте справочники `Номенклатура` (иерархический по группам; реквизиты Артикул, ЕдиницаИзмерения, Цена, ВидНоменклатуры), `ЕдиницыИзмерения` (с предопределённым элементом «Штука»), `Контрагенты` (ИНН, Телефон) и подчинённый им `ДоговорыКонтрагентов`. В модуле объекта номенклатуры: обрезка пробелов и проверка уникальности артикула в `ПередЗаписью`. Напишите обработку, которая создаёт группу «Напитки» и 3 товара в ней, затем находит товар по артикулу и меняет цену.
          checklist:
            - Используется иерархия и подчинение
            - Есть предопределённый элемент
            - Проверка в ПередЗаписью
            - Изменение через ПолучитьОбъект
          solution: |
            // Модуль объекта справочника Номенклатура
            Процедура ПередЗаписью(Отказ)
                Если ОбменДанными.Загрузка Тогда
                    Возврат;
                КонецЕсли;
                Наименование = СокрЛП(Наименование);
                Если ЭтоГруппа Тогда
                    Возврат;
                КонецЕсли;
                Найденный = Справочники.Номенклатура.НайтиПоРеквизиту("Артикул", Артикул);
                Если ЗначениеЗаполнено(Артикул) И ЗначениеЗаполнено(Найденный) И Найденный <> Ссылка Тогда
                    Сообщение = Новый СообщениеПользователю;
                    Сообщение.Текст = "Артикул " + Артикул + " уже используется";
                    Сообщение.Поле = "Артикул";
                    Сообщение.УстановитьДанные(ЭтотОбъект);
                    Сообщение.Сообщить();
                    Отказ = Истина;
                КонецЕсли;
            КонецПроцедуры

            // Модуль обработки (на сервере)
            Процедура ЗаполнитьТоварыНаСервере()
                Группа = Справочники.Номенклатура.СоздатьГруппу();
                Группа.Наименование = "Напитки";
                Группа.Записать();
                Данные = СтрРазделить("Чай зелёный;T-001;300|Кофе молотый;K-001;650|Какао;C-001;250", "|");
                Для Каждого Строка Из Данные Цикл
                    Поля = СтрРазделить(Строка, ";");
                    Товар = Справочники.Номенклатура.СоздатьЭлемент();
                    Товар.Родитель = Группа.Ссылка;
                    Товар.Наименование = Поля[0];
                    Товар.Артикул = Поля[1];
                    Товар.Цена = Число(Поля[2]);
                    Товар.ЕдиницаИзмерения = Справочники.ЕдиницыИзмерения.Штука;
                    Товар.Записать();
                КонецЦикла;

                Ссылка = Справочники.Номенклатура.НайтиПоРеквизиту("Артикул", "K-001");
                Если НЕ Ссылка.Пустая() Тогда
                    Объект = Ссылка.ПолучитьОбъект();
                    Объект.Цена = 690;
                    Объект.Записать();
                КонецЕсли;
            КонецПроцедуры
      - id: 1c-03-02
        title: Документы и проведение
        minutes: 40
        xp: 40
        theory: |
          **Документ** фиксирует хозяйственное событие: поступление товаров, продажу, оплату. У документа есть **Номер**, **Дата**, реквизиты шапки и **табличные части** (строки товаров).

          **Проведение** — отражение документа в учёте: документ формирует **движения** в регистрах (остатки товаров, взаиморасчёты, бухгалтерия). Непроведённый документ — просто «черновик».

          ```bsl
          Документ = Документы.ПоступлениеТоваров.СоздатьДокумент();
          Документ.Дата = ТекущаяДатаСеанса();
          Документ.Контрагент = Поставщик;
          Документ.Склад = Справочники.Склады.Основной;

          Строка = Документ.Товары.Добавить();
          Строка.Номенклатура = Чай;
          Строка.Количество = 10;
          Строка.Цена = 200;
          Строка.Сумма = Строка.Количество * Строка.Цена;

          Документ.Записать(РежимЗаписиДокумента.Проведение);    // записать и провести
          // РежимЗаписиДокумента.Запись — просто записать
          // РежимЗаписиДокумента.ОтменаПроведения — отменить проведение (движения удаляются)
          ```

          ## ОбработкаПроведения

          В модуле объекта документа пишется процедура, формирующая движения:

          ```bsl
          Процедура ОбработкаПроведения(Отказ, РежимПроведения)
              Движения.ОстаткиТоваров.Записывать = Истина;
              Для Каждого СтрокаТЧ Из Товары Цикл
                  Движение = Движения.ОстаткиТоваров.Добавить();
                  Движение.ВидДвижения = ВидДвиженияНакопления.Приход;
                  Движение.Период = Дата;
                  Движение.Склад = Склад;
                  Движение.Номенклатура = СтрокаТЧ.Номенклатура;
                  Движение.Количество = СтрокаТЧ.Количество;
                  Движение.Сумма = СтрокаТЧ.Сумма;
              КонецЦикла;
          КонецПроцедуры
          ```

          Регистратор (документ) указывается автоматически. При перепроведении старые движения заменяются новыми. Чтобы документ мог делать движения в регистре, регистр нужно отметить на вкладке «Движения» документа.

          ## Другие события

          - `ОбработкаЗаполнения(ДанныеЗаполнения, ...)` — заполнение при создании или **вводе на основании** (счёт → реализация).
          - `ОбработкаПроверкиЗаполнения(Отказ, ПроверяемыеРеквизиты)` — проверка перед проведением (обязательные реквизиты отмечаются в свойствах «Проверка заполнения»).
          - `ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)` — подготовка данных (пересчитать сумму документа).
          - `ОбработкаУдаленияПроведения(Отказ)` — дополнительные действия при отмене проведения.

          ```bsl
          Процедура ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)
              СуммаДокумента = Товары.Итог("Сумма");
          КонецПроцедуры
          ```

          ## Свойства документа

          - **Нумерация**: автонумерация, периодичность (в пределах года), префиксы.
          - **Оперативное проведение** — разрешено ли проведение текущей датой с контролем остатков (модуль 7).
          - **Журналы документов** — общий список разных видов документов.
          - **Последовательности** — для контроля порядка проведения.

          Одно из главных правил: движения формируются **только** в `ОбработкаПроведения`, а данные для них лучше получать **запросом** (а не перебором табличной части с обращением к реквизитам ссылок через точку).
        practice:
