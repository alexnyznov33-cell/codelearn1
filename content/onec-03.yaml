            // КонецЦикла;
      - id: 1c-03-05
        title: Регистры накопления — остатки и обороты
        minutes: 40
        xp: 45
        theory: |
          **Регистр накопления** накапливает числовые показатели: количество товара на складе, задолженность клиента, выручку. Записи в него делают **только документы** (регистраторы) при проведении.

          ## Виды регистров

          - **Остатки** — хранит движения прихода и расхода, умеет давать **остаток на любую дату**. Примеры: `ТоварыНаСкладах`, `ВзаиморасчётыСКлиентами`.
          - **Обороты** — хранит только обороты за периоды, остатка нет. Примеры: `Продажи` (сколько продали за месяц), `Закупки`.

          ## Структура

          - **Измерения** — разрезы: `Склад`, `Номенклатура`.
          - **Ресурсы** — числа, которые накапливаются: `Количество`, `Сумма`.
          - **Реквизиты** — справочная информация, не участвует в итогах.
          - Стандартные поля: `Период`, `Регистратор`, `ВидДвижения` (Приход/Расход — только у регистра остатков), `НомерСтроки`, `Активность`.

          ## Движения при проведении

          ```bsl
          Процедура ОбработкаПроведения(Отказ, РежимПроведения)
              Движения.ТоварыНаСкладах.Записывать = Истина;
              Движения.Продажи.Записывать = Истина;
              Для Каждого Стр Из Товары Цикл
                  Расход = Движения.ТоварыНаСкладах.ДобавитьРасход();
                  Расход.Период = Дата;
                  Расход.Склад = Склад;
                  Расход.Номенклатура = Стр.Номенклатура;
                  Расход.Количество = Стр.Количество;

                  Оборот = Движения.Продажи.Добавить();      // у оборотного регистра нет вида движения
                  Оборот.Период = Дата;
                  Оборот.Номенклатура = Стр.Номенклатура;
                  Оборот.Клиент = Контрагент;
                  Оборот.Количество = Стр.Количество;
                  Оборот.Сумма = Стр.Сумма;
              КонецЦикла;
          КонецПроцедуры
          ```

          ## Получение данных — виртуальные таблицы

          ```bsl
          // Остатки на дату
          "ВЫБРАТЬ Ост.Номенклатура, Ост.КоличествоОстаток
          |ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата, Склад = &Склад) КАК Ост"

          // Обороты за период
          "ВЫБРАТЬ Об.Номенклатура, Об.СуммаОборот
          |ИЗ РегистрНакопления.Продажи.Обороты(&Начало, &Конец, Месяц) КАК Об"

          // Остатки и обороты: начальный остаток, приход, расход, конечный остаток
          "ВЫБРАТЬ О.Номенклатура, О.КоличествоНачальныйОстаток, О.КоличествоПриход,
          |        О.КоличествоРасход, О.КоличествоКонечныйОстаток
          |ИЗ РегистрНакопления.ТоварыНаСкладах.ОстаткиИОбороты(&Начало, &Конец) КАК О"
          ```

          Платформа хранит **итоги** по месяцам, поэтому остаток на любую дату считается быстро, без суммирования всех движений с начала времён.

          ## Пример

          | Документ | Вид | Количество | Остаток после |
          |---|---|---|---|
          | Поступление №1 | Приход | 10 | 10 |
          | Реализация №1 | Расход | 3 | 7 |
          | Поступление №2 | Приход | 5 | 12 |
          | Реализация №2 | Расход | 4 | 8 |

          Важно: регистр сам **не запрещает** уйти в минус — контроль остатков пишется в проведении (модуль 7).
