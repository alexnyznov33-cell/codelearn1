      - id: 1c-03-04
        title: Регистры сведений
        minutes: 35
        xp: 40
        theory: |
          **Регистр сведений** хранит данные в разрезе нескольких **измерений**, часто — с привязкой ко времени. Примеры: цены номенклатуры (по видам цен и датам), курсы валют, контактная информация, адреса доставки.

          ## Структура

          - **Измерения** — ключ записи: `Номенклатура`, `ВидЦены`.
          - **Ресурсы** — хранимые значения: `Цена`.
          - **Реквизиты** — дополнительная информация.
          - **Периодичность**: непериодический, по секундам, дню, месяцу... Периодический регистр хранит **историю**: каждая запись действует с даты `Период` до следующей.
          - **Режим записи**: *независимый* (записи вводятся вручную/кодом) или *подчинение регистратору* (записи делает документ, например «Установка цен»).

          ## Чтение среза

          ```bsl
          // Последние значения на дату для отбора
          Отбор = Новый Структура("Номенклатура, ВидЦены", Товар, Справочники.ВидыЦен.Розничная);
          Данные = РегистрыСведений.ЦеныНоменклатуры.ПолучитьПоследнее(ТекущаяДатаСеанса(), Отбор);
          Цена = Данные.Цена;      // структура с ресурсами; если записей нет — 0

          // Первое значение после даты
          Данные = РегистрыСведений.ЦеныНоменклатуры.ПолучитьПервое(Дата, Отбор);
          ```

          В запросах — **виртуальные таблицы** `.СрезПоследних(&Дата, Условие)` и `.СрезПервых` (подробно в модуле 5):

          ```bsl
          Запрос.Текст =
          "ВЫБРАТЬ Цены.Номенклатура, Цены.Цена
          |ИЗ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = &ВидЦены) КАК Цены";
          ```

          ## Запись (независимый регистр)

          ```bsl
          // Одна запись через менеджер записи
          Запись = РегистрыСведений.ЦеныНоменклатуры.СоздатьМенеджерЗаписи();
          Запись.Период = НачалоДня(ТекущаяДатаСеанса());
          Запись.Номенклатура = Товар;
          Запись.ВидЦены = Справочники.ВидыЦен.Розничная;
          Запись.Цена = 350;
          Запись.Записать();          // перезапишет запись с тем же ключом

          // Набор записей — для массовой записи с отбором
          Набор = РегистрыСведений.КурсыВалют.СоздатьНаборЗаписей();
          Набор.Отбор.Валюта.Установить(USD);
          Набор.Отбор.Период.Установить(Дата);
          НоваяЗапись = Набор.Добавить();
          НоваяЗапись.Период = Дата;
          НоваяЗапись.Валюта = USD;
          НоваяЗапись.Курс = 92.5;
          Набор.Записать();           // Истина по умолчанию — заменить записи по отбору
          ```

          ## Уникальность

          В регистре не может быть двух записей с одинаковыми **Период + Измерения**. Запись с тем же ключом заменяет существующую.

          ## Когда регистр сведений, а не реквизит

          Если значение зависит от **нескольких** объектов (цена = товар × вид цены) или нужна **история** изменений — регистр сведений. Если это свойство одного объекта без истории — реквизит справочника.
