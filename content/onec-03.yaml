          solution: |
            Процедура УстановитьЦену(Товар, ВидЦены, Дата, Цена) Экспорт
                Запись = РегистрыСведений.ЦеныНоменклатуры.СоздатьМенеджерЗаписи();
                Запись.Период = НачалоДня(Дата);
                Запись.Номенклатура = Товар;
                Запись.ВидЦены = ВидЦены;
                Запись.Цена = Цена;
                Запись.Записать();
            КонецПроцедуры

            Функция ЦенаНаДату(Товар, ВидЦены, Дата) Экспорт
                Отбор = Новый Структура("Номенклатура, ВидЦены", Товар, ВидЦены);
                Возврат РегистрыСведений.ЦеныНоменклатуры.ПолучитьПоследнее(Дата, Отбор).Цена;
            КонецФункции

            Процедура ПовыситьРозничныеЦены(Процент) Экспорт
