          - type: bug
            q: Где ошибка?
            code: |
              Товар = Справочники.Номенклатура.НайтиПоКоду("000000015");
              Товар.Наименование = "Кофе";
              Товар.Записать();
            bugLine: 2
            fix: Объект = Товар.ПолучитьОбъект(); Объект.Наименование = "Кофе"; Объект.Записать();
            explain: НайтиПоКоду возвращает ссылку, её реквизиты только для чтения — нужен объект.
          - type: choice
            q: Как правильно удалять элементы справочника в рабочей базе?
            options: ["Объект.Удалить()", "Помечать на удаление и запускать «Удаление помеченных объектов»", "Очищать наименование", "Через SQL"]
            answer: 1
          - type: fill
