      - id: py-02-01
        title: Списки (list)
        minutes: 25
        xp: 30
        theory: |
          **Список** — упорядоченная **изменяемая** коллекция любых объектов.

          ```python
          nums = [3, 1, 4]
          nums.append(5)        # [3, 1, 4, 5] — в конец
          nums.insert(0, 9)     # [9, 3, 1, 4, 5] — по индексу
          nums.remove(4)        # удаляет первое значение 4
          last = nums.pop()     # удаляет и возвращает последний
          nums.extend([7, 8])   # добавить несколько
          nums.sort()           # сортировка на месте
          sorted(nums, reverse=True)  # новый отсортированный список
          len(nums), sum(nums), max(nums), nums.index(7), nums.count(3)
          ```

          Индексы и срезы работают как у строк, но список можно менять: `nums[0] = 100`.

          ## Перебор

          ```python
          fruits = ["яблоко", "груша"]
          for i, fruit in enumerate(fruits, start=1):
              print(i, fruit)
          ```

          ## Генераторы списков (list comprehension)

          ```python
          squares = [x ** 2 for x in range(5)]          # [0, 1, 4, 9, 16]
          evens = [x for x in range(10) if x % 2 == 0]  # [0, 2, 4, 6, 8]
          ```

          ## Ссылки и копии

          ```python
          a = [1, 2]
          b = a          # b — та же самая ссылка!
          b.append(3)
          print(a)       # [1, 2, 3]
          c = a.copy()   # поверхностная копия (или a[:])
          ```

          > ⚠️ Для вложенных списков нужна глубокая копия: `copy.deepcopy(a)`.
