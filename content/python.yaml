      - id: py-02-02
        title: Кортежи и множества
        minutes: 20
        xp: 25
        theory: |
          ## Кортеж (tuple)

          Упорядоченная **неизменяемая** коллекция. Быстрее и безопаснее списка, может быть ключом словаря.

          ```python
          point = (10, 20)
          x, y = point          # распаковка
          single = (5,)         # кортеж из одного элемента — нужна запятая!
          first, *rest = (1, 2, 3, 4)   # first=1, rest=[2, 3, 4]
          ```

          Функции часто возвращают несколько значений именно кортежем: `return min_v, max_v`.

          ## Множество (set)

          Неупорядоченная коллекция **уникальных** элементов. Проверка `in` работает за O(1).

          ```python
          tags = {"python", "code", "python"}   # {'python', 'code'}
          tags.add("ai")
          tags.discard("code")
          empty = set()                          # {} — это пустой словарь!
          unique = set([1, 1, 2, 3])             # {1, 2, 3}
          ```

          ## Операции над множествами

          ```python
          a, b = {1, 2, 3}, {2, 3, 4}
          a | b   # {1, 2, 3, 4} — объединение
          a & b   # {2, 3}       — пересечение
          a - b   # {1}          — разность
          a ^ b   # {1, 4}       — симметрическая разность
          ```

          > 💡 Удалить дубликаты с сохранением порядка: `list(dict.fromkeys(items))`.
        practice:
          - type: choice
            q: Что создаст выражение `x = (5)`?
            options: ["Кортеж из одного элемента", "Число 5", "Пустой кортеж", "Ошибку"]
            answer: 1
            explain: Кортеж из одного элемента пишется с запятой — `(5,)`.
          - type: output
            q: Что выведет код?
            code: |
              print(len({1, 2, 2, 3, 3, 3}))
            answer: "3"
          - type: output
            q: Что выведет код?
            code: |
              a = {1, 2, 3, 4}
              b = {3, 4, 5}
              print(sorted(a & b))
            answer: "[3, 4]"
          - type: output
            q: Что выведет код?
            code: |
              first, *rest = [10, 20, 30]
              print(rest)
            answer: "[20, 30]"
          - type: bug
            q: Где ошибка?
            code: |
              point = (3, 4)
              print(point[0])
              point[0] = 5
            bugLine: 3
            explain: Кортежи неизменяемы — `TypeError`.
          - type: choice
            q: Как создать пустое множество?
            options: ["`{}`", "`set()`", "`[]`", "`()`"]
            answer: 1
        homework:
          task: |
            Даны два списка учеников, записавшихся на кружки по программированию и по робототехнике. Выведите: кто ходит на оба кружка; кто только на программирование; общее число уникальных учеников.
          checklist:
            - Используются операции над множествами
            - Результаты выводятся отсортированными
