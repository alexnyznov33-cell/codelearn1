      - id: py-02-04
        title: Стек, очередь и модуль collections
        minutes: 25
        xp: 30
        theory: |
          ## Стек (LIFO)

          «Последним пришёл — первым ушёл». В Python стек — обычный список:

          ```python
          stack = []
          stack.append(1)    # push
          stack.append(2)
          stack.pop()        # 2 — pop с конца за O(1)
          ```

          ## Очередь (FIFO) — deque

          `list.pop(0)` работает за O(n). Для очередей используйте `deque`:

          ```python
          from collections import deque
          q = deque([1, 2])
          q.append(3)        # в конец
          q.popleft()        # 1 — из начала за O(1)
          q.appendleft(0)
          last3 = deque(maxlen=3)   # хранит только 3 последних элемента
          ```

          ## Counter

          ```python
          from collections import Counter
          c = Counter("abracadabra")
          c["a"]               # 5
          c.most_common(2)     # [('a', 5), ('b', 2)]
          ```

          ## defaultdict

          ```python
          from collections import defaultdict
          groups = defaultdict(list)
          for word in ["кот", "кит", "дом"]:
              groups[word[0]].append(word)   # нет KeyError
          # {'к': ['кот', 'кит'], 'д': ['дом']}
          ```

          ## namedtuple

          ```python
          from collections import namedtuple
          Point = namedtuple("Point", ["x", "y"])
          p = Point(3, 4)
          p.x, p.y             # 3 4
          ```
        practice:
          - type: output
            q: Что выведет код?
            code: |
              s = [1, 2, 3]
              s.append(4)
              s.pop()
              print(s.pop())
            answer: "3"
          - type: output
            q: Что выведет код?
            code: |
              from collections import deque
              q = deque([1, 2, 3])
              q.append(4)
              q.popleft()
              print(list(q))
            answer: "[2, 3, 4]"
          - type: output
            q: Что выведет код?
            code: |
              from collections import Counter
              print(Counter("hello")["l"])
            answer: "2"
          - type: choice
            q: Почему для очереди лучше `deque`, а не `list`?
            options: ["`deque` занимает меньше памяти", "Удаление из начала `deque` — O(1), у списка — O(n)", "`list` не умеет удалять элементы", "Разницы нет"]
            answer: 1
          - type: fill
            q: Сгруппируйте слова по длине без KeyError
            code: |
              from collections import ___
              by_len = defaultdict(___)
              for w in words:
                  by_len[len(w)].append(w)
            answers: [defaultdict, list]
        homework:
          task: |
            **Проверка скобок.** Напишите функцию `is_balanced(s)`, которая проверяет, правильно ли расставлены скобки `()[]{}` в строке. Примеры: `"([]{})"` → True, `"(]"` → False, `"(("` → False. Используйте стек.
          hints:
            - "Словарь пар: `{')': '(', ']': '[', '}': '{'}`."
          checklist:
            - Решение использует стек
            - Пустая строка — True
          solution: |
            def is_balanced(s):
                pairs = {")": "(", "]": "[", "}": "{"}
                stack = []
                for ch in s:
                    if ch in "([{":
                        stack.append(ch)
                    elif ch in pairs:
                        if not stack or stack.pop() != pairs[ch]:
                            return False
                return not stack

            print(is_balanced("([]{})"), is_balanced("(]"), is_balanced("(("))

      - id: py-02-05
        title: Практикум «Учёт расходов»
        minutes: 40
        xp: 40
        theory: |
          Закрепим коллекции на мини-проекте. Программа хранит расходы в списке словарей:

          ```python
          expenses = [
              {"date": "2026-10-01", "category": "еда", "amount": 450.0},
              {"date": "2026-10-01", "category": "транспорт", "amount": 60.0},
              {"date": "2026-10-02", "category": "еда", "amount": 1200.0},
          ]
          ```

          ## Типовые операции

          ```python
          total = sum(e["amount"] for e in expenses)           # общая сумма

          by_cat = {}
          for e in expenses:                                   # сумма по категориям
              by_cat[e["category"]] = by_cat.get(e["category"], 0) + e["amount"]

          food = [e for e in expenses if e["category"] == "еда"]   # фильтр

          top = max(expenses, key=lambda e: e["amount"])       # самый крупный
          by_amount = sorted(expenses, key=lambda e: e["amount"], reverse=True)
          categories = sorted({e["category"] for e in expenses})  # уникальные
          ```

          `key=lambda e: e["amount"]` говорит функциям `max`/`sorted`, по какому полю сравнивать. Подробно lambda разберём в модуле «Функции».

          ## Меню программы

          ```python
          while True:
              cmd = input("1-добавить 2-отчёт 0-выход: ")
              if cmd == "1":
                  ...
              elif cmd == "0":
                  break
          ```
        practice:
          - type: output
            q: Что выведет код?
            code: |
              items = [{"a": 3}, {"a": 7}, {"a": 5}]
              print(sum(x["a"] for x in items))
            answer: "15"
          - type: output
            q: Что выведет код?
            code: |
              items = [{"n": "x", "p": 3}, {"n": "y", "p": 9}]
              print(max(items, key=lambda i: i["p"])["n"])
            answer: "y"
          - type: output
            q: Что выведет код?
            code: |
              cats = ["еда", "кафе", "еда"]
              print(len({c for c in cats}))
            answer: "2"
          - type: order
            q: Соберите подсчёт суммы по категориям
            lines:
              - by_cat = {}
              - "for e in expenses:"
              - "    cat = e[\"category\"]"
              - "    by_cat[cat] = by_cat.get(cat, 0) + e[\"amount\"]"
        homework:
          task: |
            Сделайте консольное приложение «Учёт расходов» с меню:
            1. добавить расход (дата, категория, сумма);
            2. показать все расходы, отсортированные по дате;
            3. отчёт: сумма по категориям и доля каждой в процентах;
            4. самый дорогой расход;
            0. выход.

            Неверный ввод суммы не должен ломать программу (проверяйте `replace(".", "", 1).isdigit()`).
          checklist:
            - Данные хранятся в списке словарей
            - Отчёт выводит проценты с 1 знаком
            - Пустой список не вызывает ошибок
          solution: |
            expenses = []
            while True:
                cmd = input("1-добавить 2-список 3-отчёт 4-максимум 0-выход: ")
                if cmd == "1":
                    date = input("Дата (ГГГГ-ММ-ДД): ")
                    cat = input("Категория: ").strip().lower()
                    raw = input("Сумма: ")
                    if not raw.replace(".", "", 1).isdigit():
                        print("Неверная сумма"); continue
                    expenses.append({"date": date, "category": cat, "amount": float(raw)})
                elif cmd == "2":
                    for e in sorted(expenses, key=lambda e: e["date"]):
                        print(e["date"], e["category"], e["amount"])
                elif cmd == "3":
                    total = sum(e["amount"] for e in expenses)
                    by_cat = {}
                    for e in expenses:
                        by_cat[e["category"]] = by_cat.get(e["category"], 0) + e["amount"]
                    for cat, s in by_cat.items():
                        print(f"{cat}: {s} ({s / total * 100:.1f}%)")
                elif cmd == "4" and expenses:
                    print(max(expenses, key=lambda e: e["amount"]))
                elif cmd == "0":
                    break


