        theory: |
          **Словарь** хранит пары «ключ → значение». Ключи уникальны и неизменяемы (строки, числа, кортежи). Порядок вставки сохраняется (с Python 3.7).

          ```python
          user = {"name": "Иван", "age": 30}
          user["city"] = "Москва"        # добавить / изменить
          print(user["name"])             # Иван
          print(user.get("email"))        # None — без ошибки
          print(user.get("email", "—"))   # значение по умолчанию
          del user["age"]
          "name" in user                  # True — проверка ключа
          ```

          `user["email"]` при отсутствии ключа вызовет `KeyError`.

          ## Перебор

          ```python
          for key, value in user.items():
              print(key, "=", value)
          list(user.keys()), list(user.values())
          ```

          ## Полезное

          ```python
          counts = {}
          for word in "a b a c a".split():
              counts[word] = counts.get(word, 0) + 1   # {'a': 3, 'b': 1, 'c': 1}

          squares = {x: x ** 2 for x in range(4)}      # генератор словаря
          merged = {**d1, **d2}                        # или d1 | d2 (3.9+)
          user.setdefault("tags", []).append("vip")
          ```

          Для подсчёта есть готовый `collections.Counter`, для значений по умолчанию — `collections.defaultdict`.
