            **Телефонная книга.** Программа в цикле принимает команды:
            - `add Имя Телефон` — добавить;
            - `find Имя` — найти телефон;
            - `del Имя` — удалить;
            - `list` — показать все записи по алфавиту;
            - `exit` — выход.
          hints:
            - "`cmd, *args = input().split()`"
          checklist:
            - Все команды работают
            - Поиск несуществующего имени не ломает программу
          solution: |
            book = {}
            while True:
                cmd, *args = input("> ").split() or [""]
                if cmd == "add" and len(args) == 2:
                    book[args[0]] = args[1]
