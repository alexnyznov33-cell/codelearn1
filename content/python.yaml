description: Самый популярный язык для старта, автоматизации, бэкенда и Data Science.
modules:
  - id: py-m1
    title: Основы языка
    level: Junior
    lessons:
      - id: py-01-01
        title: Первая программа, print и комментарии
        minutes: 10
        xp: 15
        theory: |
          **Python** — интерпретируемый язык: код выполняется построчно, компилировать ничего не нужно. Установите Python с [python.org](https://python.org) и редактор (VS Code или PyCharm).

          ## Первая программа

          ```python
          print("Привет, мир!")
          ```

          `print()` — встроенная функция, которая выводит значение в консоль. Ей можно передать несколько аргументов — они выведутся через пробел:

          ```python
          print("Мне", 25, "лет")      # Мне 25 лет
          print("a", "b", sep="-")     # a-b
          print("без перевода", end="")  # строка не закончится переносом
          ```

          - `sep` — разделитель между аргументами (по умолчанию пробел);
          - `end` — что печатается в конце (по умолчанию `"\n"`, перенос строки).

          ## Комментарии

          Всё после `#` до конца строки игнорируется интерпретатором. Комментарии объясняют **зачем** написан код, а не что он делает.

          ## Отступы важны

          В Python блоки кода выделяются отступами (стандарт — 4 пробела), а не фигурными скобками. Лишний отступ в начале строки — это ошибка `IndentationError`.

          > 💡 Запуск файла: `python main.py` (Windows) или `python3 main.py` (Linux/macOS).
        practice:
          - type: choice
            q: Какая функция выводит текст в консоль?
            options: ["`echo()`", "`print()`", "`console.log()`", "`write()`"]
            answer: 1
          - type: output
            q: Что выведет программа?
            code: |
              print("a", "b", "c", sep="")
            answer: abc
          - type: output
            q: Что выведет программа?
            code: |
              print("Hello", end=" ")
              print("World")
            answer: Hello World
          - type: fill
            q: Допишите код, чтобы вывести `1-2-3`
            code: |
              print(1, 2, 3, ___="-")
            answers: [sep]
          - type: bug
            q: В какой строке ошибка?
            code: |
              # приветствие
              print("Привет")
                print("Как дела?")
            bugLine: 3
            explain: Лишний отступ в начале строки вызывает `IndentationError`.
            fix: |
              print("Как дела?")
        homework:
          task: |
            Напишите программу `card.py`, которая выводит «визитку»:

            ```
            ==========
            Имя: Алекс
            Язык: Python
            ==========
            ```

            Используйте `print` с параметром `sep` хотя бы один раз.
          hints:
            - "Строку из `=` можно получить умножением: `\"=\" * 10`."
          checklist:
            - Программа запускается без ошибок
            - Использован параметр `sep`
            - Есть хотя бы один осмысленный комментарий
          solution: |
            line = "=" * 10  # рамка
            print(line)
            print("Имя", "Алекс", sep=": ")
            print("Язык", "Python", sep=": ")
            print(line)

      - id: py-01-02
        title: Переменные и типы данных
        minutes: 15
        xp: 20
        theory: |
          **Переменная** — имя, которое ссылается на значение в памяти. Тип объявлять не нужно: Python определяет его сам (**динамическая типизация**).

          ```python
          age = 25          # int — целое число
          price = 99.9      # float — дробное число
          name = "Анна"     # str — строка
          is_admin = False  # bool — логическое значение
          nothing = None    # NoneType — «ничего»
          ```

          Узнать тип: `type(age)` → `<class 'int'>`.

          ## Правила имён

          - буквы, цифры, `_`; не может начинаться с цифры;
          - регистр важен: `name` и `Name` — разные переменные;
          - стиль Python — `snake_case`: `user_name`, `max_value`;
          - константы пишут КАПСОМ: `MAX_SIZE = 100`.

          ## Множественное присваивание

          ```python
          x, y = 1, 2
          x, y = y, x      # обмен значениями без временной переменной
          a = b = 0
          ```

          ## Преобразование типов

          ```python
          int("42")      # 42
          float("3.5")   # 3.5
          str(10)        # "10"
          bool(0)        # False — 0, "", [], None считаются ложными
          int(3.99)      # 3 — дробная часть отбрасывается
          ```

          > ⚠️ `int("3.5")` вызовет `ValueError` — сначала `float()`, потом `int()`.
        practice:
          - type: choice
            q: Какой тип у значения `3.0`?
            options: ["`int`", "`float`", "`str`", "`decimal`"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              x, y = 5, 10
              x, y = y, x
              print(x, y)
            answer: 10 5
          - type: choice
            q: Какие имена переменных допустимы?
            options: ["`user_name`", "`2name`", "`_count`", "`my-var`"]
            answer: [0, 2]
          - type: output
            q: Что выведет код?
            code: |
              print(int(7.9) + int("3"))
            answer: "10"
          - type: output
            q: Что выведет код?
            code: |
              print(bool(""), bool("0"))
            answer: False True
            explain: Пустая строка ложна, а строка `"0"` не пустая — значит истинна.
          - type: bug
            q: Где ошибка?
            code: |
              count = 10
              total = 2.5
              result = count * total
              print(Result)
            bugLine: 4
            explain: Регистр имеет значение — переменной `Result` не существует (`NameError`).
            fix: print(result)
        homework:
          task: |
            Создайте переменные с информацией о товаре: название, цена (дробное), количество (целое), есть ли в наличии.
            Выведите каждую переменную и её тип в формате `Ноутбук <class 'str'>`. Затем посчитайте общую стоимость (цена × количество).
          hints:
            - "Тип выводится через `type(переменная)`."
          checklist:
            - Использованы 4 разных типа данных
            - Имена в стиле snake_case
            - Общая стоимость выводится правильно
          solution: |
            title = "Ноутбук"
            price = 54999.9
            quantity = 3
            in_stock = True
            for value in (title, price, quantity, in_stock):
                print(value, type(value))
            print("Итого:", price * quantity)

      - id: py-01-03
        title: Ввод данных и арифметика
        minutes: 15
        xp: 20
        theory: |
          ## Ввод с клавиатуры

          `input()` всегда возвращает **строку**. Для чисел нужно преобразование:

          ```python
          name = input("Как тебя зовут? ")
          age = int(input("Сколько лет? "))
          print("Через 10 лет тебе будет", age + 10)
          ```

          ## Арифметические операторы

          | Оператор | Действие | Пример | Результат |
          |---|---|---|---|
          | `+ - *` | сложение, вычитание, умножение | `2 * 3` | `6` |
          | `/` | деление (всегда float) | `7 / 2` | `3.5` |
          | `//` | целочисленное деление | `7 // 2` | `3` |
          | `%` | остаток от деления | `7 % 2` | `1` |
          | `**` | возведение в степень | `2 ** 10` | `1024` |

          Приоритет как в математике: `**`, затем `* / // %`, затем `+ -`. Скобки меняют порядок.

          ## Составное присваивание

          ```python
          score = 10
          score += 5   # score = score + 5
          score *= 2   # 30
          ```

          ## Полезные функции

          `abs(-5)` → 5, `round(3.14159, 2)` → 3.14, `max(1, 7, 3)` → 7, `min(...)`, `pow(2, 3)` → 8.

          > 💡 Остаток `%` часто применяют для проверки чётности: `n % 2 == 0`.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              print(17 // 5, 17 % 5)
            answer: 3 2
          - type: output
            q: Что выведет код?
            code: |
              print(10 / 2)
            answer: "5.0"
            explain: Оператор `/` всегда возвращает `float`.
          - type: output
            q: Что выведет код?
            code: |
              print(2 + 3 * 2 ** 2)
            answer: "14"
          - type: choice
            q: Пользователь ввёл `5`. Что выведет `print(input() * 2)`?
            options: ["`10`", "`55`", "Ошибку", "`5 5`"]
            answer: 1
            explain: "`input()` возвращает строку, а строка × 2 — это повторение."
          - type: fill
            q: Посчитайте сумму двух введённых чисел
            code: |
              a = ___(input())
              b = int(input())
              print(a ___ b)
            answers: [int, "+"]
          - type: order
            q: Соберите программу, которая переводит минуты в часы и минуты
            lines:
              - total = int(input())
              - hours = total // 60
              - minutes = total % 60
              - print(hours, "ч", minutes, "мин")
        homework:
          task: |
            **Калькулятор чаевых.** Программа спрашивает сумму счёта и процент чаевых, затем выводит сумму чаевых и итог, округлённые до 2 знаков.

            ```
            Сумма счёта: 2350
            Процент чаевых: 10
            Чаевые: 235.0
            Итого: 2585.0
            ```
          hints:
            - Сумма может быть дробной — используйте `float()`.
            - "Процент: `bill * percent / 100`."
          checklist:
            - Ввод корректно преобразуется в числа
            - Используется `round(..., 2)`
          solution: |
            bill = float(input("Сумма счёта: "))
            percent = float(input("Процент чаевых: "))
            tip = round(bill * percent / 100, 2)
            print("Чаевые:", tip)
            print("Итого:", round(bill + tip, 2))

      - id: py-01-04
        title: Условия if / elif / else
        minutes: 20
        xp: 25
        theory: |
          ## Операторы сравнения

          `==` равно, `!=` не равно, `<`, `>`, `<=`, `>=`. Результат — `True` или `False`.
          В Python можно писать цепочки: `0 < x < 10`.

          ## Конструкция if

          ```python
          age = int(input())
          if age >= 18:
              print("Доступ разрешён")
          elif age >= 14:
              print("Нужно разрешение родителей")
          else:
              print("Доступ запрещён")
          ```

          Условия проверяются сверху вниз, выполняется **первая** истинная ветка. `elif` и `else` необязательны.

          ## Логические операторы

          - `and` — истина, если оба условия истинны;
          - `or` — истина, если хотя бы одно истинно;
          - `not` — отрицание.

          ```python
          if login == "admin" and password == "1234":
              print("Добро пожаловать")
          ```

          ## Тернарный оператор

          ```python
          status = "взрослый" if age >= 18 else "ребёнок"
          ```

          ## match (Python 3.10+)

          ```python
          match command:
              case "start":
                  print("Запуск")
              case "stop" | "exit":
                  print("Остановка")
              case _:
                  print("Неизвестная команда")
          ```

          > ⚠️ Не путайте `=` (присваивание) и `==` (сравнение).
        practice:
          - type: output
            q: Что выведет код?
            code: |
              x = 15
              if x > 10:
                  print("A")
              elif x > 5:
                  print("B")
              else:
                  print("C")
            answer: A
            explain: Выполняется только первая истинная ветка.
          - type: output
            q: Что выведет код?
            code: |
              print(5 > 3 and 2 > 4, not False)
            answer: False True
          - type: fill
            q: Проверьте, что число чётное
            code: |
              n = int(input())
              if n ___ 2 == 0:
                  print("чётное")
              ___:
                  print("нечётное")
            answers: ["%", else]
          - type: output
            q: Что выведет код?
            code: |
              age = 16
              print("да" if age >= 18 else "нет")
            answer: нет
          - type: bug
            q: Найдите ошибку
            code: |
              score = int(input())
              if score = 100:
                  print("Идеально!")
            bugLine: 2
            fix: "if score == 100:"
            explain: Для сравнения используется `==`.
          - type: choice
            q: Как в Python записать «x от 1 до 10 включительно»?
            options: ["`1 <= x <= 10`", "`x >= 1 && x <= 10`", "`1 =< x =< 10`", "`x in 1..10`"]
            answer: 0
        homework:
          task: |
            **Проверка года.** Пользователь вводит год. Выведите `високосный` или `обычный`.

            Правило: год високосный, если делится на 4, но не на 100, **или** делится на 400.
            Примеры: 2024 → високосный, 1900 → обычный, 2000 → високосный.
          hints:
            - "Используйте `%`, `and`, `or`."
          checklist:
            - 2024, 1900, 2000, 2023 дают верный ответ
            - Условие записано одним выражением или аккуратной цепочкой elif
          solution: |
            year = int(input("Год: "))
            if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
                print("високосный")
            else:
                print("обычный")

      - id: py-01-05
        title: Циклы while и for, range
        minutes: 20
        xp: 25
        theory: |
          ## while

          Повторяет блок, пока условие истинно:

          ```python
          n = 3
          while n > 0:
              print(n)
              n -= 1
          print("Старт!")
          ```

          Не забывайте менять переменную условия — иначе получится бесконечный цикл.

          ## for и range

          `for` перебирает элементы последовательности. `range` генерирует числа:

          ```python
          for i in range(5):        # 0 1 2 3 4
              print(i)
          for i in range(2, 8, 2):  # 2 4 6 — (старт, стоп, шаг), стоп не входит
              print(i)
          for i in range(5, 0, -1): # 5 4 3 2 1
              print(i)
          for ch in "кот":          # перебор символов строки
              print(ch)
          ```

          ## break, continue, else

          - `break` — немедленно выйти из цикла;
          - `continue` — перейти к следующей итерации;
          - `else` у цикла выполняется, если цикл завершился **без** `break`.

          ```python
          for n in range(2, 10):
              if n % 7 == 0:
                  print("Нашли", n)
                  break
          else:
              print("Не нашли")
          ```

          ## Накопление результата

          ```python
          total = 0
          for i in range(1, 101):
              total += i
          print(total)  # 5050
          ```
        practice:
          - type: output
            q: Что выведет код? (числа через пробел)
            code: |
              for i in range(1, 10, 3):
                  print(i, end=" ")
            answer: 1 4 7
          - type: output
            q: Сколько раз напечатается «hi»? Введите число.
            code: |
              i = 0
              while i < 10:
                  print("hi")
                  i += 3
            answer: "4"
            explain: i принимает значения 0, 3, 6, 9.
          - type: output
            q: Что выведет код?
            code: |
              for i in range(6):
                  if i == 4:
                      break
                  if i % 2 == 0:
                      continue
                  print(i)
            answer: |
              1
              3
          - type: fill
            q: Выведите числа от 10 до 1
            code: |
              for i in range(10, ___, ___):
                  print(i)
            answers: ["0", "-1"]
          - type: bug
            q: Этот цикл никогда не закончится. Где ошибка?
            code: |
              count = 5
              while count > 0:
                  print(count)
                  count += 1
            bugLine: 4
            fix: "    count -= 1"
          - type: choice
            q: Когда выполняется блок `else` у цикла `for`?
            options: ["Всегда", "Если цикл не выполнился ни разу", "Если цикл завершился без `break`", "Если произошла ошибка"]
            answer: 2
        homework:
          task: |
            **Угадай число.** Программа загадывает число от 1 до 100 (`random.randint(1, 100)`), пользователь угадывает. После каждой попытки — подсказка «больше» / «меньше». В конце — количество попыток.
          hints:
            - "`import random` в начале файла."
            - Бесконечный цикл `while True` + `break` при угадывании.
          checklist:
            - Подсказки работают правильно
            - Считается количество попыток
            - Программа завершается после угадывания
          solution: |
            import random

            secret = random.randint(1, 100)
            attempts = 0
            while True:
                guess = int(input("Ваше число: "))
                attempts += 1
                if guess < secret:
                    print("больше")
                elif guess > secret:
                    print("меньше")
                else:
                    print(f"Угадали за {attempts} попыток!")
                    break

      - id: py-01-06
        title: Строки и f-строки
        minutes: 20
        xp: 25
        theory: |
          Строки — **неизменяемые** последовательности символов.

          ## Индексы и срезы

          ```python
          s = "Python"
          s[0]     # 'P'
          s[-1]    # 'n' — с конца
          s[1:4]   # 'yth' — с 1 по 3 включительно
          s[:2]    # 'Py'
          s[::-1]  # 'nohtyP' — разворот
          len(s)   # 6
          ```

          ## Основные методы

          ```python
          "hello".upper()            # 'HELLO'
          "  hi  ".strip()           # 'hi'
          "a,b,c".split(",")         # ['a', 'b', 'c']
          "-".join(["a", "b"])       # 'a-b'
          "мама".replace("м", "п")   # 'папа'
          "hello".find("l")          # 2 (или -1, если нет)
          "abc".startswith("ab")     # True
          "123".isdigit()            # True
          "py" in "python"           # True
          ```

          Методы **возвращают новую строку**, исходная не меняется: `s.upper()` без присваивания ничего не изменит.

          ## f-строки

          ```python
          name, score = "Аня", 95.456
          print(f"{name} набрала {score:.1f} баллов")  # Аня набрала 95.5 баллов
          print(f"{42:05d}")    # 00042
          print(f"{name!r}")    # 'Аня'
          print(f"{2 + 2 = }")  # 2 + 2 = 4 — удобно для отладки
          ```

          Многострочные строки — в тройных кавычках `"""..."""`. Спецсимволы: `\n` перенос, `\t` табуляция.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              s = "programming"
              print(s[3:7])
            answer: gram
          - type: output
            q: Что выведет код?
            code: |
              s = "hello"
              s.upper()
              print(s)
            answer: hello
            explain: Строки неизменяемы, а результат `upper()` никуда не сохранён.
          - type: output
            q: Что выведет код?
            code: |
              print("-".join("abc"))
            answer: a-b-c
          - type: fill
            q: "Выведите `Цена: 9.99` из переменной `price = 9.987`"
            code: |
              print(___"Цена: {price:___}")
            answers: [f, ".2f"]
          - type: choice
            q: Как развернуть строку `s`?
            options: ["`s.reverse()`", "`s[::-1]`", "`reversed(s)`", "`s[-1:0]`"]
            answer: 1
            explain: "`reversed(s)` вернёт итератор, а не строку; у строк нет метода `reverse()`."
          - type: output
            q: Что выведет код?
            code: |
              words = "  Я учу   Python ".split()
              print(len(words))
            answer: "3"
            explain: "`split()` без аргументов делит по любым пробелам и убирает пустые части."
        homework:
          task: |
            **Анализ текста.** Пользователь вводит предложение. Выведите:
            1. количество слов;
            2. самое длинное слово;
            3. предложение, где каждое слово с заглавной буквы;
            4. является ли строка палиндромом без учёта пробелов и регистра («А роза упала на лапу Азора» → да).
          hints:
            - "`max(words, key=len)` найдёт самое длинное слово."
            - "Для палиндрома: `s.replace(\" \", \"\").lower()` и сравнение с разворотом."
          checklist:
            - Все 4 пункта выводятся корректно
