        homework:
          task: |
            Предскажите порядок вывода для 5 фрагментов (комбинации console.log, setTimeout с разными задержками, Promise.then, async/await, queueMicrotask, вложенные таймеры внутри then), запишите предсказания, затем проверьте в Node.js и браузере. Затем напишите функцию `processInChunks(array, fn, chunkSize)`, которая обрабатывает массив из 1 000 000 элементов частями через `setTimeout`, не блокируя страницу, и возвращает Promise с результатом.
          checklist:
            - Предсказания объяснены через микро/макрозадачи
            - processInChunks не блокирует интерфейс
            - Возвращается Promise
          solution: |
            // Фрагмент: setTimeout внутри then
            console.log("start");
            setTimeout(() => console.log("timeout 1"), 0);
            Promise.resolve().then(() => {
              console.log("then 1");
              setTimeout(() => console.log("timeout 2"), 0);
            });
            (async () => { await null; console.log("async"); })();
            console.log("end");
            // start, end, then 1, async, timeout 1, timeout 2

            function processInChunks(array, fn, chunkSize = 10_000) {
              return new Promise((resolve) => {
                const result = [];
                let i = 0;
                function chunk() {
                  const end = Math.min(i + chunkSize, array.length);
                  for (; i < end; i++) result.push(fn(array[i]));
                  if (i < array.length) setTimeout(chunk, 0);  // уступить event loop
                  else resolve(result);
                }
                chunk();
              });
            }
            const big = Array.from({ length: 1_000_000 }, (_, k) => k);
            processInChunks(big, (x) => x * 2).then((r) => console.log("Готово:", r.length));
