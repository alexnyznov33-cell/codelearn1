        homework:
          task: |
            Создайте Django-проект «Блог»: модели `Post` (заголовок, текст, автор — `User`, дата, опубликован) и `Comment`. Зарегистрируйте их в админке с поиском и фильтрами (`ModelAdmin`). Сделайте view со списком опубликованных постов (с количеством комментариев через annotate) и шаблон.
          checklist:
            - Миграции созданы и применены
            - В списке постов нет N+1
          solution: |
            # blog/models.py
            from django.conf import settings
            from django.db import models

            class Post(models.Model):
                title = models.CharField(max_length=200)
                text = models.TextField()
                author = models.ForeignKey(settings.AUTH_USER_MODEL, on_delete=models.CASCADE)
                created = models.DateTimeField(auto_now_add=True)
                published = models.BooleanField(default=False)

            class Comment(models.Model):
                post = models.ForeignKey(Post, on_delete=models.CASCADE, related_name="comments")
                text = models.TextField()

            # blog/admin.py
            from django.contrib import admin
            @admin.register(Post)
            class PostAdmin(admin.ModelAdmin):
                list_display = ("title", "author", "published", "created")
                list_filter = ("published",)
                search_fields = ("title", "text")

            # blog/views.py
            from django.db.models import Count
            from django.shortcuts import render
            def post_list(request):
                posts = (Post.objects.filter(published=True).select_related("author")
                         .annotate(n_comments=Count("comments")).order_by("-created"))
                return render(request, "blog/list.html", {"posts": posts})
