        homework:
          task: |
            Сделайте на FastAPI API «Заметки»: CRUD (`GET /notes`, `GET /notes/{id}`, `POST`, `PATCH`, `DELETE`), фильтр по тегу и поиск по тексту (`?q=`), пагинация (`skip`, `limit`). Хранение — в памяти. Проверьте все эндпоинты через `/docs`.
          checklist:
            - Правильные коды ответа (201, 204, 404)
            - PATCH обновляет только переданные поля
          solution: |
            from fastapi import FastAPI, HTTPException
            from pydantic import BaseModel

            app = FastAPI()

            class NoteIn(BaseModel):
                text: str
                tags: list[str] = []

            class NotePatch(BaseModel):
                text: str | None = None
                tags: list[str] | None = None

            class Note(NoteIn):
                id: int

            notes: dict[int, Note] = {}
            counter = 0

            @app.get("/notes")
            def list_notes(tag: str | None = None, q: str | None = None, skip: int = 0, limit: int = 20) -> list[Note]:
                res = [n for n in notes.values()
                       if (tag is None or tag in n.tags) and (q is None or q.lower() in n.text.lower())]
                return res[skip:skip + limit]

            @app.post("/notes", status_code=201)
            def create(data: NoteIn) -> Note:
                global counter
                counter += 1
                notes[counter] = Note(id=counter, **data.model_dump())
                return notes[counter]

            @app.patch("/notes/{nid}")
            def update(nid: int, data: NotePatch) -> Note:
                if nid not in notes:
                    raise HTTPException(404, "Not found")
                notes[nid] = notes[nid].model_copy(update=data.model_dump(exclude_unset=True))
                return notes[nid]

            @app.delete("/notes/{nid}", status_code=204)
            def delete(nid: int) -> None:
                if notes.pop(nid, None) is None:
                    raise HTTPException(404, "Not found")

      - id: py-11-04
        title: Pydantic и валидация
        minutes: 25
        xp: 30
        theory: |
          **Pydantic v2** — валидация и сериализация данных на основе аннотаций типов. Основа FastAPI, но полезен и сам по себе: конфиги, парсинг JSON из внешних API.

          ```python
          from datetime import date
          from pydantic import BaseModel, EmailStr, Field, field_validator, model_validator

          class UserCreate(BaseModel):
              name: str = Field(min_length=2, max_length=50)
              email: EmailStr                               # pip install "pydantic[email]"
              age: int = Field(ge=14, le=120)
              tags: list[str] = []
              birthday: date | None = None

              @field_validator("name")
              @classmethod
              def strip_name(cls, v: str) -> str:
                  return v.strip().title()

          class PasswordChange(BaseModel):
              password: str
              confirm: str

              @model_validator(mode="after")
              def passwords_match(self):
                  if self.password != self.confirm:
                      raise ValueError("Пароли не совпадают")
                  return self
          ```

          ## Использование

          ```python
          u = UserCreate(name=" анна ", email="a@x.ru", age="25")   # "25" → 25 (приведение)
          u.name                       # 'Анна'
          u.model_dump()               # → dict
          u.model_dump_json()          # → JSON-строка
          UserCreate.model_validate({"name": "Bob", ...})   # из словаря
          UserCreate.model_validate_json('{"name": ...}')   # из JSON

          from pydantic import ValidationError
          try:
              UserCreate(name="A", email="bad", age=5)
          except ValidationError as e:
              print(e.errors())        # список всех ошибок с путями к полям
          ```

          ## Разделение схем

          Хорошая практика — отдельные модели для входа и выхода: `UserCreate` (с паролем), `UserUpdate` (все поля необязательные), `UserOut` (без пароля). В FastAPI: `response_model=UserOut`. Для чтения из ORM: `model_config = ConfigDict(from_attributes=True)`.

          ## Настройки приложения

          ```python
          from pydantic_settings import BaseSettings
          class Settings(BaseSettings):
              database_url: str
              debug: bool = False
          settings = Settings()    # читает переменные окружения и .env
          ```
        practice:
          - type: choice
            q: Что произойдёт при `UserCreate(age="25", ...)`, где age — int?
            options: ["ValidationError", "Строка приведётся к 25", "age останется строкой", "TypeError"]
            answer: 1
          - type: fill
            q: Ограничьте возраст диапазоном 18–100
            code: |
              age: int = Field(___=18, ___=100)
            answers: [ge, le]
          - type: choice
            q: Как получить словарь из модели в Pydantic v2?
            options: ["`.dict()`", "`.model_dump()`", "`.to_dict()`", "`dict(model)` всегда"]
            answer: 1
          - type: choice
            q: Зачем отдельная модель UserOut?
            options: ["Для скорости", "Чтобы не вернуть клиенту лишние поля, например хеш пароля", "Обязательно в Pydantic", "Для миграций"]
            answer: 1
        homework:
          task: |
            Опишите модели для регистрации: `RegisterIn` (email, пароль ≥ 8 символов с цифрой и буквой, подтверждение, телефон в формате +7XXXXXXXXXX, дата рождения — старше 14 лет), `UserOut` (без пароля). Добавьте `Settings` на pydantic-settings с `DATABASE_URL` и `SECRET_KEY` из `.env`.
          checklist:
            - field_validator и model_validator
            - Понятные сообщения ошибок
          solution: |
            import re
            from datetime import date
            from pydantic import BaseModel, EmailStr, field_validator, model_validator
            from pydantic_settings import BaseSettings, SettingsConfigDict

            class RegisterIn(BaseModel):
                email: EmailStr
                password: str
                confirm: str
                phone: str
                birthday: date

                @field_validator("password")
                @classmethod
                def strong(cls, v):
                    if len(v) < 8 or not re.search(r"\d", v) or not re.search(r"[A-Za-zА-Яа-я]", v):
                        raise ValueError("Минимум 8 символов, буквы и цифры")
                    return v

                @field_validator("phone")
                @classmethod
                def phone_fmt(cls, v):
                    if not re.fullmatch(r"\+7\d{10}", v):
                        raise ValueError("Формат +7XXXXXXXXXX")
                    return v

                @model_validator(mode="after")
                def check(self):
                    if self.password != self.confirm:
                        raise ValueError("Пароли не совпадают")
                    if (date.today() - self.birthday).days < 14 * 365.25:
                        raise ValueError("Нужно быть старше 14 лет")
                    return self

            class UserOut(BaseModel):
                id: int
                email: EmailStr
                phone: str

            class Settings(BaseSettings):
                model_config = SettingsConfigDict(env_file=".env")
                database_url: str
                secret_key: str

      - id: py-11-05
        title: Аутентификация JWT
        minutes: 30
        xp: 35
        theory: |
          ## Аутентификация и авторизация

          - **Аутентификация** — кто ты? (логин и пароль → токен);
          - **Авторизация** — что тебе можно? (роли, права).

          ## Хранение паролей

          Пароли **никогда** не хранят открыто и не шифруют обратимо — только хеш с солью медленным алгоритмом (bcrypt, argon2):

          ```python
          from passlib.context import CryptContext
          pwd = CryptContext(schemes=["bcrypt"])
          hashed = pwd.hash("secret123")
          pwd.verify("secret123", hashed)   # True
          ```

          ## JWT (JSON Web Token)

          Строка из трёх частей `header.payload.signature` в base64. Payload **не зашифрован** (виден всем), но подписан секретным ключом — подделать нельзя.

          ```python
          from datetime import datetime, timedelta, timezone
          import jwt                                   # pip install pyjwt

          SECRET = "из переменной окружения"

          def create_token(user_id: int) -> str:
              payload = {"sub": str(user_id), "exp": datetime.now(timezone.utc) + timedelta(minutes=30)}
              return jwt.encode(payload, SECRET, algorithm="HS256")

          def decode_token(token: str) -> int:
              data = jwt.decode(token, SECRET, algorithms=["HS256"])   # проверит подпись и срок
              return int(data["sub"])
          ```

          ## В FastAPI

          ```python
          from fastapi import Depends, HTTPException
          from fastapi.security import OAuth2PasswordBearer

          oauth2 = OAuth2PasswordBearer(tokenUrl="/auth/login")

          def current_user(token: str = Depends(oauth2), db=Depends(get_db)) -> User:
              try:
                  user_id = decode_token(token)
              except jwt.PyJWTError:
                  raise HTTPException(401, "Invalid token", headers={"WWW-Authenticate": "Bearer"})
              return db.get(User, user_id)

          @app.get("/me")
          def me(user: User = Depends(current_user)):
              return user
          ```

          Клиент передаёт заголовок `Authorization: Bearer <token>`. Обычно выдают короткий **access**-токен (15–30 мин) и долгий **refresh**-токен для его обновления. Никогда не кладите в payload пароли и секреты.
        practice:
          - type: choice
            q: Как правильно хранить пароли?
            options: ["Открытым текстом", "Зашифровать AES", "Хеш bcrypt/argon2 с солью", "MD5"]
            answer: 2
          - type: choice
            q: Можно ли прочитать payload JWT без секретного ключа?
            options: ["Нет, он зашифрован", "Да, он только подписан, не зашифрован", "Только сервер", "Только с паролем"]
            answer: 1
          - type: choice
            q: Чем отличаются 401 и 403?
            options: ["Ничем", "401 — не аутентифицирован, 403 — аутентифицирован, но нет прав", "403 — не найдено", "401 — ошибка сервера"]
            answer: 1
          - type: fill
            q: Заголовок для передачи токена
            code: |
              Authorization: ___ eyJhbGciOiJIUzI1NiJ9...
            answers: [Bearer]
        homework:
          task: |
            Добавьте в API «Заметки» регистрацию (`POST /auth/register`), вход (`POST /auth/login`, возвращает JWT), эндпоинт `/me` и сделайте так, чтобы каждый пользователь видел и менял только свои заметки. Пароли хешируются bcrypt, секрет — из переменной окружения.
          checklist:
            - Без токена — 401, чужая заметка — 404 или 403
            - Токен имеет срок жизни
          solution: |
            from fastapi import Depends, FastAPI, HTTPException
            from fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm
            from passlib.context import CryptContext
            import jwt, os
            from datetime import datetime, timedelta, timezone

            app = FastAPI()
            SECRET = os.environ.get("SECRET_KEY", "dev-secret")
            pwd = CryptContext(schemes=["bcrypt"])
            oauth2 = OAuth2PasswordBearer(tokenUrl="/auth/login")
            users: dict[str, str] = {}               # username -> hash
            notes: list[dict] = []

            @app.post("/auth/register", status_code=201)
            def register(form: OAuth2PasswordRequestForm = Depends()):
                if form.username in users:
                    raise HTTPException(409, "Уже существует")
                users[form.username] = pwd.hash(form.password)

            @app.post("/auth/login")
            def login(form: OAuth2PasswordRequestForm = Depends()):
                h = users.get(form.username)
                if not h or not pwd.verify(form.password, h):
                    raise HTTPException(401, "Неверные данные")
                exp = datetime.now(timezone.utc) + timedelta(minutes=30)
                return {"access_token": jwt.encode({"sub": form.username, "exp": exp}, SECRET, "HS256"),
                        "token_type": "bearer"}

            def current_user(token: str = Depends(oauth2)) -> str:
                try:
                    return jwt.decode(token, SECRET, algorithms=["HS256"])["sub"]
                except jwt.PyJWTError:
                    raise HTTPException(401, "Invalid token")

            @app.get("/notes")
            def my_notes(user: str = Depends(current_user)):
                return [n for n in notes if n["owner"] == user]

      - id: py-11-06
        title: Django — обзор и ORM
        minutes: 30
        xp: 35
        theory: |
          **Django** — «фреймворк с батарейками»: ORM, миграции, админка, аутентификация, формы, шаблоны — всё из коробки. Отлично подходит для контентных сайтов, CRM, админ-панелей.

          ## Старт

          ```
          pip install django
          django-admin startproject config .
          python manage.py startapp shop
          python manage.py runserver
          ```

          Проект состоит из **приложений** (apps). Архитектура MTV: **M**odel — данные, **T**emplate — HTML, **V**iew — обработчик запроса.

          ## Модели и ORM

          ```python
          # shop/models.py
          from django.db import models

          class Category(models.Model):
              name = models.CharField(max_length=100)

          class Product(models.Model):
              name = models.CharField(max_length=200)
              price = models.DecimalField(max_digits=10, decimal_places=2)
              category = models.ForeignKey(Category, on_delete=models.CASCADE, related_name="products")
              created = models.DateTimeField(auto_now_add=True)

              def __str__(self):
                  return self.name
          ```

          ```
          python manage.py makemigrations
          python manage.py migrate
          ```

          ## Запросы

          ```python
          Product.objects.create(name="Мышь", price=990, category=cat)
          Product.objects.filter(price__lt=1000, name__icontains="мыш").order_by("-price")
          Product.objects.get(pk=1)
          Product.objects.exclude(category__name="Архив").count()
          from django.db.models import Avg, Count
          Category.objects.annotate(n=Count("products")).filter(n__gt=5)
          Product.objects.select_related("category")        # JOIN — против N+1 для FK
          Category.objects.prefetch_related("products")     # отдельный запрос для обратных связей
          ```

          QuerySet ленивый — запрос выполняется при переборе, срезе или `list()`.

          ## Админка

          ```python
          # shop/admin.py
          from django.contrib import admin
          admin.site.register(Product)
          ```

          `python manage.py createsuperuser` → готовая админ-панель на `/admin`. Для API используют **Django REST Framework**.
