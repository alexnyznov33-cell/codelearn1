            | GET | /projects/{id}/tasks?status=done&page=1&limit=20 | задачи | 200 | 404 |
            | POST | /projects/{id}/tasks | создать задачу | 201 | 404, 422 |
            | PATCH | /tasks/{id} | изменить статус | 200 | 404, 409, 422 |

      - id: py-11-02
        title: Библиотека requests
        minutes: 20
        xp: 25
        theory: |
          `requests` — стандарт де-факто для HTTP-запросов в синхронном коде.

          ```python
          import requests

          r = requests.get(
              "https://api.github.com/search/repositories",
              params={"q": "language:python", "sort": "stars"},    # ?q=...&sort=...
              headers={"Accept": "application/vnd.github+json"},
              timeout=10,                                          # ВСЕГДА указывайте
          )
          r.status_code          # 200
          r.raise_for_status()   # исключение для 4xx/5xx
          data = r.json()
          r.headers["Content-Type"]
          ```

          ## Отправка данных

          ```python
          requests.post(url, json={"name": "Аня"})            # JSON-тело
          requests.post(url, data={"login": "a"})             # форма
          requests.post(url, files={"file": open("a.png", "rb")})
          requests.put(url, json=...); requests.delete(url)
          ```

          ## Session

          ```python
          with requests.Session() as s:
              s.headers["Authorization"] = f"Bearer {token}"
              s.get(url1)    # заголовки, cookies и TCP-соединения переиспользуются
              s.get(url2)
          ```

          ## Обработка ошибок

          ```python
          try:
              r = requests.get(url, timeout=5)
              r.raise_for_status()
          except requests.Timeout:
              ...
          except requests.HTTPError as e:
              print(e.response.status_code)
          except requests.RequestException:      # базовый класс всех ошибок requests
              ...
          ```

          ## Повторы

          ```python
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          s.mount("https://", HTTPAdapter(max_retries=Retry(total=3, backoff_factor=0.5,
                                                            status_forcelist=[502, 503, 504])))
          ```

          Секреты (токены API) храните в переменных окружения: `os.environ["API_TOKEN"]`, а не в коде.
        practice:
          - type: choice
            q: Почему важно передавать `timeout`?
            options: ["Ускоряет запрос", "Без него запрос может зависнуть навсегда", "Обязательный аргумент", "Для кэширования"]
            answer: 1
          - type: fill
            q: Отправьте JSON и проверьте статус
            code: |
              r = requests.post(url, ___={"title": "Задача"}, timeout=5)
              r.___()
            answers: [json, raise_for_status]
          - type: choice
            q: "Во что превратится `params={\"q\": \"кот\", \"page\": 2}`?"
            options: ["Тело запроса JSON", "Строка запроса ?q=кот&page=2 (URL-кодированная)", "Заголовки", "Cookies"]
            answer: 1
          - type: choice
            q: Где хранить токен API?
            options: ["В коде", "В переменной окружения или менеджере секретов", "В README", "В комментарии"]
            answer: 1
        homework:
          task: |
            Напишите клиент `GitHubClient` на `requests.Session`: методы `get_user(login)`, `list_repos(login)` с поддержкой пагинации (параметр `page`, пока не вернётся пустой список), `top_languages(login)`. Токен — из переменной окружения `GITHUB_TOKEN` (опционально). Обработайте 404 и rate limit (403/429).
          checklist:
            - Одна Session на клиент
            - Пагинация работает
          solution: |
            import os
            from collections import Counter
            import requests

            class GitHubClient:
                BASE = "https://api.github.com"
                def __init__(self):
                    self.s = requests.Session()
                    if token := os.getenv("GITHUB_TOKEN"):
                        self.s.headers["Authorization"] = f"Bearer {token}"
                def _get(self, path, **params):
                    r = self.s.get(self.BASE + path, params=params, timeout=10)
                    if r.status_code == 404:
                        raise LookupError(path)
                    if r.status_code in (403, 429):
                        raise RuntimeError("Rate limit")
                    r.raise_for_status()
                    return r.json()
                def get_user(self, login):
                    return self._get(f"/users/{login}")
                def list_repos(self, login):
                    page, repos = 1, []
                    while batch := self._get(f"/users/{login}/repos", per_page=100, page=page):
                        repos += batch; page += 1
                    return repos
                def top_languages(self, login):
                    return Counter(r["language"] for r in self.list_repos(login) if r["language"]).most_common(3)

            print(GitHubClient().top_languages("gvanrossum"))

      - id: py-11-03
        title: FastAPI — первое API
        minutes: 30
        xp: 35
        theory: |
          **FastAPI** — современный асинхронный фреймворк: высокая скорость, валидация через Pydantic, автоматическая документация Swagger.

          ```
          pip install "fastapi[standard]"
          ```

          ```python
          # main.py
          from fastapi import FastAPI, HTTPException, status
          from pydantic import BaseModel

          app = FastAPI(title="Tasks API")

          class TaskIn(BaseModel):
              title: str
              done: bool = False

          class Task(TaskIn):
              id: int

          tasks: dict[int, Task] = {}

          @app.get("/tasks")
          def list_tasks(done: bool | None = None, limit: int = 20) -> list[Task]:   # query-параметры
              items = [t for t in tasks.values() if done is None or t.done == done]
              return items[:limit]

          @app.get("/tasks/{task_id}")
          def get_task(task_id: int) -> Task:                 # path-параметр, автоматически int
              if task_id not in tasks:
                  raise HTTPException(status_code=404, detail="Задача не найдена")
              return tasks[task_id]

          @app.post("/tasks", status_code=status.HTTP_201_CREATED)
          def create_task(data: TaskIn) -> Task:              # тело запроса валидируется моделью
              task = Task(id=len(tasks) + 1, **data.model_dump())
              tasks[task.id] = task
              return task

          @app.delete("/tasks/{task_id}", status_code=204)
          def delete_task(task_id: int) -> None:
              tasks.pop(task_id, None)
          ```

          Запуск: `fastapi dev main.py` → документация на `http://127.0.0.1:8000/docs`.

          ## Dependency Injection

          ```python
          from fastapi import Depends

          def get_db():
              db = SessionLocal()
              try:
                  yield db
              finally:
                  db.close()

          @app.get("/users/{uid}")
          def get_user(uid: int, db: Session = Depends(get_db)): ...
          ```

          Обработчики могут быть `async def` — тогда внутри используйте только асинхронные библиотеки.
