    lessons:
      - id: py-11-01
        title: HTTP, REST и JSON
        minutes: 25
        xp: 30
        theory: |
          **HTTP** — протокол «запрос → ответ» между клиентом и сервером.

          ## Запрос

          ```
          POST /api/orders HTTP/1.1
          Host: shop.ru
          Content-Type: application/json
          Authorization: Bearer eyJhbGc...

          {"product_id": 7, "qty": 2}
          ```

          Метод, путь, заголовки, тело.

          ## Методы

          | Метод | Назначение | Идемпотентен |
          |---|---|---|
          | GET | получить ресурс | да |
          | POST | создать | нет |
          | PUT | заменить целиком | да |
          | PATCH | частично изменить | обычно нет |
          | DELETE | удалить | да |

          **Идемпотентность** — повторный запрос даёт тот же результат (важно для повторов при сбоях сети).

          ## Коды ответа

          - `2xx` успех: 200 OK, 201 Created, 204 No Content;
          - `3xx` перенаправление: 301, 304 Not Modified;
          - `4xx` ошибка клиента: 400 Bad Request, 401 Unauthorized (не аутентифицирован), 403 Forbidden (нет прав), 404 Not Found, 409 Conflict, 422 Unprocessable Entity (ошибка валидации), 429 Too Many Requests;
          - `5xx` ошибка сервера: 500, 502, 503.

          ## REST

          Стиль API, где URL — это **ресурсы** (существительные), а действие задаёт метод:

          ```
          GET    /users           список
          POST   /users           создать
          GET    /users/42        один
          PATCH  /users/42        изменить
          DELETE /users/42        удалить
          GET    /users/42/orders вложенный ресурс
          GET    /orders?status=paid&page=2&limit=20   фильтры и пагинация
          ```

          ❌ Плохо: `/getUsers`, `/deleteUser?id=42`. Сервер в REST **не хранит состояние** клиента между запросами (stateless) — всё нужное передаётся в запросе (например, токен).
        practice:
          - type: choice
            q: Какой код вернуть после успешного создания ресурса?
            options: ["200", "201", "204", "302"]
            answer: 1
          - type: choice
            q: Пользователь не вошёл в систему. Какой код?
            options: ["401", "403", "404", "500"]
            answer: 0
          - type: choice
            q: Какой URL соответствует REST?
            options: ["`POST /createOrder`", "`GET /orders/15`", "`GET /deleteOrder?id=15`", "`POST /orders/get`"]
            answer: 1
          - type: choice
            q: Какие методы идемпотентны?
            options: ["GET", "POST", "PUT", "DELETE"]
            answer: [0, 2, 3]
          - type: choice
            q: Данные в запросе не прошли валидацию. Какой код типично возвращает API?
            options: ["200", "422", "500", "301"]
            answer: 1
        homework:
          task: |
            Спроектируйте REST API для сервиса «Список задач с проектами»: ресурсы, URL, методы, коды ответов для успеха и ошибок, формат JSON запросов и ответов, пагинация и фильтры. Оформите как таблицу в Markdown.
          checklist:
            - Только существительные в URL
            - Для каждого эндпоинта указаны коды ошибок
          solution: |
            | Метод | URL | Описание | Успех | Ошибки |
