        homework:
          task: |
            Сделайте страницу «Пользователи и посты» на открытом API https://jsonplaceholder.typicode.com: список пользователей; по клику — его посты (загрузка с индикатором); форма создания поста (POST, показать ответ сервера); поиск по имени с debounce, который фильтрует список. Вынесите запросы в модуль `api.js` с функцией-обёрткой, обрабатывающей ошибки HTTP. Покажите понятное сообщение при отсутствии сети.
          checklist:
            - Проверяется res.ok
            - Есть индикатор загрузки и сообщения об ошибках
            - Запросы вынесены в отдельную обёртку
          solution: |
            // api.js
            const BASE = "https://jsonplaceholder.typicode.com";
            export async function api(path, { method = "GET", body } = {}) {
              let res;
              try {
                res = await fetch(BASE + path, {
                  method,
                  headers: { "Content-Type": "application/json" },
                  body: body ? JSON.stringify(body) : undefined,
                });
              } catch {
                throw new Error("Нет соединения с сервером");
              }
              if (!res.ok) throw new Error(`Ошибка сервера: ${res.status}`);
              return res.json();
            }

            // main.js
            import { api } from "./api.js";
            const $ = (s) => document.querySelector(s);
            let users = [];
            const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

            function renderUsers(list) {
              $("#users").replaceChildren(...list.map((u) => {
                const li = document.createElement("li");
                li.textContent = u.name;
                li.dataset.id = u.id;
                return li;
              }));
            }
            async function withStatus(fn) {
              $("#status").textContent = "Загрузка...";
              try { await fn(); $("#status").textContent = ""; }
              catch (e) { $("#status").textContent = e.message; }
            }
            $("#users").addEventListener("click", (e) => {
              const id = e.target.dataset.id;
              if (!id) return;
              withStatus(async () => {
                const posts = await api(`/posts?userId=${id}`);
                $("#posts").replaceChildren(...posts.map((p) => Object.assign(document.createElement("li"), { textContent: p.title })));
              });
            });
            $("#search").addEventListener("input", debounce((e) => {
              const q = e.target.value.toLowerCase();
              renderUsers(users.filter((u) => u.name.toLowerCase().includes(q)));
            }, 300));
            $("#new-post").addEventListener("submit", (e) => {
              e.preventDefault();
              const body = Object.fromEntries(new FormData(e.target));
              withStatus(async () => {
                const created = await api("/posts", { method: "POST", body: { ...body, userId: 1 } });
                $("#created").textContent = `Создан пост id=${created.id}`;
              });
            });
            withStatus(async () => { users = await api("/users"); renderUsers(users); });
      - id: js-05-05
        title: Обработка ошибок и AbortController
        minutes: 35
        xp: 45
        theory: |
          ## Классы ошибок

          ```javascript
          class HttpError extends Error {
            constructor(status, message) {
              super(message);
              this.name = "HttpError";
              this.status = status;
            }
          }
          class ValidationError extends Error {
            constructor(field, message) {
              super(message, { cause: { field } });   // cause — причина (ES2022)
              this.name = "ValidationError";
            }
          }

          try {
            await saveUser(data);
          } catch (e) {
            if (e instanceof ValidationError) showFieldError(e.cause.field, e.message);
            else if (e instanceof HttpError && e.status === 401) redirectToLogin();
            else throw e;                       // неизвестное — пробросить дальше
          }
          ```

          Правила: бросайте объекты `Error` (не строки) — у них есть стек; не глотайте ошибки молча; ловите там, где знаете, что с ними делать.

          ## Глобальные обработчики

          ```javascript
          window.addEventListener("error", (e) => report(e.error));
          window.addEventListener("unhandledrejection", (e) => report(e.reason));
          // Node.js: process.on("unhandledRejection", ...)
          ```

          В продакшене ошибки отправляют в сервис мониторинга (Sentry).

          ## AbortController — отмена операций

          ```javascript
          const controller = new AbortController();
          fetch("/api/big-report", { signal: controller.signal })
            .then((r) => r.json())
            .catch((e) => {
              if (e.name === "AbortError") console.log("Запрос отменён");
              else throw e;
            });
          controller.abort();                 // отменить запрос
          ```

          Таймаут одной строкой:

          ```javascript
          const res = await fetch(url, { signal: AbortSignal.timeout(5000) });   // TimeoutError через 5 с
          ```

          ## Отмена устаревших запросов

          Поиск «на лету»: пользователь печатает быстро, ответы приходят в случайном порядке, и старый ответ может перезаписать новый. Решение — отменять предыдущий запрос:

          ```javascript
          let current;
          async function search(q) {
            current?.abort();
            current = new AbortController();
            try {
              const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { signal: current.signal });
              render(await res.json());
            } catch (e) {
              if (e.name !== "AbortError") showError(e);
            }
          }
          ```

          `signal` также понимают `addEventListener(type, fn, { signal })` (удалить все обработчики разом) и многие библиотеки. Свои функции поддерживают отмену через `signal.aborted` и `signal.addEventListener("abort", ...)`. `AbortSignal.any([s1, s2])` объединяет сигналы.
