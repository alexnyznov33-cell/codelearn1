        homework:
          task: |
            Сделайте поиск по GitHub API (`https://api.github.com/search/repositories?q=`): ввод с debounce 300 мс, отмена предыдущего запроса через AbortController, таймаут 5 с, классы ошибок `HttpError`, `RateLimitError` (статус 403 с заголовком `x-ratelimit-remaining: 0`), `NetworkError`. Для каждой — своё сообщение пользователю. Кнопка «Отменить» прерывает текущий поиск. Глобальный обработчик `unhandledrejection` пишет ошибки в консоль.
          checklist:
            - Старые ответы не перезаписывают новые
            - Есть свои классы ошибок
            - Таймаут и ручная отмена работают
          solution: |
            class HttpError extends Error { constructor(s, m) { super(m); this.name = "HttpError"; this.status = s; } }
            class RateLimitError extends HttpError { constructor() { super(403, "Превышен лимит запросов, попробуйте позже"); this.name = "RateLimitError"; } }
            class NetworkError extends Error { constructor(cause) { super("Проблема с сетью", { cause }); this.name = "NetworkError"; } }

            let controller;
            async function searchRepos(q) {
              controller?.abort();
              controller = new AbortController();
              const signal = AbortSignal.any([controller.signal, AbortSignal.timeout(5000)]);
              let res;
              try {
                res = await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}`, { signal });
              } catch (e) {
                if (e.name === "AbortError" || e.name === "TimeoutError") throw e;
                throw new NetworkError(e);
              }
              if (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0") throw new RateLimitError();
              if (!res.ok) throw new HttpError(res.status, `Ошибка ${res.status}`);
              return (await res.json()).items;
            }

            const input = document.querySelector("#q"), out = document.querySelector("#out"), status = document.querySelector("#status");
            const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
            input.addEventListener("input", debounce(async () => {
              if (!input.value.trim()) return;
              status.textContent = "Ищем...";
              try {
                const items = await searchRepos(input.value);
                out.replaceChildren(...items.map((r) => Object.assign(document.createElement("li"), { textContent: `${r.full_name} ★${r.stargazers_count}` })));
                status.textContent = `Найдено: ${items.length}`;
              } catch (e) {
                if (e.name === "AbortError") return;                       // устаревший запрос
                status.textContent = e.name === "TimeoutError" ? "Сервер долго не отвечает" : e.message;
              }
            }, 300));
            document.querySelector("#cancel").addEventListener("click", () => { controller?.abort(); status.textContent = "Отменено"; });
            window.addEventListener("unhandledrejection", (e) => console.error("Необработанная ошибка:", e.reason));
