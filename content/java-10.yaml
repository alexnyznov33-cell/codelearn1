        homework:
          task: |
            Добавьте в API «Задачи» валидацию: title 1–100 символов и не пустой, dueDate не в прошлом (`@FutureOrPresent`), своя аннотация `@NoBadWords` с `ConstraintValidator`. Создайте `@RestControllerAdvice`, возвращающий `ProblemDetail`: 400 со списком ошибок полей, 404 для `TaskNotFoundException`, 409 для дубликата названия в проекте, 500 с общим сообщением (и логированием стека). Напишите 3 теста через MockMvc.
          checklist:
            - Используется @Valid
            - Есть своя аннотация-валидатор
            - Ответы об ошибках в едином формате
          solution: |
            @Target(ElementType.FIELD) @Retention(RetentionPolicy.RUNTIME)
            @Constraint(validatedBy = NoBadWordsValidator.class)
            public @interface NoBadWords {
                String message() default "недопустимые слова";
                Class<?>[] groups() default {};
                Class<? extends Payload>[] payload() default {};
            }
            public class NoBadWordsValidator implements ConstraintValidator<NoBadWords, String> {
                private static final Set<String> BAD = Set.of("спам", "казино");
                public boolean isValid(String v, ConstraintValidatorContext ctx) {
                    return v == null || BAD.stream().noneMatch(v.toLowerCase()::contains);
                }
            }

            public record TaskRequest(
                @NotBlank @Size(max = 100) @NoBadWords String title,
                @FutureOrPresent LocalDate dueDate) {}

            @RestControllerAdvice
            class ApiErrors {
                private static final Logger log = LoggerFactory.getLogger(ApiErrors.class);
                @ExceptionHandler(MethodArgumentNotValidException.class)
                ProblemDetail invalid(MethodArgumentNotValidException e) {
                    var pd = ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, "Ошибка валидации");
                    var errors = new LinkedHashMap<String, String>();
                    e.getBindingResult().getFieldErrors().forEach(f -> errors.put(f.getField(), f.getDefaultMessage()));
                    pd.setProperty("errors", errors);
                    return pd;
                }
                @ExceptionHandler(TaskNotFoundException.class)
                ProblemDetail notFound(TaskNotFoundException e) { return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage()); }
                @ExceptionHandler(DuplicateTaskException.class)
                ProblemDetail conflict(DuplicateTaskException e) { return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, e.getMessage()); }
                @ExceptionHandler(Exception.class)
                ProblemDetail other(Exception e) {
                    log.error("Необработанная ошибка", e);
                    return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Внутренняя ошибка сервера");
                }
            }

            // Тест:
            // mvc.perform(post("/api/tasks").contentType(APPLICATION_JSON).content("{\"title\":\"\"}"))
            //    .andExpect(status().isBadRequest()).andExpect(jsonPath("$.errors.title").exists());
      - id: java-10-05
        title: Spring Security и JWT
        minutes: 45
        xp: 55
        theory: |
          **Аутентификация** — кто вы (логин/пароль, токен). **Авторизация** — что вам можно (роли, права).

          ## Конфигурация Spring Security 6

          ```java
          @Configuration
          @EnableMethodSecurity
          public class SecurityConfig {
              @Bean
              SecurityFilterChain filterChain(HttpSecurity http, JwtFilter jwtFilter) throws Exception {
                  return http
                      .csrf(csrf -> csrf.disable())                       // REST без cookie-сессий
                      .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
                      .authorizeHttpRequests(auth -> auth
                          .requestMatchers("/api/auth/**").permitAll()
                          .requestMatchers(HttpMethod.DELETE, "/api/**").hasRole("ADMIN")
                          .anyRequest().authenticated())
                      .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)
                      .build();
              }

              @Bean PasswordEncoder passwordEncoder() { return new BCryptPasswordEncoder(); }
          }
          ```

          Пароли **никогда** не хранят в открытом виде — только хеш BCrypt/Argon2: `encoder.encode(raw)`, проверка `encoder.matches(raw, hash)`.

          ## JWT

          **JSON Web Token** = `header.payload.signature` (Base64URL). В payload — «claims»: `sub` (пользователь), `roles`, `exp` (срок действия). Подпись (HMAC-SHA256 или RSA) гарантирует, что токен не подделан. Payload **не шифруется** — не кладите туда секреты.

          Поток:
          1. `POST /api/auth/login` с логином/паролем → сервер проверяет и выдаёт **access token** (15 мин) и **refresh token** (дни).
          2. Клиент шлёт `Authorization: Bearer <token>` в каждом запросе.
          3. Фильтр проверяет подпись и срок, кладёт пользователя в `SecurityContextHolder`.

          ```java
          @Component
          class JwtFilter extends OncePerRequestFilter {
              protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
                      throws ServletException, IOException {
                  String h = req.getHeader("Authorization");
                  if (h != null && h.startsWith("Bearer ")) {
                      jwt.parse(h.substring(7)).ifPresent(claims -> {
                          var auth = new UsernamePasswordAuthenticationToken(claims.user(), null, claims.authorities());
                          SecurityContextHolder.getContext().setAuthentication(auth);
                      });
                  }
                  chain.doFilter(req, res);
              }
          }
          ```

          ## Авторизация в методах

          ```java
          @PreAuthorize("hasRole('ADMIN') or #userId == authentication.name")
          public UserDto getProfile(String userId) { ... }
          ```

          Альтернатива самописному фильтру — `spring-boot-starter-oauth2-resource-server` с `.oauth2ResourceServer(o -> o.jwt(...))` и внешним провайдером (Keycloak).
        practice:
          - type: choice
            q: Как правильно хранить пароли пользователей?
            options: ["В открытом виде", "В Base64", "Хеш BCrypt/Argon2", "Зашифрованными AES с ключом в коде"]
            answer: 2
          - type: choice
            q: Какой заголовок обычно передаёт JWT?
            options: ["Cookie: jwt=...", "Authorization: Bearer <token>", "X-Password", "Accept: token"]
            answer: 1
          - type: choice
            q: Можно ли хранить секретные данные в payload JWT?
            options: ["Да, он зашифрован", "Нет, payload только закодирован Base64URL и читается кем угодно", "Да, если подпись RSA", "Только пароль"]
            answer: 1
          - type: fill
            q: Разрешите доступ к /api/auth/** без аутентификации
            code: |
              .requestMatchers("/api/auth/**").___()
            answers: ["permitAll"]
          - type: fill
            q: Ограничьте метод ролью ADMIN
            code: |
              @___("hasRole('ADMIN')")
              public void deleteUser(long id) { ... }
            answers: ["PreAuthorize"]
        homework:
          task: |
            Защитите API «Задачи»: сущность `User` (login, passwordHash, role USER/ADMIN), `POST /api/auth/register` и `POST /api/auth/login` (возвращает JWT, библиотека jjwt или nimbus-jose-jwt), фильтр JWT, stateless-сессии. Пользователь видит и меняет только свои задачи; ADMIN — все и может удалять пользователей (`@PreAuthorize`). 401 при отсутствии токена, 403 при нехватке прав. Напишите тест с `@WithMockUser`.
          checklist:
            - Пароли хранятся в BCrypt
            - Токен имеет срок действия
            - Пользователь не видит чужие задачи
            - Правильные коды 401/403
          solution: |
            @Service
            class JwtService {
                private final SecretKey key = Keys.hmacShaKeyFor(System.getenv("JWT_SECRET").getBytes());
                String issue(User u) {
                    return Jwts.builder().subject(u.getLogin()).claim("role", u.getRole().name())
                        .issuedAt(new Date()).expiration(Date.from(Instant.now().plus(15, ChronoUnit.MINUTES)))
                        .signWith(key).compact();
                }
                Optional<Claims> parse(String token) {
                    try { return Optional.of(Jwts.parser().verifyWith(key).build().parseSignedClaims(token).getPayload()); }
                    catch (JwtException e) { return Optional.empty(); }
                }
            }

            @RestController @RequestMapping("/api/auth")
            class AuthController {
                private final UserRepository users; private final PasswordEncoder enc; private final JwtService jwt;
                AuthController(UserRepository u, PasswordEncoder e, JwtService j) { users = u; enc = e; jwt = j; }
                record Credentials(@NotBlank String login, @NotBlank String password) {}
                @PostMapping("/register") @ResponseStatus(HttpStatus.CREATED)
                void register(@Valid @RequestBody Credentials c) {
                    if (users.existsByLogin(c.login())) throw new ResponseStatusException(HttpStatus.CONFLICT);
                    users.save(new User(c.login(), enc.encode(c.password()), Role.USER));
                }
                @PostMapping("/login")
                Map<String, String> login(@Valid @RequestBody Credentials c) {
                    User u = users.findByLogin(c.login())
                        .filter(x -> enc.matches(c.password(), x.getPasswordHash()))
                        .orElseThrow(() -> new ResponseStatusException(HttpStatus.UNAUTHORIZED));
                    return Map.of("accessToken", jwt.issue(u));
                }
            }

            // В TaskService: repo.findByOwnerLogin(SecurityContextHolder.getContext().getAuthentication().getName())
            // @PreAuthorize("hasRole('ADMIN')") public void deleteUser(long id)

            @SpringBootTest @AutoConfigureMockMvc
            class SecurityTest {
                @Autowired MockMvc mvc;
                @Test void noToken401() throws Exception { mvc.perform(get("/api/tasks")).andExpect(status().isUnauthorized()); }
                @Test @WithMockUser(roles = "USER")
                void userCannotDeleteUsers() throws Exception { mvc.perform(delete("/api/admin/users/1")).andExpect(status().isForbidden()); }
            }
      - id: java-10-06
        title: Тестирование Spring-приложений
        minutes: 40
        xp: 50
        theory: |
          ## Пирамида тестов

          Много быстрых **модульных** тестов (JUnit + Mockito, без Spring), меньше **срезовых** и **интеграционных**, совсем немного end-to-end.

          ## Срезы (slice tests)

          Поднимают только часть контекста — быстрее полного:

          ```java
          @WebMvcTest(BookController.class)          // только веб-слой
          class BookControllerTest {
              @Autowired MockMvc mvc;
              @MockitoBean BookService service;        // (до Boot 3.4 — @MockBean)

              @Test
              void returnsBook() throws Exception {
                  when(service.findById(1L)).thenReturn(Optional.of(new BookDto(1, "Мастер и Маргарита", "Булгаков")));
                  mvc.perform(get("/api/books/1"))
                     .andExpect(status().isOk())
                     .andExpect(jsonPath("$.title").value("Мастер и Маргарита"));
              }

              @Test
              void validatesInput() throws Exception {
                  mvc.perform(post("/api/books").contentType(MediaType.APPLICATION_JSON).content("{\"title\":\"\"}"))
                     .andExpect(status().isBadRequest());
              }
          }

          @DataJpaTest                                 // только JPA + встроенная БД, каждый тест в откатываемой транзакции
          class BookRepositoryTest {
              @Autowired BookRepository repo;
              @Test void findsByAuthor() {
                  repo.save(new Book("Идиот", "Достоевский"));
                  assertThat(repo.findByAuthor("Достоевский")).hasSize(1);
              }
          }
          ```

          ## Полный контекст

          ```java
          @SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)
          class ApiIT {
              @Autowired TestRestTemplate rest;
              @Test void createAndGet() {
                  var resp = rest.postForEntity("/api/books", new CreateBookRequest("Дубровский", "Пушкин", 1841), BookDto.class);
                  assertThat(resp.getStatusCode()).isEqualTo(HttpStatus.CREATED);
              }
          }
          ```

          ## Testcontainers

          H2 ведёт себя не как PostgreSQL. **Testcontainers** запускает настоящую БД в Docker на время тестов:

          ```java
          @Testcontainers
          @SpringBootTest
          class RepoIT {
              @Container @ServiceConnection
              static PostgreSQLContainer<?> pg = new PostgreSQLContainer<>("postgres:16");
          }
          ```

          `@ServiceConnection` (Boot 3.1+) сам пропишет URL, логин и пароль.

          ## Советы

          - Кеш контекста: одинаковая конфигурация тестов → контекст переиспользуется. Каждый новый `@MockitoBean` создаёт новый контекст — не злоупотребляйте.
          - Не полагайтесь на порядок тестов и общие данные; очищайте БД или используйте транзакции.
          - Тестовый профиль: `application-test.yml` + `@ActiveProfiles("test")`.
        practice:
          - type: choice
            q: Какая аннотация поднимает только веб-слой для тестов контроллера?
            options: ["@SpringBootTest", "@WebMvcTest", "@DataJpaTest", "@JsonTest"]
            answer: 1
          - type: fill
            q: Проверьте статус и поле JSON ответа
            code: |
              mvc.perform(get("/api/books/1"))
                 .andExpect(___().isOk())
                 .andExpect(___("$.title").value("Идиот"));
            answers: ["status", "jsonPath"]
          - type: choice
            q: Зачем нужен Testcontainers?
            options: ["Для мокирования сервисов", "Запустить настоящую БД/брокер в Docker на время тестов", "Для нагрузочного тестирования", "Для генерации тестовых данных"]
            answer: 1
          - type: choice
            q: Что происходит с данными после каждого теста в @DataJpaTest по умолчанию?
