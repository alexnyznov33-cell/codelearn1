            options: ["Jackson не умеет их сериализовать", "Ленивые связи, циклы и утечка внутренних полей", "Это медленнее DTO в 10 раз", "Spring запрещает"]
            answer: 1
          - type: choice
            q: Какой HTTP-метод соответствует частичному обновлению?
            options: ["PUT", "PATCH", "POST", "UPDATE"]
            answer: 1
        homework:
          task: |
            Реализуйте REST API «Задачи» (Todo): сущность `Task` (id, title, done, dueDate), in-memory хранилище в сервисе (`ConcurrentHashMap` + `AtomicLong`). Эндпоинты: GET /api/tasks (фильтр `?done=true`), GET /api/tasks/{id} (404 если нет), POST (201 + Location), PUT /{id}, PATCH /{id}/done, DELETE /{id} (204). Используйте DTO-записи. Проверьте через curl или HTTP-клиент IDEA, подключите springdoc и откройте Swagger UI.
          checklist:
            - Правильные HTTP-методы и коды
            - DTO отделены от модели
            - Есть фильтрация через @RequestParam
          solution: |
            public record TaskDto(long id, String title, boolean done, LocalDate dueDate) {}
            public record TaskRequest(String title, LocalDate dueDate) {}

            @Service
            class TaskService {
                private final Map<Long, TaskDto> store = new ConcurrentHashMap<>();
                private final AtomicLong seq = new AtomicLong();
                List<TaskDto> all(Boolean done) {
                    return store.values().stream().filter(t -> done == null || t.done() == done)
                                .sorted(Comparator.comparing(TaskDto::id)).toList();
                }
                Optional<TaskDto> get(long id) { return Optional.ofNullable(store.get(id)); }
                TaskDto create(TaskRequest r) {
                    long id = seq.incrementAndGet();
                    var t = new TaskDto(id, r.title(), false, r.dueDate());
                    store.put(id, t); return t;
                }
                Optional<TaskDto> update(long id, TaskRequest r) {
                    return get(id).map(o -> { var t = new TaskDto(id, r.title(), o.done(), r.dueDate()); store.put(id, t); return t; });
                }
                Optional<TaskDto> markDone(long id) {
                    return get(id).map(o -> { var t = new TaskDto(id, o.title(), true, o.dueDate()); store.put(id, t); return t; });
                }
                boolean delete(long id) { return store.remove(id) != null; }
            }

            @RestController
            @RequestMapping("/api/tasks")
            class TaskController {
                private final TaskService s;
                TaskController(TaskService s) { this.s = s; }
                @GetMapping List<TaskDto> list(@RequestParam(required = false) Boolean done) { return s.all(done); }
                @GetMapping("/{id}") ResponseEntity<TaskDto> get(@PathVariable long id) { return ResponseEntity.of(s.get(id)); }
                @PostMapping ResponseEntity<TaskDto> create(@RequestBody TaskRequest r) {
                    var t = s.create(r);
                    return ResponseEntity.created(URI.create("/api/tasks/" + t.id())).body(t);
                }
                @PutMapping("/{id}") ResponseEntity<TaskDto> put(@PathVariable long id, @RequestBody TaskRequest r) { return ResponseEntity.of(s.update(id, r)); }
                @PatchMapping("/{id}/done") ResponseEntity<TaskDto> done(@PathVariable long id) { return ResponseEntity.of(s.markDone(id)); }
                @DeleteMapping("/{id}") ResponseEntity<Void> delete(@PathVariable long id) {
                    return s.delete(id) ? ResponseEntity.noContent().build() : ResponseEntity.notFound().build();
                }
            }
            // curl -X POST localhost:8080/api/tasks -H 'Content-Type: application/json' -d '{"title":"Купить хлеб"}'
      - id: java-10-03
        title: Spring Data JPA
        minutes: 40
        xp: 50
        theory: |
          **Spring Data JPA** избавляет от шаблонного кода репозиториев: достаточно объявить интерфейс.

          ```java
          public interface BookRepository extends JpaRepository<Book, Long> {
              // запросы по имени метода
              List<Book> findByAuthor(String author);
              List<Book> findByYearBetweenOrderByYearDesc(int from, int to);
              Optional<Book> findByIsbn(String isbn);
              boolean existsByIsbn(String isbn);
              long countByGenre(Genre genre);
              List<Book> findTop5ByTitleContainingIgnoreCase(String part);

              // явный JPQL
              @Query("SELECT b FROM Book b WHERE b.price < :max AND b.available = true")
              List<Book> cheap(@Param("max") BigDecimal max);

              // нативный SQL
              @Query(value = "SELECT * FROM book WHERE to_tsvector(title) @@ plainto_tsquery(?1)", nativeQuery = true)
              List<Book> fullText(String q);

              // изменение
              @Modifying
              @Query("UPDATE Book b SET b.price = b.price * :k WHERE b.genre = :g")
              int reprice(@Param("g") Genre g, @Param("k") BigDecimal k);
          }
          ```

          `JpaRepository` уже даёт: `save`, `saveAll`, `findById`, `findAll`, `deleteById`, `count`, `existsById` и др.

          ## Пагинация и сортировка

          ```java
          Page<Book> page = repo.findByGenre(Genre.NOVEL,
                  PageRequest.of(0, 20, Sort.by("year").descending()));
          page.getContent(); page.getTotalElements(); page.getTotalPages();
          ```

          В контроллер можно принять `Pageable` прямо из параметров `?page=0&size=20&sort=year,desc`.

          ## Проекции

          ```java
          interface BookTitle { String getTitle(); String getAuthor(); }   // интерфейсная проекция
          List<BookTitle> findByGenre(Genre g);
          record BookShort(String title, int year) {}                      // DTO-проекция
          ```

          Выбираются только нужные колонки — быстрее, чем целые сущности.

          ## Решение N+1

          ```java
          @EntityGraph(attributePaths = {"author", "tags"})
          List<Book> findAllByGenre(Genre g);
          ```

          ## Specifications

          Для динамических фильтров (поиск с необязательными полями) — `JpaSpecificationExecutor<Book>` и комбинация `Specification.where(...).and(...)`, либо Querydsl.

          ## Аудит

          `@EnableJpaAuditing` + `@CreatedDate`, `@LastModifiedDate` в сущности с `@EntityListeners(AuditingEntityListener.class)` — даты заполняются автоматически.
