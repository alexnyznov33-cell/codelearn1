id: java
modules:
  - id: java-m10
    title: Spring Boot
    level: Middle
    lessons:
      - id: java-10-01
        title: IoC и Dependency Injection
        minutes: 40
        xp: 50
        theory: |
          **Inversion of Control**: объекты не создают свои зависимости сами — их создаёт и связывает **контейнер Spring** (ApplicationContext). Объекты, которыми он управляет, называются **бинами**.

          ```java
          @SpringBootApplication           // = @Configuration + @EnableAutoConfiguration + @ComponentScan
          public class ShopApplication {
              public static void main(String[] args) { SpringApplication.run(ShopApplication.class, args); }
          }

          @Repository
          class JpaOrderRepository implements OrderRepository { ... }

          @Service
          public class OrderService {
              private final OrderRepository repo;
              private final Clock clock;

              public OrderService(OrderRepository repo, Clock clock) {   // внедрение через конструктор
                  this.repo = repo;
                  this.clock = clock;
              }
          }
          ```

          ## Способы внедрения

          - **Через конструктор** — рекомендуемый: поля `final`, зависимости явные, легко тестировать без Spring. При одном конструкторе `@Autowired` не нужен.
          - Через сеттер — для необязательных зависимостей.
          - Через поле (`@Autowired private Repo repo;`) — не рекомендуется: скрывает зависимости, мешает тестам.

          ## Объявление бинов

          Стереотипы `@Component`, `@Service`, `@Repository` (+ перевод исключений БД), `@Controller`/`@RestController`. Либо методы `@Bean` в классе `@Configuration` — для чужих классов:

          ```java
          @Configuration
          class AppConfig {
              @Bean Clock clock() { return Clock.systemDefaultZone(); }
          }
          ```

          ## Несколько реализаций

          Если интерфейс реализуют два бина — ошибка `NoUniqueBeanDefinitionException`. Решение: `@Primary` на основном или `@Qualifier("smsSender")` в точке внедрения. Можно внедрить все: `List<NotificationSender> senders`.

          ## Scope и жизненный цикл

          По умолчанию бин — **singleton** (один на контекст), поэтому он должен быть **без изменяемого состояния** (потокобезопасность!). Также есть `prototype`, `request`, `session`. Хуки: `@PostConstruct`, `@PreDestroy`.

          ## Конфигурация

          ```properties
          # application.properties
          shop.delivery.free-from=3000
          ```

          ```java
          @ConfigurationProperties(prefix = "shop.delivery")
          record DeliveryProps(int freeFrom) {}
          ```

          Профили: `application-dev.properties`, `@Profile("dev")`, запуск с `--spring.profiles.active=prod`.
