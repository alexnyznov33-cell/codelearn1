        homework:
          task: |
            Создайте Spring Boot приложение (start.spring.io) «Уведомления»: интерфейс `Notifier` и реализации `EmailNotifier`, `SmsNotifier`, `TelegramNotifier`; сервис `NotificationService`, который получает `List<Notifier>` и рассылает сообщение всем включённым каналам. Включённые каналы задаются в `application.yml` через `@ConfigurationProperties`. Для профиля `dev` подмените `SmsNotifier` на `FakeSmsNotifier` (печатает в лог). Запустите через `CommandLineRunner`.
          checklist:
            - Внедрение через конструктор
            - Используется List<Notifier>
            - Свойства через @ConfigurationProperties
            - Работает профиль dev
          solution: |
            public interface Notifier { String channel(); void send(String to, String text); }

            @Component @Profile("!dev")
            class SmsNotifier implements Notifier {
                public String channel() { return "sms"; }
                public void send(String to, String text) { /* вызов SMS-шлюза */ }
            }
            @Component @Profile("dev")
            class FakeSmsNotifier implements Notifier {
                private static final Logger log = LoggerFactory.getLogger(FakeSmsNotifier.class);
                public String channel() { return "sms"; }
                public void send(String to, String text) { log.info("[FAKE SMS] {}: {}", to, text); }
            }
            @Component
            class EmailNotifier implements Notifier {
                public String channel() { return "email"; }
                public void send(String to, String text) { System.out.println("EMAIL " + to + ": " + text); }
            }

            @ConfigurationProperties(prefix = "notify")
            record NotifyProps(Set<String> enabled) {}

            @Service
            class NotificationService {
                private final List<Notifier> notifiers;
                private final NotifyProps props;
                NotificationService(List<Notifier> notifiers, NotifyProps props) { this.notifiers = notifiers; this.props = props; }
                void broadcast(String to, String text) {
                    notifiers.stream().filter(n -> props.enabled().contains(n.channel())).forEach(n -> n.send(to, text));
                }
            }

            @SpringBootApplication
            @ConfigurationPropertiesScan
            public class App {
                public static void main(String[] args) { SpringApplication.run(App.class, args); }
                @Bean CommandLineRunner run(NotificationService s) { return args -> s.broadcast("anna", "Заказ отправлен"); }
            }
            // application.yml:
            // notify:
            //   enabled: [email, sms]
      - id: java-10-02
        title: REST-контроллеры
        minutes: 45
        xp: 50
        theory: |
          **REST** — стиль API, где ресурсы адресуются URL, а действия — HTTP-методами.

          | Метод | URL | Действие | Код ответа |
          |---|---|---|---|
          | GET | /api/books | список | 200 |
          | GET | /api/books/42 | один ресурс | 200 / 404 |
          | POST | /api/books | создать | 201 + Location |
          | PUT | /api/books/42 | заменить целиком | 200 |
          | PATCH | /api/books/42 | частично изменить | 200 |
          | DELETE | /api/books/42 | удалить | 204 |

          ```java
          @RestController
          @RequestMapping("/api/books")
          public class BookController {
              private final BookService service;
              public BookController(BookService service) { this.service = service; }

              @GetMapping
              public List<BookDto> list(@RequestParam(defaultValue = "") String author,
                                        @RequestParam(defaultValue = "0") int page) {
                  return service.find(author, page);
              }

              @GetMapping("/{id}")
              public ResponseEntity<BookDto> get(@PathVariable long id) {
                  return service.findById(id).map(ResponseEntity::ok)
                                .orElse(ResponseEntity.notFound().build());
              }

              @PostMapping
              public ResponseEntity<BookDto> create(@RequestBody CreateBookRequest req) {
                  BookDto created = service.create(req);
                  return ResponseEntity.created(URI.create("/api/books/" + created.id())).body(created);
              }

              @DeleteMapping("/{id}")
              @ResponseStatus(HttpStatus.NO_CONTENT)
              public void delete(@PathVariable long id) { service.delete(id); }
          }
          ```

          ## DTO вместо сущностей

          Не возвращайте JPA-сущности напрямую: ленивые связи, циклические ссылки, утечка внутренних полей. Используйте **DTO** (records) и маппинг (вручную или MapStruct):

          ```java
          public record BookDto(long id, String title, String author) {}
          public record CreateBookRequest(String title, String author, int year) {}
          ```

          ## Полезное

          - Jackson сам превращает объекты в JSON и обратно.
          - `@RequestHeader`, `@CookieValue` — заголовки и куки.
          - Пагинация: `Pageable pageable` в параметрах + `Page<T>` из Spring Data.
          - Документация API: springdoc-openapi → Swagger UI на `/swagger-ui.html`.
          - Версионирование: `/api/v1/...`.
          - Тонкие контроллеры: только HTTP-слой, бизнес-логика — в сервисах.
        practice:
