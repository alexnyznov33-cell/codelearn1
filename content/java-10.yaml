              - Срезовые тесты (@WebMvcTest, @DataJpaTest)
              - Интеграционные тесты (@SpringBootTest + Testcontainers)
              - End-to-end тесты
        homework:
          task: |
            Покройте API «Задачи» тестами: (1) модульные тесты `TaskService` с Mockito; (2) `@WebMvcTest` для контроллера — успешный GET, 404, 400 при невалидном теле, 201 при создании; (3) `@DataJpaTest` для derived-запросов репозитория; (4) один интеграционный тест `@SpringBootTest` + Testcontainers PostgreSQL, проверяющий полный сценарий «создать → получить → отметить выполненной → удалить». Настройте запуск в CI (`mvn verify`).
          checklist:
            - Есть все 4 уровня тестов
            - Testcontainers с PostgreSQL
            - Тесты независимы друг от друга
          solution: |
            @WebMvcTest(TaskController.class)
            class TaskControllerTest {
                @Autowired MockMvc mvc;
                @MockitoBean TaskService service;

                @Test void getOk() throws Exception {
                    when(service.get(1L)).thenReturn(Optional.of(new TaskDto(1, "Тест", false, null)));
                    mvc.perform(get("/api/tasks/1")).andExpect(status().isOk()).andExpect(jsonPath("$.title").value("Тест"));
                }
                @Test void getNotFound() throws Exception {
                    when(service.get(9L)).thenReturn(Optional.empty());
                    mvc.perform(get("/api/tasks/9")).andExpect(status().isNotFound());
                }
                @Test void createInvalid() throws Exception {
                    mvc.perform(post("/api/tasks").contentType(MediaType.APPLICATION_JSON).content("{\"title\":\"\"}"))
                       .andExpect(status().isBadRequest());
                }
            }

            @DataJpaTest
            class TaskRepositoryTest {
                @Autowired TaskRepository repo;
                @Test void overdue() {
                    var t = new Task(); t.title = "старая"; t.dueDate = LocalDate.now().minusDays(1);
                    repo.save(t);
                    assertThat(repo.findByDoneFalseAndDueDateBefore(LocalDate.now())).hasSize(1);
                }
            }

            @Testcontainers
            @SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)
            class TaskFlowIT {
                @Container @ServiceConnection static PostgreSQLContainer<?> pg = new PostgreSQLContainer<>("postgres:16");
                @Autowired TestRestTemplate rest;

                @Test void fullFlow() {
                    var created = rest.postForEntity("/api/tasks", new TaskRequest("Купить хлеб", null), TaskDto.class);
                    assertThat(created.getStatusCode()).isEqualTo(HttpStatus.CREATED);
                    long id = created.getBody().id();
                    assertThat(rest.getForObject("/api/tasks/" + id, TaskDto.class).title()).isEqualTo("Купить хлеб");
                    rest.patchForObject("/api/tasks/" + id + "/done", null, TaskDto.class);
                    rest.delete("/api/tasks/" + id);
                    assertThat(rest.getForEntity("/api/tasks/" + id, String.class).getStatusCode()).isEqualTo(HttpStatus.NOT_FOUND);
                }
            }
