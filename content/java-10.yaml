        homework:
          task: |
            Переведите API «Задачи» из прошлого урока на Spring Data JPA + H2 (или PostgreSQL с Flyway). Добавьте: сущность `Project` 1—N `Task`; методы репозитория `findByDoneFalseAndDueDateBefore(LocalDate)`, `countByProjectId`, `@Query` для поиска по подстроке в названии; пагинацию в GET /api/tasks (`Pageable`), интерфейсную проекцию для списка (только id и title), `@EntityGraph` для загрузки задач с проектом. Включите `show-sql` и убедитесь, что нет N+1.
          checklist:
            - Используется JpaRepository
            - Есть derived-запросы и @Query
            - Пагинация через Pageable
            - Нет N+1 в логах
          solution: |
            @Entity class Project { @Id @GeneratedValue Long id; String name; }
            @Entity class Task {
                @Id @GeneratedValue Long id;
                String title; boolean done; LocalDate dueDate;
                @ManyToOne(fetch = FetchType.LAZY) Project project;
            }

            interface TaskTitle { Long getId(); String getTitle(); }

            public interface TaskRepository extends JpaRepository<Task, Long> {
                List<Task> findByDoneFalseAndDueDateBefore(LocalDate date);
                long countByProjectId(Long projectId);
                @Query("SELECT t FROM Task t WHERE LOWER(t.title) LIKE LOWER(CONCAT('%', :q, '%'))")
                List<Task> search(@Param("q") String q);
                Page<TaskTitle> findAllProjectedBy(Pageable pageable);
                @EntityGraph(attributePaths = "project")
                List<Task> findByProjectNameOrderByDueDate(String projectName);
            }

            @RestController @RequestMapping("/api/tasks")
            class TaskController {
                private final TaskRepository repo;
                TaskController(TaskRepository repo) { this.repo = repo; }
                @GetMapping Page<TaskTitle> list(@PageableDefault(size = 20, sort = "id") Pageable p) { return repo.findAllProjectedBy(p); }
                @GetMapping("/overdue") List<Task> overdue() { return repo.findByDoneFalseAndDueDateBefore(LocalDate.now()); }
                @GetMapping("/search") List<Task> search(@RequestParam String q) { return repo.search(q); }
            }
            // spring.jpa.show-sql=true
            // GET /api/tasks?page=0&size=5&sort=dueDate,desc
      - id: java-10-04
        title: Валидация и обработка ошибок
        minutes: 40
        xp: 50
        theory: |
          ## Bean Validation

          Подключите `spring-boot-starter-validation` и опишите правила аннотациями:

          ```java
          public record RegisterRequest(
              @NotBlank @Size(min = 3, max = 30) String login,
              @NotBlank @Email String email,
              @NotNull @Min(14) @Max(120) Integer age,
              @Pattern(regexp = "\\+7\\d{10}") String phone,
              @Valid @NotNull AddressDto address        // каскадная проверка вложенного объекта
          ) {}

          @PostMapping("/register")
          public UserDto register(@Valid @RequestBody RegisterRequest req) { ... }
          ```

          Невалидный запрос → `MethodArgumentNotValidException` → по умолчанию 400. Для параметров (`@PathVariable @Min(1)`) нужен `@Validated` на классе контроллера.

          Свои правила: аннотация + `ConstraintValidator<Annotation, Type>`.

          ## Глобальная обработка ошибок

          ```java
          @RestControllerAdvice
          public class ApiExceptionHandler {

              @ExceptionHandler(NotFoundException.class)
              @ResponseStatus(HttpStatus.NOT_FOUND)
              public ProblemDetail notFound(NotFoundException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());
              }

              @ExceptionHandler(MethodArgumentNotValidException.class)
              public ProblemDetail invalid(MethodArgumentNotValidException e) {
                  ProblemDetail pd = ProblemDetail.forStatus(HttpStatus.BAD_REQUEST);
                  pd.setTitle("Ошибка валидации");
                  Map<String, String> errors = new LinkedHashMap<>();
                  e.getBindingResult().getFieldErrors()
                   .forEach(fe -> errors.put(fe.getField(), fe.getDefaultMessage()));
                  pd.setProperty("errors", errors);
                  return pd;
              }
          }
          ```

          `ProblemDetail` — стандартный формат ошибок **RFC 7807/9457** (`type`, `title`, `status`, `detail`, `instance`), поддержан в Spring 6.

          ## Принципы

          - Бизнес-ошибки — свои исключения (`NotFoundException`, `ConflictException`) в сервисах, превращение в HTTP — в одном месте (advice).
          - Коды: 400 — неверные данные, 401 — не аутентифицирован, 403 — нет прав, 404 — нет ресурса, 409 — конфликт (дубликат), 422 — бизнес-правило нарушено, 500 — непредвиденная ошибка.
          - Для 500 не показывайте стек-трейс клиенту — логируйте его на сервере и возвращайте общий текст.
          - Валидация на клиенте — для удобства, на сервере — **обязательна**.
