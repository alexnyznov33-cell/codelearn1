id: onec
title: 1С:Предприятие
short: 1С
lang: bsl
color: "#d9302c"
description: Автоматизация бизнеса — учёт, склад, зарплата. Встроенный язык, запросы и разработка конфигураций.
modules:
  - id: 1c-m1
    title: Основы платформы и языка
    level: Junior
    lessons:
      - id: 1c-01-01
        title: Платформа 1С, конфигурация и первая обработка
        minutes: 20
        xp: 15
        theory: |
          **1С:Предприятие** — платформа для создания учётных систем. Разработчик описывает **конфигурацию** (справочники, документы, регистры, отчёты) и пишет код на **встроенном языке 1С** (BSL).

          ## Что установить

          1. **Учебная версия платформы 1С:Предприятие 8.3** — бесплатна для обучения (есть на сайте 1С и в комплекте учебных книг).
          2. Создайте пустую информационную базу (ИБ) и откройте её в режиме **Конфигуратор**.
          3. Альтернативная современная среда — **1C:EDT** (на базе Eclipse).

          ## Два режима

          - **Конфигуратор** — разработка: структура базы, формы, модули с кодом.
          - **1С:Предприятие** — режим пользователя, где работает готовое приложение.

          ## Первая программа

          Создайте объект **Обработка** → форма → кнопка с командой. В модуле формы:

          ```bsl
          &НаКлиенте
          Процедура Привет(Команда)
              Сообщить("Привет, мир!");
          КонецПроцедуры
          ```

          - `Сообщить()` выводит текст в окно сообщений;
          - `&НаКлиенте` — **директива компиляции**: где выполняется код (клиент или сервер);
          - каждая инструкция заканчивается `;`;
          - комментарии: `// текст`.

          ## Язык

          Ключевые слова пишутся по-русски (есть английские аналоги: `Если` = `If`). Язык **не чувствителен к регистру**: `сообщить()` и `СООБЩИТЬ()` — одно и то же, но принято писать в стиле `ВерблюжийРегистр`.

          > 💡 Код можно быстро проверить в режиме Предприятия через встроенную обработку «Консоль кода» или в EDT.
        practice:
          - type: choice
            q: В каком режиме программист разрабатывает конфигурацию?
            options: ["1С:Предприятие", "Конфигуратор", "Тонкий клиент", "Веб-клиент"]
            answer: 1
          - type: choice
            q: Какая процедура выводит текст в окно сообщений?
            options: ["`Вывести()`", "`Печать()`", "`Сообщить()`", "`console.log()`"]
            answer: 2
          - type: output
            q: Что появится в окне сообщений?
            code: |
              Сообщить("Привет, " + "1С");
            answer: Привет, 1С
          - type: bug
            q: Где ошибка синтаксиса?
            code: |
              &НаКлиенте
              Процедура Тест(Команда)
                  Сообщить("Тест")
              КонецПроцедуры
            bugLine: 3
            explain: Пропущена точка с запятой.
          - type: choice
            q: Чувствителен ли язык 1С к регистру букв?
            options: ["Да, как C#", "Нет", "Только для ключевых слов", "Только для переменных"]
            answer: 1
        homework:
          task: |
            Установите учебную платформу, создайте пустую информационную базу и в конфигураторе добавьте обработку `МояПерваяОбработка` с формой и кнопкой «Визитка». По нажатию выведите 3 сообщения: имя, город, «Изучаю 1С». Откройте обработку в режиме Предприятия и проверьте.
          checklist:
            - Обработка открывается в пользовательском режиме
            - Код находится в модуле формы с директивой &НаКлиенте
          solution: |
            &НаКлиенте
            Процедура Визитка(Команда)
                Сообщить("Имя: Алекс");
                Сообщить("Город: Москва");
                Сообщить("Изучаю 1С");
            КонецПроцедуры

      - id: 1c-01-02
        title: Переменные и примитивные типы
        minutes: 20
        xp: 20
        theory: |
          ## Объявление

          Переменную можно объявить явно через `Перем` или неявно — первым присваиванием:

          ```bsl
          Перем Счетчик;               // значение: Неопределено
          Имя = "Анна";                // Строка
          Возраст = 25;                // Число
          Цена = 99.90;                // тоже Число — отдельного дробного типа нет
          ЭтоАдмин = Ложь;             // Булево
          ДатаРождения = '19990315';   // Дата — в одинарных кавычках ГГГГММДД
          Пусто = Неопределено;
          ```

          Язык **динамически типизирован**: переменная может хранить значение любого типа.

          ## Примитивные типы

          | Тип | Пример |
          |---|---|
          | Число | `42`, `3.14`, `-7` |
          | Строка | `"Текст"` |
          | Дата | `'20240101'`, `'20240101120000'` |
          | Булево | `Истина`, `Ложь` |
          | Неопределено | `Неопределено` |
          | Null | `Null` — приходит из запросов |

          ## Проверка типа

          ```bsl
          Если ТипЗнч(Значение) = Тип("Число") Тогда
              Сообщить("Это число");
          КонецЕсли;
          ```

          ## Преобразования

          ```bsl
          Ч = Число("42");          // 42 (если строка не число — исключение)
          С = Строка(100);          // "100"
          Б = Булево(1);            // Истина
          Д = Дата(2024, 3, 15);    // 15.03.2024 0:00:00
          ```

          > 💡 Число в 1С — точная десятичная арифметика: `0.1 + 0.2 = 0.3`, в отличие от многих языков.
        practice:
          - type: choice
            q: Как записать дату 15 марта 2024 года литералом?
            options: ["`\"15.03.2024\"`", "`'20240315'`", "`Дата(\"2024-03-15\")`", "`#2024-03-15#`"]
            answer: 1
          - type: choice
            q: Какое значение у объявленной через `Перем` переменной до присваивания?
            options: ["`0`", "`\"\"`", "`Неопределено`", "`Null`"]
            answer: 2
          - type: output
            q: Что выведет код?
            code: |
              А = 0.1 + 0.2;
              Сообщить(А = 0.3);
            answer: Да
            explain: Булево значение при выводе отображается как «Да» / «Нет». Арифметика в 1С точная.
          - type: fill
            q: Проверьте, что значение — строка
            code: |
              Если ___(Значение) = Тип("Строка") Тогда
                  Сообщить("Строка");
              КонецЕсли;
            answers: [ТипЗнч]
          - type: output
            q: Что выведет код?
            code: |
              Сообщить(Строка(10) + 5);
            answer: "105"
            explain: Строка + число → число приводится к строке и происходит конкатенация.
        homework:
          task: |
            В обработке создайте переменные всех примитивных типов (Число, Строка, Дата, Булево, Неопределено). Для каждой выведите значение и тип: `Сообщить(Строка(Значение) + " — " + ТипЗнч(Значение));`. Затем вычислите ваш возраст в днях: `(ТекущаяДата() - ДатаРождения) / 86400`.
          hints:
            - Разность дат в 1С — число секунд.
            - "Округлить: `Цел(Число)` или `Окр(Число, 0)`."
          checklist:
            - Выведены 5 типов
            - Возраст в днях посчитан
          solution: |
            &НаКлиенте
            Процедура Типы(Команда)
                Значения = Новый Массив;
                Значения.Добавить(42);
                Значения.Добавить("Текст");
                Значения.Добавить('19990315');
                Значения.Добавить(Истина);
                Значения.Добавить(Неопределено);
                Для Каждого Значение Из Значения Цикл
                    Сообщить(Строка(Значение) + " — " + ТипЗнч(Значение));
                КонецЦикла;
                Сообщить("Дней: " + Цел((ТекущаяДата() - '19990315') / 86400));
            КонецПроцедуры

      - id: 1c-01-03
        title: Условия и операторы
        minutes: 20
        xp: 25
        theory: |
          ## Операторы

          - арифметика: `+ - * /`, остаток `%`;
          - сравнение: `=`, `<>`, `<`, `>`, `<=`, `>=` (одно `=` — и присваивание, и сравнение, по контексту);
          - логика: `И`, `ИЛИ`, `НЕ`.

          ## Если

          ```bsl
          Если Возраст >= 18 Тогда
              Сообщить("Взрослый");
          ИначеЕсли Возраст >= 14 Тогда
              Сообщить("Подросток");
          Иначе
              Сообщить("Ребёнок");
          КонецЕсли;
          ```

          Обратите внимание: `Тогда` после условия и `КонецЕсли;` с точкой с запятой в конце.

          ## Тернарный оператор

          ```bsl
          Статус = ?(Возраст >= 18, "взрослый", "ребёнок");
          ```

          ## Полезные функции

          ```bsl
          ЗначениеЗаполнено(Контрагент)  // Ложь для пустых значений: 0, "", пустая ссылка, Неопределено
          Макс(1, 5, 3)    // 5
          Мин(1, 5, 3)     // 1
          Цел(7 / 2)       // 3
          Окр(3.456, 2)    // 3.46
          ```

          `ЗначениеЗаполнено()` — одна из самых используемых функций при проверке заполнения реквизитов документов.

          > ⚠️ В 1С нет `switch` — используйте цепочку `ИначеЕсли`.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              Х = 7;
              Если Х % 2 = 0 Тогда
                  Сообщить("чётное");
              Иначе
                  Сообщить("нечётное");
              КонецЕсли;
            answer: нечётное
          - type: output
            q: Что выведет код?
            code: |
              Сумма = 1500;
              Скидка = ?(Сумма > 1000, 10, 0);
              Сообщить(Скидка);
            answer: "10"
          - type: fill
            q: Допишите условие
            code: |
              Если Остаток <= 0 ___
                  Сообщить("Товар закончился");
              ___;
            answers: [Тогда, КонецЕсли]
          - type: choice
            q: Как в 1С записывается «не равно»?
            options: ["`!=`", "`<>`", "`=/=`", "`НЕРАВНО`"]
            answer: 1
          - type: bug
            q: Где ошибка?
            code: |
              Если Количество > 0 Тогда
                  Сообщить("Есть в наличии");
              Иначе Если Количество = 0 Тогда
                  Сообщить("Нет в наличии");
              КонецЕсли;
            bugLine: 3
            explain: "`ИначеЕсли` пишется слитно. Раздельное «Иначе Если» открывает новый вложенный `Если`, которому не хватит `КонецЕсли`."
            fix: ИначеЕсли Количество = 0 Тогда
        homework:
          task: |
            Обработка с реквизитами формы `Сумма` (Число) и `ВидКлиента` (Строка: «Розница», «Опт», «VIP»). По кнопке посчитайте скидку: Розница — 0%, Опт — 5% (при сумме от 10 000 — 7%), VIP — 15%. Если сумма не заполнена (`ЗначениеЗаполнено`), выведите предупреждение. Выведите итоговую сумму, округлённую до 2 знаков.
          checklist:
            - Используются ИначеЕсли и ЗначениеЗаполнено
            - Окр(…, 2) для итоговой суммы
          solution: |
            &НаКлиенте
            Процедура Рассчитать(Команда)
                Если НЕ ЗначениеЗаполнено(Сумма) Тогда
                    Сообщить("Укажите сумму!");
                    Возврат;
                КонецЕсли;
                Если ВидКлиента = "Опт" Тогда
                    Процент = ?(Сумма >= 10000, 7, 5);
                ИначеЕсли ВидКлиента = "VIP" Тогда
                    Процент = 15;
                Иначе
                    Процент = 0;
                КонецЕсли;
                Сообщить("К оплате: " + Окр(Сумма * (100 - Процент) / 100, 2));
            КонецПроцедуры

      - id: 1c-01-04
        title: Циклы
        minutes: 20
        xp: 25
        theory: |
          В 1С три вида циклов.

          ## Для … По

          ```bsl
          Для Сч = 1 По 5 Цикл
              Сообщить(Сч);
          КонецЦикла;
          ```

          Счётчик увеличивается на 1, границы **включительно**. Шага нет — для обратного порядка используют `Пока`.

          ## Для Каждого … Из

          Перебор элементов коллекции:

          ```bsl
          Фрукты = Новый Массив;
          Фрукты.Добавить("Яблоко");
          Фрукты.Добавить("Груша");
          Для Каждого Фрукт Из Фрукты Цикл
              Сообщить(Фрукт);
          КонецЦикла;
          ```

          Это главный цикл 1С-разработчика: так перебирают строки табличных частей, результаты запросов и коллекции.

          ## Пока

          ```bsl
          Н = 10;
          Пока Н > 0 Цикл
              Сообщить(Н);
              Н = Н - 3;
          КонецЦикла;
          ```

          ## Прервать и Продолжить

          ```bsl
          Для Сч = 1 По 10 Цикл
              Если Сч % 2 = 0 Тогда
                  Продолжить;     // пропустить чётные
              КонецЕсли;
              Если Сч > 7 Тогда
                  Прервать;       // выйти из цикла
              КонецЕсли;
              Сообщить(Сч);       // 1 3 5 7
          КонецЦикла;
          ```

          > ⚠️ В 1С нет операторов `+=` и `++`: пишите `Сумма = Сумма + 1;`.
        practice:
          - type: output
            q: Сколько сообщений выведет цикл? Введите число.
            code: |
              Для Сч = 3 По 7 Цикл
                  Сообщить(Сч);
              КонецЦикла;
            answer: "5"
            explain: Границы включительно — 3, 4, 5, 6, 7.
          - type: output
            q: Что выведет код?
            code: |
              Сумма = 0;
              Для Сч = 1 По 4 Цикл
                  Сумма = Сумма + Сч;
              КонецЦикла;
              Сообщить(Сумма);
            answer: "10"
          - type: fill
            q: Переберите все элементы массива
            code: |
              Для ___ Элемент Из Список Цикл
                  Сообщить(Элемент);
              ___;
            answers: [Каждого, КонецЦикла]
          - type: bug
            q: Где ошибка?
            code: |
              Итог = 0;
              Для Сч = 1 По 10 Цикл
                  Итог += Сч;
              КонецЦикла;
            bugLine: 3
            explain: В 1С нет оператора `+=`.
            fix: "    Итог = Итог + Сч;"
          - type: order
            q: Соберите цикл обратного отсчёта от 5 до 1
            lines:
              - Н = 5;
              - Пока Н > 0 Цикл
              - "    Сообщить(Н);"
              - "    Н = Н - 1;"
              - КонецЦикла;
        homework:
          task: |
            Выведите таблицу умножения на число, введённое в реквизит формы, а также сумму всех нечётных чисел от 1 до 1000 и первые 15 чисел Фибоначчи (циклом `Пока`).
          checklist:
            - Использованы все три вида циклов
            - Сумма нечётных = 250000
          solution: |
            &НаКлиенте
            Процедура Выполнить(Команда)
                Для Сч = 1 По 10 Цикл
                    Сообщить("" + Множитель + " × " + Сч + " = " + Множитель * Сч);
                КонецЦикла;

                Сумма = 0;
                Для Сч = 1 По 1000 Цикл
                    Если Сч % 2 = 1 Тогда
                        Сумма = Сумма + Сч;
                    КонецЕсли;
                КонецЦикла;
                Сообщить("Сумма нечётных: " + Сумма);

                А = 0; Б = 1; Н = 0;
                Пока Н < 15 Цикл
                    Сообщить(А);
                    Врем = А + Б; А = Б; Б = Врем;
                    Н = Н + 1;
                КонецЦикла;
            КонецПроцедуры

      - id: 1c-01-05
        title: Процедуры и функции
        minutes: 25
        xp: 25
        theory: |
          ## Процедура и функция

          ```bsl
          Процедура ПоказатьПриветствие(Имя)
              Сообщить("Привет, " + Имя + "!");
          КонецПроцедуры

          Функция Сложить(А, Б)
              Возврат А + Б;
          КонецФункции

          ПоказатьПриветствие("Аня");
          Результат = Сложить(2, 3);
          ```

          **Функция** возвращает значение через `Возврат`, **процедура** — нет.

          ## Параметры

          ```bsl
          Функция Приветствие(Имя = "Гость", Знач Повторов = 1)
          ```

          - значения по умолчанию задаются через `=`;
          - по умолчанию параметры передаются **по ссылке**: изменение параметра внутри меняет переменную вызывающего кода!
          - `Знач` — передача **по значению** (копия).

          ```bsl
          Процедура Увеличить(Число)
              Число = Число + 1;
          КонецПроцедуры

          А = 5;
          Увеличить(А);
          Сообщить(А);   // 6
          ```

          ## Экспорт и общие модули

          Ключевое слово `Экспорт` делает метод доступным из других модулей. Переиспользуемый код хранят в **общих модулях**:

          ```bsl
          // Общий модуль РаботаСЦенами
          Функция ЦенаСНДС(Цена, Ставка = 20) Экспорт
              Возврат Окр(Цена * (100 + Ставка) / 100, 2);
          КонецФункции

          // вызов из любого места
          Итог = РаботаСЦенами.ЦенаСНДС(1000);
          ```

          ## Клиент и сервер

          `&НаКлиенте` — код в интерфейсе пользователя; `&НаСервере` — на сервере, где доступны база данных и запросы. Работа с данными — **только на сервере**.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              Процедура Удвоить(Х)
                  Х = Х * 2;
              КонецПроцедуры

              А = 4;
              Удвоить(А);
              Сообщить(А);
            answer: "8"
            explain: Параметры в 1С по умолчанию передаются по ссылке.
          - type: output
            q: Что выведет код?
            code: |
              Процедура Удвоить(Знач Х)
                  Х = Х * 2;
              КонецПроцедуры

              А = 4;
              Удвоить(А);
              Сообщить(А);
            answer: "4"
          - type: fill
            q: Сделайте функцию доступной из других модулей
            code: |
              Функция Квадрат(Х) ___
                  ___ Х * Х;
              КонецФункции
            answers: [Экспорт, Возврат]
          - type: choice
            q: Где можно выполнять запросы к базе данных?
            options: ["Только `&НаКлиенте`", "Только `&НаСервере`", "Везде", "Только в общих модулях"]
            answer: 1
          - type: bug
            q: Где ошибка?
            code: |
              Процедура Площадь(Ширина, Высота)
                  Возврат Ширина * Высота;
              КонецПроцедуры
            bugLine: 1
            explain: Процедура не может возвращать значение — нужна `Функция ... КонецФункции`.
        homework:
          task: |
            Создайте общий модуль `ОбщегоНазначенияКлиентСервер` (флажки «Клиент» и «Сервер») с экспортными функциями: `ЭтоЧетное(Число)`, `Факториал(Н)` (рекурсивно), `СуммаПрописью(Сумма)` — используйте встроенную `ЧислоПрописью(Сумма, "Л=ru_RU", "рубль, рубля, рублей, м, копейка, копейки, копеек, ж, 2")`. Вызовите их из обработки.
          checklist:
            - Функции помечены Экспорт
            - Используется параметр Знач там, где менять параметр нельзя
          solution: |
            Функция ЭтоЧетное(Знач Число) Экспорт
                Возврат Число % 2 = 0;
            КонецФункции

            Функция Факториал(Знач Н) Экспорт
                Если Н <= 1 Тогда
                    Возврат 1;
                КонецЕсли;
                Возврат Н * Факториал(Н - 1);
            КонецФункции

            Функция СуммаПрописью(Знач Сумма) Экспорт
                Возврат ЧислоПрописью(Сумма, "Л=ru_RU",
                    "рубль, рубля, рублей, м, копейка, копейки, копеек, ж, 2");
            КонецФункции

      - id: 1c-01-06
        title: Строки и даты
        minutes: 25
        xp: 30
        theory: |
          ## Строки

          ```bsl
          С = "Привет, мир";
          СтрДлина(С)                  // 11
          ВРег(С), НРег(С)             // верхний / нижний регистр
          Лев(С, 6)                    // "Привет"
          Прав(С, 3)                   // "мир"
          Сред(С, 9, 3)                // "мир" — с 9-го символа 3 символа (нумерация с 1!)
          СтрНайти(С, "мир")           // 9 (0 — не найдено)
          СтрЗаменить(С, "мир", "1С")  // "Привет, 1С"
          СокрЛП("  текст  ")          // "текст"
          СтрРазделить("a;b;c", ";")   // Массив
          СтрСоединить(Массив, ", ")
          СтрШаблон("%1 купил %2 шт.", Имя, Кол)
          ```

          Многострочная строка: каждая новая строка начинается с `|`. Кавычка внутри строки удваивается: `"Он сказал ""Да"""`.

          ## Даты

          ```bsl
          Сейчас = ТекущаяДата();
          Год(Сейчас), Месяц(Сейчас), День(Сейчас), Час(Сейчас)
          НачалоМесяца(Сейчас), КонецМесяца(Сейчас), НачалоДня(Сейчас)
          ДобавитьМесяц(Сейчас, 1)
          Завтра = Сейчас + 86400;          // к дате прибавляются секунды
          Разница = (Дата2 - Дата1) / 86400; // в днях
          ```

          ## Форматирование

          ```bsl
          Формат(1234567.891, "ЧДЦ=2")          // "1 234 567,89"
          Формат(1234567, "ЧГ=0")               // "1234567" — без разделителей
          Формат(ТекущаяДата(), "ДФ=dd.MM.yyyy") // "06.10.2026"
          Формат(Истина, "БЛ=Нет; БИ=Да")
          ```

          `Формат()` — основная функция для вывода чисел и дат пользователю.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              Сообщить(Лев("Программист", 5));
            answer: Прогр
          - type: output
            q: Что выведет код?
            code: |
              Сообщить(Сред("Конфигурация", 5, 4));
            answer: игур
            explain: Нумерация символов в 1С начинается с 1.
          - type: output
            q: Что выведет код?
            code: |
              Сообщить(СтрНайти("Привет", "z"));
            answer: "0"
          - type: fill
            q: Выведите дату в формате 06.10.2026
            code: |
              Сообщить(___(ТекущаяДата(), "ДФ=dd.MM.yyyy"));
            answers: [Формат]
          - type: output
            q: Что выведет код?
            code: |
              Д = '20240131';
              Сообщить(Формат(ДобавитьМесяц(Д, 1), "ДФ=dd.MM.yyyy"));
            answer: 29.02.2024
            explain: "`ДобавитьМесяц` учитывает длину месяца — 2024 год високосный."
          - type: choice
            q: Как вставить кавычку внутрь строки?
            options: ["`\\\"`", "Удвоить: `\"\"`", "`&quot;`", "Нельзя"]
            answer: 1
        homework:
          task: |
            Обработка принимает ФИО в одной строке («Иванов Иван Иванович») и дату рождения. Выведите: фамилию и инициалы («Иванов И. И.»), возраст в полных годах, сколько дней до следующего дня рождения, и строку через `СтрШаблон`: «Иванов И. И., 25 лет, ДР через 40 дн.»
          hints:
            - "`Части = СтрРазделить(ФИО, \" \", Ложь);`"
            - Для дня рождения в текущем году соберите дату через `Дата(Год(ТекущаяДата()), Месяц(ДР), День(ДР))`.
          checklist:
            - Используются СтрРазделить, Лев, СтрШаблон
            - Корректно, если ДР в этом году уже прошёл
          solution: |
            &НаКлиенте
            Процедура Обработать(Команда)
                Части = СтрРазделить(ФИО, " ", Ложь);
                Кратко = Части[0] + " " + Лев(Части[1], 1) + ". " + Лев(Части[2], 1) + ".";
                Сегодня = НачалоДня(ТекущаяДата());
                Возраст = Год(Сегодня) - Год(ДатаРождения);
                Ближайший = Дата(Год(Сегодня), Месяц(ДатаРождения), День(ДатаРождения));
                Если Ближайший < Сегодня Тогда
                    Ближайший = ДобавитьМесяц(Ближайший, 12);
                Иначе
                    Если Ближайший > Сегодня Тогда
                        Возраст = Возраст - 1;
                    КонецЕсли;
                КонецЕсли;
                Дней = (Ближайший - Сегодня) / 86400;
                Сообщить(СтрШаблон("%1, %2 лет, ДР через %3 дн.", Кратко, Возраст, Дней));
            КонецПроцедуры

