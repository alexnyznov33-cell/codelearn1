              std::string b = std::move(a);
              std::cout << b.size() << " " << a.empty();
            answer: 5 1
            explain: После перемещения std::string на практике остаётся пустой (валидное, но неуказанное состояние; для string реализации оставляют пустую строку).
        homework:
          task: |
            Реализуйте `class String` с ручным управлением `char*` по правилу пяти (copy-and-swap, перемещение через std::exchange, noexcept), `size()`, `c_str()`, `operator+=`, `operator<<`. Добавьте счётчики вызовов каждого вида конструкторов и проверьте на `std::vector<String>` с `push_back` и `reserve`, что при росте вектора используется перемещение. Затем перепишите класс по правилу нуля.
          checklist:
            - Нет утечек (проверьте ASan)
            - Самоприсваивание безопасно
            - Вектор перемещает, а не копирует
          solution: |
            #include <cstring>
            #include <iostream>
            #include <utility>
            #include <vector>

            class String {
                char* d_; std::size_t n_;
            public:
                static inline int copies = 0, moves = 0;
                String(const char* s = "") : d_(new char[std::strlen(s) + 1]), n_(std::strlen(s)) { std::memcpy(d_, s, n_ + 1); }
                ~String() { delete[] d_; }
                String(const String& o) : d_(new char[o.n_ + 1]), n_(o.n_) { std::memcpy(d_, o.d_, n_ + 1); ++copies; }
                String(String&& o) noexcept : d_(std::exchange(o.d_, nullptr)), n_(std::exchange(o.n_, 0)) { ++moves; }
                String& operator=(String o) noexcept { swap(o); return *this; }   // и copy, и move
                void swap(String& o) noexcept { std::swap(d_, o.d_); std::swap(n_, o.n_); }
                String& operator+=(const String& o) {
                    char* nd = new char[n_ + o.n_ + 1];
                    std::memcpy(nd, d_, n_); std::memcpy(nd + n_, o.d_, o.n_ + 1);
                    delete[] d_; d_ = nd; n_ += o.n_; return *this;
                }
                std::size_t size() const { return n_; }
                const char* c_str() const { return d_ ? d_ : ""; }
                friend std::ostream& operator<<(std::ostream& os, const String& s) { return os << s.c_str(); }
            };

            int main() {
                std::vector<String> v;
                for (int i = 0; i < 100; ++i) v.push_back(String("x"));
                std::cout << "copies=" << String::copies << " moves=" << String::moves << "\n"; // copies=0
            }

            // Правило нуля:
            // class String { std::string s_; public: ... };  — ни одной специальной функции
