id: cpp
modules:
  - id: cpp-m3
    title: ООП в C++
    level: Junior
    lessons:
      - id: cpp-03-01
        title: Классы, конструкторы, деструкторы
        minutes: 30
        xp: 35
        theory: |
          ```cpp
          class Account {
          public:
              Account(std::string owner, double balance = 0.0)   // конструктор
                  : owner_(std::move(owner)), balance_(balance)  // список инициализации
              {
                  std::cout << "Открыт счёт " << owner_ << "\n";
              }

              ~Account() { std::cout << "Закрыт счёт " << owner_ << "\n"; }  // деструктор

              void deposit(double sum) { balance_ += sum; }
              double balance() const { return balance_; }

          private:
              std::string owner_;
              double balance_;
          };

          Account a("Аня", 100);        // на стеке
          Account b{"Боб"};             // фигурные скобки — uniform initialization
          auto c = std::make_unique<Account>("Вика");  // в куче
          ```

          ## Список инициализации

          Члены инициализируются **до** входа в тело конструктора, в порядке **объявления** в классе (не в порядке списка!). Для `const`-членов, ссылок и членов без конструктора по умолчанию список инициализации обязателен.

          ## Конструкторы

          ```cpp
          class Point {
          public:
              Point() = default;                    // конструктор по умолчанию
              Point(int x, int y) : x_(x), y_(y) {}
              explicit Point(int v) : Point(v, v) {} // делегирующий; explicit — запрет неявного преобразования
          private:
              int x_ = 0;                           // инициализатор по умолчанию (C++11)
              int y_ = 0;
          };

          void draw(Point p);
          // draw(5);         // без explicit скомпилировалось бы: неявно Point(5)
          ```

          Делайте **конструкторы с одним аргументом `explicit`** — это защищает от неожиданных преобразований.

          ## struct vs class

          Единственное отличие — доступ по умолчанию: у `struct` — `public`, у `class` — `private`. По соглашению `struct` — для простых агрегатов данных, `class` — для типов с инвариантами.

          ## Объявление и определение

          В реальных проектах класс объявляют в `.h`, а методы определяют в `.cpp`:

          ```cpp
          // account.h
          #pragma once
          class Account { public: void deposit(double sum); private: double balance_ = 0; };

          // account.cpp
          #include "account.h"
          void Account::deposit(double sum) { balance_ += sum; }
          ```

          `this` — указатель на текущий объект: `this->balance_`.
        practice:
