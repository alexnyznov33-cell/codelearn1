            options: ["В порядке списка инициализации", "В порядке объявления в классе", "В алфавитном порядке", "Случайно"]
            answer: 1
          - type: choice
            q: Чем struct отличается от class?
            options: ["struct нельзя наследовать", "Доступ по умолчанию: public у struct, private у class", "У struct нет методов", "struct всегда на стеке"]
            answer: 1
          - type: bug
            q: Какая строка не скомпилируется?
            code: |
              class Circle {
                  const double r_;
              public:
                  Circle(double r) {
                      r_ = r;
                  }
              };
            bugLine: 5
            fix: "Circle(double r) : r_(r) {}"
            explain: const-член нельзя присвоить в теле конструктора — только в списке инициализации.
        homework:
          task: |
            Создайте класс `Matrix` (rows, cols, `std::vector<double>` данные) с конструкторами: по размеру (заполнение нулями), из `std::initializer_list<std::initializer_list<double>>`, explicit-конструктор квадратной единичной матрицы `Matrix::identity(n)` (статический метод). Методы `at(r, c)` с проверкой, `print()`. Разделите на matrix.h / matrix.cpp.
          checklist:
            - Используется список инициализации
            - Одноаргументные конструкторы explicit
            - Код разделён на .h и .cpp
          solution: |
            // matrix.h
            #pragma once
            #include <initializer_list>
            #include <vector>
            #include <cstddef>

            class Matrix {
            public:
                Matrix(std::size_t rows, std::size_t cols);
                Matrix(std::initializer_list<std::initializer_list<double>> init);
                static Matrix identity(std::size_t n);
                double& at(std::size_t r, std::size_t c);
                double at(std::size_t r, std::size_t c) const;
                void print() const;
            private:
                std::size_t rows_, cols_;
                std::vector<double> data_;
            };

            // matrix.cpp
            #include "matrix.h"
            #include <iostream>
            #include <stdexcept>

            Matrix::Matrix(std::size_t r, std::size_t c) : rows_(r), cols_(c), data_(r * c, 0.0) {}
            Matrix::Matrix(std::initializer_list<std::initializer_list<double>> init)
                : rows_(init.size()), cols_(init.begin()->size()) {
                for (auto& row : init) data_.insert(data_.end(), row.begin(), row.end());
            }
            Matrix Matrix::identity(std::size_t n) { Matrix m(n, n); for (std::size_t i = 0; i < n; ++i) m.at(i, i) = 1; return m; }
            double& Matrix::at(std::size_t r, std::size_t c) {
                if (r >= rows_ || c >= cols_) throw std::out_of_range("Matrix::at");
                return data_[r * cols_ + c];
            }
            double Matrix::at(std::size_t r, std::size_t c) const { return const_cast<Matrix*>(this)->at(r, c); }
            void Matrix::print() const {
                for (std::size_t r = 0; r < rows_; ++r) {
                    for (std::size_t c = 0; c < cols_; ++c) std::cout << at(r, c) << ' ';
                    std::cout << '\n';
                }
            }
      - id: cpp-03-02
        title: Инкапсуляция, const-методы
        minutes: 25
        xp: 30
        theory: |
          **Инкапсуляция** — данные закрыты (`private`), изменения идут через методы, которые поддерживают **инвариант** класса (условие, которое всегда истинно: «баланс ≥ 0», «дата корректна»).

          ```cpp
          class Date {
          public:
              Date(int d, int m, int y) { set(d, m, y); }

              void set(int d, int m, int y) {
                  if (m < 1 || m > 12 || d < 1 || d > daysIn(m, y))
                      throw std::invalid_argument("Неверная дата");
                  d_ = d; m_ = m; y_ = y;
              }
              int day() const { return d_; }       // геттер
          private:
              static int daysIn(int m, int y);
              int d_, m_, y_;
          };
          ```

          Модификаторы: `public`, `protected` (класс и наследники), `private`. `friend` открывает доступ конкретной функции/классу — используйте редко (например, для `operator<<`).

          ## const-методы

          Метод с `const` после сигнатуры обещает **не изменять** объект. Только такие методы можно вызывать у константных объектов и через `const&`.

          ```cpp
          class Stack {
          public:
              void push(int v) { data_.push_back(v); }
              int top() const { return data_.back(); }      // ✅ const
              bool empty() const { return data_.empty(); }
          private:
              std::vector<int> data_;
          };

          void print(const Stack& s) {
              std::cout << s.top();     // ok: top() — const
              // s.push(1);             // ❌ ошибка: push не const
          }
          ```

          **Const-correctness**: всё, что не меняет объект, помечайте `const`. Иначе ваш класс нельзя будет нормально использовать через `const&`.

          ## Перегрузка по const

          ```cpp
          int& operator[](size_t i) { return data_[i]; }             // для изменения
          const int& operator[](size_t i) const { return data_[i]; } // для чтения
          ```

          ## mutable

          Поле `mutable` можно менять даже в const-методе — для кешей и мьютексов, которые не влияют на «наблюдаемое» состояние:

          ```cpp
          class Report {
              mutable std::optional<std::string> cache_;
              mutable std::mutex m_;
          public:
              const std::string& text() const {
                  std::lock_guard lk(m_);
                  if (!cache_) cache_ = build();
                  return *cache_;
              }
          };
          ```

          ## [[nodiscard]]

          `[[nodiscard]] bool empty() const;` — предупреждение, если результат проигнорирован.
