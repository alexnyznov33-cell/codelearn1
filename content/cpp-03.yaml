            options: ["std::any", "std::variant + std::visit", "void*", "union без тега"]
            answer: 1
        homework:
          task: |
            Сделайте мини-«графический редактор»: интерфейс `Shape` (area, perimeter, name, `clone()` возвращает `unique_ptr<Shape>`), реализации Circle, Rect, Triangle (проверка неравенства треугольника в конструкторе). Класс `Canvas` хранит фигуры, умеет `add`, `totalArea`, `largest`, и копируется глубоко через clone. Затем реализуйте тот же подсчёт площади через `std::variant` и сравните.
          checklist:
            - Shape абстрактный, деструктор виртуальный
            - Canvas корректно копируется (clone)
            - Вариант на std::variant работает
          solution: |
            #include <cmath>
            #include <memory>
            #include <stdexcept>
            #include <vector>

            struct Shape {
                virtual ~Shape() = default;
                virtual double area() const = 0;
                virtual std::unique_ptr<Shape> clone() const = 0;
            };
            struct Circle : Shape {
                double r; explicit Circle(double r) : r(r) {}
                double area() const override { return M_PI * r * r; }
                std::unique_ptr<Shape> clone() const override { return std::make_unique<Circle>(*this); }
            };
            struct Triangle : Shape {
                double a, b, c;
                Triangle(double a, double b, double c) : a(a), b(b), c(c) {
                    if (a + b <= c || a + c <= b || b + c <= a) throw std::invalid_argument("triangle");
                }
                double area() const override { double p = (a + b + c) / 2; return std::sqrt(p * (p - a) * (p - b) * (p - c)); }
                std::unique_ptr<Shape> clone() const override { return std::make_unique<Triangle>(*this); }
            };

            class Canvas {
                std::vector<std::unique_ptr<Shape>> items_;
            public:
                Canvas() = default;
                Canvas(const Canvas& o) { for (auto& s : o.items_) items_.push_back(s->clone()); }
                Canvas& operator=(Canvas o) { items_.swap(o.items_); return *this; }
                void add(std::unique_ptr<Shape> s) { items_.push_back(std::move(s)); }
                double totalArea() const { double t = 0; for (auto& s : items_) t += s->area(); return t; }
            };
      - id: cpp-03-05
        title: Перегрузка операторов
        minutes: 30
        xp: 35
        theory: |
          Операторы можно определить для своих типов, чтобы они вели себя как встроенные.

          ```cpp
          struct Vec2 {
              double x = 0, y = 0;

              Vec2& operator+=(const Vec2& o) { x += o.x; y += o.y; return *this; }
              Vec2 operator-() const { return {-x, -y}; }                 // унарный минус
              double& operator[](size_t i) { return i == 0 ? x : y; }

              bool operator==(const Vec2&) const = default;               // C++20: сгенерировать сравнение
          };

          // бинарные — свободными функциями (симметрия: 2 * v и v * 2)
          inline Vec2 operator+(Vec2 a, const Vec2& b) { a += b; return a; }   // через +=
          inline Vec2 operator*(Vec2 v, double k) { return {v.x * k, v.y * k}; }
          inline Vec2 operator*(double k, Vec2 v) { return v * k; }

          // вывод в поток
          std::ostream& operator<<(std::ostream& os, const Vec2& v) {
              return os << "(" << v.x << ", " << v.y << ")";
          }

          Vec2 a{1, 2}, b{3, 4};
          std::cout << a + b * 2 << "\n";    // (7, 10)
          ```

          ## Spaceship operator (C++20)

          ```cpp
          struct Version {
              int major, minor, patch;
              auto operator<=>(const Version&) const = default;  // генерирует <, <=, >, >=, ==, !=
          };
          Version{1, 2, 0} < Version{1, 10, 0};   // true — лексикографически по полям
          ```

          ## Инкремент

          ```cpp
          Counter& operator++() { ++n; return *this; }        // префиксный ++c
          Counter operator++(int) { auto old = *this; ++n; return old; } // постфиксный c++
          ```

          ## Функциональный объект

          ```cpp
          struct Multiplier {
              int k;
              int operator()(int x) const { return x * k; }
          };
          Multiplier triple{3};
          std::cout << triple(5);   // 15
          ```

          ## Правила

          - Сохраняйте ожидаемый смысл: `+` не должен ничего печатать или менять операнды.
          - Составные (`+=`) — методы, возвращают `*this` по ссылке; бинарные (`+`) — свободные, через составные.
          - `operator<<` — свободная функция (часто `friend`).
          - Нельзя перегрузить: `::`, `.`, `.*`, `?:`, `sizeof`. Нельзя придумать новые операторы.
          - `explicit operator bool() const` — для проверок `if (obj)`.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              struct V { int x; };
              V operator+(V a, V b) { return {a.x + b.x}; }
              int main() {
                  V a{2}, b{3};
                  std::cout << (a + b + a).x;
              }
            answer: "7"
          - type: fill
            q: Сгенерируйте все операторы сравнения (C++20)
            code: |
              auto operator___(const Money&) const = default;
            answers: ["<=>"]
          - type: choice
            q: Как отличить постфиксный оператор ++ от префиксного?
            options: ["Постфиксный принимает фиктивный параметр int", "Префиксный — static", "По возвращаемому типу", "Никак"]
            answer: 0
          - type: output
            q: Что выведет код?
            code: |
              struct Add { int k; int operator()(int x) const { return x + k; } };
              int main() { Add a{10}; std::cout << a(a(1)); }
            answer: "21"
          - type: choice
            q: Какой оператор НЕЛЬЗЯ перегрузить?
            options: ["operator[]", "operator()", "operator::", "operator<<"]
            answer: 2
        homework:
          task: |
            Реализуйте класс `Money` (копейки в `long long`, валюта `std::string`): `+`, `-`, `+=`, `-=`, умножение на целое, `<=>` и `==` (сравнение разных валют — исключение), `operator<<` в формате `123.45 RUB`, `explicit operator bool` (ненулевая сумма). Напишите тесты через `assert`.
          checklist:
            - Бинарные операторы через составные
            - Разные валюты → исключение
            - Вывод форматирован с двумя знаками
          solution: |
            #include <cassert>
            #include <compare>
            #include <iomanip>
            #include <iostream>
            #include <stdexcept>
            #include <string>

            class Money {
                long long c_; std::string cur_;
                void check(const Money& o) const { if (cur_ != o.cur_) throw std::invalid_argument("currency"); }
            public:
                Money(long long kop, std::string cur) : c_(kop), cur_(std::move(cur)) {}
                Money& operator+=(const Money& o) { check(o); c_ += o.c_; return *this; }
                Money& operator-=(const Money& o) { check(o); c_ -= o.c_; return *this; }
                friend Money operator+(Money a, const Money& b) { return a += b; }
                friend Money operator-(Money a, const Money& b) { return a -= b; }
                friend Money operator*(Money a, long long k) { a.c_ *= k; return a; }
                std::strong_ordering operator<=>(const Money& o) const { check(o); return c_ <=> o.c_; }
                bool operator==(const Money& o) const { check(o); return c_ == o.c_; }
                explicit operator bool() const { return c_ != 0; }
                friend std::ostream& operator<<(std::ostream& os, const Money& m) {
                    return os << m.c_ / 100 << '.' << std::setw(2) << std::setfill('0') << std::llabs(m.c_ % 100) << ' ' << m.cur_;
                }
            };

            int main() {
                Money a(12345, "RUB"), b(55, "RUB");
                assert(a + b == Money(12400, "RUB"));
                assert(b < a);
                assert(!Money(0, "RUB"));
                std::cout << a * 2 << "\n";   // 246.90 RUB
            }
      - id: cpp-03-06
        title: Правило трёх/пяти/нуля
        minutes: 35
        xp: 45
        theory: |
          Компилятор сам генерирует **специальные функции-члены**: конструктор копирования, оператор присваивания копированием, конструктор перемещения, оператор присваивания перемещением, деструктор. Для класса, который **владеет ресурсом** через сырой указатель, сгенерированные версии ошибочны: они копируют указатель, а не данные (поверхностное копирование) → двойной delete.

          ## Правило трёх (C++98)

          Если вам пришлось написать **деструктор, копирующий конструктор или копирующее присваивание** — скорее всего нужны все три.

          ## Правило пяти (C++11)

          Плюс **перемещающие** конструктор и присваивание — для эффективности.

          ```cpp
          class Buffer {
              size_t size_;
              int* data_;
          public:
              explicit Buffer(size_t n) : size_(n), data_(new int[n]{}) {}
              ~Buffer() { delete[] data_; }                                   // 1. деструктор

              Buffer(const Buffer& o) : size_(o.size_), data_(new int[o.size_]) {  // 2. копирование
                  std::copy(o.data_, o.data_ + size_, data_);
              }
              Buffer& operator=(const Buffer& o) {                            // 3. копирующее =
                  if (this != &o) { Buffer tmp(o); swap(tmp); }               // copy-and-swap
                  return *this;
              }
              Buffer(Buffer&& o) noexcept                                     // 4. перемещение
                  : size_(std::exchange(o.size_, 0)), data_(std::exchange(o.data_, nullptr)) {}
              Buffer& operator=(Buffer&& o) noexcept {                        // 5. перемещающее =
                  Buffer tmp(std::move(o)); swap(tmp); return *this;
              }
              void swap(Buffer& o) noexcept { std::swap(size_, o.size_); std::swap(data_, o.data_); }
          };
          ```

          Перемещение — «украсть» ресурс у временного объекта за O(1), оставив его в валидном пустом состоянии. Помечайте `noexcept` — иначе `std::vector` при росте будет копировать, а не перемещать.

          ## Правило нуля — лучший вариант

          Не управляйте ресурсами вручную: используйте члены, которые сами умеют копироваться/перемещаться/освобождаться (`std::vector`, `std::string`, `unique_ptr`). Тогда **не пишите ни одной** из пяти функций — сгенерированные будут правильными.

          ```cpp
          class Buffer {
              std::vector<int> data_;      // всё работает само
          public:
              explicit Buffer(size_t n) : data_(n) {}
          };
          ```

          ## = default и = delete

          ```cpp
          class Connection {
          public:
              Connection(const Connection&) = delete;            // некопируемый
              Connection& operator=(const Connection&) = delete;
              Connection(Connection&&) noexcept = default;       // но перемещаемый
              Connection& operator=(Connection&&) noexcept = default;
          };
          ```

          Если объявить деструктор или копирование, перемещающие операции **не сгенерируются** — объект будет копироваться там, где мог бы перемещаться.
        practice:
          - type: choice
            q: Что произойдёт при копировании класса с полем `int* data` и деструктором `delete[] data`, если копирование не определено?
            options: ["Глубокая копия", "Оба объекта укажут на один буфер → двойной delete", "Ошибка компиляции", "Ничего страшного"]
            answer: 1
          - type: choice
            q: Что гласит правило нуля?
            options: ["Не создавать объекты", "Использовать RAII-члены и не писать специальные функции вручную", "Всегда писать 5 функций", "Инициализировать всё нулями"]
