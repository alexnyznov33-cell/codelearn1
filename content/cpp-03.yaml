                  A* p = &b;
                  std::cout << p->f() << b.f();
              }
            answer: AB
            explain: f() не виртуальная — выбор по статическому типу указателя.
          - type: bug
            q: Какую строку отловит компилятор благодаря override?
            code: |
              struct Shape {
                  virtual double area() const = 0;
                  virtual ~Shape() = default;
              };
              struct Sq : Shape {
                  double s = 1;
                  double area() override { return s * s; }
              };
            bugLine: 7
            fix: double area() const override { return s * s; }
            explain: Забыт const — это другая сигнатура, переопределения нет. override превращает это в ошибку компиляции.
        homework:
          task: |
            Иерархия транспорта: базовый `Vehicle` (имя, скорость, виртуальные `travelTime(double km) const`, `describe() const`, виртуальный деструктор), наследники `Car`, `Bicycle` (final), `Truck` (учитывает груз — скорость падает). Храните в `std::vector<std::unique_ptr<Vehicle>>`, отсортируйте по времени на 100 км, выведите описание. Деструкторы печатают сообщения.
          checklist:
            - Везде override
            - Нет срезки
            - Деструкторы наследников вызываются
          solution: |
            #include <algorithm>
            #include <iostream>
            #include <memory>
            #include <string>
            #include <vector>

            class Vehicle {
            public:
                Vehicle(std::string n, double v) : name_(std::move(n)), speed_(v) {}
                virtual ~Vehicle() { std::cout << "~Vehicle " << name_ << "\n"; }
                virtual double speed() const { return speed_; }
                double travelTime(double km) const { return km / speed(); }
                virtual std::string describe() const { return name_ + " " + std::to_string(speed()) + " км/ч"; }
            protected:
                std::string name_; double speed_;
            };
            class Car : public Vehicle { public: using Vehicle::Vehicle; ~Car() override { std::cout << "~Car\n"; } };
            class Bicycle final : public Vehicle {
            public: Bicycle() : Vehicle("Велосипед", 18) {}
                std::string describe() const override { return "🚲 " + Vehicle::describe(); }
            };
            class Truck : public Vehicle {
                double cargo_;
            public:
                Truck(std::string n, double v, double t) : Vehicle(std::move(n), v), cargo_(t) {}
                double speed() const override { return speed_ * (1 - cargo_ / 40); }
            };

            int main() {
                std::vector<std::unique_ptr<Vehicle>> v;
                v.push_back(std::make_unique<Car>("Лада", 90));
                v.push_back(std::make_unique<Bicycle>());
                v.push_back(std::make_unique<Truck>("КАМАЗ", 80, 20));
                std::sort(v.begin(), v.end(), [](auto& a, auto& b) { return a->travelTime(100) < b->travelTime(100); });
                for (auto& x : v) std::cout << x->describe() << "\n";
            }
      - id: cpp-03-04
        title: Абстрактные классы и полиморфизм
        minutes: 30
        xp: 35
        theory: |
          **Чисто виртуальная функция** `= 0` не имеет реализации в базовом классе. Класс с хотя бы одной такой функцией — **абстрактный**: создать его объект нельзя.

          ```cpp
          class Shape {
          public:
              virtual ~Shape() = default;
              virtual double area() const = 0;
              virtual double perimeter() const = 0;
              virtual std::string name() const = 0;

              void print() const {                                   // общий код через виртуальные функции
                  std::cout << name() << ": S=" << area() << ", P=" << perimeter() << "\n";
              }
          };

          class Circle : public Shape {
              double r_;
          public:
              explicit Circle(double r) : r_(r) {}
              double area() const override { return 3.14159 * r_ * r_; }
              double perimeter() const override { return 2 * 3.14159 * r_; }
              std::string name() const override { return "Круг"; }
          };

          // Shape s;                 // ❌ нельзя: абстрактный
          std::unique_ptr<Shape> s = std::make_unique<Circle>(2);
          s->print();
          ```

          Наследник, не реализовавший все чисто виртуальные функции, тоже остаётся абстрактным.

          ## Интерфейсы в C++

          Отдельного ключевого слова нет — интерфейс это класс, где **все** функции чисто виртуальные, а данных нет:

          ```cpp
          class ILogger {
          public:
              virtual ~ILogger() = default;
              virtual void log(std::string_view msg) = 0;
          };

          class ConsoleLogger : public ILogger {
          public:
              void log(std::string_view m) override { std::cout << m << "\n"; }
          };

          class OrderService {
              ILogger& log_;                               // зависимость от абстракции
          public:
              explicit OrderService(ILogger& l) : log_(l) {}
              void place() { log_.log("Заказ создан"); }
          };
          ```

          Это основа внедрения зависимостей и тестирования с моками (GoogleMock) в C++.

          ## Цена виртуальности

          Каждый полиморфный объект хранит указатель на vtable (+8 байт), вызов идёт косвенно и мешает inline-оптимизации. Обычно это неважно, но в горячих циклах на миллионы объектов используют альтернативы:

          - **статический полиморфизм** — шаблоны и CRTP (модуль 5);
          - `std::variant` + `std::visit` — закрытый набор типов без кучи и vtable.

          ```cpp
          using AnyShape = std::variant<Circle, Square>;
          double total = 0;
          for (auto& s : shapes) total += std::visit([](auto& x) { return x.area(); }, s);
          ```
        practice:
