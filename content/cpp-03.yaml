            answer: 1
        homework:
          task: |
            Класс `Fraction` (числитель, знаменатель) с инвариантами: знаменатель > 0, дробь всегда сокращена (`std::gcd`). Методы: `num() const`, `den() const`, `toDouble() const`, `add(const Fraction&) const` (возвращает новую дробь), `inverse()`. Деление на ноль — исключение. Все неизменяющие методы — const, с `[[nodiscard]]`.
          checklist:
            - Знаменатель всегда положителен
            - Дробь сокращается в конструкторе
            - Методы const-корректны
          solution: |
            #include <numeric>
            #include <stdexcept>

            class Fraction {
            public:
                Fraction(long n, long d = 1) : n_(n), d_(d) {
                    if (d_ == 0) throw std::invalid_argument("den = 0");
                    if (d_ < 0) { n_ = -n_; d_ = -d_; }
                    long g = std::gcd(n_, d_);
                    if (g) { n_ /= g; d_ /= g; }
                }
                [[nodiscard]] long num() const { return n_; }
                [[nodiscard]] long den() const { return d_; }
                [[nodiscard]] double toDouble() const { return static_cast<double>(n_) / d_; }
                [[nodiscard]] Fraction add(const Fraction& o) const { return {n_ * o.d_ + o.n_ * d_, d_ * o.d_}; }
                [[nodiscard]] Fraction inverse() const { return {d_, n_}; }
            private:
                long n_, d_;
            };
      - id: cpp-03-03
        title: Наследование и виртуальные функции
        minutes: 35
        xp: 40
        theory: |
          ```cpp
          class Animal {
          public:
              explicit Animal(std::string name) : name_(std::move(name)) {}
              virtual ~Animal() = default;                      // ОБЯЗАТЕЛЬНО виртуальный деструктор
              virtual std::string sound() const { return "..."; }
              const std::string& name() const { return name_; }
          protected:
              std::string name_;
          };

          class Dog : public Animal {
          public:
              using Animal::Animal;                             // унаследовать конструкторы
              std::string sound() const override { return "Гав"; }
          };

          class Cat final : public Animal {                     // final — дальше наследовать нельзя
          public:
              Cat() : Animal("Кот") {}                          // вызов конструктора базы
              std::string sound() const override { return "Мяу"; }
          };
          ```

          ## Динамический полиморфизм

          Вызов `virtual`-функции через **указатель или ссылку** на базовый класс выбирает реализацию по фактическому типу объекта (через таблицу виртуальных функций — vtable).

          ```cpp
          std::vector<std::unique_ptr<Animal>> zoo;
          zoo.push_back(std::make_unique<Dog>("Рекс"));
          zoo.push_back(std::make_unique<Cat>());
          for (const auto& a : zoo) std::cout << a->sound() << "\n";   // Гав, Мяу
          ```

          ## override

          Всегда пишите `override`: компилятор проверит, что вы действительно переопределяете (а не создаёте новую функцию из-за опечатки в сигнатуре или забытого `const`).

          ## Срезка (slicing)

          ```cpp
          Dog d("Бим");
          Animal a = d;            // ❌ копируется только часть Animal
          std::cout << a.sound();  // "..." — полиморфизм потерян
          ```

          Полиморфные объекты передавайте по ссылке или указателю.

          ## Виртуальный деструктор

          ```cpp
          Animal* p = new Dog("x");
          delete p;   // без virtual ~Animal() вызовется только ~Animal — UB, утечка ресурсов Dog
          ```

          Правило: если в классе есть виртуальные функции — деструктор должен быть `virtual` (или protected и невиртуальный).

          ## Виды наследования

          `public` (является — «is-a», 99% случаев), `protected`, `private` (реализация через). C++ поддерживает **множественное** наследование; ромб решается `virtual`-наследованием, но лучше избегать — наследуйте от интерфейсов.

          `dynamic_cast<Dog*>(p)` — безопасное приведение вниз (nullptr при неудаче), работает только с полиморфными типами.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              struct A { virtual char f() const { return 'A'; } virtual ~A() = default; };
              struct B : A { char f() const override { return 'B'; } };
              int main() {
                  B b;
                  A& r = b;
                  A copy = b;
                  std::cout << r.f() << copy.f();
