            options: ["Это баг компилятора", "Временный future уничтожается сразу и его деструктор ждёт завершения задачи", "launch::async игнорируется", "Нет потоков"]
            answer: 1
        homework:
          task: |
            Параллельный поиск: функция `std::optional<std::string> findFirst(const std::vector<std::string>& files, std::string_view word)` запускает `std::async` на каждый файл (не более N одновременно), возвращает имя первого файла (по порядку в списке), содержащего слово. Ошибки чтения передаются через future и логируются, не прерывая остальные. Используйте `wait_for` для вывода прогресса.
          checklist:
            - Исключения ловятся из get()
            - Ограничено число одновременных задач
            - Используется wait_for
          solution: |
            #include <chrono>
            #include <fstream>
            #include <future>
            #include <iostream>
            #include <optional>
            #include <sstream>
            #include <string>
            #include <vector>

            static bool contains(const std::string& path, std::string_view word) {
                std::ifstream in(path);
                if (!in) throw std::runtime_error("не открыть " + path);
                std::stringstream ss; ss << in.rdbuf();
                return ss.str().find(word) != std::string::npos;
            }

            std::optional<std::string> findFirst(const std::vector<std::string>& files, std::string_view word, std::size_t N = 4) {
                for (std::size_t start = 0; start < files.size(); start += N) {
                    std::vector<std::future<bool>> batch;
                    for (std::size_t i = start; i < std::min(files.size(), start + N); ++i)
                        batch.push_back(std::async(std::launch::async, contains, files[i], word));
                    for (auto& f : batch)
                        while (f.wait_for(std::chrono::milliseconds(100)) != std::future_status::ready) std::cout << "." << std::flush;
                    for (std::size_t k = 0; k < batch.size(); ++k) {
                        try { if (batch[k].get()) return files[start + k]; }
                        catch (const std::exception& e) { std::cerr << "ошибка: " << e.what() << "\n"; }
                    }
                }
                return std::nullopt;
            }

            int main() {
                auto r = findFirst({"a.txt", "b.txt", "missing.txt", "c.txt"}, "TODO");
                std::cout << "\n" << r.value_or("не найдено") << "\n";
            }
