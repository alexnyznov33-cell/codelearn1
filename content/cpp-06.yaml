id: cpp
modules:
  - id: cpp-m6
    title: Многопоточность
    level: Middle
    lessons:
      - id: cpp-06-01
        title: std::thread и join
        minutes: 30
        xp: 40
        theory: |
          С C++11 потоки — часть стандарта (`<thread>`).

          ```cpp
          #include <thread>
          #include <iostream>

          void work(int id, int n) {
              for (int i = 0; i < n; ++i) std::cout << "поток " << id << ": " << i << "\n";
          }

          int main() {
              std::thread t1(work, 1, 3);                 // запуск сразу при создании
              std::thread t2([] { work(2, 3); });         // лямбда
              t1.join();                                   // ждать завершения
              t2.join();
              std::cout << std::thread::hardware_concurrency() << " ядер\n";
          }
          ```

          Вывод потоков перемешается — порядок выполнения не определён.

          ## join или detach — обязательно

          Если объект `std::thread` уничтожается, пока поток «joinable» (не сделан `join()`/`detach()`), вызывается **`std::terminate`** — программа падает.

          - `join()` — дождаться завершения.
          - `detach()` — «отпустить» поток работать в фоне. Опасно: поток может пережить данные, на которые ссылается, и main. Избегайте.

          ## std::jthread (C++20) — используйте его

          RAII-поток: в деструкторе сам делает `request_stop()` + `join()`. Плюс встроенная кооперативная отмена:

          ```cpp
          std::jthread worker([](std::stop_token st) {
              while (!st.stop_requested()) {
                  doWork();
                  std::this_thread::sleep_for(std::chrono::milliseconds(100));
              }
          });
          // ...
          worker.request_stop();   // или просто выход из области видимости
          ```

          ## Передача аргументов

          Аргументы **копируются** в поток. Для передачи по ссылке — `std::ref`:

          ```cpp
          void fill(std::vector<int>& v);
          std::vector<int> data;
          std::thread t(fill, std::ref(data));   // без std::ref — ошибка компиляции
          t.join();
          ```

          ⚠️ Не передавайте ссылки/указатели на локальные переменные в detach-потоки.

          ## Исключения

          Необработанное исключение в потоке → `std::terminate`. Ловите внутри потока или используйте `std::async`/`std::promise` (урок 5), чтобы передать исключение в вызывающий поток.

          ## Полезное

          ```cpp
          std::this_thread::get_id();
          std::this_thread::sleep_for(std::chrono::seconds(1));
          std::this_thread::yield();
          ```

          ## Сколько потоков

          Для CPU-задач — около `hardware_concurrency()`. Больше потоков, чем ядер, не ускоряет вычисления, а добавляет переключения контекста. Для многих мелких задач используют **пул потоков**.
        practice:
