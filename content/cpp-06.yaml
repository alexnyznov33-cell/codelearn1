        homework:
          task: |
            Реализуйте: (1) спинлок на `std::atomic_flag` (test_and_set с acquire, clear с release) и сравните скорость с std::mutex на 4 потоках × 1 000 000 инкрементов; (2) lock-free стек (Treiber stack) `push` через compare_exchange_weak (pop — с пометкой про проблему ABA и утечку памяти); (3) продемонстрируйте false sharing: два счётчика рядом vs с alignas(64).
          checklist:
            - Спинлок корректен (TSan чист)
            - push lock-free через CAS
            - Замер false sharing показывает разницу
          solution: |
            #include <atomic>
            #include <chrono>
            #include <iostream>
            #include <thread>
            #include <vector>

            class SpinLock {
                std::atomic_flag f_ = ATOMIC_FLAG_INIT;
            public:
                void lock() { while (f_.test_and_set(std::memory_order_acquire)) f_.wait(true); }
                void unlock() { f_.clear(std::memory_order_release); f_.notify_one(); }
            };

            template <class T>
            class LockFreeStack {
                struct Node { T v; Node* next; };
                std::atomic<Node*> head_{nullptr};
            public:
                void push(T v) {
                    Node* n = new Node{std::move(v), head_.load(std::memory_order_relaxed)};
                    while (!head_.compare_exchange_weak(n->next, n, std::memory_order_release, std::memory_order_relaxed)) {}
                }
                // pop без схемы освобождения памяти (hazard pointers / epoch) подвержен ABA — в проде используйте готовые библиотеки
            };

            struct Near { std::atomic<long> a{0}, b{0}; };
            struct Far { alignas(64) std::atomic<long> a{0}; alignas(64) std::atomic<long> b{0}; };

            template <class S> long long bench() {
                S s; auto t = std::chrono::steady_clock::now();
                {
                    std::jthread x([&] { for (int i = 0; i < 50'000'000; ++i) s.a.fetch_add(1, std::memory_order_relaxed); });
                    std::jthread y([&] { for (int i = 0; i < 50'000'000; ++i) s.b.fetch_add(1, std::memory_order_relaxed); });
                }
                return std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::steady_clock::now() - t).count();
            }

            int main() { std::cout << "near " << bench<Near>() << " ms, far " << bench<Far>() << " ms\n"; }
      - id: cpp-06-05
        title: async, future, promise
        minutes: 30
        xp: 40
        theory: |
          Высокоуровневые инструменты `<future>` позволяют запускать задачи и получать **результат или исключение** без ручной синхронизации.

          ## std::async

          ```cpp
          #include <future>

          int heavy(int x) { std::this_thread::sleep_for(std::chrono::seconds(1)); return x * x; }

          std::future<int> f1 = std::async(std::launch::async, heavy, 5);   // в отдельном потоке
          std::future<int> f2 = std::async(std::launch::async, heavy, 6);
          int total = f1.get() + f2.get();    // get() ждёт результат; ~1 c вместо 2
          ```

          Политики: `std::launch::async` — новый поток сразу; `std::launch::deferred` — выполнить лениво при `get()` в вызывающем потоке. Без указания — на усмотрение реализации, лучше всегда указывайте `async`.

          ⚠️ Деструктор future, полученного из `std::async`, **блокируется** до завершения задачи:

          ```cpp
          std::async(std::launch::async, task);   // результат не сохранён → выполняется синхронно!
          ```

          ## Исключения передаются

          ```cpp
          auto f = std::async(std::launch::async, [] { throw std::runtime_error("ошибка"); return 1; });
          try { f.get(); }                                  // исключение перебрасывается здесь
          catch (const std::exception& e) { std::cout << e.what(); }
          ```

          ## std::future

          - `get()` — один раз (потом future невалиден); `std::shared_future` — для многократного/многих читателей.
          - `wait()`, `wait_for(timeout)` → `future_status::ready/timeout/deferred`.

          ## std::promise — ручная установка результата

          ```cpp
          std::promise<std::string> p;
          std::future<std::string> f = p.get_future();

          std::jthread worker([pr = std::move(p)]() mutable {
              try { pr.set_value(download()); }
              catch (...) { pr.set_exception(std::current_exception()); }
          });

          std::cout << f.get();
          ```

          Применение: связать колбэк-API с future, сигнал «готово» между потоками.

          ## std::packaged_task

          Обёртка над функцией, результат которой попадёт в future — удобна для пулов потоков (см. урок про condition_variable).

          ## Ограничения

          В стандартных `std::future` нет `then`/продолжений и нет отмены. Для сложной асинхронности используют корутины C++20 (`co_await`) с библиотеками (cppcoro, Boost.Asio, folly), а для параллельных алгоритмов — `std::execution::par` или Intel TBB.
        practice:
          - type: fill
            q: Запустите задачу в отдельном потоке
            code: |
