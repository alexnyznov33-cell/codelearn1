            options: ["1000", "Примерно число ядер (hardware_concurrency)", "Всегда 2", "Один на каждый элемент данных"]
            answer: 1
        homework:
          task: |
            Посчитайте сумму квадратов чисел от 1 до 200 000 000, разбив диапазон на K частей (K = hardware_concurrency) и запустив K `std::jthread`, каждый пишет результат в свой элемент `std::vector<long long>` (без общих переменных). Сравните время с однопоточной версией. Добавьте фоновый jthread-«индикатор», печатающий точку раз в 200 мс и останавливаемый через stop_token.
          checklist:
            - Нет гонок данных (каждый поток пишет в свою ячейку)
            - Все потоки корректно завершаются
            - Выведено ускорение
          solution: |
            #include <chrono>
            #include <iostream>
            #include <numeric>
            #include <thread>
            #include <vector>

            int main() {
                const long long N = 200'000'000;
                unsigned K = std::max(1u, std::thread::hardware_concurrency());
                auto t0 = std::chrono::steady_clock::now();
                long long single = 0;
                for (long long i = 1; i <= N; ++i) single += i * i % 1000;
                auto t1 = std::chrono::steady_clock::now();

                std::jthread spinner([](std::stop_token st) {
                    while (!st.stop_requested()) { std::cout << '.' << std::flush; std::this_thread::sleep_for(std::chrono::milliseconds(200)); }
                });
                std::vector<long long> parts(K);
                {
                    std::vector<std::jthread> ws;
                    for (unsigned k = 0; k < K; ++k)
                        ws.emplace_back([&parts, k, K, N] {
                            long long from = N / K * k + 1, to = (k == K - 1) ? N : N / K * (k + 1), s = 0;
                            for (long long i = from; i <= to; ++i) s += i * i % 1000;
                            parts[k] = s;
                        });
                }   // join всех
                spinner.request_stop();
                auto t2 = std::chrono::steady_clock::now();
                long long multi = std::accumulate(parts.begin(), parts.end(), 0LL);
                using ms = std::chrono::milliseconds;
                std::cout << "\n" << single << " " << multi << " x" << double(std::chrono::duration_cast<ms>(t1 - t0).count()) /
                             std::chrono::duration_cast<ms>(t2 - t1).count() << "\n";
            }
      - id: cpp-06-02
        title: mutex, lock_guard, гонки
        minutes: 35
        xp: 45
        theory: |
          **Гонка данных** (data race) — два потока обращаются к одной памяти без синхронизации, и хотя бы один пишет. В C++ это **неопределённое поведение**, а не просто «неверный результат».

          ```cpp
          int counter = 0;
          auto inc = [&] { for (int i = 0; i < 100000; ++i) ++counter; };   // ❌ data race
          std::jthread a(inc), b(inc);
          ```

          ## std::mutex

          ```cpp
          #include <mutex>

          std::mutex m;
          int counter = 0;

          void inc() {
              for (int i = 0; i < 100000; ++i) {
                  std::lock_guard<std::mutex> lock(m);   // захват; освобождение в деструкторе
                  ++counter;
              }
          }
          ```

          Никогда не вызывайте `m.lock()`/`m.unlock()` вручную — при исключении мьютекс останется захваченным. Используйте RAII:

          | Обёртка | Когда |
          |---|---|
          | `std::lock_guard` | просто захватить на область видимости |
          | `std::unique_lock` | нужно отпускать/захватывать повторно, отложенный захват, для `condition_variable` |
          | `std::scoped_lock` (C++17) | несколько мьютексов сразу **без deadlock** |
          | `std::shared_lock` + `std::shared_mutex` | много читателей / один писатель |

          ## Потокобезопасный класс

          ```cpp
          class Bank {
              mutable std::mutex m_;
              std::unordered_map<std::string, long> acc_;
          public:
              void deposit(const std::string& who, long sum) {
                  std::lock_guard lk(m_);
                  acc_[who] += sum;
              }
              long balance(const std::string& who) const {
                  std::lock_guard lk(m_);                 // mutable позволяет лочить в const-методе
                  auto it = acc_.find(who);
                  return it == acc_.end() ? 0 : it->second;
              }
          };
          ```

          ## Deadlock

          ```cpp
          // поток 1: lock(a); lock(b);    поток 2: lock(b); lock(a);  → взаимная блокировка
          std::scoped_lock lk(a.m, b.m);   // ✅ захватывает оба по алгоритму без deadlock
          ```

          Правила: фиксированный порядок захвата; не вызывать чужой код (колбэки) под мьютексом; держать блокировку минимально.

          ## Читатели-писатели

          ```cpp
          std::shared_mutex sm;
          std::string config;
          std::string read()  { std::shared_lock lk(sm); return config; }   // параллельно
          void write(std::string s) { std::unique_lock lk(sm); config = std::move(s); } // эксклюзивно
          ```

          ## ThreadSanitizer

          `g++ -fsanitize=thread -g main.cpp` — находит гонки данных во время выполнения. Обязателен для многопоточного кода.
        practice:
          - type: choice
            q: Что такое data race в C++ с точки зрения стандарта?
            options: ["Просто медленный код", "Неопределённое поведение", "Ошибка компиляции", "Предупреждение"]
            answer: 1
          - type: fill
            q: Захватите мьютекс на область видимости
            code: |
              std::___<std::mutex> lock(m);
            answers: ["lock_guard"]
          - type: choice
            q: Как захватить два мьютекса без риска deadlock?
            options: ["lock_guard дважды в любом порядке", "std::scoped_lock lk(m1, m2)", "m1.try_lock()", "Не захватывать"]
            answer: 1
          - type: bug
            q: Какая строка приводит к риску, что мьютекс останется захваченным навсегда?
            code: |
              void save(const Item& it) {
                  m.lock();
                  storage.push_back(it);
                  m.unlock();
              }
            bugLine: 2
            fix: std::lock_guard lk(m);
            explain: Если push_back бросит исключение (bad_alloc), unlock не вызовется.
          - type: fill
            q: Включите поиск гонок данных
            code: |
              g++ -g -fsanitize=___ main.cpp
            answers: ["thread"]
        homework:
          task: |
            Реализуйте потокобезопасный `ThreadSafeCache<K, V>` на `std::shared_mutex` (get — shared_lock, put — unique_lock, `getOrCompute(key, fn)` — вычисление вне блокировки с повторной проверкой). Нагрузите 8 потоками (90% чтений) и проверьте ThreadSanitizer. Затем смоделируйте deadlock при переводе между двумя счетами и исправьте через scoped_lock.
          checklist:
            - TSan не находит гонок
            - Чтения идут параллельно
            - Deadlock воспроизведён и исправлен
          solution: |
            #include <functional>
            #include <mutex>
            #include <optional>
            #include <shared_mutex>
            #include <unordered_map>

            template <class K, class V>
            class ThreadSafeCache {
                mutable std::shared_mutex m_;
                std::unordered_map<K, V> map_;
            public:
                std::optional<V> get(const K& k) const {
                    std::shared_lock lk(m_);
                    if (auto it = map_.find(k); it != map_.end()) return it->second;
                    return std::nullopt;
                }
                void put(const K& k, V v) { std::unique_lock lk(m_); map_.insert_or_assign(k, std::move(v)); }
                V getOrCompute(const K& k, const std::function<V()>& fn) {
                    if (auto v = get(k)) return *v;
                    V computed = fn();                       // без блокировки — долгая операция
                    std::unique_lock lk(m_);
                    auto [it, inserted] = map_.try_emplace(k, std::move(computed));
                    return it->second;                       // если кто-то успел раньше — берём его значение
                }
            };

            struct Account { std::mutex m; long balance = 0; };
            void transfer(Account& a, Account& b, long sum) {
                std::scoped_lock lk(a.m, b.m);               // было: lock_guard la(a.m); lock_guard lb(b.m); → deadlock
                a.balance -= sum; b.balance += sum;
            }
      - id: cpp-06-03
        title: condition_variable
        minutes: 30
        xp: 45
        theory: |
          `std::condition_variable` позволяет потоку **эффективно ждать** события (без активного опроса в цикле), пока другой поток не сообщит о нём.

          ## Классика: очередь задач producer/consumer

          ```cpp
          #include <condition_variable>
          #include <mutex>
          #include <queue>

          template <typename T>
          class BlockingQueue {
              std::mutex m_;
              std::condition_variable cv_;
              std::queue<T> q_;
              bool closed_ = false;
          public:
              void push(T v) {
                  {
                      std::lock_guard lk(m_);
                      q_.push(std::move(v));
                  }
                  cv_.notify_one();                         // разбудить одного ожидающего
              }

              std::optional<T> pop() {
                  std::unique_lock lk(m_);
                  cv_.wait(lk, [&] { return !q_.empty() || closed_; });   // ждать с предикатом
                  if (q_.empty()) return std::nullopt;      // закрыта и пуста
                  T v = std::move(q_.front());
                  q_.pop();
                  return v;
              }

              void close() {
                  { std::lock_guard lk(m_); closed_ = true; }
                  cv_.notify_all();                         // разбудить всех
              }
          };
          ```

          ## Как работает wait

          1. Требует `std::unique_lock` (захваченный).
          2. Атомарно **отпускает** мьютекс и засыпает.
          3. При пробуждении снова захватывает мьютекс и проверяет предикат; если ложен — спит дальше.

          ## Ложные пробуждения

          Поток может проснуться **без** notify (spurious wakeup). Поэтому всегда используйте версию с предикатом — `wait(lk, pred)` — она сама крутит цикл `while (!pred()) wait(lk);`.

          ## Потерянный сигнал

          Если notify произошёл **до** того, как поток начал ждать, — без предиката сигнал потерян навсегда. Предикат + изменение состояния под мьютексом решают проблему.

          ## Тайм-ауты

          ```cpp
          if (cv_.wait_for(lk, std::chrono::seconds(2), [&] { return ready; })) { /* дождались */ }
          else { /* тайм-аут */ }
          ```

          ## Пул потоков на очереди

          ```cpp
          BlockingQueue<std::function<void()>> tasks;
          std::vector<std::jthread> workers;
          for (int i = 0; i < 4; ++i)
              workers.emplace_back([&] { while (auto t = tasks.pop()) (*t)(); });
          tasks.push([] { std::cout << "задача\n"; });
          tasks.close();    // воркеры доработают очередь и выйдут
          ```

          C++20 добавил более простые примитивы: `std::latch`, `std::barrier`, `std::counting_semaphore`, а также `atomic::wait/notify`.
        practice:
          - type: choice
            q: Зачем wait принимает предикат?
            options: ["Для скорости", "Защита от ложных пробуждений и потерянных сигналов", "Чтобы не нужен был мьютекс", "Это необязательный параметр для логов"]
            answer: 1
          - type: choice
            q: Какой тип блокировки нужен для condition_variable::wait?
            options: ["std::lock_guard", "std::unique_lock", "std::scoped_lock", "Без блокировки"]
            answer: 1
          - type: fill
            q: Разбудите все ожидающие потоки
            code: |
              cv.___();
            answers: ["notify_all"]
          - type: bug
            q: Какая строка может навсегда «усыпить» потребителя?
            code: |
              std::unique_lock lk(m);
              cv.wait(lk);
              auto item = q.front();
              q.pop();
            bugLine: 2
            fix: cv.wait(lk, [&] { return !q.empty(); });
            explain: Без предиката сигнал, отправленный до wait, потеряется; также возможны ложные пробуждения при пустой очереди.
        homework:
          task: |
            Реализуйте `ThreadPool` (N воркеров на `std::jthread`, очередь `std::function<void()>` на mutex + condition_variable) с методом `template<class F> auto submit(F f) -> std::future<decltype(f())>` (через `std::packaged_task`) и корректной остановкой в деструкторе (доработать очередь). Проверьте: 1000 задач, сумма результатов совпадает с ожидаемой.
          checklist:
            - wait с предикатом
            - Деструктор не теряет задачи и не зависает
            - submit возвращает future
          solution: |
            #include <condition_variable>
            #include <functional>
            #include <future>
            #include <iostream>
            #include <memory>
            #include <mutex>
            #include <queue>
            #include <thread>
            #include <vector>

            class ThreadPool {
                std::mutex m_;
                std::condition_variable cv_;
                std::queue<std::function<void()>> q_;
                bool stop_ = false;
                std::vector<std::jthread> workers_;
            public:
                explicit ThreadPool(unsigned n) {
                    for (unsigned i = 0; i < n; ++i)
                        workers_.emplace_back([this] {
                            for (;;) {
                                std::function<void()> task;
                                {
                                    std::unique_lock lk(m_);
                                    cv_.wait(lk, [this] { return stop_ || !q_.empty(); });
                                    if (stop_ && q_.empty()) return;
                                    task = std::move(q_.front()); q_.pop();
                                }
                                task();
                            }
                        });
                }
                template <class F>
                auto submit(F f) -> std::future<decltype(f())> {
                    auto task = std::make_shared<std::packaged_task<decltype(f())()>>(std::move(f));
                    auto fut = task->get_future();
                    { std::lock_guard lk(m_); q_.emplace([task] { (*task)(); }); }
                    cv_.notify_one();
                    return fut;
                }
                ~ThreadPool() {
                    { std::lock_guard lk(m_); stop_ = true; }
                    cv_.notify_all();
                }   // jthread join
            };

            int main() {
                ThreadPool pool(4);
                std::vector<std::future<int>> fs;
                for (int i = 1; i <= 1000; ++i) fs.push_back(pool.submit([i] { return i; }));
                long sum = 0;
                for (auto& f : fs) sum += f.get();
                std::cout << sum << "\n";   // 500500
            }
      - id: cpp-06-04
        title: atomic и модель памяти
        minutes: 35
        xp: 50
        theory: |
          `std::atomic<T>` — переменная, операции над которой **неделимы** и не образуют гонку данных. Без мьютекса.

          ```cpp
          #include <atomic>

          std::atomic<int> counter{0};
          auto inc = [&] { for (int i = 0; i < 100000; ++i) ++counter; };   // ✅ атомарно
          std::jthread a(inc), b(inc);
          // после join: counter == 200000

          counter.fetch_add(5);
          counter.store(10);
          int v = counter.load();
          int old = counter.exchange(0);

          // CAS — основа lock-free алгоритмов
          int expected = 10;
          bool ok = counter.compare_exchange_strong(expected, 20);  // если ==10, записать 20
          ```

          `std::atomic_flag` — простейший флаг, гарантированно lock-free. `is_lock_free()` — проверить, не использует ли реализация скрытый мьютекс.

          ## Модель памяти

          Компилятор и процессор **переставляют** инструкции ради скорости. В одном потоке это незаметно, но другой поток может увидеть записи в другом порядке.

          ```cpp
          int data = 0;
          std::atomic<bool> ready{false};

          // поток 1
          data = 42;
          ready.store(true, std::memory_order_release);   // все записи ДО — видны тому, кто сделает acquire

          // поток 2
          while (!ready.load(std::memory_order_acquire)) {}
          std::cout << data;                              // гарантированно 42
          ```

          ## Порядки памяти

          | Порядок | Гарантия |
          |---|---|
          | `seq_cst` (по умолчанию) | единый глобальный порядок всех атомарных операций; проще всего рассуждать |
          | `acquire` / `release` | синхронизация пары «публикация — чтение» (happens-before) |
          | `acq_rel` | для read-modify-write |
          | `relaxed` | только атомарность, без упорядочивания (счётчики статистики) |

          ```cpp
          std::atomic<long> hits{0};
          hits.fetch_add(1, std::memory_order_relaxed);   // порядок не важен — только итог
          ```

          **Совет:** используйте `seq_cst` (по умолчанию), пока профилировщик не докажет, что это узкое место. Ошибки в слабых порядках крайне трудно найти.

          ## Atomic ≠ потокобезопасный объект

          ```cpp
          std::atomic<int> x{0};
          if (x == 0) x = 1;     // ❌ проверка и запись — две операции, между ними вклинится другой поток
          int zero = 0;
          x.compare_exchange_strong(zero, 1);  // ✅
          ```

          Атомик защищает одну переменную. Для инвариантов между несколькими полями нужен мьютекс.

          ## False sharing

          Два атомика в одной кэш-линии (64 байта), изменяемые разными потоками, заставляют ядра постоянно синхронизировать линию:

          ```cpp
          struct alignas(std::hardware_destructive_interference_size) PaddedCounter { std::atomic<long> v; };
          ```

          `volatile` в C++ **не** для многопоточности (это для памяти устройств).
        practice:
          - type: choice
            q: Что гарантирует std::atomic<int> для операции ++?
