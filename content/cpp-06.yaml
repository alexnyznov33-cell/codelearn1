            answers: ["async"]
          - type: choice
            q: Что произойдёт с исключением внутри задачи std::async?
            options: ["Программа упадёт", "Оно будет переброшено при вызове get()", "Оно потеряется", "Вернётся 0"]
            answer: 1
          - type: choice
