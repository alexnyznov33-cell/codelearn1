        homework:
          task: |
            С SQLite (`Microsoft.Data.Sqlite`) создайте таблицы `accounts(id, owner, balance)` и `transfers(id, from_id, to_id, amount, created_at)`. Напишите класс `BankRepository` с методами `CreateAccountAsync`, `GetBalanceAsync`, `TransferAsync` (в транзакции: проверить баланс, списать, зачислить, записать перевод; при ошибке — rollback). Только параметризованные запросы.
          checklist:
            - Все запросы с параметрами
            - Перевод атомарен
            - Соединения в using
          solution: |
            using Microsoft.Data.Sqlite;

            public class BankRepository(string cs)
            {
                public async Task InitAsync()
                {
                    await using var c = new SqliteConnection(cs); await c.OpenAsync();
                    var cmd = c.CreateCommand();
                    cmd.CommandText = """
                        CREATE TABLE IF NOT EXISTS accounts(id INTEGER PRIMARY KEY, owner TEXT NOT NULL, balance REAL NOT NULL);
                        CREATE TABLE IF NOT EXISTS transfers(id INTEGER PRIMARY KEY, from_id INT, to_id INT, amount REAL, created_at TEXT);
                        """;
                    await cmd.ExecuteNonQueryAsync();
                }

                public async Task TransferAsync(long from, long to, double amount)
                {
                    await using var c = new SqliteConnection(cs); await c.OpenAsync();
                    await using var tx = (SqliteTransaction)await c.BeginTransactionAsync();
                    try
                    {
                        var check = c.CreateCommand(); check.Transaction = tx;
                        check.CommandText = "SELECT balance FROM accounts WHERE id = $id";
                        check.Parameters.AddWithValue("$id", from);
                        var bal = (double)(await check.ExecuteScalarAsync() ?? throw new InvalidOperationException("Нет счёта"));
                        if (bal < amount) throw new InvalidOperationException("Недостаточно средств");

                        var upd = c.CreateCommand(); upd.Transaction = tx;
                        upd.CommandText = """
                            UPDATE accounts SET balance = balance - $a WHERE id = $f;
                            UPDATE accounts SET balance = balance + $a WHERE id = $t;
                            INSERT INTO transfers(from_id, to_id, amount, created_at) VALUES ($f, $t, $a, datetime('now'));
                            """;
                        upd.Parameters.AddWithValue("$a", amount);
                        upd.Parameters.AddWithValue("$f", from);
                        upd.Parameters.AddWithValue("$t", to);
                        await upd.ExecuteNonQueryAsync();
                        await tx.CommitAsync();
                    }
                    catch { await tx.RollbackAsync(); throw; }
                }
            }
      - id: cs-08-02
        title: EF Core модели и контекст
        minutes: 35
        xp: 40
        theory: |
          **Entity Framework Core** — ORM: вы работаете с C#-объектами, а EF генерирует SQL.

          ```bash
          dotnet add package Microsoft.EntityFrameworkCore.Sqlite   # или .SqlServer / Npgsql.EntityFrameworkCore.PostgreSQL
          dotnet add package Microsoft.EntityFrameworkCore.Design
          ```

          ## Сущности

          ```csharp
          public class Product
          {
              public int Id { get; set; }                  // по соглашению — первичный ключ
              public required string Name { get; set; }
              public decimal Price { get; set; }
              public int CategoryId { get; set; }          // внешний ключ
              public Category Category { get; set; } = null!; // навигационное свойство
          }

          public class Category
          {
              public int Id { get; set; }
              public required string Title { get; set; }
              public List<Product> Products { get; set; } = [];
          }
          ```

          ## DbContext

          ```csharp
          public class ShopContext(DbContextOptions<ShopContext> options) : DbContext(options)
          {
              public DbSet<Product> Products => Set<Product>();
              public DbSet<Category> Categories => Set<Category>();

              protected override void OnModelCreating(ModelBuilder b)
              {
                  b.Entity<Product>(e =>
                  {
                      e.Property(p => p.Name).HasMaxLength(200).IsRequired();
                      e.Property(p => p.Price).HasPrecision(10, 2);
                      e.HasIndex(p => p.Name);
                  });
              }
          }

          // регистрация в ASP.NET Core
          builder.Services.AddDbContext<ShopContext>(o => o.UseSqlite("Data Source=shop.db"));
          ```

          ## CRUD

          ```csharp
          db.Products.Add(new Product { Name = "Чай", Price = 150, CategoryId = 1 });
          await db.SaveChangesAsync();                      // INSERT

          var cheap = await db.Products
              .Where(p => p.Price < 500)
              .OrderBy(p => p.Name)
              .Select(p => new { p.Name, p.Price })          // проекция — выбираются только нужные колонки
              .ToListAsync();

          var p = await db.Products.FindAsync(1);           // по ключу
          p!.Price = 200;
          await db.SaveChangesAsync();                      // UPDATE только изменённых полей

          db.Products.Remove(p);
          await db.SaveChangesAsync();                      // DELETE

          await db.Products.Where(x => x.Price == 0).ExecuteDeleteAsync();     // массово, без загрузки (EF 7+)
          await db.Products.ExecuteUpdateAsync(s => s.SetProperty(x => x.Price, x => x.Price * 1.1m));
          ```

          LINQ-запрос к `DbSet` — это `IQueryable`: он транслируется в SQL и выполняется только при `ToListAsync`, `FirstAsync`, `CountAsync` и т.д.

          `DbContext` — **не потокобезопасен** и рассчитан на короткую жизнь (одна единица работы/запрос). В ASP.NET Core он Scoped.

          > 💡 Логируйте SQL: `o.UseSqlite(...).LogTo(Console.WriteLine, LogLevel.Information)`.
