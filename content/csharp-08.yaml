      - id: cs-08-05
        title: Dapper
        minutes: 25
        xp: 35
        theory: |
          **Dapper** — микро-ORM от Stack Overflow: вы пишете SQL сами, а Dapper быстро превращает строки в объекты. Почти так же быстро, как ручной ADO.NET, и гораздо удобнее.

          ```bash
          dotnet add package Dapper
          ```

          ```csharp
          using Dapper;

          await using var conn = new NpgsqlConnection(cs);

          // множество строк → объекты (сопоставление по именам колонок)
          var products = await conn.QueryAsync<Product>(
              "SELECT id, name, price FROM products WHERE price > @Min ORDER BY price",
              new { Min = 100 });

          // одна строка
          var p = await conn.QuerySingleOrDefaultAsync<Product>(
              "SELECT * FROM products WHERE id = @id", new { id });

          // скаляр
          int count = await conn.ExecuteScalarAsync<int>("SELECT COUNT(*) FROM products");

          // изменения
          int rows = await conn.ExecuteAsync(
              "UPDATE products SET price = @Price WHERE id = @Id", product);

          // пакетная вставка: Dapper выполнит команду для каждого элемента
          await conn.ExecuteAsync("INSERT INTO tags(name) VALUES (@Name)", tags);

          // IN-список
          var some = await conn.QueryAsync<Product>("SELECT * FROM products WHERE id = ANY(@ids)", new { ids = new[] { 1, 2, 3 } });
          ```

          Параметры через анонимный объект — защита от SQL-инъекций.

          ## Multi-mapping (JOIN)

          ```csharp
          var sql = "SELECT p.*, c.* FROM products p JOIN categories c ON c.id = p.category_id";
          var list = await conn.QueryAsync<Product, Category, Product>(sql,
              (p, c) => { p.Category = c; return p; },
              splitOn: "id");
          ```

          ## Несколько результатов

          ```csharp
          using var multi = await conn.QueryMultipleAsync("SELECT * FROM a; SELECT * FROM b;");
          var a = await multi.ReadAsync<A>();
          var b = await multi.ReadAsync<B>();
          ```

          ## EF Core или Dapper?

          | | EF Core | Dapper |
          |---|---|---|
          | SQL | генерируется | пишете сами |
          | Миграции, change tracking | есть | нет |
          | Сложные отчёты | неудобно | отлично |
          | Скорость | хорошая | максимальная |

          Частый подход: **EF Core для команд** (создание/изменение с бизнес-правилами), **Dapper для сложных чтений и отчётов** (CQRS-стиль). Также EF Core умеет `db.Database.SqlQuery<T>($"...")`.
        practice:
