        homework:
          task: |
            Модель «Курсы»: Student *–* Course, Course 1–* Lesson, Student 1–1 Profile. Напишите запросы: (1) курсы с уроками и студентами (Include + AsSplitQuery), (2) топ-3 курса по числу студентов (проекция), (3) список студентов без курсов, (4) изменение email студента с оптимистической блокировкой (RowVersion) и обработкой DbUpdateConcurrencyException. Включите логирование SQL и убедитесь, что нет N+1.
          checklist:
            - Many-to-many без явной связующей сущности
            - Чтение через AsNoTracking
            - Обработан конфликт конкурентности
          solution: |
            var full = await db.Courses.AsNoTracking()
                .Include(c => c.Lessons).Include(c => c.Students)
                .AsSplitQuery().ToListAsync();

            var top = await db.Courses.AsNoTracking()
                .OrderByDescending(c => c.Students.Count)
                .Select(c => new { c.Title, Students = c.Students.Count })
                .Take(3).ToListAsync();

            var lonely = await db.Students.AsNoTracking().Where(s => !s.Courses.Any()).ToListAsync();

            var st = await db.Students.FirstAsync(s => s.Id == id);
            st.Email = newEmail;
            try { await db.SaveChangesAsync(); }
            catch (DbUpdateConcurrencyException ex)
            {
                var entry = ex.Entries.Single();
                var dbValues = await entry.GetDatabaseValuesAsync();
                Console.WriteLine($"Кто-то уже изменил запись: {dbValues?["Email"]}");
            }

