        homework:
          task: |
            Для БД «Магазин» напишите `ReportRepository` на Dapper: (1) выручка по дням за период, (2) топ-10 товаров с категорией (multi-mapping), (3) карточка заказа с позициями (QueryMultiple), (4) массовая вставка 1000 позиций в транзакции. Сравните время отчёта (1) с аналогом на EF Core.
          checklist:
            - Все параметры через объекты
            - Multi-mapping с splitOn
            - Вставка в одной транзакции
          solution: |
            public class ReportRepository(string cs)
            {
                public async Task<IEnumerable<(DateTime Day, decimal Revenue)>> RevenueAsync(DateTime from, DateTime to)
                {
                    await using var c = new NpgsqlConnection(cs);
                    return await c.QueryAsync<(DateTime, decimal)>(
                        "SELECT date_trunc('day', created_at), SUM(total) FROM orders WHERE created_at BETWEEN @from AND @to GROUP BY 1 ORDER BY 1",
                        new { from, to });
                }

                public async Task<IEnumerable<Product>> TopAsync()
                {
                    await using var c = new NpgsqlConnection(cs);
                    return await c.QueryAsync<Product, Category, Product>("""
                        SELECT p.id, p.name, p.sold, c.id, c.title
                        FROM products p JOIN categories c ON c.id = p.category_id
                        ORDER BY p.sold DESC LIMIT 10
                        """, (p, cat) => { p.Category = cat; return p; }, splitOn: "id");
                }

                public async Task<(Order, IEnumerable<OrderItem>)> OrderAsync(int id)
                {
                    await using var c = new NpgsqlConnection(cs);
                    using var m = await c.QueryMultipleAsync(
                        "SELECT * FROM orders WHERE id = @id; SELECT * FROM order_items WHERE order_id = @id", new { id });
                    return (await m.ReadSingleAsync<Order>(), await m.ReadAsync<OrderItem>());
                }

                public async Task BulkAsync(IEnumerable<OrderItem> items)
                {
                    await using var c = new NpgsqlConnection(cs); await c.OpenAsync();
                    await using var tx = await c.BeginTransactionAsync();
                    await c.ExecuteAsync("INSERT INTO order_items(order_id, product_id, qty) VALUES (@OrderId, @ProductId, @Qty)", items, tx);
                    await tx.CommitAsync();
                }
            }
