    lessons:
      - id: cs-08-01
        title: SQL и ADO.NET
        minutes: 35
        xp: 40
        theory: |
          ## Минимум SQL, который нужен всегда

          ```sql
          CREATE TABLE products (
              id     SERIAL PRIMARY KEY,
              name   VARCHAR(100) NOT NULL,
              price  NUMERIC(10,2) NOT NULL CHECK (price >= 0),
              cat_id INT REFERENCES categories(id)
          );

          INSERT INTO products (name, price, cat_id) VALUES ('Чай', 150, 1);
          SELECT p.name, c.title FROM products p JOIN categories c ON c.id = p.cat_id WHERE p.price > 100 ORDER BY p.price DESC;
          SELECT cat_id, COUNT(*), AVG(price) FROM products GROUP BY cat_id HAVING COUNT(*) > 2;
          UPDATE products SET price = price * 1.1 WHERE cat_id = 1;
          DELETE FROM products WHERE id = 7;
          CREATE INDEX ix_products_cat ON products(cat_id);
          ```

          ## ADO.NET — низкоуровневый доступ

          Провайдеры: `Microsoft.Data.SqlClient` (SQL Server), `Npgsql` (PostgreSQL), `Microsoft.Data.Sqlite`.

          ```csharp
          await using var conn = new NpgsqlConnection(connectionString);
          await conn.OpenAsync();

          await using var cmd = new NpgsqlCommand(
              "SELECT id, name, price FROM products WHERE price > @min", conn);
          cmd.Parameters.AddWithValue("min", 100m);

          await using var reader = await cmd.ExecuteReaderAsync();
          while (await reader.ReadAsync())
          {
              int id = reader.GetInt32(0);
              string name = reader.GetString(1);
              decimal price = reader.GetDecimal(2);
              Console.WriteLine($"{id} {name} {price}");
          }
          ```

          - `ExecuteReaderAsync` — выборка строк; `ExecuteNonQueryAsync` — INSERT/UPDATE/DELETE (вернёт число строк); `ExecuteScalarAsync` — одно значение.
          - Соединения берутся из **пула** — открывайте поздно, закрывайте рано (`using`).

          ## SQL-инъекции

          ```csharp
          // ❌ НИКОГДА
          var sql = $"SELECT * FROM users WHERE login = '{login}'";   // login = "' OR 1=1 --"
          // ✅ параметры
          cmd.CommandText = "SELECT * FROM users WHERE login = @login";
          cmd.Parameters.AddWithValue("login", login);
          ```

          ## Транзакции

          ```csharp
          await using var tx = await conn.BeginTransactionAsync();
          try
          {
              await Exec(conn, tx, "UPDATE accounts SET balance = balance - 100 WHERE id = 1");
              await Exec(conn, tx, "UPDATE accounts SET balance = balance + 100 WHERE id = 2");
              await tx.CommitAsync();
          }
          catch { await tx.RollbackAsync(); throw; }
          ```

          ACID: атомарность, согласованность, изолированность, долговечность. Уровни изоляции: Read Committed (по умолчанию), Repeatable Read, Serializable.

          Строку подключения храните в конфигурации/секретах, не в коде.
