        homework:
          task: |
            Создайте консольное приложение «Библиотека» на EF Core + SQLite: сущности `Author`, `Book` (Title, Year, AuthorId), `DbContext` с Fluent API (max length, индекс по Title). Реализуйте: добавление автора с книгами, поиск книг по части названия, список авторов с количеством книг (проекция), массовое удаление книг старше 1900 года через ExecuteDelete.
          checklist:
            - Конфигурация в OnModelCreating
            - Используются async-методы EF
            - Проекция через Select
          solution: |
            using Microsoft.EntityFrameworkCore;

            await using var db = new LibContext();
            await db.Database.EnsureCreatedAsync();

            db.Authors.Add(new Author { Name = "Толстой", Books = [new() { Title = "Война и мир", Year = 1869 }, new() { Title = "Анна Каренина", Year = 1878 }] });
            await db.SaveChangesAsync();

            var found = await db.Books.Where(b => b.Title.Contains("мир")).ToListAsync();
            var stats = await db.Authors.Select(a => new { a.Name, Count = a.Books.Count }).ToListAsync();
            stats.ForEach(s => Console.WriteLine($"{s.Name}: {s.Count}"));
            await db.Books.Where(b => b.Year < 1900).ExecuteDeleteAsync();

            public class Author { public int Id { get; set; } public required string Name { get; set; } public List<Book> Books { get; set; } = []; }
            public class Book { public int Id { get; set; } public required string Title { get; set; } public int Year { get; set; } public int AuthorId { get; set; } public Author Author { get; set; } = null!; }

            public class LibContext : DbContext
            {
                public DbSet<Author> Authors => Set<Author>();
                public DbSet<Book> Books => Set<Book>();
                protected override void OnConfiguring(DbContextOptionsBuilder o) => o.UseSqlite("Data Source=lib.db");
                protected override void OnModelCreating(ModelBuilder b)
                {
                    b.Entity<Book>().Property(x => x.Title).HasMaxLength(300);
                    b.Entity<Book>().HasIndex(x => x.Title);
                    b.Entity<Author>().Property(x => x.Name).HasMaxLength(150);
                }
            }
      - id: cs-08-03
        title: Миграции EF Core
        minutes: 25
        xp: 35
        theory: |
          Схема БД должна меняться вместе с кодом — версионированно и воспроизводимо. **Миграции** EF Core — это C#-файлы с описанием изменений схемы, которые хранятся в Git.

          ## Инструмент

          ```bash
          dotnet tool install --global dotnet-ef
          dotnet add package Microsoft.EntityFrameworkCore.Design
          ```

          ## Основной цикл

          ```bash
          dotnet ef migrations add InitialCreate      # создать миграцию по разнице модели и снапшота
          dotnet ef database update                   # применить все неприменённые
          # поменяли модель (добавили свойство Product.Sku)
          dotnet ef migrations add AddProductSku
          dotnet ef database update
          dotnet ef migrations remove                 # удалить последнюю НЕприменённую
          dotnet ef database update AddProductSku     # откатиться/накатиться до конкретной
          dotnet ef migrations script --idempotent -o migrate.sql   # SQL-скрипт для прода
          ```

          ## Что внутри

          ```csharp
          public partial class AddProductSku : Migration
          {
              protected override void Up(MigrationBuilder mb)
              {
                  mb.AddColumn<string>("Sku", "Products", maxLength: 50, nullable: false, defaultValue: "");
                  mb.CreateIndex("IX_Products_Sku", "Products", "Sku", unique: true);
              }
              protected override void Down(MigrationBuilder mb)
              {
                  mb.DropIndex("IX_Products_Sku", "Products");
                  mb.DropColumn("Sku", "Products");
              }
          }
          ```

          Рядом лежит `ShopContextModelSnapshot.cs` — текущее состояние модели. В БД таблица `__EFMigrationsHistory` хранит список применённых миграций.

          ## Данные в миграциях

          ```csharp
          mb.Sql("UPDATE Products SET Sku = 'SKU-' || Id");     // произвольный SQL
          ```

          Начальные данные: `modelBuilder.Entity<Category>().HasData(new Category { Id = 1, Title = "Еда" });`

          ## Практика в команде

          - Одна миграция = одно логическое изменение, понятное имя.
          - **Проверяйте** сгенерированный код: переименование свойства EF может понять как drop + add column (потеря данных!) — замените на `RenameColumn`.
          - Не редактируйте уже применённые на проде миграции — создавайте новую.
          - В проде применяйте скриптом в CI/CD или `migration bundle` (`dotnet ef migrations bundle`), а не `Database.Migrate()` при старте нескольких инстансов.
          - `EnsureCreated()` несовместим с миграциями — только для прототипов и тестов.
