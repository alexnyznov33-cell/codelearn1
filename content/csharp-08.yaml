      - id: cs-08-04
        title: Связи, Include, отслеживание
        minutes: 35
        xp: 40
        theory: |
          ## Связи

          ```csharp
          // один-ко-многим: Category 1 — * Product (по навигации и FK)
          // один-к-одному
          b.Entity<User>().HasOne(u => u.Profile).WithOne(p => p.User).HasForeignKey<Profile>(p => p.UserId);
          // многие-ко-многим (EF 5+): таблица-связка создаётся сама
          public class Student { public int Id { get; set; } public List<Course> Courses { get; set; } = []; }
          public class Course  { public int Id { get; set; } public List<Student> Students { get; set; } = []; }
          // поведение удаления
          b.Entity<Product>().HasOne(p => p.Category).WithMany(c => c.Products).OnDelete(DeleteBehavior.Restrict);
          ```

          ## Загрузка связанных данных

          По умолчанию навигационные свойства **не загружаются** (будут `null` / пустыми).

          ```csharp
          // Eager loading — JOIN
          var cats = await db.Categories
              .Include(c => c.Products.Where(p => p.Price > 0))   // filtered include
              .ThenInclude(p => p.Reviews)
              .ToListAsync();

          // Проекция — часто лучше Include: только нужные поля
          var dto = await db.Categories.Select(c => new { c.Title, Count = c.Products.Count }).ToListAsync();

          // Explicit loading
          await db.Entry(cat).Collection(c => c.Products).LoadAsync();
          ```

          Много `Include` коллекций → «картезианский взрыв» (строки перемножаются). Решение: `.AsSplitQuery()`.

          ## Проблема N+1

          ```csharp
          // ❌ 1 запрос за категории + N запросов за товары (при lazy loading)
          foreach (var c in db.Categories.ToList())
              Console.WriteLine(c.Products.Count);
          // ✅ один запрос
          var data = db.Categories.Select(c => new { c.Title, c.Products.Count }).ToList();
          ```

          Lazy loading (`UseLazyLoadingProxies`) удобен, но легко порождает N+1 — в вебе обычно выключен.

          ## Change Tracker

          `DbContext` запоминает загруженные сущности и их исходные значения. При `SaveChanges` сравнивает и генерирует UPDATE только для изменённого.

          ```csharp
          var p = await db.Products.FirstAsync();
          Console.WriteLine(db.Entry(p).State);  // Unchanged
          p.Price = 10;
          Console.WriteLine(db.Entry(p).State);  // Modified
          ```

          Состояния: `Added`, `Unchanged`, `Modified`, `Deleted`, `Detached`.

          Для **чтения** отслеживание не нужно и стоит памяти/времени:

          ```csharp
          var list = await db.Products.AsNoTracking().ToListAsync();
          ```

          Обновление «отсоединённой» сущности (пришла из API): `db.Update(entity)` пометит все поля Modified; лучше загрузить сущность и изменить нужные поля.

          ## Конкурентность

          `[Timestamp] public byte[] RowVersion { get; set; }` (или `IsConcurrencyToken`) — оптимистическая блокировка: при одновременном изменении будет `DbUpdateConcurrencyException`.
