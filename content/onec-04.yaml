id: onec
modules:
  - id: 1c-m4
    title: Управляемые формы
    level: Junior
    lessons:
      - id: 1c-04-01
        title: Клиент-серверная архитектура и директивы
        minutes: 40
        xp: 40
        theory: |
          Платформа 1С:Предприятие 8.3 работает в **клиент-серверной** архитектуре: интерфейс выполняется на **клиенте** (тонкий клиент, веб-клиент, мобильный клиент), а работа с базой данных — на **сервере**. Код формы явно указывает, где выполняется каждая процедура, с помощью **директив компиляции**.

          | Директива | Где выполняется | Доступ к данным формы | Доступ к БД |
          |---|---|---|---|
          | `&НаКлиенте` | клиент | да | нет |
          | `&НаСервере` | сервер, с передачей формы | да | да |
          | `&НаСервереБезКонтекста` | сервер, без формы | нет (только параметры) | да |
          | `&НаКлиентеНаСервереБезКонтекста` | и там, и там | нет | нет |

          ```bsl
          &НаКлиенте
          Процедура ЗаполнитьЦены(Команда)
              ЗаполнитьЦеныНаСервере();             // серверный вызов
              ПоказатьОповещениеПользователя("Цены заполнены");
          КонецПроцедуры

          &НаСервере
          Процедура ЗаполнитьЦеныНаСервере()
              Для Каждого Стр Из Объект.Товары Цикл
                  Стр.Цена = ЦенообразованиеСервер.ЦенаНаДату(Стр.Номенклатура, Объект.Дата);
              КонецЦикла;
          КонецПроцедуры

          &НаСервереБезКонтекста
          Функция ОстатокТовара(Номенклатура, Склад)
              // только переданные параметры, форма на сервер не передаётся — быстрее
              Возврат РегистрыНакопления.ТоварыНаСкладах.Остатки(, Новый Структура("Номенклатура, Склад", Номенклатура, Склад))...;
          КонецФункции
          ```

          ## Что доступно на клиенте

          На клиенте **нет** доступа к базе: нельзя выполнять запросы, обращаться к реквизитам ссылок через точку (`Товар.Артикул`), создавать `ТаблицаЗначений`, `Запрос`, объекты справочников. Доступны: данные формы, примитивные типы, ссылки (как значения), `Массив`, `Структура`, `Соответствие`, `СписокЗначений`.

          ## Серверный вызов — дорогая операция

          Каждый вызов с клиента на сервер — это сетевой обмен. При `&НаСервере` на сервер передаются **все данные формы** туда и обратно. Поэтому:
          - объединяйте несколько действий в один серверный вызов;
          - если форма не нужна — используйте `&НаСервереБезКонтекста`;
          - не вызывайте сервер в цикле на клиенте;
          - получайте все нужные данные одним вызовом в структуре.

          ## Общие модули

          Логику выносят в **общие модули** с флагами: *Сервер*, *Клиент*, *Вызов сервера* (можно вызывать с клиента), *Привилегированный*, *Повторное использование возвращаемых значений* (кеш). Соглашение об именах: `РаботаСТоварамиСервер`, `РаботаСТоварамиКлиент`, `РаботаСТоварамиВызовСервера`, `РаботаСТоварамиКлиентСервер`.

          Модули объектов и менеджеров выполняются на сервере. Код в модулях общего назначения можно ограничить инструкциями препроцессора `#Если Сервер Тогда ... #КонецЕсли`.
        practice:
          - type: choice
            q: Какая директива позволяет обращаться к базе данных, но не передаёт форму на сервер?
            options: ["&НаКлиенте", "&НаСервере", "&НаСервереБезКонтекста", "&НаКлиентеНаСервереБезКонтекста"]
            answer: 2
          - type: bug
            q: Где ошибка?
            code: |
              &НаКлиенте
              Процедура НоменклатураПриИзменении(Элемент)
                  Объект.Артикул = Объект.Номенклатура.Артикул;
              КонецПроцедуры
            bugLine: 3
            fix: получить артикул серверной функцией &НаСервереБезКонтекста
            explain: На клиенте нельзя читать реквизиты ссылки через точку — это обращение к базе данных.
          - type: choice
            q: Можно ли на клиенте создать объект Запрос?
            options: ["Да", "Нет, запросы выполняются только на сервере", "Только в веб-клиенте", "Только в файловом режиме"]
            answer: 1
          - type: fill
            q: Объявите серверную функцию без контекста формы
            code: |
              &___
              Функция ЦенаТовара(Товар)
            answers: ["НаСервереБезКонтекста"]
          - type: choice
            q: Какой флаг общего модуля разрешает вызывать его серверные функции с клиента?
            options: ["Привилегированный", "Вызов сервера", "Глобальный", "Клиент (управляемое приложение)"]
            answer: 1
        homework:
          task: |
            В форме документа `РеализацияТоваров` при изменении номенклатуры в строке нужно подставить цену и единицу измерения, а при изменении склада — показать доступный остаток. Реализуйте это так, чтобы был ровно **один** серверный вызов без контекста на каждое изменение: функция возвращает структуру (Цена, ЕдиницаИзмерения, Остаток). Вынесите расчёты в общий модуль `ПродажиВызовСервера`. Объясните в комментариях, почему выбраны именно эти директивы.
          checklist:
            - Нет обращений к реквизитам ссылок на клиенте
            - Один серверный вызов на действие
            - Используется &НаСервереБезКонтекста или общий модуль с вызовом сервера
          solution: |
            // Общий модуль ПродажиВызовСервера (Сервер, Вызов сервера)
            Функция ДанныеНоменклатуры(Номенклатура, Склад, Дата) Экспорт
                Результат = Новый Структура("Цена, ЕдиницаИзмерения, Остаток", 0, Неопределено, 0);
                Если НЕ ЗначениеЗаполнено(Номенклатура) Тогда
                    Возврат Результат;
                КонецЕсли;
                Результат.ЕдиницаИзмерения = Номенклатура.ЕдиницаИзмерения;   // на сервере — можно
                Результат.Цена = РегистрыСведений.ЦеныНоменклатуры.ПолучитьПоследнее(Дата,
                    Новый Структура("Номенклатура, ВидЦены", Номенклатура, Справочники.ВидыЦен.Розничная)).Цена;
                Запрос = Новый Запрос(
                "ВЫБРАТЬ ЕСТЬNULL(СУММА(Ост.КоличествоОстаток), 0) КАК Остаток
                |ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(, Номенклатура = &Номенклатура И Склад = &Склад) КАК Ост");
                Запрос.УстановитьПараметр("Номенклатура", Номенклатура);
                Запрос.УстановитьПараметр("Склад", Склад);
                Выборка = Запрос.Выполнить().Выбрать();
                Если Выборка.Следующий() Тогда
                    Результат.Остаток = Выборка.Остаток;
                КонецЕсли;
                Возврат Результат;
            КонецФункции

            // Модуль формы документа
            &НаКлиенте
            Процедура ТоварыНоменклатураПриИзменении(Элемент)
                Строка = Элементы.Товары.ТекущиеДанные;
                // Один вызов: форма не нужна — передаём только параметры
                Данные = ПродажиВызовСервера.ДанныеНоменклатуры(Строка.Номенклатура, Объект.Склад, Объект.Дата);
                Строка.Цена = Данные.Цена;
                Строка.ЕдиницаИзмерения = Данные.ЕдиницаИзмерения;
                Строка.Сумма = Строка.Количество * Строка.Цена;
                Если Данные.Остаток < Строка.Количество Тогда
                    ПоказатьПредупреждение(, "Доступно только " + Данные.Остаток);
                КонецЕсли;
            КонецПроцедуры
      - id: 1c-04-02
        title: Реквизиты и элементы формы
        minutes: 35
        xp: 35
        theory: |
          Управляемая форма описывается **декларативно** и состоит из трёх частей:

          1. **Реквизиты формы** — данные: основной реквизит `Объект` (данные документа/элемента) и дополнительные (`ТекущийОстаток`, `ПоказыватьАрхив`, таблица `Подбор`).
          2. **Элементы формы** — то, что видит пользователь: поля ввода, флажки, таблицы, группы, кнопки, декорации. Элемент связан с реквизитом через **ПутьКДанным**.
          3. **Команды** — действия (кнопки, пункты меню), связанные с процедурами-обработчиками.

          Платформа сама строит интерфейс по описанию — форма корректно выглядит и в тонком клиенте, и в веб-клиенте, и на мобильном.

          ## Обращение из кода

          ```bsl
          &НаКлиенте
          Процедура ПоказыватьСкидкуПриИзменении(Элемент)
              Элементы.Скидка.Видимость = ПоказыватьСкидку;         // реквизит формы — просто имя
              Элементы.Скидка.ТолькоПросмотр = НЕ ПравоИзменятьСкидку;
              Элементы.Комментарий.Заголовок = "Примечание";
          КонецПроцедуры

          &НаСервере
          Процедура ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)
              Объект.Склад = Константы.ОсновнойСклад.Получить();     // данные объекта — через Объект
              Элементы.ГруппаДоставка.Видимость = ПолучитьФункциональнуюОпцию("ИспользоватьДоставку");
          КонецПроцедуры
          ```

          ## Типы данных формы

          На форме объекты прикладных типов превращаются в **данные формы**: документ — `ДанныеФормыСтруктура`, табличная часть — `ДанныеФормыКоллекция`, дерево — `ДанныеФормыДерево`. Преобразование на сервере:

          ```bsl
          &НаСервере
          Процедура ЗаполнитьНаСервере()
              ДокументОбъект = РеквизитФормыВЗначение("Объект");      // в настоящий объект
              ДокументОбъект.ЗаполнитьПоОстаткам();                   // метод модуля объекта
              ЗначениеВРеквизитФормы(ДокументОбъект, "Объект");       // обратно на форму
          КонецПроцедуры
          ```

          То же для таблиц: `ЗначениеВРеквизитФормы(ТаблицаЗначений, "Подбор")`, `РеквизитФормыВЗначение("Подбор")`.

          ## Условное оформление

          Вместо кода, раскрашивающего строки, используйте **условное оформление** формы: «если `Количество` = 0, то цвет текста серый» — работает быстро и на клиенте.

          ## Полезные свойства элементов

          `Видимость`, `Доступность`, `ТолькоПросмотр`, `АвтоОтметкаНезаполненного`, `ПодсказкаВвода`, `КнопкаВыбора`, `СписокВыбора`, `ПараметрыВыбора` (фильтр при выборе, например только товары, не услуги), `СвязиПараметровВыбора` (договор — только выбранного контрагента).

          ## Динамический список

          Формы списков используют реквизит **ДинамическийСписок** — он читает данные из базы порциями, по мере прокрутки, на основе запроса. Отбор: `ОбщегоНазначенияКлиентСервер.УстановитьЭлементОтбораДинамическогоСписка(...)` или `Список.Параметры.УстановитьЗначениеПараметра("Склад", Склад)`.
        practice:
          - type: choice
            q: Как называется основной реквизит формы документа?
            options: ["ЭтотОбъект", "Объект", "Документ", "Форма"]
            answer: 1
          - type: fill
            q: Скройте элемент формы
            code: |
              Элементы.ДатаДоставки.___ = Ложь;
            answers: ["Видимость"]
          - type: fill
            q: Получите прикладной объект из основного реквизита формы
            code: |
              ДокОбъект = ___("Объект");
            answers: ["РеквизитФормыВЗначение"]
          - type: choice
            q: Нужно, чтобы в поле «Договор» выбирались только договоры выбранного контрагента. Какое свойство элемента настроить?
            options: ["СписокВыбора", "СвязиПараметровВыбора", "Видимость", "ПодсказкаВвода"]
            answer: 1
          - type: choice
            q: Как лучше подсветить строки с нулевым остатком?
            options: ["Перебирать строки в ПриАктивизацииСтроки", "Условное оформление формы", "Пересоздавать форму", "Через Сообщить"]
            answer: 1
        homework:
          task: |
            Создайте форму документа `ЗаказКлиента`: шапка в две колонки (группы), поля Контрагент, Договор (с СвязиПараметровВыбора по контрагенту), Склад, Статус; флажок «Доставка» (реквизит формы), при включении которого появляется группа «Адрес и дата доставки»; поле «Комментарий» многострочное внизу; условное оформление: статус «Отменён» — вся форма с красным заголовком (или поле статуса красным). В `ПриСозданииНаСервере` заполните склад по умолчанию для нового документа.
          checklist:
            - Используются группы и связи параметров выбора
            - Видимость меняется по флажку
            - Есть условное оформление
          solution: |
            &НаСервере
            Процедура ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)
                Если Параметры.Ключ.Пустая() Тогда
                    Объект.Склад = Константы.ОсновнойСклад.Получить();
                    Объект.Статус = Перечисления.СтатусыЗаказов.Новый;
                КонецЕсли;
                Доставка = ЗначениеЗаполнено(Объект.АдресДоставки);
                НастроитьУсловноеОформление();
                ОбновитьВидимость(Элементы, Доставка);
            КонецПроцедуры

            &НаКлиенте
            Процедура ДоставкаПриИзменении(Элемент)
                ОбновитьВидимость(Элементы, Доставка);
                Если НЕ Доставка Тогда
                    Объект.АдресДоставки = "";
                    Объект.ДатаДоставки = Дата(1, 1, 1);
                КонецЕсли;
            КонецПроцедуры

            &НаКлиентеНаСервереБезКонтекста
            Процедура ОбновитьВидимость(Элементы, Доставка)
                Элементы.ГруппаДоставка.Видимость = Доставка;
            КонецПроцедуры

            &НаСервере
            Процедура НастроитьУсловноеОформление()
                Элемент = УсловноеОформление.Элементы.Добавить();
                Поле = Элемент.Поля.Элементы.Добавить();
                Поле.Поле = Новый ПолеКомпоновкиДанных(Элементы.Статус.Имя);
                Отбор = Элемент.Отбор.Элементы.Добавить(Тип("ЭлементОтбораКомпоновкиДанных"));
                Отбор.ЛевоеЗначение = Новый ПолеКомпоновкиДанных("Объект.Статус");
                Отбор.ВидСравнения = ВидСравненияКомпоновкиДанных.Равно;
                Отбор.ПравоеЗначение = Перечисления.СтатусыЗаказов.Отменён;
                Элемент.Оформление.УстановитьЗначениеПараметра("ЦветТекста", WebЦвета.Красный);
            КонецПроцедуры

            // Элемент Договор: СвязиПараметровВыбора = "Отбор.Владелец" → "Объект.Контрагент"
      - id: 1c-04-03
        title: События формы и элементов
        minutes: 35
        xp: 35
        theory: |
          Форма реагирует на действия пользователя через **события**. Обработчики создаются в конфигураторе (палитра свойств → События) и пишутся в модуле формы.

          ## Основные события формы

          | Событие | Где | Когда |
          |---|---|---|
          | `ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)` | сервер | создание формы: заполнение, настройка видимости, параметры |
          | `ПриОткрытии(Отказ)` | клиент | форма открывается |
          | `ПриЧтенииНаСервере(ТекущийОбъект)` | сервер | прочитан существующий объект |
          | `ПередЗаписью(Отказ, ПараметрыЗаписи)` | клиент | перед записью (подтверждения) |
          | `ПередЗаписьюНаСервере(Отказ, ТекущийОбъект, ПараметрыЗаписи)` | сервер | перенос данных реквизитов формы в объект |
          | `ПослеЗаписиНаСервере(ТекущийОбъект, ПараметрыЗаписи)` | сервер | после записи |
          | `ПослеЗаписи(ПараметрыЗаписи)` | клиент | оповещения других форм |
          | `ОбработкаОповещения(ИмяСобытия, Параметр, Источник)` | клиент | получено оповещение |
          | `ПередЗакрытием(Отказ, ЗавершениеРаботы, ТекстПредупреждения, СтандартнаяОбработка)` | клиент | закрытие |
          | `ОбработкаВыбора(ВыбранноеЗначение, ИсточникВыбора)` | клиент | вернулся результат из формы выбора |

          Порядок при открытии: `ПриСозданииНаСервере` → `ПриЧтенииНаСервере` (для существующего) → `ПриОткрытии`.

          ## События элементов

          - `ПриИзменении` — значение поля изменено.
          - `НачалоВыбора` — нажата кнопка выбора (можно открыть свою форму).
          - `ОбработкаВыбора`, `Очистка`, `АвтоПодбор`.
          - Таблицы: `ПриАктивизацииСтроки`, `ПриНачалеРедактирования`, `ПередУдалением`, `ПриОкончанииРедактирования`, `Выбор` (двойной клик).

          ```bsl
          &НаКлиенте
          Процедура ТоварыКоличествоПриИзменении(Элемент)
              ТекущиеДанные = Элементы.Товары.ТекущиеДанные;
              ТекущиеДанные.Сумма = ТекущиеДанные.Количество * ТекущиеДанные.Цена;
              ПересчитатьИтог();
          КонецПроцедуры
          ```

          ## Асинхронные диалоги

          Модальные окна (`Вопрос`, `Предупреждение`) в веб-клиенте запрещены — используйте **асинхронные** методы с `ОписаниеОповещения` или `Ждать` (8.3.18+):

          ```bsl
          &НаКлиенте
          Процедура ПередЗакрытием(Отказ, ЗавершениеРаботы, ТекстПредупреждения, СтандартнаяОбработка)
              Если Модифицированность И НЕ ЗавершениеРаботы Тогда
                  Отказ = Истина;
                  ПоказатьВопрос(Новый ОписаниеОповещения("ВопросЗакрытияЗавершение", ЭтотОбъект),
                      "Сохранить изменения?", РежимДиалогаВопрос.ДаНетОтмена);
              КонецЕсли;
          КонецПроцедуры

          &НаКлиенте
          Процедура ВопросЗакрытияЗавершение(Ответ, ДополнительныеПараметры) Экспорт
              Если Ответ = КодВозвратаДиалога.Да Тогда
                  Записать();
                  Закрыть();
              ИначеЕсли Ответ = КодВозвратаДиалога.Нет Тогда
                  Модифицированность = Ложь;
                  Закрыть();
              КонецЕсли;
          КонецПроцедуры

          // Современный вариант
          &НаКлиенте
          Асинх Процедура Удалить(Команда)
              Ответ = Ждать ВопросАсинх("Удалить строку?", РежимДиалогаВопрос.ДаНет);
              Если Ответ = КодВозвратаДиалога.Да Тогда
                  Объект.Товары.Удалить(Элементы.Товары.ТекущиеДанные);
              КонецЕсли;
          КонецПроцедуры
          ```

