      - id: 1c-04-05
        title: Серверные вызовы и оптимизация
        minutes: 35
        xp: 40
        theory: |
          Медленная форма — частая жалоба пользователей. Почти всегда причина — **лишние серверные вызовы** и **лишний трафик**.

          ## Как измерить

          - **Замер производительности** в конфигураторе (Отладка → Замер производительности): время каждой строки кода.
          - Режим **«Показывать количество серверных вызовов»** (Параметры → Системы → Показывать количество вызовов сервера и объём трафика).
          - Технологический журнал и центр управления производительностью (ЦУП) — для серверных баз.

          ## Правила оптимизации

          1. **Один серверный вызов на действие пользователя.** Собирайте все нужные данные в структуру.

             ```bsl
             // ❌ три вызова
             Цена = ПолучитьЦену(Товар);
             Остаток = ПолучитьОстаток(Товар, Склад);
             Единица = ПолучитьЕдиницу(Товар);
             // ✅ один
             Данные = ПолучитьДанныеТовара(Товар, Склад);
             ```

          2. **`&НаСервереБезКонтекста` вместо `&НаСервере`**, если форма не нужна — не гоняем данные формы по сети.
          3. **Не вызывать сервер в цикле** на клиенте.
          4. **Обработчик `ПриАктивизацииСтроки`** вызывается при каждом перемещении по таблице — используйте `ПодключитьОбработчикОжидания("ОбновитьИнформацию", 0.2, Истина)`, чтобы не дёргать сервер при быстрой прокрутке.
          5. **Кеширование**: общий модуль с «повторным использованием возвращаемых значений» (на время вызова/сеанса) для редко меняющихся данных: настройки, права, курсы.
          6. **Клиентское кеширование**: передайте в форму всё нужное заранее в `ПриСозданииНаСервере` (например, соответствие единиц измерения), а потом пользуйтесь на клиенте.
          7. **Запросы вместо обращения через точку**: `Товар.Группа.Родитель.Наименование` в цикле — несколько запросов к БД на каждой итерации. Получите всё одним запросом.

          ```bsl
          // ❌ N запросов к базе
          Для Каждого Стр Из Объект.Товары Цикл
              Стр.Артикул = Стр.Номенклатура.Артикул;
          КонецЦикла;

          // ✅ один запрос
          Запрос = Новый Запрос("ВЫБРАТЬ Ссылка, Артикул ИЗ Справочник.Номенклатура ГДЕ Ссылка В (&Товары)");
          Запрос.УстановитьПараметр("Товары", Объект.Товары.Выгрузить(, "Номенклатура").ВыгрузитьКолонку("Номенклатура"));
          ```

          Удобная функция БСП: `ОбщегоНазначения.ЗначенияРеквизитовОбъектов(Ссылки, "Артикул, ЕдиницаИзмерения")`.

          ## Длительные операции

          Если операция идёт долго (загрузка, пересчёт) — запускайте её в **фоновом задании** (`ДлительныеОперации.ВыполнитьВФоне` в БСП) и показывайте прогресс, а не «замораживайте» интерфейс.
