        title: Табличные части на форме
        minutes: 35
        xp: 35
        theory: |
          Табличная часть документа (`Объект.Товары`) на форме отображается элементом **Таблица**. На клиенте она — `ДанныеФормыКоллекция` со строками `ДанныеФормыЭлементКоллекции`.

          ## Работа на клиенте

          ```bsl
          &НаКлиенте
          Процедура ДобавитьЧай(Команда)
              Строка = Объект.Товары.Добавить();
              Строка.Номенклатура = ПредопределенноеЗначение("Справочник.Номенклатура.Чай");
              Строка.Количество = 1;
              Элементы.Товары.ТекущаяСтрока = Строка.ПолучитьИдентификатор();   // перейти к строке
          КонецПроцедуры

          &НаКлиенте
          Процедура УдалитьНулевые(Команда)
              Для Каждого Строка Из Объект.Товары.НайтиСтроки(Новый Структура("Количество", 0)) Цикл
                  Объект.Товары.Удалить(Строка);
              КонецЦикла;
          КонецПроцедуры
          ```

          `ПредопределенноеЗначение()` — получение предопределённых значений на клиенте (на сервере можно напрямую).

          ## Выделенные строки

          ```bsl
          Для Каждого Идентификатор Из Элементы.Товары.ВыделенныеСтроки Цикл
              Строка = Объект.Товары.НайтиПоИдентификатору(Идентификатор);
              Строка.Скидка = 10;
          КонецЦикла;
          ```

          ## Итоги и номера строк

          В свойствах таблицы включите «Подвал», а у колонки «Сумма» задайте `ПутьКДаннымПодвала = Объект.Товары.ИтогСумма` — итог посчитается автоматически. Колонка `НомерСтроки` заполняется платформой.

          ## Массовые операции — на сервере

          Заполнение табличной части сотнями строк по запросу делайте **одним** серверным вызовом:

          ```bsl
          &НаСервере
          Процедура ЗаполнитьПоОстаткамНаСервере()
              Запрос = Новый Запрос(
              "ВЫБРАТЬ Ост.Номенклатура, Ост.КоличествоОстаток КАК Количество
              |ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(, Склад = &Склад) КАК Ост
              |ГДЕ Ост.КоличествоОстаток > 0");
              Запрос.УстановитьПараметр("Склад", Объект.Склад);
              Объект.Товары.Загрузить(Запрос.Выполнить().Выгрузить());   // загрузка по совпадающим колонкам
          КонецПроцедуры
          ```

          Для `Загрузить` колонки результата должны называться так же, как колонки табличной части.

          ## Подбор товаров

          Типичный сценарий — отдельная форма подбора, которая возвращает выбранные товары:

          ```bsl
          &НаКлиенте
          Процедура Подбор(Команда)
              ОткрытьФорму("Обработка.ПодборТоваров.Форма", Новый Структура("Склад", Объект.Склад), ЭтаФорма,,,,
                  Новый ОписаниеОповещения("ПодборЗавершение", ЭтотОбъект), РежимОткрытияОкнаФормы.БлокироватьОкноВладельца);
          КонецПроцедуры

          &НаКлиенте
          Процедура ПодборЗавершение(АдресВХранилище, Параметры) Экспорт
              Если АдресВХранилище <> Неопределено Тогда
                  ДобавитьПодобранныеНаСервере(АдресВХранилище);
              КонецЕсли;
          КонецПроцедуры
          ```

          Большие объёмы между формами передают через **временное хранилище** (`ПоместитьВоВременноеХранилище` / `ПолучитьИзВременногоХранилища`) — по адресу-строке.
