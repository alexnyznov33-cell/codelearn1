                ПересчитатьСтроку(Элементы.Товары.ТекущиеДанные);
            КонецПроцедуры

            &НаКлиенте
            Процедура ПересчитатьСтроку(Строка)
                Строка.Сумма = Строка.Количество * Строка.Цена;
                Элементы.ДекорацияИтог.Заголовок = "Итого: " + Формат(Объект.Товары.Итог("Сумма"), "ЧДЦ=2");
            КонецПроцедуры

