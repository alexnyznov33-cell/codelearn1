                Объект.Договор = ДоговорПоУмолчанию(Объект.Контрагент);
            КонецПроцедуры

            &НаСервереБезКонтекста
            Функция ДоговорПоУмолчанию(Контрагент)
                Возврат Контрагент.ОсновнойДоговор;
