            answers: ["ПодключитьОбработчикОжидания"]
          - type: choice
            q: Чем &НаСервереБезКонтекста быстрее &НаСервере?
            options: ["Выполняется на клиенте", "Не передаёт данные формы на сервер и обратно", "Не обращается к базе", "Кеширует результат"]
            answer: 1
        homework:
          task: |
            Возьмите форму документа из прошлых уроков и включите показ количества серверных вызовов. Выполните типичный сценарий (выбор контрагента, добавление 5 товаров, изменение количества, запись) и запишите число вызовов. Оптимизируйте: объедините вызовы, переведите на `&НаСервереБезКонтекста`, вынесите в `ПриСозданииНаСервере` подготовку данных для клиента, кешируйте настройки в модуле с повторным использованием, замените обращения через точку на один запрос. Повторите замер и оформите таблицу «до/после».
          checklist:
            - Есть замеры до и после
            - Количество вызовов уменьшилось
            - Нет обращений к реквизитам ссылок в циклах
          solution: |
            // Общий модуль НастройкиПродажПовтИсп (Сервер, Вызов сервера, Повторное использование: На время сеанса)
            Функция Настройки() Экспорт
                Возврат Новый ФиксированнаяСтруктура("ИспользоватьСкидки, ОсновнойСклад",
                    Константы.ИспользоватьСкидки.Получить(), Константы.ОсновнойСклад.Получить());
            КонецФункции

            // Модуль формы
            &НаСервере
            Процедура ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)
                Настройки = НастройкиПродажПовтИсп.Настройки();
                Элементы.ТоварыСкидка.Видимость = Настройки.ИспользоватьСкидки;
                ЗаполнитьАртикулыНаСервере();
            КонецПроцедуры

            &НаСервере
            Процедура ЗаполнитьАртикулыНаСервере()
                Товары = Объект.Товары.Выгрузить(, "Номенклатура").ВыгрузитьКолонку("Номенклатура");
                Реквизиты = ОбщегоНазначения.ЗначенияРеквизитовОбъектов(Товары, "Артикул");
                Для Каждого Стр Из Объект.Товары Цикл
                    Данные = Реквизиты[Стр.Номенклатура];
                    Стр.Артикул = ?(Данные = Неопределено, "", Данные.Артикул);
                КонецЦикла;
            КонецПроцедуры

            &НаКлиенте
            Процедура ТоварыНоменклатураПриИзменении(Элемент)
                Стр = Элементы.Товары.ТекущиеДанные;
                Данные = ДанныеТовара(Стр.Номенклатура, Объект.Склад, Объект.Дата);  // 1 вызов вместо 3
                ЗаполнитьЗначенияСвойств(Стр, Данные);
                Стр.Сумма = Стр.Количество * Стр.Цена;
            КонецПроцедуры

            &НаСервереБезКонтекста
            Функция ДанныеТовара(Товар, Склад, Дата)
                Возврат ПродажиВызовСервера.ДанныеНоменклатуры(Товар, Склад, Дата);   // Цена, ЕдиницаИзмерения, Остаток, Артикул
            КонецФункции

            // Замеры: до — 14 вызовов, 380 КБ; после — 6 вызовов, 45 КБ
