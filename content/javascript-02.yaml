        homework:
          task: |
            Создайте объект `cart` с массивом `items` (каждый — `{ title, price, qty }`) и методами `add(item)`, `remove(title)`, `total()` и `summary()` (строка вида «3 товара на 1500 ₽»). Обойдите товары через `Object.entries` по одному товару и выведите все поля. Используйте опциональную цепочку при поиске товара, которого нет.
          checklist:
            - Методы используют this
            - total считает price * qty
            - Нет ошибок при поиске отсутствующего товара
          solution: |
            const cart = {
              items: [],
              add(item) { this.items.push(item); return this; },
              remove(title) { this.items = this.items.filter((i) => i.title !== title); },
              total() { return this.items.reduce((s, i) => s + i.price * i.qty, 0); },
              summary() {
                const count = this.items.reduce((s, i) => s + i.qty, 0);
                return `${count} товара на ${this.total()} ₽`;
              },
            };
            cart.add({ title: "Чай", price: 300, qty: 2 }).add({ title: "Мёд", price: 900, qty: 1 });
            console.log(cart.summary()); // 3 товара на 1500 ₽
            for (const [k, v] of Object.entries(cart.items[0])) console.log(k, v);
            const found = cart.items.find((i) => i.title === "Кофе");
            console.log(found?.price ?? "нет такого товара");
            cart.remove("Чай");
            console.log(cart.total()); // 900
      - id: js-02-02
        title: Деструктуризация и spread объектов
        minutes: 30
        xp: 30
        theory: |
          **Деструктуризация** — извлечение значений из объектов и массивов в переменные одной строкой.

          ```javascript
          const user = { name: "Анна", age: 25, city: "Пермь" };
          const { name, age } = user;               // name = "Анна", age = 25
          const { city: town } = user;              // переименование: town = "Пермь"
          const { phone = "нет" } = user;           // значение по умолчанию
          const { name: n, ...rest } = user;        // rest = { age: 25, city: "Пермь" }

          const [first, second, ...others] = [10, 20, 30, 40];  // others = [30, 40]
          const [, , third] = [1, 2, 3];            // пропуск элементов: third = 3
          let x = 1, y = 2;
          [x, y] = [y, x];                          // обмен значений
          ```

          ## Вложенная деструктуризация

          ```javascript
          const order = { id: 7, customer: { name: "Иван", address: { city: "Омск" } } };
          const { customer: { address: { city } } } = order;   // city = "Омск"
          ```

          ## В параметрах функций

          ```javascript
          function createUser({ name, role = "user", active = true } = {}) {
            return `${name}: ${role}, ${active}`;
          }
          createUser({ name: "Оля" });   // "Оля: user, true"
          ```

          Удобно для «именованных параметров»: порядок не важен, легко добавить новый.

          ## Spread `...`

          ```javascript
          const base = { theme: "dark", lang: "ru" };
          const settings = { ...base, lang: "en" };       // { theme: "dark", lang: "en" }
          const copy = { ...user };                        // поверхностная копия
          const merged = { ...a, ...b };                   // при совпадении ключей побеждает последний

          const arr = [1, 2];
          const more = [0, ...arr, 3];                     // [0, 1, 2, 3]
          Math.max(...arr);                                // 2
          ```

          ## Поверхностное копирование

          Spread копирует только **первый уровень**. Вложенные объекты остаются общими:

          ```javascript
          const a = { inner: { v: 1 } };
          const b = { ...a };
          b.inner.v = 99;
          console.log(a.inner.v);          // 99!
          const deep = structuredClone(a); // глубокая копия
          ```

          В React и Redux spread — основной способ **иммутабельного** обновления состояния: `setUser({ ...user, age: 26 })`.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              const { a, b = 5, ...rest } = { a: 1, c: 3, d: 4 };
              console.log(a, b, Object.keys(rest).join(""));
            answer: 1 5 cd
          - type: output
            q: Что выведет код?
            code: |
              const s = { ...{ x: 1, y: 2 }, ...{ y: 3, z: 4 } };
              console.log(s.x + s.y + s.z);
