        homework:
          task: |
            Напишите функции `saveState(state)` → строка JSON и `loadState(text)` → объект. Состояние: `{ user: { name, registeredAt: Date }, todos: [{ text, done, tags: Set }] }`. Сериализуйте `Date` и `Set` корректно (Set → массив, обратно через reviver), не сохраняйте поле `user.token`. `loadState` при невалидном JSON возвращает состояние по умолчанию и пишет предупреждение.
          checklist:
            - Даты и Set восстанавливаются
            - Секретное поле не попадает в JSON
            - Невалидный JSON не роняет программу
          solution: |
            const DEFAULT = { user: null, todos: [] };
            function saveState(state) {
              return JSON.stringify(state, (key, value) => {
                if (key === "token") return undefined;
                if (value instanceof Set) return { __set: [...value] };
                return value;
              });
            }
            function loadState(text) {
              try {
                return JSON.parse(text, (key, value) => {
                  if (key === "registeredAt") return new Date(value);
                  if (value && Array.isArray(value.__set)) return new Set(value.__set);
                  return value;
                });
              } catch (e) {
                console.warn("Не удалось загрузить состояние:", e.message);
                return structuredClone(DEFAULT);
              }
            }
            const state = {
              user: { name: "Анна", registeredAt: new Date("2024-01-15"), token: "secret" },
              todos: [{ text: "Учить JSON", done: false, tags: new Set(["js", "учёба"]) }],
            };
            const text = saveState(state);
            console.log(text.includes("secret"));          // false
            const restored = loadState(text);
            console.log(restored.user.registeredAt.getFullYear(), restored.todos[0].tags.has("js")); // 2024 true
            console.log(loadState("{битый json"));          // предупреждение + { user: null, todos: [] }
      - id: js-02-06
        title: Дата и время
        minutes: 30
        xp: 30
        theory: |
          Встроенный объект **Date** хранит момент времени как число миллисекунд от 1 января 1970 UTC.

          ```javascript
          const now = new Date();                      // сейчас
          const d = new Date(2024, 0, 15, 10, 30);     // 15 января 2024, 10:30 (месяцы с 0!)
          const iso = new Date("2024-01-15T10:30:00Z"); // из ISO-строки (UTC)
          const ts = Date.now();                       // миллисекунды — удобно для замеров
          ```

          ⚠️ **Месяцы нумеруются с 0**: январь — 0, декабрь — 11. А дни месяца — с 1.

          ## Компоненты

          ```javascript
          d.getFullYear();  // 2024
          d.getMonth();     // 0
          d.getDate();      // 15 — день месяца
          d.getDay();       // 1 — день недели (0 = воскресенье)
          d.getHours(); d.getMinutes();
          d.setDate(d.getDate() + 30);   // +30 дней, переполнение переносит месяц
          ```

          ## Разница дат

          ```javascript
          const a = new Date(2024, 0, 1), b = new Date(2024, 0, 31);
          const days = (b - a) / (1000 * 60 * 60 * 24);   // 30 — вычитание даёт миллисекунды
          ```

          ## Форматирование

          ```javascript
          d.toISOString();                          // "2024-01-15T07:30:00.000Z" — для API
          d.toLocaleDateString("ru-RU");            // "15.01.2024"
          d.toLocaleString("ru-RU", { dateStyle: "long", timeStyle: "short" }); // "15 января 2024 г. в 10:30"

          const fmt = new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long" });
          fmt.format(d);                            // "понедельник, 15 января"

          const rtf = new Intl.RelativeTimeFormat("ru", { numeric: "auto" });
          rtf.format(-1, "day");                    // "вчера"
          ```

          ## Часовые пояса

          `Date` всегда хранит UTC, а методы `getHours()` и т.п. показывают **локальное** время устройства. Методы `getUTCHours()` — в UTC. Правило: храните и передавайте время в UTC (ISO-строка), показывайте пользователю — в его поясе.

          Строка `"2024-01-15"` разбирается как UTC, а `"2024-01-15T10:00"` — как локальное время. Это частый источник ошибок «съехал день».

          ## Библиотеки

          Для сложных расчётов используют **date-fns**, **Day.js** или **Luxon**. В будущем стандартом станет **Temporal API** (`Temporal.PlainDate`, `Temporal.ZonedDateTime`).
