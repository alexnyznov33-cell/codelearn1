id: javascript
modules:
  - id: js-m2
    title: Объекты и строки
    level: Junior
    lessons:
      - id: js-02-01
        title: Объекты, свойства и методы
        minutes: 30
        xp: 30
        theory: |
          **Объект** — набор пар «ключ: значение». Это основа JavaScript: массивы, функции, даты — всё объекты.

          ```javascript
          const user = {
            name: "Анна",
            age: 25,
            "favorite color": "синий",     // ключ с пробелом — в кавычках
            greet() {                       // метод (краткая запись)
              return `Привет, я ${this.name}`;
            },
          };

          console.log(user.name);              // Анна — через точку
          console.log(user["favorite color"]); // через скобки
          const key = "age";
          console.log(user[key]);              // 25 — динамический ключ
          console.log(user.greet());           // Привет, я Анна
          ```

          ## Изменение

          ```javascript
          user.city = "Казань";   // добавить
          user.age = 26;          // изменить
          delete user.city;       // удалить
          console.log(user.phone); // undefined — нет такого свойства
          ```

          `const` запрещает **переприсвоить** переменную, но не менять содержимое объекта.

          ## Проверка и обход

          ```javascript
          "name" in user;                 // true
          Object.hasOwn(user, "age");     // true (собственное свойство)
          Object.keys(user);              // ["name", "age", "favorite color", "greet"]
          Object.values({ a: 1, b: 2 });  // [1, 2]
          Object.entries({ a: 1, b: 2 }); // [["a", 1], ["b", 2]]

          for (const [k, v] of Object.entries({ a: 1, b: 2 })) {
            console.log(k, v);
          }
          ```

          ## Сокращения и вычисляемые ключи

          ```javascript
          const name = "Иван", age = 30;
          const p = { name, age };              // { name: "Иван", age: 30 }
          const field = "score";
          const r = { [field + "1"]: 100 };     // { score1: 100 }
          ```

          ## Ссылки

          Объекты передаются **по ссылке**: две переменные могут указывать на один объект.

          ```javascript
          const a = { x: 1 };
          const b = a;
          b.x = 2;
          console.log(a.x);           // 2
          console.log({} === {});     // false — разные объекты
          ```

          ## Опциональная цепочка

          `user.address?.city` вернёт `undefined` вместо ошибки, если `address` нет. `user.getInfo?.()` — вызовет метод, только если он существует.
        practice:
