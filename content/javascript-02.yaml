              b.n = 2;
              console.log(a.inner.v, a.n);
            answer: 2 1
          - type: output
            q: Что выведет код?
            code: |
              let [p, q] = [1, 2];
              [p, q] = [q, p];
              const [, , t = 9] = [p, q];
              console.log(p, q, t);
            answer: 2 1 9
        homework:
          task: |
            Напишите функцию `updateProfile(profile, changes)`, которая возвращает **новый** объект, не изменяя исходный: обновляет поля верхнего уровня и вложенный объект `address` (тоже копией). Напишите функцию `formatUser({ name, age, address: { city } = {} })` с деструктуризацией в параметрах. Проверьте, что исходный профиль не изменился.
          checklist:
            - Исходный объект не мутируется
            - Вложенный address копируется отдельно
            - Есть значения по умолчанию
          solution: |
            function updateProfile(profile, changes) {
              return {
                ...profile,
                ...changes,
                address: { ...profile.address, ...changes.address },
              };
            }
            function formatUser({ name, age = "?", address: { city = "не указан" } = {} }) {
              return `${name} (${age}), город: ${city}`;
            }
            const p = { name: "Анна", age: 25, address: { city: "Пермь", street: "Ленина" } };
            const p2 = updateProfile(p, { age: 26, address: { city: "Казань" } });
            console.log(formatUser(p2));          // Анна (26), город: Казань
            console.log(p.address.city, p.age);   // Пермь 25 — исходный не изменился
            console.log(p2.address.street);       // Ленина
            console.log(formatUser({ name: "Олег" })); // Олег (?), город: не указан
      - id: js-02-03
        title: Строки и шаблонные литералы
        minutes: 30
        xp: 30
        theory: |
          Строки в JS **неизменяемы**: методы возвращают новую строку.

          ```javascript
          const s = "Привет, мир";
          s.length;               // 11
          s[0];                   // "П"
          s.at(-1);               // "р" — с конца
          s.toUpperCase();        // "ПРИВЕТ, МИР"
          s.includes("мир");      // true
          s.startsWith("При");    // true
          s.indexOf("мир");       // 8 (-1 если нет)
          s.slice(0, 6);          // "Привет"
          s.slice(-3);            // "мир"
          s.replace("мир", "JS"); // "Привет, JS" — первое вхождение
          "a-b-c".replaceAll("-", "+"); // "a+b+c"
          "  hi  ".trim();        // "hi"
          "5".padStart(3, "0");   // "005"
          "ab".repeat(3);         // "ababab"
          "a,b,c".split(",");     // ["a", "b", "c"]
          ["a", "b"].join(" / "); // "a / b"
          ```

          ## Шаблонные литералы

          Обратные кавычки `` ` `` позволяют встраивать выражения и писать многострочный текст:

          ```javascript
          const name = "Анна", items = 3, price = 450;
          const msg = `Здравствуйте, ${name}!
          В корзине ${items} товара на ${items * price} ₽.`;
          ```

          ## Сравнение и сортировка

          ```javascript
          "a" < "b";                                  // true (по кодам символов)
          "ё".localeCompare("я", "ru");               // -1
          ["яблоко", "Банан", "ёж"].sort((a, b) => a.localeCompare(b, "ru"));
          ```

          ## Регулярные выражения (основы)

          ```javascript
          /^\d{3}-\d{2}$/.test("123-45");                 // true
          "Тел: 8-900-123".match(/\d+/g);                 // ["8", "900", "123"]
          "camelCaseString".replace(/([A-Z])/g, "_$1").toLowerCase(); // "camel_case_string"
          ```

          ## Числа ↔ строки

          ```javascript
          String(42); (42).toString();     // "42"
          Number("3.5"); parseInt("42px"); // 3.5, 42
          (3.14159).toFixed(2);            // "3.14"
          (1234567.89).toLocaleString("ru-RU"); // "1 234 567,89"
          ```

          Unicode: эмодзи может занимать две «ячейки» (`"😀".length === 2`). Для точного разбиения по символам используйте `[..."😀a"]`.
        practice:
