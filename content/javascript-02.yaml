            explain: Строки неизменяемы — присваивание по индексу игнорируется (в строгом режиме — TypeError), выведется hello.
        homework:
          task: |
            Напишите набор функций для работы с текстом: `capitalize(s)` (первая буква заглавная), `slugify(s)` («Привет Мир 2024!» → «привет-мир-2024»), `countWords(s)` (объект частот слов без учёта регистра и знаков препинания), `truncate(s, n)` (обрезать до n символов и добавить «…»), `isPalindrome(s)` (игнорируя пробелы и регистр). Протестируйте на русских строках.
          checklist:
            - Функции не изменяют исходную строку
            - Используются методы строк и регулярные выражения
            - Работают с кириллицей
          solution: |
            const capitalize = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
            const slugify = (s) =>
              s.toLowerCase().trim().replace(/[^a-zа-яё0-9\s-]/g, "").replace(/\s+/g, "-");
            function countWords(s) {
              const freq = {};
              for (const w of s.toLowerCase().match(/[a-zа-яё0-9]+/g) ?? []) {
                freq[w] = (freq[w] ?? 0) + 1;
              }
              return freq;
            }
            const truncate = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);
            const isPalindrome = (s) => {
              const clean = s.toLowerCase().replace(/\s/g, "");
              return clean === [...clean].reverse().join("");
            };
            console.log(capitalize("москва"));               // Москва
            console.log(slugify("Привет Мир 2024!"));        // привет-мир-2024
            console.log(countWords("Кот и кот, и пёс."));     // { кот: 2, и: 2, пёс: 1 }
            console.log(truncate("Длинный заголовок", 7));   // Длинный…
            console.log(isPalindrome("А роза упала на лапу Азора")); // true
      - id: js-02-04
        title: Map, Set, WeakMap
        minutes: 30
        xp: 35
        theory: |
          ## Map — словарь с любыми ключами

          В обычном объекте ключи — только строки и символы. В **Map** ключом может быть что угодно (объект, число, функция), и сохраняется порядок вставки.

          ```javascript
          const m = new Map();
          m.set("a", 1).set(42, "число").set({ id: 1 }, "объект");
          m.get("a");       // 1
          m.has(42);        // true
          m.size;           // 3
          m.delete("a");
          for (const [key, value] of m) console.log(key, value);

          const fromObj = new Map(Object.entries({ x: 1, y: 2 }));
          const backToObj = Object.fromEntries(fromObj);
          ```

          Map быстрее объекта при частых добавлениях/удалениях и удобнее для подсчётов:

          ```javascript
          const freq = new Map();
          for (const ch of "банан") freq.set(ch, (freq.get(ch) ?? 0) + 1);
          // Map { "б" => 1, "а" => 2, "н" => 2 }
          ```

          ## Set — множество уникальных значений

          ```javascript
          const s = new Set([1, 2, 2, 3, 3, 3]);
          s.size;          // 3
          s.add(4); s.has(2); s.delete(1);
          const unique = [...new Set(["a", "b", "a"])];   // ["a", "b"]

          const a = new Set([1, 2, 3]), b = new Set([2, 3, 4]);
          const inter = [...a].filter((x) => b.has(x));   // [2, 3]
          const union = new Set([...a, ...b]);            // {1, 2, 3, 4}
          // В современных браузерах: a.intersection(b), a.union(b), a.difference(b)
          ```

          Сравнение — по `SameValueZero`: два разных объекта `{}` — разные элементы, а `NaN` равен `NaN`.

          ## WeakMap и WeakSet

          Ключи — **только объекты**, хранятся «слабо»: если на объект больше нет ссылок, сборщик мусора удалит его вместе с записью. Нет перебора и `size`.

          ```javascript
          const cache = new WeakMap();
          function getMeta(el) {
            if (!cache.has(el)) cache.set(el, { clicks: 0 });
            return cache.get(el);
          }
          ```

          Применение: кеши и приватные данные, привязанные к объектам (DOM-элементам), без утечек памяти.

          ## Когда что

          | Задача | Структура |
          |---|---|
          | Запись с фиксированными полями | объект |
          | Словарь с динамическими/не строковыми ключами | Map |
          | Уникальные значения, быстрый `has` | Set |
          | Данные «при объекте» без утечек | WeakMap |
        practice:
          - type: output
            q: Что выведет код?
            code: |
              const s = new Set([1, 2, 2, 3, 1]);
              s.add(3).add(4);
              console.log(s.size);
            answer: "4"
          - type: output
            q: Что выведет код?
            code: |
              const m = new Map();
              m.set("1", "строка").set(1, "число");
              console.log(m.size, m.get(1));
            answer: 2 число
          - type: fill
            q: Удалите дубликаты из массива
            code: |
              const unique = [...new ___(arr)];
            answers: ["Set"]
          - type: choice
            q: Что может быть ключом в WeakMap?
            options: ["Только строки", "Любое значение", "Только объекты", "Только числа"]
            answer: 2
          - type: output
            q: Что выведет код?
            code: |
              const freq = new Map();
              for (const ch of "мама") freq.set(ch, (freq.get(ch) ?? 0) + 1);
              console.log([...freq.entries()].map(([k, v]) => k + v).join(","));
            answer: м2,а2
        homework:
          task: |
            Есть массив заказов `{ id, customer, products: ["чай", "кофе", ...] }`. Напишите: (1) `Map` «клиент → количество заказов»; (2) `Set` всех уникальных товаров; (3) функцию, возвращающую товары, которые заказывали **все** клиенты (пересечение множеств); (4) кеш на `WeakMap` для функции `orderTotal(order)`, чтобы повторный вызов с тем же объектом не пересчитывал сумму (цены — в отдельном объекте).
          checklist:
            - Map используется для подсчёта
            - Set для уникальности и пересечения
            - WeakMap-кеш работает
          solution: |
            const prices = { чай: 300, кофе: 500, сахар: 80 };
            const orders = [
              { id: 1, customer: "Анна", products: ["чай", "сахар"] },
              { id: 2, customer: "Иван", products: ["кофе", "сахар"] },
              { id: 3, customer: "Анна", products: ["кофе", "сахар", "чай"] },
            ];
            const byCustomer = new Map();
            for (const o of orders) byCustomer.set(o.customer, (byCustomer.get(o.customer) ?? 0) + 1);
            console.log(byCustomer); // Map { Анна => 2, Иван => 1 }

            const allProducts = new Set(orders.flatMap((o) => o.products));
            console.log([...allProducts]);

            function commonProducts(orders) {
              const perCustomer = new Map();
              for (const o of orders) {
                const set = perCustomer.get(o.customer) ?? new Set();
                o.products.forEach((p) => set.add(p));
                perCustomer.set(o.customer, set);
              }
              const sets = [...perCustomer.values()];
              return [...sets[0]].filter((p) => sets.every((s) => s.has(p)));
            }
            console.log(commonProducts(orders)); // ["сахар", "кофе"] или в порядке первого клиента

            const totals = new WeakMap();
            function orderTotal(order) {
              if (totals.has(order)) return totals.get(order);
              const sum = order.products.reduce((s, p) => s + prices[p], 0);
              totals.set(order, sum);
              return sum;
            }
            console.log(orderTotal(orders[0]), orderTotal(orders[0])); // 380 380 (второй — из кеша)
      - id: js-02-05
        title: JSON
        minutes: 25
        xp: 30
        theory: |
          **JSON** (JavaScript Object Notation) — текстовый формат обмена данными. Его используют REST API, конфиги (`package.json`), хранилища.

          ```json
          {
            "id": 7,
            "title": "Книга",
            "tags": ["js", "web"],
            "price": 499.9,
            "inStock": true,
            "author": null
          }
          ```

          Правила JSON строже, чем у объектов JS: ключи **только в двойных кавычках**, строки — только в двойных, **нет** комментариев, висячих запятых, `undefined`, функций, `NaN`.

          ## stringify и parse

          ```javascript
          const obj = { name: "Анна", age: 25, skills: ["js"] };
          const text = JSON.stringify(obj);      // '{"name":"Анна","age":25,"skills":["js"]}'
          const pretty = JSON.stringify(obj, null, 2);   // с отступами
          const back = JSON.parse(text);         // снова объект
          ```

          ## Что теряется при stringify

          ```javascript
          JSON.stringify({ a: undefined, f() {}, d: new Date(0), n: NaN });
          // '{"d":"1970-01-01T00:00:00.000Z","n":null}'
          ```

          - `undefined` и функции в объектах **пропадают**, в массивах становятся `null`.
          - `Date` превращается в строку ISO и **не восстанавливается** сам.
          - `Map`/`Set` → `{}`.

          ## replacer и reviver

          ```javascript
          JSON.stringify(user, ["name", "email"]);   // только перечисленные поля
          JSON.stringify(user, (k, v) => (k === "password" ? undefined : v));

          const data = JSON.parse(text, (key, value) =>
            key === "createdAt" ? new Date(value) : value);
          ```

          Метод `toJSON()` в объекте задаёт своё представление.

          ## Ошибки разбора

          ```javascript
          try {
            JSON.parse("{name: 'Анна'}");   // SyntaxError — нет кавычек у ключа
          } catch (e) {
            console.log("Невалидный JSON:", e.message);
          }
          ```

          Данные извне (API, localStorage, файлы) всегда разбирайте в `try/catch` и проверяйте структуру.

          ## Глубокое копирование

          `JSON.parse(JSON.stringify(obj))` — старый приём с потерями (даты, undefined). Современно: `structuredClone(obj)`.
