        homework:
          task: |
            Напишите утилиты: `daysUntil(date)` — сколько дней осталось до даты (округление вверх); `addWorkingDays(date, n)` — прибавить n рабочих дней (пропуская субботу и воскресенье); `age(birthDate)` — полных лет; `humanize(date)` — «сегодня», «вчера», «3 дня назад» через `Intl.RelativeTimeFormat`; `formatRu(date)` — «понедельник, 15 января 2024». Не мутируйте входные даты.
          checklist:
            - Учтено, что месяцы с 0
            - Входные даты не изменяются
            - Используется Intl для форматирования
          solution: |
            const DAY = 86400000;
            const daysUntil = (date) => Math.ceil((date - Date.now()) / DAY);
            function addWorkingDays(date, n) {
              const d = new Date(date);
              while (n > 0) {
                d.setDate(d.getDate() + 1);
                if (d.getDay() !== 0 && d.getDay() !== 6) n--;
              }
              return d;
            }
            function age(birth, today = new Date()) {
              let years = today.getFullYear() - birth.getFullYear();
              const hadBirthday =
                today.getMonth() > birth.getMonth() ||
                (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
              return hadBirthday ? years : years - 1;
            }
            const rtf = new Intl.RelativeTimeFormat("ru", { numeric: "auto" });
            function humanize(date) {
              const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
              const diff = Math.round((startOf(date) - startOf(new Date())) / DAY);
              return rtf.format(diff, "day");
            }
            const formatRu = (date) =>
              new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
                .format(date).replace(" г.", "");
            console.log(addWorkingDays(new Date(2024, 0, 12), 1).getDate()); // пятница 12 → понедельник 15
            console.log(age(new Date(2000, 5, 1), new Date(2024, 4, 31)));   // 23
            console.log(humanize(new Date(Date.now() - 3 * DAY)));           // 3 дня назад
            console.log(formatRu(new Date(2024, 0, 15)));                    // понедельник, 15 января 2024
