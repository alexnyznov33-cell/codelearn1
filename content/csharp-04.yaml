            options: ["Да, это разные типы", "Нет, это только аннотация для компилятора", "string? — это Nullable<string>", "Зависит от платформы"]
            answer: 1
          - type: output
            q: Что выведет код?
            code: |
              int? a = null;
              int? b = 5;
              Console.WriteLine((a ?? 0) + (b ?? 0) + " " + a.HasValue);
            answer: 5 False
        homework:
          task: |
            Возьмите класс `UserService` с методами `FindByEmail(string)` (может не найти), `GetDisplayName(User)` (у пользователя необязательные FirstName/LastName/Nick) и `TryGetManager(User, out User? manager)` с атрибутом `[NotNullWhen(true)]`. Добейтесь компиляции без единого nullable-предупреждения и без оператора `!`.
          checklist:
            - Nullable включён
            - Нет ни одного `!`
            - Используются ?. ?? и is not null
          solution: |
            using System.Diagnostics.CodeAnalysis;

            public class User
            {
                public required string Email { get; init; }
                public string? FirstName { get; init; }
                public string? LastName { get; init; }
                public string? Nick { get; init; }
                public User? Manager { get; init; }
            }

            public class UserService(List<User> users)
            {
                public User? FindByEmail(string email) =>
                    users.FirstOrDefault(u => u.Email.Equals(email, StringComparison.OrdinalIgnoreCase));

                public string GetDisplayName(User u) =>
                    u.Nick ?? (u.FirstName is not null ? $"{u.FirstName} {u.LastName}".Trim() : u.Email);

                public bool TryGetManager(User u, [NotNullWhen(true)] out User? manager)
                {
                    manager = u.Manager;
                    return manager is not null;
                }
            }
