          - type: choice
            q: Какой инструмент проверяет типы статически?
            options: ["`pip`", "`mypy`", "`venv`", "`black`"]
            answer: 1
        homework:
          task: |
            Добавьте аннотации ко всем функциям из домашних заданий модуля (is_prime, primes_up_to, make_html, flatten и др.). Установите mypy, запустите `mypy --strict файл.py` и исправьте все замечания.
          checklist:
            - Все параметры и возвращаемые значения аннотированы
            - "`mypy --strict` не выдаёт ошибок"
          solution: |
            from typing import Any

            def is_prime(n: int) -> bool:
                if n < 2:
                    return False
                return all(n % d for d in range(2, int(n ** 0.5) + 1))

            def primes_up_to(n: int) -> list[int]:
                return [x for x in range(2, n + 1) if is_prime(x)]

            def make_html(tag: str, *children: str, **attrs: str) -> str:
                a = "".join(f' {k}="{v}"' for k, v in attrs.items())
                return f"<{tag}{a}>{''.join(children)}</{tag}>"

            def flatten(items: list[Any]) -> list[Any]:
                result: list[Any] = []
                for x in items:
                    result.extend(flatten(x) if isinstance(x, list) else [x])
                return result
