id: onec
modules:
  - id: 1c-m9
    title: Стандарты и практики Middle
    level: Middle
    lessons:
      - id: 1c-09-01
        title: Стандарты разработки 1С и БСП
        minutes: 35
        xp: 50
        theory: |
          Фирма «1С» публикует **Систему стандартов и методик разработки** (its.1c.ru/db/v8std). Их соблюдение — признак Middle-разработчика и обязательное условие для сертификации «Совместимо с 1С:Предприятие».

          ## Главные правила оформления

          - Имена — по-русски, **ВерблюжьейНотацией**, без сокращений: `СуммаДокумента`, не `СумДок`.
          - Экспортные методы — с **комментарием-описанием** (параметры, возвращаемое значение).
          - Модули делятся на **области**:

          ```bsl
          #Область ПрограммныйИнтерфейс

          // Возвращает остаток товара на складе.
          //
          // Параметры:
          //  Номенклатура - СправочникСсылка.Номенклатура - товар.
          //  Склад        - СправочникСсылка.Склады - склад.
          //
          // Возвращаемое значение:
          //  Число - остаток в базовых единицах.
          //
          Функция ОстатокТовара(Номенклатура, Склад) Экспорт
              // ...
          КонецФункции

          #КонецОбласти

          #Область СлужебныеПроцедурыИФункции
          // ...
          #КонецОбласти
          ```

          - Длина строки — до 120 символов; один оператор — одна строка.
          - Нельзя использовать `Сообщить` в серверном коде типовых решений — `ОбщегоНазначения.СообщитьПользователю`.

          ## БСП — Библиотека стандартных подсистем

          БСП — набор готовых подсистем, на котором построены все типовые конфигурации. Не изобретайте велосипед:

          | Подсистема | Что даёт |
          |---|---|
          | Базовая функциональность | `ОбщегоНазначения`, `ОбщегоНазначенияКлиентСервер`, `СтроковыеФункцииКлиентСервер` |
          | Пользователи, Управление доступом | Пользователи, группы доступа, RLS |
          | Печать | Команды печати, комплекты, PDF |
          | Длительные операции | Фоновые задания с прогрессом |
          | Дополнительные отчёты и обработки | Подключение внешних обработок |
          | Обновление версии ИБ | Обработчики обновления данных |
          | Присоединённые файлы, Свойства, Варианты отчётов… | И ещё десятки |

          Полезные функции:

          ```bsl
          ОбщегоНазначения.ЗначениеРеквизитаОбъекта(Ссылка, "ИНН");
          ОбщегоНазначения.ЗначенияРеквизитовОбъекта(Ссылка, "ИНН, КПП");
          ОбщегоНазначенияКлиентСервер.ЗначениеВМассиве(Значение);
          СтроковыеФункцииКлиентСервер.ПодставитьПараметрыВСтроку("%1 из %2", 1, 5);
          ```

          `ЗначениеРеквизитаОбъекта` читает **одно поле** запросом, а не весь объект — это быстрее, чем `Ссылка.ИНН` при «толстом» объекте.

          ## Проверка автоматически

          **АПК** (Автоматизированная проверка конфигураций) и **EDT + v8-code-style** / **BSL Language Server** / SonarQube находят нарушения стандартов: запросы в цикле, отсутствие комментариев, неиспользуемые переменные, ошибки директив компиляции.
        practice:
          - type: choice
            q: Какое имя переменной соответствует стандартам?
            options: ["СумДок", "summa", "СуммаДокумента", "сумма_документа"]
            answer: 2
          - type: fill
            q: Оформите область программного интерфейса
            code: |
              #___ ПрограммныйИнтерфейс
              Функция Остаток(Товар) Экспорт
              КонецФункции
              #___
            answers: ["Область", "КонецОбласти"]
          - type: choice
            q: Чем лучше получать один реквизит ссылки из БСП?
            options: ["Ссылка.ПолучитьОбъект().ИНН", "ОбщегоНазначения.ЗначениеРеквизитаОбъекта(Ссылка, \"ИНН\")", "Через Вычислить", "Через ОткрытьФорму"]
            answer: 1
          - type: bug
            q: Найдите нарушение стандарта в серверном общем модуле типовой конфигурации
            code: |
              Процедура ПроверитьИНН(Контрагент, Отказ) Экспорт
                  Если ПустаяСтрока(Контрагент.ИНН) Тогда
                      Сообщить("Не заполнен ИНН");
                      Отказ = Истина;
                  КонецЕсли;
              КонецПроцедуры
            bugLine: 3
            fix: ОбщегоНазначения.СообщитьПользователю("Не заполнен ИНН",, "ИНН");
            explain: По стандартам сообщения выводят через БСП — с привязкой к полю.
          - type: output
            q: "Что вернёт функция БСП?"
            code: |
              Текст = СтроковыеФункцииКлиентСервер.ПодставитьПараметрыВСтроку("%1 из %2", 3, 7);
              Сообщить(Текст);
            answer: "3 из 7"
        homework:
          task: |
            Проведите «код-ревью» своего общего модуля из прошлых уроков: разбейте на области ПрограммныйИнтерфейс / СлужебныйПрограммныйИнтерфейс / СлужебныеПроцедурыИФункции, добавьте комментарии к экспортным методам по стандарту, замените обращения через точку на ЗначенияРеквизитовОбъекта, сообщения — на СообщитьПользователю. Если есть EDT — включите проверки v8-code-style и исправьте замечания.
          checklist:
            - Области по стандарту
            - Комментарии с Параметрами и Возвращаемым значением
            - Используются функции БСП
            - Имена без сокращений
          solution: |
            #Область ПрограммныйИнтерфейс

            // Проверяет заполнение реквизитов контрагента для документа.
            //
            // Параметры:
            //  Контрагент - СправочникСсылка.Контрагенты - проверяемый контрагент.
            //  Отказ      - Булево - устанавливается в Истина при ошибке.
            //
            Процедура ПроверитьРеквизитыКонтрагента(Контрагент, Отказ) Экспорт
                Реквизиты = ОбщегоНазначения.ЗначенияРеквизитовОбъекта(Контрагент, "ИНН, КПП, ЮрФизЛицо");
                Если ПустаяСтрока(Реквизиты.ИНН) Тогда
                    ОбщегоНазначения.СообщитьПользователю(
                        СтроковыеФункцииКлиентСервер.ПодставитьПараметрыВСтроку(
                            НСтр("ru = 'У контрагента %1 не заполнен ИНН'"), Контрагент),
                        Контрагент, "ИНН",, Отказ);
                КонецЕсли;
                Если ЭтоЮрЛицо(Реквизиты.ЮрФизЛицо) И ПустаяСтрока(Реквизиты.КПП) Тогда
                    ОбщегоНазначения.СообщитьПользователю(НСтр("ru = 'Не заполнен КПП'"), Контрагент, "КПП",, Отказ);
                КонецЕсли;
            КонецПроцедуры

            #КонецОбласти

            #Область СлужебныеПроцедурыИФункции

            Функция ЭтоЮрЛицо(ЮрФизЛицо)
                Возврат ЮрФизЛицо = Перечисления.ЮрФизЛицо.ЮрЛицо;
            КонецФункции

            #КонецОбласти
      - id: 1c-09-02
        title: Расширения конфигурации
        minutes: 35
        xp: 50
        theory: |
          Типовые конфигурации (УТ, ERP, Бухгалтерия) регулярно обновляются. Если править их напрямую («снять с поддержки»), каждое обновление превращается в долгое сравнение-объединение. **Расширения** решают проблему: доработки живут отдельно и накладываются поверх.

          ## Что умеют расширения

          - Добавлять **новые** объекты: справочники, документы, регистры, отчёты, роли, общие модули.
          - **Заимствовать** типовые объекты и добавлять им реквизиты, табличные части, формы, команды.
          - **Перехватывать** методы типовых модулей аннотациями.

          ## Аннотации

          ```bsl
          // Заимствованный модуль объекта документа РеализацияТоваровУслуг
          &После("ОбработкаПроведения")
          Процедура МоёРасширение_ОбработкаПроведения(Отказ, РежимПроведения)
              // выполнится после типового кода
              Движения.МойРегистр.Записывать = Истина;
              // ...
          КонецПроцедуры
          ```

          | Аннотация | Поведение |
          |---|---|
          | `&Перед("Метод")` | Ваш код до типового |
          | `&После("Метод")` | Ваш код после типового |
          | `&Вместо("Метод")` | Полная замена; типовой можно вызвать через `ПродолжитьВызов()` |
          | `&ИзменениеИКонтроль("Метод")` | Копия типового метода с вставками `#Вставка`/`#Удаление`; при обновлении платформа проверит, что исходник не изменился |

          ```bsl
          &ИзменениеИКонтроль("ЗаполнитьЦены")
          Процедура МоёРасширение_ЗаполнитьЦены()
              Для Каждого Строка Из Товары Цикл
                  Строка.Цена = ПолучитьЦену(Строка.Номенклатура);
                  #Вставка
                  Строка.Цена = Строка.Цена * 0.95;   // наша скидка
                  #КонецВставки
              КонецЦикла;
          КонецПроцедуры
          ```

          ## Префикс

          У расширения есть **префикс имён** (`мр_`), все новые объекты и методы называйте с ним — так не будет конфликтов с будущими версиями типовой.

          ## Ограничения и советы

          - Нельзя менять типы существующих реквизитов, удалять типовые объекты.
          - Предпочитайте `&После`/`&Перед` вместо `&Вместо` — меньше риск сломать логику при обновлении.
          - Расширение подключается в режиме Предприятие (Все функции → Управление расширениями) или в конфигураторе; есть флаг «Безопасный режим».
          - После обновления типовой проверяйте «Применимость» расширения.

          ## Внешние обработки

          Ещё один способ дорабатывать без изменения конфигурации — **внешние отчёты и обработки** (`.epf/.erf`), подключаемые через БСП «Дополнительные отчёты и обработки». Подходят для печатных форм и разовых задач.
        practice:
          - type: choice
            q: Главная причина использовать расширения в типовых конфигурациях?
            options: ["Они работают быстрее", "Доработки не мешают обновлению типовой конфигурации", "Не нужны права", "Можно менять типы реквизитов"]
            answer: 1
          - type: choice
            q: Какая аннотация позволяет полностью заменить метод с возможностью вызвать исходный?
            options: ["&Перед", "&После", "&Вместо", "&НаСервере"]
            answer: 2
          - type: fill
            q: Вызовите исходный метод из перехватчика &Вместо
            code: |
              &Вместо("ПередЗаписью")
              Процедура мр_ПередЗаписью(Отказ)
                  Если Не мр_НужнаПроверка() Тогда
                      ___(Отказ);
                  КонецЕсли;
              КонецПроцедуры
            answers: ["ПродолжитьВызов"]
          - type: fill
            q: Обозначьте вставку кода в методе с &ИзменениеИКонтроль
            code: |
              #___
              Строка.Цена = Строка.Цена * 0.95;
              #___
            answers: ["Вставка", "КонецВставки"]
          - type: bug
            q: Что не так в расширении с префиксом мр_?
            code: |
              // Новый общий модуль в расширении
              Функция ПолучитьСкидку(Контрагент) Экспорт
                  Возврат 5;
              КонецФункции
            bugLine: 2
            fix: Функция мр_ПолучитьСкидку(Контрагент) Экспорт
            explain: Новые методы и объекты расширения называют с префиксом, чтобы не конфликтовать с типовой.
        homework:
          task: |
            Создайте расширение «мр_Доработки» для своей учебной конфигурации: заимствуйте документ РеализацияТоваров, добавьте реквизит мр_Менеджер и вывод его на форму; через &После в ОбработкаПроведения — запись в новый регистр мр_ПродажиМенеджеров; через &ИзменениеИКонтроль — изменение расчёта суммы строки (округление до рубля).
          checklist:
            - Все новые объекты с префиксом
            - Используются &После и &ИзменениеИКонтроль
            - Реквизит выведен на заимствованную форму
          solution: |
            // Расширение мр_Доработки, модуль объекта Документ.РеализацияТоваров
            &После("ОбработкаПроведения")
            Процедура мр_ОбработкаПроведенияПосле(Отказ, Режим)
                Если Отказ Тогда Возврат; КонецЕсли;
                Движения.мр_ПродажиМенеджеров.Записывать = Истина;
                Для Каждого С Из Товары Цикл
                    Д = Движения.мр_ПродажиМенеджеров.Добавить();
                    Д.Период = Дата;
                    Д.Менеджер = мр_Менеджер;
                    Д.Номенклатура = С.Номенклатура;
                    Д.Сумма = С.Сумма;
                КонецЦикла;
            КонецПроцедуры

            // Модуль формы документа (заимствованной)
            &НаКлиенте
            &ИзменениеИКонтроль("ТоварыКоличествоПриИзменении")
            Процедура мр_ТоварыКоличествоПриИзменении(Элемент)
                Строка = Элементы.Товары.ТекущиеДанные;
                Строка.Сумма = Строка.Количество * Строка.Цена;
                #Вставка
                Строка.Сумма = Окр(Строка.Сумма, 0);
                #КонецВставки
            КонецПроцедуры
      - id: 1c-09-03
        title: Хранилище конфигурации и Git (EDT)
        minutes: 35
        xp: 50
        theory: |
          Над одной конфигурацией работает команда — нужна **система контроля версий**. В 1С два подхода.

          ## Хранилище конфигурации (классика)

          Встроено в конфигуратор: Конфигурация → Хранилище конфигурации → Подключиться.

          - **Захват** объекта — блокирует его для других («только я меняю справочник Номенклатура»).
          - **Поместить** изменения — с комментарием, объект освобождается.
          - **История** — версии, сравнение, откат.
          - Минусы: блокировки на уровне объекта, нет веток, неудобный code review.

          ## Git + 1C:EDT (современный путь)

          **1C:Enterprise Development Tools** — среда на Eclipse. Конфигурация хранится как **файлы исходников** (`.bsl`, `.mdo`, `.form`), поэтому работает обычный Git: ветки, pull request, review, CI.

          ```text
          src/
            Catalogs/Номенклатура/Номенклатура.mdo
            Catalogs/Номенклатура/ObjectModule.bsl
            Documents/РеализацияТоваров/Forms/ФормаДокумента/Module.bsl
          ```

          Типичный процесс (Git flow):

          ```bash
          git checkout -b feature/скидки-по-картам
          # правки в EDT, проверка на своей базе
          git add .
          git commit -m "Скидки по дисконтным картам в заказе"
          git push origin feature/скидки-по-картам
          # Pull Request → ревью → merge в develop
          ```

          ## Выгрузка в файлы из конфигуратора

          Даже без EDT можно хранить исходники в Git:

          ```bash
          1cv8 DESIGNER /F"C:\Base" /DumpConfigToFiles "C:\repo\src"
          1cv8 DESIGNER /F"C:\Base" /LoadConfigFromFiles "C:\repo\src" /UpdateDBCfg
          ```

          Инструменты **GitSync** / **precommit1c** (OneScript) автоматизируют синхронизацию хранилища с Git и разбор внешних обработок на исходники.

          ## CI/CD для 1С

          - Сборка базы из исходников, синтаксический контроль (`/CheckModules`).
          - Статический анализ (BSL Language Server, SonarQube).
          - Автотесты (YAxUnit, Vanessa Automation — следующий урок).
          - Инструменты: **vanessa-runner**, **OneScript**, Jenkins / GitLab CI / GitHub Actions.

          ## Хорошие коммиты

          - Один коммит — одна логическая задача.
          - Сообщение — что и зачем: «Исправлен расчёт НДС при возврате (задача #123)».
          - Не коммитьте `.cf`/`.dt` бинарники — только исходники.
        practice:
          - type: choice
            q: Что происходит при захвате объекта в хранилище конфигурации?
            options: ["Объект удаляется", "Объект блокируется для изменения другими разработчиками", "Создаётся ветка", "Объект выгружается в Git"]
            answer: 1
          - type: choice
            q: Главное преимущество EDT + Git перед хранилищем?
            options: ["Не нужна платформа", "Ветки, pull request и code review", "Нет исходников", "Работает только в файловом варианте"]
            answer: 1
          - type: order
            q: Расставьте шаги работы с задачей в Git
            lines:
              - git checkout -b feature/task-42
              - Внести и проверить изменения
              - git add .
              - git commit -m "Описание изменений"
              - git push origin feature/task-42
              - Создать Pull Request на ревью
          - type: fill
            q: Выгрузите конфигурацию в файлы из командной строки
            code: |
              1cv8 DESIGNER /F"C:\Base" /___ "C:\repo\src"
            answers: ["DumpConfigToFiles"]
          - type: choice
            q: Что НЕ стоит коммитить в репозиторий?
            options: ["Файлы .bsl", "Файлы .mdo", "Бинарные выгрузки .dt базы", "README.md"]
            answer: 2
        homework:
          task: |
            Заведите репозиторий для учебной конфигурации: выгрузите её в файлы (DumpConfigToFiles или импорт в EDT), создайте .gitignore, первый коммит. Сделайте ветку с доработкой (новый реквизит + код), закоммитьте, слейте через merge request (GitHub/GitLab). Напишите bat/sh-скрипт, который выгружает конфигурацию и делает коммит с датой.
          checklist:
            - Исходники в Git, бинарники в .gitignore
            - Работа через ветку и merge
            - Скрипт автоматической выгрузки
          solution: |
            :: dump.bat — выгрузка конфигурации и коммит
            @echo off
            set BASE=C:\Bases\Training
            set REPO=C:\repo\training
            "C:\Program Files\1cv8\8.3.24.1342\bin\1cv8.exe" DESIGNER /F"%BASE%" /N"Админ" /P"" ^
              /DumpConfigToFiles "%REPO%\src" -update /Out "%REPO%\dump.log"
            cd /d %REPO%
            git add src
            git commit -m "Выгрузка конфигурации %date% %time%"
            git push

            :: .gitignore
            :: *.cf
            :: *.dt
            :: *.1CD
            :: dump.log
            :: ConfigDumpInfo.xml
      - id: 1c-09-04
        title: Тестирование — Vanessa Automation
        minutes: 40
        xp: 50
        theory: |
          Ручная проверка «прокликать всё после изменений» не масштабируется. В 1С используют два вида автотестов.

          ## Модульные тесты — YAxUnit

          **YAxUnit** — фреймворк модульного тестирования в виде расширения. Тесты — это общие модули расширения:

          ```bsl
          Процедура ИсполняемыеСценарии() Экспорт
              ЮТТесты
                  .ДобавитьТест("РасчетСкидки_Постоянный")
                  .ДобавитьТест("РасчетСкидки_Новый");
          КонецПроцедуры

          Процедура РасчетСкидки_Постоянный() Экспорт
              Результат = РасчетСкидок.Процент(5000, Истина);
              ЮТест.ОжидаетЧто(Результат).Равно(10);
          КонецПроцедуры

          Процедура РасчетСкидки_Новый() Экспорт
              ЮТест.ОжидаетЧто(РасчетСкидок.Процент(5000, Ложь)).Равно(0);
          КонецПроцедуры
          ```

          Хорошо тестируются **чистые функции** — расчёты без обращения к базе. Поэтому логику выносят из форм в общие модули.

          ## Сценарные тесты — Vanessa Automation

          **Vanessa Automation** (VA) — инструмент BDD: тесты пишутся на языке **Gherkin** по-русски и выполняются, управляя клиентом 1С как пользователь.

          ```gherkin
          #language: ru
          Функционал: Продажа товара

          Сценарий: Проведение реализации уменьшает остаток
              Дано Я открываю навигационную ссылку "e1cib/list/Документ.РеализацияТоваров"
              И я нажимаю на кнопку с именем 'ФормаСоздать'
              Когда в поле с именем 'Контрагент' я ввожу текст "Альфа"
              И в таблице "Товары" я нажимаю на кнопку с именем 'ТоварыДобавить'
              И в таблице "Товары" в поле с именем 'ТоварыНоменклатура' я ввожу текст "Хлеб"
              И в таблице "Товары" в поле с именем 'ТоварыКоличество' я ввожу текст "2"
              И я нажимаю на кнопку с именем 'ФормаПровестиИЗакрыть'
              Тогда открылось окно "Реализации товаров"
          ```

          Ключевые слова: **Дано** (начальное состояние), **Когда** (действие), **Тогда** (проверка), **И** (продолжение).

          VA умеет:

          - **записывать действия** пользователя в сценарий (кнопка «Начать запись»);
          - готовить тестовые данные (шаги «Я создаю…» / «Дано Я загружаю данные»);
          - делать скриншоты, видеоинструкции, отчёты в Allure/JUnit для CI.

          Запуск: обработка `vanessa-automation.epf` в режиме **тестового менеджера**, тестируемая база — в режиме **тестового клиента** (`/TESTCLIENT`).

          ## Пирамида тестов

          | Уровень | Инструмент | Сколько |
          |---|---|---|
          | Модульные | YAxUnit | Много, быстрые |
          | Интеграционные | YAxUnit + база | Средне |
          | Сценарные UI | Vanessa Automation | Немного, ключевые процессы |

          > Добавляйте тест на каждую найденную ошибку — она больше не вернётся.
