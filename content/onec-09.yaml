      - id: 1c-09-05
        title: Подготовка к сертификации «1С:Специалист»
        minutes: 35
        xp: 50
        theory: |
          Сертификаты 1С ценятся работодателями и напрямую влияют на зарплату и статус партнёра.

          ## Лестница сертификатов

          | Сертификат | Формат | Что проверяет |
          |---|---|---|
          | **1С:Профессионал** по платформе | Тест 14 вопросов за 20 минут, нужно ≥ 11 | Знание платформы «вширь» |
          | 1С:Профессионал по конфигурациям (УТ, ERP, ЗУП…) | Тест | Знание прикладных решений |
          | **1С:Специалист** по платформе | Практика: задача за ~4 часа на чистой конфигурации + собеседование | Умение решать задачи учёта |
          | 1С:Специалист-консультант | Практика в типовой | Настройка без программирования |
          | 1С:Эксперт по технологическим вопросам | Высокий уровень | Производительность, нагрузка |

          ## Как готовиться к Профессионалу

          - Официальные тренажёры («1С:Профессионал. Платформа») — сотни вопросов с ответами.
          - Книги: «Разработка сложных отчётов в 1С (СКД)», «Профессиональная разработка в системе 1С:Предприятие 8», «Простые примеры разработки».
          - Решайте тесты, пока не будет стабильно 95%.

          ## Специалист по платформе — экзамен

          Дают задачу: оперативный учёт товаров (партии, FIFO, себестоимость), расчёт, бухгалтерия или зарплата. Нужно:

          1. Спроектировать метаданные (регистры, документы).
          2. Реализовать **проведение по новой методике** с контролем остатков и **управляемыми блокировками**.
          3. Написать отчёт на СКД.
          4. Объяснить экзаменатору решение и ответить на вопросы.

          Частые причины провала:

          - Запросы в цикле, обращения через точку в проведении.
          - Нет блокировок или неправильный режим.
          - Ошибки в FIFO: двойное списание партии, неверная сумма последней части.
          - Неправильная граница при неоперативном проведении.
          - Не уложились во время — тренируйтесь на задачах прошлых лет (есть в сборниках «1С:Специалист»).

          ## Чек-лист перед экзаменом

          - Наизусть: структура проведения, блокировка, запрос остатков партий, СКД-отчёт с параметрами.
          - Скорость: создавать метаданные за минуты, пользоваться шаблонами текста и конструктором запросов.
          - Знать отличие `МоментВремени` и `Граница`, `Остатки` и `ОстаткиИОбороты`, СрезПоследних.
          - Уметь пояснить каждый шаг решения вслух.

          > Этот курс покрыл все темы платформенного экзамена. Следующий урок — итоговый проект в формате, близком к «Специалисту».
