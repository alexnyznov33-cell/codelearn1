        homework:
          task: |
            Пройдите пробный тест (14 вопросов, 20 минут) из тренажёра «1С:Профессионал» или онлайн-демо и запишите результат. Решите на время (не более 4 часов) задачу: учёт товаров по партиям FIFO с контролем остатков, оперативным и неоперативным проведением, отчётом «Валовая прибыль» на СКД. Запишите, где потеряли больше всего времени.
          checklist:
            - Результат пробного теста записан
            - Задача решена с блокировками и контролем
            - Отчёт на СКД
            - Разбор потерь времени
          solution: |
            // Схема решения (каркас проведения для задачи «Специалиста»)
            Процедура ОбработкаПроведения(Отказ, Режим)
                // 1. Блокировка партий по товарам документа
                Блокировка = Новый БлокировкаДанных;
                Э = Блокировка.Добавить("РегистрНакопления.ПартииТоваров");
                Э.Режим = РежимБлокировкиДанных.Исключительный;
                Э.ИсточникДанных = Товары;
                Э.ИспользоватьИзИсточникаДанных("Номенклатура", "Номенклатура");
                Блокировка.Заблокировать();

                // 2. Остатки партий на нужную границу
                Граница = ?(Режим = РежимПроведенияДокумента.Оперативный, Неопределено,
                    Новый Граница(МоментВремени(), ВидГраницы.Исключая));
                Движения.ПартииТоваров.Записывать = Истина;
                Движения.Продажи.Записывать = Истина;
                Движения.ПартииТоваров.Записать();   // очистить старые движения

                // 3. Списание FIFO (см. урок «Партионный учёт»), движения Продажи с себестоимостью
                // 4. При нехватке и оперативном режиме — Отказ с сообщением
            КонецПроцедуры

            // Отчёт Валовая прибыль (СКД):
            // ВЫБРАТЬ П.Номенклатура, П.ВыручкаОборот КАК Выручка, П.СебестоимостьОборот КАК Себестоимость
            // ИЗ РегистрНакопления.Продажи.Обороты(&НачалоПериода, &КонецПериода) КАК П
            // Вычисляемое поле: ВаловаяПрибыль = Выручка - Себестоимость
      - id: 1c-09-06
        title: "Итоговый проект: конфигурация «Склад и продажи»"
        minutes: 60
        xp: 100
        theory: |
          Пора собрать всё вместе. Итоговый проект — небольшая, но «настоящая» конфигурация, которую можно показать на собеседовании.

          ## Требования

          **Метаданные**

          - Справочники: Номенклатура (иерархия, вид: товар/услуга), Склады, Контрагенты, Пользователи (с подразделением).
          - Регистр сведений Цены (периодический).
          - Регистры накопления: ПартииТоваров (остатки), Продажи (обороты: количество, выручка, себестоимость).
          - Документы: ПоступлениеТоваров, РеализацияТоваров (ввод на основании ЗаказаКлиента), ЗаказКлиента.

          **Учёт**

          - Поступление — приход партий.
          - Реализация — FIFO, новая методика проведения, управляемые блокировки, контроль остатков только при оперативном проведении.
          - Цены автоматически подставляются из регистра при выборе товара.

          **Интерфейс и отчёты**

          - Удобные управляемые формы, расчёт суммы строки, итог документа.
          - Отчёт «Остатки и стоимость» и «Валовая прибыль» на СКД с параметрами и группировками.
          - Печатная форма «Расходная накладная».

          **Интеграция и администрирование**

          - HTTP-сервис `GET /api/stock` — остатки в JSON.
          - Регламентное задание: ночной пересчёт и логирование.
          - Роли Менеджер/Кладовщик/Администратор, RLS на документы по подразделению.

          **Качество**

          - Стандарты: области, комментарии, без запросов в цикле.
          - Исходники в Git, 3–5 модульных тестов на расчёты.

          ## Порядок работы

          1. Метаданные и формы → 2. Проведение и FIFO → 3. Отчёты и печать → 4. HTTP и задание → 5. Роли → 6. Тесты, README, публикация на GitHub.

          ## Ключевой фрагмент — проверка остатков

          ```bsl
          Процедура ПроверитьОстатки(Отказ)
              Запрос = Новый Запрос(
              "ВЫБРАТЬ Ост.Номенклатура, -Ост.КоличествоОстаток КАК Нехватка
              |ИЗ РегистрНакопления.ПартииТоваров.Остатки(,
              |    Номенклатура В (&Товары) И Склад = &Склад) КАК Ост
              |ГДЕ Ост.КоличествоОстаток < 0");
              Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
              Запрос.УстановитьПараметр("Склад", Склад);
              Выборка = Запрос.Выполнить().Выбрать();
              Пока Выборка.Следующий() Цикл
                  ОбщегоНазначения.СообщитьПользователю(
                      СтрШаблон("Не хватает %1 ед. товара %2", Выборка.Нехватка, Выборка.Номенклатура),,,, Отказ);
              КонецЦикла;
          КонецПроцедуры
          ```

          > После проекта вы готовы к позиции Middle-разработчика 1С и экзамену «1С:Специалист» по платформе. Поздравляем! 🎉
