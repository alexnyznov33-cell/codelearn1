        homework:
          task: |
            Реализуйте конфигурацию «Склад и продажи» по требованиям урока. Опубликуйте исходники на GitHub с README: описание, скриншоты форм и отчётов, схема метаданных, инструкция по развёртыванию, примеры запросов к HTTP-сервису. Это ваше портфолио для собеседования.
          checklist:
            - Все документы проводятся по новой методике с блокировками
            - FIFO без двойного списания
            - Два отчёта на СКД и печатная форма
            - HTTP-сервис, регламентное задание, роли и RLS
            - Исходники в Git с README и тестами
          solution: |
            // Модуль объекта РеализацияТоваров (ядро проекта)
            #Область ОбработчикиСобытий

            Процедура ОбработкаПроведения(Отказ, Режим)
                ЗаблокироватьПартии();
                Движения.ПартииТоваров.Записывать = Истина;
                Движения.Продажи.Записывать = Истина;
                Движения.ПартииТоваров.Записать();

                Списания = ПартионныйУчет.РассчитатьСписание(Товары.Выгрузить(), Склад,
                    ?(Режим = РежимПроведенияДокумента.Оперативный, Неопределено,
                      Новый Граница(МоментВремени(), ВидГраницы.Исключая)), Ложь);

                Для Каждого С Из Списания Цикл
                    Д = Движения.ПартииТоваров.ДобавитьРасход();
                    Д.Период = Дата; Д.Склад = Склад;
                    ЗаполнитьЗначенияСвойств(Д, С);
                КонецЦикла;

                Себестоимость = Списания.Скопировать();
                Себестоимость.Свернуть("Номенклатура", "Сумма");
                Для Каждого Стр Из Товары Цикл
                    П = Движения.Продажи.Добавить();
                    П.Период = Дата;
                    П.Номенклатура = Стр.Номенклатура;
                    П.Контрагент = Контрагент;
                    П.Количество = Стр.Количество;
                    П.Выручка = Стр.Сумма;
                    НайденнаяСтрока = Себестоимость.Найти(Стр.Номенклатура, "Номенклатура");
                    П.Себестоимость = ?(НайденнаяСтрока = Неопределено, 0, НайденнаяСтрока.Сумма);
                    Если НайденнаяСтрока <> Неопределено Тогда НайденнаяСтрока.Сумма = 0; КонецЕсли;
                КонецЦикла;

                Движения.Записать();
                Если Режим = РежимПроведенияДокумента.Оперативный Тогда
                    ПроверитьОстатки(Отказ);
                КонецЕсли;
            КонецПроцедуры

            #КонецОбласти

            #Область СлужебныеПроцедурыИФункции

            Процедура ЗаблокироватьПартии()
                Блокировка = Новый БлокировкаДанных;
                Э = Блокировка.Добавить("РегистрНакопления.ПартииТоваров");
                Э.Режим = РежимБлокировкиДанных.Исключительный;
                Э.ИсточникДанных = Товары;
                Э.ИспользоватьИзИсточникаДанных("Номенклатура", "Номенклатура");
                Э.УстановитьЗначение("Склад", Склад);
                Блокировка.Заблокировать();
            КонецПроцедуры

            Процедура ПроверитьОстатки(Отказ)
                Запрос = Новый Запрос(
                "ВЫБРАТЬ Ост.Номенклатура, -Ост.КоличествоОстаток КАК Нехватка
                |ИЗ РегистрНакопления.ПартииТоваров.Остатки(,
                |  Номенклатура В (&Товары) И Склад = &Склад) КАК Ост
                |ГДЕ Ост.КоличествоОстаток < 0");
                Запрос.УстановитьПараметр("Товары", Товары.ВыгрузитьКолонку("Номенклатура"));
                Запрос.УстановитьПараметр("Склад", Склад);
                Выборка = Запрос.Выполнить().Выбрать();
                Пока Выборка.Следующий() Цикл
                    ОбщегоНазначения.СообщитьПользователю(
                        СтрШаблон("Не хватает %1 ед. товара %2", Выборка.Нехватка, Выборка.Номенклатура),,,, Отказ);
                КонецЦикла;
            КонецПроцедуры

            #КонецОбласти

            // HTTP-сервис api, шаблон /stock, метод GET
            Функция StockGet(Запрос)
                Q = Новый Запрос("ВЫБРАТЬ Ост.Номенклатура.Код КАК code, Ост.Номенклатура.Наименование КАК name,
                |  СУММА(Ост.КоличествоОстаток) КАК qty
                |ИЗ РегистрНакопления.ПартииТоваров.Остатки КАК Ост
                |СГРУППИРОВАТЬ ПО Ост.Номенклатура.Код, Ост.Номенклатура.Наименование");
                Массив = Новый Массив;
                Выборка = Q.Выполнить().Выбрать();
                Пока Выборка.Следующий() Цикл
                    Массив.Добавить(Новый Структура("code, name, qty", Выборка.code, Выборка.name, Выборка.qty));
                КонецЦикла;
                З = Новый ЗаписьJSON; З.УстановитьСтроку();
                ЗаписатьJSON(З, Массив);
                Ответ = Новый HTTPСервисОтвет(200);
                Ответ.Заголовки.Вставить("Content-Type", "application/json; charset=utf-8");
                Ответ.УстановитьТелоИзСтроки(З.Закрыть());
                Возврат Ответ;
            КонецФункции
