        homework:
          task: |
            Создайте Minimal API «Заметки» (in-memory хранилище в ConcurrentDictionary): CRUD `/api/notes` с группой маршрутов, пагинацией и поиском `?q=`, корректные коды (201 + Location, 204, 404), DTO для создания/обновления, Swagger. Затем перепишите `GET /{id}` и `POST` на контроллер и сравните.
          checklist:
            - Используется MapGroup
            - Хранилище зарегистрировано в DI
            - Коды ответов соответствуют REST
          solution: |
            using System.Collections.Concurrent;

            var b = WebApplication.CreateBuilder(args);
            b.Services.AddSingleton<NoteStore>();
            b.Services.AddEndpointsApiExplorer().AddSwaggerGen();
            var app = b.Build();
            app.UseSwagger(); app.UseSwaggerUI();

            var g = app.MapGroup("/api/notes");
            g.MapGet("/", (NoteStore s, string? q, int page = 1, int size = 10) =>
                s.All.Where(n => q == null || n.Text.Contains(q, StringComparison.OrdinalIgnoreCase))
                     .OrderBy(n => n.Id).Skip((page - 1) * size).Take(size));
            g.MapGet("/{id:int}", (int id, NoteStore s) => s.Items.TryGetValue(id, out var n) ? Results.Ok(n) : Results.NotFound());
            g.MapPost("/", (NoteDto dto, NoteStore s) => { var n = s.Add(dto.Text); return Results.Created($"/api/notes/{n.Id}", n); });
            g.MapPut("/{id:int}", (int id, NoteDto dto, NoteStore s) =>
            {
                if (!s.Items.ContainsKey(id)) return Results.NotFound();
                s.Items[id] = new Note(id, dto.Text);
                return Results.NoContent();
            });
            g.MapDelete("/{id:int}", (int id, NoteStore s) => s.Items.TryRemove(id, out _) ? Results.NoContent() : Results.NotFound());
            app.Run();

            public record Note(int Id, string Text);
            public record NoteDto(string Text);
            public class NoteStore
            {
                private int last;
                public ConcurrentDictionary<int, Note> Items { get; } = new();
                public IEnumerable<Note> All => Items.Values;
                public Note Add(string text) { var n = new Note(Interlocked.Increment(ref last), text); Items[n.Id] = n; return n; }
            }
      - id: cs-09-03
        title: Внедрение зависимостей (DI)
        minutes: 30
        xp: 40
        theory: |
          **Dependency Injection** — класс не создаёт свои зависимости сам (`new`), а получает их извне, обычно через конструктор. Это даёт слабую связанность и возможность подменять реализации в тестах.

          ```csharp
          // ❌ жёсткая связь
          public class OrderService { private readonly SmtpSender sender = new(); }

          // ✅ зависимость от абстракции, внедрение через конструктор
          public class OrderService(IEmailSender sender, IOrderRepository repo, ILogger<OrderService> log)
          {
              public async Task PlaceAsync(Order o)
              {
                  await repo.AddAsync(o);
                  await sender.SendAsync(o.Email, "Заказ принят");
                  log.LogInformation("Заказ {Id} создан", o.Id);
              }
          }
          ```

          ## Регистрация в контейнере

          ```csharp
          builder.Services.AddSingleton<IClock, SystemClock>();
          builder.Services.AddScoped<IOrderRepository, EfOrderRepository>();
          builder.Services.AddTransient<IEmailSender, SmtpEmailSender>();
          builder.Services.AddDbContext<ShopContext>(...);      // Scoped
          builder.Services.AddHttpClient<IWeatherApi, WeatherApi>(c => c.BaseAddress = new("https://api.weather"));
          ```

          ## Время жизни

          | Lifetime | Экземпляр | Пример |
          |---|---|---|
          | Singleton | один на всё приложение | кеш, конфиг, `HttpClient`-фабрика |
          | Scoped | один на HTTP-запрос | `DbContext`, unit of work |
          | Transient | новый при каждом запросе из контейнера | лёгкие сервисы без состояния |

          **Captive dependency**: Singleton не должен зависеть от Scoped — scoped-объект «застрянет» навсегда (DbContext на всё приложение = беда). В Development ASP.NET Core проверяет это и бросает исключение.

          Если Singleton/фоновому сервису нужен scoped-сервис:

          ```csharp
          public class Cleaner(IServiceScopeFactory f) : BackgroundService
          {
              protected override async Task ExecuteAsync(CancellationToken ct)
              {
                  using var scope = f.CreateScope();
                  var db = scope.ServiceProvider.GetRequiredService<ShopContext>();
                  // ...
              }
          }
          ```

          ## Полезное

          - Несколько реализаций: `IEnumerable<INotifier>` в конструкторе получит все.
          - Keyed services (.NET 8): `AddKeyedSingleton<ICache, RedisCache>("redis")` + `[FromKeyedServices("redis")]`.
          - Options pattern: `builder.Services.Configure<SmtpOptions>(builder.Configuration.GetSection("Smtp"))` → `IOptions<SmtpOptions>`.
          - Избегайте **Service Locator** (`provider.GetService` внутри бизнес-кода) — зависимости становятся неявными.
          - Слишком много параметров в конструкторе (>5) — сигнал, что класс делает слишком много.
