        homework:
          task: |
            Добавьте в API: (1) middleware замера времени запроса с логированием медленных (>500 мс) как Warning, (2) CorrelationId middleware, (3) `SmtpOptions` с валидацией `[Required]`, `[Range]` и `ValidateOnStart`, (4) разные уровни логов для Development и Production через appsettings.{env}.json, (5) пароль — через user-secrets.
          checklist:
            - Middleware зарегистрированы в правильном порядке
            - Приложение не стартует при неверном конфиге
            - Секрет не попал в Git
          solution: |
            public class SmtpOptions
            {
                [Required] public string Host { get; set; } = "";
                [Range(1, 65535)] public int Port { get; set; }
                [Required] public string Password { get; set; } = "";
            }

            builder.Services.AddOptions<SmtpOptions>().BindConfiguration("Smtp").ValidateDataAnnotations().ValidateOnStart();
            var app = builder.Build();

            app.UseExceptionHandler("/error");
            app.UseMiddleware<CorrelationIdMiddleware>();
            app.Use(async (ctx, next) =>
            {
                var sw = Stopwatch.StartNew();
                await next(ctx);
                var level = sw.ElapsedMilliseconds > 500 ? LogLevel.Warning : LogLevel.Information;
                app.Logger.Log(level, "{Method} {Path} -> {Status} за {Ms} мс",
                    ctx.Request.Method, ctx.Request.Path, ctx.Response.StatusCode, sw.ElapsedMilliseconds);
            });

            // appsettings.Development.json: { "Logging": { "LogLevel": { "Default": "Debug" } } }
            // appsettings.Production.json:  { "Logging": { "LogLevel": { "Default": "Warning" } } }
            // dotnet user-secrets init && dotnet user-secrets set "Smtp:Password" "secret"
      - id: cs-09-05
        title: Валидация и обработка ошибок
        minutes: 30
        xp: 40
        theory: |
          ## Валидация входных данных

          **Data Annotations** — быстро и встроенно:

          ```csharp
          public record CreateUserDto(
              [Required, StringLength(50, MinimumLength = 2)] string Name,
              [Required, EmailAddress] string Email,
              [Range(18, 120)] int Age);
          ```

          С `[ApiController]` невалидная модель автоматически даёт `400` с `ValidationProblemDetails`. В Minimal API (.NET 8) — используйте фильтр или FluentValidation; в .NET 10 появилась встроенная `AddValidation()`.

          **FluentValidation** — гибкие правила в отдельном классе:

          ```csharp
          public class CreateUserValidator : AbstractValidator<CreateUserDto>
          {
              public CreateUserValidator(IUserRepo repo)
              {
                  RuleFor(x => x.Name).NotEmpty().Length(2, 50);
                  RuleFor(x => x.Email).NotEmpty().EmailAddress()
                      .MustAsync(async (e, ct) => !await repo.EmailExistsAsync(e, ct)).WithMessage("Email занят");
                  RuleFor(x => x.Age).InclusiveBetween(18, 120);
              }
          }

          app.MapPost("/users", async (CreateUserDto dto, IValidator<CreateUserDto> v) =>
          {
              var r = await v.ValidateAsync(dto);
              if (!r.IsValid) return Results.ValidationProblem(r.ToDictionary());
              // ...
              return Results.Created();
          });
          ```

          ## Глобальная обработка ошибок

          Не пишите try/catch в каждом эндпоинте. Используйте `IExceptionHandler` (.NET 8) + ProblemDetails:

          ```csharp
          public class NotFoundException(string msg) : Exception(msg);

          public class GlobalExceptionHandler(ILogger<GlobalExceptionHandler> log) : IExceptionHandler
          {
              public async ValueTask<bool> TryHandleAsync(HttpContext ctx, Exception ex, CancellationToken ct)
              {
                  var (status, title) = ex switch
                  {
                      NotFoundException => (404, "Не найдено"),
                      ValidationException => (400, "Ошибка валидации"),
                      _ => (500, "Внутренняя ошибка")
                  };
                  if (status == 500) log.LogError(ex, "Необработанная ошибка");

                  ctx.Response.StatusCode = status;
                  await ctx.Response.WriteAsJsonAsync(new ProblemDetails
                  {
                      Status = status, Title = title,
                      Detail = status == 500 ? null : ex.Message,     // не раскрываем внутренности
                      Instance = ctx.Request.Path
                  }, ct);
                  return true;
              }
          }

          builder.Services.AddExceptionHandler<GlobalExceptionHandler>();
          builder.Services.AddProblemDetails();
          app.UseExceptionHandler();
          ```

          ## Принципы

          - Валидируйте **на границе** (DTO), инварианты — в доменной модели.
          - Клиенту — понятное сообщение без стектрейса; в лог — полную информацию.
          - Ожидаемые бизнес-ошибки можно возвращать через Result-тип (`Result<T>`/OneOf) вместо исключений.
          - 400 — неверный формат, 404 — нет ресурса, 409 — конфликт состояния, 422 — бизнес-правило нарушено.
        practice:
          - type: fill
            q: Сделайте поле обязательным и не длиннее 100 символов
