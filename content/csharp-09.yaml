              builder.Services.AddScoped<IUserRepo, UserRepo>();      // зависит от AppDb
              builder.Services.AddSingleton<IUserCache, UserCache>(); // зависит от IUserRepo
              builder.Services.AddTransient<IMailer, Mailer>();
            bugLine: 3
            explain: Singleton UserCache захватит scoped UserRepo (и DbContext) на всё время жизни приложения.
        homework:
          task: |
            Приложение «Уведомления»: интерфейсы `IClock`, `INotificationSender` (Email, Telegram — две реализации), `INotificationService`. Зарегистрируйте с правильными lifetime, внедрите `IEnumerable<INotificationSender>`, настройки через Options pattern (`appsettings.json` секция `Notifications`), эндпоинт `POST /notify`. Напишите unit-тест сервиса с фейковыми зависимостями без контейнера.
          checklist:
            - Нет new зависимостей внутри сервисов
            - Нет captive dependency
            - Тест не использует ASP.NET
          solution: |
            builder.Services.Configure<NotificationOptions>(builder.Configuration.GetSection("Notifications"));
            builder.Services.AddSingleton<IClock, SystemClock>();
            builder.Services.AddScoped<INotificationSender, EmailSender>();
            builder.Services.AddScoped<INotificationSender, TelegramSender>();
            builder.Services.AddScoped<INotificationService, NotificationService>();

            app.MapPost("/notify", async (NotifyDto dto, INotificationService s, CancellationToken ct) =>
            {
                await s.NotifyAsync(dto.To, dto.Text, ct);
                return Results.Accepted();
            });

            public class NotificationService(IEnumerable<INotificationSender> senders, IClock clock, IOptions<NotificationOptions> opt)
                : INotificationService
            {
                public async Task NotifyAsync(string to, string text, CancellationToken ct)
                {
                    var msg = $"[{clock.Now:t}] {opt.Value.Prefix} {text}";
                    foreach (var s in senders) await s.SendAsync(to, msg, ct);
                }
            }

            // тест
            var fake = new FakeSender();
            var svc = new NotificationService([fake], new FixedClock(new DateTime(2024, 1, 1, 9, 0, 0)),
                Options.Create(new NotificationOptions { Prefix = "Shop:" }));
            await svc.NotifyAsync("a", "hi", default);
            Assert.Equal("[09:00] Shop: hi", fake.Last);
      - id: cs-09-04
        title: Middleware и конфигурация
        minutes: 30
        xp: 40
        theory: |
          ## Конвейер middleware

          Каждый HTTP-запрос проходит через цепочку компонентов (middleware). Каждый может обработать запрос, изменить его, передать дальше (`next`) или прервать цепочку.

          ```csharp
          app.UseExceptionHandler();     // ловит исключения всех следующих
          app.UseHttpsRedirection();
          app.UseStaticFiles();
          app.UseCors();
          app.UseAuthentication();       // кто ты?
          app.UseAuthorization();        // что тебе можно?
          app.UseRateLimiter();
          app.MapControllers();          // эндпоинты
          ```

          **Порядок важен!** Например, `UseAuthentication` должен быть раньше `UseAuthorization`, обработчик исключений — первым.

          ## Свой middleware

          ```csharp
          // inline
          app.Use(async (ctx, next) =>
          {
              var sw = Stopwatch.StartNew();
              await next(ctx);                                   // остальная цепочка
              app.Logger.LogInformation("{Path} {Status} {Ms}мс", ctx.Request.Path, ctx.Response.StatusCode, sw.ElapsedMilliseconds);
          });

          // классом
          public class CorrelationIdMiddleware(RequestDelegate next)
          {
              public async Task InvokeAsync(HttpContext ctx)
              {
                  var id = ctx.Request.Headers["X-Correlation-Id"].FirstOrDefault() ?? Guid.NewGuid().ToString();
                  ctx.Response.Headers["X-Correlation-Id"] = id;
                  await next(ctx);
              }
          }
          app.UseMiddleware<CorrelationIdMiddleware>();
          ```

          Middleware — Singleton; scoped-сервисы принимайте параметром `InvokeAsync(HttpContext ctx, AppDb db)`.

          ## Конфигурация

          Источники (каждый следующий переопределяет предыдущий):
          `appsettings.json` → `appsettings.{Environment}.json` → **User Secrets** (Development) → переменные окружения → аргументы командной строки.

          ```json
          {
            "ConnectionStrings": { "Default": "Host=localhost;Database=shop" },
            "Smtp": { "Host": "smtp.mail.ru", "Port": 587 }
          }
          ```

          ```csharp
          var cs = builder.Configuration.GetConnectionString("Default");
          int port = builder.Configuration.GetValue<int>("Smtp:Port");

          builder.Services.AddOptions<SmtpOptions>()
              .Bind(builder.Configuration.GetSection("Smtp"))
              .ValidateDataAnnotations()
              .ValidateOnStart();                  // упасть при старте, если конфиг неверный
          ```

          Переменная окружения для вложенного ключа: `Smtp__Port=2525`. Окружение задаёт `ASPNETCORE_ENVIRONMENT` (Development/Staging/Production).

          `IOptions<T>` — значение при старте; `IOptionsSnapshot<T>` — перечитывается на каждый запрос; `IOptionsMonitor<T>` — с уведомлением об изменениях.

          > ⚠️ Секреты (пароли, ключи) — **не в appsettings.json в Git**: `dotnet user-secrets set "Smtp:Password" "..."` локально, переменные окружения/Vault в проде.
