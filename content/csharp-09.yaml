        homework:
          task: |
            В API «Заметки» добавьте: FluentValidation для создания (текст 1–1000 символов, теги ≤ 5, каждый тег ≤ 20 символов, уникальность заголовка через репозиторий), свои исключения `NotFoundException`, `ConflictException`, глобальный `IExceptionHandler`, возвращающий ProblemDetails с traceId. Напишите 3 запроса в `.http`-файле, получающих 400, 404 и 409.
          checklist:
            - Валидатор зарегистрирован в DI
            - Нет try/catch в эндпоинтах
            - В ответе 500 нет деталей исключения
          solution: |
            public class CreateNoteValidator : AbstractValidator<CreateNoteDto>
            {
                public CreateNoteValidator(INoteRepo repo)
                {
                    RuleFor(x => x.Text).NotEmpty().MaximumLength(1000);
                    RuleFor(x => x.Tags).Must(t => t.Count <= 5).WithMessage("Не более 5 тегов");
                    RuleForEach(x => x.Tags).MaximumLength(20);
                    RuleFor(x => x.Title).MustAsync(async (t, ct) => !await repo.TitleExistsAsync(t, ct))
                        .WithMessage("Заголовок уже существует");
                }
            }

            builder.Services.AddValidatorsFromAssemblyContaining<CreateNoteValidator>();
            builder.Services.AddExceptionHandler<GlobalExceptionHandler>();
            builder.Services.AddProblemDetails(o => o.CustomizeProblemDetails = c =>
                c.ProblemDetails.Extensions["traceId"] = c.HttpContext.TraceIdentifier);

            // GlobalExceptionHandler: NotFoundException -> 404, ConflictException -> 409, иначе 500 без Detail

            ### notes.http
            POST {{host}}/api/notes
            Content-Type: application/json

            { "title": "", "text": "" }

            ###
            GET {{host}}/api/notes/99999
      - id: cs-09-06
        title: Аутентификация JWT
        minutes: 35
        xp: 45
        theory: |
          **Аутентификация** — кто вы (логин). **Авторизация** — что вам можно (роли, политики).

          ## JWT

          JSON Web Token — строка `header.payload.signature` (Base64Url). Payload содержит **claims**: `sub` (id), `name`, `role`, `exp` (срок). Подпись (HMAC/RSA) гарантирует, что токен не подделан. Payload **не зашифрован** — не кладите туда секреты.

          Поток: клиент шлёт логин/пароль → сервер проверяет и выдаёт токен → клиент шлёт `Authorization: Bearer <token>` в каждом запросе → сервер проверяет подпись и срок без обращения к БД.

          ## Настройка

          ```bash
          dotnet add package Microsoft.AspNetCore.Authentication.JwtBearer
          ```

          ```csharp
          var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(builder.Configuration["Jwt:Key"]!)); // ≥ 32 байт

          builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
              .AddJwtBearer(o => o.TokenValidationParameters = new()
              {
                  ValidateIssuer = true,   ValidIssuer = "shop-api",
                  ValidateAudience = true, ValidAudience = "shop-client",
                  ValidateLifetime = true, ClockSkew = TimeSpan.FromSeconds(30),
                  IssuerSigningKey = key
              });
          builder.Services.AddAuthorization(o =>
              o.AddPolicy("Adult", p => p.RequireClaim("age_verified", "true")));

          app.UseAuthentication();
          app.UseAuthorization();
          ```

          ## Выдача токена

          ```csharp
          app.MapPost("/auth/login", async (LoginDto dto, IUserService users) =>
          {
              var user = await users.CheckPasswordAsync(dto.Login, dto.Password);  // хеш BCrypt/PBKDF2!
              if (user is null) return Results.Unauthorized();

              Claim[] claims = [
                  new(JwtRegisteredClaimNames.Sub, user.Id.ToString()),
                  new(ClaimTypes.Name, user.Login),
                  new(ClaimTypes.Role, user.Role)
              ];
              var token = new JwtSecurityToken("shop-api", "shop-client", claims,
                  expires: DateTime.UtcNow.AddMinutes(15),
                  signingCredentials: new SigningCredentials(key, SecurityAlgorithms.HmacSha256));
              return Results.Ok(new { access_token = new JwtSecurityTokenHandler().WriteToken(token) });
          });
          ```

          ## Защита эндпоинтов

          ```csharp
          app.MapGet("/me", (ClaimsPrincipal u) => u.Identity!.Name).RequireAuthorization();
          app.MapDelete("/products/{id}", ...).RequireAuthorization(p => p.RequireRole("Admin"));

          [Authorize(Roles = "Admin")] public class AdminController : ControllerBase { }
          [AllowAnonymous] public IActionResult Health() => Ok();
          ```

          ## Безопасность

          - Короткий access token (5–15 мин) + **refresh token** (долгий, хранится в БД, одноразовый, можно отозвать).
          - Пароли — только хеш с солью (`PasswordHasher<T>`, BCrypt), никогда в открытом виде.
          - Ключ подписи — в секретах. HTTPS обязателен.
          - Для крупных систем — готовый Identity Provider (Keycloak, Auth0, Duende IdentityServer) и OpenID Connect.
        practice:
          - type: choice
            q: Зашифрован ли payload JWT?
            options: ["Да, всегда", "Нет, только подписан — прочитать может любой", "Только claim role", "Зависит от браузера"]
            answer: 1
          - type: order
            q: Расставьте шаги JWT-аутентификации
            lines:
              - Клиент отправляет логин и пароль
              - Сервер проверяет хеш пароля и выдаёт токен
              - Клиент сохраняет токен
              - Клиент шлёт Authorization Bearer в запросах
              - Сервер проверяет подпись и срок
          - type: fill
            q: Защитите эндпоинт
            code: |
              app.MapGet("/orders", GetOrders).___();
            answers: ["RequireAuthorization"]
          - type: choice
            q: Какой код вернуть, если токен отсутствует или просрочен?
            options: ["400", "401", "403", "404"]
            answer: 1
          - type: bug
            q: Какая строка — серьёзная уязвимость?
            code: |
              var user = await db.Users.FirstOrDefaultAsync(u => u.Login == dto.Login);
              if (user is null) return Results.Unauthorized();
              if (user.Password != dto.Password) return Results.Unauthorized();
              return Results.Ok(CreateToken(user));
            bugLine: 3
            fix: if (!hasher.Verify(dto.Password, user.PasswordHash)) ...
            explain: Пароли хранятся в открытом виде. Нужно хранить и сравнивать хеш (BCrypt/PBKDF2).
        homework:
          task: |
            Добавьте в API: регистрацию (`PasswordHasher<User>`), логин с выдачей access (15 мин) и refresh (7 дней, хранится в БД) токенов, эндпоинт `/auth/refresh` (ротация: старый refresh становится недействительным), `/me`, политику «только Admin» на удаление. Ключ — через user-secrets. Проверьте сценарии в .http-файле.
          checklist:
            - Пароль хранится только как хеш
            - Refresh-токен одноразовый
            - Удаление доступно только Admin (403 для остальных)
          solution: |
            app.MapPost("/auth/register", async (RegisterDto d, AppDb db, IPasswordHasher<User> h) =>
            {
                var u = new User { Login = d.Login, Role = "User" };
                u.PasswordHash = h.HashPassword(u, d.Password);
                db.Users.Add(u); await db.SaveChangesAsync();
                return Results.Created($"/users/{u.Id}", null);
            });

            app.MapPost("/auth/login", async (LoginDto d, AppDb db, IPasswordHasher<User> h, TokenService t) =>
            {
                var u = await db.Users.SingleOrDefaultAsync(x => x.Login == d.Login);
                if (u is null || h.VerifyHashedPassword(u, u.PasswordHash, d.Password) == PasswordVerificationResult.Failed)
                    return Results.Unauthorized();
                return Results.Ok(await t.IssueAsync(u));   // access + refresh (refresh сохранён в db.RefreshTokens)
            });

            app.MapPost("/auth/refresh", async (RefreshDto d, AppDb db, TokenService t) =>
            {
                var rt = await db.RefreshTokens.Include(r => r.User)
                    .SingleOrDefaultAsync(r => r.Token == d.RefreshToken && !r.Used && r.Expires > DateTime.UtcNow);
                if (rt is null) return Results.Unauthorized();
                rt.Used = true;
                return Results.Ok(await t.IssueAsync(rt.User));
            });

            app.MapGet("/me", (ClaimsPrincipal p) => new { p.Identity!.Name }).RequireAuthorization();
            app.MapDelete("/notes/{id}", DeleteNote).RequireAuthorization(p => p.RequireRole("Admin"));
