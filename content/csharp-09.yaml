      - id: cs-09-01
        title: HTTP и REST
        minutes: 25
        xp: 35
        theory: |
          ## HTTP за 2 минуты

          Клиент отправляет **запрос**, сервер возвращает **ответ**.

          ```
          POST /api/orders HTTP/1.1
          Host: shop.ru
          Content-Type: application/json
          Authorization: Bearer eyJhbGc...

          {"productId": 5, "qty": 2}
          ```

          ```
          HTTP/1.1 201 Created
          Location: /api/orders/42
          Content-Type: application/json

          {"id": 42, "status": "new"}
          ```

          ## Методы

          | Метод | Назначение | Идемпотентен | Безопасен |
          |---|---|---|---|
          | GET | получить | да | да |
          | POST | создать / действие | нет | нет |
          | PUT | заменить целиком | да | нет |
          | PATCH | изменить частично | нет* | нет |
          | DELETE | удалить | да | нет |

          **Идемпотентность** — повторный запрос не меняет результат (важно для ретраев).

          ## Коды ответов

          - **2xx** успех: `200 OK`, `201 Created`, `204 No Content`
          - **3xx** перенаправление: `301`, `302`, `304 Not Modified`
          - **4xx** ошибка клиента: `400 Bad Request`, `401 Unauthorized` (не аутентифицирован), `403 Forbidden` (нет прав), `404 Not Found`, `409 Conflict`, `422 Unprocessable Entity`, `429 Too Many Requests`
          - **5xx** ошибка сервера: `500`, `502 Bad Gateway`, `503 Service Unavailable`

          ## REST — стиль проектирования API

          - Ресурсы — существительные во множественном числе: `/api/products`, `/api/products/5/reviews`.
          - Действие задаёт метод, а не URL: ❌ `/getProducts`, `/deleteProduct?id=5` → ✅ `GET /products`, `DELETE /products/5`.
          - Фильтры, сортировка, пагинация — в query: `/products?category=tea&sort=-price&page=2&size=20`.
          - Stateless: каждый запрос содержит всё нужное (токен), сервер не хранит сессию.
          - Версионирование: `/api/v1/...` или заголовок.
          - Ошибки — единым форматом **ProblemDetails** (RFC 7807):

          ```json
          { "type": "...", "title": "Validation failed", "status": 400, "errors": { "Name": ["Обязательно"] } }
          ```

          ## Заголовки, которые надо знать

          `Content-Type`, `Accept`, `Authorization`, `Cache-Control`, `ETag`/`If-None-Match`, `Location`, CORS-заголовки `Access-Control-Allow-*`.

          > 💡 Тестируйте API через `.http`-файлы в Visual Studio/Rider, Postman или `curl -i`.
