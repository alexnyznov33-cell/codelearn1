            curl -i -X POST -H "Content-Type: application/json" -d '{"title":"x"}' https://jsonplaceholder.typicode.com/posts
      - id: cs-09-02
        title: Minimal API и контроллеры
        minutes: 35
        xp: 40
        theory: |
          ```bash
          dotnet new webapi -n Shop.Api        # шаблон с OpenAPI/Swagger
          dotnet run                           # https://localhost:5001/swagger
          ```

          ## Minimal API

          ```csharp
          var builder = WebApplication.CreateBuilder(args);
          builder.Services.AddSingleton<IProductStore, InMemoryProductStore>();
          builder.Services.AddEndpointsApiExplorer();
          builder.Services.AddSwaggerGen();
          var app = builder.Build();

          if (app.Environment.IsDevelopment()) { app.UseSwagger(); app.UseSwaggerUI(); }

          var products = app.MapGroup("/api/products").WithTags("Products");

          products.MapGet("/", (IProductStore s, int page = 1) => s.GetPage(page));

          products.MapGet("/{id:int}", (int id, IProductStore s) =>
              s.Find(id) is { } p ? Results.Ok(p) : Results.NotFound());

          products.MapPost("/", (CreateProductDto dto, IProductStore s) =>
          {
              var p = s.Add(dto);
              return Results.Created($"/api/products/{p.Id}", p);
          });

          products.MapDelete("/{id:int}", (int id, IProductStore s) =>
              s.Remove(id) ? Results.NoContent() : Results.NotFound());

          app.Run();

          public record CreateProductDto(string Name, decimal Price);
          ```

          Параметры привязываются автоматически: из маршрута (`{id}`), query (`?page=2`), тела (JSON для сложных типов), сервисов DI, а также `[FromHeader]`, `HttpContext`, `CancellationToken`.

          `TypedResults.Ok(p)` вместо `Results.Ok` даёт точные типы для OpenAPI и тестов.

          ## Контроллеры

          ```csharp
          builder.Services.AddControllers();
          app.MapControllers();

          [ApiController]
          [Route("api/[controller]")]
          public class OrdersController(IOrderService orders) : ControllerBase
          {
              [HttpGet("{id:int}")]
              [ProducesResponseType<OrderDto>(200)]
              [ProducesResponseType(404)]
              public async Task<ActionResult<OrderDto>> Get(int id, CancellationToken ct)
              {
                  var o = await orders.FindAsync(id, ct);
                  return o is null ? NotFound() : Ok(o);
              }

              [HttpPost]
              public async Task<IActionResult> Create(CreateOrderDto dto, CancellationToken ct)
              {
                  var id = await orders.CreateAsync(dto, ct);
                  return CreatedAtAction(nameof(Get), new { id }, null);
              }
          }
          ```

          `[ApiController]` включает автоматическую валидацию модели (400 с ProblemDetails) и привязку тела из JSON.

          ## Что выбрать

          Minimal API — меньше кода, быстрее, отлично для микросервисов. Контроллеры — привычная структура для больших проектов с фильтрами. Обе модели можно смешивать.

          > 💡 Никогда не отдавайте наружу сущности EF напрямую — используйте **DTO** (record). Иначе утекут лишние поля и появятся циклы при сериализации.
