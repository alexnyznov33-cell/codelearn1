        homework:
          task: |
            Иерархия сотрудников: `Employee` (name, baseSalary, `calculateSalary()`), `Manager` (бонус 20% + 5000 за каждого подчинённого, список подчинённых), `Developer` (уровень Junior/Middle/Senior — коэффициент), `final class Intern`. Метод `describe()` в наследниках расширяет родительский через super. Выведите зарплаты всех в списке.
          checklist:
            - Все конструкторы вызывают super(...)
            - Используется @Override
            - Intern нельзя наследовать
          solution: |
            import java.util.*;

            class Employee {
                protected final String name; protected final double baseSalary;
                Employee(String name, double baseSalary) { this.name = name; this.baseSalary = baseSalary; }
                double calculateSalary() { return baseSalary; }
                String describe() { return name + ": " + calculateSalary(); }
            }
            class Manager extends Employee {
                private final List<Employee> team = new ArrayList<>();
                Manager(String n, double s) { super(n, s); }
                void addToTeam(Employee e) { team.add(e); }
                @Override double calculateSalary() { return baseSalary * 1.2 + team.size() * 5000; }
                @Override String describe() { return super.describe() + " (команда: " + team.size() + ")"; }
            }
            class Developer extends Employee {
                private final String level;
                Developer(String n, double s, String level) { super(n, s); this.level = level; }
                @Override double calculateSalary() {
                    return baseSalary * switch (level) { case "Senior" -> 1.5; case "Middle" -> 1.2; default -> 1.0; };
                }
                @Override String describe() { return super.describe() + " [" + level + "]"; }
            }
            final class Intern extends Employee {
                Intern(String n, double s) { super(n, s); }
                @Override double calculateSalary() { return baseSalary * 0.5; }
            }
      - id: java-02-04
        title: Полиморфизм и переопределение
        minutes: 30
        xp: 35
        theory: |
          **Полиморфизм** — один интерфейс, много реализаций. Переменная родительского типа может ссылаться на объект наследника, а вызов метода выберет версию **реального типа объекта** (динамическая диспетчеризация). В Java все нестатические, не-private, не-final методы виртуальные по умолчанию.

          ```java
          List<Animal> zoo = List.of(new Dog("Рекс"), new Cat("Мурка"), new Animal("?"));
          for (Animal a : zoo) {
              System.out.println(a.sound());   // Гав, Мяу, ...
          }
          ```

          ## Переопределение (override) — правила

          - Та же сигнатура (имя + параметры).
          - Возвращаемый тип — тот же или подтип (ковариантный возврат).
          - Доступ — не уже, чем у родителя (`public` нельзя сделать `protected`).
          - Нельзя бросать новые/более широкие checked-исключения.
          - **Всегда** ставьте `@Override` — компилятор проверит, что вы действительно переопределяете.

          ## Перегрузка (overload) — не путать

          Методы с одним именем, но разными параметрами. Выбирается **на этапе компиляции** по статическим типам аргументов.

          ```java
          void print(Object o) { System.out.println("Object"); }
          void print(String s) { System.out.println("String"); }

          Object x = "hello";
          print(x);        // Object — выбор по типу переменной, а не значения!
          ```

          ## Статические методы не переопределяются

          ```java
          class A { static String hi() { return "A"; } }
          class B extends A { static String hi() { return "B"; } }   // это сокрытие (hiding)
          A obj = new B();
          obj.hi();        // "A" — вызов по типу переменной
          ```

          Поля тоже не полиморфны: `obj.field` берётся по типу переменной.

          ## Upcasting и downcasting

          ```java
          Animal a = new Dog("Рекс");   // upcast — автоматически
          Dog d = (Dog) a;              // downcast — явно; ClassCastException, если не Dog
          if (a instanceof Dog dog) dog.fetch();   // безопасно
          ```

          ## Полиморфизм на практике

          Код, работающий с абстракцией, не меняется при добавлении новых типов:

          ```java
          double totalArea(List<? extends Shape> shapes) {
              double sum = 0;
              for (Shape s : shapes) sum += s.area();
              return sum;
          }
          ```

          > ⚠️ Не вызывайте переопределяемые методы из конструктора: метод наследника выполнится до инициализации его полей.
        practice:
          - type: output
