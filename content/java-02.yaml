        homework:
          task: |
            Создайте класс `Book` (title, author, year, pages) с тремя конструкторами (полный, без pages → 0, только title → "Неизвестен", текущий год), методами `isOld()` (старше 50 лет) и `info()`. Создайте массив из 5 книг и выведите информацию о старых.
          checklist:
            - Конструкторы вызывают друг друга через this(...)
            - Год берётся из java.time.Year.now()
            - Используется цикл for-each
          solution: |
            import java.time.Year;

            public class Book {
                String title, author;
                int year, pages;

                public Book(String title, String author, int year, int pages) {
                    this.title = title; this.author = author; this.year = year; this.pages = pages;
                }
                public Book(String title, String author, int year) { this(title, author, year, 0); }
                public Book(String title) { this(title, "Неизвестен", Year.now().getValue()); }

                boolean isOld() { return Year.now().getValue() - year > 50; }
                String info() { return "«" + title + "», " + author + ", " + year + (pages > 0 ? ", " + pages + " стр." : ""); }

                public static void main(String[] args) {
                    Book[] books = {
                        new Book("Мастер и Маргарита", "Булгаков", 1967, 480),
                        new Book("Гарри Поттер", "Роулинг", 1997),
                        new Book("Черновик"),
                        new Book("Война и мир", "Толстой", 1869, 1300),
                        new Book("Чистый код", "Мартин", 2008, 464)
                    };
                    for (Book b : books) if (b.isOld()) System.out.println(b.info());
                }
            }
      - id: java-02-02
        title: Инкапсуляция, геттеры и сеттеры
        minutes: 25
        xp: 30
        theory: |
          **Инкапсуляция** — скрываем поля (`private`) и даём доступ через методы, которые соблюдают правила (инварианты).

          ```java
          public class BankAccount {
              private final String owner;      // final — присваивается один раз
              private double balance;

              public BankAccount(String owner) {
                  this.owner = Objects.requireNonNull(owner);
              }

              public String getOwner() { return owner; }       // геттер
              public double getBalance() { return balance; }
              // сеттера для balance нет — менять только через операции

              public void deposit(double sum) {
                  if (sum <= 0) throw new IllegalArgumentException("Сумма должна быть > 0");
                  balance += sum;
              }

              public boolean withdraw(double sum) {
                  if (sum > balance) return false;
                  balance -= sum;
                  return true;
              }
          }
          ```

          ## Модификаторы доступа

          | Модификатор | Класс | Пакет | Наследник | Все |
          |---|---|---|---|---|
          | `private` | ✅ | | | |
          | (нет, package-private) | ✅ | ✅ | | |
          | `protected` | ✅ | ✅ | ✅ | |
          | `public` | ✅ | ✅ | ✅ | ✅ |

          ## Соглашения JavaBeans

          `getName()` / `setName(...)`, для boolean — `isActive()`. Многие фреймворки (Spring, Jackson, Hibernate) используют эти имена через рефлексию.

          ## Не генерируйте сеттеры бездумно

          Сеттер на каждое поле = публичное поле с лишним кодом. Давайте методы с бизнес-смыслом: `account.deposit(100)` вместо `account.setBalance(account.getBalance() + 100)`.

          ## Неизменяемые объекты

          ```java
          public final class Money {
              private final long amount;
              private final String currency;
              public Money(long amount, String currency) { this.amount = amount; this.currency = currency; }
              public Money add(Money o) { return new Money(amount + o.amount, currency); }  // новый объект
              public long getAmount() { return amount; }
          }
          ```

          Неизменяемые объекты потокобезопасны, их можно спокойно делиться и использовать как ключи `HashMap`. Пример из JDK — `String`, `LocalDate`, `BigDecimal`.

          ## Защитное копирование

          ```java
          private final List<String> tags;
          public Post(List<String> tags) { this.tags = List.copyOf(tags); }   // чтобы снаружи не изменили
          public List<String> getTags() { return tags; }                     // уже неизменяемый
          ```

          > 💡 Lombok (`@Getter`, `@Setter`, `@Value`) и `record` (урок 6) убирают шаблонный код.
