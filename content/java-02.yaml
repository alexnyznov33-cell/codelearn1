            options: ["Да", "Нет", "Только для static", "Только в одном пакете"]
            answer: 1
        homework:
          task: |
            Система оплаты: базовый класс `Payment` (amount, `fee()`, `process()` печатает итог), наследники `CardPayment` (комиссия 2%), `CryptoPayment` (фиксированная 50 + 1%), `CashPayment` (0). Обработайте список платежей полиморфно, посчитайте общую комиссию. Отдельно продемонстрируйте разницу между перегрузкой и переопределением методом `log(Payment)` / `log(CardPayment)`.
          checklist:
            - process() не содержит instanceof/switch по типам
            - Используется @Override
            - Показан пример выбора перегрузки по статическому типу
          solution: |
            import java.util.List;

            abstract class Payment {
                protected final double amount;
                Payment(double amount) { this.amount = amount; }
                abstract double fee();
                void process() { System.out.printf("%s: %.2f + комиссия %.2f%n", getClass().getSimpleName(), amount, fee()); }
            }
            class CardPayment extends Payment { CardPayment(double a) { super(a); } @Override double fee() { return amount * 0.02; } }
            class CryptoPayment extends Payment { CryptoPayment(double a) { super(a); } @Override double fee() { return 50 + amount * 0.01; } }
            class CashPayment extends Payment { CashPayment(double a) { super(a); } @Override double fee() { return 0; } }

            public class Main {
                static void log(Payment p) { System.out.println("общий лог"); }
                static void log(CardPayment p) { System.out.println("лог карты"); }

                public static void main(String[] args) {
                    List<Payment> list = List.of(new CardPayment(1000), new CryptoPayment(5000), new CashPayment(300));
                    double totalFee = 0;
                    for (Payment p : list) { p.process(); totalFee += p.fee(); }
                    System.out.println("Комиссия всего: " + totalFee);

                    Payment p = new CardPayment(100);
                    log(p);                       // "общий лог" — перегрузка по статическому типу
                    log(new CardPayment(100));    // "лог карты"
                }
            }
      - id: java-02-05
        title: Абстрактные классы и интерфейсы
        minutes: 30
        xp: 35
        theory: |
          ## Абстрактный класс

          ```java
          public abstract class Shape {
              private final String name;
              protected Shape(String name) { this.name = name; }

              public abstract double area();              // без тела — обязаны реализовать

              public String describe() {                  // общий код
                  return name + ": " + String.format("%.2f", area());
              }
          }

          public class Circle extends Shape {
              private final double r;
              public Circle(double r) { super("Круг"); this.r = r; }
              @Override public double area() { return Math.PI * r * r; }
          }

          // new Shape("x");   // ❌ нельзя создать
          ```

          ## Интерфейс

          Контракт без состояния. Класс может реализовать **много** интерфейсов.

          ```java
          public interface Payable {
              double amount();                                  // public abstract по умолчанию
              default String info() { return "К оплате: " + amount(); }   // метод по умолчанию (Java 8)
              static Payable of(double a) { return () -> a; }   // статический метод
              int MAX = 1_000_000;                              // public static final константа
          }

          public interface Printable { void print(); }

          public class Invoice implements Payable, Printable {
              private final double sum;
              public Invoice(double sum) { this.sum = sum; }
              @Override public double amount() { return sum; }
              @Override public void print() { System.out.println(info()); }
          }
          ```

          Интерфейс с одним абстрактным методом — **функциональный**, его можно реализовать лямбдой (`Payable p = () -> 100;`).

          Если два интерфейса дают `default`-метод с одним именем — класс обязан переопределить его явно (`Payable.super.info()`).

          ## Что выбрать

          | | abstract class | interface |
          |---|---|---|
          | Наследование | одно `extends` | много `implements` |
          | Состояние (поля) | да | только константы |
          | Конструкторы | да | нет |
          | Смысл | общая база, «является» | возможность, «умеет» |

          **Программируйте на уровне интерфейсов:**

          ```java
          List<String> names = new ArrayList<>();   // тип переменной — интерфейс
          Map<String, Integer> m = new HashMap<>();
          ```

          Тогда реализацию легко заменить (`LinkedList`, `TreeMap`), а в тестах — подставить мок.

          ## Стандартные интерфейсы

          `Comparable<T>`, `Comparator<T>`, `Iterable<T>`, `AutoCloseable`, `Runnable`, `Callable<V>`, `Serializable` (маркерный — без методов).
        practice:
          - type: choice
            q: Сколько интерфейсов может реализовать класс?
            options: ["Один", "Два", "Сколько угодно", "Ни одного, если есть extends"]
            answer: 2
          - type: fill
            q: Добавьте в интерфейс метод с реализацией по умолчанию
            code: |
              public interface Greeter {
                  String name();
                  ___ String greet() { return "Привет, " + name(); }
              }
            answers: ["default"]
          - type: output
            q: Что выведет код?
            code: |
              interface Size { int get(); default int twice() { return get() * 2; } }
              Size s = () -> 21;
              System.out.println(s.twice());
            answer: "42"
          - type: choice
            q: Какие модификаторы у поля `int MAX = 10;` в интерфейсе?
            options: ["private", "public static final", "protected", "Никаких"]
            answer: 1
          - type: bug
            q: Какая строка не скомпилируется?
            code: |
