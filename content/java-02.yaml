id: java
modules:
  - id: java-m2
    title: ООП в Java
    level: Junior
    lessons:
      - id: java-02-01
        title: Классы и объекты, конструкторы
        minutes: 25
        xp: 30
        theory: |
          В Java весь код живёт внутри классов. **Класс** описывает состояние (поля) и поведение (методы), **объект** создаётся через `new` и живёт в куче; переменная хранит ссылку.

          ```java
          public class Dog {
              String name;          // поля
              int age;

              public Dog(String name, int age) {   // конструктор
                  this.name = name;                // this — текущий объект
                  this.age = age;
              }

              public Dog(String name) {
                  this(name, 1);                   // вызов другого конструктора — первой строкой
              }

              void bark() {
                  System.out.println(name + ": Гав!");
              }
          }

          Dog rex = new Dog("Рекс", 3);
          Dog puppy = new Dog("Бим");
          rex.bark();
          var d = new Dog("Шарик");    // var — вывод типа (Java 10+)
          ```

          ## Правила

          - Если не объявлен ни один конструктор, компилятор создаёт пустой конструктор по умолчанию. Если объявлен хотя бы один — конструктора без параметров больше нет.
          - Поля по умолчанию: `0`, `false`, `null`. Локальные переменные — **не** инициализируются (ошибка компиляции при чтении).
          - Один публичный класс на файл, имя файла = имя класса (`Dog.java`).
          - Имена классов — `PascalCase`, методы и поля — `camelCase`, константы — `UPPER_SNAKE_CASE`.

          ## Ссылки

          ```java
          Dog a = new Dog("A", 1);
          Dog b = a;            // копируется ссылка
          b.age = 10;
          System.out.println(a.age);   // 10 — это один объект
          Dog c = null;
          c.bark();             // NullPointerException
          ```

          ## Передача параметров

          В Java всё передаётся **по значению**. Для объектов по значению передаётся ссылка: метод может изменить поля объекта, но не может заставить переменную вызывающего указывать на другой объект.

          ```java
          static void rename(Dog d) { d.name = "Новое"; }    // изменит объект
          static void replace(Dog d) { d = new Dog("X"); }   // снаружи ничего не изменится
          ```

          ## Блоки инициализации и порядок

          Поля с инициализаторами и блоки `{ ... }` выполняются перед телом конструктора. Статические блоки `static { ... }` — один раз при загрузке класса.
        practice:
