        homework:
          task: |
            Создайте класс `Student` с приватными полями name, group, список оценок. Валидация: имя не пустое, оценки 1–5. Методы: `addGrade(int)`, `getAverage()`, `getGrades()` (неизменяемая копия), `isExcellent()` (средний ≥ 4.5). Сделайте неизменяемый класс `StudentId` (код + год поступления) и используйте его в Student.
          checklist:
            - Все поля private
            - Невалидные данные → IllegalArgumentException
            - Список оценок нельзя изменить снаружи
          solution: |
            import java.util.*;

            public final class StudentId {
                private final String code; private final int year;
                public StudentId(String code, int year) { this.code = Objects.requireNonNull(code); this.year = year; }
                public String getCode() { return code; }
                public int getYear() { return year; }
            }

            public class Student {
                private final StudentId id;
                private final String name;
                private final List<Integer> grades = new ArrayList<>();

                public Student(StudentId id, String name) {
                    if (name == null || name.isBlank()) throw new IllegalArgumentException("Пустое имя");
                    this.id = id; this.name = name;
                }
                public void addGrade(int g) {
                    if (g < 1 || g > 5) throw new IllegalArgumentException("Оценка 1–5");
                    grades.add(g);
                }
                public double getAverage() { return grades.stream().mapToInt(Integer::intValue).average().orElse(0); }
                public List<Integer> getGrades() { return List.copyOf(grades); }
                public boolean isExcellent() { return getAverage() >= 4.5; }
                public String getName() { return name; }
                public StudentId getId() { return id; }
            }
      - id: java-02-03
        title: Наследование и super
        minutes: 30
        xp: 35
        theory: |
          Наследование: `class Dog extends Animal`. В Java **одиночное** наследование классов (один родитель), все классы неявно наследуют `java.lang.Object`.

          ```java
          public class Animal {
              protected String name;

              public Animal(String name) { this.name = name; }

              public String sound() { return "..."; }

              public String describe() { return name + " говорит " + sound(); }
          }

          public class Dog extends Animal {
              private final String breed;

              public Dog(String name, String breed) {
                  super(name);                 // вызов конструктора родителя — первой строкой
                  this.breed = breed;
              }

              @Override
              public String sound() { return "Гав"; }

              @Override
              public String describe() {
                  return super.describe() + " (порода " + breed + ")";   // вызов версии родителя
              }
          }
          ```

          ## Что наследуется

          - Все `public` и `protected` члены; package-private — если в том же пакете.
          - `private`-поля существуют в объекте, но недоступны напрямую.
          - Конструкторы **не** наследуются. Если родитель не имеет конструктора без параметров, наследник обязан вызвать `super(...)` явно.

          ## Порядок инициализации

          Сначала полностью создаётся родительская часть (конструктор `Object` → ... → `Animal`), потом наследник.

          ## final

          - `final class String` — от него нельзя наследоваться.
          - `final` метод — нельзя переопределить.

          ## sealed-классы (Java 17)

          Ограничивают, кто может наследоваться:

          ```java
          public sealed class Shape permits Circle, Square, Triangle { }
          public final class Circle extends Shape { }
          public non-sealed class Square extends Shape { }
          ```

          Полезно для pattern matching в `switch` (компилятор знает все варианты).

          ## Наследование vs композиция

          Наследование — сильная связь («является»). Если нужно лишь переиспользовать поведение — используйте **композицию** («имеет»):

          ```java
          class Car {
              private final Engine engine = new Engine();   // композиция
              void start() { engine.start(); }
          }
          ```

          Правило «Effective Java»: предпочитайте композицию наследованию.

          ## instanceof с шаблоном (Java 16)

          ```java
          if (animal instanceof Dog d) {
              System.out.println(d.getBreed());
          }
          ```
