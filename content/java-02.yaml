        homework:
          task: |
            Сделайте систему хранения: интерфейс `Storage<T>` (save, findById → Optional, findAll, delete), абстрактный класс `AbstractStorage<T>` с общей логикой (счётчик операций, логирование), реализации `InMemoryStorage` (HashMap) и `FileStorage` (каждый объект — строка в файле). Клиентский класс `UserService` зависит только от интерфейса. Покажите замену реализации одной строкой.
          checklist:
            - UserService не знает о конкретной реализации
            - Общий код — в абстрактном классе
            - Используется Optional
          solution: |
            import java.util.*;

            interface Identifiable { long id(); }

            interface Storage<T extends Identifiable> {
                void save(T item);
                Optional<T> findById(long id);
                List<T> findAll();
                boolean delete(long id);
            }

            abstract class AbstractStorage<T extends Identifiable> implements Storage<T> {
                protected int ops;
                protected void log(String op) { ops++; System.out.println("[" + getClass().getSimpleName() + "] " + op + " #" + ops); }
            }

            class InMemoryStorage<T extends Identifiable> extends AbstractStorage<T> {
                private final Map<Long, T> data = new HashMap<>();
                public void save(T item) { log("save"); data.put(item.id(), item); }
                public Optional<T> findById(long id) { log("find"); return Optional.ofNullable(data.get(id)); }
                public List<T> findAll() { log("findAll"); return List.copyOf(data.values()); }
                public boolean delete(long id) { log("delete"); return data.remove(id) != null; }
            }

            record User(long id, String name) implements Identifiable { }

            class UserService {
                private final Storage<User> storage;
                UserService(Storage<User> storage) { this.storage = storage; }
                void register(long id, String name) { storage.save(new User(id, name)); }
                String nameOf(long id) { return storage.findById(id).map(User::name).orElse("не найден"); }
            }

            // var service = new UserService(new InMemoryStorage<>());   // или new FileStorage<>("users.txt")
      - id: java-02-06
        title: static, final, enum, record
        minutes: 30
        xp: 35
        theory: |
          ## static

          Статические члены принадлежат классу, а не объекту.

          ```java
          public class Counter {
              private static int created = 0;          // общий для всех экземпляров
              public static final double VAT = 0.2;    // константа
              public Counter() { created++; }
              public static int getCreated() { return created; }
          }
          Counter.getCreated();
          Math.max(1, 2);   // утилитные классы
          ```

          Из static-метода нет доступа к `this` и полям экземпляра. Статический вложенный класс (`static class Node`) не держит ссылку на внешний объект — предпочитайте его обычному вложенному.

          ## final

          - **переменная** — нельзя переприсвоить (`final List<String> l` — сам список менять можно!);
          - **метод** — нельзя переопределить;
          - **класс** — нельзя наследовать.

          ## enum

          Перечисление — полноценный класс с фиксированным набором экземпляров.

          ```java
          public enum Status {
              NEW("Новый"), PAID("Оплачен"), SHIPPED("Отправлен");

              private final String title;
              Status(String title) { this.title = title; }
              public String title() { return title; }

              public Status next() {
                  return values()[(ordinal() + 1) % values().length];
              }
          }

          Status s = Status.valueOf("PAID");
          System.out.println(s.title() + " " + s.ordinal() + " " + s.name());   // Оплачен 1 PAID
          switch (s) {
              case NEW -> System.out.println("ждём оплату");
              case PAID, SHIPPED -> System.out.println("в работе");
          }
          ```

          `EnumMap` и `EnumSet` — очень быстрые коллекции для ключей-enum. Enum сравнивают через `==`.

          ## record (Java 16)

          Неизменяемый класс-носитель данных в одну строку: компилятор генерирует конструктор, геттеры (`name()`, без `get`), `equals`, `hashCode`, `toString`.

          ```java
          public record Point(int x, int y) {
              public Point {                                   // компактный конструктор — валидация
                  if (x < 0 || y < 0) throw new IllegalArgumentException();
              }
              public double dist() { return Math.sqrt(x * x + y * y); }
              public static Point origin() { return new Point(0, 0); }
          }

          var p = new Point(3, 4);
          System.out.println(p.x() + " " + p.dist());   // 3 5.0
          System.out.println(p);                       // Point[x=3, y=4]
          System.out.println(p.equals(new Point(3, 4))); // true
          ```

          record не может наследовать классы (неявно `extends Record`), но может реализовывать интерфейсы. Идеально для DTO, ключей, результатов.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              enum Size { S, M, L }
              System.out.println(Size.L.ordinal() + " " + Size.valueOf("M"));
            answer: 2 M
          - type: output
            q: Что выведет код?
            code: |
              record P(int x, int y) {}
              System.out.println(new P(1, 2));
            answer: P[x=1, y=2]
          - type: output
            q: Что выведет код?
            code: |
              record P(int x) {}
              System.out.println(new P(5).equals(new P(5)) + " " + (new P(5) == new P(5)));
            answer: true false
          - type: choice
            q: Можно ли добавить элемент в `final List<String> list = new ArrayList<>();`?
            options: ["Нет, final", "Да — final запрещает переприсвоение ссылки, а не изменение объекта", "Только в конструкторе", "Только через static"]
            answer: 1
          - type: fill
            q: Обратитесь к компоненту record
            code: |
              record User(String name) {}
              String n = user.___();
            answers: ["name"]
        homework:
          task: |
            Опишите доставку: `enum DeliveryType` (COURIER, POST, PICKUP) с ценой и сроком в днях и методом `cost(double weight)`; `record Address(String city, String street)` с валидацией в компактном конструкторе; `record Order(long id, Address to, DeliveryType type, double weight)`. Утилитный класс `Orders` (final, приватный конструктор) со статическими методами `totalCost(List<Order>)` и `groupByType(List<Order>)` → `EnumMap`.
          checklist:
            - У enum есть поля и конструктор
            - Валидация в компактном конструкторе
            - Утилитный класс нельзя инстанцировать
          solution: |
            import java.util.*;

            enum DeliveryType {
                COURIER(300, 1), POST(150, 7), PICKUP(0, 0);
                private final double base; private final int days;
                DeliveryType(double base, int days) { this.base = base; this.days = days; }
                double cost(double kg) { return this == PICKUP ? 0 : base + kg * 30; }
                int days() { return days; }
            }

            record Address(String city, String street) {
                Address {
                    if (city == null || city.isBlank()) throw new IllegalArgumentException("Город обязателен");
                }
            }

            record Order(long id, Address to, DeliveryType type, double weight) { }

            final class Orders {
                private Orders() { }
                static double totalCost(List<Order> list) {
                    double s = 0;
                    for (Order o : list) s += o.type().cost(o.weight());
                    return s;
                }
                static Map<DeliveryType, List<Order>> groupByType(List<Order> list) {
                    Map<DeliveryType, List<Order>> m = new EnumMap<>(DeliveryType.class);
                    for (Order o : list) m.computeIfAbsent(o.type(), k -> new ArrayList<>()).add(o);
                    return m;
                }
            }
      - id: java-02-07
        title: equals, hashCode, toString
        minutes: 30
        xp: 35
        theory: |
          Три метода `Object`, которые нужно понимать каждому Java-разработчику.

          ## toString

          По умолчанию: `User@1b6d3586` (класс + хеш). Переопределяйте для логов и отладки.

          ## == vs equals

          - `==` для объектов сравнивает **ссылки** (тот же ли это объект).
          - `equals` — логическое равенство. По умолчанию в `Object` — тоже ссылки.

          ```java
          String a = new String("hi"), b = new String("hi");
          a == b;          // false
          a.equals(b);     // true — String переопределяет equals
          Integer x = 127, y = 127;  x == y;   // true (кеш -128..127)
          Integer p = 128, q = 128;  p == q;   // false! Всегда сравнивайте обёртки через equals
          ```

          ## Правильная реализация

          ```java
          public final class Point {
              private final int x, y;
              public Point(int x, int y) { this.x = x; this.y = y; }

              @Override
              public boolean equals(Object o) {
                  if (this == o) return true;
                  if (!(o instanceof Point p)) return false;     // и проверка на null
                  return x == p.x && y == p.y;
              }

              @Override
              public int hashCode() {
                  return Objects.hash(x, y);
              }

              @Override
              public String toString() { return "Point(" + x + ", " + y + ")"; }
          }
          ```

          ## Контракт

          **equals**: рефлексивность (`a.equals(a)`), симметричность, транзитивность, согласованность, `a.equals(null) == false`.

          **hashCode**: если `a.equals(b)`, то `a.hashCode() == b.hashCode()` — **обязательно**. Переопределили equals — переопределите hashCode. Иначе `HashMap`/`HashSet` перестанут находить объекты:

          ```java
          Set<Point> set = new HashSet<>();
          set.add(new Point(1, 2));
          set.contains(new Point(1, 2));   // false, если hashCode не переопределён!
          ```

          ## Изменяемые ключи

          Если поле, участвующее в hashCode, изменилось после добавления в `HashSet`, объект «потеряется» в своей корзине. Ключи должны быть неизменяемыми.

          ## Наследование и equals

          Добавление полей в наследнике ломает симметричность. Решения: `final`-классы, `getClass() != o.getClass()` вместо instanceof, композиция.

          ## Проще всего

          `record` генерирует корректные `equals`/`hashCode`/`toString`. IDE (Alt+Insert в IntelliJ) и Lombok `@EqualsAndHashCode` — тоже.

          `compareTo` (Comparable) желательно делать согласованным с equals.
        practice:
          - type: output
            q: Что выведет код?
            code: |
              String a = new String("java");
              String b = new String("java");
              System.out.println((a == b) + " " + a.equals(b));
            answer: false true
          - type: output
            q: Что выведет код?
            code: |
              Integer a = 1000, b = 1000;
              System.out.println(a == b);
            answer: "false"
            explain: Кешируются только значения от -128 до 127.
          - type: choice
            q: Что обязательно сделать, переопределив equals?
            options: ["Переопределить toString", "Переопределить hashCode", "Сделать класс abstract", "Ничего"]
            answer: 1
          - type: fill
            q: Сгенерируйте хеш из нескольких полей
            code: |
              return Objects.___(id, name);
            answers: ["hash"]
          - type: bug
            q: Из-за какой строки set.contains(new Tag("java")) вернёт false?
            code: |
              class Tag {
                  final String name;
                  Tag(String n) { name = n; }
                  @Override public boolean equals(Object o) {
                      return o instanceof Tag t && t.name.equals(name);
                  }
              }
            bugLine: 6
            fix: добавить @Override public int hashCode() { return name.hashCode(); }
            explain: hashCode не переопределён — равные объекты попадают в разные корзины HashSet.
        homework:
          task: |
            Класс `Email` (адрес сравнивается без учёта регистра и пробелов по краям). Реализуйте `equals`, `hashCode`, `toString`, сделайте класс неизменяемым и `final`. Напишите проверки (в main через `assert` или вывод) всех свойств контракта equals и работы в `HashSet`/`HashMap`. Затем покажите баг с изменяемым ключом на отдельном классе `MutableKey`.
          checklist:
            - Нормализация в конструкторе
            - Контракт equals/hashCode соблюдён
            - Продемонстрирован «потерянный» изменяемый ключ
          solution: |
            import java.util.*;

            public final class Email {
                private final String value;
                public Email(String raw) { this.value = Objects.requireNonNull(raw).trim().toLowerCase(Locale.ROOT); }
                @Override public boolean equals(Object o) { return this == o || (o instanceof Email e && value.equals(e.value)); }
                @Override public int hashCode() { return value.hashCode(); }
                @Override public String toString() { return value; }

                public static void main(String[] args) {
                    Email a = new Email(" Anya@Mail.ru "), b = new Email("anya@mail.ru"), c = new Email("ANYA@mail.RU");
                    System.out.println(a.equals(a));                                  // рефлексивность
                    System.out.println(a.equals(b) && b.equals(a));                   // симметричность
                    System.out.println(a.equals(b) && b.equals(c) && a.equals(c));    // транзитивность
                    System.out.println(!a.equals(null));
                    System.out.println(new HashSet<>(List.of(a)).contains(c));       // true

                    class MutableKey { int v; MutableKey(int v) { this.v = v; }
                        public boolean equals(Object o) { return o instanceof MutableKey k && k.v == v; }
                        public int hashCode() { return v; } }
                    var k = new MutableKey(1);
                    Set<MutableKey> set = new HashSet<>(Set.of(k));
                    k.v = 2;
                    System.out.println(set.contains(k));   // false — ключ «потерян»
                }
            }
