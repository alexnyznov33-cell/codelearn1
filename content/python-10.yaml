      - id: py-10-01
        title: SQL-основы и sqlite3
        minutes: 30
        xp: 35
        theory: |
          **Реляционная БД** хранит данные в таблицах (строки и столбцы), связанных ключами. Язык запросов — **SQL**. SQLite встроена в Python — сервер не нужен.

          ## Основные команды SQL

          ```sql
          CREATE TABLE users (
              id INTEGER PRIMARY KEY,
              name TEXT NOT NULL,
              email TEXT UNIQUE,
              age INTEGER
          );
          INSERT INTO users (name, email, age) VALUES ('Аня', 'a@x.ru', 25);
          SELECT name, age FROM users WHERE age > 18 ORDER BY age DESC LIMIT 10;
          UPDATE users SET age = 26 WHERE id = 1;
          DELETE FROM users WHERE id = 1;
          SELECT city, COUNT(*), AVG(age) FROM users GROUP BY city HAVING COUNT(*) > 5;
          ```

          ## JOIN — соединение таблиц

          ```sql
          SELECT u.name, o.total
          FROM orders o
          JOIN users u ON u.id = o.user_id        -- INNER: только совпадения
          LEFT JOIN payments p ON p.order_id = o.id;  -- LEFT: все заказы, даже без оплаты
          ```

          ## sqlite3 в Python

          ```python
          import sqlite3

          with sqlite3.connect("shop.db") as conn:      # коммит при выходе без ошибок
              conn.row_factory = sqlite3.Row             # доступ к полям по имени
              conn.execute("CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, name TEXT)")
              conn.execute("INSERT INTO users (name) VALUES (?)", ("Аня",))
              conn.executemany("INSERT INTO users (name) VALUES (?)", [("Боб",), ("Вика",)])
              for row in conn.execute("SELECT id, name FROM users WHERE name LIKE ?", ("%а%",)):
                  print(row["id"], row["name"])
          ```

          ## ⚠️ SQL-инъекции

          ```python
          # ❌ НИКОГДА: пользователь введёт  ' OR 1=1 --
          conn.execute(f"SELECT * FROM users WHERE name = '{name}'")
          # ✅ параметры — драйвер экранирует сам
          conn.execute("SELECT * FROM users WHERE name = ?", (name,))
          ```
        practice:
          - type: choice
            q: Какой JOIN вернёт все заказы, даже без найденного пользователя?
            options: ["INNER JOIN", "LEFT JOIN orders → users", "CROSS JOIN", "Никакой"]
            answer: 1
          - type: fill
            q: Безопасный запрос с параметром
            code: |
              cur = conn.execute("SELECT * FROM users WHERE email = ___", (email,))
            answers: ["?"]
          - type: choice
